ă la cuptor cu mere și vin reinterpretează într-o variantă\nlight un preparat tradițional, păstrând combinația clasică de carne\nfragedă și arome fructate specifice bucătăriei românești.","pasi":"1. Taie pieptul de rață în 4 bucăți egale. Condimentează cu sare,\npiper, rozmarin și cimbru.\n2. Încinge uleiul într-o tigaie și sigilează bucățile de rață 2–3\nminute pe fiecare parte.\n3. Pune ceapa, morcovii și merele feliate la baza unei tăvi.\n4. Așază bucățile de rață peste legume.\n5.Toarnă vinul alb + apa fierbinte + usturoiul zdrobit.\n6. Acoperă cu folie și gătește 90 minute la 180°C.\n7.Scoate folia și mai lasă 15–20 minute, până se rumenește frumos\nși scade sosul.\n8. Amestecă ușor merele și legumele în sos, apoi porționează în 4\nfarfurii.","sfaturi":"Merge excelent cu varză roșie sotată, fără să urce caloriile.\nPentru un sos mai dens, lasă ultimele 5 minute cu ușa cuptorului\nîntredeschisă.\nMerele Golden oferă dulceață naturală — nu ai nevoie de\nzahăr/îndulcitor.","alergeni":"Nu conține alergeni majori. Verifică vinul (rare urme de sulfiți – informație utilă pentru persoanele sensibile)","variante":"Fără vin: Înlocuiește cu 120 ml supă clară de legume + 10 ml suc de lămâie — gust identic, calorii identice","macro":{"calorii_macro":"301.9","proteine":"32 g","carbohidrati":"8.2 g","fibre":"0.5 g","grasimi":"6.5 g","grasimi_saturate":"1.5 g"}},{"id":"sarbatori-304","titlu":"Rasol de Vită","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":304,"portii":"2","timp_minute":90,"calorii":241,"ingrediente":["270 g carne de vită cu os (rasol / pulpă slabă)","160 g cartofi","55 g morcovi","40 g țelină","40 g ceapă","30 g păstârnac","Sare, piper boabe, foi de dafin – după gust"],"descriere":"O rețetă tradițională, gustoasă și sănătoasă, preparată lent, fără\nprăjeli. Carnea devine fragedă, iar legumele păstrează textura și\naromele naturale.","pasi":"1.Pune carnea de vită în apă rece, adaugă sare și fierbe la foc\nmic, îndepărtând spuma formată.\n2.După 45–50 minute, adaugă legumele curățate și tăiate mare.\n3.Lasă la fiert încă 30–40 minute, până ce carnea devine\nfragedă.\n4.Servește cu legume fierte și hrean ras cu oțet.","sfaturi":"Supa rămasă se poate strecura și folosi ca ciorbă limpede.\nMerge excelent cu salată de sfeclă cu hrean alături.\nPoți adăuga și dovlecei sau fasole verde spre final, pentru mai\nmulte fibre.","alergeni":"țelină","variante":"în loc de vită, poți folosi curcan sau pui pentru o variantă mai slabă în grăsimi.","macro":{"calorii_macro":"241","proteine":"32.5 g","carbohidrati":"15.4 g","fibre":"2.4 g","grasimi":"1.4 g","grasimi_saturate":"0.5 g"}},{"id":"sarbatori-305","titlu":"Ardei Umpluți cu Pui la Cuptor","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":305,"portii":"2","timp_minute":60,"calorii":198,"ingrediente":["80 g ardei roșu","170 g pulpă de pui","20 g orez alb","60 g ceapă roșie","4 g usturoi (≈ 1 cățel mic)","40 g sos de roșii fără zahăr adăugat","10 g cașcaval ras","2 g mărar verde","2 g piper negru","2 g boia de ardei","1 g cimbru uscat","4 g sare","2 ml ulei de măsline"],"descriere":"O variantă ușoară și echilibrată a clasicilor ardei umpluți, bogată în\nproteine și arome, potrivită pentru prânzuri sănătoase.","pasi":"1.Taie capacul ardeilor și curăță-i de semințe.\n2.Toacă ceapa și usturoiul, apoi călește-le ușor în uleiul de măsline\n2–3 minute.\n3.Adaugă pulpa de pui tocată, orezul spălat și condimentele\n(boia, cimbru, sare, piper), apoi amestecă bine.\n4.Încorporează sosul de roșii și gătește 5–6 minute până se leagă\ncompoziția.\n5.Umple ardeii cu amestecul de pui și așază-i într-o tavă\ntapetată.\n6.Toarnă puțină apă în tavă, acoperă cu folie și coace 30 de\nminute la 190°C.\n7.Îndepărtează folia, presară cașcavalul și mai coace 10 minute\npentru gratinare.\n8.Servește cu mărar verde proaspăt deasupra.","sfaturi":"Poți adăuga și morcov ras sau dovlecel tocat fin în compoziție.\nSe servesc cu iaurt grecesc 2% sau o salată verde proaspătă.\nDacă vrei să reduci grăsimile, folosește doar piept de pui.","alergeni":"lactoză (din cașcaval), posibil gluten (din sosuri procesate, dacă nu sunt simple)","variante":"pentru o rețetă fără lactate, elimină cașcavalul sau folosește o alternativă vegetală light.","macro":{"calorii_macro":"197.5","proteine":"19.4 g","carbohidrati":"14.9 g","fibre":"1.5 g","grasimi":"5.6 g","grasimi_saturate":"1.8 g"}},{"id":"sarbatori-306","titlu":"Ciorbă de Burtă","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":306,"portii":"2","timp_minute":240,"calorii":326,"ingrediente":["160 g burtă de vită prefiartă","100 g oase de vită cu măduvă","40 g morcovi","20 g țelină","20 g ceapă","4 g usturoi","1 gălbenuș (≈ 20 g)","40 g smântână light (12% grăsime)","6 ml oțet","4 ml ulei de măsline","Sare, piper – după gust"],"descriere":"O ciorbă cremoasă și aromată, perfect echilibrată, cu gust clasic și\ntextură fină.","pasi":"1.Fierbe oasele 2–3 ore pentru supa de bază.\n2.Adaugă morcovul, țelina și ceapa, apoi fierbe până se înmoaie.\n3.Pune burta tăiată și mai lasă să fiarbă 20–30 minute.\n4.Amestecă smântâna cu gălbenușurile și puțin lichid fierbinte,\napoi încorporează în oală.\n5.Adaugă usturoi, oțet, ulei și condimente.","sfaturi":"Se servește tradițional cu ardei iute și oțet suplimentar.\nPentru un gust mai intens, poți adăuga și foi de dafin și piper\nboabe la fierbere.\nDacă vrei o textură mai cremoasă, folosește blender vertical\npentru a pasa câțiva morcovi fierți și a-i adăuga înapoi în\nciorbă.","alergeni":"ou, lactoză (smântână), țelină","variante":"poți face o versiune mai dietetică folosind iaurt grecesc 2% în loc de smântână.","macro":{"calorii_macro":"326","proteine":"2.4 g","carbohidrati":"3.1 g","fibre":"0.7 g","grasimi":"7.2 g","grasimi_saturate":"3 g"}},{"id":"sarbatori-307","titlu":"Ciorbă de Văcuță","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":307,"portii":"2","timp_minute":70,"calorii":106,"ingrediente":["100 g pulpă de vită crudă","70 g cartofi albi","50 g morcovi","20 g țelină","12 g ceapă","20 g sos de roșii fără zahăr adăugat","2 ml ulei de măsline","500 ml apă","Sare, piper, pătrunjel proaspăt – după"],"descriere":"O ciorbă ușoară, aromată și hrănitoare, ideală pentru un prânz\nechilibrat.","pasi":"1.Fierbe carnea de vită până se înmoaie și se formează supa.\n2.Adaugă legumele tocate și continuă gătirea până devin\nfragede.\n3.Pune sosul de roșii, uleiul și condimentele.\n4.La final, presară pătrunjel proaspăt.","sfaturi":"Poți adăuga și borș acru sau zeamă de lămâie pentru o\nvariantă mai acrișoară.\nPentru extra aromă, pune și foi de dafin sau piper boabe.\nSe servește excelent cu ardei iute murat.","alergeni":"țelină","variante":"înlocuiește cartofii cu dovlecel sau conopidă pentru mai puțini carbohidrați.","macro":{"calorii_macro":"106","proteine":"12.3 g","carbohidrati":"8.5 g","fibre":"1.2 g","grasimi":"1.6 g","grasimi_saturate":"0.5 g"}},{"id":"sarbatori-308","titlu":"Ciorbă Țărănească de Legume","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":308,"portii":"2","timp_minute":70,"calorii":108,"ingrediente":["100 g cartofi","65 g morcovi","30 g țelină","55 g dovlecel","55 g fasole verde","36 g ardei gras","36 g ceapă","75 g roșii cuburi","150 ml borș","5 ml ulei de măsline","11 g pătrunjel și leuștean verde","Sare, piper – după gust"],"descriere":"O ciorbă ușoară, plină de legume și aromată, perfectă pentru o\nmasă sănătoasă și sățioasă.","pasi":"1.Adaugă în apă ceapa, morcovul, țelina și cartofii tăiați cuburi și\nfierbe până se înmoaie.\n2.Pune dovlecelul, fasolea verde și ardeiul gras și mai fierbe\ncâteva minute.\n3.Adaugă roșiile, borșul, uleiul și condimentele.\n4.La final, pune verdețurile proaspete.","sfaturi":"Poți adăuga și conopidă sau mazăre verde pentru mai multă\nvarietate.\nDacă vrei un gust mai intens, pune și cimbru sau busuioc în timpul\nfierberii.\nSe servește excelent cu ardei iute murat sau o felie de pâine\nintegrală.","alergeni":"țelină","variante":"pentru extra proteine, poți adăuga 100 g năut fiert sau linte la final.","macro":{"calorii_macro":"108","proteine":"1.9 g","carbohidrati":"15.7 g","fibre":"3.2 g","grasimi":"2.6 g","grasimi_saturate":"0.4 g"}},{"id":"sarbatori-309","titlu":"Balmoș","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":309,"portii":"2","timp_minute":30,"calorii":247,"ingrediente":["65 g mălai fin","250 ml lapte degresat","30 g iaurt grecesc 2%","25 g telemea light","20 g caș afumat light (sau telemea degresată)","4 g unt light","2 g sare"],"descriere":"O variantă light și gustoasă a preparatului tradițional, cremos, sățios\nși ușor de preparat.","pasi":"1.Fierbe laptele cu sarea.\n2. Adaugă mălaiul în ploaie și amestecă până se îngroașă.\n3.Încorporează iaurtul, telemeaua și cașul, continuând să\namesteci la foc mic.\n4.Adaugă untul la final\n5. Mai lasă 1 minut pe foc până devine cremos.","sfaturi":"Pentru mai multă aromă, adaugă mărar verde sau ceapă verde\ntocată la final.\nDacă vrei o variantă mai proteică, poți încorpora 50 g brânză\ncottage slabă.\nMerge perfect alături de murături light sau o salată verde.","alergeni":"lactoză, gluten (din mălai, în funcție de procesare)","variante":"în loc de unt, poți folosi 10 ml ulei de măsline extravirgin – mai sănătos pentru inimă.","macro":{"calorii_macro":"247","proteine":"9.8 g","carbohidrati":"31 g","fibre":"0.35 g","grasimi":"5.1 g","grasimi_saturate":"2.6 g"}},{"id":"sarbatori-310","titlu":"Cartofi Țărănești","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":310,"portii":"2","timp_minute":40,"calorii":263,"ingrediente":["470 g cartofi","90 g ceapă","5 g usturoi (≈ 2 căței)","18 ml ulei de măsline","½ linguriță boia dulce","Sare, piper – după gust","9 g pătrunjel verde"],"descriere":"O garnitură sățioasă și aromată, cu gust clasic românesc, ideală\nlângă orice tip de carne.","pasi":"1.Fierbe cartofii în coajă, apoi curăță-i și taie-i cuburi.\n2.Călește ceapa în ulei până devine aurie.\n3.Adaugă usturoiul, boiaua și cartofii și amestecă ușor până se\nrumenesc.\n4.Potrivește de sare și piper și presară pătrunjelul tocat.","sfaturi":"Pentru o variantă mai ușoară, folosește spray de gătit în loc de\nulei sau doar 15 ml ulei + puțină apă.\nSe pot adăuga și ardei copți sau ciuperci sotate pentru un plus\nde gust.\nSunt delicioși ca fel de bază vegetarian sau ca garnitură la\ncarne la grătar.","alergeni":"nu conține alergeni majori","variante":"Dacă ai sensibilitate la usturoi, îl poți înlocui cu aceeași cantitate de praz sotat sau ceapă verde, menținând aroma caracteristică și un aport caloric foarte apropiat.","macro":{"calorii_macro":"262.6","proteine":"3.1 g","carbohidrati":"35.5 g","fibre":"2.5 g","grasimi":"9 g","grasimi_saturate":"1.3 g"}},{"id":"sarbatori-312","titlu":"Cozonac Tradițional","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":312,"portii":"12","timp_minute":180,"calorii":375,"ingrediente":["Pentru aluat","600 g făină albă","250 ml lapte semi-degresat, călduț","120 g  ouă","20 g gălbenuș","50 g unt 65%, topit","20 g ulei de cocos","60 g zahăr brun","60 g îndulcitor pudră (eritritol/stevia)","1 linguriță coajă rasă de lămâie","1 linguriță coajă rasă de portocală","½ linguriță sare","10 g drojdie uscată (sau 25 g drojdie proaspătă)","Pentru umplutură"],"descriere":"O variantă mai ușoară și mai echilibrată a cozonacului clasic,\nperfectă pentru sărbători, fără să renunți la gustul autentic.","pasi":"1.Amestecă laptele călduț cu zahărul brun și drojdia. Lasă 10\nminute să se activeze.\n2.Într-un bol mare, pune făina, ouăle, gălbenușul, îndulcitorul\npudră, untul topit, uleiul, coaja de lămâie/portocală și sarea.\nAdaugă drojdia activată și frământă 10–12 minute.\n3.Lasă aluatul la dospit 60–90 minute într-un loc cald.\n4.Pregătește umplutura: amestecă nuca, cacaua, îndulcitorul,\nzahărul brun, albușurile, romul și laptele până obții o cremă\ngroasă.\n5.Împarte aluatul în două, întinde, adaugă crema, rulează și\nformează cozonacul.\n6.Pune în tavă și lasă 30–45 minute la dospit.\n7.Coace la 170°C timp de 45–50 minute până se rumenește.\n8.Lasă să se răcească complet înainte de tăiere.","sfaturi":"Dacă vrei mai puține grăsimi, redu untul la 30 g și suplimentezi\ncu 10 g ulei.\nPentru un gust mai intens, adaugă stafide hidratate în rom sau\nvanilie.\nPentru versiune și mai light: crești cantitatea de îndulcitor la 80\ng și scazi zahărul brun la 40 g.","alergeni":"gluten (făină), ouă, lactoză (lapte), nuci","variante":"fără lactate: folosește lapte vegetal (migdale, soia).","macro":{"calorii_macro":"375.2","proteine":"10.8 g","carbohidrati":"48.5 g","fibre":"1.8 g","grasimi":"14.1 g","grasimi_saturate":"3 g","greutate_portie":"120 g"}},{"id":"sarbatori-313","titlu":"Cozonac Light","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":313,"portii":"10","timp_minute":180,"calorii":228,"ingrediente":["Pentru aluat:","200 g făină albă","100 g făină integrală","15 g drojdie proaspătă (sau 5 g uscată)","150 ml lapte degresat","1 ou întreg + 1 albuș","20 g ulei de măsline light (sau floarea-soarelui)","30 g îndulcitor pudră (eritritol/stevia)","1 vârf de cuțit de sare coajă rasă de lămâie și portocală","Pentru umplutură:","80 g nucă măcinată,","10 g cacao,","15 g îndulcitor pudră esență de rom sau vanilie"],"descriere":"O variantă mai ușoară și mai echilibrată a cozonacului clasic,\nperfectă pentru sărbători, fără să renunți la gustul autentic.","pasi":"1.Amestecă făina albă cu făina integrală într-un bol încăpător.\n2.Încălzește ușor laptele (nu fierbinte) și dizolvă drojdia în el\nîmpreună cu îndulcitorul pudră. Lasă 10 minute până face\nspumă.\n3.Bate oul întreg împreună cu albușul și adaugă peste făină.\n4.Toarnă laptele cu drojdia și începe frământarea.\n5.Adaugă treptat uleiul light, sarea și coaja rasă de\nlămâie/portocală. Frământă 8–10 minute până devine un aluat\nelastic.\n6.Acoperă și lasă la dospit 60–90 minute, într-un loc cald.\n7.Pentru umplutură, amestecă nuca măcinată cu cacao,\nîndulcitorul și câteva picături de esență.\n8.Întinde aluatul dospit, pune umplutura și rulează strâns.\n9.Așază într-o formă tapetată, acoperă și mai lasă la dospit 20–\n30 minute.\n10.Coace la 170°C, 35–40 minute, până se rumenește frumos.","sfaturi":"Pune un bol cu apă în cuptor pentru a păstra cozonacul mai\npufos.\nNucile prăjite ușor dau o aromă mai intensă.\nDacă vrei un aspect lucios, unge cozonacul cu albuș bătut\nînainte de coacere.","alergeni":"gluten (făină), ouă, lactoză (lapte), nuci","variante":"fără lactate: folosește lapte vegetal (migdale, soia).","macro":{"calorii_macro":"228","proteine":"7.5 g","carbohidrati":"31.3 g","fibre":"3.2 g","grasimi":"8.4 g","grasimi_saturate":"2 g","greutate_portie":"110 g"}},{"id":"sarbatori-314","titlu":"Alivenci Moldovenești","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":314,"portii":"8","timp_minute":50,"calorii":242,"ingrediente":["200 g mălai fin","80 g făină integrală","250 g brânză de vaci slabă (max.","2–4% grăsime)","100 g telemea light","120 g iaurt grecesc 2%","3 ouă (2 întregi + 1 albuș)","250 ml lapte 1,5%","20 g unt light (pentru uns tava)","1 praf de sare"],"descriere":"O reinterpretare ușoară și proteică a celebrelor alivenci\nmoldovenești, cu ingrediente simple și gust autentic.","pasi":"1.Amestecă într-un bol mălaiul, făina integrală și sarea.\n2.Într-un alt vas, mixează brânza de vaci, telemeaua light, iaurtul\nși ouăle până obții o compoziție omogenă.\n3.Adaugă treptat laptele degresat și omogenizează.\n4.Toarnă compoziția lichidă peste ingredientele uscate și\namestecă bine.\n5.Unge tava cu uleiul light și toarnă compoziția în strat uniform.\n6.Coace la 180°C timp de 30–35 minute, până se rumenește ușor\nla suprafață.\n7.Lasă 5–10 minute la răcit înainte de a porționa.","sfaturi":"Pentru un plus de aromă, adaugă mărar proaspăt sau ceapă\nverde tocată.\nSe potrivește perfect servită cu iaurt grecesc rece.\nPoate fi păstrată la frigider 2 zile și încălzită la cuptor sau\ntigaie.","alergeni":"gluten, lactoză, ou","variante":"poți înlocui telemeaua cu brânză feta light sau iaurtul cu iaurt vegetal degresat.","macro":{"calorii_macro":"242.2","proteine":"14.9 g","carbohidrati":"29.7 g","fibre":"1.5 g","grasimi":"6.5 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-315","titlu":"Plăcintă cu Brânză la Cuptor","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":315,"portii":"8","timp_minute":50,"calorii":150,"ingrediente":["Pentru aluat (8 bucăți):","200 g făină integrală","150 g iaurt grecesc 2%","60 g ou (1 ou mediu)","5 g praf de copt","3 g sare","Pentru umplutură:","300 g brânză de vaci slabă","60 g ou (1 ou mediu)","15 g mărar după gust: sare, piper"],"descriere":"O variantă light, aerată și aromată a brânzoaicelor clasice,\nperfectă pentru un mic dejun sau desert echilibrat.","pasi":"1.Amestecă făina integrală cu praful de copt și sarea.\n2.Într-un bol separat, combină iaurtul grecesc cu oul și\nomogenizează.\n3.Adaugă treptat ingredientele lichide peste cele uscate și\nfrământă până obții un aluat moale și uniform.\n4.Împarte aluatul în 8 bile egale și întinde-le sub formă de discuri.\n5.Pentru umplutură, amestecă brânza de vaci cu oul, mărarul și\ncondimentele.\n6.Pune câte o lingură de umplutură în mijlocul fiecărui disc și\nîmpăturește marginile către interior, formând plăcintele.\n7.Așază-le într-o tavă tapetată cu hârtie de copt.\n8.Coace la 180°C timp de 20–25 minute, până se rumenesc\nfrumos.","sfaturi":"Pentru un gust mai dulce, poți adăuga în umplutură îndulcitor și\ncoajă de lămâie.\nPentru o variantă mai sățioasă, adaugă verdețuri mixte (ceapă\nverde, pătrunjel).\nSe servesc calde sau reci, fiind ideale ca gustare proteică.","alergeni":"gluten, lactoză, ou","variante":"făina integrală se poate înlocui cu făină fără gluten, iar brânza cu tofu cremos pentru o variantă vegană.","macro":{"calorii_macro":"150.3","proteine":"12 g","carbohidrati":"19.9 g","fibre":"3 g","grasimi":"2.3 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-316","titlu":"Plăcintă cu Mere","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":316,"portii":"8","timp_minute":55,"calorii":203,"ingrediente":["300 g foi de plăcintă light (subțiri, fără adaos de grăsime)","1 kg mere rase","40 g îndulcitor pudră (eritritol/stevia)","2 lingurițe scorțișoară","20 ml ulei de măsline (pentru uns foile)","20 g pesmet integral","1 vârf de cuțit de sare"],"descriere":"O plăcintă ușoară, aromată și echilibrată, cu foi light și umplutură\nbogată în mere, perfectă pentru orice moment al zilei.","pasi":"1.Rade merele și scurge ușor excesul de suc.\n2.Amestecă merele cu îndulcitorul, scorțișoara și un praf de sare.\n3.Întinde o foaie de plăcintă într-o tavă unsă ușor cu ulei.\n4.Presară pesmetul integral pe prima foaie pentru a absorbi\numiditatea.\n5.Adaugă jumătate din compoziția de mere, apoi pune încă un\nstrat de foi unse cu puțin ulei.\n6.Toarnă restul de umplutură și acoperă cu ultimele foi unse ușor\ncu ulei.\n7.Fă câteva crestături la suprafață pentru a evita umflarea în\ntimpul coacerii.\n8.Coace plăcinta la 180°C timp de 25–30 minute, până devine\naurie.\n9.Las-o să se răcească înainte de porționare.","sfaturi":"Pentru un plus de aromă, adaugă esență de vanilie sau coajă\nde lămâie.\nPoți presăra nuci mărunțite (atenție la calorii) în umplutură.\nSe servește caldă sau rece, simplă sau cu un strop de iaurt\ngrecesc light.","alergeni":"gluten (foi de plăcintă, pesmet)","variante":"foile se pot înlocui cu foi fără gluten; îndulcitorul cu miere (atenție la aportul caloric).","macro":{"calorii_macro":"203","proteine":"0 g","carbohidrati":"15.1 g","fibre":"1.3 g","grasimi":"2.5 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-317","titlu":"Poale-n Brâu","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":317,"portii":"12","timp_minute":100,"calorii":187,"ingrediente":["Pentru aluat:","400 g făină integrală","180 ml lapte degresat călduț","20 g drojdie proaspătă (sau 7 g uscată)","20 g îndulcitor pudră (eritritol/stevia)","1 ou întreg + 1 albuș","30 ml ulei de măsline sau floarea soarelui","5 g sare","Pentru umplutură:","350 g brânză de vaci slabă","30 g îndulcitor pudră (sau după gust)","1 ou întreg","1 linguriță coajă de lămâie","20 g stafide hidratate"],"descriere":"O versiune mai ușoară și modernizată a celebrelor poale-n brâu\nmoldovenești, cu aluat pufos și umplutură cremoasă din brânză\nslabă.","pasi":"1.Amestecă făina integrală cu sarea într-un bol încăpător.\n2.Dizolvă drojdia în laptele cald împreună cu îndulcitorul și lasă\n5–10 minute până devine spumoasă.\n3.Bate oul întreg cu albușul și adaugă peste făină.\n4.Toarnă amestecul cu drojdie și începe frământarea.\n5.Adaugă treptat uleiul și continuă frământarea până obții un\naluat elastic și omogen.\n6.Acoperă bolul și lasă aluatul la dospit 45–60 minute, într-un loc\ncald.\n7.Pentru umplutură, amestecă brânza de vaci cu îndulcitorul, oul,\ncoaja de lămâie și stafidele (opțional).\n8.După dospire, împarte aluatul în 12 bucăți egale și întinde-le în\nforme rotunde.\n9.Pune câte o lingură generoasă de umplutură în centru și\nîmpăturește colțurile către mijloc, sigilând bine.\n10.Așază plăcintele într-o tavă tapetată cu hârtie de copt și mai\nlasă-le la crescut 15 minute.\n11.Coace la 180°C timp de 20–25 minute, până se rumenesc\nuniform.","sfaturi":"Pentru o aromă mai intensă, poți adăuga esență de vanilie în\numplutură.\nSe potrivesc de minune servite cu iaurt grecesc light sau fructe\nproaspete.\nPot fi păstrate la frigider 2 zile și reîncălzite ușor la cuptor.","alergeni":"gluten, lactoză, ou","variante":"brânza de vaci poate fi înlocuită cu brânză cottage slabă sau, pentru o variantă fără lactate, cu tofu cremos + iaurt vegetal.","macro":{"calorii_macro":"186.3","proteine":"10.2 g","carbohidrati":"25.6 g","fibre":"4 g","grasimi":"4.1 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-318","titlu":"Papanași la Cuptor","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":318,"portii":"2","timp_minute":45,"calorii":247,"ingrediente":["Aluat papanași","170 g brânză de vaci slabă (2–4%)","40 g făină integrală","15 g griș","1 ou mic (≈ 50 g, fără coajă)","10 g îndulcitor pudră (eritritol/stevia)","2 g praf de copt","½ linguriță esență de vanilie","Pentru tavă","3 g unt light (pentru uns)","Topping (INCLUS)","40 g iaurt grecesc 2%","40 g dulceață fără zahăr"],"descriere":"O variantă mult mai ușoară și echilibrată a papanașilor clasici,\npregătiți la cuptor, nu prăjiți, cu topping fresh și cremos.","pasi":"1.Amestecă brânza de vaci cu ouăle, esența de vanilie și\nîndulcitorul până obții o compoziție omogenă.\n2.Adaugă grișul, făina integrală și praful de copt, apoi\nomogenizează bine.\n3.Lasă compoziția 10 minute să se hidrateze grișul.\n4.Modelează 2 papanași egali și așază-i într-o tavă tapetată cu\nhârtie de copt și unsă ușor cu ulei.\n5.Coace la 180°C timp de 20–22 minute, până se rumenesc ușor.\n6.Servește fiecare porție cu iaurt grecesc și dulceață fără zahăr.","sfaturi":"Pentru un plus de pufoșenie, adaugă un albuș bătut spumă în\naluat.\nÎnlocuiește dulceața cu fructe de pădure proaspete pentru o\nvariantă mai fresh.\nSe păstrează bine la frigider 1–2 zile și pot fi consumați ca\ngustare proteică.","alergeni":"lactoză, gluten, ou","variante":"poți folosi brânză cottage slabă în loc de brânză de vaci sau făină fără gluten pentru o versiune adaptată.","macro":{"calorii_macro":"247","proteine":"19.4 g","carbohidrati":"17.9 g","fibre":"2.4 g","grasimi":"4.4 g","grasimi_saturate":"1.6 g"}},{"id":"sarbatori-319","titlu":"Cornulețe cu Gem","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":319,"portii":"12","timp_minute":55,"calorii":172,"ingrediente":["350 g făină integrală","100 g unt cu 65% grăsime","100 g iaurt grecesc 2%","30 g îndulcitor pudră (eritritol/stevia)","1 ou","1 vârf de cuțit de sare","5 g praf de copt","200 g gem fără zahăr (de prune, caise sau vișine) îndulcitor pudră – pentru decor"],"descriere":"Cornulețe fragede, aromate și mult mai ușoare decât varianta\nclasică, umplute cu gem fără zahăr și perfecte pentru o gustare\nrapidă.","pasi":"1.Amestecă făina integrală cu praful de copt și un praf de sare.\n2.Adaugă untul rece tăiat cubulețe și freacă-l cu făina până obții\no textură nisipoasă.\n3.Încorporează iaurtul grecesc, îndulcitorul și oul, frământând\npână se formează un aluat omogen.\n4.Împarte aluatul în două bile și întinde-le în cercuri mari.\n5.Taie fiecare cerc în 12 triunghiuri egale.\n6.Pune câte o linguriță de gem la baza fiecărui triunghi și rulează\nspre vârf pentru a forma cornulețele.\n7.Așază-le pe o tavă tapetată cu hârtie de copt.\n8.Coace la 180°C timp de 15–18 minute, până devin ușor aurii.\n9.După răcire, pudrează-le cu îndulcitor dacă dorești.","sfaturi":"Pentru un plus de aromă, adaugă coajă de lămâie sau esență\nde vanilie în aluat.\nPoți folosi și gem de fructe de pădure fără zahăr pentru mai\nmulte fibre.\nDacă vrei cornulețe crocante, unge-le cu puțin lapte degresat\nînainte de coacere.","alergeni":"gluten (făină), lactoză (iaurt, unt), ou","variante":"înlocuiește untul cu ulei de cocos dezodorizat pentru o aromă diferită.","macro":{"calorii_macro":"171.6","proteine":"5.1 g","carbohidrati":"21.3 g","fibre":"3.5 g","grasimi":"6.4 g","grasimi_saturate":"3.2 g"}},{"id":"sarbatori-320","titlu":"Faguri","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":320,"portii":"10","timp_minute":60,"calorii":214,"ingrediente":["Pentru faguri","3 buc ouă","80 g zahăr brun","50 g îndulcitor pudră (eritritol/stevia)","250 ml lapte semi-degresat","20 ml ulei cocos","300 g făină integrală","1 linguriță praf de copt","1 linguriță esență de vanilie","1 linguriță coajă rasă de lămâie","1 vârf de cuțit sare","Pentru crema  de cacao","150 g unt 40% grăsime (moale la temperatura camerei)","60 g zahăr brun","80 g îndulcitor pudră","30 g cacao","1 buc gălbenuș","50 ml lapte cald","1 linguriță esență de rom"],"descriere":"O variantă mai ușoară și mai echilibrată a cozonacului clasic,\nperfectă pentru sărbători, fără să renunți la gustul autentic.\nFagurii","pasi":"1.Bate ouăle cu zahărul brun și îndulcitorul.\n2.Adaugă laptele, uleiul, vanilia și coaja de lămâie.\n3.Încorporează făina, praful de copt și sarea.\n4.Coace aluatul în aparat 1–2 minute pe fiecare fagure și lasă-i la\nrăcit.\nCrema\n1.Mixează untul cu zahărul brun și îndulcitorul.\n2.Adaugă cacao, gălbenușul, romul și laptele până obții o cremă\ngroasă.\nMontare\n1.Unge un fagure cu cremă.\n2.Pune al doilea fagure deasupra și presează ușor.\n3.Repetă.","sfaturi":"Dacă vrei crema mai light, poți înlocui 50 g unt cu 50 g cremă\nde brânză light.\nPentru textură mai densă, crește cacaua la 40 g.\nPentru o aromă intensă de sărbători, adaugă un praf de\nscorțișoară în cremă.","alergeni":"gluten, ouă, lactoză (unt, lapte)","variante":"fără lactoză: unt și lapte fără lactoză.","macro":{"calorii_macro":"214","proteine":"3.9 g","carbohidrati":"16.8 g","fibre":"1 g","grasimi":"12.8 g","grasimi_saturate":"3 g"}},{"id":"sarbatori-321","titlu":"Tort Doboș","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":321,"portii":"12","timp_minute":100,"calorii":119,"ingrediente":["Pentru foi:","3 ouă","60 g îndulcitor pudră (eritritol/stevia)","150 g făină integrală","1 vârf de cuțit de sare","Pentru cremă:","150 g iaurt grecesc 2%","100 g brânză de vaci slabă (fină, pasată)","80 g ciocolată neagră 85% cacao","20 g cacao neîndulcită","20 g îndulcitor pudră","1 linguriță esență de rom sau vanilie","Pentru caramel:","40 g eritritol caramelizat","10 ml apă","5 g unt light"],"descriere":"O versiune modernizată, mai ușoară și echilibrată a celebrului Tort\nDoboș, cu cremă fină de cacao și topping crocant de caramel\nlight.\nFoi:","pasi":"1.Bate ouăle cu îndulcitorul.\n2.Adaugă făina și sarea.\n3.Împarte aluatul în 6 foi subțiri și coace fiecare foaie 6–8 minute\nla 180°C.\nCremă:\n1.Mixează iaurtul cu brânza de vaci.\n2.Încorporează cacaoa, îndulcitorul, esența și ciocolata topită.\n3.Lasă 10–15 minute la rece.\nCaramel:\n1.Caramelizează eritritolul (sau zahărul).\n2.Adaugă apa și untul și amestecă până devine omogen.\n3.Toarnă într-un strat subțire și lasă la întărit.\nAsamblare:\n1.Montează foi + cremă în straturi.\n2.Ultima foaie se decorează cu caramel tăiat în triunghiuri.\n3.Lasă tortul la rece cel puțin 2 ore.","sfaturi":"Poți adăuga nuci măcinate între straturi pentru un plus de\ntextură.\nPentru un gust mai intens, folosește cafea concentrată în cremă.\nSe servește cel mai bine a doua zi, după ce s-au combinat\naromele.","alergeni":"gluten (făină), ouă, lactoză (iaurt, brânză, unt)","variante":"folosește pudră proteică de ciocolată în cremă pentru un aport proteic mai mare.","macro":{"calorii_macro":"119","proteine":"6.1 g","carbohidrati":"14.1 g","fibre":"2 g","grasimi":"4.3 g","grasimi_saturate":"1.5 g"}},{"id":"sarbatori-322","titlu":"Chec Pufos cu Nucă și Cacao","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":322,"portii":"8","timp_minute":50,"calorii":215,"ingrediente":["220 g făină integrală","80 g îndulcitor pudră (eritritol/stevia)","3 ouă întregi + 1 albuș","40 ml ulei cocos dezodorizat","120 ml lapte degresat","40 g nucă măcinată","20 g cacao","10 g praf de copt","1 vârf de cuțit de sare esență de vanilie – după gust"],"descriere":"Un chec ușor, pufos și delicios, cu aromă intensă de cacao și textură\nfină, perfect pentru o gustare echilibrată.","pasi":"1. Bate ouăle cu îndulcitorul până se spumează ușor.\n2. Adaugă uleiul, laptele și esența de vanilie.\n3. Încorporează făina, praful de copt, sarea, nuca și cacaoa.\n4. Toarnă compoziția într-o tavă tapetată cu hârtie de copt.\n5. Coace la 180°C timp de 35–40 minute, până trece testul\nscobitorii.\n6. Lasă checul să se răcească înainte de feliere.","sfaturi":"Poți adăuga stafide hidratate sau merișoare uscate pentru un\nplus de aromă.\nPentru o variantă mai cremoasă, servește cu o lingură de iaurt\ngrecesc 2% deasupra.\nSe păstrează 2–3 zile într-o cutie ermetică sau se poate\ncongela pe felii.","alergeni":"gluten (făină), ouă, nuci","variante":"înlocuiește nuca cu alune sau migdale măcinate pentru altă textură.","macro":{"calorii_macro":"215","proteine":"8.1 g","carbohidrati":"22.6 g","fibre":"4.4 g","grasimi":"6.1 g","grasimi_saturate":"3 g"}},{"id":"sarbatori-323","titlu":"Prăjitură „albă ca Zăpada”","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":323,"portii":"12","timp_minute":70,"calorii":204,"ingrediente":["Pentru foi:","400 g făină integrală","60 g îndulcitor pudră (eritritol/stevia)","60 g iaurt grecesc 2%","2 ouă","80 ml lapte degresat","5 g praf de copt","1 vârf de cuțit de sare","Pentru cremă:","800 ml lapte degresat","80 g îndulcitor pudră","60 g amidon de porumb","100 g brânză de vaci slabă","30 g unt cu 65% grăsime coajă rasă de lămâie – după gust zeama de la ½ lămâie","1 plic zahăr vanilat"],"descriere":"O reinterpretare mai light a clasicei prăjituri, cu foi fragede și o\ncremă fresh de lămâie, perfectă pentru orice ocazie.\nFoi:","pasi":"1.Bate ouăle cu îndulcitorul, apoi adaugă iaurtul și laptele.\n2.Încorporează făina, praful de copt și sarea până obții un aluat\nomogen.\n3.Împarte aluatul în 3 foi subțiri și coace fiecare foaie 7–8 minute\nla 180°C.\nCremă:\n1.Fierbe laptele cu îndulcitorul și adaugă amidonul dizolvat în\npuțină apă.\n2.Amestecă până se îngroașă, apoi lasă la răcit 10 minute.\n3.Încorporează brânza de vaci, untul, coaja și zeama de lămâie,\nplus zahărul vanilat.\nAsamblare:\n1.Așază prima foaie, adaugă un strat de cremă, apoi continuă\npână termini foile.\n2.Lasă prăjitura la rece minimum 4 ore, ideal peste noapte, pentru\na se frăgezi.","sfaturi":"Poți adăuga în cremă lapte praf degresat pentru o textură mai\nbogată.\nPentru un gust fresh, adaugă câteva frunze de mentă tocată fin\nîn cremă.\nSe servește cel mai bine a doua zi, când foile s-au înmuiat\ncomplet.","alergeni":"gluten (făină), ouă, lactoză (lapte, iaurt, brânză, unt)","variante":"folosește lapte vegetal fortificat pentru o versiune fără lactoză.","macro":{"calorii_macro":"204","proteine":"9.2 g","carbohidrati":"32.2 g","fibre":"4 g","grasimi":"3.7 g","grasimi_saturate":"2 g"}},{"id":"sarbatori-324","titlu":"Griș cu Lapte","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":324,"portii":"2","timp_minute":15,"calorii":170,"ingrediente":["400 ml lapte semidegresat (1,5%)","36 g griș fin","8 g îndulcitor pudră (eritritol/stevia)","½ linguriță extract de vanilie","1 vârf mic de cuțit de sare","2 g unt light","20 g fructe de pădure proaspete (pentru servire)"],"descriere":"Un desert-cremă simplu, fin și rapid, perfect pentru o gustare ușoară\nsau un mic dejun dulce.","pasi":"1.Pune laptele la fiert cu îndulcitorul, vanilia și sarea.\n2.Când începe să clocotească, adaugă grișul în ploaie,\namestecând continuu.\n3.Fierbe 3–4 minute, până se îngroașă.\n4.Adaugă untul pentru extra finețe.\n5.Servește grișul cald cu fructe de pădure sau dulceață fără\nzahăr.","sfaturi":"Pentru un plus de aromă, adaugă coajă de lămâie sau\nportocală rasă.\nDacă vrei consistență mai fină, mixează grișul cu puțin lapte\nrece înainte de a-l pune în laptele fierbinte.\nSe potrivește excelent cu fructe de pădure, căpșuni sau un sos\nde zmeură fără zahăr.","alergeni":"gluten (griș), lactoză (lapte, unt)","variante":"înlocuiește laptele cu lapte vegetal neîndulcit (soia, ovăz, migdale) pentru o variantă fără lactoză.","macro":{"calorii_macro":"170","proteine":"6.1 g","carbohidrati":"8.95 g","fibre":"0 g","grasimi":"2.8 g","grasimi_saturate":"1.2 g"}},{"id":"sarbatori-327","titlu":"Drob de Miel Tradițional","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":327,"portii":"12","timp_minute":90,"calorii":250,"ingrediente":["1 kg organe de miel (ficat, plămâni, inimă, rinichi, splină)","300 g ouă","2 legături ceapă verde (aprox.","150 g)","2 legături usturoi verde (aprox.","150 g)","1 legătură pătrunjel verde (50 g)","1 legătură mărar verde (50 g)","100 g pesmet","30 ml ulei","5 ouă fierte tari (pentru interior)","Sare, piper"],"descriere":"O variantă tradițională, aromată și echilibrată a drobului de miel,\nperfectă pentru masa de Paște.","pasi":"1.Fierbe organele de miel timp de 30–40 minute, apoi lasă-le la\nrăcit și toacă-le mărunt.\n2.Călește ușor ceapa verde și usturoiul verde în 1 lingură de ulei.\n3.Amestecă organele tocate cu legumele călite, verdeața tocată,\nouăle crude, pesmetul, sarea și piperul.\n4.Tapetează o tavă cu hârtie de copt și toarnă jumătate din\ncompoziție.\n5.Așază ouăle fierte pe mijloc și acoperă cu restul compoziției.\n6.Unge suprafața cu puțin ulei.\n7.Coace drobul la 180°C timp de 35–40 minute, până se\nrumenește ușor.","sfaturi":"Pentru un gust mai bogat, poți adăuga și puțin ficat de pasăre.\nDrobului i se pot pune și foi de plăcintă/aluat ca înveliș, pentru\nun aspect mai festiv.\nSe servește tradițional la masa de Paște, alături de salată verde\nși ridichi.","alergeni":"ouă, gluten (pesmet)","variante":"în loc de pesmet, poți folosi fulgi de ovăz măcinați.","macro":{"calorii_macro":"250","proteine":"6.3 g","carbohidrati":"0.7 g","fibre":"0.1 g","grasimi":"7.5 g","grasimi_saturate":"3 g"}},{"id":"sarbatori-328","titlu":"Salată Boeuf","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":328,"portii":"6","timp_minute":35,"calorii":139,"ingrediente":["Pentru salată:","300 g piept de pui","300 g cartofi","200 g morcovi","150 g mazăre","150 g castraveți murați","Pentru maioneză light:","200 g iaurt grecesc 2%","20 g muștar","15 ml zeamă de lămâie după gust: sare, piper"],"descriere":"O reinterpretare ușoară și echilibrată a celebrei salate tradiționale,\ncu maioneză light din iaurt grecesc. Gust autentic, dar mult mai\nușoară și potrivită pentru un stil de viață sănătos.","pasi":"1.Fierbe pieptul de pui, cartofii, morcovii și mazărea până devin\nfragede.\n2.Taie toate ingredientele în cubulețe mici și lasă-le să se\nrăcească.\n3.Amestecă într-un bol iaurtul, muștarul și zeama de lămâie pentru\na forma maioneza light.\n4.Într-un vas mare, combină legumele și pieptul de pui cu\nmaioneza, potrivind de sare și piper.\n5.Lasă salata la frigider cel puțin 1 oră înainte de servire.","sfaturi":"Iaurtul grecesc înlocuiește perfect maioneza\nTăierea uniformă e esențială pentru aspect\nSe păstrează 2 zile la frigider","alergeni":"lactoză (iaurt grecesc), muștar","variante":"fără lactate: înlocuiește iaurtul grecesc cu maioneză din avocado sau sos pe bază de tofu.","macro":{"calorii_macro":"138.7","proteine":"15.5 g","carbohidrati":"12 g","fibre":"3.3 g","grasimi":"1.4 g","grasimi_saturate":"0.3 g","greutate_portie":"220 g"}},{"id":"sarbatori-329","titlu":"Salată de Icre","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":329,"portii":"2","timp_minute":35,"calorii":201,"ingrediente":["48 g icre crude (știucă / crap / hering)","32 ml ulei de măsline","16 g pâine integrală (miez, înmuiat și bine stors)","16 g ceapă mică","10 ml zeamă de lămâie","Sare – după gust"],"descriere":"O pastă fină, aerată și savuroasă, perfectă pentru tartine rapide\nsau gustări festive.","pasi":"1.Stoarce bine miezul de pâine și pune-l în robot cu icrele.\n2.Mixează și adaugă treptat uleiul până devine o cremă aerată.\n3.Adaugă zeama de lămâie, ceapa tocată foarte fin și potrivește\nde sare.","sfaturi":"Pentru o variantă mai light, înlocuiește jumătate din ulei cu iaurt\ngrecesc 2% – scazi aproape 40% din calorii.\nSe poate adăuga și mărar tocat fin pentru un gust mai fresh.\nSalata se păstrează la frigider, în cutie ermetică, max. 2 zile.","alergeni":"pește, gluten, lactoză (dacă pâinea e înmuiată în lapte)","variante":"pâinea albă poate fi înlocuită cu pâine integrală sau fără gluten, iar laptele cu lapte vegetal neîndulcit.","macro":{"calorii_macro":"201","proteine":"1 g","carbohidrati":"3.3 g","fibre":"0 g","grasimi":"16.3 g","grasimi_saturate":"2.4 g","greutate_portie":"60 g"}},{"id":"sarbatori-330","titlu":"Salată de Ciuperci cu Maioneză","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":330,"portii":"4","timp_minute":25,"calorii":117,"ingrediente":["Pentru salată","500 g ciuperci champignon (sau pleurotus)","1 buc ceapă mică (sau 2 fire ceapă verde)","2 căței usturoi","1 legătură pătrunjel","1 vârf de cuțit de sare","1 vârf de cuțit de piper","Pentru maioneza light","150 g iaurt grecesc 2%","1 buc gălbenuș fiert","1 linguriță ulei de măsline","1 linguriță mustar","30 g maioneză clasică"],"descriere":"O salată cremoasă, ușoară și aromată, cu maioneză light și ciuperci\nfragede — ideală ca aperitiv.","pasi":"1.Fierbe ciupercile 10–12 minute, scurge-le bine și toacă-le fin.\n2.Toacă mărunt ceapa, usturoiul și pătrunjelul.\n3.Amestecă toate ingredientele pentru salată într-un bol mare.\n4.Separat, pregătește maioneza light: amestecă iaurtul,\ngălbenușul fiert, uleiul, muștarul și maioneza clasică până devin\no cremă fină.\n5.Adaugă maioneza light peste ciuperci, amestecă și potrivește\nde sare și piper.\n6.Lasă salata 10 minute la rece pentru a se combina aromele.","sfaturi":"Dacă vrei textura mai cremoasă, crește iaurtul la 200 g.\nPentru aromă deosebită: adaugă ½ linguriță zeamă de\nlămâie.\nCiupercile pleurotus dau un gust mai intens decât champignon.","alergeni":"ouă (gălbenuș), muștar, lactoză (iaurt)","variante":"fără lactoză: iaurt vegetal + maioneză fără lactoză; fără ou: maioneză vegană + iaurt vegetal.","macro":{"calorii_macro":"117","proteine":"4 g","carbohidrati":"2.1 g","fibre":"0 g","grasimi":"3.4 g","grasimi_saturate":"0.8 g","greutate_portie":"170 g"}},{"id":"sarbatori-331","titlu":"Piftie de Curcan","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":331,"portii":"8","timp_minute":180,"calorii":192,"ingrediente":["800 g pulpe de curcan cu os","400 g aripi de curcan","100 g morcov","50 g țelină","50 g ceapă","30 g usturoi","2 bucăți foi de dafin","5 g piper boabe","15 g gelatină (opțional) după gust: sare"],"descriere":"O variantă mai ușoară și echilibrată a tradiționalei piftii, ideală\npentru mesele de sărbătoare. Bogată în colagen natural, dar cu un\nconținut redus de grăsimi.","pasi":"1.Pune carnea la fiert în apă rece cu sare, spumând la nevoie.\n2.Adaugă legumele, dafinul și piperul și fierbe la foc mic 2–2,5\nore, până când carnea se desprinde de pe os.\n3.Strecoară supa, adaugă usturoiul pisat și, dacă vrei o piftie mai\nlegată, dizolvă gelatina în supa caldă.\n4.Așază bucățile de carne și legume în forme, toarnă zeama și\nlasă la frigider 6–8 ore, până se încheagă.","sfaturi":"Testează gelificarea punând puțină zeamă la rece\nDecorează cu morcov și ou fiert\nServește cu muștar și oțet","alergeni":"țelină","variante":"adaugă felii de ou fiert în castronele înainte să torni zeama (aspect plăcut, plus proteine).","macro":{"calorii_macro":"191.5","proteine":"24.4 g","carbohidrati":"1.4 g","fibre":"0.4 g","grasimi":"5 g","grasimi_saturate":"1.2 g","greutate_portie":"380 g"}},{"id":"sarbatori-332","titlu":"Plăcintă cu Cartofi","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":332,"portii":"8","timp_minute":55,"calorii":206,"ingrediente":["300 g foi de plăcintă light (subțiri, fără adaos de grăsime)","700 g cartofi fierți","100 g ceapă","15 ml ulei de măsline (pentru călirea cepei și uns foile)","Sare, piper – după gust","20 g pătrunjel verde tocat"],"descriere":"O plăcintă simplă, sățioasă și light, cu cartofi fierți și foi subțiri,\nperfectă ca gustare sau cină rapidă.","pasi":"1.Fierbe cartofii, apoi pasează-i grosier cu puțină sare și piper.\n2.Călește ceapa în 5 ml ulei până devine aurie.\n3.Amestecă ceapa călită cu cartofii și pătrunjelul tocat.\n4.Unge o tavă cu puțin ulei și așază primul strat de foi de plăcintă.\n5.Adaugă jumătate din umplutură, apoi pune un nou strat de foi\nunse ușor cu ulei.\n6.Pune restul de umplutură și acoperă cu ultimele foi.\n7.Taie plăcinta în pătrate și stropește ușor cu 1–2 lingurițe de ulei.\n8.Coace la 180°C timp de 25–30 minute, până devine aurie.","sfaturi":"Pentru un plus de proteine, poți adăuga 150 g brânză de vaci\nslabă în amestecul de cartofi.\nDacă dorești o variantă mai aromată, adaugă cimbru sau\nrozmarin.\nSe servește caldă sau rece, ca fel principal sau garnitură.","alergeni":"gluten (foi de plăcintă)","variante":"foile se pot înlocui cu foi fără gluten; uleiul poate fi înlocuit cu spray pentru gătit, pentru reducerea grăsimilor.","macro":{"calorii_macro":"206","proteine":"1.1 g","carbohidrati":"17.7 g","fibre":"1.8 g","grasimi":"1.9 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-334","titlu":"Ciorbă de Miel","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":334,"portii":"2","timp_minute":50,"calorii":172,"ingrediente":["Pentru bază","90 g carne de miel slabă (spată/pulpă, fără grăsime vizibilă)","500 ml apă","27 g ceapă","27 g morcov","27 g țelină rădăcină","18 g păstârnac","25 g ardei kapia","6 g leuștean verde","6 g pătrunjel verde","1 foaie mică de dafin","1 praf mic de sare","1 praf mic de piper","Pentru acrit","35 ml borș (sau zeamă de lămâie / oțet de mere, după gust)","Pentru dres light","27 g iaurt grecesc 2%","½ gălbenuș (≈ 10 g)","9 ml apă caldă (pentru temperare)"],"descriere":"O ciorbă consistentă, aromată și echilibrată, cu carne fragedă de\nmiel și legume proaspete.","pasi":"1.Călește ceapa, morcovul, țelina, păstârnacul, ardeiul și ridichea\nîn ulei 2–3 minute.\n2.Adaugă carnea de miel tăiată cuburi și mai rumenește 2 minute.\n3.Toarnă apă fierbinte și lasă la fiert 20 minute.\n4.Adaugă orezul, usturoiul, pătrunjelul, leușteanul și foile de dafin și\ncontinuă fierberea 10 minute.\n5.Toarnă borșul (sau zeama de lămâie) și mai fierbe 2–3 minute.\n6.Pentru dres, amestecă iaurtul cu gălbenușul și puțină zeamă\ncaldă, apoi încorporează în ciorbă.\n7.Potrivește gustul cu sare, piper și verdeață.","sfaturi":"Dacă vrei gust mai intens: adaugă 1 linguriță usturoi pisat la\nfinal.\nPentru mai multă prospețime: pune 1 lingură oțet de mere chiar\nînainte de servire.\nPentru claritate perfectă: fierbe separat borșul 2 minute înainte\nsă-l adaugi.","alergeni":"ouă (dres), lactoză (iaurt)","variante":"fără lactoză: iaurt vegetal + 1 linguriță făină de orez pentru îngroșare; fără ou: dres doar din iaurt grecesc sau doar zeamă acră.","macro":{"calorii_macro":"172.1","proteine":"2.45 g","carbohidrati":"3.4 g","fibre":"0.95 g","grasimi":"1.65 g","grasimi_saturate":"0.4 g"}},{"id":"sarbatori-335","titlu":"Storceag Tradițional","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":335,"portii":"2","timp_minute":55,"calorii":218,"ingrediente":["200 g sturion (rondele)","60 g cartofi","30 g morcovi","15 g țelină","25 g ceapă","20 g ardei gras","40 g roșie","10 g orez","80 ml borș","20 g iaurt grecesc 2%","½ gălbenuș (≈ 10 g)","Zeama de la ~¼ lămâie","Sare, piper, foi de dafin – după gust","4 g leuștean verde tocat"],"descriere":"O supă tradițională pescărească, bogată și aromată, cu sturion\nfraged, legume și dres cremos.","pasi":"1.Fierbe ceapa, morcovii, țelina, ardeiul, cartofii și orezul în 1 L\napă, împreună cu foile de dafin.\n2.După 15 minute, adaugă bucățile de sturion și continuă\nfierberea încă 10–12 minute.\n3.Toarnă borșul și zeama de lămâie și mai fierbe 2–3 minute.\n4.Pentru dres, amestecă iaurtul cu gălbenușul și puțină zeamă\nfierbinte, apoi încorporează în supă.\n5.Potrivește de sare și piper și adaugă leușteanul tocat la final.","sfaturi":"Poți adăuga și ardei iute pentru un gust mai intens.\nDacă nu ai sturion, folosește somn sau crap, dar scoate capul și\noasele înainte de servire.\nSe servește fierbinte, cu pâine integrală sau ardei iute murat.","alergeni":"pește, ou, lactoză (din iaurt)","variante":"pentru o variantă și mai light, elimină gălbenușul și folosește doar iaurt grecesc.","macro":{"calorii_macro":"218","proteine":"2.6 g","carbohidrati":"11.85 g","fibre":"1.05 g","grasimi":"1.65 g","grasimi_saturate":"0.3 g"}},{"id":"sarbatori-336","titlu":"Ciorbă Ardelenească de Perișoare","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":336,"portii":"2","timp_minute":45,"calorii":230,"ingrediente":["100 g carne tocată din pulpă de porc","27 g ou de găină (≈ ½ ou mic)","9 g orez basmati","36 g ceapă","64 g morcovi","55 g țelină","27 g ardei gras","27 g smântână 12%","5 g făină de grâu albă","55 g pâine integrală din grâu întreg","5 g ulei de măsline","Sare, piper, verdeață (pătrunjel, leuștean) – după gust"],"descriere":"O ciorbă consistentă, aromată și echilibrată, cu perișoare fragede\nși legume proaspete.","pasi":"1.Amestecă carnea tocată cu oul, orezul, ceapa tocată fin, sare și\npiper. Formează 3–4 perișoare.\n2.Într-o oală, călește restul de ceapă, morcovul, țelina și ardeiul în\nulei 2–3 minute.\n3.Adaugă apă fierbinte (aprox. 400–450 ml) și lasă legumele să\nfiarbă 10 minute.\n4.Adaugă perișoarele și fierbe 15 minute până sunt gătite.\n5.Amestecă smântâna cu făina și cu câteva linguri de zeamă\nfierbinte, apoi toarnă înapoi în oală.\n6.Mai fierbe 2–3 minute și potrivește de sare, piper și verdeață.","sfaturi":"Dacă vrei o variantă mai acrișoară, adaugă borș sau zeamă\nde lămâie.\nPoți servi cu ardei iute murat.\nPentru un plus de cremozitate, folosește iaurt grecesc 2% în loc\nde smântână.","alergeni":"ou, gluten (făină și pâine), lactoză (smântână)","variante":"înlocuiește carnea de porc cu curcan sau vită slabă pentru extra proteine și mai puține grăsimi.","macro":{"calorii_macro":"230","proteine":"17.1 g","carbohidrati":"21 g","fibre":"1.2 g","grasimi":"8.3 g","grasimi_saturate":"3 g"}},{"id":"sarbatori-337","titlu":"Ciorbă de Fasole cu Afumătură","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":337,"portii":"2","timp_minute":100,"calorii":159,"ingrediente":["114 g fasole boabe uscată (pusă la înmuiat peste noapte)","81 g pulpă de curcan afumată","39 g morcovi","39 g ceapă","26 g țelină","26 g ardei gras","65 g roșii cuburi","3 ml ulei de măsline","1 foaie de dafin","½ linguriță cimbru uscat","Sare, piper – după gust","7 g pătrunjel verde"],"descriere":"O ciorbă tradițională, consistentă și aromată, cu fasole fiartă lent și\nafumătură slabă pentru un gust autentic.","pasi":"1.Fierbe fasolea în apă curată 40–50 minute (poți schimba prima\napă pentru o digestie mai ușoară).\n2.Într-o altă oală, călește ceapa, morcovul, țelina și ardeiul în ulei\n2–3 minute.\n3.Adaugă pulpa de curcan afumată și gătește încă 2 minute\npentru aromă.\n4.Toarnă peste legume fasolea fiartă cu tot cu apă, adaugă\nroșiile cuburi, cimbrul și foile de dafin.\n5.Fierbe 15–20 minute, până se omogenizează aromele.\n6.Potrivește de sare și piper, apoi adaugă pătrunjelul verde la\nfinal.","sfaturi":"Poți adăuga și 1 ardei iute pentru un gust autentic.\nServește cu ceapă roșie și pâine integrală.\nDacă vrei o textură mai cremoasă, pasează 1 polonic de fasole\nși amestecă în ciorbă.","alergeni":"țelină","variante":"înlocuiește pulpa de curcan afumată cu piept de curcan.","macro":{"calorii_macro":"159","proteine":"10.7 g","carbohidrati":"15.4 g","fibre":"3.4 g","grasimi":"3.6 g","grasimi_saturate":"1 g"}},{"id":"sarbatori-338","titlu":"Sarmale Ușoare","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":338,"portii":"2","timp_minute":70,"calorii":254,"ingrediente":["200 g carne tocată de pui (pulpe fără piele)","40 g orez alb","50 g ceapă","100 g varză murată","100 g suc de roșii","10 g ulei de măsline","Sare, piper, cimbru, foi de dafin – după"],"descriere":"O variantă echilibrată a sarmalelor tradiționale — cu carne slabă\nde pui, puțin ulei și gust intens, ideale pentru o masă consistentă și\nsănătoasă.","pasi":"1.Călește ceapa în ulei până devine aurie.\n2.Adaugă carnea, orezul și condimentele, amestecând bine.\n3.Rulează compoziția în frunze de varză și așază-le într-o cratiță.\n4.Toarnă roșiile și puțină apă peste ele, apoi fierbe-le la foc mic\n45–60 minute.","sfaturi":"Se servesc cu iaurt grecesc 2% sau mămăliguță light.\nPentru un gust mai intens, adaugă puțină boia dulce sau\nafumată în umplutură.\nDacă vrei sarmalele mai fragede, fierbe-le la slow cooker 3–4\nore.","alergeni":"nu conține alergeni majori (atenție la orez – posibil contaminare cu gluten)","variante":"poți folosi carne de curcan tocată în loc de pui.","macro":{"calorii_macro":"254","proteine":"24 g","carbohidrati":"20.4 g","fibre":"0.7 g","grasimi":"7.2 g","grasimi_saturate":"1.5 g"}},{"id":"sarbatori-339","titlu":"Dovlecei Umpluți","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":339,"portii":"2","timp_minute":60,"calorii":202,"ingrediente":["240 g dovlecei","120 g carne tocată de vită slabă","25 g orez","30 g ceapă","25 g morcov","60 g sos de roșii","5 ml ulei de măsline (≈ 1 linguriță)","5 g mărar verde","Sare, piper, cimbru – după gust"],"descriere":"Un preparat echilibrat și gustos, bogat în proteine și legume, ideal\npentru o masă principală ușoară și sățioasă.","pasi":"1.Taie dovleceii pe lungime, scobește-i ușor și presară un praf de\nsare. Lasă-i 10 minute să elimine excesul de apă.\n2.Toacă ceapa și morcovul, apoi călește-le în uleiul de măsline 3–\n4 minute.\n3.Adaugă carnea tocată și orezul spălat, condimentează cu sare,\npiper și cimbru, apoi gătește 8–10 minute.\n4.Așază dovleceii într-o tavă și umple-i cu compoziția obținută.\n5.Toarnă sosul de roșii peste ei și acoperă tava cu folie.\n6.Coace la 190°C timp de 30 de minute, apoi îndepărtează folia\nși mai lasă 10 minute pentru rumenire.\n7.Servește cu mărar verde presărat deasupra.","sfaturi":"Servește cu iaurt grecesc 2% pentru un contrast cremos.\nPoți adăuga și ardei gras sau țelină apio în umplutură.\nPentru un plus de aromă, adaugă 1–2 căței de usturoi zdrobit în\nsosul de roșii.","alergeni":"posibil gluten (dacă orezul nu este certificat fără gluten)","variante":"poți transforma rețeta în dovlecei gratinați, adăugând la final puțin cașcaval light.","macro":{"calorii_macro":"202","proteine":"14.6 g","carbohidrati":"13.9 g","fibre":"1.4 g","grasimi":"8.7 g","grasimi_saturate":"3 g"}},{"id":"sarbatori-340","titlu":"Stufat Moldovenesc","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":340,"portii":"2","timp_minute":60,"calorii":420,"ingrediente":["250 g carne de miel","100 g ceapă verde","60 g usturoi verde","50 g morcovi","85 g sos de roșii fără zahăr","4 ml ulei de măsline (≈ 1 linguriță mică)","35 ml vin alb sec","12 g mărar și pătrunjel verde","Sare, piper, foi de dafin – după gust"],"descriere":"Un preparat tradițional, gustos și aromat, cu carne fragedă și multă\nverdeață.","pasi":"1.Rumenește carnea 2–3 minute în ulei.\n2.Adaugă ceapa, usturoiul verde și morcovul și călește 3–4 minute.\n3.Toarnă vinul alb și lasă-l 1 minut să se reducă.\n4.Adaugă roșiile cuburi, foile de dafin, sarea și piperul.\n5.Completează cu apă cât să acopere carnea și fierbe 30–35\nminute, până devine fragedă.\n6.Adaugă mărarul și pătrunjelul la final, mai lasă 1 minut pe foc și\nservește.","sfaturi":"Servește cu mămăligă light sau orez integral.\nPoți adăuga și ardei gras sau dovlecel pentru mai mult volum și\nfibre.\nDacă vrei un sos mai dens, adaugă la final 1 lingură de iaurt\ngrecesc 2%.","alergeni":"nu conține alergeni majori","variante":"dacă vrei o rețetă fără alcool, înlocuiește vinul cu supă de legume și un strop de zeamă de lămâie.","macro":{"calorii_macro":"420","proteine":"1.4 g","carbohidrati":"5.1 g","fibre":"0.8 g","grasimi":"2.1 g","grasimi_saturate":"0.5 g"}},{"id":"sarbatori-341","titlu":"Tocăniță de Miel cu Usturoi și Vin","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":341,"portii":"2","timp_minute":90,"calorii":470,"ingrediente":["285 g carne de miel","60 g ceapă","45 g morcovi","5 g usturoi (≈ 2 căței)","45 ml vin roșu sec","55 g sos de roșii fără zahăr","8 ml ulei de măsline","1 foaie de dafin","Cimbru și rozmarin – după gust","Sare și piper – după gust","6 g pătrunjel verde tocat"],"descriere":"O tocăniță de miel cu usturoi și vin, gătită încet ca în bucătăria de\nsărbătoare, cu arome bogate și parfumate care amintesc de\nmesele calde în familie și de tradițiile românești pascale.","pasi":"1.Taie carnea de miel bucăți medii și rumenește-le ușor în uleiul\nde măsline.\n2. Adaugă ceapa și morcovii tocați, gătește 5 min la foc mic.\n3. Pune usturoiul zdrobit, roșiile cuburi și condimentele (dafin,\ncimbru, rozmarin).\n4. Toarnă vinul și 200 ml apă, apoi lasă să fiarbă la foc mic 60–\n70 min, până carnea este fragedă și sosul scade.\n5.Potrivește de sare și piper, presară pătrunjel verde la servire.","sfaturi":"Se servește cu mămăligă sau orez integral.\nPentru un gust mai fresh, adaugă la final zeamă de lămâie.\nDacă vrei o variantă mai light, redu uleiul la 15 ml și adaugă 1\nlingură de iaurt grecesc 2% în sos.","alergeni":"nu conține alergeni majori","variante":"vinul roșu se poate înlocui cu supă de legume pentru o rețetă fără alcool.","macro":{"calorii_macro":"469.5","proteine":"1 g","carbohidrati":"3.9 g","fibre":"0.7 g","grasimi":"4.1 g","grasimi_saturate":"1.2 g"}},{"id":"sarbatori-342","titlu":"Tocăniță de Pui cu Mămăligă","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":342,"portii":"2","timp_minute":50,"calorii":346,"ingrediente":["235 g piept de pui dezosat, file, fără piele","50 g ceapă","80 g morcovi","8 g usturoi (≈ 2 căței mici)","50 g sos de roșii fără zahăr","8 g ulei de măsline (≈ 2 lingurițe rase)","80 g mălai","Sare, piper – după gust"],"descriere":"O tocăniță de pui simplă și gustoasă, cu sos aromat și mămăliguță\ncaldă, exact genul de preparat tradițional care aduce în farfurie\nconfortul și gustul meselor de acasă.","pasi":"1.Călește ceapa și usturoiul în ulei de măsline, adaugă pieptul de\npui cubulețe și rumenește ușor.\n2.Pune morcovii și sosul de roșii, apoi fierbe la foc mic până\ncarnea devine fragedă.\n3.Fierbe mălaiul cu apă și sare pentru mămăligă.\n4.Servește tocănița cu mămăligă caldă.","sfaturi":"Adaugă pătrunjel verde tocat la final pentru prospețime.\nPoți pune și ardei gras sau dovlecel pentru mai mult volum și\nfibre.\nDacă dorești un sos mai cremos, adaugă la final 1 lingură de\niaurt grecesc 2%.","alergeni":"nu conține alergeni majori (atenție doar la intoleranța la porumb – mălai)","variante":"mămăliga poate fi înlocuită cu orez integral sau hrișcă.","macro":{"calorii_macro":"346","proteine":"28.6 g","carbohidrati":"36.3 g","fibre":"1.5 g","grasimi":"5.7 g","grasimi_saturate":"1 g"}},{"id":"sarbatori-343","titlu":"Cartofi Copți cu Rozmarin și Usturoi","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":343,"portii":"2","timp_minute":50,"calorii":180,"ingrediente":["385 g cartofi","4 g usturoi (≈ 1–2 căței)","10 g ulei de măsline","1 g rozmarin uscat sare, piper – după gust"],"descriere":"Un preparat aromat și reconfortant, cu cartofi rumeniți uniform,\nparfumați cu rozmarin și usturoi pentru un gust intens și echilibrat.","pasi":"1.Spală bine cartofii și taie-i felii groase sau cuburi.\n2.Pune-i într-un bol, adaugă uleiul, usturoiul pisat, rozmarinul, sarea\nși piperul.\n3.Amestecă bine, apoi întinde cartofii într-o tavă tapetată cu\nhârtie de copt.\n4.Coace la 200°C timp de 40 minute, amestecând o dată la\njumătatea timpului pentru rumenire uniformă.","sfaturi":"Pentru un gust mai crocant, lasă cartofii în apă rece 15 minute","alergeni":"fără alergeni majori","variante":"poți adăuga boia afumată, cimbru sau usturoi granulat; poți înlocui rozmarinul cu mix de ierburi italiene sau pătrunjel proaspăt pentru o aromă mai delicată.","macro":{"calorii_macro":"179.1","proteine":"2.05 g","carbohidrati":"28.9 g","fibre":"1.95 g","grasimi":"5 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-344","titlu":"Plăcintă cu Varză","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":344,"portii":"8","timp_minute":55,"calorii":155,"ingrediente":["300 g foi de plăcintă light (subțiri, fără adaos de grăsime)","800 g varză albă tocată fin","100 g ceapă","15 ml ulei de măsline (pentru călire și uns foile) sare, piper – după gust","20 g mărar verde tocat"],"descriere":"O plăcintă sățioasă, aromată și light, cu foi subțiri și varză călită fin,\nperfectă ca gustare sau cină.","pasi":"1.Călește ceapa în 5 ml ulei timp de 2 minute.\n2.Adaugă varza tocată fin și gătește 10–12 minute, până se\nînmoaie; potrivește de sare și piper.\n3.Închide focul și încorporează mărarul tocat.\n4.Unge o tavă cu puțin ulei și așază un prim strat de foi de\nplăcintă.\n5.Pune jumătate din varză, apoi adaugă un nou strat de foi unse\nușor cu ulei.\n6.Adaugă restul de umplutură și acoperă cu ultimele foi.\n7.Taie plăcinta în pătrate și stropește cu 1–2 lingurițe de ulei.\n8.Coace la 180°C timp de 25–30 minute, până devine aurie.","sfaturi":"Pentru un gust mai intens, adaugă chimen măcinat în umplutură.\nPoți combina varza albă cu varză roșie pentru o plăcintă mai\ncolorată și bogată în antioxidanți.\nSe servește caldă sau rece, simplă ori cu un strop de iaurt\ngrecesc light.","alergeni"
