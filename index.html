i sănătoasă.","pasi":"1.Fierbe legumele în supa de legume cu foi de dafin (15 min)\n2.Taie ciupercile fâșii și adaugă-le în supă, fierbe 10 minute\n3.Amestecă gălbenușurile cu smântâna și temperează cu zeamă\nfierbinte\n4.Toarnă amestecul în ciorbă, fără să mai clocotească\n5.Adaugă usturoiul pisat și oțetul\n6.Servește cu ardei iute și smântână extra","sfaturi":"Pleurotus-ul imită perfect textura de burtă\nNu fierbe după ce adaugi gălbenușurile pentru a nu se tăia\nAjustează oțetul după gust pentru acrealā perfectă","alergeni":"ou, lactoză (din smântână sau iaurt)","variante":"înlocuiește gălbenușurile cu doar albușuri pentru extra proteine și mai puține grăsimi.","macro":{"calorii_macro":"108","proteine":"2.3 g","carbohidrati":"4.3 g","fibre":"0.5 g","grasimi":"5.6 g","grasimi_saturate":"2.5 g"}},{"id":"traditionale-176","titlu":"Supă de Găluște","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Supe și Ciorbe","pagina":176,"portii":"2","timp_minute":240,"calorii":301,"ingrediente":["250 g piept și spate de pui (fără piele)","100 g morcovi","40 g țelină","40 g păstârnac","40 g ceapă","1 ou (≈ 60 g)","30 g griș","3 ml ulei de măsline (½ linguriță)","10 g pătrunjel verde","Sare, piper – după gust"],"descriere":"O supă de găluște ca la bunica acasă, cu zeamă limpede, găluște\npufoase și aromă de legume proaspete – un preparat tradițional\ncare aduce liniște și căldură în fiecare farfurie.","pasi":"1.Fierbe puiul în 1 l apă cu sare, spumează și adaugă legumele,\nlăsând 30–35 min la foc mic.\n2.Pentru găluște, amestecă ouăle cu ulei și griș, lasă 10 min, apoi\nformează-le și fierbe 10–12 min în supă.\n3.Scoate carnea, dezosează și pune-o înapoi.\n4.Presară pătrunjel verde la servire.","sfaturi":"Poți adăuga și 2 linguri de dovlecel ras în compoziția de\ngăluște pentru mai multă finețe.\nDacă dorești o supă mai aromată, pune și foi de dafin sau piper\nboabe în timpul fierberii cărnii.\nServește cu ardei iute proaspăt sau murat pentru contrast.","alergeni":"ou, gluten (griș)","variante":"pentru o variantă fără gluten, folosește griș din porumb sau fulgi de ovăz fin măcinați.","macro":{"calorii_macro":"301","proteine":"31.1 g","carbohidrati":"6 g","fibre":"2.5 g","grasimi":"6.2 g","grasimi_saturate":"1.5 g"}},{"id":"traditionale-178","titlu":"Sarmale cu Mămăligă și Iaurt","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":178,"portii":"2","timp_minute":90,"calorii":311,"ingrediente":["Sarmale","100 g carne tocată de vită (pulpă)","120 g varză murată (frunze)","25 g orez alb","25 g ceapă","25 g morcovi","25 g sos de roșii fără zahăr","5 g ulei de măsline (≈ 1 linguriță)","2–3 g cimbru uscat","5 g mărar verde","2–3 g sare","Mămăligă","50 g mălai","200 ml apă","2 g sare","Pentru servire"],"descriere":"Un preparat tradițional reinterpretat într-o variantă mai ușoară și\nechilibrată, bogat în fibre, proteine și gust autentic.","pasi":"1.Călește ceapa și morcovul în ulei, apoi adaugă orezul și carnea.\n2.Condimentează cu sare, cimbru, mărar și sos de roșii.\n3.Rulează compoziția în foi de varză și fierbe-le 40–50 minute.\n4.Separat, prepară mămăliga din mălai, apă și sare.\n5.Servește sarmalele cu iaurt grecesc și mămăligă caldă.","sfaturi":"Pentru un gust mai aromat, adaugă 1–2 căței de usturoi zdrobit\nîn umplutură.\nPoți fierbe sarmalele și în cuptor (180°C, 60–70 min) pentru un\ngust mai intens.\nSe potrivesc bine cu ardei iute murat sau salată de sfeclă cu\nhrean.","alergeni":"lactoză (iaurt), posibil gluten (orez contaminat)","variante":"poți înlocui carnea de vită cu piept de curcan pentru un preparat și mai light.","macro":{"calorii_macro":"311","proteine":"13.1 g","carbohidrati":"33.6 g","fibre":"1.4 g","grasimi":"12.7 g","grasimi_saturate":"4 g"}},{"id":"traditionale-179","titlu":"Sarmale Ușoare","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":179,"portii":"2","timp_minute":70,"calorii":254,"ingrediente":["200 g carne tocată de pui (pulpe fără piele)","40 g orez alb","50 g ceapă","100 g varză murată","100 g suc de roșii","10 g ulei de măsline","Sare, piper, cimbru, foi de dafin – după"],"descriere":"O variantă echilibrată a sarmalelor tradiționale — cu carne slabă\nde pui, puțin ulei și gust intens, ideale pentru o masă consistentă și\nsănătoasă.","pasi":"1.Călește ceapa în ulei până devine aurie.\n2.Adaugă carnea, orezul și condimentele, amestecând bine.\n3.Rulează compoziția în frunze de varză și așază-le într-o cratiță.\n4.Toarnă roșiile și puțină apă peste ele, apoi fierbe-le la foc mic\n45–60 minute.","sfaturi":"Se servesc cu iaurt grecesc 2% sau mămăliguță light.\nPentru un gust mai intens, adaugă puțină boia dulce sau\nafumată în umplutură.\nDacă vrei sarmalele mai fragede, fierbe-le la slow cooker 3–4\nore.","alergeni":"nu conține alergeni majori (atenție la orez – posibil contaminare cu gluten)","variante":"poți folosi carne de curcan tocată în loc de pui.","macro":{"calorii_macro":"254","proteine":"24 g","carbohidrati":"20.4 g","fibre":"0.7 g","grasimi":"7.2 g","grasimi_saturate":"1.5 g"}},{"id":"traditionale-180","titlu":"Mici (mititei)","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":180,"portii":"4","timp_minute":50,"calorii":262,"ingrediente":["400 g carne vită slabă tocată","200 g piept de curcan tocat","3 g bicarbonat de sodiu","20 g usturoi","5 g cimbru uscat","5 g boia dulce","3 g piper negru","10 g sare","100 ml supă rece","5 ml ulei pentru uns grătarul"],"descriere":"Mititei pregătiți după spiritul rețetelor vechi, cu carne fragedă și\nbine condimentată, exact gustul autentic care ne amintește de\ngrătarele românești în familie.","pasi":"1.Amestecă cele două tipuri de carne tocată\n2.Adaugă bicarbonatul, condimentele și usturoiul pisat\n3.Toarnă treptat supa rece, frământând continuu (10 min)\n4.Lasă la frigider minimum 2 ore\n5.Formează micii.\n6.Coace pe grătar, întorcând des, 12-15 minute","sfaturi":"Se servesc cu salată verde, murături light sau mămăliguță mică.\nPentru un gust mai intens, adaugă 1 linguriță de boia afumată.\nDacă vrei să reduci și mai mult grăsimile, gătește micii la\nairfryer.","alergeni":"nu conține alergeni majori (atenție doar la bicarbonat, dacă există sensibilitate)","variante":"poți face micii doar din carne de curcan pentru un aport mai mic de grăsimi.","macro":{"calorii_macro":"262","proteine":"29.8 g","carbohidrati":"0.3 g","fibre":"0 g","grasimi":"14.4 g","grasimi_saturate":"5 g"}},{"id":"traditionale-181","titlu":"Tochitură de Porc cu Mămăligă","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":181,"portii":"2","timp_minute":50,"calorii":298,"ingrediente":["145 g cotlet de porc","45 g ardei roșu","35 g ceapă","10 g usturoi","65 g sos de roșii fără zahăr","10 g ulei de măsline","50 g mălai","130 g varză","10 g mărar verde","Sare, piper – după gust"],"descriere":"O tochitură de porc gătită ca odinioară, cu sos aromat și\nmămăliguță caldă, exact genul de mâncare de duminică ce aduce\ntoată familia la masă.","pasi":"1.Rumenește cotletul cubulețe în ulei de măsline, adaugă ceapa,\nardeiul și usturoiul, apoi sosul de roșii și fierbe la foc mic până\ncarnea devine fragedă.\n2.Fierbe mălaiul în apă cu sare pentru mămăligă. Taie varza fin,\nfreac-o cu sare, adaugă mărar, ulei, sare și piper.\n3.Servește tochitura cu mămăligă și salată de varză.","sfaturi":"Poți adăuga și ciuperci pentru un plus de volum și fibre.\nMerge foarte bine cu o salată de murături light.\nDacă vrei un sos mai cremos, încorporează la final 1 lingură de\niaurt grecesc 2%.","alergeni":"nu conține alergeni majori (atenție la intoleranța la porumb – mălai)","variante":"poți înlocui cotletul de porc cu piept de curcan pentru un preparat extra light.","macro":{"calorii_macro":"298","proteine":"19 g","carbohidrati":"25.8 g","fibre":"2 g","grasimi":"11.3 g","grasimi_saturate":"3.5 g"}},{"id":"traditionale-182","titlu":"Tocăniță de Pui cu Mămăligă","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":182,"portii":"2","timp_minute":50,"calorii":346,"ingrediente":["235 g piept de pui dezosat, file, fără piele","50 g ceapă","80 g morcovi","8 g usturoi (≈ 2 căței mici)","50 g sos de roșii fără zahăr","8 g ulei de măsline (≈ 2 lingurițe rase)","80 g mălai","Sare, piper – după gust"],"descriere":"O tocăniță de pui simplă și gustoasă, cu sos aromat și mămăliguță\ncaldă, exact genul de preparat tradițional care aduce în farfurie\nconfortul și gustul meselor de acasă.","pasi":"1.Călește ceapa și usturoiul în ulei de măsline, adaugă pieptul de\npui cubulețe și rumenește ușor.\n2.Pune morcovii și sosul de roșii, apoi fierbe la foc mic până\ncarnea devine fragedă.\n3.Fierbe mălaiul cu apă și sare pentru mămăligă.\n4.Servește tocănița cu mămăligă caldă.","sfaturi":"Adaugă pătrunjel verde tocat la final pentru prospețime.\nPoți pune și ardei gras sau dovlecel pentru mai mult volum și\nfibre.\nDacă dorești un sos mai cremos, adaugă la final 1 lingură de\niaurt grecesc 2%.","alergeni":"nu conține alergeni majori (atenție doar la intoleranța la porumb – mălai)","variante":"mămăliga poate fi înlocuită cu orez integral sau hrișcă.","macro":{"calorii_macro":"346","proteine":"28.6 g","carbohidrati":"36.3 g","fibre":"1.5 g","grasimi":"5.7 g","grasimi_saturate":"1 g"}},{"id":"traditionale-183","titlu":"Ostropel de Pui","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":183,"portii":"2","timp_minute":50,"calorii":264,"ingrediente":["300 g pulpe de pui dezosate, fără piele","75 g ceapă","10 g usturoi","75 g sos de roșii","40 ml vin alb sec","4 g boia dulce","15 g pătrunjel verde","8 ml ulei de măsline","Sare, piper – după gust"],"descriere":"Un ostropel de pui ca în bucătăria de altădată, cu sos aromat de\nroșii, usturoi și pătrunjel, un preparat simplu, cald și reconfortant,\nperfect pentru o masă în familie.","pasi":"1.Rumenește puiul într-o tigaie antiaderentă cu puțin ulei\n2.Scoate puiul și în același ulei călește ceapa\n3.Adaugă usturoiul și boia, amestecă rapid\n4.Stinge cu vin și lasă să se evapore alcoolul\n5.Adaugă sosul de roșii și 200ml apă\n6.Pune puiul înapoi și fierbe la foc mic 30 minute\n7.Presară pătrunjel proaspăt","sfaturi":"Garnituri ideale: mămăligă light, piure de cartofi sau orez\nintegral.\nPentru o aromă mai intensă, adaugă și cimbru sau foi de dafin\nîn sos.\nDacă vrei un sos mai cremos, poți adăuga la final 1 lingură de\niaurt grecesc 2%.","alergeni":"nu conține alergeni majori (atenție la vin – sulfiți)","variante":"poți folosi piept de pui pentru o variantă și mai slabă.","macro":{"calorii_macro":"264","proteine":"29.8 g","carbohidrati":"2.8 g","fibre":"0.3 g","grasimi":"10 g","grasimi_saturate":"2 g"}},{"id":"traditionale-184","titlu":"Varză à la Cluj","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":184,"portii":"2","timp_minute":70,"calorii":254,"ingrediente":["280 g varză albă tocată","140 g carne tocată de vită slabă","30 g orez integral","35 g ceapă","20 g morcov","3 ml ulei de măsline","55 g sos de roșii fără zahăr","35 g iaurt grecesc 2%","5 g mărar verde","Sare, piper, cimbru – după gust"],"descriere":"O rețetă tradițională reinterpretată într-o variantă echilibrată,\nbogată în proteine și cu ingrediente simple, fără prăjeli și fără sosuri\ngrase.","pasi":"1.Călește ceapa și morcovul în ulei, apoi adaugă carnea și\ncondimentele.\n2.Adaugă bulionul și fierbe ușor până se leagă compoziția.\n3.Fierbe orezul separat și combină-l cu amestecul de carne.\n4.Într-un vas termorezistent, alternează straturi de varză și carne.\n5.Adaugă deasupra iaurtul amestecat cu puțin bulion și coace\n30–40 minute la 180°C.","sfaturi":"Servește cu ardei iute murat sau pâine integrală.\nPentru un gust mai intens, adaugă și usturoi tocat în sos.\nPoți înlocui iaurtul grecesc cu smântână light 12% grăsime.","alergeni":"lactoză (iaurt), posibil gluten (dacă orezul nu e certificat)","variante":"poți adăuga și varză murată pentru un gust mai autentic.","macro":{"calorii_macro":"254","proteine":"18.8 g","carbohidrati":"23 g","fibre":"0.9 g","grasimi":"9 g","grasimi_saturate":"3 g"}},{"id":"traditionale-185","titlu":"Dovlecei Umpluți","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":185,"portii":"2","timp_minute":60,"calorii":202,"ingrediente":["240 g dovlecei","120 g carne tocată de vită slabă","25 g orez","30 g ceapă","25 g morcov","60 g sos de roșii","5 ml ulei de măsline (≈ 1 linguriță)","5 g mărar verde","Sare, piper, cimbru – după gust"],"descriere":"Un preparat echilibrat și gustos, bogat în proteine și legume, ideal\npentru o masă principală ușoară și sățioasă.","pasi":"1.Taie dovleceii pe lungime, scobește-i ușor și presară un praf de\nsare. Lasă-i 10 minute să elimine excesul de apă.\n2.Toacă ceapa și morcovul, apoi călește-le în uleiul de măsline 3–\n4 minute.\n3.Adaugă carnea tocată și orezul spălat, condimentează cu sare,\npiper și cimbru, apoi gătește 8–10 minute.\n4.Așază dovleceii într-o tavă și umple-i cu compoziția obținută.\n5.Toarnă sosul de roșii peste ei și acoperă tava cu folie.\n6.Coace la 190°C timp de 30 de minute, apoi îndepărtează folia\nși mai lasă 10 minute pentru rumenire.\n7.Servește cu mărar verde presărat deasupra.","sfaturi":"Servește cu iaurt grecesc 2% pentru un contrast cremos.\nPoți adăuga și ardei gras sau țelină apio în umplutură.\nPentru un plus de aromă, adaugă 1–2 căței de usturoi zdrobit în\nsosul de roșii.","alergeni":"posibil gluten (dacă orezul nu este certificat fără gluten)","variante":"poți transforma rețeta în dovlecei gratinați, adăugând la final puțin cașcaval light.","macro":{"calorii_macro":"202","proteine":"14.6 g","carbohidrati":"13.9 g","fibre":"1.4 g","grasimi":"8.7 g","grasimi_saturate":"3 g"}},{"id":"traditionale-186","titlu":"Vinete Umplute","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":186,"portii":"2","timp_minute":60,"calorii":219,"ingrediente":["240 g vinete (≈ 2 vinete mai mici)","120 g carne tocată de vită slabă","25 g orez","30 g ceapă","25 g morcov","60 g roșie","5 ml ulei de măsline (≈ 1 linguriță)","5 g pătrunjel verde","Sare, piper, cimbru – după gust"],"descriere":"Vinete umplute după rețeta clasică de casă, cu carne fragedă,\nlegume aromate și un strop de cimbru — exact gustul cald și bogat\nal meselor de duminică în familie.","pasi":"1.Taie vinetele pe jumătate și scobește miezul.\n2.Toacă miezul și călește-l împreună cu ceapa și morcovul în ulei.\n3.Adaugă carnea tocată și orezul spălat, condimentează cu sare,\npiper și cimbru.\n4.Amestecă cu roșiile cuburi și pătrunjelul verde.\n5.Umple jumătățile de vinete și așază-le într-o tavă.\n6.Coace la 180°C timp de 35–40 min.","sfaturi":"Se servesc cu iaurt grecesc 2% deasupra sau cu o salată verde.\nPoți adăuga și ardei gras sau dovlecel în umplutură pentru mai\nmult volum și fibre.\nDacă vrei un gust mai intens, presară puțin cașcaval light ras\nînainte de ultimele 5 min de coacere.","alergeni":"posibil gluten (dacă orezul e contaminat)","variante":"înlocuiește orezul cu hrișcă pentru un aport mai mare de proteine.","macro":{"calorii_macro":"219","proteine":"14.4 g","carbohidrati":"18.3 g","fibre":"4.5 g","grasimi":"8.7 g","grasimi_saturate":"3 g"}},{"id":"traditionale-187","titlu":"Chiftele Marinate","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":187,"portii":"2","timp_minute":70,"calorii":262,"ingrediente":["Pentru chiftele","210 g carne tocată de curcan","40 g ceapă","1 ou mic (≈ 50 g)","15 g pesmet integral","2 ml ulei de măsline (pentru ungere la copt)","Sare, piper, usturoi pudră – după gust","Pentru sos","140 g sos de roșii fără zahăr","30 g ceapă","30 g morcov","2 ml ulei de măsline","1 foaie mică de dafin","½ linguriță cimbru uscat","Sare, piper – după gust"],"descriere":"O versiune ușoară a rețetei clasice, fără prăjeli — chiftele fragede,\ncoapte la cuptor și acoperite cu un sos de roșii aromat.","pasi":"1.Amestecă ingredientele pentru chiftele, formează bile și așază-\nle pe o tavă unsă cu ulei.\n2.Coace la 180°C timp de 20–25 minute până devin ușor aurii.\n3.Pentru sos, călește ceapa și morcovul în ulei, adaugă roșiile,\ndafinul și condimentele. Fierbe 10–15 minute.\n4.Adaugă chiftelele în sos și mai lasă la foc mic încă 10 minute\npentru a se îmbina aromele.","sfaturi":"Se servesc cu piure de cartofi light, orez integral sau mămăligă.\nPentru un plus de savoare, adaugă usturoi proaspăt în sos.\nDacă dorești un sos mai cremos, încorporează 1 lingură de iaurt\ngrecesc 2% la final.","alergeni":"gluten (pesmet), ou","variante":"poți înlocui pesmetul cu fulgi de ovăz măcinați pentru o variantă fără gluten.","macro":{"calorii_macro":"262","proteine":"24.4 g","carbohidrati":"5.2 g","fibre":"0.4 g","grasimi":"11.3 g","grasimi_saturate":"3 g","greutate_portie":"230 g"}},{"id":"traditionale-188","titlu":"Stufat Moldovenesc","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":188,"portii":"2","timp_minute":60,"calorii":420,"ingrediente":["250 g carne de miel","100 g ceapă verde","60 g usturoi verde","50 g morcovi","85 g sos de roșii fără zahăr","4 ml ulei de măsline (≈ 1 linguriță mică)","35 ml vin alb sec","12 g mărar și pătrunjel verde","Sare, piper, foi de dafin – după gust"],"descriere":"Un preparat tradițional, gustos și aromat, cu carne fragedă și multă\nverdeață.","pasi":"1.Rumenește carnea 2–3 minute în ulei.\n2.Adaugă ceapa, usturoiul verde și morcovul și călește 3–4 minute.\n3.Toarnă vinul alb și lasă-l 1 minut să se reducă.\n4.Adaugă roșiile cuburi, foile de dafin, sarea și piperul.\n5.Completează cu apă cât să acopere carnea și fierbe 30–35\nminute, până devine fragedă.\n6.Adaugă mărarul și pătrunjelul la final, mai lasă 1 minut pe foc și\nservește.","sfaturi":"Servește cu mămăligă light sau orez integral.\nPoți adăuga și ardei gras sau dovlecel pentru mai mult volum și\nfibre.\nDacă vrei un sos mai dens, adaugă la final 1 lingură de iaurt\ngrecesc 2%.","alergeni":"nu conține alergeni majori","variante":"dacă vrei o rețetă fără alcool, înlocuiește vinul cu supă de legume și un strop de zeamă de lămâie.","macro":{"calorii_macro":"420","proteine":"1.4 g","carbohidrati":"5.1 g","fibre":"0.8 g","grasimi":"2.1 g","grasimi_saturate":"0.5 g"}},{"id":"traditionale-189","titlu":"Friptură la Tavă","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":189,"portii":"2","timp_minute":80,"calorii":330,"ingrediente":["285 g carne de vită slabă","160 g cartofi","65 g morcovi","50 g ceapă","10 ml ulei de măsline","30 ml vin alb sec","4 g usturoi (≈ 1–2 căței)","Rozmarin, cimbru – după gust","Sare și piper – după gust"],"descriere":"O rețetă clasică reinterpretată într-o versiune ușoară, gătită lent,\nfără prăjeli, cu carne fragedă și legume caramelizate perfect.","pasi":"1.Taie carnea și legumele în bucăți potrivite și așază-le într-o\ntavă.\n2.Adaugă uleiul, vinul, usturoiul zdrobit și condimentele.\n3.Acoperă tava cu folie de aluminiu și coace 50 minute la 180°C.\n4.Îndepărtează folia și mai lasă 15–20 minute pentru rumenire.","sfaturi":"Poți adăuga și ardei gras sau dovlecel pentru extra fibre.\nDacă vrei un sos mai consistent, adaugă 1 linguriță de muștar\nDijon light în lichidul de gătire.\nGarnitura ideală: salată verde proaspătă sau murături light.","alergeni":"nu conține alergeni majori (atenție doar la vin – sulfiți)","variante":"înlocuiește carnea de porc/vită cu piept de curcan pentru mai puține grăsimi.","macro":{"calorii_macro":"330","proteine":"31.4 g","carbohidrati":"15.4 g","fibre":"1.7 g","grasimi":"12.2 g","grasimi_saturate":"4 g","greutate_portie":"300 g"}},{"id":"traditionale-190","titlu":"Pomana Porcului","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":190,"portii":"2","timp_minute":80,"calorii":353,"ingrediente":["425 g carne de porc slabă (spată sau pulpă, fără grăsime vizibilă)","6 g usturoi (≈ 2 căței)","65 ml vin roșu sec","5 ml ulei de măsline (≈ 1 linguriță)","1 foaie de dafin","½ linguriță piper boabe","Sare, cimbru, boia – după gust"],"descriere":"O rețetă clasică reinterpretată într-o versiune ușoară, gătită lent,\nfără prăjeli, cu carne fragedă și legume caramelizate perfect.","pasi":"1.Taie carnea și legumele în bucăți potrivite și așază-le într-o\ntavă.\n2.Adaugă uleiul, vinul, usturoiul zdrobit și condimentele.\n3.Acoperă tava cu folie de aluminiu și coace 50 minute la 180°C.\n4.Îndepărtează folia și mai lasă 15–20 minute pentru rumenire.","sfaturi":"Garnituri recomandate: mămăligă light, piure de cartofi cu\niaurt sau varză călită.\nPentru mai multă aromă, adaugă și rozmarin sau cimbru\nproaspăt.\nDacă vrei un sos mai legat, presară 1 linguriță de făină\nintegrală sau ½ lingură de amidon, dizolvată în apă rece.","alergeni":"nu conține alergeni majori","variante":"în loc de vin, folosește supă de legume și zeamă de lămâie, pentru o versiune fără alcool.","macro":{"calorii_macro":"353","proteine":"55.5 g","carbohidrati":"0.7 g","fibre":"0 g","grasimi":"2.5 g","grasimi_saturate":"0.5 g"}},{"id":"traditionale-191","titlu":"Rasol de Vită","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":191,"portii":"2","timp_minute":90,"calorii":241,"ingrediente":["270 g carne de vită cu os (rasol / pulpă slabă)","160 g cartofi","55 g morcovi","40 g țelină","40 g ceapă","30 g păstârnac","Sare, piper boabe, foi de dafin – după gust"],"descriere":"O rețetă tradițională, gustoasă și sănătoasă, preparată lent, fără\nprăjeli. Carnea devine fragedă, iar legumele păstrează textura și\naromele naturale.","pasi":"1.Pune carnea de vită în apă rece, adaugă sare și fierbe la foc\nmic, îndepărtând spuma formată.\n2.După 45–50 minute, adaugă legumele curățate și tăiate mare.\n3.Lasă la fiert încă 30–40 minute, până ce carnea devine\nfragedă.\n4.Servește cu legume fierte și hrean ras cu oțet.","sfaturi":"Supa rămasă se poate strecura și folosi ca ciorbă limpede.\nMerge excelent cu salată de sfeclă cu hrean alături.\nPoți adăuga și dovlecei sau fasole verde spre final, pentru mai\nmulte fibre.","alergeni":"țelină","variante":"în loc de vită, poți folosi curcan sau pui pentru o variantă mai slabă în grăsimi.","macro":{"calorii_macro":"241","proteine":"32.5 g","carbohidrati":"15.4 g","fibre":"2.4 g","grasimi":"1.4 g","grasimi_saturate":"0.5 g"}},{"id":"traditionale-192","titlu":"Ghiveci Țărănesc","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":192,"portii":"2","timp_minute":90,"calorii":104,"ingrediente":["70 g cartofi","70 g vinete","70 g dovlecei","50 g ardei gras","50 g roșii cuburi","35 g ceapă","35 g morcovi","35 g conopidă","35 g fasole verde","35 g mazăre verde","3 ml ulei de măsline (≈ ½ linguriță)","1 cățel mic de usturoi (≈ 3 g)","1 foaie de dafin","8 g pătrunjel verde"],"descriere":"Un ghiveci țărănesc plin de culoare și prospețime, cu legume gătite\nîncet, exact ca în bucătăria bunicii — o mâncare simplă, de post,\ndar incredibil de gustoasă și reconfortantă.","pasi":"1.Călește ceapa și morcovii 2–3 min în ulei, apoi adaugă vinetele,\ndovleceii, cartofii, conopida, fasolea verde și mazărea.\n2.Pune roșiile, usturoiul, dafinul și condimentele, adaugă apă și\nfierbe 25–30 min la foc mic.\n3.Scoate dafinul, potrivește gustul și presară pătrunjel verde.","sfaturi":"Poți coace legumele la cuptor înainte și apoi să le combini\npentru un gust mai intens.\nMerge foarte bine cu mămăligă light sau o felie de pâine\nintegrală.\nPentru un plus de proteine, adaugă 100 g năut fiert sau cuburi\nde piept de curcan.","alergeni":"nu conține alergeni majori (atenție doar la leguminoase – mazăre, fasole verde)","variante":"în loc de cartofi, poți folosi cartofi dulci pentru un indice glicemic mai mic.","macro":{"calorii_macro":"104","proteine":"3.1 g","carbohidrati":"14.9 g","fibre":"3.9 g","grasimi":"1.6 g","grasimi_saturate":"0.3 g"}},{"id":"traditionale-193","titlu":"Iahnie de Fasole","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":193,"portii":"2","timp_minute":90,"calorii":414,"ingrediente":["230 g fasole boabe uscată","70 g ceapă","45 g morcovi","45 g ardei gras","90 g sos de roșii fără zahăr","7 ml ulei de măsline (≈ 1½ lingurițe)","4 g usturoi (≈ 1–2 căței)","1 foaie de dafin","2 g cimbru uscat","7 g pătrunjel verde tocat","Sare și piper – după gust"],"descriere":"Un preparat tradițional românesc, hrănitor și aromat, ideal pentru\nzilele de post sau ca fel principal sățios, bogat în proteine vegetale\nși fibre..","pasi":"1.Dacă folosești fasole boabe uscată, las-o la înmuiat peste\nnoapte, apoi fierbe-o 60–70 de minute până devine moale.\n2.Într-o tigaie mare, călește ceapa și morcovii tocați mărunt în\nuleiul de măsline 3–4 minute.\n3.Adaugă ardeiul gras și usturoiul, continuă gătirea încă 2 minute.\n4.Încorporează fasolea fiartă, roșiile cuburi (sau bulionul) și\ncondimentele: foi de dafin, cimbru, sare și piper.\n5.Fierbe la foc mic 20–25 de minute, până când sosul se îngroașă\nși aromele se combină.\n6.Presară pătrunjelul verde tocat înainte de servire.","sfaturi":"Servește cu murături light sau salată de varză crudă.\nPentru un gust mai bogat, adaugă la final 1 linguriță de boia\nafumată.\nSe potrivește și cu o mămăliguță mică ca garnitură.","alergeni":"nu conține alergeni majori (atenție doar la sensibilitatea la leguminoase)","variante":"poți înlocui fasolea albă cu fasole roșie sau năut.","macro":{"calorii_macro":"414","proteine":"26.7 g","carbohidrati":"58.8 g","fibre":"1.2 g","grasimi":"5.6 g","grasimi_saturate":"0.8 g","greutate_portie":"440 g"}},{"id":"traditionale-194","titlu":"Musaca de Cartofi","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":194,"portii":"2","timp_minute":90,"calorii":255,"ingrediente":["220 g cartofi fierți în coajă","125 g carne tocată de curcan","30 g ceapă","20 g morcov","50 g sos de roșii fără zahăr","3 ml ulei de măsline","30 g iaurt grecesc 2%","1 ou mic (≈ 50 g)","Sare, piper, cimbru – după gust"],"descriere":"O musaca de cartofi gătită ca în familiile de odinioară, cu straturi\nmoi și gustoase de cartofi și carne, coaptă încet până capătă\nacea crustă aurie care umple casa de mirosul meselor de duminică.","pasi":"1.Fierbe cartofii, curăță-i și taie rondele.\n2.Călește ceapa și morcovul, adaugă carnea, rumenește și pune\nroșiile cu condimente, lăsând 10 min să scadă.\n3.În vas, alternează straturi de cartofi și carne, apoi toarnă iaurtul\namestecat cu ouă.\n4.Coace la 180°C, 30–35 min, până capătă crustă aurie.","sfaturi":"Se poate adăuga și vinete sau dovlecei în straturi, pentru mai\nmult volum și fibre.\nPresară deasupra puțin cașcaval light ras (20 g) pentru extra\nsavoare.\nSe servește cu o salată verde sau murături light.","alergeni":"ou, lactoză","variante":"în loc de cartofi albi, poți folosi cartofi dulci pentru un indice glicemic mai mic.","macro":{"calorii_macro":"255","proteine":"17.9 g","carbohidrati":"24.7 g","fibre":"2.5 g","grasimi":"8.5 g","grasimi_saturate":"2.5 g","greutate_portie":"20 g"}},{"id":"traditionale-195","titlu":"Tocăniță de Miel cu Usturoi și Vin","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":195,"portii":"2","timp_minute":90,"calorii":470,"ingrediente":["285 g carne de miel","60 g ceapă","45 g morcovi","5 g usturoi (≈ 2 căței)","45 ml vin roșu sec","55 g sos de roșii fără zahăr","8 ml ulei de măsline","1 foaie de dafin","Cimbru și rozmarin – după gust","Sare și piper – după gust","6 g pătrunjel verde tocat"],"descriere":"O tocăniță de miel cu usturoi și vin, gătită încet ca în bucătăria de\nsărbătoare, cu arome bogate și parfumate care amintesc de\nmesele calde în familie și de tradițiile românești pascale.","pasi":"1.Taie carnea de miel bucăți medii și rumenește-le ușor în uleiul\nde măsline.\n2. Adaugă ceapa și morcovii tocați, gătește 5 min la foc mic.\n3. Pune usturoiul zdrobit, roșiile cuburi și condimentele (dafin,\ncimbru, rozmarin).\n4. Toarnă vinul și 200 ml apă, apoi lasă să fiarbă la foc mic 60–\n70 min, până carnea este fragedă și sosul scade.\n5.Potrivește de sare și piper, presară pătrunjel verde la servire.","sfaturi":"Se servește cu mămăligă sau orez integral.\nPentru un gust mai fresh, adaugă la final zeamă de lămâie.\nDacă vrei o variantă mai light, redu uleiul la 15 ml și adaugă 1\nlingură de iaurt grecesc 2% în sos.","alergeni":"nu conține alergeni majori","variante":"vinul roșu se poate înlocui cu supă de legume pentru o rețetă fără alcool.","macro":{"calorii_macro":"469.5","proteine":"1 g","carbohidrati":"3.9 g","fibre":"0.7 g","grasimi":"4.1 g","grasimi_saturate":"1.2 g"}},{"id":"traditionale-196","titlu":"Mâncărică de Fasole cu Carne de Vită","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":196,"portii":"2","timp_minute":90,"calorii":171,"ingrediente":["80 g fasole boabe fiartă","130 g pulpă de vită slabă","75 g sos de roșii fără zahăr adăugat","30 g ceapă","30 g morcovi","5 g usturoi (≈ 1 cățel)","5 ml ulei de măsline","150 ml apă","Sare, piper – după gust","Pătrunjel verde – opțional, pentru decor"],"descriere":"O mâncărică de fasole cu carne de vită, gătită molcom ca în\ncasele de la țară, cu sos gros și arome bogate, exact preparatul\ncald și sățios care aduce confort în orice zi.","pasi":"1.Taie carnea de vită cubulețe mici și rumenește-o ușor în ulei de\nmăsline.\n2. Adaugă ceapa și morcovii tocați, gătește 3–4 min.\n3. Pune usturoiul zdrobit, fasolea fiartă și sosul de roșii.\n4. Adaugă apa și condimentează cu sare și piper.\n5. Fierbe la foc mic 25–30 min, până carnea devine fragedă și\nsosul se îngroașă.","sfaturi":"Poți adăuga și ardei gras sau țelină apio pentru mai multă\naromă.\nSe servește excelent cu salată verde sau murături light.\nDacă vrei un sos mai dens, adaugă 1 lingură de iaurt grecesc\n2% la final.","alergeni":"nu conține alergeni majori (atenție la sensibilitatea la leguminoase","variante":"fasolea se poate înlocui cu năut sau linte roșie pentru diversitate.","macro":{"calorii_macro":"170.7","proteine":"18.9 g","carbohidrati":"12.2 g","fibre":"3.6 g","grasimi":"3.2 g","grasimi_saturate":"0.8 g"}},{"id":"traditionale-197","titlu":"Cotlet de Porc cu Fasole Verde Sote","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":197,"portii":"2","timp_minute":35,"calorii":138,"ingrediente":["100 g cotlet de porc slab (fără grăsime vizibilă)","130 g fasole verde","25 g ceapă","3 g usturoi (≈ 1 cățel mic)","3 ml ulei de măsline","40 g roșie","40 g castravete","40 g ardei gras","7 g mărar verde","Zeama de la ~⅓ lămâie","Sare și piper – după gust"],"descriere":"O masă completă, bogată în proteine și fibre, ușor de preparat,\nideală pentru prânz sau cină echilibrată.","pasi":"1.Gătește cotletul la tigaie antiaderentă sau grill, până devine\nfraged.\n2.Într-o altă tigaie, sotează ceapa, usturoiul și fasolea verde în\npuțin ulei, adaugă sare, piper și zeama de lămâie.\n3.Servește alături de legumele crude tăiate (roșie, castravete,\nardei) și presară mărar verde.","sfaturi":"Poți marina cotletul înainte de gătire în zeamă de lămâie,\nusturoi și ierburi aromatice pentru un plus de aromă.\nFasolea verde poate fi înlocuită cu sparanghel sau broccoli.\nDacă vrei un preparat și mai dietetic, gătește cotletul la cuptor\nsau airfryer fără ulei.","alergeni":"nu conține alergeni majori","variante":"înlocuiește cotletul de porc cu piept de curcan pentru mai puține grăsimi.","macro":{"calorii_macro":"137.4","proteine":"11.8 g","carbohidrati":"6.6 g","fibre":"2.2 g","grasimi":"5.7 g","grasimi_saturate":"1.6 g"}},{"id":"traditionale-198","titlu":"Ardei Umpluți cu Pui la Cuptor","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Feluri Principale Clasice","pagina":198,"portii":"2","timp_minute":60,"calorii":198,"ingrediente":["80 g ardei roșu","170 g pulpă de pui","20 g orez alb","60 g ceapă roșie","4 g usturoi (≈ 1 cățel mic)","40 g sos de roșii fără zahăr adăugat","10 g cașcaval ras","2 g mărar verde","2 g piper negru","2 g boia de ardei","1 g cimbru uscat","4 g sare","2 ml ulei de măsline"],"descriere":"O variantă ușoară și echilibrată a clasicilor ardei umpluți, bogată în\nproteine și arome, potrivită pentru prânzuri sănătoase.","pasi":"1.Taie capacul ardeilor și curăță-i de semințe.\n2.Toacă ceapa și usturoiul, apoi călește-le ușor în uleiul de măsline\n2–3 minute.\n3.Adaugă pulpa de pui tocată, orezul spălat și condimentele\n(boia, cimbru, sare, piper), apoi amestecă bine.\n4.Încorporează sosul de roșii și gătește 5–6 minute până se leagă\ncompoziția.\n5.Umple ardeii cu amestecul de pui și așază-i într-o tavă\ntapetată.\n6.Toarnă puțină apă în tavă, acoperă cu folie și coace 30 de\nminute la 190°C.\n7.Îndepărtează folia, presară cașcavalul și mai coace 10 minute\npentru gratinare.\n8.Servește cu mărar verde proaspăt deasupra.","sfaturi":"Poți adăuga și morcov ras sau dovlecel tocat fin în compoziție.\nSe servesc cu iaurt grecesc 2% sau o salată verde proaspătă.\nDacă vrei să reduci grăsimile, folosește doar piept de pui.","alergeni":"lactoză (din cașcaval), posibil gluten (din sosuri procesate, dacă nu sunt simple)","variante":"pentru o rețetă fără lactate, elimină cașcavalul sau folosește o alternativă vegetală light.","macro":{"calorii_macro":"197.5","proteine":"19.4 g","carbohidrati":"14.9 g","fibre":"1.5 g","grasimi":"5.6 g","grasimi_saturate":"1.8 g"}},{"id":"traditionale-200","titlu":"Saramură de Crap","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Pește - Dunăre și Marea Neagră","pagina":200,"portii":"2","timp_minute":45,"calorii":243,"ingrediente":["320 g crap proaspăt (bucăți cu os)","100 g roșii","60 g ardei gras","½ ardei iute","6 g usturoi (≈ 2 căței)","4 ml ulei de măsline (≈ ¾ linguriță)","4 g sare grunjoasă","6 g pătrunjel verde tocat"],"descriere":"Un preparat tradițional românesc plin de savoare, cu gust intens și\nechilibru perfect între sărat, dulce și picant. O alegere excelentă\npentru prânz sau cină, bogată în proteine și grăsimi sănătoase.","pasi":"1.Presară sarea grunjoasă peste bucățile de pește și lasă-le 15\nminute la temperatura camerei.\n2.Coace ardeiul gras și ardeiul iute pe plită sau în cuptor, apoi\ncurăță-le și toacă-le mărunt.\n3.Pune roșiile într-o tigaie cu uleiul de măsline și fierbe-le 10\nminute, până se formează un sos gros.\n4.Adaugă ardeii copți, usturoiul zdrobit și 300 ml apă fierbinte\npeste sos. Fierbe încă 5–6 minute.\n5.În paralel, frige bucățile de crap pe grill sau în cuptor până se\nrumenesc ușor.\n6.Toarnă sosul fierbinte peste pește și presară pătrunjel verde\ntocat.\n7.Servește cu mămăligă caldă sau legume coapte.","sfaturi":"Pentru un gust mai intens, adaugă frunze de leuștean la final.\nDacă vrei varianta mai dietetică, redu uleiul la 5 ml sau\nelimină-l complet.\nPoți folosi și somn sau caras în loc de crap.","alergeni":"pește","variante":"pentru o aromă mai fresh, înlocuiește jumătate din roșii cu roșii cherry coapte.","macro":{"calorii_macro":"243","proteine":"27.8 g","carbohidrati":"2.9 g","fibre":"0.6 g","grasimi":"10 g","grasimi_saturate":"2 g"}},{"id":"traditionale-201","titlu":"Plachie de Crap","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Pește - Dunăre și Marea Neagră","pagina":201,"portii":"2","timp_minute":50,"calorii":233,"ingrediente":["280 g crap (bucăți cu os)","50 g ceapă","90 g roșie","40 g ardei gras","3 g usturoi (≈ 1 cățel mare)","30 ml vin alb sec","4 ml ulei de măsline","1 foaie mică de dafin","Sare, piper, cimbru – după gust","5 g pătrunjel verde tocat"],"descriere":"Un preparat tradițional savuros, bogat în arome mediteraneene, cu\nsos de roșii și vin alb, perfect pentru o masă principală echilibrată și\nsănătoasă.","pasi":"1.Curăță ceapa, ardeiul și usturoiul, apoi toacă-le mărunt.\n2.Într-o tigaie, călește ceapa în uleiul de măsline 3–4 minute,\npână devine translucidă.\n3.Adaugă ardeiul, usturoiul, roșiile și condimentele (foaia de dafin,\ncimbrul, sarea și piperul). Lasă sosul să fiarbă 10–12 minute la foc\nmic.\n4.Adaugă vinul alb și amestecă ușor.\n5.Așază bucățile de crap într-o tavă, toarnă sosul peste ele și\nacoperă cu folie.\n6.Coace la 190°C timp de 25 de minute, apoi îndepărtează folia\nși mai lasă 10 minute pentru rumenire.\n7.Servește plachia caldă, presărată cu pătrunjel verde proaspăt.","sfaturi":"Se servește cu mămăligă sau orez simplu.\nPentru un plus de aromă, adaugă și măsline negre feliate în sos.\nPoți înlocui vinul alb cu zeamă de lămâie pentru o variantă mai\ndietetică.","alergeni":"pește, sulfiți (din vin)","variante":"rețeta merge foarte bine și cu știucă, somn sau păstrăv.","macro":{"calorii_macro":"233","proteine":"24.4 g","carbohidrati":"2.6 g","fibre":"0.6 g","grasimi":"9 g","grasimi_saturate":"2 g"}},{"id":"traditionale-202","titlu":"Nisetru la Grătar","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Pește - Dunăre și Marea Neagră","pagina":202,"portii":"2","timp_minute":50,"calorii":497,"ingrediente":["380 g nisetru (file sau rondele)","10 ml ulei de măsline","Zeama de la ½ lămâie","4 g usturoi zdrobit (≈ 1–2 căței)","Sare și piper – după gust","7 g pătrunjel verde tocat"],"descriere":"Nisetru fraged la grătar, marinat simplu cu lămâie și usturoi, un\npreparat cu gust curat și elegant, inspirat din tradiția românească a\npeștelui proaspăt gătit la jar.","pasi":"1.Spală bucățile de nisetru, tamponează-le cu șervețel și\ncondimentează-le cu sare și piper.\n2.Prepară o marinadă din ulei, zeamă de lămâie și usturoi zdrobit.\n3.Unge peștele cu marinada și lasă-l la rece 20–30 min.\n4.Gătește pe grătar încins sau pe grill 4–5 min pe fiecare parte\n(în funcție de grosimea bucăților).\n5.Servește cald, presărat cu pătrunjel verde tocat.","sfaturi":"Garnitura ideală: legume la grătar sau salată verde.\nPentru un gust mai intens, adaugă cimbru sau rozmarin în\nmarinadă.\nMerge foarte bine cu o garnitură de mămăligă light sau orez\nintegral.","alergeni":"pește","variante":"se poate găti și la airfryer: 180°C, 12–14 min.","macro":{"calorii_macro":"497","proteine":"0.25 g","carbohidrati":"0.4 g","fibre":"0.1 g","grasimi":"5 g","grasimi_saturate":"0.7 g"}},{"id":"traditionale-203","titlu":"Scrumbie la Grătar cu Mujdei Light","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Pește - Dunăre și Marea Neagră","pagina":203,"portii":"2","timp_minute":25,"calorii":521,"ingrediente":["Pește","410 g scrumbii proaspete (≈ 4 bucăți mici–medii)","Mujdei","22 g usturoi","55 g iaurt grecesc 2%","10 ml ulei de măsline","10 ml zeamă de lămâie","Sare, piper – după gust"],"descriere":"O rețetă tradițională reinterpretată într-o variantă echilibrată și\nușoară, bogată în Omega-3 și proteine de calitate. Mujdeiul light\ncu iaurt grecesc adaugă savoare fără exces de grăsimi.","pasi":"1.Curăță scrumbiile, îndepărtează solzii și eviscerează-le, apoi\ntamponează-le cu un șervet.\n2.Presară sare și piper pe fiecare parte și unge-le ușor cu ulei de\nmăsline.\n3.Pune-le pe grătarul încins și gătește 4–5 minute pe fiecare\nparte, până devin aurii.\n4.Între timp, pregătește mujdeiul: pisează usturoiul, apoi\namestecă-l cu iaurtul grecesc, zeama de lămâie, uleiul și\ncondimentele.\n5.Servește scrumbiile fierbinți, stropite cu mujdeiul light și\npresărate cu verdeață proaspătă (opțional).","sfaturi":"Garnitura ideală: legume la grătar sau mămăligă.\nPoți face mujdeiul și cu iaurt + pătrunjel verde tocat pentru un\ngust mai fresh.\nDacă vrei un mujdei mai light, elimină uleiul și adaugă 1 lingură\nîn plus de iaurt.","alergeni":"pește, lactoză","variante":"pentru un gust mai intens, adaugă ardei iute tocat în mujdei.","macro":{"calorii_macro":"521","proteine":"2.85 g","carbohidrati":"1.1 g","fibre":"0 g","grasimi":"5.55 g","grasimi_saturate":"1 g"}},{"id":"traditionale-204","titlu":"Storceag Tradițional","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Pește - Dunăre și Marea Neagră","pagina":204,"portii":"2","timp_minute":55,"calorii":218,"ingrediente":["200 g sturion (rondele)","60 g cartofi","30 g morcovi","15 g țelină","25 g ceapă","20 g ardei gras","40 g roșie","10 g orez","80 ml borș","20 g iaurt grecesc 2%","½ gălbenuș (≈ 10 g)","Zeama de la ~¼ lămâie","Sare, piper, foi de dafin – după gust","4 g leuștean verde tocat"],"descriere":"O supă tradițională pescărească, bogată și aromată, cu sturion\nfraged, legume și dres cremos.","pasi":"1.Fierbe ceapa, morcovii, țelina, ardeiul, cartofii și orezul în 1 L\napă, împreună cu foile de dafin.\n2.După 15 minute, adaugă bucățile de sturion și continuă\nfierberea încă 10–12 minute.\n3.Toarnă borșul și zeama de lămâie și mai fierbe 2–3 minute.\n4.Pentru dres, amestecă iaurtul cu gălbenușul și puțină zeamă\nfierbinte, apoi încorporează în supă.\n5.Potrivește de sare și piper și adaugă leușteanul tocat la final.","sfaturi":"Poți adăuga și ardei iute pentru un gust mai intens.\nDacă nu ai sturion, folosește somn sau crap, dar scoate capul și\noasele înainte de servire.\nSe servește fierbinte, cu pâine integrală sau ardei iute murat.","alergeni":"pește, ou, lactoză (din iaurt)","variante":"pentru o variantă și mai light, elimină gălbenușul și folosește doar iaurt grecesc.","macro":{"calorii_macro":"218","proteine":"2.6 g","carbohidrati":"11.85 g","fibre":"1.05 g","grasimi":"1.65 g","grasimi_saturate":"0.3 g"}},{"id":"traditionale-205","titlu":"Pește Marinat","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Pește - Dunăre și Marea Neagră","pagina":205,"portii":"2","timp_minute":60,"calorii":193,"ingrediente":["190 g file de crap","50 g ceapă","35 g morcov","25 g țelină","10 ml ulei de măsline","35 ml oțet","50 ml apă","1 foaie mică de dafin","¼ linguriță boabe de piper","2 g sare"],"descriere":"O rețetă tradițională, aromată și ușor acidulată, ideală pentru\nconservare naturală și savurare în zilele următoare. O sursă\nexcelentă de proteine și grăsimi sănătoase.","pasi":"1.Curăță peștele, taie-l în bucăți potrivite și presară sare peste el.\nLasă-l 15 minute la rece.\n2.Taie legumele rondele subțiri (ceapa, morcovul și țelina).\n3.Pune legumele într-o cratiță cu uleiul, oțetul, apa, foile de dafin,\npiperul și un praf de sare.\n4.Fierbe amestecul 10–12 minute, apoi lasă-l să se răcească puțin.\n5.Așază peștele într-un vas de sticlă sau ceramică și toarnă\nmarinada caldă peste el, acoperindu-l complet.\n6.Lasă preparatul la frigider cel puțin 12 ore înainte de servire\npentru a se pătrunde aromele.","sfaturi":"Poți adăuga și ardei kapia sau dovlecel pentru mai multă\nculoare.\nSe servește foarte bine cu mămăligă sau orez simplu.\nPentru o variantă mai ușoară, redu uleiul la 30 ml și\ncompletează cu puțină apă.","alergeni":"pește, țelină","variante":"oțetul poate fi înlocuit cu zeamă de lămâie pentru un gust mai fresh.","macro":{"calorii_macro":"193","proteine":"16.6 g","carbohidrati":"4.35 g","fibre":"0.6 g","grasimi":"9.8 g","grasimi_saturate":"1.8 g"}},{"id":"traditionale-206","titlu":"Somon la Cuptor","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Pește - Dunăre și Marea Neagră","pagina":206,"portii":"2","timp_minute":30,"calorii":568,"ingrediente":["425 g file de somon","15 ml ulei de măsline","10 ml zeamă de lămâie + câteva felii subțiri","6 g usturoi (≈ 2 căței)","Sare, piper – după gust","10 g mărar verde tocat"],"descriere":"O rețetă simplă și elegantă, bogată în acizi grași Omega-3 și\nproteine de calitate. Ideală pentru o cină sănătoasă și ușor de\ndigerat, cu gust proaspăt de lămâie și ierburi aromatice.","pasi":"1.Preîncălzește cuptorul la 190°C.\n2.Așază fileurile de somon într-o tavă tapetată cu hârtie de copt.\n3.Stropește cu uleiul de măsline și zeama de lămâie, apoi\ncondimentează cu sare, piper și usturoiul tocat.\n4.Adaugă feliile de lămâie deasupra și acoperă tava cu folie de\naluminiu.\n5.Coace 20–22 de minute, apoi îndepărtează folia și mai lasă 5\nminute pentru o crustă ușor rumenă.\n6.Presară mărar verde proaspăt înainte de servire.","sfaturi":"Garnitura ideală: legume la abur sau orez integral.\nPoți adăuga și ardei kapia sau roșii cherry în tavă pentru un plus\nde culoare.\nDacă dorești o crustă mai crocantă, lasă încă 2–3 min la grill\ndupă coacere.","alergeni":"pește","variante":"pentru un gust mai intens, marinează somonul 30 min în iaurt grecesc + usturoi + lămâie înainte de coacere.","macro":{"calorii_macro":"568","proteine":"42.5 g","carbohidrati":"0.2 g","fibre":"0 g","grasimi":"35 g","grasimi_saturate":"6.5 g"}},{"id":"traditionale-207","titlu":"Chifteluțe cu Ton","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Pește - Dunăre și Marea Neagră","pagina":207,"portii":"4","timp_minute":30,"calorii":193,"ingrediente":["320 g ton în suc propriu (scurs, din 2 conserve)","150 g cartofi fierți","60 g ou întreg + 30 g albuș","40 g ceapă verde tocată","15 g pătrunjel verde tocat","30 g pesmet integral","10 ml ulei de măsline (pentru ungere/coacere)","Sare, piper, usturoi pudră – după gust"],"descriere":"Chifteluțe cu ton, inspirate din bucătăria de post și gustările simple\nde odinioară, crocante la exterior și fragede în interior — o\nreinterpretare ușoară, dar plină de savoare.","pasi":"1.Zdrobește cartofii fierți și amestecă-i cu tonul scurs.\n2.Adaugă oul, albușul, ceapa verde, pătrunjelul și condimentele.\n3.Încorporează pesmetul și frământă ușor până obții o\ncompoziție legată.\n4.Modelează biluțe, așază-le pe o tavă tapetată cu hârtie de\ncopt și unge-le ușor cu ulei de măsline.\n5.Coace la 190°C timp de 18–20 min, întorcându-le la jumătatea\ntimpului, până devin aurii.","sfaturi":"Se servesc cu salată verde, iaurt grecesc light cu usturoi sau\nlegume la cuptor.\nPoți înlocui cartofii cu năut fiert pasat pentru mai multe fibre.\nDacă dorești o variantă crocantă, gătește-le în airfryer la\n180°C timp de 12–14 min.","alergeni":"pește, ou, gluten (din pesmet)","variante":"pesmetul poate fi înlocuit cu fulgi de ovăz măcinați pentru o versiune fără gluten.","macro":{"calorii_macro":"193","proteine":"23.3 g","carbohidrati":"7.9 g","fibre":"0.9 g","grasimi":"4.2 g","grasimi_saturate":"1 g"}},{"id":"traditionale-209","titlu":"Mămăliguță cu Brânză și Smântână","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Garnituri Inteligente","pagina":209,"portii":"2","timp_minute":30,"calorii":174,"ingrediente":["65 g mălai","260 ml apă","2 g sare","40 g telemea light","25 g iaurt grecesc 2%","3 g unt light"],"descriere":"O mămăliguță caldă cu brânză și smântână, exact ca în serile\nliniștite de la bunici, simplă, sățioasă și plină de gustul autentic al\nbucătăriei românești.","pasi":"1.Fierbe apa cu sarea într-un vas adânc.\n2.Adaugă mălaiul treptat, amestecând cu un tel pentru a evita\ncocoloașele.\n3.Fierbe 15–20 min la foc mic, până obții o mămăligă legată.\n4.Adaugă untul light și amestecă bine.\n5.Servește mămăliga caldă, împărțită în 2 porții, cu telemea rasă\nși iaurt grecesc deasupra.","sfaturi":"Poți adăuga și pătrunjel verde tocat pentru prospețime.\nDacă vrei un gust mai intens, folosește telemea afumată light.\nSe servește excelent cu murături light sau ca garnitură la carne\nslabă la grătar","alergeni":"lactoză, gluten (în funcție de procesarea mălaiului)","variante":"pentru un plus de proteine, adaugă în mămăligă 50 g brânză de vaci slabă.","macro":{"calorii_macro":"174","proteine":"7.3 g","carbohidrati":"26 g","fibre":"0.35 g","grasimi":"4.6 g","grasimi_saturate":"2.3 g"}},{"id":"traditionale-210","titlu":"Balmoș","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Garnituri Inteligente","pagina":210,"portii":"2","timp_minute":30,"calorii":247,"ingrediente":["65 g mălai fin","250 ml lapte degresat","30 g iaurt grecesc 2%","25 g telemea light","20 g caș afumat light (sau telemea degresată)","4 g unt light","2 g sare"],"descriere":"O variantă light și gustoasă a preparatului tradițional, cremos, sățios\nși ușor de preparat.","pasi":"1.Fierbe laptele cu sarea.\n2. Adaugă mălaiul în ploaie și amestecă până se îngroașă.\n3.Încorporează iaurtul, telemeaua și cașul, continuând să\namesteci la foc mic.\n4.Adaugă untul la final\n5. Mai lasă 1 minut pe foc până devine cremos.","sfaturi":"Pentru mai multă aromă, adaugă mărar verde sau ceapă verde\ntocată la final.\nDacă vrei o variantă mai proteică, poți încorpora 50 g brânză\ncottage slabă.\nMerge perfect alături de murături light sau o salată verde.","alergeni":"lactoză, gluten (din mălai, în funcție de procesare)","variante":"în loc de unt, poți folosi 10 ml ulei de măsline extravirgin – mai sănătos pentru inimă.","macro":{"calorii_macro":"247","proteine":"9.8 g","carbohidrati":"31 g","fibre":"0.35 g","grasimi":"5.1 g","grasimi_saturate":"2.6 g"}},{"id":"traditionale-211","titlu":"Zacuscă","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Garnituri Inteligente","pagina":211,"portii":"12","timp_minute":60,"calorii":90,"ingrediente":["1.4 kg vinete","1.05 kg ardei kapia","700 g gogoșari","355 g ceapă","280 g roșii pasate / suc de roșii fără zahăr","4 căței usturoi","14 ml ulei de măsline extravirgin","Sare după gust"],"descriere":"O variantă simplă și sănătoasă de zacuscă, potrivită ca gustare sau\nmic dejun, pregătită fără prăjire în exces și cu gust intens de vinete\ncoapte.","pasi":"1.Coace vinetele, ardeii și gogoșarii, apoi curăță-i și lasă-i la\nscurs.\n2.Toacă legumele după preferință (fin sau mai mare).\n3.Călește ceapa 4–5 minute în ulei.\n4.Adaugă vinetele, ardeii, gogoșarii și sucul de roșii.\n5.Fierbe la foc mic 35–45 minute, amestecând periodic.\n6.Adaugă usturoiul zdrobit și sare după gust.\n7.Lasă să se răcească înainte de servire.","sfaturi":"Poți adăuga usturoi copt sau pătrunjel verde pentru un plus de\naromă.\nSe potrivește foarte bine cu roșii proaspete și pâine integrală\nprăjită.\nDacă vrei o textură mai fină, pasează vinetele cu blenderul\nvertical.","alergeni":"nu conține alergeni majori (atenție doar la sensibilitatea la ceapă crudă)","variante":"în loc de ceapă crudă, poți adăuga ceapă coaptă pentru un gust mai dulce și mai ușor digerabil.","macro":{"calorii_macro":"90","proteine":"2.4 g","carbohidrati":"11.8 g","fibre":"3.7 g","grasimi":"1.2 g","grasimi_saturate":"0.1 g","greutate_portie":"100 g"}},{"id":"traditionale-212","titlu":"Tocăniță de Ciuperci cu Mămăligă","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Garnituri Inteligente","pagina":212,"portii":"2","timp_minute":40,"calorii":201,"ingrediente":["305 g ciuperci","50 g ceapă","50 g roșie","20 g pastă de roșii","2 g usturoi (≈ ½–1 cățel mic)","5 g ulei de măsline","70 g mălai","Sare, piper – după gust"],"descriere":"Un preparat tradițional românesc, consistent și aromat, potrivit\npentru zilele de post sau pentru un prânz ușor și hrănitor.","pasi":"1.Toacă ceapa și usturoiul, apoi călește-le în uleiul de măsline 2–3\nminute, până devin ușor aurii.\n2.Adaugă ciupercile feliate și gătește-le 10–12 minute, până se\nînmoaie și scad în volum.\n3.Încorporează roșiile tocate și pasta de roșii, amestecând bine.\n4.Fierbe la foc mic 10–12 minute, până se îngroașă sosul;\npotrivește gustul cu sare și piper.\n5.Separat, fierbe mălaiul în apă cu un praf de sare, amestecând\nconstant, până obții o mămăligă densă.\n6.Servește tocănița caldă, alături de mămăligă.","sfaturi":"Pentru un gust mai intens, adaugă mărar sau pătrunjel verde la\nfinal.\nPoți îmbogăți rețeta cu ardei gras sau dovlecel.\nDacă dorești mai multe proteine, servește cu un ou poșat sau 50\ng brânză slabă.","alergeni":"nu conține alergeni majori","variante":"înlocuiește mămăliga cu orez integral sau hrișcă pentru mai multe fibre.","macro":{"calorii_macro":"201","proteine":"7.8 g","carbohidrati":"34.5 g","fibre":"2.2 g","grasimi":"2.9 g","grasimi_saturate":"0.4 g","greutate_portie":"300 g"}},{"id":"traditionale-213","titlu":"Tocană de Legume cu Orez","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Garnituri Inteligente","pagina":213,"portii":"2","timp_minute":45,"calorii":147,"ingrediente":["75 g ceapă","150 g ardei gras","150 g morcovi","75 g roșie","50 g orez basmati","7 ml ulei de măsline","2 g sare","1 g piper negru"],"descriere":"Un preparat de post hrănitor și colorat, bogat în fibre și vitamine,\nideal pentru prânz sau cină ușoară.","pasi":"1.Curăță și taie ceapa, morcovii și ardeii în bucăți mici.\n2.Călește ceapa în uleiul de măsline 2–3 minute, apoi adaugă\nmorcovii și ardeii.\n3.Gătește legumele 10 minute la foc mediu, amestecând din când\nîn când.\n4.Adaugă roșiile tocate, orezul spălat și 200 ml apă fierbinte.\n5.Fierbe la foc mic 15–20 de minute, până când orezul este\nmoale și lichidul scade.\n6.Condimentează cu sare și piper după gust, apoi lasă tocană să\nse odihnească 5 minute înainte de servire.","sfaturi":"Poți adăuga dovlecel sau vinete pentru un plus de volum și fibre.\nDacă vrei mai multe proteine, adaugă năut fiert (100 g) sau\npiept de pui la grătar (100 g).\nPentru o aromă mediteraneană, condimentează cu oregano și\nbusuioc.","alergeni":"nu conține alergeni majori (atenție doar la sensibilitatea la piper)","variante":"înlocuiește orezul basmati cu orez integral sau hrișcă pentru mai multe fibre.","macro":{"calorii_macro":"147","proteine":"2.9 g","carbohidrati":"21.4 g","fibre":"2.6 g","grasimi":"3.9 g","grasimi_saturate":"0.6 g","greutate_portie":"300 g"}},{"id":"traditionale-214","titlu":"Salată de Vinete","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Garnituri Inteligente","pagina":214,"portii":"2","timp_minute":45,"calorii":61,"ingrediente":["300 g vinete","20 g ceapă tocată fin","5 ml ulei de măsline extravirgin","5 ml zeamă de lămâie","1–2 g sare (după gust)"],"descriere":"O rețetă clasică românească, fină și aromată, ideală pentru un mic\ndejun sau o gustare ușoară, pregătită cu ulei de măsline și zeamă\nde lămâie pentru un gust echilibrat.","pasi":"1.Coace vinetele, curăță-le și lasă-le la scurs cel puțin 30 de\nminute pentru a elimina zeama amară.\n2.Toacă vinetele mărunt cu un cuțit de lemn sau din plastic.\n3.Adaugă treptat uleiul de măsline, amestecând continuu până se\nobține o textură cremoasă.\n4.Încorporează ceapa tocată fin, zeama de lămâie și sarea.\n5.Omogenizează bine și lasă salata 10–15 minute la rece înainte\nde servire.","sfaturi":"Dacă vrei și mai puține calorii, poți adăuga doar 10 ml ulei +\n50 g iaurt grecesc 2%.\nSe potrivește de minune cu roșii proaspete și pâine integrală\nprăjită.\nPoți adăuga usturoi copt sau pătrunjel verde pentru o notă\ndiferită de aromă.","alergeni":"nu conține alergeni majori (atenție la sensibilitatea la ceapă crudă)","variante":"dacă vrei o aromă mai intensă, înlocuiește zeama de lămâie cu oțet de mere.","macro":{"calorii_macro":"61","proteine":"1.6 g","carbohidrati":"7.6 g","fibre":"4.5 g","grasimi":"2.5 g","grasimi_saturate":"0.4 g","greutate_portie":"110 g"}},{"id":"traditionale-215","titlu":"Fasole Bătută","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Garnituri Inteligente","pagina":215,"portii":"2","timp_minute":50,"calorii":214,"ingrediente":["240 g fasole albă fiartă","45 g ceapă roșie (din care 35 g în compoziție + 10 g pentru decor)","6 g usturoi (≈ 1 cățel mare)","12 g pastă de tahini","12 ml zeamă de lămâie","70 ml apă de la fiertul fasolei","3 g pătrunjel verde tocat (decor)","Sare, piper, boia – după gust"],"descriere":"O rețetă tradițională reinterpretată într-o variantă mai ușoară, cu\npastă de tahini în loc de ulei, pentru o textură cremoasă și un gust\nbogat, dar echilibrat.","pasi":"1.Fierbe fasolea până devine foarte moale, apoi scurge-o și\npăstrează o parte din apa de fierbere.\n2.Curăță usturoiul și ceapa. Ceapa se călește ușor separat, cu\ncondimentele dorite (boia, piper, sare).\n3.Într-un blender, mixează fasolea fiartă cu usturoiul, pasta de\ntahini, zeama de lămâie și puțin din apa de la fiert.\n4.Ajustează consistența adăugând treptat apă până obții o\ncremă fină.\n5.Potrivește gustul cu sare, piper și, la final, adaugă ceapa călită\ndeasupra.\n6.Decorează cu ceapă roșie feliată și pătrunjel.","sfaturi":"Pentru o textură mai fină, adaugă puțin iaurt grecesc 2% (scade\ncaloriile și îmbogățește cu proteine).\nSe potrivește excelent cu murături light sau ca garnitură la\ngrătare de carne slabă.\nPoți face o variantă mai aromată adăugând chimen măcinat\nsau ardei copți tocați.","alergeni":"susan (din tahini)","variante":"pasta de tahini se poate înlocui cu 10 ml ulei de măsline sau complet eliminată, pentru un preparat mai sărac în grăsimi.","macro":{"calorii_macro":"214","proteine":"11.6 g","carbohidrati":"29.9 g","fibre":"9.9 g","grasimi":"6.4 g","grasimi_saturate":"0.9 g","greutate_portie":"180 g"}},{"id":"traditionale-216","titlu":"Salată de Icre","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Garnituri Inteligente","pagina":216,"portii":"2","timp_minute":35,"calorii":201,"ingrediente":["48 g icre crude (știucă / crap / hering)","32 ml ulei de măsline","16 g pâine integrală (miez, înmuiat și bine stors)","16 g ceapă mică","10 ml zeamă de lămâie","Sare – după gust"],"descriere":"O pastă fină, aerată și savuroasă, perfectă pentru tartine rapide\nsau gustări festive.","pasi":"1.Stoarce bine miezul de pâine și pune-l în robot cu icrele.\n2.Mixează și adaugă treptat uleiul până devine o cremă aerată.\n3.Adaugă zeama de lămâie, ceapa tocată foarte fin și potrivește\nde sare.","sfaturi":"Pentru o variantă mai light, înlocuiește jumătate din ulei cu iaurt\ngrecesc 2% – scazi aproape 40% din calorii.\nSe poate adăuga și mărar tocat fin pentru un gust mai fresh.\nSalata se păstrează la frigider, în cutie ermetică, max. 2 zile.","alergeni":"pește, gluten, lactoză (dacă pâinea e înmuiată în lapte)","variante":"pâinea albă poate fi înlocuită cu pâine integrală sau fără gluten, iar laptele cu lapte vegetal neîndulcit.","macro":{"calorii_macro":"201","proteine":"1 g","carbohidrati":"3.3 g","fibre":"0 g","grasimi":"16.3 g","grasimi_saturate":"2.4 g","greutate_portie":"60 g"}},{"id":"traditionale-217","titlu":"Cartofi Țărănești","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Garnituri Inteligente","pagina":217,"portii":"2","timp_minute":40,"calorii":263,"ingrediente":["470 g cartofi","90 g ceapă","5 g usturoi (≈ 2 căței)","18 ml ulei de măsline","½ linguriță boia dulce","Sare, piper – după gust","9 g pătrunjel verde"],"descriere":"O garnitură sățioasă și aromată, cu gust clasic românesc, ideală\nlângă orice tip de carne.","pasi":"1.Fierbe cartofii în coajă, apoi curăță-i și taie-i cuburi.\n2.Călește ceapa în ulei până devine aurie.\n3.Adaugă usturoiul, boiaua și cartofii și amestecă ușor până se\nrumenesc.\n4.Potrivește de sare și piper și presară pătrunjelul tocat.","sfaturi":"Pentru o variantă mai ușoară, folosește spray de gătit în loc de\nulei sau doar 15 ml ulei + puțină apă.\nSe pot adăuga și ardei copți sau ciuperci sotate pentru un plus\nde gust.\nSunt delicioși ca fel de bază vegetarian sau ca garnitură la\ncarne la grătar.","alergeni":"nu conține alergeni majori","variante":"Dacă ai sensibilitate la usturoi, îl poți înlocui cu aceeași cantitate de praz sotat sau ceapă verde, menținând aroma caracteristică și un aport caloric foarte apropiat.","macro":{"calorii_macro":"262.6","proteine":"3.1 g","carbohidrati":"35.5 g","fibre":"2.5 g","grasimi":"9 g","grasimi_saturate":"1.3 g"}},{"id":"traditionale-218","titlu":"Salată de Varză cu Morcov","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Garnituri Inteligente","pagina":218,"portii":"2","timp_minute":20,"calorii":80,"ingrediente":["200 g varză albă","75 g morcov","50 g măr verde","50 g iaurt grecesc 2%","5 g muștar Dijon","10 ml oțet de mere","5 g miere","2 g semințe de chimen (opțional)","Sare, piper – după gust"],"descriere":"O salată de varză cu morcov, crocantă și proaspătă, exact ca\ngarnitura simplă și gustoasă care însoțea mesele tradiționale de\nacasă.","pasi":"1.Taie varza foarte fin (julienne)\n2.Rade morcovul și mărul pe răzătoarea mare\n3.Presară varza cu sare și las-o 15 minute să se înmoaie\n4.Stoarce excesul de apă din varză\n5.Amestecă iaurtul cu muștarul, oțetul și mierea\n6.Combină totul și lasă la frigider 30 minute","sfaturi":"Poți adăuga semințe de floarea-soarelui crude sau nuci\nmărunțite pentru un plus de textură.\nÎnlocuiește mierea cu îndulcitor pudră dacă vrei să reduci și mai\nmult caloriile.\nEste o garnitură excelentă pentru preparate din carne slabă\nsau pește.","alergeni":"muștar, lactoză (din iaurt)","variante":"iaurtul poate fi înlocuit cu iaurt vegetal (soia, cocos light) pentru o rețetă fără lactate.","macro":{"calorii_macro":"79.3","proteine":"3.7 g","carbohidrati":"15.3 g","fibre":"1.3 g","grasimi":"0.7 g","grasimi_saturate":"0.2 g"}},{"id":"traditionale-219","titlu":"Murături Asortate","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Garnituri Inteligente","pagina":219,"portii":"10","timp_minute":20,"calorii":128,"ingrediente":["1 kg castraveți","1 kg gogonele","800 g conopidă","500 g morcovi","300 g țelină (rădăcină + frunze)","500 g ardei kapia","100 g usturoi","50 g hrean","2 tije mărar uscat","3 buc foi de dafin","1 linguriță boabe de piper","60 g sare grunjoasă (pentru 3 l apă)"],"descriere":"Murături asortate ca în cămara bunicilor, crocante și aromate,\npregătite simplu, cu legume de sezon și mirodenii care aduc gustul\nautentic al iernilor românești.","pasi":"1.Taie legumele (conopidă, morcovi, țelină, ardei) și așază-le în\nborcane cu usturoi, hrean, mărar, dafin și piper.\n2.Fierbe 3 l apă cu 60 g sare, răcește și toarnă peste legume.\n3.Lasă 2–3 zile la temperatura camerei pentru fermentare, apoi\nmută la rece.","sfaturi":"Pentru o aromă mai intensă, poți adăuga coriandru boabe sau\nsemințe de muștar.\nDacă vrei murături mai puțin sărate, redu sarea la 50 g / 3 l\napă (dar atenție, termenul de păstrare va fi mai scurt).\nSe păstrează cel mai bine într-un loc răcoros și întunecat.","alergeni":"nu conțin alergeni majori. Atenție: datorită fermentării, murăturile pot fi bogate în sodiu – consumul trebuie moderat, mai ales la persoanele cu hipertensiune","variante":null,"macro":{"calorii_macro":"127.6","proteine":"2.4 g","carbohidrati":"10.7 g","fibre":"1.7 g","grasimi":"0.1 g","grasimi_saturate":"0 g"}},{"id":"traditionale-220","titlu":"Salată de Sfeclă cu Hrean","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Garnituri Inteligente","pagina":220,"portii":"2","timp_minute":25,"calorii":111,"ingrediente":["300 g sfeclă roșie","17 g hrean ras","13 ml oțet de mere","9 ml ulei de cocos","Sare – după gust"],"descriere":"O salată răcoritoare și aromată, ideală pentru detoxifiere și\nîntărirea imunității, cu gust intens de sfeclă coaptă și hrean\nproaspăt.","pasi":"1.Fierbe sau coace sfecla până se înmoaie, apoi curăț-o de\ncoajă și las-o să se răcească complet.\n2.Rade sfecla pe răzătoarea mare și adaugă hreanul ras fin.\n3.Toarnă oțetul de mere și uleiul de cocos.\n4.Amestecă bine toate ingredientele până se omogenizează.\n5.Potrivește gustul cu sare și lasă salata la rece 10–15 minute\npentru ca aromele să se întrepătrundă.","sfaturi":"Poți adăuga semințe de dovleac sau nuci mărunțite pentru un\nplus de textură (atenție la calorii).\nÎnlocuiește uleiul de floarea-soarelui cu ulei de măsline\nextravirgin pentru o variantă mai sănătoasă.\nSe servește rece, ca garnitură sau gustare răcoritoare.","alergeni":"nu conține alergeni majori (atenție doar la sensibilitatea la hrean)","variante":"oțetul de mere poate fi înlocuit cu zeamă de lămâie pentru o aromă mai fresh.","macro":{"calorii_macro":"111.3","proteine":"0 g","carbohidrati":"0 g","fibre":"0 g","grasimi":"0 g","grasimi_saturate":"0 g"}},{"id":"traditionale-222","titlu":"Plăcintă cu Brânză la Cuptor","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Pâine și Aluaturi","pagina":222,"portii":"8","timp_minute":50,"calorii":150,"ingrediente":["Pentru aluat (8 bucăți):","200 g făină integrală","150 g iaurt grecesc 2%","60 g ou (1 ou mediu)","5 g praf de copt","3 g sare","Pentru umplutură:","300 g brânză de vaci slabă","60 g ou (1 ou mediu)","15 g mărar după gust: sare, piper"],"descriere":"O variantă light, aerată și aromată a brânzoaicelor clasice,\nperfectă pentru un mic dejun sau desert echilibrat.","pasi":"1.Amestecă făina integrală cu praful de copt și sarea.\n2.Într-un bol separat, combină iaurtul grecesc cu oul și\nomogenizează.\n3.Adaugă treptat ingredientele lichide peste cele uscate și\nfrământă până obții un aluat moale și uniform.\n4.Împarte aluatul în 8 bile egale și întinde-le sub formă de discuri.\n5.Pentru umplutură, amestecă brânza de vaci cu oul, mărarul și\ncondimentele.\n6.Pune câte o lingură de umplutură în mijlocul fiecărui disc și\nîmpăturește marginile către interior, formând plăcintele.\n7.Așază-le într-o tavă tapetată cu hârtie de copt.\n8.Coace la 180°C timp de 20–25 minute, până se rumenesc\nfrumos.","sfaturi":"Pentru un gust mai dulce, poți adăuga în umplutură îndulcitor și\ncoajă de lămâie.\nPentru o variantă mai sățioasă, adaugă verdețuri mixte (ceapă\nverde, pătrunjel).\nSe servesc calde sau reci, fiind ideale ca gustare proteică.","alergeni":"gluten, lactoză, ou","variante":"făina integrală se poate înlocui cu făină fără gluten, iar brânza cu tofu cremos pentru o variantă vegană.","macro":{"calorii_macro":"150.3","proteine":"12 g","carbohidrati":"19.9 g","fibre":"3 g","grasimi":"2.3 g","grasimi_saturate":"0 g"}},{"id":"traditionale-223","titlu":"Plăcintă cu Mere","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Pâine și Aluaturi","pagina":223,"portii":"8","timp_minute":55,"calorii":203,"ingrediente":["300 g foi de plăcintă light (subțiri, fără adaos de grăsime)","1 kg mere rase","40 g îndulcitor pudră (eritritol/stevia)","2 lingurițe scorțișoară","20 ml ulei de măsline (pentru uns foile)","20 g pesmet integral","1 vârf de cuțit de sare"],"descriere":"O plăcintă ușoară, aromată și echilibrată, cu foi light și umplutură\nbogată în mere, perfectă pentru orice moment al zilei.","pasi":"1.Rade merele și scurge ușor excesul de suc.\n2.Amestecă merele cu îndulcitorul, scorțișoara și un praf de sare.\n3.Întinde o foaie de plăcintă într-o tavă unsă ușor cu ulei.\n4.Presară pesmetul integral pe prima foaie pentru a absorbi\numiditatea.\n5.Adaugă jumătate din compoziția de mere, apoi pune încă un\nstrat de foi unse cu puțin ulei.\n6.Toarnă restul de umplutură și acoperă cu ultimele foi unse ușor\ncu ulei.\n7.Fă câteva crestături la suprafață pentru a evita umflarea în\ntimpul coacerii.\n8.Coace plăcinta la 180°C timp de 25–30 minute, până devine\naurie.\n9.Las-o să se răcească înainte de porționare.","sfaturi":"Pentru un plus de aromă, adaugă esență de vanilie sau coajă\nde lămâie.\nPoți presăra nuci mărunțite (atenție la calorii) în umplutură.\nSe servește caldă sau rece, simplă sau cu un strop de iaurt\ngrecesc light.","alergeni":"gluten (foi de plăcintă, pesmet)","variante":"foile se pot înlocui cu foi fără gluten; îndulcitorul cu miere (atenție la aportul caloric).","macro":{"calorii_macro":"203","proteine":"0 g","carbohidrati":"15.1 g","fibre":"1.3 g","grasimi":"2.5 g","grasimi_saturate":"0 g"}},{"id":"traditionale-224","titlu":"Plăcintă cu Varză","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Pâine și Aluaturi","pagina":224,"portii":"8","timp_minute":55,"calorii":155,"ingrediente":["300 g foi de plăcintă light (subțiri, fără adaos de grăsime)","800 g varză albă tocată fin","100 g ceapă","15 ml ulei de măsline (pentru călire și uns foile) sare, piper – după gust","20 g mărar verde tocat"],"descriere":"O plăcintă sățioasă, aromată și light, cu foi subțiri și varză călită fin,\nperfectă ca gustare sau cină.","pasi":"1.Călește ceapa în 5 ml ulei timp de 2 minute.\n2.Adaugă varza tocată fin și gătește 10–12 minute, până se\nînmoaie; potrivește de sare și piper.\n3.Închide focul și încorporează mărarul tocat.\n4.Unge o tavă cu puțin ulei și așază un prim strat de foi de\nplăcintă.\n5.Pune jumătate din varză, apoi adaugă un nou strat de foi unse\nușor cu ulei.\n6.Adaugă restul de umplutură și acoperă cu ultimele foi.\n7.Taie plăcinta în pătrate și stropește cu 1–2 lingurițe de ulei.\n8.Coace la 180°C timp de 25–30 minute, până devine aurie.","sfaturi":"Pentru un gust mai intens, adaugă chimen măcinat în umplutură.\nPoți combina varza albă cu varză roșie pentru o plăcintă mai\ncolorată și bogată în antioxidanți.\nSe servește caldă sau rece, simplă ori cu un strop de iaurt\ngrecesc light.","alergeni":"gluten (foi de plăcintă)","variante":"foile pot fi înlocuite cu foi fără gluten; uleiul poate fi redus și înlocuit parțial cu spray pentru gătit.","macro":{"calorii_macro":"155","proteine":"1.5 g","carbohidrati":"5.8 g","fibre":"0 g","grasimi":"2 g","grasimi_saturate":"0 g"}},{"id":"traditionale-225","titlu":"Plăcintă cu Cartofi","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Pâine și Aluaturi","pagina":225,"portii":"8","timp_minute":55,"calorii":206,"ingrediente":["300 g foi de plăcintă light (subțiri, fără adaos de grăsime)","700 g cartofi fierți","100 g ceapă","15 ml ulei de măsline (pentru călirea cepei și uns foile)","Sare, piper – după gust","20 g pătrunjel verde tocat"],"descriere":"O plăcintă simplă, sățioasă și light, cu cartofi fierți și foi subțiri,\nperfectă ca gustare sau cină rapidă.","pasi":"1.Fierbe cartofii, apoi pasează-i grosier cu puțină sare și piper.\n2.Călește ceapa în 5 ml ulei până devine aurie.\n3.Amestecă ceapa călită cu cartofii și pătrunjelul tocat.\n4.Unge o tavă cu puțin ulei și așază primul strat de foi de plăcintă.\n5.Adaugă jumătate din umplutură, apoi pune un nou strat de foi\nunse ușor cu ulei.\n6.Pune restul de umplutură și acoperă cu ultimele foi.\n7.Taie plăcinta în pătrate și stropește ușor cu 1–2 lingurițe de ulei.\n8.Coace la 180°C timp de 25–30 minute, până devine aurie.","sfaturi":"Pentru un plus de proteine, poți adăuga 150 g brânză de vaci\nslabă în amestecul de cartofi.\nDacă dorești o variantă mai aromată, adaugă cimbru sau\nrozmarin.\nSe servește caldă sau rece, ca fel principal sau garnitură.","alergeni":"gluten (foi de plăcintă)","variante":"foile se pot înlocui cu foi fără gluten; uleiul poate fi înlocuit cu spray pentru gătit, pentru reducerea grăsimilor.","macro":{"calorii_macro":"206","proteine":"1.1 g","carbohidrati":"17.7 g","fibre":"1.8 g","grasimi":"1.9 g","grasimi_saturate":"0 g"}},{"id":"traditionale-226","titlu":"Plăcintă cu Dovleac","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Pâine și Aluaturi","pagina":226,"portii":"8","timp_minute":55,"calorii":176,"ingrediente":["pentru toamnă sau pentru un desert rapid și sănătos.","300 g foi de plăcintă light (subțiri, fără adaos de grăsime)","1 kg dovleac plăcintar ras","40 g îndulcitor pudră (eritritol/stevia)","2 lingurițe scorțișoară","20 ml ulei de măsline (pentru uns foile)","20 g pesmet integral sare – un vârf de cuțit"],"descriere":"O plăcintă aromată, ușoară și parfumată cu scorțișoară, perfectă","pasi":"1.Călește dovleacul ras cu îndulcitorul, scorțișoara și un praf de\nsare timp de 10 minute, până se înmoaie.\n2.Unge foile de plăcintă cu puțin ulei și așază trei foi în tavă.\n3.Întinde jumătate din dovleacul călit, presară pesmet, apoi\nacoperă cu alte 2–3 foi.\n4.Repetă cu restul umpluturii și acoperă cu ultimele foi unse cu ulei.\n5.Taie plăcinta în porții și coace la 180°C timp de 25–30 minute,\npână devine aurie.","sfaturi":"Pentru un plus de aromă, adaugă esență de vanilie sau\nnucșoară în dovleac.\nSe servește caldă sau rece, simplă ori cu un strop de iaurt\ngrecesc light deasupra.\nPoate fi păstrată la frigider 2–3 zile și reîncălzită ușor la cuptor.","alergeni":"gluten (foi de plăcintă, pesmet)","variante":"foile se pot înlocui cu foi fără gluten, iar îndulcitorul cu miere (atenție la calorii).","macro":{"calorii_macro":"175.5","proteine":"1.3 g","carbohidrati":"0.05 g","fibre":"0 g","grasimi":"2.5 g","grasimi_saturate":"0 g"}},{"id":"traditionale-227","titlu":"Poale-n Brâu","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Pâine și Aluaturi","pagina":227,"portii":"12","timp_minute":100,"calorii":187,"ingrediente":["Pentru aluat:","400 g făină integrală","180 ml lapte degresat călduț","20 g drojdie proaspătă (sau 7 g uscată)","20 g îndulcitor pudră (eritritol/stevia)","1 ou întreg + 1 albuș","30 ml ulei de măsline sau floarea soarelui","5 g sare","Pentru umplutură:","350 g brânză de vaci slabă","30 g îndulcitor pudră (sau după gust)","1 ou întreg","1 linguriță coajă de lămâie","20 g stafide hidratate"],"descriere":"O versiune mai ușoară și modernizată a celebrelor poale-n brâu\nmoldovenești, cu aluat pufos și umplutură cremoasă din brânză\nslabă.","pasi":"1.Amestecă făina integrală cu sarea într-un bol încăpător.\n2.Dizolvă drojdia în laptele cald împreună cu îndulcitorul și lasă\n5–10 minute până devine spumoasă.\n3.Bate oul întreg cu albușul și adaugă peste făină.\n4.Toarnă amestecul cu drojdie și începe frământarea.\n5.Adaugă treptat uleiul și continuă frământarea până obții un\naluat elastic și omogen.\n6.Acoperă bolul și lasă aluatul la dospit 45–60 minute, într-un loc\ncald.\n7.Pentru umplutură, amestecă brânza de vaci cu îndulcitorul, oul,\ncoaja de lămâie și stafidele (opțional).\n8.După dospire, împarte aluatul în 12 bucăți egale și întinde-le în\nforme rotunde.\n9.Pune câte o lingură generoasă de umplutură în centru și\nîmpăturește colțurile către mijloc, sigilând bine.\n10.Așază plăcintele într-o tavă tapetată cu hârtie de copt și mai\nlasă-le la crescut 15 minute.\n11.Coace la 180°C timp de 20–25 minute, până se rumenesc\nuniform.","sfaturi":"Pentru o aromă mai intensă, poți adăuga esență de vanilie în\numplutură.\nSe potrivesc de minune servite cu iaurt grecesc light sau fructe\nproaspete.\nPot fi păstrate la frigider 2 zile și reîncălzite ușor la cuptor.","alergeni":"gluten, lactoză, ou","variante":"brânza de vaci poate fi înlocuită cu brânză cottage slabă sau, pentru o variantă fără lactate, cu tofu cremos + iaurt vegetal.","macro":{"calorii_macro":"186.3","proteine":"10.2 g","carbohidrati":"25.6 g","fibre":"4 g","grasimi":"4.1 g","grasimi_saturate":"0 g"}},{"id":"traditionale-228","titlu":"Alivenci Moldovenești","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Pâine și Aluaturi","pagina":228,"portii":"8","timp_minute":50,"calorii":242,"ingrediente":["200 g mălai fin","80 g făină integrală","250 g brânză de vaci slabă (max.","2–4% grăsime)","100 g telemea light","120 g iaurt grecesc 2%","3 ouă (2 întregi + 1 albuș)","250 ml lapte 1,5%","20 g unt light (pentru uns tava)","1 praf de sare"],"descriere":"O reinterpretare ușoară și proteică a celebrelor alivenci\nmoldovenești, cu ingrediente simple și gust autentic.","pasi":"1.Amestecă într-un bol mălaiul, făina integrală și sarea.\n2.Într-un alt vas, mixează brânza de vaci, telemeaua light, iaurtul\nși ouăle până obții o compoziție omogenă.\n3.Adaugă treptat laptele degresat și omogenizează.\n4.Toarnă compoziția lichidă peste ingredientele uscate și\namestecă bine.\n5.Unge tava cu uleiul light și toarnă compoziția în strat uniform.\n6.Coace la 180°C timp de 30–35 minute, până se rumenește ușor\nla suprafață.\n7.Lasă 5–10 minute la răcit înainte de a porționa.","sfaturi":"Pentru un plus de aromă, adaugă mărar proaspăt sau ceapă\nverde tocată.\nSe potrivește perfect servită cu iaurt grecesc rece.\nPoate fi păstrată la frigider 2 zile și încălzită la cuptor sau\ntigaie.","alergeni":"gluten, lactoză, ou","var \n2.Adaugă făina, praful de copt și sarea și amestecă până obții un\naluat cremos.\n3.Toarnă blatul într-o tavă tapetată.\nUmplutură:\n1.Amestecă brânza de vaci cu îndulcitorul, ouăle, iaurtul, grișul,\nesența și coaja de lămâie.\n2.Toarnă compoziția peste blat în strat uniform.\nCoacere:\n1.Coace la 170°C timp de 40–45 minute, până se încheagă și\ndevine ușor aurie.\n2.Lasă la răcit complet înainte de tăiere.","sfaturi":"Poți adăuga în umplutură stafide hidratate sau fructe de\npădure.\nServește cu un sos de fructe fără zahăr pentru un plus de\nprospețime.\nMerge foarte bine și cu o linguriță de smântână light sau iaurt\ndeasupra.","alergeni":"gluten (făină, griș), ouă, lactoză (brânză, iaurt, unt)","variante":"înlocuiește grișul cu fulgi fini de ovăz pentru mai multe fibre.","macro":{"calorii_macro":"176.6","proteine":"12.7 g","carbohidrati":"16.9 g","fibre":"2.5 g","grasimi":"5.2 g","grasimi_saturate":"1.6 g"}},{"id":"traditionale-238","titlu":"Cornulețe cu Gem","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Deserturi cu Mai Puțin Zahăr","pagina":238,"portii":"12","timp_minute":55,"calorii":172,"ingrediente":["350 g făină integrală","100 g unt cu 65% grăsime","100 g iaurt grecesc 2%","30 g îndulcitor pudră (eritritol/stevia)","1 ou","1 vârf de cuțit de sare","5 g praf de copt","200 g gem fără zahăr (de prune, caise sau vișine) îndulcitor pudră – pentru decor"],"descriere":"Cornulețe fragede, aromate și mult mai ușoare decât varianta\nclasică, umplute cu gem fără zahăr și perfecte pentru o gustare\nrapidă.","pasi":"1.Amestecă făina integrală cu praful de copt și un praf de sare.\n2.Adaugă untul rece tăiat cubulețe și freacă-l cu făina până obții\no textură nisipoasă.\n3.Încorporează iaurtul grecesc, îndulcitorul și oul, frământând\npână se formează un aluat omogen.\n4.Împarte aluatul în două bile și întinde-le în cercuri mari.\n5.Taie fiecare cerc în 12 triunghiuri egale.\n6.Pune câte o linguriță de gem la baza fiecărui triunghi și rulează\nspre vârf pentru a forma cornulețele.\n7.Așază-le pe o tavă tapetată cu hârtie de copt.\n8.Coace la 180°C timp de 15–18 minute, până devin ușor aurii.\n9.După răcire, pudrează-le cu îndulcitor dacă dorești.","sfaturi":"Pentru un plus de aromă, adaugă coajă de lămâie sau esență\nde vanilie în aluat.\nPoți folosi și gem de fructe de pădure fără zahăr pentru mai\nmulte fibre.\nDacă vrei cornulețe crocante, unge-le cu puțin lapte degresat\nînainte de coacere.","alergeni":"gluten (făină), lactoză (iaurt, unt), ou","variante":"înlocuiește untul cu ulei de cocos dezodorizat pentru o aromă diferită.","macro":{"calorii_macro":"171.6","proteine":"5.1 g","carbohidrati":"21.3 g","fibre":"3.5 g","grasimi":"6.4 g","grasimi_saturate":"3.2 g"}},{"id":"traditionale-239","titlu":"Sarailie","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Deserturi cu Mai Puțin Zahăr","pagina":239,"portii":"12","timp_minute":55,"calorii":234,"ingrediente":["Pentru prăjitură:","300 g foi de plăcintă light (subțiri, fără adaos de grăsime)","200 g nucă măcinată","60 g ulei de cocos dezodorizat","Pentru sirop:","150 ml apă","30 g miere","30 g îndulcitor lichid (eritritol/stevia)","1 linguriță esență de vanilie","1 felie lămâie"],"descriere":"Un desert aromat, crocant la exterior și suculent în interior,\nreinterpretat într-o variantă mai ușoară.\nPrăjitura:","pasi":"1.Amestecă nuca măcinată cu 20–30 g îndulcitor, dacă dorești\nmai multă dulceață.\n2.Întinde foile de plăcintă, unge-le cu uleiul de cocos topit și\npresară un strat de nucă.\n3.Rulează foile strâns și taie în bucăți de mărimea dorită.\n4.Așază-le într-o tavă și unge-le ușor deasupra cu ulei de cocos.\n5.Coace la 180°C timp de 20–25 minute, până devin aurii.\nSirop:\n1.Fierbe apa cu mierea, îndulcitorul lichid, vanilia și felia de\nlămâie 3–4 minute.\n2.Lasă siropul să se răcorească puțin și toarnă-l peste sarailia\nscoasă din cuptor.\n3.Lasă desertul să absoarbă siropul 2–3 ore înainte de servire.","sfaturi":"Adaugă sco
