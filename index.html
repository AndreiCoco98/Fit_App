<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitApp">
<meta name="theme-color" content="#0d2a4a">
<meta name="description" content="FitApp - retete sanatoase din cartile BT FIT, calculator calorii si macronutrienti">
<title>FitApp</title>
<style>

:root{
  --green-900:#0d2a4a;
  --green-800:#123f66;
  --green-700:#1a5c93;
  --green-600:#2878b8;
  --green-500:#4a9bd6;
  --cream:#faf6ee;
  --cream-2:#f1ead9;
  --ink:#1c241f;
  --muted:#6b7a71;
  --line:#e4ddc9;
  --amber:#c9872f;
  --red:#b5482f;
  --radius:14px;
  --shadow:0 2px 10px rgba(16,42,33,0.08);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,Arial,sans-serif;
  overscroll-behavior-y:none;}
#app{min-height:100vh;display:flex;flex-direction:column;}
button{font-family:inherit;}
.hidden{display:none !important;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:var(--green-900);
  padding:calc(10px + var(--safe-top)) 16px 10px;
  color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
.topbar h1{margin:0 0 2px;font-size:19px;font-weight:700;letter-spacing:0.2px;}
.topbar .sub{font-size:12px;color:#bcd3c6;margin-bottom:10px;}
.searchwrap{position:relative;}
.searchwrap input{
  width:100%;padding:10px 38px 10px 14px;border-radius:12px;border:none;
  font-size:15px;background:#fff;color:var(--ink);
}
.searchwrap svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);opacity:0.45;}
.chiprow{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;
  scrollbar-width:none;}
.chiprow::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,0.1);
  color:#e7f1ea;font-size:13px;border:1px solid rgba(255,255,255,0.18);white-space:nowrap;
  cursor:pointer;
}
.chip.active{background:var(--amber);color:#2b1a05;border-color:var(--amber);font-weight:600;}
.filterbtn{
  flex:0 0 auto;padding:7px 13px;border-radius:999px;background:transparent;
  color:#fff;font-size:13px;border:1px solid rgba(255,255,255,0.35);white-space:nowrap;
  display:flex;align-items:center;gap:5px;cursor:pointer;
}
.filterbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);display:none;}
.filterbtn.has-filters .dot{display:inline-block;}

/* ---------- Tabs ---------- */
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
.tab{flex:1;text-align:center;padding:11px 4px;font-size:13.5px;color:var(--muted);
  border-bottom:3px solid transparent;cursor:pointer;font-weight:600;}
.tab.active{color:var(--green-700);border-color:var(--green-600);}

/* ---------- List ---------- */
.content{flex:1;padding:12px 14px calc(24px + var(--safe-bottom));}
.resultcount{font-size:12.5px;color:var(--muted);margin:2px 2px 10px;}
.cards{display:flex;flex-direction:column;gap:10px;}
.card{
  background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
  padding:12px;display:flex;gap:12px;cursor:pointer;border:1px solid #f0ead7;
  position:relative;
}
.card:active{transform:scale(0.99);}
.card .thumb{
  width:58px;height:58px;border-radius:12px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--green-600),var(--green-800));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;
}
.card .body{flex:1;min-width:0;}
.card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.card h3{margin:0;font-size:15px;line-height:1.25;font-weight:700;color:var(--ink);}
.card .book{font-size:11.5px;color:var(--green-600);font-weight:700;margin-bottom:3px;
  text-transform:uppercase;letter-spacing:0.3px;}
.card .meta{display:flex;gap:10px;margin-top:6px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;}
.card .meta span{display:flex;align-items:center;gap:4px;}
.favbtn{background:none;border:none;font-size:20px;line-height:1;padding:2px;color:#d9d2bb;flex:0 0 auto;}
.favbtn.active{color:var(--amber);}
.allergy-flag{font-size:11px;color:var(--red);margin-top:4px;font-weight:600;}

.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty .emoji{font-size:40px;margin-bottom:10px;}

/* ---------- Filter drawer (left side) ---------- */
.sheet-overlay{
  position:fixed;inset:0;background:rgba(16,30,24,0.45);z-index:50;
  display:flex;align-items:stretch;justify-content:flex-start;
}
.sheet{
  background:#fff;width:min(88vw, 360px);height:100%;max-height:100vh;
  border-radius:0 20px 20px 0;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:6px 0 24px rgba(16,42,33,0.22);
  animation:slideInLeft 0.24s ease-out;
}
@keyframes slideInLeft{from{transform:translateX(-24px);opacity:0.3;}to{transform:translateX(0);opacity:1;}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + var(--safe-top)) 16px 14px;border-bottom:1px solid var(--line);
  background:var(--green-900);color:#fff;flex:0 0 auto;}
.sheet-head h2{margin:0;font-size:17px;color:#fff;display:flex;align-items:center;gap:7px;}
.sheet-head button{background:rgba(255,255,255,0.14);border:none;font-size:12.5px;color:#fff;
  font-weight:700;padding:6px 11px;border-radius:999px;}
.sheet-body{overflow-y:auto;flex:1;padding:16px 16px 10px;}
.filter-group{margin-bottom:22px;}
.filter-group h4{margin:0 0 10px;font-size:12.5px;text-transform:uppercase;letter-spacing:0.4px;
  color:var(--muted);font-weight:800;display:flex;align-items:center;gap:6px;}
.optionrow{display:flex;flex-wrap:wrap;gap:8px;}
.option{
  padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);font-size:13.2px;
  color:var(--ink);cursor:pointer;background:#fff;
}
.option.active{background:var(--green-700);border-color:var(--green-700);color:#fff;font-weight:600;}
.range-labels{display:flex;justify-content:space-between;font-size:13px;color:var(--ink);margin-bottom:4px;font-weight:600;}
input[type=range]{width:100%;accent-color:var(--green-600);}
.sheet-foot{padding:12px 16px calc(14px + var(--safe-bottom));border-top:1px solid var(--line);
  display:flex;gap:10px;flex:0 0 auto;background:#fff;}
.btn{flex:1;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:700;cursor:pointer;}
.btn-primary{background:var(--green-700);color:#fff;}
.btn-ghost{background:var(--cream-2);color:var(--ink);}

/* Wider screens: filter drawer behaves like a roomier docked panel */
@media (min-width: 760px){
  .sheet{width:340px;border-radius:0 24px 24px 0;}
}

/* ---------- Detail ---------- */
.detail-overlay{position:fixed;inset:0;background:var(--cream);z-index:60;
  display:flex;flex-direction:column;overflow:hidden;}
.detail-head{
  background:var(--green-900);color:#fff;padding:calc(12px + var(--safe-top)) 14px 16px;
  position:relative;
}
.detail-head .backbtn{
  background:rgba(255,255,255,0.14);border:none;color:#fff;width:34px;height:34px;border-radius:50%;
  font-size:18px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;
}
.detail-head .favbtn-top{position:absolute;top:calc(12px + var(--safe-top));right:14px;
  background:rgba(255,255,255,0.14);border:none;color:#fff;width:34px;height:34px;border-radius:50%;
  font-size:18px;display:flex;align-items:center;justify-content:center;}
.detail-head .favbtn-top.active{color:var(--amber);}
.detail-head .book-tag{font-size:12px;color:#bcd3c6;text-transform:uppercase;letter-spacing:0.4px;font-weight:700;}
.detail-head h1{font-size:21px;margin:4px 0 10px;line-height:1.25;}
.detail-head .stats{display:flex;gap:16px;flex-wrap:wrap;}
.detail-head .stat{font-size:13px;color:#eaf3ee;display:flex;align-items:center;gap:5px;}
.detail-head .stat b{font-size:14.5px;}
.detail-body{flex:1;overflow-y:auto;padding:16px 16px calc(40px + var(--safe-bottom));}
.sourcebox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  font-size:12.5px;color:var(--muted);margin-bottom:16px;}
.section{margin-bottom:22px;}
.section h3{font-size:14px;text-transform:uppercase;letter-spacing:0.4px;color:var(--green-700);
  margin:0 0 10px;display:flex;align-items:center;gap:7px;}
.ing-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
.ing-list li{background:#fff;border:1px solid var(--line);padding:10px 12px;border-radius:10px;
  font-size:14px;display:flex;gap:9px;align-items:flex-start;}
.ing-list li .bullet{width:7px;height:7px;border-radius:50%;background:var(--green-500);margin-top:6px;flex:0 0 auto;}
.steps{display:flex;flex-direction:column;gap:10px;}
.step{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
.step .num{width:22px;height:22px;border-radius:50%;background:var(--green-700);color:#fff;
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.step .txt{font-size:14px;line-height:1.45;}
.desc-box{font-size:14px;line-height:1.5;color:var(--ink);font-style:italic;background:#fff;
  border-left:3px solid var(--green-500);padding:10px 12px;border-radius:0 10px 10px 0;}
.macro-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.macro-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
.macro-card .label{font-size:11.5px;color:var(--muted);text-transform:uppercase;}
.macro-card .value{font-size:16px;font-weight:700;margin-top:2px;}
.allergen-box{background:#fdeee9;border:1px solid #f3c9bb;color:#7a2d18;padding:10px 12px;
  border-radius:10px;font-size:13.5px;line-height:1.45;}
.allergen-box b{display:block;margin-bottom:3px;color:var(--red);}
.tips-box, .variant-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-size:13.5px;line-height:1.55;white-space:pre-line;color:var(--ink);}
.unknown-note{font-size:12px;color:var(--muted);font-style:italic;margin-top:6px;}
.disclaimer{font-size:11.5px;color:var(--muted);line-height:1.5;padding:14px 2px 0;border-top:1px dashed var(--line);margin-top:4px;}

/* allergy strict filter banner */
.allergy-banner{background:#fdeee9;color:#7a2d18;border-radius:10px;padding:8px 12px;font-size:12.5px;
  margin-bottom:10px;display:flex;align-items:center;gap:8px;}

@media (min-width:640px){
  .content{max-width:640px;margin:0 auto;width:100%;}
  .topbar > *{max-width:640px;margin:0 auto;}
  .tabs{max-width:640px;margin:0 auto;}
}

/* ---------- Interactive additions ---------- */
@media (prefers-reduced-motion: reduce){
  .sheet, .detail-overlay, .toast, .stepmode-card{animation:none !important;transition:none !important;}
}
.detail-overlay{animation:slideInRight 0.22s ease-out;}
@keyframes slideInRight{from{transform:translateX(18px);opacity:0.3;}to{transform:translateX(0);opacity:1;}}

.sortrow{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px;}
.sortselect{
  border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:12.5px;
  padding:6px 10px;border-radius:999px;font-weight:600;
}

.fab{
  position:fixed;right:16px;bottom:calc(18px + var(--safe-bottom));z-index:25;
  width:44px;height:44px;border-radius:50%;background:var(--green-700);color:#fff;
  border:none;font-size:20px;box-shadow:0 4px 14px rgba(16,42,33,0.35);
  display:flex;align-items:center;justify-content:center;
  transition:opacity 0.2s ease, transform 0.2s ease;
}
.fab.hidden{opacity:0;pointer-events:none;transform:translateY(10px);}

.toast{
  position:fixed;left:50%;bottom:calc(24px + var(--safe-bottom));transform:translateX(-50%) translateY(16px);
  background:var(--green-900);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;
  box-shadow:0 4px 14px rgba(0,0,0,0.25);opacity:0;pointer-events:none;transition:all 0.22s ease;z-index:100;
  max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* dual range slider */
.dualrange{position:relative;height:34px;margin:6px 0 2px;}
.dualrange .track{position:absolute;top:50%;left:0;right:0;height:4px;background:var(--line);
  border-radius:3px;transform:translateY(-50%);}
.dualrange .track-fill{position:absolute;top:50%;height:4px;background:var(--green-600);
  border-radius:3px;transform:translateY(-50%);}
.dualrange input[type=range]{
  position:absolute;top:0;left:0;width:100%;height:34px;margin:0;background:none;
  pointer-events:none;-webkit-appearance:none;appearance:none;
}
.dualrange input[type=range]::-webkit-slider-runnable-track{background:transparent;}
.dualrange input[type=range]::-moz-range-track{background:transparent;border:none;}
.dualrange input[type=range]::-webkit-slider-thumb{
  pointer-events:auto;-webkit-appearance:none;appearance:none;width:22px;height:22px;
  border-radius:50%;background:#fff;border:3px solid var(--green-700);
  box-shadow:0 1px 5px rgba(0,0,0,0.3);cursor:pointer;margin-top:0;
}
.dualrange input[type=range]::-moz-range-thumb{
  pointer-events:auto;width:22px;height:22px;border-radius:50%;background:#fff;
  border:3px solid var(--green-700);box-shadow:0 1px 5px rgba(0,0,0,0.3);cursor:pointer;
}

/* ingredient checklist */
.ing-progress{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.ing-progress .ptext{font-size:12.5px;color:var(--muted);}
.ing-progress button{background:none;border:none;color:var(--green-700);font-weight:700;font-size:12.5px;padding:4px 0;}
.progressbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px;}
.progressbar-fill{height:100%;background:var(--green-600);transition:width 0.25s ease;}
.ing-list li{transition:opacity 0.15s ease;cursor:pointer;}
.ing-list li.checked{opacity:0.52;}
.ing-list li.checked .ing-text{text-decoration:line-through;}
.ing-check{
  width:21px;height:21px;border-radius:50%;border:2px solid var(--green-600);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-top:0;
}
.ing-check.on{background:var(--green-600);}

/* step by step mode */
.steps-header{display:flex;align-items:center;justify-content:space-between;}
.stepmode-btn{
  background:var(--green-700);color:#fff;border:none;border-radius:999px;padding:7px 13px;
  font-size:12.5px;font-weight:700;
}
.stepmode-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 18px;
  font-size:18px;line-height:1.5;text-align:center;min-height:120px;
  display:flex;align-items:center;justify-content:center;margin:14px 0;
  animation:fadeStep 0.18s ease;
}
@keyframes fadeStep{from{opacity:0.3;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.stepmode-progress{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:8px;}
.stepmode-dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:4px;}
.stepmode-dots .dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.stepmode-dots .dot.active{background:var(--green-700);width:20px;border-radius:5px;}
.stepmode-dots .dot.done{background:var(--green-500);}
.stepmode-nav{display:flex;gap:10px;}
.stepmode-nav button:disabled{opacity:0.4;}

/* random/surprise pulse */
.filterbtn#surpriseBtn:active{transform:scale(0.94);}

/* ---------- Bottom navigation ---------- */
body{padding-bottom:0;}
.content{padding-bottom:calc(86px + var(--safe-bottom)) !important;}
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;
  border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + var(--safe-bottom));
  box-shadow:0 -2px 12px rgba(16,42,33,0.08);
}
.navitem{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;color:var(--muted);font-size:10.8px;font-weight:700;border-radius:12px;
  position:relative;
}
.navitem .ic{font-size:21px;line-height:1;}
.navitem.active{color:var(--green-700);background:#eaf4fc;}
.fab{bottom:calc(84px + var(--safe-bottom));}

/* ---------- Calculator / profile ---------- */
.calc-wrap{display:flex;flex-direction:column;gap:14px;}
.profile-card, .form-card{
  background:#fff;border-radius:16px;padding:18px;box-shadow:var(--shadow);border:1px solid #f0ead7;
}
.form-card h2{margin:0 0 4px;font-size:17px;}
.form-card .intro{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
.formrow{margin-bottom:15px;}
.formrow label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:0.3px;
  color:var(--muted);margin-bottom:6px;font-weight:700;}
.forminput, .select-native{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
  font-size:15px;background:#faf8f0;color:var(--ink);
}
.select-native{font-size:14.5px;}
.segmented{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;}
.segmented button{flex:1;padding:11px;border:none;background:#fff;font-size:14.5px;font-weight:700;color:var(--ink);}
.segmented button.active{background:var(--green-700);color:#fff;}
.checkbox-row{
  display:flex;gap:10px;align-items:flex-start;background:#faf6ee;border:1px solid var(--line);
  border-radius:10px;padding:12px;margin-bottom:16px;
}
.checkbox-row input{margin-top:3px;width:17px;height:17px;flex:0 0 auto;accent-color:var(--green-600);}
.checkbox-row span{font-size:12.8px;line-height:1.5;color:var(--ink);}
.form-error{color:var(--red);font-size:12.5px;margin:-6px 0 12px;font-weight:600;}
.block-box{
  background:#fdeee9;border:1px solid #f3c9bb;color:#7a2d18;padding:16px;border-radius:14px;
  font-size:13.8px;line-height:1.6;
}
.block-box h3{margin:0 0 8px;color:var(--red);font-size:15px;}

.profile-summary{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--green-900);color:#fff;border-radius:16px;padding:16px 18px;
}
.profile-summary .pinfo{font-size:12.5px;color:#cfe3d7;line-height:1.5;}
.profile-summary .pinfo b{color:#fff;font-size:14px;}
.profile-summary .actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
.profile-summary button{
  background:rgba(255,255,255,0.16);border:none;color:#fff;padding:7px 12px;border-radius:999px;
  font-size:11.5px;font-weight:700;white-space:nowrap;
}
.bmi-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.bmi-badge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;}

.scenario-grid{display:flex;flex-direction:column;gap:12px;}
.scenario-card{
  background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;position:relative;
}
.scenario-card.primary{border-color:var(--green-600);background:linear-gradient(135deg,#eaf4fc,#ffffff);}
.scenario-card .tag{
  position:absolute;top:-10px;right:16px;background:var(--green-700);color:#fff;font-size:10.5px;
  font-weight:800;padding:4px 11px;border-radius:999px;letter-spacing:0.2px;
}
.scenario-card h4{margin:0 0 2px;font-size:14px;color:var(--ink);}
.scenario-card .note{font-size:11.5px;color:var(--muted);margin-bottom:6px;}
.scenario-card .kcal{font-size:26px;font-weight:800;color:var(--green-800);}
.scenario-card .kcal small{font-size:13px;font-weight:700;color:var(--muted);margin-left:4px;}
.scenario-card .floorwarn{font-size:11px;color:var(--amber);font-weight:700;margin-top:4px;}
.macro-mini-row{display:flex;gap:8px;margin-top:12px;}
.macro-mini{flex:1;text-align:center;background:var(--cream-2);border-radius:9px;padding:8px 4px;}
.macro-mini .v{font-size:14.5px;font-weight:800;color:var(--ink);}
.macro-mini .l{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-top:1px;}

.calc-disclaimer{font-size:11.8px;color:var(--muted);line-height:1.55;background:#fff;
  border:1px dashed var(--line);border-radius:12px;padding:12px 14px;}

/* ---------- Macro visual bar (recipe detail) ---------- */
.macrobar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:4px 0 10px;background:var(--line);}
.macrobar .seg{height:100%;}
.seg-p{background:#3c6e9c;}
.seg-c{background:#c9872f;}
.seg-g{background:#b5482f;}
.macrobar-legend{display:flex;gap:14px;font-size:12px;flex-wrap:wrap;color:var(--ink);margin-bottom:4px;}
.macrobar-legend span{display:flex;align-items:center;gap:5px;}
.legend-dot{width:9px;height:9px;border-radius:3px;display:inline-block;}
.goal-compare{
  background:#eaf4fc;border:1px solid #bfe0f5;color:#0f3a5c;padding:10px 12px;border-radius:10px;
  font-size:12.8px;margin-top:10px;line-height:1.5;
}

/* ---------- Home tab ---------- */
.home-hero{
  background:linear-gradient(135deg, var(--green-900), var(--green-700));
  color:#fff;border-radius:18px;padding:26px 22px;text-align:center;margin-bottom:18px;
  box-shadow:var(--shadow);
}
.home-emoji{font-size:38px;margin-bottom:8px;}
.home-hero h2{margin:0 0 8px;font-size:21px;}
.home-hero p{margin:0;font-size:13.5px;line-height:1.55;color:#dbe9f5;max-width:420px;margin:0 auto;}
.home-actions{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.home-card{
  background:#fff;border:1px solid #f0ead7;border-radius:14px;padding:14px 16px;
  display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);cursor:pointer;
}
.home-card:active{transform:scale(0.98);}
.home-card-ic{
  width:46px;height:46px;border-radius:12px;background:var(--cream-2);
  display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 auto;
}
.home-card-body{flex:1;min-width:0;}
.home-card-body h3{margin:0 0 2px;font-size:14.5px;color:var(--ink);}
.home-card-body p{margin:0;font-size:12.3px;color:var(--muted);line-height:1.4;}
.home-card-arrow{font-size:18px;color:var(--green-600);flex:0 0 auto;}
.home-stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.home-stat{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;
  text-align:center;flex:1 1 90px;
}
.home-stat .n{font-size:18px;font-weight:800;color:var(--green-800);}
.home-stat .l{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:2px;}

te":"7 g","greutate_portie":"240 g"}},{"id":"rapide-84","titlu":"Chia Cacao & Banană","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Budinci de Chia","pagina":84,"portii":"1","timp_minute":10,"calorii":462,"ingrediente":["45 g semințe de chia","200 ml lapte de ovăz","100 g banană (aprox. 1 banană mică)","10 g cacao pudră","20 g curmale"],"descriere":"O combinație dulce și hrănitoare de semințe de chia, banană,\ncacao și curmale, bogată în fibre, proteine și antioxidanți.","pasi":"1.Amestecă semințele de chia cu laptele de ovăz într-un bol\nsau borcan.\n2.Lasă-le la hidratat cel puțin 20–30 minute sau peste\nnoapte în frigider, până devin gelatinoase.\n3.Pasează banana și curmalele și adaugă-le peste chia.\n4.Adaugă cacaua și amestecă bine până la omogenizare.\n5.Servește imediat sau păstrează la frigider până la consum.","sfaturi":"Pentru un gust mai intens de ciocolată, folosește cacao de\ncalitate și amestec-o bine după hidratarea semințelor.\nDacă vrei o dulceață mai echilibrată, taie curmalele\nfoarte mărunt și folosește banană bine coaptă, fără a mai\nadăuga alți îndulcitori.","alergeni":"semințe (chia), gluten (posibil, din laptele de ovăz)","variante":"Dacă eviți glutenul, poți înlocui laptele de ovăz cu lapte de migdale, cocos sau orez. Dacă există alergie la semințe, semințele de chia pot fi înlocuite cu fulgi fini de ovăz hidratați, pentru o consistență similară.","macro":{"calorii_macro":"462","proteine":"12.5 g","carbohidrati":"32.4 g","fibre":"16.6 g","grasimi":"15.4 g","grasimi_saturate":"3 g","greutate_portie":"360 g"}},{"id":"rapide-85","titlu":"Chia Proteică cu Căpșuni & Vanilie","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Budinci de Chia","pagina":85,"portii":"1","timp_minute":10,"calorii":300,"ingrediente":["45 g semințe de chia","200 ml lapte de ovăz","25 g pudră proteică cu aromă de vanilie","150 g căpșuni (proaspete sau congelate)"],"descriere":"O combinație hrănitoare de semințe de chia, proteine, vanilie și\ncăpșuni, bogată în fibre și proteine pentru energie susținută și\nsațietate.","pasi":"1.Amestecă semințele de chia cu laptele de ovăz într-un bol\nsau borcan.\n2.Lasă-le la hidratat cel puțin 20–30 minute sau peste\nnoapte în frigider, până devin gelatinoase.\n3.Adaugă pudra proteică vanilie și căpșunile tăiate sau\npasate.\n4.Amestecă bine până obții o consistență omogenă.\n5.Servește imediat sau păstrează la frigider până la consum.","sfaturi":"Pentru o textură mai fină și mai cremoasă, pasează\ncăpșunile înainte de a le adăuga peste chia.\nDacă vrei o sațietate mai mare, lasă preparatul la frigider\npeste noapte, nu doar 20–30 de minute.","alergeni":"semințe (chia), gluten (posibil, din laptele de ovăz), lactate sau soia (posibil, din pudra proteică)","variante":"Dacă eviți glutenul, poți înlocui laptele de ovăz cu lapte de migdale, cocos sau orez. Dacă pudra proteică conține alergeni, aceasta poate fi înlocuită cu pudră proteică din mazăre sau orez, în aceeași cantitate. Dacă există alergie la semințe, semințele de chia pot fi eliminate, obținând o textură mai fluidă.","macro":{"calorii_macro":"436","proteine":"29.2 g","carbohidrati":"16.8 g","fibre":"14.3 g","grasimi":"15 g","grasimi_saturate":"2.5 g","greutate_portie":"420 g"}},{"id":"rapide-86","titlu":"Chia Proteică Arahide & Banană","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Budinci de Chia","pagina":86,"portii":"1","timp_minute":10,"calorii":483,"ingrediente":["40 g semințe de chia","250 ml lapte de migdale","30 g pudră proteică (vanilie sau neutră)","15 g unt de arahide","60 g banană"],"descriere":"O combinație sățioasă de semințe de chia, proteine, unt de\narahide și banană, bogată în fibre, proteine și grăsimi\nsănătoase.","pasi":"1.Amestecă semințele de chia cu laptele de migdale într-un\nbol sau borcan.\n2.Lasă-le la hidratat cel puțin 20–30 minute sau peste\nnoapte în frigider, până devin gelatinoase.\n3.Adaugă pudra proteică, untul de arahide și banana pasată\nsau tăiată felii.\n4.Amestecă bine până obții o consistență omogenă.\n5.Servește imediat sau păstrează la frigider până la consum.","sfaturi":"Pentru un gust mai intens, pasează banana împreună cu\nuntul de arahide înainte de a le adăuga peste chia.\nDacă vrei o textură mai densă și mai sățioasă, lasă\npreparatul la frigider peste noapte, nu doar 20–30 de\nminute.","alergeni":"nuci (arahide), nuci (din laptele de migdale), semințe (chia), lactate sau soia (posibil, din pudra proteică)","variante":"Dacă ai alergie la arahide, poți înlocui untul de arahide cu unt de migdale sau unt de caju, în aceeași cantitate. Dacă eviți lactatele sau soia din pudra proteică, aceasta poate fi înlocuită cu pudră proteică din mazăre sau orez. Dacă există alergie la semințe, semințele de chia pot fi eliminate, rezultând o textură mai cremoasă și mai fluidă.","macro":{"calorii_macro":"483","proteine":"37.6 g","carbohidrati":"23.1 g","fibre":"12.4 g","grasimi":"23.9 g","grasimi_saturate":"4.5 g","greutate_portie":"400 g"}},{"id":"rapide-87","titlu":"Chia Proteică cu Afine & Iaurt","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Budinci de Chia","pagina":87,"portii":"1","timp_minute":10,"calorii":414,"ingrediente":["35 g semințe de chia","150 g iaurt grecesc 2%","25 g pudră proteică (vanilie sau neutră)","100 g afine (proaspete sau congelate)"],"descriere":"O combinație bogată de semințe de chia, proteine, iaurt și\nafine, care oferă fibre și energie susținută.","pasi":"1.Amestecă semințele de chia cu iaurtul grecesc într-un bol\nsau borcan.\n2.Lasă-le la hidratat cel puțin 20–30 minute sau peste\nnoapte în frigider, până devin gelatinoase.\n3.Adaugă pudra proteică și afinele, amestecând bine până\nobții o consistență omogenă.\n4.Servește imediat sau păstrează la frigider până la consum.","sfaturi":"Pentru o textură mai fină, amestecă mai întâi pudra\nproteică cu iaurtul, apoi adaugă semințele de chia și\nafinele.\nDacă folosești afine congelate, lasă preparatul 10–15\nminute la temperatura camerei înainte de consum, pentru\nun gust mai dulce și o consistență mai plăcută.","alergeni":"lactate (din iaurtul grecesc și posibil din pudra proteică), semințe (chia)","variante":"Dacă ai intoleranță la lactoză, poți înlocui iaurtul grecesc cu iaurt vegetal sau iaurt fără lactoză. Dacă pudra proteică conține alergeni, aceasta poate fi înlocuită cu pudră proteică din mazăre sau orez, în aceeași cantitate. Dacă există alergie la semințe, semințele de chia pot fi eliminate, obținând o textură mai fluidă.","macro":{"calorii_macro":"414","proteine":"39.1 g","carbohidrati":"24 g","fibre":"10.8 g","grasimi":"14.9 g","grasimi_saturate":"3.5 g","greutate_portie":"310 g"}},{"id":"rapide-89","titlu":"Budincă Proteică cu Banană și Unt de Arahide","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Budinci de Ovăz","pagina":89,"portii":"1","timp_minute":10,"calorii":475,"ingrediente":["50 g ovăz","150 ml lapte 1,5%","30 g pudră proteică de vanilie","50 g banană (½ banană)","10 g unt de arahide după gust scorțișoară după gust vanilie"],"descriere":"O budincă cremoasă și hrănitoare, cu ovăz, banană, unt de\narahide și proteine, care oferă energie de lungă durată și\nsațietate.","pasi":"1.Pune ovăzul și laptele într-o crăticioară și încălzește la foc\nmediu, amestecând ocazional, până începe să se îngroașe.\n2.Adaugă pudra proteică și amestecă bine până se\nîncorporează.\n3.Pasează banana și amestec-o în budincă împreună cu\nuntul de arahide.\n4.Adaugă scorțișoară și vanilie după gust.\n5.Servește caldă sau las-o să se răcească pentru a obține o","sfaturi":"textură mai densă.\nPentru o budincă mai cremoasă, zdrobește banana înainte\nsă o adaugi și amestecă energic la final.\nDacă vrei o consistență mai densă, lasă budinca 10–15\nminute să se răcească sau adaugă 1–2 linguri de ovăz\nsuplimentar.","alergeni":"gluten (din ovăz), nuci (arahide), lactate (posibil, din lapte și pudra proteică)","variante":"Dacă eviți glutenul, poți folosi ovăz certificat fără gluten. Dacă ai alergie la arahide, untul de arahide poate fi înlocuit cu unt de migdale sau caju, în aceeași cantitate. Dacă eviți lactatele, laptele și pudra proteică pot fi alese în variante vegetale, fără a modifica semnificativ textura sau aportul caloric.","macro":{"calorii_macro":"475","proteine":"37.7 g","carbohidrati":"50.8 g","fibre":"1.8 g","grasimi":"11.3 g","grasimi_saturate":"3.5 g","greutate_portie":"290 g"}},{"id":"rapide-90","titlu":"Budincă Proteică Tip Brownie","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Budinci de Ovăz","pagina":90,"portii":"1","timp_minute":10,"calorii":405,"ingrediente":["50 g ovăz","150 ml lapte 1,5%","30 g pudră proteică cu aromă de ciocolată","5 g cacao pudră (1 linguriță)","5 g ciocolată neagră rasă după gust îndulcitor (stevia, eritritol etc.) după gust esență de vanilie sau rom"],"descriere":"O budincă densă și aromată de ciocolată, cu ovăz și proteine,\ncare oferă sațietate și energie de lungă durată.","pasi":"1.Pune ovăzul și laptele într-o crăticioară și încălzește la foc\nmediu, amestecând ocazional, până începe să se îngroașe.\n2.Adaugă pudra proteică și cacao, amestecând bine pentru\na evita cocoloașele.\n3.Încorporează ciocolata neagră rasă și amestecă până se\ntopește și se omogenizează.\n4.Adaugă îndulcitor și esență după gust.\n5.Servește caldă sau lasă budinca să se răcească puțin\npentru o consistență mai densă, tip brownie.","sfaturi":"Pentru gust intens de brownie, folosește cacao de calitate\nși lasă budinca să se răcească ușor înainte de consum.\nDacă vrei o textură mai compactă, tip „prăjitură”, redu\npuțin cantitatea de lapte sau las-o la frigider 15–20 de\nminute.","alergeni":"gluten (din ovăz), lactate (posibil, din lapte, pudra proteică și ciocolata neagră)","variante":"Dacă eviți glutenul, poți folosi ovăz certificat fără gluten. Dacă ai intoleranță la lactoză, laptele și pudra proteică pot fi alese în variante vegetale. Ciocolata neagră poate fi înlocuită cu cacao suplimentară, pentru un gust similar și aport caloric apropiat.","macro":{"calorii_macro":"405","proteine":"36 g","carbohidrati":"41.3 g","fibre":"1.7 g","grasimi":"8.5 g","grasimi_saturate":"3 g","greutate_portie":"280 g"}},{"id":"rapide-91","titlu":"Budincă cu Fructe de Pădure și Iaurt Grecesc","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Budinci de Ovăz","pagina":91,"portii":"1","timp_minute":10,"calorii":386,"ingrediente":["50 g ovăz","100 ml lapte 1,5%","100 g iaurt grecesc 2%","25 g pudră proteică cu aromă de vanilie","10 g fructe de pădure (proaspete sau congelate)"],"descriere":"O budincă cremoasă și hrănitoare, cu ovăz, iaurt grecesc,\nproteine și fructe de pădure, bogată în fibre și antioxidanți\npentru energie și sațietate.","pasi":"1.Pune ovăzul și laptele într-o crăticioară și încălzește la foc\nmediu, amestecând ocazional, până începe să se îngroașe.\n2.Adaugă pudra proteică vanilie și amestecă bine până se\nomogenizează.\n3.Ia budinca de pe foc și încorporează iaurtul grecesc,\namestecând ușor pentru a păstra textura cremoasă.\n4.Adaugă fructele de pădure deasupra sau amestecă-le ușor\nîn budincă.\n5.Servește imediat sau lasă să se răcească puțin pentru o","sfaturi":"consistență mai densă.\nPentru un contrast mai bun de texturi, adaugă fructele de\npădure la final, fără să le amesteci complet.\nDacă vrei o budincă mai fresh, folosește fructe de pădure\nușor decongelate și lasă preparatul 10–15 minute la frigider\nînainte de consum.","alergeni":"gluten (din ovăz), lactate (din iaurtul grecesc și posibil din lapte și pudra proteică)","variante":"Dacă eviți glutenul, poți folosi ovăz certificat fără gluten. Dacă ai intoleranță la lactoză, iaurtul grecesc și laptele pot fi înlocuite cu variante fără lactoză sau vegetale. Dacă pudra proteică conține alergeni, aceasta poate fi înlocuită cu pudră proteică din mazăre sau orez, în aceeași cantitate.","macro":{"calorii_macro":"386","proteine":"37.3 g","carbohidrati":"37 g","fibre":"0 g","grasimi":"7.6 g","grasimi_saturate":"3 g","greutate_portie":"280 g"}},{"id":"rapide-92","titlu":"Budincă cu Cocos și Migdale","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Budinci de Ovăz","pagina":92,"portii":"1","timp_minute":10,"calorii":408,"ingrediente":["50 g ovăz","150 ml lapte de cocos light","30 g pudră proteică cu aromă de vanilie","5 g fulgi de cocos","10 g migdale"],"descriere":"O budincă cremoasă și hrănitoare, cu ovăz, proteine, cocos și\nmigdale, bogată în proteine și grăsimi sănătoase pentru\nenergie de lungă durată.","pasi":"1.Pune ovăzul și laptele de cocos într-o crăticioară și\nîncălzește la foc mediu, amestecând ocazional, până\nîncepe să se îngroașe.\n2.Adaugă pudra proteică vanilie și amestecă bine până se\nomogenizează.\n3.Încorporează fulgii de cocos și migdalele, amestecând ușor\npentru a le distribui uniform.\n4.Servește caldă sau lasă să se răcească puțin pentru o\nconsistență mai densă.","sfaturi":"Pentru aromă mai intensă, rumenește ușor migdalele într-o\ntigaie uscată înainte de a le adăuga.\nDacă vrei o budincă mai cremoasă, adaugă 1–2 linguri\nsuplimentare de lapte de cocos după gătire și amestecă\nbine.","alergeni":"gluten (din ovăz), nuci (migdale), lactate sau nuci (posibil, din laptele de cocos și pudra proteică)","variante":"Dacă eviți glutenul, poți folosi ovăz certificat fără gluten. Dacă ai alergie la migdale, acestea pot fi eliminate sau înlocuite cu fulgi de cocos suplimentari. Dacă eviți lactatele sau alți alergeni din pudra proteică, aceasta poate fi înlocuită cu pudră proteică din mazăre sau orez, în aceeași cantitate.","macro":{"calorii_macro":"408","proteine":"30.8 g","carbohidrati":"37.5 g","fibre":"1.3 g","grasimi":"13.4 g","grasimi_saturate":"6 g","greutate_portie":"290 g"}},{"id":"rapide-93","titlu":"Budincă cu Mere Caramelizate și Scorțișoară","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Budinci de Ovăz","pagina":93,"portii":"1","timp_minute":10,"calorii":449,"ingrediente":["50 g ovăz","150 ml lapte 1,5%","30 g pudră proteică cu aromă de vanilie","70 g măr (½ măr)","5 g ulei de cocos (1 linguriță) după gust scorțișoară"],"descriere":"O budincă aromată și hrănitoare, cu ovăz, proteine, mere\ncaramelizate și scorțișoară, bogată în fibre și proteine pentru\nsațietate și energie.","pasi":"1.Taie mărul cubulețe și călește-l într-o tigaie mică cu uleiul\nde cocos și scorțișoară, la foc mic, până se înmoaie și\ndevine caramelizat.\n2.Pune ovăzul și laptele într-o crăticioară și încălzește la foc\nmediu, amestecând ocazional, până începe să se îngroașe.\n3.Adaugă pudra proteică vanilie și amestecă bine până se\nomogenizează.\n4.Încorporează merele caramelizate în budincă.\n5.Servește caldă sau lasă să se răcească puțin pentru o\nconsistență mai densă.","sfaturi":"Pentru gust mai intens, călește mărul la foc mic până devine\nfoarte moale și ușor caramelizat, fără a grăbi procesul.\nDacă vrei o aromă mai „de desert”, adaugă un praf de\nvanilie sau puțină scorțișoară suplimentară chiar la final.","alergeni":"gluten (din ovăz), lactate (posibil, din lapte și pudra proteică)","variante":"Dacă eviți glutenul, poți folosi ovăz certificat fără gluten. Dacă ai intoleranță la lactoză, laptele și pudra proteică pot fi alese în variante fără lactoză sau vegetale, fără a schimba semnificativ textura sau gustul.","macro":{"calorii_macro":"449","proteine":"33 g","carbohidrati":"46.4 g","fibre":"0 g","grasimi":"7 g","grasimi_saturate":"4.5 g","greutate_portie":"290 g"}},{"id":"rapide-94","titlu":"Budincă cu Afine și Nuci","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Budinci de Ovăz","pagina":94,"portii":"1","timp_minute":10,"calorii":465,"ingrediente":["50 g ovăz","150 ml lapte 1,5%","30 g pudră proteică cu aromă de vanilie","60 g afine (proaspete sau congelate)","10 g nuci"],"descriere":"Afine dulci și nuci crocante într-o budincă cremoasă, care îți dă\nenergie și te ține sătul mult timp.","pasi":"1.Pune ovăzul și laptele într-o crăticioară și încălzește la foc\nmediu, amestecând ocazional, până începe să se îngroașe.\n2.Adaugă pudra proteică vanilie și amestecă bine până se\nomogenizează.\n3.Încorporează afinele și nucile (măcinate grosier sau întregi,\ndupă preferință).\n4.Servește caldă sau lasă să se răcească puțin pentru o\nconsistență mai densă.","sfaturi":"Pentru textură mai interesantă, zdrobește ușor o parte din\nafine înainte de a le adăuga în budincă.\nDacă vrei un gust mai intens de nucă, rumenește-le 1–2\nminute într-o tigaie uscată înainte de a le incorpora.","alergeni":"gluten (din ovăz), nuci (nuci), lactate (posibil, din lapte și pudra proteică)","variante":"Dacă eviți glutenul, poți folosi ovăz certificat fără gluten. Dacă ai alergie la nuci, acestea pot fi eliminate sau înlocuite cu semințe de dovleac sau floarea-soarelui, în aceeași cantitate. Dacă ai intoleranță la lactoză, laptele și pudra proteică pot fi alese în variante fără lactoză sau vegetale.","macro":{"calorii_macro":"465","proteine":"34.4 g","carbohidrati":"46.8 g","fibre":"1.8 g","grasimi":"13.5 g","grasimi_saturate":"3.5 g","greutate_portie":"300 g"}},{"id":"rapide-95","titlu":"Budincă Crocantă cu Alune și Ciocolată","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Budinci de Ovăz","pagina":95,"portii":"1","timp_minute":10,"calorii":433,"ingrediente":["50 g ovăz","150 ml lapte 1,5%","30 g pudră proteică cu aromă de ciocolată","5 g cacao pudră","10 g alune (măcinate grosier pentru textură crocantă)"],"descriere":"Ciocolată intensă și alune crocante într-o budincă densă,\nperfectă pentru momentele când vrei ceva delicios și sățios.","pasi":"1.Pune ovăzul și laptele într-o crăticioară și încălzește la foc\nmediu, amestecând ocazional, până începe să se îngroașe.\n2.Adaugă pudra proteică ciocolată și cacao și amestecă\nbine până se omogenizează.\n3.Încorporează alunele, păstrând câteva pentru topping,\npentru textură crocantă.\n4.Servește caldă sau lasă să se răcească puțin pentru o\nconsistență mai densă și pudding-like.","sfaturi":"Pentru un efect crunchy mai pronunțat, păstrează o parte\ndin alune pentru topping și adaugă-le chiar înainte de\nservire.\nDacă vrei un gust mai intens de ciocolată, presară puțin\ncacao extra deasupra după ce budinca s-a răcit.","alergeni":"gluten (din ovăz), nuci (alune), lactate (posibil, din lapte și pudra proteică)","variante":"Dacă eviți glutenul, poți folosi ovăz certificat fără gluten. Dacă ai alergie la alune, acestea pot fi eliminate sau înlocuite cu fulgi de cocos ori semințe de dovleac, în aceeași cantitate. Dacă ai intoleranță la lactoză, laptele și pudra proteică pot fi alese în variante fără lactoză sau vegetale.","macro":{"calorii_macro":"433","proteine":"36.5 g","carbohidrati":"41.4 g","fibre":"2.5 g","grasimi":"12.6 g","grasimi_saturate":"3 g","greutate_portie":"295 g"}},{"id":"rapide-96","titlu":"Terci de Ovaz Tiramisu Sănătos","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Budinci de Ovăz","pagina":96,"portii":"1","timp_minute":10,"calorii":422,"ingrediente":["45 g fulgi de ovăz","150 ml lapte 1.5%","1 shot espresso (sau 40 ml cafea tare)","1 g sare [Opțional] îndulcitor lichid după gust","Crema:","300 g iaurt grecesc 2%","Esență de vanilie (după gust)","Îndulcitor natural (ex. stevia, green sugar, eritritol)"],"descriere":"Un mic dejun inspirat din tiramisu — cremos, aromat și plin de\nproteine, ideal când vrei ceva dulce, sănătos și rapid de\npregătit.","pasi":"1.Amestecă ovăzul cu laptele, cafeaua, sarea și îndulcitorul.\nGătește la microunde 2 min sau în cratiță 4–5 min până se\nîngroașă.\n2.Toarnă într-un bol și lasă la răcit.\n3.Separat, amestecă iaurtul cu vanilie și îndulcitor.\n4.Pune peste ovăz, nivelează, presară cacao și lasă la\nfrigider 1–2 ore.","sfaturi":"Poți adăuga 1 linguriță de pudră proteică de vanilie pentru\nun plus de proteine.\nServește rece pentru un gust autentic de tiramisu.","alergeni":"gluten (din ovăz), lactate (din lapte și iaurtul grecesc)","variante":"Dacă eviți glutenul, poți folosi fulgi de ovăz certificați fără gluten. Dacă ai intoleranță la lactoză, laptele și iaurtul grecesc pot fi înlocuite cu variante fără lactoză sau vegetale, păstrând o textură și un aport caloric apropiate.","macro":{"calorii_macro":"422","proteine":"34.4 g","carbohidrati":"41.4 g","fibre":"0 g","grasimi":"10.7 g","grasimi_saturate":"3.5 g","greutate_portie":"200 g"}},{"id":"rapide-98","titlu":"Smoothie cu Afine și Unt de Arahide","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Smoothie-uri","pagina":98,"portii":"1","timp_minute":10,"calorii":437,"ingrediente":["30 g pudră proteică (vanilie sau neutră)","150 g afine congelate","15 g unt de arahide natural","200 ml lapte de ovăz","10 g semințe de cânepă decorticate","5 g cacao pudră neîndulcită"],"descriere":"Afine dulci și unt de arahide cremos se întâlnesc într-un smoothie\nproteic, cu o notă fină de cacao și energie pe termen lung.","pasi":"1.Pune toate ingredientele într-un blender: pudra proteică,\nafinele congelate, untul de arahide, laptele de ovăz,\nsemințele de cânepă și cacao.\n2.Mixează la viteză mare până obții un smoothie cremos și\nomogen.\n3.Dacă este prea gros, mai poți adăuga 50 ml lapte de ovăz\npentru consistență.\n4.Servește imediat, ideal ca gustare sau mic dejun rapid.","sfaturi":"Pentru un smoothie mai rece și mai cremos, folosește afine\ncongelate direct din congelator.\nDacă vrei să reduci densitatea, adaugă treptat puțin lapte\nde ovăz până ajungi la consistența dorită, fără să diluezi\nprea mult gustul.","alergeni":"nuci (arahide), semințe (semințe de cânepă), gluten (posibil, din laptele de ovăz), lactate sau soia (posibil, din pudra proteică)","variante":"Dacă ai alergie la arahide, untul de arahide poate fi înlocuit cu unt de migdale sau caju, în aceeași cantitate. Dacă eviți glutenul, laptele de ovăz poate fi înlocuit cu lapte de migdale, cocos sau orez. Dacă pudra proteică conține alergeni, aceasta poate fi înlocuită cu pudră proteică din mazăre sau orez.","macro":{"calorii_macro":"437","proteine":"31.3 g","carbohidrati":"28.7 g","fibre":"5.9 g","grasimi":"14.3 g","grasimi_saturate":"3.5 g","greutate_portie":"400 g"}},{"id":"rapide-99","titlu":"Smoothie Tropical Cremos","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Smoothie-uri","pagina":99,"portii":"1","timp_minute":10,"calorii":239,"ingrediente":["150 g mango","150 g ananas","200 ml lapte  de cocos","1 linguriță semințe de in"],"descriere":"Un smoothie exotic și cremos, cu gust intens de mango și ananas,\ncompletat de prospețimea apei de cocos.","pasi":"1.Pune toate ingredientele în blender.\n2.Mixează 1 minut până devine cremos.","sfaturi":"Pune câteva cuburi de gheață pentru un gust răcoritor, ca un\ncocktail exotic.\nPoți adăuga zeamă de lime pentru o aromă mai fresh sau o\nlingură de proteine vegetale pentru un plus de nutrienți.\nIdeal ca mic dejun de vară sau gustare pre-antrenament.","alergeni":"semințe (semințe de in)","variante":"Dacă există alergie la semințe, semințele de in pot fi eliminate sau înlocuite cu semințe de chia, în aceeași cantitate, pentru o textură similară.","macro":{"calorii_macro":"239","proteine":"1.7 g","carbohidrati":"51.1 g","fibre":"3 g","grasimi":"4 g","grasimi_saturate":"2.5 g","greutate_portie":"450 g"}},{"id":"rapide-100","titlu":"Smoothie „pumpkin Spice”","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Smoothie-uri","pagina":100,"portii":"1","timp_minute":10,"calorii":435,"ingrediente":["30 g pudră proteică cu aromă de vanilie","150 g piure de dovleac copt","40 g ovăz fin","200 ml lapte de migdale","10 g sirop de arțar","10 g miez de nucă după gust scorțișoară"],"descriere":"Dovleac copt, nuci și scorțișoară se combină într-un smoothie\ncremos, cu aromă de toamnă și proteine care îți dau energie.","pasi":"1.Pune toate ingredientele într-un blender: pudra proteică,\npiureul de dovleac, ovăzul, laptele de migdale, siropul de arțar,\nnucile și scorțișoara.\n2.Mixează la viteză mare până obții un smoothie omogen și\ncremos.\n3.Verifică consistența; dacă e prea gros, mai poți adăuga 50 ml\nde apă.\n4.Servește imediat, cu puțină scorțișoară presărată deasupra\npentru decor.","sfaturi":"Pentru aromă mai intensă, folosește piure de dovleac bine\ncopt și adaugă scorțișoara la final, după mixare.\nDacă vrei un smoothie mai cremos, mixează ovăzul înainte cu\nlaptele de migdale, apoi adaugă restul ingredientelor.","alergeni":"gluten (din ovăz), nuci (din laptele de migdale și nuci/pecan), lactate sau soia (posibil, din pudra proteică)","variante":"Dacă eviți glutenul, poți folosi ovăz certificat fără gluten. Dacă ai alergie la nuci, laptele de migdale poate fi înlocuit cu lapte de ovăz sau orez, iar nucile cu semințe de dovleac. Dacă pudra proteică conține alergeni, aceasta poate fi înlocuită cu pudră proteică din mazăre sau orez, în aceeași cantitate.","macro":{"calorii_macro":"435","proteine":"29.7 g","carbohidrati":"27.6 g","fibre":"0 g","grasimi":"7 g","grasimi_saturate":"2.5 g","greutate_portie":"430 g"}},{"id":"rapide-101","titlu":"Smoothie de Ciocolată și Banană","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Smoothie-uri","pagina":101,"portii":"1","timp_minute":10,"calorii":398,"ingrediente":["30 g pudră proteică cu aromă de ciocolată","100 g banană mică (aprox. 1 bucată)","200 ml lapte de ovăz","5 g cacao pudră neîndulcită","10 g unt de arahide","10 g semințe de in măcinate"],"descriere":"Ciocolată și banană într-un smoothie cremos, cu unt de nuci și\nproteine, perfect pentru energie și sațietate de lungă durată.","pasi":"1.Pune toate ingredientele într-un blender: pudra proteică,\nbanana, laptele de ovăz, cacao, untul de migdale și semințele\nde in măcinate.\n2.Mixează la viteză mare până obții un smoothie omogen și\ncremos.\n3.Verifică consistența; dacă e prea gros, mai poți adăuga 50 ml\nlapte de ovăz.\n4.Servește imediat, pentru a păstra textura cremoasă și nutrienții.","sfaturi":"Pentru un gust mai intens de ciocolată, folosește cacao\nneîndulcită de calitate și lasă banana bine coaptă.\nDacă vrei un smoothie mai rece și mai cremos, adaugă\ncâteva cuburi de gheață sau folosește banana congelată.","alergeni":"nuci (migdale sau arahide), semințe (semințe de in), gluten (posibil, din laptele de ovăz), lactate sau soia (posibil, din pudra proteică)","variante":"Dacă ai alergie la nuci, untul de migdale sau arahide poate fi înlocuit cu unt de semințe de floarea-soarelui. Dacă eviți glutenul, laptele de ovăz poate fi înlocuit cu lapte de migdale, cocos sau orez. Dacă pudra proteică conține alergeni, poate fi înlocuită cu pudră proteică din mazăre sau orez.","macro":{"calorii_macro":"398","proteine":"29.6 g","carbohidrati":"29.4 g","fibre":"4.5 g","grasimi":"11.1 g","grasimi_saturate":"3 g","greutate_portie":"355 g"}},{"id":"rapide-102","titlu":"Smoothie cu Iaurt Grecesc și Căpșuni","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Smoothie-uri","pagina":102,"portii":"1","timp_minute":5,"calorii":267,"ingrediente":["30 g pudră proteică (vanilie sau ciocolată)","100 g iaurt grecesc 2%","100 g căpșuni (congelate sau proaspete)","200 ml lapte de migdale neîndulcit","10 g sirop de arțar"],"descriere":"Căpșuni dulci și iaurt cremos se întâlnesc cu proteine și nuci într-un\nsmoothie plin de savoare și energie.","pasi":"1.Pune toate ingredientele într-un blender: pudra proteică,\niaurtul grecesc, căpșunile, laptele de migdale și siropul de\narțar.\n2.Mixează la viteză mare până obții un smoothie omogen și\ncremos.\n3.Verifică consistența; dacă e prea gros, mai poți adăuga 50 ml\nlapte de migdale.\n4.Servește imediat pentru a păstra textura cremoasă și\nprospețimea fructelor.","sfaturi":"Pentru un smoothie mai cremos, folosește căpșuni ușor\ndecongelate și iaurt grecesc bine rece.\nDacă vrei o textură mai lejeră, adaugă treptat puțin lapte de\nmigdale la final, fără să diluezi prea mult gustul.","alergeni":"lactate (din iaurtul grecesc și posibil din pudra proteică), nuci (din laptele de migdale)","variante":"Dacă ai intoleranță la lactoză, poți înlocui iaurtul grecesc cu iaurt fără lactoză sau iaurt vegetal. Dacă ai alergie la nuci, laptele de migdale poate fi înlocuit cu lapte de ovăz, cocos sau orez. Dacă pudra proteică conține alergeni, aceasta poate fi înlocuită cu pudră proteică din mazăre sau orez, în aceeași cantitate.","macro":{"calorii_macro":"267","proteine":"32.7 g","carbohidrati":"12.4 g","fibre":"2 g","grasimi":"5.5 g","grasimi_saturate":"2 g","greutate_portie":"440 g"}},{"id":"rapide-104","titlu":"French Toast cu Banane și Scorțisoară","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Mic Dejun","pagina":104,"portii":"1","timp_minute":10,"calorii":244,"ingrediente":["2 felii pâine integrală","2 albușuri","1 banană coaptă","1 linguriță scorțișoară","1 linguriță esență de vanilie","Un praf de sare"],"descriere":"Un mic dejun dulce, proteic și super rapid, care combină\nperfect aroma de scorțișoară cu dulceața bananei. Perfect\npentru diminețile în care vrei ceva bun fără să pierzi timp.","pasi":"1.Amestecă albușurile cu scorțișoara, vanilia și sarea.\n2.Înmoaie feliile de pâine în amestec.\n3.Prăjește-le într-o tigaie antiaderentă.\n4.Servește cu banană tăiată deasupra.","sfaturi":"Adaugă 1 linguriță de unt de arahide natural pentru un plus\nde grăsimi sănătoase.\nServește cu 1 linguriță de iaurt grecesc rece sau cu câteva\nfructe de pădure proaspete pentru extra fibre și\nantioxidanți.","alergeni":"gluten (din pâinea integrală), ouă","variante":"Dacă eviți glutenul, poți folosi pâine fără gluten, cu structură similară. Dacă ai alergie la ouă, albușurile pot fi înlocuite cu un amestec din făină de năut și apă, pentru a păstra legarea și textura la prăjire.","macro":{"calorii_macro":"244","proteine":"14.1 g","carbohidrati":"42.6 g","fibre":"2 g","grasimi":"1.5 g","grasimi_saturate":"0.3 g"}},{"id":"rapide-105","titlu":"Sandviș cu Ou și Avocado","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Mic Dejun","pagina":105,"portii":"2","timp_minute":10,"calorii":304,"ingrediente":["2 felii pâine integrală","1 ou fiert","½ avocado","Sare, piper","Zeamă de lămâie"],"descriere":"Un sandviș fresh, nutritiv și gata în câteva clipe — combinația\nperfectă dintre avocado cremos și ou fiert pentru un mic dejun\nușor și sănătos.","pasi":"1.Pisează avocado cu sare, piper și zeamă de lămâie.\n2.Unge feliile de pâine și adaugă oul feliat deasupra.","sfaturi":"Fierbe oul 8–10 minute pentru un gălbenuș ferm sau 6\nminute pentru unul moale.\nPoți adăuga 1 felie de roșie sau frunze de rucola pentru un\nplus de vitamine.","alergeni":"gluten (din pâinea integrală), ouă","variante":"Dacă eviți glutenul, poți folosi pâine fără gluten, cu textură și aport caloric similar. Dacă ai alergie la ouă, oul fiert poate fi înlocuit cu hummus sau tofu marinat, pentru un aport proteic apropiat și o consistență cremoasă.","macro":{"calorii_macro":"304","proteine":"15 g","carbohidrati":"24.6 g","fibre":"3.6 g","grasimi":"17.1 g","grasimi_saturate":"4 g"}},{"id":"rapide-106","titlu":"Clătite Proteice cu Banană","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Mic Dejun","pagina":106,"portii":"1","timp_minute":10,"calorii":166,"ingrediente":["150 g albușuri (echivalentul a ~4–5 albușuri de ou sau 1 cutie de albușuri pasteurizate)","1 banană (80 g – bine coaptă)","½ linguriță esență de vanilie","1 linguriță scorțișoară","1–2 linguri îndulcitor natural (ex. stevia, eritritol, green sugar) – după gust","5 g praf de copt"],"descriere":"Clătite proteice, pufoase și fără făină — o rețetă rapidă, dulce\nși perfectă pentru un mic dejun sănătos, bogat în proteine.","pasi":"1.Pasează banana, adaugă albușurile, vanilia, scorțișoara,\nîndulcitorul și praful de copt.\n2.Amestecă bine.\n3.Coace clătite mici într-o tigaie antiaderentă, 1–2 min pe\nfiecare parte.","sfaturi":"Poți adăuga 10–15 g făină de ovăz pentru textură mai\ndensă.\nPentru un plus de fibre și sațietate, adaugă 1 lingură de\nsemințe de chia sau psyllium în compoziție.","alergeni":"ouă, lactate (posibil, din iaurtul grecesc pentru topping)","variante":"Dacă ai alergie la ouă, albușurile pot fi înlocuite cu un amestec din făină de năut și apă, pentru o textură asemănătoare. Dacă eviți lactatele, iaurtul grecesc din topping poate fi înlocuit cu iaurt vegetal, păstrând consistența cremoasă.","macro":{"calorii_macro":"166","proteine":"15.9 g","carbohidrati":"19.3 g","fibre":"1.6 g","grasimi":"0 g","grasimi_saturate":"0 g","greutate_portie":"230 g"}},{"id":"rapide-107","titlu":"Bol Proteic cu Iaurt și Fructe","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Mic Dejun","pagina":107,"portii":"1","timp_minute":10,"calorii":362,"ingrediente":["200 g iaurt grecesc degresat sau cu 2% grăsime","10 g miere","80 g afine (proaspete sau congelate)","20 g granola proteică","1 linguriță semințe de chia","1 lingură goji uscate","1 lingură nibs de cacao (sau ciocolată neagră 85% tocată)","1 linguriță pudră de cacao"],"descriere":"Un bol proteic fresh și energizant, plin de texturi și arome —\niaurt cremos, fructe, granola crocantă și superfoods pentru un\nmic dejun rapid și sănătos.","pasi":"1.Într-un bol, adaugă iaurtul grecesc rece.\n2.Toarnă mierea deasupra și amestecă ușor.\n3.Adaugă afinele, granola, semințele de chia, goji, nibs de\ncacao și pudra de cacao.\n4.Poți lăsa în straturi pentru estetică sau poți amesteca totul\nînainte de consum.\n5.Servește imediat pentru un mic dejun fresh sau gustare\nenergizantă.","sfaturi":"Poți adăuga 15 g pudră proteică cu aromă de vanilie\npentru +10 g proteine.\nÎnlocuiește afinele cu zmeură sau căpșuni pentru mai puține\ncalorii.","alergeni":"lactate (din iaurtul grecesc), gluten (posibil, din granola), semințe (chia), cacao (nibs și pudră)","variante":"Dacă ai intoleranță la lactoză, poți înlocui iaurtul grecesc cu iaurt fără lactoză sau iaurt vegetal. Dacă eviți glutenul, alege granola certificată fără gluten. Dacă există alergie la semințe, semințele de chia pot fi eliminate fără a afecta semnificativ textura sau valoarea nutrițională.","macro":{"calorii_macro":"362","proteine":"20.8 g","carbohidrati":"50.2 g","fibre":"6.6 g","grasimi":"10 g","grasimi_saturate":"3.5 g"}},{"id":"rapide-109","titlu":"Salată cu Năut","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Salate","pagina":109,"portii":"2","timp_minute":10,"calorii":224,"ingrediente":["200 g năut fiert","150 g roșii","100 g castravete","80 g ardei roșu","30 g ceapă roșie","5 g ulei de măsline","20 g măsline","25 g brânză feta","10 g zeamă de lămâie"],"descriere":"Năut hrănitor, legume proaspete și brânză feta se combină într-o\nsalată plină de proteine, fibre și grăsimi sănătoase.","pasi":"1.Taie legumele (roșii, castravete, ardei, ceapă) cubulețe.\n2.Amestecă năutul fiert cu legumele tăiate.\n3.Adaugă măslinele și brânza feta tăiată cubulețe.\n4.Stropește cu ulei de măsline și zeama de lămâie, apoi\namestecă ușor.\n5.Servește imediat sau lasă la rece 10–15 minute pentru a se\ncombina aromele.","sfaturi":"Pentru un gust mai intens, lasă salata 10–15 minute la rece\nînainte de servire, ca aromele să se combine.\nDacă vrei o textură mai sățioasă, poți pasa ușor o parte din\nnăut înainte de amestecare, fără să compromiți prospețimea\nsalatei.","alergeni":"lactate (din brânza feta)","variante":"Dacă ai intoleranță la lactoză, poți înlocui brânza feta cu o variantă fără lactoză sau cu tofu marinat, păstrând un aport proteic și o textură similară.","macro":{"calorii_macro":"224","proteine":"2.3 g","carbohidrati":"8.2 g","fibre":"2 g","grasimi":"6.2 g","grasimi_saturate":"2 g"}},{"id":"rapide-110","titlu":"Salată de Fasole Roșie cu Ceapă și Porumb","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Salate","pagina":110,"portii":"2","timp_minute":10,"calorii":222,"ingrediente":["200 g fasole roșie fiartă","80 g porumb fiert","100 g castravete","30 g ceapă verde","60 g ou (aprox. 1 ou mare)","5 g ulei de măsline după gust condimente (sare, piper, paprika, pătrunjel)"],"descriere":"Fasole roșie, porumb crocant și ou se întâlnesc într-o salată plină\nde proteine, carbohidrați complecși și grăsimi sănătoase.","pasi":"1.Ouăle fierbe-le tari (aprox. 8–10 minute).\n2.Taie castravetele și ceapa verde mărunt.\n3.Amestecă fasolea fiartă cu porumbul, oul fiert tăiat cubulețe,\ncastravetele și ceapa.\n4.Adaugă uleiul de măsline și condimentele după gust.\n5.Servește imediat sau lasă la rece 10–15 minute pentru ca\naromele să se combine.","sfaturi":"Fasolea și porumbul pot fi din conservă (spălate bine) pentru\nrapiditate.\nCondimentele precum paprika, chimen sau coriandru adaugă\naromă fără calorii suplimentare.","alergeni":"leguminoase (fasole roșie)","variante":"Dacă există sensibilitate la leguminoase, fasolea roșie poate fi înlocuită cu linte fiartă sau năut bine gătit, în aceeași cantitate, pentru un aport nutrițional și o consistență similare.","macro":{"calorii_macro":"222","proteine":"4.9 g","carbohidrati":"6.1 g","fibre":"1.6 g","grasimi":"6.6 g","grasimi_saturate":"1.2 g"}},{"id":"rapide-111","titlu":"Salată de Edamame cu Avocado","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Salate","pagina":111,"portii":"1","timp_minute":10,"calorii":380,"ingrediente":["150 g edamame (boabe)","70 g avocado","100 g salată verde","100 g roșii","5 g ulei de măsline","5 g zeamă de lămâie după gust condimente (sare, piper)"],"descriere":"Edamame bogat în proteine, avocado cremos și legume\nproaspete se combină într-o salată plină de fibre și energie de\nlungă durată.","pasi":"1.Fierbe edamamele 4–5 minute, apoi decojește-le.\n2.Taie avocado cubulețe și roșiile felii sau cuburi.\n3.Amestecă edamamele cu avocado și roșiile.\n4.Adaugă salata verde și asezonează cu ulei de măsline, zeamă\nde lămâie și condimente.\n5.Servește imediat sau lasă la rece 5–10 minute pentru ca\naromele să se combine.","sfaturi":"Pentru un gust mai bun, lasă edamamele să se răcească\ncomplet înainte de a le amesteca cu avocado, ca să nu-l\nînmoaie.\nDacă vrei o salată mai sățioasă, taie avocado-ul în bucăți mai\nmari și amestecă ușor, chiar înainte de servire.","alergeni":"soia (din edamame)","variante":"Dacă ai alergie la soia, edamamele pot fi înlocuite cu năut fiert sau linte fiartă, în aceeași cantitate, pentru un aport similar de proteine și fibre.","macro":{"calorii_macro":"380","proteine":"18.9 g","carbohidrati":"26.8 g","fibre":"7.2 g","grasimi":"24.5 g","grasimi_saturate":"4 g"}},{"id":"rapide-112","titlu":"Salată cu Somon","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Salate","pagina":112,"portii":"2","timp_minute":10,"calorii":200,"ingrediente":["100 g somon afumat","100 g salată verde + spanac","100 g castravete","100 g roșii","50 g avocado","5 ml ulei de măsline după gust zeamă de lămâie după gust condimente (mărar, piper)"],"descriere":"Somon afumat, avocado și legume proaspete se combină într-o\nsalată plină de proteine, grăsimi sănătoase și omega-3.","pasi":"1.Taie castravetele, roșiile și avocado în cubulețe.\n2.Amestecă salata verde și spanacul într-un bol.\n3.Adaugă legumele și avocado peste salată.\n4.Pune somonul afumat feliat deasupra.\n5.Stropește cu ulei de măsline și zeamă de lămâie și\ncondimentează cu mărar și piper.\n6.Servește imediat.","sfaturi":"Pentru un gust mai echilibrat, adaugă somonul chiar la final,\ndupă ce ai amestecat legumele cu uleiul și zeama de lămâie.\nDacă vrei o salată mai aromată, masează ușor salata verde\ncu puțin ulei de măsline înainte de a adăuga restul\ningredientelor.","alergeni":"pește (somon)","variante":"Dacă ai alergie la pește, somonul poate fi înlocuit cu piept de pui gătit sau cu tofu marinat, în aceeași cantitate, pentru un aport proteic similar și o textură comparabilă.","macro":{"calorii_macro":"200","proteine":"12.3 g","carbohidrati":"6.2 g","fibre":"3 g","grasimi":"13.3 g","grasimi_saturate":"3.5 g"}},{"id":"rapide-113","titlu":"Salată cu Ou, Măsline și Castravete","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Salate","pagina":113,"portii":"2","timp_minute":10,"calorii":179,"ingrediente":["2 buc Ouă fierte","100g Castraveți","50g Salată verde","20g Măsline","5g Ulei de măsline","50g Mozzarella light","50g Roșii cherry"],"descriere":"O salată răcoritoare și sățioasă, cu ou fiert, măsline și castravete,\nexact genul de preparat ușor și gustos pe care îl pregăteai rapid\nîn zilele de vară.","pasi":"1.Fierbe ouăle 8–10 minute și taie-le în sferturi.\n2.Taie castraveții și roșiile, rupe salata verde.\n3.Taie mozzarella cuburi și adaug-o peste legume.\n4.Pune măslinele, stropește cu ulei și amestecă.","sfaturi":"Pentru un gust mai plăcut, lasă ouăle să se răcească complet\nînainte de a le adăuga în salată, ca să nu înmoaie legumele.\nDacă vrei o salată mai fresh, adaugă uleiul de măsline și sarea\nchiar înainte de servire, nu din timp.","alergeni":"ouă, lactate (din mozzarella light)","variante":"Dacă ai alergie la ouă, acestea pot fi înlocuite cu tofu marinat sau năut fiert, pentru un aport proteic similar. Dacă eviți lactatele, mozzarella light poate fi înlocuită cu o variantă vegetală sau eliminată, fără a afecta semnificativ gustul și textura salatei.","macro":{"calorii_macro":"179","proteine":"12.3 g","carbohidrati":"3.2 g","fibre":"0.8 g","grasimi":"12.4 g","grasimi_saturate":"4 g"}},{"id":"rapide-114","titlu":"Salată cu Curcan, Roșii Uscate și Semințe","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Salate","pagina":114,"portii":"2","timp_minute":10,"calorii":190,"ingrediente":["130g Piept de curcan","25g Roșii uscate","60g Salată verde","90g Castraveți","70g Ardei gras","12g Semințe floarea-soarelui","5g Ulei de măsline"],"descriere":"O salată colorată și hrănitoare, în care pieptul de curcan se\ncombină perfect cu roșiile uscate și semințele, pentru o masă\nușoară, sățioasă și plină de energie.","pasi":"1.Gătește pieptul de curcan pe grill sau în tigaie 6–7 minute.\n2.Taie roșiile uscate și legumele.\n3.Combină totul într-un bol cu semințele și frunzele de salată.\n4.Stropește cu uleiul și amestecă bine.","sfaturi":"Pentru un gust mai intens, taie roșiile uscate mărunt și\namestecă-le cu uleiul de măsline înainte de a le adăuga în\nsalată.\nDacă vrei o textură mai plăcută, adaugă semințele chiar la\nfinal, ca să rămână crocante.","alergeni":"semințe (semințe de floarea-soarelui)","variante":"Dacă există alergie la semințe, semințele de floarea- soarelui pot fi eliminate sau înlocuite cu fulgi de migdale ori nuci tocate, în aceeași cantitate, pentru un aport similar de grăsimi sănătoase.","macro":{"calorii_macro":"190","proteine":"22.1 g","carbohidrati":"7.3 g","fibre":"1.1 g","grasimi":"7.4 g","grasimi_saturate":"1.2 g"}},{"id":"rapide-115","titlu":"Salată de Ton cu Porumb și Maioneză Light","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Salate","pagina":115,"portii":"2","timp_minute":10,"calorii":218,"ingrediente":["160 g ton în suc propriu, scurs","100 g porumb fiert","100 g castraveți murați (în oțet)","50 g ceapă roșie tocată","Maioneză light:","1 gălbenuș fiert (~18 g)","80 g iaurt grecesc 2%","1 linguriță muștar (5 g)","1 linguriță ulei de măsline (5 g)"],"descriere":"O salată cremoasă, proteică și foarte rapidă, în care tonul se\ncombină perfect cu porumbul dulce și dressingul light — ideală\npentru un prânz sățios sau o cină ușoară, gata în doar câteva\nminute.","pasi":"1.Amestecă tonul cu porumbul, castraveții tocați și ceapa.\n2.Separat, pasează gălbenușul și amestecă-l cu iaurtul, muștarul\nși uleiul.\n3.Combină totul într-un bol și lasă la rece 20 de minute.\n4.Servește ca atare sau pe o felie de pâine integrală prăjită.","sfaturi":"Pentru o textură mai bună, scurge foarte bine tonul și porumbul\nînainte de amestecare, ca salata să nu devină apoasă.\nDacă vrei un gust mai echilibrat, lasă salata 15–20 de minute\nla frigider înainte de consum, ca dressingul să se lege cu\ningredientele.","alergeni":"pește (ton), ouă (din gălbenuș), lactate (din iaurtul grecesc), muștar","variante":"Dacă ai alergie la pește, tonul poate fi înlocuit cu piept de pui gătit sau năut fiert, pentru un aport proteic similar. Dacă eviți ouăle, gălbenușul poate fi eliminat, folosind doar iaurt și muștar pentru dressing. Dacă ai intoleranță la lactoză, iaurtul grecesc poate fi înlocuit cu iaurt fără lactoză sau vegetal.","macro":{"calorii_macro":"218","proteine":"26.5 g","carbohidrati":"11.2 g","fibre":"2.8 g","grasimi":"6.9 g","grasimi_saturate":"1.8 g"}},{"id":"rapide-117","titlu":"Omletă cu Somon și Cremă de Brânză","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Wrap-uri & Omlete","pagina":117,"portii":"2","timp_minute":10,"calorii":234,"ingrediente":["3 bucăți ouă mari","50 g somon afumat","40 g cremă de brânză light","5 ml ulei de măsline (pentru gătit)","50 g baby spanac","50 g roșii cherry după gust condimente (sare, piper, mărar)"],"descriere":"Ouă pufoase cu somon afumat, cremă de brânză și legume\nproaspete, pentru o masă bogată în proteine și grăsimi\nsănătoase.","pasi":"1.Bate ouăle într-un bol cu sare și piper.\n2.Într-o tigaie antiaderentă, încălzește uleiul de măsline la foc\nmic.\n3.Toarnă ouăle bătute și adaugă baby spanacul. Gătește\nușor până începe să se coaguleze.\n4.Adaugă somonul afumat și crema de brânză, apoi pliază\nomleta ușor.\n5.Servește imediat, alături de roșiile cherry tăiate.","sfaturi":"Pentru o omletă mai pufoasă, bate ouăle bine cu un praf\nde sare înainte de a le pune în tigaie și gătește-le la foc\nmic.\nDacă vrei un gust mai fin, adaugă crema de brânză chiar\nla final și pliază omleta ușor, fără să o mai gătești mult.","alergeni":"ouă, pește (somon), lactate (din crema de brânză)","variante":"Dacă ai alergie la pește, somonul poate fi înlocuit cu piept de curcan sau pui gătit. Dacă eviți lactatele, crema de brânză poate fi înlocuită cu cremă vegetală pe bază de caju sau cu tofu pasat, pentru o textură similară. Dacă ai alergie la ouă, omleta poate fi adaptată folosind un amestec din făină de năut și apă.","macro":{"calorii_macro":"234","proteine":"17.6 g","carbohidrati":"3.3 g","fibre":"0.5 g","grasimi":"16.6 g","grasimi_saturate":"6 g","greutate_portie":"190 g"}},{"id":"rapide-118","titlu":"Omletă cu Avocado și Șuncă Slabă","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Wrap-uri & Omlete","pagina":118,"portii":"2","timp_minute":10,"calorii":250,"ingrediente":["3 bucăți ouă","50 g șuncă de curcan","80 g avocado (½ bucată)","5 g unt (pentru gătit)","20 g cașcaval light","15 g ceapă verde","15 g spanac după gust condimente (sare, piper, paprika – opțional)"],"descriere":"Ouă pufoase cu avocado cremos, șuncă slabă și legume, pentru\no masă sățioasă, bogată în proteine și grăsimi sănătoase.","pasi":"1.Sotează șunca și legumele (ceapă verde și spanac) în untul\nîncălzit, la foc mediu, 2–3 minute.\n2.Bate ouăle într-un bol și adaugă cașcavalul ras.\n3.Toarnă ouăle peste șuncă și legume și gătește la foc mic\npână se coagulează.\n4.După ce omleta este gata, așază feliile de avocado\ndeasupra.\n5.Pliază ușor omleta și servește cald.","sfaturi":"Pentru o omletă mai fragedă, gătește ouăle la foc mic și\nevită amestecarea excesivă după ce încep să se lege.\nAvocado adaugă-l doar la final, după ce oprești focul, ca\nsă își păstreze textura cremoasă și gustul proaspăt.","alergeni":"ouă, lactate (din cașcaval), carne procesată (șuncă de curcan/pui)","variante":"Dacă ai alergie la ouă, acestea pot fi înlocuite cu un amestec din făină de năut și apă, pentru o textură similară. Dacă eviți lactatele, cașcavalul poate fi înlocuit cu o variantă vegetală sau eliminat. Dacă nu consumi carne procesată, șunca poate fi înlocuită cu piept de curcan sau pui gătit simplu.","macro":{"calorii_macro":"250","proteine":"12.6 g","carbohidrati":"4.2 g","fibre":"2.6 g","grasimi":"17.6 g","grasimi_saturate":"7 g","greutate_portie":"180 g"}},{"id":"rapide-119","titlu":"Wrap cu Pui și Avocado","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Wrap-uri & Omlete","pagina":119,"portii":"2","timp_minute":10,"calorii":309,"ingrediente":["60 g lipie integrală","130 g piept de pui gătit la grill","60 g avocado","80 g ardei kapia","100 g iaurt grecesc 2%","5 g ulei de măsline după gust condimente (sare, piper, paprika)"],"descriere":"Piept de pui suculent, avocado cremos și legume colorate,\nînvelite într-o lipie integrală pentru o masă sățioasă și plină de\nenergie.","pasi":"1.Gătește pieptul de pui la grill până este complet gătit și\ntaie-l fâșii subțiri.\n2.Pasează avocado și amestecă-l cu iaurtul grecesc și puțină\nsare pentru a obține o cremă cremoasă.\n3.Încălzește lipia ușor, apoi unge-o cu crema de avocado și\niaurt.\n4.Adaugă fâșiile de pui și ardeiul tăiat fâșii, apoi stropește cu\nuleiul de măsline.\n5.Rulează wrapul strâns și servește imediat.","sfaturi":"Pentru un wrap mai gustos, încălzește ușor lipia înainte de\numplere, astfel devine mai elastică și nu se rupe la rulare.\nDacă vrei o cremă mai fină, pasează avocado-ul direct cu\niaurtul și un praf de sare, apoi unge lipia înainte de a\nadăuga puiul și legumele.","alergeni":"gluten (din lipia integrală), lactate (din iaurtul grecesc)","variante":"Dacă eviți glutenul, lipia integrală poate fi înlocuită cu lipie fără gluten sau foi de salată pentru rulare. Dacă ai intoleranță la lactoză, iaurtul grecesc poate fi înlocuit cu iaurt fără lactoză sau iaurt vegetal, păstrând textura cremoasă.","macro":{"calorii_macro":"309","proteine":"25.2 g","carbohidrati":"6.4 g","fibre":"1.8 g","grasimi":"10.4 g","grasimi_saturate":"2.5 g","greutate_portie":"220 g"}},{"id":"rapide-120","titlu":"Wrap cu Pui Cremos, Brânză si Usturoi","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Wrap-uri & Omlete","pagina":120,"portii":"2","timp_minute":10,"calorii":437,"ingrediente":["Pentru umplutură:","300 g piept de pui (cuburi, fără piele/os)","2 căței de usturoi, tocați fin","70 ml lapte evaporat light (sau lapte 1,5% redus ușor pe foc)","15 g cremă de brânză light","10 g parmezan ras","15 g cașcaval light ras","Zeama de ~¼ lămâie","Oregano uscat + pătrunjel uscat (pentru topping) condimente","Pentru asamblare:","2 lipii integrale (60–70 g / bucată)","40 g mozzarella light rasă (≈20 g / lipie)"],"descriere":"Un wrap incredibil de cremos, aromat și sățios, în care bucățile\nfragede de pui se îmbracă într-un sos catifelat cu brânză și\nusturoi — o rețetă ideală pentru familie, perfectă pentru prânzuri\nrapide sau seri în care vrei ceva super gustos, fără efort.","pasi":"1.Condimentează puiul cu sare, boia, pudră de usturoi/ceapă,\nierburi și zeamă de lămâie.\n2.Gătește-l cu usturoi tocat până se rumenește.\n3.Adaugă laptele, apoi crema de brânză, parmezan, cașcaval\nși fierbe 5–7 min până devine cremos.\n4.Umple lipiile cu amestecul, adaugă mozzarella, rulează și\nașază în tavă.\n5.Presară oregano și pătrunjel, coace 10–15 min la 180°C.","sfaturi":"Poți servi cu iaurt grecesc cu usturoi sau sos de roșii light.\nSe păstrează la frigider 3–4 zile, pot fi reîncălzite la cuptor\nsau air fryer.","alergeni":"gluten (din lipii), lactate (din lapte evaporat, cremă de brânză, parmezan și mozzarella)","variante":"Dacă eviți glutenul, lipiile pot fi înlocuite cu variante fără gluten sau cu foi de salată pentru rulare. Dacă ai intoleranță la lactoză, laptele evaporat și brânzeturile pot fi alese în variante fără lactoză sau vegetale, păstrând o textură cremoasă similară.","macro":{"calorii_macro":"437","proteine":"38.6 g","carbohidrati":"2.3 g","fibre":"0 g","grasimi":"5.9 g","grasimi_saturate":"2.5 g"}},{"id":"rapide-121","titlu":"Wrap cu Ou, Mozzarella și Ardei","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Wrap-uri & Omlete","pagina":121,"portii":"1","timp_minute":10,"calorii":343,"ingrediente":["60g Lipie integrală","Ou fiert 1 buc","30g Mozzarella light","70g Ardei gras","30g Salată verde"],"descriere":"Un wrap simplu, rapid și foarte fresh, în care oul fiert, mozzarella\nlight și ardeiul crocant se combină perfect într-o masă ușoară.","pasi":"1.Fierbe oul și taie-l felii.\n2.Taie ardeiul cubulețe.\n3.Încălzește lipia, apoi adaugă mozzarella, oul, legumele.\n4.Rulează strâns și presează ușor.","sfaturi":"Poți adăuga 1 linguriță de iaurt grecesc sau hummus pentru\no textură mai cremoasă.\nIdeal ca mic dejun echilibrat sau prânz ușor.","alergeni":"gluten (din lipia integrală), ouă, lactate (din mozzarella)","variante":"Dacă eviți glutenul, lipia integrală poate fi înlocuită cu lipie fără gluten sau foi de salată pentru rulare. Dacă ai alergie la ouă, oul fiert poate fi înlocuit cu tofu sau hummus. Dacă eviți lactatele, mozzarella poate fi înlocuită cu o alternativă vegetală sau eliminată.","macro":{"calorii_macro":"343","proteine":"13.9 g","carbohidrati":"4.6 g","fibre":"0.6 g","grasimi":"9.3 g","grasimi_saturate":"3 g"}},{"id":"rapide-122","titlu":"Ruladă Proteică cu Șuncă și Mozzarella în Hârtie de Orez","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Wrap-uri & Omlete","pagina":122,"portii":"2","timp_minute":10,"calorii":298,"ingrediente":["3 foi de hârtie de orez","1 linguriță piper măcinat grosier","2 ouă pentru înmuiat foile (doar 1 ou este contorizat caloric)","2 ouă pentru umplutură","120 g șuncă slabă, fâșii","50 g mozzarella light, rasă","1 lingură ceapă verde tocată","1 g semințe de susan"],"descriere":"O ruladă proteică, crocantă la exterior și super cremoasă la\ninterior, unde șunca slabă și mozzarella light se îmbină perfect în\nfoi de orez — o gustare rapidă, gustoasă și ideală pentru slăbire.","pasi":"1.Bate 2 ouă cu piper și înmoaie foile de orez în amestec.\n2.Prăjește celelalte 2 ouă și taie-le fâșii.\n3.Suprapune foile, adaugă șunca, ouăle, mozzarella și ceapa\nverde.\n4.Rulează strâns, formează o spiră, presară susan și gătește la\nAir Fryer, 200°C timp de 12 minute.","sfaturi":"Dacă hârtia de orez se rupe, poți suprapune o a patra foaie\npeste zonă.\nPoți adăuga legume tocate (ardei sau spanac) în umplutură\npentru un plus de fibre.","alergeni":"ouă, lactate (din mozzarella), gluten (posibil, din hârtia de orez), susan","variante":"Dacă ai alergie la susan, acesta poate fi eliminat fără a afecta rețeta. Dacă eviți lactatele, mozzarella poate fi înlocuită cu o variantă vegetală. Dacă ai alergie la ouă, acestea pot fi înlocuite cu un amestec din făină de năut și apă, pentru legare.","macro":{"calorii_macro":"298","proteine":"16.1 g","carbohidrati":"1.3 g","fibre":"0 g","grasimi":"12.4 g","grasimi_saturate":"4.5 g","greutate_portie":"220 g"}},{"id":"rapide-124","titlu":"Cottage Cheese cu Rondele de Orez și Castraveți","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Gustări Sărate","pagina":124,"portii":"1","timp_minute":10,"calorii":344,"ingrediente":["200 g cottage cheese","40 g rondele de orez","200 g castraveți după gust condimente (sare, piper, ierburi aromatice – opțional)"],"descriere":"Brânză cottage cremoasă cu rondele crocante de orez și\ncastraveți proaspeți, pentru o combinație ușoară și hrănitoare.","pasi":"1.Taie castraveții felii sau cuburi.\n2.Pune cottage cheese într-un bol și adaugă castraveții.\n3.Adaugă rondelele de orez (poți să le zdrobești ușor sau să\nle lași întregi pentru crocant).\n4.Condimentează cu sare, piper sau ierburi aromatice după\ngust.\n5.Servește imediat.","sfaturi":"Pentru un contrast mai plăcut de texturi, adaugă rondelele\nde orez chiar înainte de consum, ca să rămână crocante.\nDacă vrei un gust mai fresh, taie castraveții mai grosier și\nasezonează-i separat cu puțină sare înainte de a-i\namesteca cu cottage cheese.","alergeni":"lactate (din brânza cottage), gluten (posib
