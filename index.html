gorie":"Supe și Ciorbe","pagina":138,"portii":"1","timp_minute":50,"calorii":57,"ingrediente":["20 g morcovi","15 g păstârnac","20 g țelină","15 g ardei gras","40 g cartofi","25 g varză","65 g borș leuștean verde – după gust sare – după gust"],"descriere":"O rețetă tradițională românească, ușoară și revigorantă, bogată în\nfibre și vitamine, ideală pentru detoxifiere și hidratare.","pasi":"1.Curăță toate legumele și taie-le cuburi potrivite.\n2.Pune la fiert într-o oală mare morcovii, păstârnacul, țelina și\ncartofii în 500 ml de apă.\n3.După 15 minute, adaugă ardeiul și varza tocată, apoi continuă\nfierberea încă 15–20 de minute.\n4.Separat, încălzește borșul până aproape de punctul de\nfierbere, apoi toarnă-l peste legume.\n5.Mai lasă ciorba să fiarbă 5 minute, adaugă sarea și leușteanul\nverde tocat.\n6.Oprește focul și las-o acoperită 10 minute pentru a se intensifica\naromele.","sfaturi":"Pentru un gust mai intens, poți sota legumele 2–3 minute în 1\nlinguriță de ulei de măsline înainte de a le fierbe.\nDacă dorești mai multe proteine, adaugă 100 g linte roșie în\ntimpul fierberii.","alergeni":"fără alergeni majori","variante":"Dacă ai sensibilitate la gluten din borș, îl poți înlocui cu aceeași cantitate de zeamă de lămâie sau oțet de mere diluat, obținând aceeași aciditate și menținând aportul caloric aproape identic.","macro":{"calorii_macro":"56.6","proteine":"0.9 g","carbohidrati":"9.3 g","fibre":"1.8 g","grasimi":"0 g","grasimi_saturate":"0 g"}},{"id":"post-139","titlu":"Supă Cremă de Dovleac","carte":"Rețete de post","carte_scurt":"Post","categorie":"Supe și Ciorbe","pagina":139,"portii":"1","timp_minute":35,"calorii":79,"ingrediente":["120 g dovleac plăcintar","35 g cartof","15 g morcov","30 g ceapă sare, piper – după gust nucșoară – un praf"],"descriere":"O supă cremă fină și parfumată, cu gust delicat de dovleac și note\ncalde de nucșoară, reconfortantă și echilibrată.","pasi":"1.Taie dovleacul, cartoful, morcovul și ceapa bucăți mari.\n2.Fierbe-le în 1 litru de apă timp de 20–25 de minute, până când\ndevin foarte moi.\n3.Pasează totul până obții o cremă fină.\n4.Condimentează cu sare, piper și un vârf de nucșoară.","sfaturi":"Poți adăuga 1 lingură de smântână vegetală pentru un gust mai\ncremos.\nMerge foarte bine cu semințe de dovleac coapte deasupra.","alergeni":"fără alergeni majori (atenție doar dacă se adaugă smântână/lactate)","variante":"poți folosi morcov în plus sau cartof dulce în loc de cartof pentru o textură mai cremoasă și un gust mai dulce.","macro":{"calorii_macro":"77.8","proteine":"2 g","carbohidrati":"6.7 g","fibre":"0.8 g","grasimi":"0 g","grasimi_saturate":"0 g"}},{"id":"post-140","titlu":"Ciorbă de Fasole Boabe cu Tarhon","carte":"Rețete de post","carte_scurt":"Post","categorie":"Supe și Ciorbe","pagina":140,"portii":"1","timp_minute":90,"calorii":86,"ingrediente":["50 g fasole albă","23 g ceapă","11 g morcov","23 g ardei gras","8 g bulion","3 g tarhon sare – după gust"],"descriere":"O ciorbă aromată și sățioasă, inspirată din bucătăria\nardelenească, bogată în fibre și proteine vegetale, cu o notă\ninconfundabilă de tarhon proaspăt.","pasi":"1.Lasă fasolea la înmuiat peste noapte, apoi fierbe-o 60–70 de\nminute până devine moale.\n2.Toacă ceapa, morcovul și ardeiul cuburi mici.\n3.Într-o oală mare, călește ceapa 2–3 minute, apoi adaugă\nmorcovul și ardeiul.\n4.Adaugă fasolea fiartă, bulionul și 0,5 litri de apă fierbinte.\n5.Fierbe totul 20–25 de minute, apoi adaugă tarhonul tocat și\npotrivește de sare.\n6.Lasă ciorba să se odihnească 10 minute cu capacul pus pentru\na se intensifica aromele.","sfaturi":"Dacă vrei un gust mai intens, poți pune și puțină afumătură\nvegetală.\nPentru un plus de aromă, poți adăuga 1-2 căței de usturoi la\nfinal.\nMerge foarte bine cu o felie de pâine integrală alături.","alergeni":"fără alergeni majori (posibil gluten dacă se servește cu pâine)","variante":"Dacă ai sensibilitate la tarhon sau la potențialele urme din tarhonul uscat, îl poți înlocui cu aceeași cantitate de pătrunjel proaspăt tocat, păstrând un gust fresh și un aport caloric identic.","macro":{"calorii_macro":"85.4","proteine":"5.1 g","carbohidrati":"12.5 g","fibre":"0.3 g","grasimi":"0.3 g","grasimi_saturate":"0 g"}},{"id":"post-141","titlu":"Supă Cremă de Linte Roșie","carte":"Rețete de post","carte_scurt":"Post","categorie":"Supe și Ciorbe","pagina":141,"portii":"1","timp_minute":35,"calorii":166,"ingrediente":["28 g linte roșie","20 g morcov","45 g ceapă","55 g cartof","1 g boia dulce sare, piper – după gust"],"descriere":"O supă consistentă și aromată, bogată în proteine vegetale, fibre și\nantioxidanți, ideală pentru prânzuri ușoare sau seri răcoroase.","pasi":"1.Curăță și taie ceapa, morcovul și cartoful cuburi.\n2.Pune toate legumele într-o oală cu aproximativ 0,5 litri de apă\nși fierbe-le 10 minute.\n3.Adaugă lintea roșie spălată, sarea, piperul și boiaua dulce.\n4.Fierbe la foc mic 15–20 de minute, până ce lintea se înmoaie\ncomplet.\n5.Pasează totul cu blenderul până obții o cremă fină.\n6.Poți adăuga puțin ulei de măsline sau zeamă de lămâie înainte\nde servire pentru un gust echilibrat.","sfaturi":"Lintea roșie fierbe repede, nu are nevoie de înmuiere peste\nnoapte.\nMerge foarte bine cu pătrunjel proaspăt tocat sau câteva\npicături de zeamă de lămâie.","alergeni":"fără alergeni majori","variante":"Dacă ai sensibilitate la condimente, poți înlocui boiaua dulce cu aceeași cantitate de turmeric sau pătrunjel proaspăt, obținând o aromă blândă și păstrând același aport caloric al rețetei.","macro":{"calorii_macro":"165.4","proteine":"7.9 g","carbohidrati":"27.8 g","fibre":"1.1 g","grasimi":"0.7 g","grasimi_saturate":"0 g"}},{"id":"post-142","titlu":"Ciorbă de Cartofi cu Afumătură Vegetală","carte":"Rețete de post","carte_scurt":"Post","categorie":"Supe și Ciorbe","pagina":142,"portii":"1","timp_minute":40,"calorii":133,"ingrediente":["130 g cartofi","25 g ceapă","12 g morcov","22 g șuncă vegetală","0,5 g tarhon uscat","7 g oțet sare – după gust"],"descriere":"O ciorbă simplă și aromată, cu gust echilibrat între dulce, acrișor și\nnote ușor afumate.","pasi":"1.Taie cuburi cartofii, ceapa și morcovul.\n2.Fierbe ceapa și morcovul 10–15 minute, apoi adaugă cartofii.\n3.După ce legumele sunt moi, adaugă șunca vegetală și tarhonul.\n4.Potrivește de sare, acrește cu oțet și mai fierbe 5 minute.\n5.Lasă 5 minute înainte de servire.","sfaturi":"Pentru o textură mai consistentă, pasează o parte din cartofi și\nadaugă piureul înapoi în ciorbă.\nDacă vrei o ciorbă mai light, elimină afumătura vegetală și\ndublează cantitatea de morcovi sau țelină.\nMerge foarte bine servită cu pâine integrală sau ardei iute.","alergeni":"pot apărea în afumătura vegetală (soia, gluten, etc.) – verifică eticheta","variante":"poți renunța la afumătura vegetală sau o poți înlocui cu ciuperci rumenite pentru un plus de savoare.","macro":{"calorii_macro":"132.4","proteine":"5.2 g","carbohidrati":"21.6 g","fibre":"1.6 g","grasimi":"0.7 g","grasimi_saturate":"0 g"}},{"id":"post-143","titlu":"Supă Cremă de Mazăre Verde","carte":"Rețete de post","carte_scurt":"Post","categorie":"Supe și Ciorbe","pagina":143,"portii":"1","timp_minute":35,"calorii":237,"ingrediente":["105 g mazăre verde","40 g ceapă","55 g cartof sare, piper – după gust","2 g frunze de mentă proaspătă"],"descriere":"O supă cremă fină și răcoritoare, cu gust delicat de mazăre și note\nproaspete de mentă.","pasi":"1.Curăță ceapa și cartoful, taie-le bucăți și pune-le la fiert în 1 litru\nde apă.\n2.După 15 minute, adaugă mazărea și mai fierbe 10 minute.\n3.Pasează cu blenderul până obții o supă fină.\n4.Condimentează cu sare și piper și presară mentă tocată\nînainte de servire.","sfaturi":"Dacă vrei o textură mai cremoasă, adaugă lapte vegetal.\nMerge foarte bine servită cu crutoane din pâine integrală.","alergeni":"fără alergeni majori (posibil gluten dacă se servește cu pâine)","variante":"poți folosi edamame fierte în loc de mazăre pentru un plus de proteine.","macro":{"calorii_macro":"236.3","proteine":"12.8 g","carbohidrati":"38.7 g","fibre":"17.6 g","grasimi":"1.5 g","grasimi_saturate":"0 g"}},{"id":"post-144","titlu":"Ciorbă de Sfeclă Roșie","carte":"Rețete de post","carte_scurt":"Post","categorie":"Supe și Ciorbe","pagina":144,"portii":"1","timp_minute":45,"calorii":95,"ingrediente":["66 g sfeclă roșie","66 g cartofi","13 g morcov","44 g varză albă","7 g suc de lămâie","3 g mărar verde sare – după gust"],"descriere":"O ciorbă aromată și vibrantă, cu gust ușor dulce-acrișor și culoare\nintensă, reconfortantă și plină de prospețime.","pasi":"1.Taie sfecla cubulețe și fierbe-o separat 10 minute, pentru a-și\npăstra culoarea.\n2.Într-o altă oală, fierbe cartofii și morcovul 15 minute, apoi\nadaugă varza tocată.\n3.După ce legumele sunt aproape gata, pune sfecla fiartă și\namestecă.\n4.Acrește cu suc de lămâie și adaugă mărarul verde la final.","sfaturi":"Dacă vrei să o faci mai hrănitoare, poți adăuga o lingură de\nfasole fiartă.\nDacă îți place gustul mai acrișor, poți adăuga borș în loc de\nlămâie.","alergeni":"fără alergeni majori (posibil gluten dacă se servește cu pâine)","variante":"poți adăuga mazăre sau fasole verde pentru mai mult volum și fibre.","macro":{"calorii_macro":"94.2","proteine":"1.4 g","carbohidrati":"14 g","fibre":"1 g","grasimi":"0.1 g","grasimi_saturate":"0 g"}},{"id":"post-150","titlu":"Ghiveci de Legume cu Orez","carte":"Rețete de post","carte_scurt":"Post","categorie":"Feluri Principale","pagina":150,"portii":"1","timp_minute":45,"calorii":93,"ingrediente":["15 g orez basmati","40 g vinete","40 g dovlecel","32 g ardei roșu","55 g roșii","16 g ceapă","3 g ulei de măsline"],"descriere":"Un preparat de post hrănitor și colorat, bogat în fibre și vitamine,\nideal pentru prânz sau cină ușoară.","pasi":"1.Curăță și taie ceapa, morcovii și ardeii în bucăți mici.\n2.Călește ceapa în uleiul de măsline 2–3 minute, apoi adaugă\nmorcovii și ardeii.\n3.Gătește legumele 10 minute la foc mediu, amestecând din când\nîn când.\n4.Adaugă roșiile tocate, orezul spălat și 200 ml apă fierbinte.\n5.Fierbe la foc mic 15–20 de minute, până când orezul este\nmoale și lichidul scade.\n6.Condimentează cu sare și piper după gust, apoi lasă tocană să\nse odihnească 5 minute înainte de servire.","sfaturi":"Pentru un gust mai intens, adaugă puțin usturoi tocat sau boia\nafumată la călirea legumelor.\nDacă îl pregătești pentru mai multe zile, păstrează orezul\nseparat și combină doar înainte de servire ca să nu se îmbibe\nprea mult.","alergeni":"nu conține alergeni majori (atenție la posibile urme de gluten dacă orezul este procesat în fabrici mixte)","variante":"Dacă ai intoleranță la gluten, poți folosi pastă de roșii certificată fără gluten și orez ambalat în mod similar, menținând același gust și un aport caloric identic cu varianta originală.","macro":{"calorii_macro":"92.4","proteine":"1.9 g","carbohidrati":"12.2 g","fibre":"2.8 g","grasimi":"3.2 g","grasimi_saturate":"0 g","greutate_portie":"350 g"}},{"id":"post-151","titlu":"Mâncare de Linte Roșie cu Legume","carte":"Rețete de post","carte_scurt":"Post","categorie":"Feluri Principale","pagina":151,"portii":"1","timp_minute":35,"calorii":189,"ingrediente":["18 g linte roșie","55 g tofu afumat","28 g ardei gras","17 g ceapă roșie","55 g roșii pasate","3 g ulei de măsline"],"descriere":"Un preparat de post bogat în proteine vegetale, cu gust intens și\ntextură cremoasă, potrivit pentru prânzuri echilibrate și energizante.","pasi":"1.Taie tofu-ul cuburi și rumenește-l ușor într-o tigaie cu puțin ulei,\napoi scoate-l deoparte.\n2.Călește ceapa și ardeiul gras în aceeași tigaie 3–4 minute,\npână se înmoaie.\n3.Adaugă lintea roșie spălată, roșiile pasate și 200 ml apă caldă.\n4.Fierbe la foc mic 15–20 de minute, amestecând din când în\ncând, până când lintea devine moale și sosul se îngroașă.\n5.Adaugă tofu-ul rumenit, condimentează cu sare și piper și mai\nlasă pe foc 2–3 minute.\n6.Servește preparatul cald, simplu sau alături de orez sau legume\naburite.","sfaturi":"Spală lintea de 2–3 ori înainte de fierbere – va fierbe mai\nuniform și nu va balona.\nRețeta se păstrează foarte bine 2–3 zile la frigider, așa că o\npoți face în avans pentru mai multe mese.","alergeni":"soia (din tofu)","variante":"Dacă ai alergie la soia, poți înlocui tofu cu aceeași cantitate de ciuperci brune sotate, care aduc volum și textură similară, menținând un aport caloric foarte apropiat.","macro":{"calorii_macro":"188.6","proteine":"11.9 g","carbohidrati":"15.5 g","fibre":"0.7 g","grasimi":"7.8 g","grasimi_saturate":"0 g","greutate_portie":"330 g"}},{"id":"post-152","titlu":"Quinoa cu Fasole Rosie și Legume","carte":"Rețete de post","carte_scurt":"Post","categorie":"Feluri Principale","pagina":152,"portii":"1","timp_minute":25,"calorii":234,"ingrediente":["52 g quinoa fiartă","75 g fasole roșie","38 g ardei gras","23 g ceapă","7 g ulei de măsline","4 g zeamă de lămâie"],"descriere":"Un preparat echilibrat și aromat, cu quinoa hrănitoare, fasole roșie\nși legume sotate, cu note ușor fresh de lămâie.","pasi":"1.Fierbe quinoa conform instrucțiunilor (aprox. 15 min).\n2.Într-o tigaie, călește ceapa și ardeiul în uleiul de măsline.\n3.Adaugă fasolea roșie și quinoa fiartă, amestecând bine.\n4.Condimentează cu sare, piper, oregano sau chimion (merge\nexcelent în stil mexican).\n5.La final, stropește cu zeamă de lămâie pentru prospețime.","sfaturi":"Spal-o bine înainte de fierbere, ca să elimini gustul amărui dat\nde saponine.\nFolosește boia afumată, chimion și coriandru – combină\nexcelent cu fasolea roșie.","alergeni":"nu conține alergeni majori","variante":"poți folosi năut fiert în loc de fasole roșie pentru o aromă și textură diferită.","macro":{"calorii_macro":"233.8","proteine":"9.5 g","carbohidrati":"29.9 g","fibre":"0 g","grasimi":"8.4 g","grasimi_saturate":"0 g"}},{"id":"post-153","titlu":"Wrap cu Tofu, Avocado și Legume","carte":"Rețete de post","carte_scurt":"Post","categorie":"Feluri Principale","pagina":153,"portii":"1","timp_minute":10,"calorii":285,"ingrediente":["65 g tofu afumat","40 g lipie integrală","25 g avocado","33 g mix salată verde","33 g castraveți","3 g ulei de măsline"],"descriere":"Un preparat fresh și echilibrat, cu texturi contrastante între tofu-ul\nrumenit, avocado-ul cremos și legumele crocante.","pasi":"1.Încălzește ușor lipia într-o tigaie antiaderentă sau pe grill.\n2.Taie tofu în fâșii și rumenește-l 2–3 minute (opțional, pentru\ntextură mai crocantă).\n3.Taie avocado și castraveții felii subțiri.\n4.În mijlocul lipiei pune salata, legumele și tofu.\n5.Stropește cu ulei de măsline, rulează strâns și servește imediat.","sfaturi":"Adaugă câteva frunze de mentă sau pătrunjel verde în wrap.\nPregătește ingredientele separat și rulează wrap-ul doar\nînainte de servire, ca să nu se înmoaie lipia.","alergeni":"soia (tofu), gluten (lipie integrală)","variante":"poți folosi lipie fără gluten sau foi de orez; poți înlocui tofu afumat cu tempeh sau pui pentru o versiune non-vegană.","macro":{"calorii_macro":"285.2","proteine":"9.3 g","carbohidrati":"3.7 g","fibre":"2.2 g","grasimi":"12 g","grasimi_saturate":"0 g"}},{"id":"post-154","titlu":"Paste Integrale cu Sos de Roșii","carte":"Rețete de post","carte_scurt":"Post","categorie":"Feluri Principale","pagina":154,"portii":"1","timp_minute":15,"calorii":210,"ingrediente":["40 g paste integrale","105 g roșii pasate","5 g usturoi","5 g ulei de măsline"],"descriere":"Un preparat simplu și aromat, cu sos fin de roșii și note discrete de\nusturoi, echilibrat și reconfortant.","pasi":"1.Fierbe pastele conform instrucțiunilor de pe ambalaj (al dente).\n2.Într-o tigaie, încinge uleiul de măsline și călește usturoiul tocat fin\ncâteva secunde.\n3.Adaugă roșiile pasate și lasă sosul să fiarbă 5–7 minute.\n4.Amestecă pastele fierte cu sosul, asezonează cu sare și piper\ndupă gust.","sfaturi":"Păstrează o cană din apa în care au fiert pastele și adaugă\npuțin în sos pentru o consistență mai cremoasă.\nAdaugă câteva picături de oțet balsamic sau un vârf de zahăr\nbrun pentru a echilibra aciditatea roșiilor.","alergeni":"conține gluten (paste integrale)","variante":"poți folosi paste fără gluten (porumb, orez, hrișcă) sau paste din leguminoase; poți adăuga parmezan pentru un plus de gust, dacă tolerezi lactatele.","macro":{"calorii_macro":"209.6","proteine":"5.1 g","carbohidrati":"30 g","fibre":"3.5 g","grasimi":"5.8 g","grasimi_saturate":"0 g"}},{"id":"post-155","titlu":"Mâncare de Mazăre cu Baby Morcovi și Tofu","carte":"Rețete de post","carte_scurt":"Post","categorie":"Feluri Principale","pagina":155,"portii":"1","timp_minute":25,"calorii":174,"ingrediente":["70 g tofu afumat","35 g mazăre","35 g morcovi baby","35 g roșii pasate","18 g ceapă","2 g usturoi","2 g ulei de măsline"],"descriere":"Un preparat aromat și consistent, cu mazăre dulce, morcovi fragezi\nși tofu rumenit, legate într-un sos ușor tomat.","pasi":"1.Taie cubulețe tofu-ul și prăjește-l ușor într-o tigaie cu puțin ulei\nde măsline, până devine auriu.\n2.Adaugă ceapa și usturoiul tocate mărunt, lasă-le să se înmoaie.\n3.Pune morcovii și mazărea, apoi toarnă roșiile pasate.\n4.Condimentează cu sare, piper, oregano sau cimbru.\n5.Fierbe la foc mic 10–12 minute, până legumele devin fragede și\nsosul se leagă.","sfaturi":"Poți adăuga 1 linguriță de boia dulce sau curry pentru un gust\nmai intens.\nSe servește simplă sau alături de 50 g orez basmati fiert (pentru\nextra carbohidrați).\nSe păstrează 2 zile la frigider, într-un recipient închis ermetic.","alergeni":"poate conține soia (tofu afumat)","variante":"poți înlocui tofu afumat cu tempeh, ciuperci sau piept de pui pentru o versiune non-vegană; mazărea poate fi înlocuită cu fasole verde, iar baby morcovii cu morcov obișnuit tăiat cuburi.","macro":{"calorii_macro":"174","proteine":"11.5 g","carbohidrati":"9 g","fibre":"2.7 g","grasimi":"7.7 g","grasimi_saturate":"0 g"}},{"id":"post-156","titlu":"Pilaf cu Morcovi și Tofu Afumat","carte":"Rețete de post","carte_scurt":"Post","categorie":"Feluri Principale","pagina":156,"portii":"1","timp_minute":30,"calorii":150,"ingrediente":["45 g tofu afumat","15 g orez basmati","30 g morcovi baby","15 g ceapă","2 g ulei de măsline","20 g supă concentrată de legume","73 g apă"],"descriere":"Un preparat aromat și reconfortant, cu orez pufos, morcovi dulci și\ntofu afumat rumenit, perfect echilibrat.","pasi":"1.Călește ceapa în puțin ulei de măsline.\n2.Adaugă morcovii tăiați rondele și orezul basmati.\n3.Toarnă supa concentrată și apa, apoi lasă la fiert până se\nabsoarbe lichidul și orezul este gătit.\n4.Separat, prăjește cubulețele de tofu afumat până devin aurii.\n5.Amestecă totul și servește cald.","sfaturi":"Adaugă o frunză de dafin și un praf de cimbru sau oregano în\ntimp ce fierbe orezul.\nSe păstrează 2 zile la frigider, dar e bine să ții tofu separat și\nsă-l adaugi abia la încălzire, ca să rămână crocant.","alergeni":"poate conține soia (tofu afumat)","variante":"poți înlocui tofu cu tempeh, ciuperci sau piept de pui pentru o versiune non-vegană; orezul basmati poate fi înlocuit cu orez integral sau cușcuș.","macro":{"calorii_macro":"150.1","proteine":"7.5 g","carbohidrati":"14.8 g","fibre":"0.8 g","grasimi":"6 g","grasimi_saturate":"0 g"}},{"id":"post-157","titlu":"Paste Fusilli High-protein","carte":"Rețete de post","carte_scurt":"Post","categorie":"Feluri Principale","pagina":157,"portii":"1","timp_minute":15,"calorii":208,"ingrediente":["30 g paste integrale","40 g șuncă vegană","80 g roșii pasate","15 g ceapă","5 g ulei de măsline"],"descriere":"Un preparat modern și sățios, cu paste proteice și sos aromat de\nroșii, echilibrat și ușor de pregătit.","pasi":"1.Fierbe pastele conform instrucțiunilor de pe ambalaj (aprox. 8–\n10 minute), apoi scurge-le bine.\n2.Într-o tigaie, adaugă uleiul de măsline și călește ceapa tocată\nmărunt 1–2 minute.\n3.Adaugă șunca vegană tăiată cubulețe sau fâșii și gătește-o 2–3\nminute, până prinde aromă.\n4.Toarnă roșiile pasate și lasă sosul să fiarbă ușor 5 minute,\namestecând ocazional.\n5.Adaugă pastele în tigaie și amestecă bine, astfel încât să se\nîmbrace uniform cu sosul.","sfaturi":"După ce fierbi pastele, clătește-le scurt cu apă caldă și\namestecă-le cu o linguriță de ulei de măsline înainte de a le\npune în sos.\nAdaugă un cățel de usturoi tocat sau câteva fulgi de chilli când\ncălești ceapa.","alergeni":"gluten (paste, dacă nu sunt fără gluten), soia (din șunca vegană, în funcție de brand)","variante":"poți folosi paste fără gluten din orez sau porumb; poți înlocui șunca vegană cu tofu afumat sau ciuperci sotate.","macro":{"calorii_macro":"207.3","proteine":"10.2 g","carbohidrati":"22.5 g","fibre":"2.6 g","grasimi":"6.8 g","grasimi_saturate":"0 g"}},{"id":"post-158","titlu":"Burger Vegan","carte":"Rețete de post","carte_scurt":"Post","categorie":"Feluri Principale","pagina":158,"portii":"1","timp_minute":15,"calorii":320,"ingrediente":["45 g chiflă hamburger","90 g burger vegan Aivia","9 g ketchup low zahăr","9 g muștar clasic","9 g ceapă","18 g roșii","9 g castraveți murați","9 g salată verde"],"descriere":"Un preparat suculent și savuros, cu burger vegan rumenit, legume\nproaspete și sosuri clasice, într-o combinație echilibrată și\nsatisfăcătoare.","pasi":"1.Taie chifla de burger pe jumătate și prăjește-o ușor într-o tigaie\nsau pe grill pentru un plus de textură.\n2.Gătește burgerul vegan într-o tigaie antiaderentă, câte 2–3\nminute pe fiecare parte, până prinde crustă aurie.\n3.Unge partea de jos a chiflei cu ketchup și muștar.\n4.Adaugă burgerul gătit, apoi ceapa, roșiile, castraveții murați și\nsalata verde.\n5.Acoperă cu cealaltă jumătate de chiflă și servește imediat.","sfaturi":"Stropește roșiile cu puțină zeamă de lămâie sau adaugă frunze\nde rucola pentru un gust mai intens.\nGătește burgerul și taie legumele în avans, dar montează\nburgerul doar înainte de servire ca să nu se înmoaie chifla.","alergeni":"gluten (din chiflă), muștar, posibil soia (din burgerul vegan)","variante":"poți folosi chiflă fără gluten; poți înlocui burgerul vegan cu tofu afumat, ciuperci la grătar.","macro":{"calorii_macro":"319.8","proteine":"17.2 g","carbohidrati":"25.6 g","fibre":"2.4 g","grasimi":"2.6 g","grasimi_saturate":"0 g"}},{"id":"post-159","titlu":"Salată de Vinete cu Tofu și Lipie Integrală","carte":"Rețete de post","carte_scurt":"Post","categorie":"Feluri Principale","pagina":159,"portii":"1","timp_minute":15,"calorii":215,"ingrediente":["85 g vinete","55 g tofu K-Classic","28 g lipie integrală","3 g ulei de măsline","55 g roșie"],"descriere":"Un preparat echilibrat și aromat, cu vinete catifelate, tofu ușor\nrumenit și note proaspete de roșii, completate de lipia integrală.","pasi":"1.Coace vinetele (sau folosește vinete coapte congelate).\n2.Pasează vinetele cu uleiul de măsline și adaugă puțină sare\ndupă gust.\n3.Taie tofu cubulețe și rumenește-l ușor într-o tigaie antiaderentă\n(sau folosește-l crud, dacă preferi).\n4.Servește salata de vinete alături de roșia feliată, tofu și lipia\nintegrală.","sfaturi":"Dacă ești pe fugă, folosește vinete coapte congelate (gata\ncurățate) – economisești timp.\nVinetele coapte și curățate rezistă 2–3 zile la frigider, deci le\npoți pregăti dinainte.","alergeni":"gluten (din lipie), soia (din tofu)","variante":"poți folosi lipie fără gluten sau foi de porumb; tofu poate fi înlocuit cu tempeh sau halloumi.","macro":{"calorii_macro":"215.2","proteine":"8 g","carbohidrati":"5.9 g","fibre":"3.1 g","grasimi":"7.4 g","grasimi_saturate":"0 g"}},{"id":"post-160","titlu":"Burger Vegetal cu Salată Caldă de Legume","carte":"Rețete de post","carte_scurt":"Post","categorie":"Feluri Principale","pagina":160,"portii":"1","timp_minute":15,"calorii":428,"ingrediente":["95 g burger vegetal","95 g mix de legume mexicane","6 g ulei de măsline","6 g castraveți murați","45 g chiflă hamburger"],"descriere":"Un preparat sățios și aromat, cu burger vegetal rumenit și salată\ncaldă de legume crocante, perfect echilibrat între texturi și gusturi.","pasi":"1.Gătește burgerul vegetal pe grill sau într-o tigaie antiaderentă,\nfără ulei suplimentar.\n2.Într-o tigaie separată, sotează legumele mexicane în uleiul de\nmăsline, până devin fragede dar încă crocante.\n3.Servește burgerul alături de salata caldă de legume.\n4.Completează farfuria cu câțiva castraveți murați pentru gust\nacrișor.","sfaturi":"Burgerul vegetal se gătește rapid, dar legumele sotate pot fi\nfăcute dinainte și încălzite înainte de servire.\nServește cu o linguriță de iaurt vegetal cu lămâie pe lângă, ca\nsos light.","alergeni":"soia (din burger, în funcție de brand), gluten (dacă burgerul are adaosuri)","variante":"poți alege o chiflă fără gluten sau o chiflă proteică; burgerul vegetal poate fi înlocuit cu tofu afumat, tempeh sau un burger din năut/linte.","macro":{"calorii_macro":"427.7","proteine":"21.3 g","carbohidrati":"35.7 g","fibre":"2 g","grasimi":"8.5 g","grasimi_saturate":"0 g"}},{"id":"post-161","titlu":"Falafel la Cuptor","carte":"Rețete de post","carte_scurt":"Post","categorie":"Feluri Principale","pagina":161,"portii":"1","timp_minute":30,"calorii":340,"ingrediente":["100 g falafel Inedit","65 g iaurt de soia","2 g zeamă de lămâie","1 g usturoi","32 g dovlecel","1 g pătrunjel"],"descriere":"Un preparat crocant și aromat, cu falafel rumenit la cuptor, sos\nrăcoritor de iaurt și legume ușor trase la tigaie, perfect echilibrat.","pasi":"1.Falafel: coace la 180°C, 15–20 min, până devine crocant.\n2.Sos: amestecă iaurtul de soia cu zeamă de lămâie, usturoi pisat,\npătrunjel, sare și piper.\n3.Legume: gătește dovlecelul felii, 2–3 min/parte, pe grătar sau\ntigaie antiaderentă.\n4.Servire: așază falafelul cu dovlecelul rumenit și toarnă sosul de\niaurt deasupra.","sfaturi":"Întoarce falafelul la jumătatea timpului de coacere și\npulverizează puțin ulei de măsline pe suprafață.\nFalafelul gătit la cuptor se păstrează bine 2 zile în frigider și se\npoate reîncălzi rapid în airfryer sau cuptor.","alergeni":"poate conține soia și gluten (în funcție de compoziția falafelului)","variante":"poți înlocui iaurtul de soia cu iaurt de cocos; poți folosi falafel făcut în casă din năut hidratat pentru o versiune mai fresh.","macro":{"calorii_macro":"339.4","proteine":"18 g","carbohidrati":"32.1 g","fibre":"0.4 g","grasimi":"1.3 g","grasimi_saturate":"0 g"}},{"id":"post-162","titlu":"Tocană de Năut cu Rosii și Usturoi","carte":"Rețete de post","carte_scurt":"Post","categorie":"Feluri Principale","pagina":162,"portii":"1","timp_minute":10,"calorii":190,"ingrediente":["117 g năut fiert","78 g roșie","4 g ulei de măsline extravirgin","1 g usturoi"],"descriere":"Un preparat simplu și aromat, cu năut fraged, roșii suculente și\nparfum intens de usturoi, legate într-un sos ușor și savuros.","pasi":"1.Călește usturoiul tocat mărunt în ulei de măsline, la foc mic.\n2.Adaugă roșiile cuburi și lasă-le să fiarbă câteva minute.\n3.Pune năutul fiert și amestecă bine.\n4.Condimentează cu sare, piper și verdețuri după gust.","sfaturi":"Poți adăuga și pătrunjel proaspăt pentru un plus de prospețime.","alergeni":"fără alergeni majori (verifică eticheta roșiilor conservate pentru eventuale urme de gluten sau țelină)","variante":"poți înlocui năutul cu fasole albă sau linte fiartă; poți adăuga verdețuri (pătrunjel, busuioc) sau un strop de zeamă de lămâie pentru un gust mai fresh.","macro":{"calorii_macro":"189.3","proteine":"0.1 g","carbohidrati":"2.7 g","fibre":"0.8 g","grasimi":"4 g","grasimi_saturate":"0 g"}},{"id":"post-163","titlu":"Wrap Rece cu Crenvurști Vegetali și Vinete Coapte","carte":"Rețete de post","carte_scurt":"Post","categorie":"Feluri Principale","pagina":163,"portii":"1","timp_minute":10,"calorii":330,"ingrediente":["70 g crenvurști vegetali","35 g lipie integrală","52 g salată de vinete","43 g roșii cherry"],"descriere":"Un preparat fresh și sățios, cu crenoști vegetali, vinete catifelate și\nroșii suculente, într-o combinație echilibrată și ușor de asamblat.","pasi":"1.Încălzește puțin lipia integrală (opțional, pentru o textură mai\nmoale).\n2.Unge lipia cu salata de vinete.\n3.Adaugă crenvurștii vegetali feliați și roșiile cherry tăiate în\njumătate.\n4.Rulează strâns wrap-ul și servește rece.","sfaturi":"Stropește roșiile cu puțin oțet balsamic sau zeamă de lămâie\nînainte să le pui în wrap.\nPoți pregăti ingredientele dinainte, dar rulează wrap-ul chiar\nînainte de servire ca să nu se înmoaie lipia.","alergeni":"poate conține gluten (lipie integrală) și soia (crenvurști vegetali)","variante":"poți folosi lipie fără gluten sau foi de orez; poți înlocui crenvurștii vegetali cu tofu afumat, tempeh.","macro":{"calorii_macro":"329.6","proteine":"4.5 g","carbohidrati":"8 g","fibre":"0 g","grasimi":"18.3 g","grasimi_saturate":"0 g"}},{"id":"post-164","titlu":"Sandwich cu Șuncă Vegetală și Cremă de Năut","carte":"Rețete de post","carte_scurt":"Post","categorie":"Feluri Principale","pagina":164,"portii":"1","timp_minute":10,"calorii":340,"ingrediente":["75 g pâine integrală","62 g șuncă vegetală","50 g hummus simplu","13 g roșie"],"descriere":"Un preparat simplu și echilibrat, cu cremă fină de năut, șuncă\nvegetală și prospețimea roșiei, rapid și sățios.","pasi":"1.Întinde hummusul pe feliile de pâine.\n2.Adaugă șunca vegetală și roșia feliată subțire.\n3.Închide sandwich-ul și servește-l simplu sau alături de o mică\nsalată verde.","sfaturi":"Prăjește feliile de pâine înainte – gustul devine mai intens și\nsandwich-ul mai plăcut la mușcat.\nIngredientele se păstrează bine separat; asamblează\nsandwich-ul chiar înainte de masă ca să nu se înmoaie pâinea.","alergeni":"poate conține gluten (pâine integrală) și soia (șuncă vegetală, hummus)","variante":"poți folosi pâine fără gluten; poți înlocui șunca vegetală cu tofu afumat, tempeh.","macro":{"calorii_macro":"339.4","proteine":"22.4 g","carbohidrati":"33.1 g","fibre":"0.1 g","grasimi":"7.9 g","grasimi_saturate":"0 g"}},{"id":"post-165","titlu":"Fasole Păstăi Sotate cu Tofu Afumat","carte":"Rețete de post","carte_scurt":"Post","categorie":"Feluri Principale","pagina":165,"portii":"1","timp_minute":15,"calorii":181,"ingrediente":["115 g fasole verde","75 g tofu afumat","4 g ulei de măsline","6 g usturoi sare, piper – după gust","2 g pătrunjel verde (opțional)"],"descriere":"Un preparat simplu și aromat, cu fasole verde crocantă și tofu\nafumat rumenit, legate de un parfum discret de usturoi.","pasi":"1.Spală fasolea verde și rupe capetele. Fierbe-o 5–6 minute în\napă cu puțină sare, apoi scurge bine.\n2.Taie tofu afumat cubulețe.\n3.Într-o tigaie antiaderentă, adaugă uleiul de măsline și usturoiul\ntocat. Călește 30 secunde până devine aromat.\n4.Adaugă fasolea verde și tofu. Soté rapid 3–4 minute,\namestecând constant.\n5.Condimentează cu sare, piper și, dacă vrei, pătrunjel verde.","sfaturi":"După fierbere, trece fasolea prin apă cu gheață – își păstrează\nculoarea verde intens și textura crocantă.\nMarinează cubulețele de tofu 10–15 minute în sos de soia +\nboia afumată + un strop de zeamă de lămâie.","alergeni":"poate conține soia (tofu)","variante":"poți înlocui tofu afumat cu tempeh sau ciuperci sotate","macro":{"calorii_macro":"180.6","proteine":"11.3 g","carbohidrati":"8.2 g","fibre":"3.5 g","grasimi":"10 g","grasimi_saturate":"0 g"}},{"id":"post-167","titlu":"Cartofi Copți cu Rozmarin și Usturoi","carte":"Rețete de post","carte_scurt":"Post","categorie":"Garnituri și Legume","pagina":167,"portii":"2","timp_minute":50,"calorii":180,"ingrediente":["385 g cartofi","4 g usturoi (≈ 1–2 căței)","10 g ulei de măsline","1 g rozmarin uscat sare, piper – după gust"],"descriere":"Un preparat aromat și reconfortant, cu cartofi rumeniți uniform,\nparfumați cu rozmarin și usturoi pentru un gust intens și echilibrat.","pasi":"1.Spală bine cartofii și taie-i felii groase sau cuburi.\n2.Pune-i într-un bol, adaugă uleiul, usturoiul pisat, rozmarinul, sarea\nși piperul.\n3.Amestecă bine, apoi întinde cartofii într-o tavă tapetată cu\nhârtie de copt.\n4.Coace la 200°C timp de 40 minute, amestecând o dată la\njumătatea timpului pentru rumenire uniformă.","sfaturi":"Pentru un gust mai crocant, lasă cartofii în apă rece 15 minute","alergeni":"fără alergeni majori","variante":"poți adăuga boia afumată, cimbru sau usturoi granulat; poți înlocui rozmarinul cu mix de ierburi italiene sau pătrunjel proaspăt pentru o aromă mai delicată.","macro":{"calorii_macro":"179.1","proteine":"2.05 g","carbohidrati":"28.9 g","fibre":"1.95 g","grasimi":"5 g","grasimi_saturate":"0 g"}},{"id":"post-168","titlu":"Legume Rădăcinoase la Cuptor","carte":"Rețete de post","carte_scurt":"Post","categorie":"Garnituri și Legume","pagina":168,"portii":"2","timp_minute":45,"calorii":138,"ingrediente":["100 g morcovi","120 g păstârnac","75 g sfeclă","90 g țelină","12 g ulei de măsline","1 g cimbru uscat sare – după gust"],"descriere":"O garnitură colorată, plină de nutrienți și arome naturale, perfectă\nalături de carne slabă, tofu sau cereale integrale.","pasi":"1.Curăță toate legumele și taie-le cuburi de dimensiuni egale.\n2.Pune-le într-un bol mare, adaugă uleiul de măsline, cimbrul și\nsarea, apoi amestecă bine pentru a le acoperi uniform.\n3.Așază legumele într-o tavă tapetată cu hârtie de copt, într-un\nsingur strat.\n4.Coace la 200°C timp de 35–40 de minute, amestecând la\njumătatea timpului, până devin fragede și ușor caramelizate.\n5.Servește-le calde, simple sau ca garnitură.","sfaturi":"Poți adăuga usturoi sau rozmarin pentru un plus de aromă.\nServește ca garnitură lângă tofu, sau leguminoase.","alergeni":"fără alergeni majori","variante":"Dacă ai sensibilitate la condimente, poți înlocui cimbrul cu aceeași cantitate de pătrunjel proaspăt tocat după coacere, păstrând același aport caloric și o aromă naturală, fresh.","macro":{"calorii_macro":"137.85","proteine":"1.1 g","carbohidrati":"7.1 g","fibre":"4.5 g","grasimi":"6.15 g","grasimi_saturate":"0 g","greutate_portie":"165 g"}},{"id":"post-169","titlu":"Vinete Coapte cu Usturoi și Pătrunjel","carte":"Rețete de post","carte_scurt":"Post","categorie":"Garnituri și Legume","pagina":169,"portii":"2","timp_minute":40,"calorii":127,"ingrediente":["560 g vinete","6 g usturoi (≈ 2 căței)","13 g ulei de măsline sare – după gust","6 g pătrunjel verde"],"descriere":"O garnitură simplă și aromată, cu textură fragedă și gust intens,\npotrivită pentru mesele de vară sau preparatele de post.","pasi":"1.Taie vinetele rondele de aproximativ 1 cm grosime și presară\nsare peste ele. Lasă-le 15 minute pentru a elimina excesul de\napă, apoi șterge-le cu un prosop de hârtie.\n2.Așază feliile într-o tavă tapetată cu hârtie de copt și stropește-\nle cu uleiul de măsline.\n3.Coace-le la 200°C timp de 25–30 de minute, întorcându-le la\njumătatea timpului.\n4.Zdrobește usturoiul și amestecă-l cu pătrunjelul tocat și puțin\nulei.\n5.Scoate vinetele din cuptor, unge-le cu amestecul de usturoi și\npătrunjel, și mai lasă-le 2–3 minute în cuptor pentru a se îmbina\naromele.\n6.Servește calde sau la temperatura camerei.","sfaturi":"","alergeni":"fără alergeni majori","variante":null,"macro":{"calorii_macro":"126.5","proteine":"3.05 g","carbohidrati":"14.2 g","fibre":"8.5 g","grasimi":"6.5 g","grasimi_saturate":"0 g","greutate_portie":"195 g"}},{"id":"post-170","titlu":"Conopidă la Cuptor cu Turmeric","carte":"Rețete de post","carte_scurt":"Post","categorie":"Garnituri și Legume","pagina":170,"portii":"2","timp_minute":35,"calorii":110,"ingrediente":["385 g conopidă","13 g ulei de măsline","1 g turmeric pudră sare, piper – după gust"],"descriere":"O garnitură aromată și plină de culoare, cu proprietăți\nantiinflamatoare datorită turmericului, ideală alături de preparate\ndin pește, tofu sau carne slabă.","pasi":"1.Desfă conopida în buchețele și spal-o bine sub jet de apă rece.\n2.Pune-o într-un bol mare și adaugă uleiul de măsline, turmericul,\nsarea și piperul. Amestecă bine pentru a acoperi uniform toate\nbuchețelele.\n3.Așază conopida într-o tavă tapetată cu hârtie de copt, într-un\nsingur strat.\n4.Coace la 200°C timp de 25–30 de minute, până devine aurie\nși ușor crocantă la exterior.\n5.Servește caldă, simplă sau ca garnitură.","sfaturi":"Poți adăuga și un praf de curry pentru un gust exotic.\nAdaugă un strop de zeamă de lămâie și pătrunjel proaspăt\ntocat pentru un plus de prospețime.\nPoți servi conopida alături de tofu, năut sau orez brun pentru o\nmasă completă.","alergeni":"fără alergeni majori","variante":"Dacă ai sensibilitate la condimente, poți înlocui turmericul cu aceeași cantitate de boia dulce, care păstrează culoarea și nu modifică semnificativ aportul caloric al preparatului.","macro":{"calorii_macro":"109.4","proteine":"1.95 g","carbohidrati":"0 g","fibre":"0 g","grasimi":"6.5 g","grasimi_saturate":"0 g","greutate_portie":"165 g"}},{"id":"post-171","titlu":"Broccoli si Morcovi Copți cu Sos de Soia","carte":"Rețete de post","carte_scurt":"Post","categorie":"Garnituri și Legume","pagina":171,"portii":"2","timp_minute":30,"calorii":106,"ingrediente":["190 g broccoli","190 g morcovi","19 g sos de soia light","6 g ulei de măsline"],"descriere":"Un preparat simplu și plin de savoare, cu legume fragede și ușor\ncaramelizate, îmbrăcate într-o aromă discretă de sos de soia.","pasi":"1.Taie morcovii bastonașe și broccoli în buchețele.\n2.Amestecă legumele într-un bol cu sosul de soia și uleiul.\n3.Pune totul într-o tavă și coace la 190°C timp de 20 minute.","sfaturi":"Poți adăuga semințe de susan sau fulgi de ardei iute pentru un\nplus de aromă.\nServește cu orez brun sau quinoa pentru o masă completă.","alergeni":"conține soia (sos de soia)","variante":"poți folosi sos tamari fără gluten; poți înlocui broccoli cu conopidă sau fasole verde, iar morcovii cu dovlecel pentru o variantă mai ușoară.","macro":{"calorii_macro":"105.65","proteine":"2.75 g","carbohidrati":"9.1 g","fibre":"2.65 g","grasimi":"3.2 g","grasimi_saturate":"0 g"}},{"id":"post-172","titlu":"Cartofi Dulci Copți cu Chimen","carte":"Rețete de post","carte_scurt":"Post","categorie":"Garnituri și Legume","pagina":172,"portii":"2","timp_minute":40,"calorii":222,"ingrediente":["390 g cartofi dulci","8 g ulei de măsline","1,5 g semințe de chimen sare – după gust"],"descriere":"Un preparat aromat și reconfortant, cu cartofi dulci moi la interior și\nrumeniți la exterior, parfumați cu note calde de chimen.","pasi":"1.Curăță cartofii dulci și taie-i cuburi.\n2.Amestecă-i cu ulei, sare și chimen.\n3.Coace la 200°C timp de 30 minute, până devin rumeni și moi în\ninterior.","sfaturi":"Poți adăuga boia afumată sau usturoi pudră pentru un plus de\naromă.\nServește ca garnitură alături de tofu, sau leguminoase.","alergeni":"nu conține alergeni majori","variante":"poți înlocui uleiul de măsline cu ulei de cocos pentru o aromă diferită sau poți folosi boia afumată în loc de chimion pentru un gust mai intens.","macro":{"calorii_macro":"222.3","proteine":"1.95 g","carbohidrati":"39 g","fibre":"5.85 g","grasimi":"4 g","grasimi_saturate":"0 g"}},{"id":"post-173","titlu":"Dovlecel la Cuptor cu Ierburi Aromate","carte":"Rețete de post","carte_scurt":"Post","categorie":"Garnituri și Legume","pagina":173,"portii":"2","timp_minute":35,"calorii":93,"ingrediente":["380 g dovlecei","17 g ulei de măsline","1,7 g oregano uscat sare, piper – după gust"],"descriere":"Un preparat simplu și parfumat, cu dovlecei fragezi, aromați cu\nierburi uscate și rumeniți ușor la cuptor pentru un gust echilibrat.","pasi":"1.Spală dovleceii și taie-i rondele groase.\n2.Amestecă-i cu ulei, oregano, sare și piper.\n3.Pune-i într-o tavă și coace la 190°C timp de 25 minute.","sfaturi":"Adaugă usturoi pisat sau parmezan ras pentru mai multă aromă.","alergeni":"nu conține alergeni majori","variante":"poți adăuga parmezan vegan pentru un plus de savoare sau poți înlocui oregano cu busuioc, cimbru sau ierburi de Provence după preferințe.","macro":{"calorii_macro":"92.85","proteine":"1.9 g","carbohidrati":"3.8 g","fibre":"1.9 g","grasimi":"8.5 g","grasimi_saturate":"0 g"}},{"id":"post-174","titlu":"Ardei Copți cu Usturoi","carte":"Rețete de post","carte_scurt":"Post","categorie":"Garnituri și Legume","pagina":174,"portii":"2","timp_minute":35,"calorii":72,"ingrediente":["390 g ardei grași","3 g usturoi","5 g ulei de măsline sare – după gust"],"descriere":"Un preparat simplu și intens aromat, cu ardei copți dulci și suculenți,\ndesăvârșiți de usturoi și ulei de măsline.","pasi":"1.Coace ardeii pe plită, grătar sau în cuptor până când coaja se\nînnegrește.\n2.Pune-i într-un bol acoperit 10 minute, apoi curăță-i de coajă și\nsemințe.\n3.Stropește-i cu ulei și adaugă usturoiul pisat și sarea.","sfaturi":"Adaugă puțin oțet balsamic sau pătrunjel tocat pentru un plus\nde gust.\nPot fi serviți ca garnitură sau ca topping pentru bruschete.","alergeni":"nu conține alergeni majori","variante":"poți adăuga oțet balsamic sau oțet de vin pentru un gust mai intens; poți înlocui usturoiul crud cu usturoi copt pentru o aromă mai dulce și mai blândă.","macro":{"calorii_macro":"71.7","proteine":"2.05 g","carbohidrati":"7.8 g","fibre":"0 g","grasimi":"2.5 g","grasimi_saturate":"0 g"}},{"id":"post-175","titlu":"Sfeclă Rosie Coaptă cu Hrean","carte":"Rețete de post","carte_scurt":"Post","categorie":"Garnituri și Legume","pagina":175,"portii":"2","timp_minute":70,"calorii":122,"ingrediente":["390 g sfeclă roșie","9 g ulei de măsline sare – după gust hrean ras – pentru servire"],"descriere":"Un preparat simplu și intens aromat, cu sfeclă dulce coaptă lent și\ncontrast iute de hrean, pentru un gust echilibrat și plin de\npersonalitate.","pasi":"1.Spală sfecla și coace-o întreagă la 200°C timp de 50–60\nminute.\n2.După ce s-a răcit, curăță coaja și taie felii.\n3.Asezonează cu sare, ulei și servește cu hrean ras.","sfaturi":"Poți adăuga o linguriță de oțet balsamic pentru o notă\nacrișoară.\nServește ca garnitură rece alături de tofu sau leguminoase.","alergeni":"nu conține alergeni majori","variante":"poți înlocui hreanul ras cu hrean din borcan light; poți adăuga oțet de mere sau zeamă de lămâie pentru un gust mai acrișor.","macro":{"calorii_macro":"121.25","proteine":"0 g","carbohidrati":"0 g","fibre":"0 g","grasimi":"4.5 g","grasimi_saturate":"0 g"}},{"id":"post-176","titlu":"Ciuperci Umplute cu Legume","carte":"Rețete de post","carte_scurt":"Post","categorie":"Garnituri și Legume","pagina":176,"portii":"2","timp_minute":30,"calorii":82,"ingrediente":["285 g ciuperci champignon","43 g morcov ras","57 g ceapă","7 g ulei de măsline","7 g verdeață sare, piper – după gust"],"descriere":"O gustare ușoară și plină de savoare, potrivită pentru mesele de\npost sau ca aperitiv sănătos, bogat în fibre și antioxidanți.","pasi":"1.Curăță ciupercile și îndepărtează-le codițele. Toacă mărunt\ncodițele și legumele.\n2.Călește ceapa, morcovul și codițele tocate într-o lingură de ulei\nde măsline 3–4 minute, până se înmoaie ușor.\n3.Adaugă verdeața, sarea și piperul și amestecă bine.\n4.Umple pălăriile de ciuperci cu compoziția obținută și așază-le\nîntr-o tavă tapetată cu hârtie de copt.\n5.Coace la 180°C timp de 15–20 de minute, până devin aurii și\nfragede.\n6.Servește-le calde sau la temperatura camerei.","sfaturi":"Poți adăuga o lingură de brânză vegetală rasă deasupra\npentru un gust mai bogat.\nServește-le ca aperitiv sau garnitură la o masă principală.","alergeni":"fără alergeni majori","variante":"Dacă ai sensibilitate la ceapă, o poți înlocui cu aceeași cantitate de ceapă verde sau praz sotat, menținând o aromă delicată și un aport caloric foarte apropiat de varianta originală.","macro":{"calorii_macro":"81.95","proteine":"4.85 g","carbohidrati":"6.55 g","fibre":"2.15 g","grasimi":"3.55 g","grasimi_saturate":"0 g","greutate_portie":"165 g"}},{"id":"post-179","titlu":"Lipii de Post la Tigaie","carte":"Rețete de post","carte_scurt":"Post","categorie":"Pâine și Patiserie","pagina":179,"portii":"2","timp_minute":40,"calorii":224,"ingrediente":["120 g făină integrală","72 g apă călduță","2 g sare","5 g ulei de măsline"],"descriere":"O variantă simplă și rapidă de pâine plată, moale și aromată,\nideală pentru sandvișuri, wraps sau alături de mâncăruri cu sos.","pasi":"1.Într-un bol mare, amestecă făina cu sarea.\n2.Adaugă apa călduță și uleiul de măsline, apoi frământă până\nobții un aluat moale și elastic.\n3.Acoperă-l cu un prosop și lasă-l să se odihnească 20 de minute.\n4.Împarte aluatul în 4 bile egale și întinde fiecare bilă într-o foaie\nsubțire.\n5.Gătește lipiile pe o tigaie antiaderentă, 1–2 minute pe fiecare\nparte, până se rumenesc ușor.\n6.Acoperă-le cu un prosop curat după coacere pentru a rămâne\nfragede.","sfaturi":"Poți adăuga în aluat ierburi aromate (oregano, busuioc) sau\nsemințe pentru un plus de aromă și fibre.\nPăstrează lipiile într-un prosop curat pentru a rămâne moi.","alergeni":"gluten (făină)","variante":"Dacă ai intoleranță la gluten, poți înlocui făina clasică cu făină fără gluten în aceeași cantitate, menținând textura finală foarte apropiată și un aport caloric similar.","macro":{"calorii_macro":"224","proteine":"7.8 g","carbohidrati":"43.2 g","fibre":"7.2 g","grasimi":"3.1 g","grasimi_saturate":"0 g"}},{"id":"post-180","titlu":"Chifle cu Semințe Mixte","carte":"Rețete de post","carte_scurt":"Post","categorie":"Pâine și Patiserie","pagina":180,"portii":"2","timp_minute":90,"calorii":200,"ingrediente":["(2 CHIFLE)","115 g făină albă","72 g apă călduță","2 g drojdie uscată","1,5 g sare","6 g ulei de măsline"],"descriere":"Chifle pufoase la interior și ușor crocante la exterior, îmbogățite cu\nsemințe aromate pentru un plus de","pasi":"1.Amestecă drojdia cu apa călduță. Adaugă făina, sarea și uleiul.\n2.Frământă 8–10 minute și lasă aluatul la dospit 40 minute.\n3.Împarte în 2 bucăți, formează chifle rotunde.\n4.Unge-le cu apă, presară semințe și pune-le într-o tavă.\n5.Coace la 190°C timp de 25–30 minute.","sfaturi":"Poți combina semințele și în aluat, nu doar deasupra.\nPoți înlocui o parte din făină cu făină integrală pentru mai multe\nfibre.\nChiflele pot fi congelate și reîncălzite ulterior.","alergeni":"conține gluten (făină albă). Poate conține urme de susan (din mixul de semințe)","variante":"poți folosi făină integrală sau făină fără gluten (amestec special pentru pâine); poți înlocui mixul de semințe cu ce ai la îndemână (dovleac, floarea-soarelui, in); poți adăuga ierburi aromate sau usturoi pudră pentru un plus de aromă.","macro":{"calorii_macro":"224.6","proteine":"6.15 g","carbohidrati":"42.35 g","fibre":"0 g","grasimi":"3 g","grasimi_saturate":"0 g"}},{"id":"post-181","titlu":"Focaccia de Post cu Măsline și Rozmarin","carte":"Rețete de post","carte_scurt":"Post","categorie":"Pâine și Patiserie","pagina":181,"portii":"8","timp_minute":90,"calorii":186,"ingrediente":["(1 TAVĂ MICĂ)","400 g făină","250 ml apă călduță","7 g drojdie uscată","2 linguri ulei de măsline","10 g măsline negre, feliate","Rozmarin proaspăt sau uscat"],"descriere":"O focaccia parfumată și pufoasă, cu măsline sărate și aromă\nintensă de rozmarin, simplă și extrem de gustoasă.","pasi":"1.Prepară un aluat elastic din făină, apă, drojdie, ulei și sare.\n2.Lasă-l la dospit 45 minute.\n3.Întinde aluatul într-o tavă unsă cu ulei.\n4.Fă mici adâncituri cu degetele, adaugă măsline și rozmarin.\n5.Stropește cu puțin ulei și coace la 200°C timp de 25 minute.","sfaturi":"Poți adăuga roșii uscate sau felii subțiri de ceapă roșie pentru\nmai multă aromă.\nServește-o caldă, alături de salate sau hummus.","alergeni":"conține gluten (făină). Poate conține urme de soia sau susan, în funcție de tipul de măsline folosit","variante":"poți folosi făină integrală sau mix fără gluten; poți înlocui măslinele cu roșii uscate, ceapă roșie sau ardei copți; poți adăuga usturoi, oregano sau busuioc pentru aromă suplimentară.","macro":{"calorii_macro":"185.7","proteine":"5.35 g","carbohidrati":"36.9 g","fibre":"0.05 g","grasimi":"1.4 g","grasimi_saturate":"0 g"}},{"id":"post-182","titlu":"Pogăcele de Post cu Cartofi","carte":"Rețete de post","carte_scurt":"Post","categorie":"Pâine și Patiserie","pagina":182,"portii":"4","timp_minute":90,"calorii":219,"ingrediente":["195 g făină albă","110 g cartofi fierți","12 g drojdie proaspătă","78 g apă călduță","2 g sare","12 g ulei"],"descriere":"Gustoase și moi, aceste pogăcele sunt o variantă de post perfectă\npentru mic dejun, gustare sau chiar aperitiv cald.","pasi":"1.Fierbe cartofii, pasează-i și lasă-i să se răcească ușor.\n2.Dizolvă drojdia în apa călduță împreună cu o linguriță de făină\nși las-o 10 minute să se activeze.\n3.Într-un bol mare, amestecă făina cu cartofii pasați, sarea, uleiul\nși maiaua obținută.\n4.Frământă până obții un aluat moale și elastic, apoi lasă-l la\ndospit 45–60 de minute într-un loc cald.\n5.Întinde aluatul într-o foaie groasă de 1,5–2 cm și decupează\npogăcelele cu un pahar.\n6.Așază-le în tavă, unge-le ușor cu ulei și coace-le la 180°C timp\nde 20–25 de minute, până devin aurii.","sfaturi":"Poți adăuga verdeață sau condimente (rozmarin, cimbru) în\naluat pentru un plus de aromă.\nSe pot servi simple sau alături de o cremă de legume sau\nhummus.","alergeni":"gluten (făină)","variante":"Dacă ai intoleranță la gluten, poți înlocui făina clasică cu făină fără gluten în aceeași cantitate, menținând textura finală foarte apropiată și un aport caloric similar.","macro":{"calorii_macro":"218.5","proteine":"5.15 g","carbohidrati":"41.1 g","fibre":"0.55 g","grasimi":"3 g","grasimi_saturate":"0 g","greutate_portie":"100 g"}},{"id":"post-184","titlu":"Covrigi de Casă de Post","carte":"Rețete de post","carte_scurt":"Post","categorie":"Pâine și Patiserie","pagina":184,"portii":"4","timp_minute":80,"calorii":240,"ingrediente":["260 g făină","130 g apă călduță","4 g drojdie uscată","3 g sare","10 g semințe susan"],"descriere":"Pufoși la interior și crocanți la exterior, acești covrigi sunt ideali\npentru gustări sau mic dejun.","pasi":"1.Într-un bol mare, amestecă făina cu drojdia și sarea.\n2.Adaugă treptat apa călduță și frământă până obții un aluat\nomogen și elastic.\n3.Acoperă-l și lasă-l la dospit 45–60 de minute, până își dublează\nvolumul.\n4.Împarte aluatul în 4 bucăți egale și formează covrigii.\n5.Fierbe fiecare covrig 20–30 de secunde într-o oală cu apă\nclocotită (opțional cu puțină sare), apoi scoate-i pe o tavă\ntapetată cu hârtie de copt.\n6.Presară semințele de susan deasupra și coace la 200°C timp\nde 20–25 de minute, până devin aurii.","sfaturi":"Dacă îi ungi cu puțin sirop de arțar sau miere vegană, vor avea\nun luciu auriu.\nPoți adăuga ierburi aromate sau usturoi granulat în aluat pentru\nun gust diferit.\nSe pot congela și reîncălzi la nevoie.","alergeni":"gluten (făină), semințe (susan, mac)","variante":"Dacă ai intoleranță la gluten, poți folosi aceeași cantitate de făină fără gluten pentru a păstra un aport caloric asemănător, iar dacă ești alergic la susan, îl poți înlocui cu mac sau cu sare grunjoasă, fără să modifici valoarea calorică finală.","macro":{"calorii_macro":"239.8","proteine":"7.35 g","carbohidrati":"48.4 g","fibre":"0 g","grasimi":"1.25 g","grasimi_saturate":"0 g"}},{"id":"post-186","titlu":"Plăcintă Sărată cu Varză Călită","carte":"Rețete de post","carte_scurt":"Post","categorie":"Pâine și Patiserie","pagina":186,"portii":"10","timp_minute":75,"calorii":214,"ingrediente":["500 g aluat de post (foietaj sau dospit)","500 g varză tocată","40 g ceapă","Sare, piper, cimbru"],"descriere":"Un preparat tradițional de post, cu foi crocante și umplutură\naromată de varză și ceapă, ideal pentru prânz sau cină ușoară.","pasi":"1.Toacă varza și ceapa mărunt, apoi călește-le împreună într-o\ntigaie mare, la foc mic, până se înmoaie complet și scade\nlichidul.\n2.Condimentează cu sare, piper și cimbru după gust. Lasă\numplutura să se răcească.\n3.Întinde jumătate din aluat într-o tavă tapetată cu hârtie de\ncopt.\n4.Adaugă varza călită uniform, apoi acoperă cu restul de aluat.\n5.Înțeapă ușor suprafața cu o furculiță și coace la 180°C timp de\n35–40 de minute, până devine aurie.\n6.Lasă plăcinta să se răcească ușor înainte de porționare.","sfaturi":"Poți adăuga semințe de chimen sau o lingură de drojdie\ninactivă în varză pentru un plus de aromă.\nSe servește caldă sau rece, alături de o salată verde sau iaurt\nvegetal.","alergeni":"gluten (aluat)","variante":"Dacă ai intoleranță la gluten, poți folosi un aluat fără gluten în aceeași cantitate, astfel încât porția finală să păstreze o valoare calorică aproximativ identică și aceeași textură crocantă după coacere.","macro":{"calorii_macro":"213.6","proteine":"0.7 g","carbohidrati":"2.9 g","fibre":"0 g","grasimi":"0.05 g","grasimi_saturate":"0 g"}},{"id":"post-189","titlu":"Sos de Roșii Rapid pentru Paste","carte":"Rețete de post","carte_scurt":"Post","categorie":"Sosuri și Dressinguri","pagina":189,"portii":"1","timp_minute":25,"calorii":41,"ingrediente":["80 g roșii","16 g ceapă","1 g usturoi","2 g ulei de măsline busuioc, sare, piper – după gust"],"descriere":"Un sos simplu și aromat, cu gust intens de roșii și note proaspete de\nusturoi și busuioc, ideal pentru preparate rapide și savuroase.","pasi":"1.Toacă mărunt ceapa și usturoiul.\n2.Călește-le în ulei 2–3 minute la foc mic.\n3.Adaugă roșiile pasate și condimentele.\n4.Fierbe 15 minute până se îngroașă ușor sosul.","sfaturi":"Poți adăuga un praf de zahăr brun pentru a echilibra\naciditatea roșiilor.\nPoți adăuga fulgi de ardei iute pentru un sos picant.","alergeni":"fără alergeni majori","variante":"poți adăuga 1 lingură drojdie inactivă pentru un gust mai intens; pentru o variantă cremoasă, adaugă 1 lingură de lapte vegetal sau puțin tofu pasat.","macro":{"calorii_macro":"40.6","proteine":"0.2 g","carbohidrati":"2.4 g","fibre":"0.8 g","grasimi":"2 g","grasimi_saturate":"0 g"}},{"id":"post-190","titlu":"Dressing Clasic de Salată (vinaigrette)","carte":"Rețete de post","carte_scurt":"Post","categorie":"Sosuri și Dressinguri","pagina":190,"portii":"1","timp_minute":5,"calorii":146,"ingrediente":["17 g ulei de măsline","6 g oțet balsamic","2 g muștar clasic sare, piper – după gust"],"descriere":"Un dressing simplu și echilibrat, cu aromă fină de muștar și notă ușor\nacrișoară, perfect pentru a evidenția gustul salatelor.","pasi":"1.Pune toate ingredientele într-un borcan mic.\n2.Închide borcanul și agită energic până se emulsionează.\n3.Toarnă peste salată înainte de servire.","sfaturi":"Dacă vrei un dressing mai dulceag, adaugă 1 linguriță de sirop\nde agave.\nPoți adăuga zeamă de lămâie sau sirop de arțar pentru un gust\nmai proaspăt și echilibrat.\nSe păstrează la frigider într-un borcan închis ermetic până la 5\nzile.","alergeni":"muștar","variante":"poți înlocui oțetul balsamic cu oțet de mere sau zeamă de lămâie; poți folosi muștar Dijon pentru un gust mai intens; poți înlocui uleiul de măsline cu ulei de rapiță sau cu un mix de uleiuri pentru un gust mai neutru.","macro":{"calorii_macro":"145.6","proteine":"0.1 g","carbohidrati":"0.9 g","fibre":"0 g","grasimi":"17.1 g","grasimi_saturate":"0 g"}},{"id":"post-191","titlu":"Sos Tahini cu Lămâie","carte":"Rețete de post","carte_scurt":"Post","categorie":"Sosuri și Dressinguri","pagina":191,"portii":"1","timp_minute":5,"calorii":70,"ingrediente":["10 g pastă de tahini","10 g apă","4 g zeamă de lămâie","1 g usturoi sare – după gust"],"descriere":"Un sos cremos și aromat, cu gust intens de susan și prospețimea\nlămâii, ideal pentru salate și preparate vegane.","pasi":"1.Pune tahini într-un bol și adaugă treptat zeama de lămâie.\n2.Amestecă până devine o cremă densă.\n3.Subțiază cu apă rece până obții consistența dorită.\n4.Adaugă usturoiul și sarea.","sfaturi":"Merge excelent cu falafel sau legume coapte.\nPoți adăuga o linguriță de sirop de arțar pentru un gust mai\nechilibrat.\nSe păstrează într-un borcan la frigider până la 5 zile.","alergeni":"semințe de susan (tahini)","variante":"poți înlocui tahini cu unt de arahide sau unt de migdale; poți folosi lime în loc de lămâie; poți elimina usturoiul pentru o variantă mai blândă; poți subția sosul cu mai multă apă sau cu iaurt vegetal pentru un sos mai cremos.","macro":{"calorii_macro":"69.6","proteine":"2.6 g","carbohidrati":"0.5 g","fibre":"0 g","grasimi":"0 g","grasimi_saturate":"0 g"}},{"id":"post-192","titlu":"Sos Pesto de Busuioc","carte":"Rețete de post","carte_scurt":"Post","categorie":"Sosuri și Dressinguri","pagina":192,"portii":"1","timp_minute":10,"calorii":59,"ingrediente":["11 g busuioc","4 g semințe de pin","4 g ulei de măsline","0,5 g usturoi sare, piper – după gust"],"descriere":"Un sos intens aromat, cu gust proaspăt de busuioc și note bogate\nde nuci și ulei de măsline, ideal pentru paste și salate.","pasi":"1.Pune toate ingredientele într-un blender.\n2.Mixează până obții o pastă omogenă.\n3.Ajustează consistența cu câteva picături de apă, dacă e\nnevoie.","sfaturi":"Poți adăuga 1 lingură de drojdie inactivă pentru un gust ușor „de\nparmezan” (fără lactate).\nPerfect ca topping pentru paste integrale, legume coapte sau\nsandvișuri.","alergeni":"nuci / semințe (pin sau nuci)","variante":"poți folosi migdale sau caju în loc de semințe de pin; poți înlocui busuiocul cu pătrunjel sau rucola pentru un pesto diferit; poți adăuga 1 linguriță de drojdie inactivă pentru gust „parmesan” vegan; poți ajusta consistența cu puțină apă sau suc de lămâie.","macro":{"calorii_macro":"58.8","proteine":"0.2 g","carbohidrati":"0.4 g","fibre":"0.3 g","grasimi":"4 g","grasimi_saturate":"0 g"}},{"id":"post-193","titlu":"Dressing Cremos cu Avocado","carte":"Rețete de post","carte_scurt":"Post","categorie":"Sosuri și Dressinguri","pagina":193,"portii":"1","timp_minute":5,"calorii":52,"ingrediente":["21 g avocado","2 g zeamă de lime","1,5 g ulei de măsline sare, piper – după gust coriandru – opțional"],"descriere":"Un dressing fin și cremos, cu gust delicat de avocado și notă fresh\nde lime, ideal pentru salate și boluri consistente.","pasi":"1.Pasează pulpa de avocado cu o furculiță sau la blender.\n2.Adaugă sucul de lime, uleiul și condimentele.\n3.Amestecă până devine o cremă fină.","sfaturi":"Poți adăuga un cățel mic de usturoi sau o lingură de iaurt\nvegetal pentru o textură mai moale.\nFolosește dressingul peste salate, tacos, legume coapte sau\nboluri cu cereale.","alergeni":"fără alergeni majori","variante":"poți înlocui avocado cu iaurt de soia pentru o versiune mai light; poți folosi zeamă de lămâie în loc de lime; pentru o textură mai fluidă, adaugă 1–2 linguri de apă.","macro":{"calorii_macro":"52.1","proteine":"0.4 g","carbohidrati":"1.8 g","fibre":"1.3 g","grasimi":"5.2 g","grasimi_saturate":"0 g"}},{"id":"post-194","titlu":"Sos de Iaurt Vegetal cu Usturoi și Mărar","carte":"Rețete de post","carte_scurt":"Post","categorie":"Sosuri și Dressinguri","pagina":194,"portii":"1","timp_minute":15,"calorii":27,"ingrediente":["28 g iaurt vegetal","1 g usturoi","1 g mărar sare, piper – după gust"],"descriere":"Un sos răcoritor și aromat, cu gust fresh de mărar și notă intensă de\nusturoi, ideal pentru preparate ușoare și salate.","pasi":"1.Pune iaurtul într-un bol.\n2.Adaugă usturoiul, mărarul și condimentele.\n3.Amestecă bine și lasă 10 minute la rece înainte de servire.","sfaturi":"Ideal pentru cartofi copți, dovlecei la grătar sau salate.\nPoți adăuga zeamă de lămâie pentru o notă mai acrișoară.\nDacă vrei un dressing mai dens, adaugă o linguriță de tahini.","alergeni":"depinde de tipul de iaurt (soia, ovăz)","variante":"poți folosi iaurt vegetal din cocos sau ovăz pentru o versiune fără soia; poți înlocui mărarul cu pătrunjel sau usturoiul cu pudră de usturoi pentru un gust mai delicat; pentru o textură mai subțire, adaugă 1–2 linguri de apă sau zeamă de lămâie.","macro":{"calorii_macro":"27.3","proteine":"0.9 g","carbohidrati":"2.2 g","fibre":"0 g","grasimi":"1.4 g","grasimi_saturate":"0 g","greutate_portie":"30 g"}},{"id":"post-195","titlu":"Sos de Ardei Copt","carte":"Rețete de post","carte_scurt":"Post","categorie":"Sosuri și Dressinguri","pagina":195,"portii":"1","timp_minute":10,"calorii":34,"ingrediente":["55 g ardei copți","2 g ulei de măsline","1 g oțet de mere","0,5 g usturoi sare, piper – după gust"
