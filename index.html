},{"id":"internationale-117","titlu":"Ciuperci cu Halloumi","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Pâine și Preparate","pagina":117,"portii":"2","timp_minute":15,"calorii":232,"ingrediente":["115 g halloumi","230 g ciuperci","55 g cașcaval light"],"descriere":"O rețetă simplă, sățioasă și plină de aromă — ciuperci suculente\ncombinate cu halloumi rumenit și cașcaval topit. Perfectă ca\ngustare rapidă sau cină ușoară.","pasi":"1.Halloumi se pune în tigaie la foc mediu și se lasă 3-5 minute\npe fiecare parte, până devine ușor maroniu.\n2.Curățăm ciupercile, adăugăm cașcaval ras între ele și le\npunem la airfryer la 200 de grade, timp de 16-18 minute.","sfaturi":"Poți adăuga usturoi zdrobit și ierburi mediteraneene\n(oregano, cimbru) pentru aromă suplimentară.\nServește cu o felie de pâine integrală pentru un prânz\ncomplet.","alergeni":"lactoză (din halloumi și cașcaval)","variante":"Pentru o variantă fără lactoză, folosește halloumi și cașcaval fără lactoză sau brânzeturi vegetale. Pentru o opțiune vegană, înlocuiește halloumi cu tofu marinat la grătar și cașcavalul cu brânză vegetală.","macro":{"calorii_macro":"231.5","proteine":"22.8 g","carbohidrati":"4.05 g","fibre":"1.15 g","grasimi":"14.45 g","grasimi_saturate":"9.2 g","greutate_portie":"200 g"}},{"id":"internationale-118","titlu":"Avocado Umplut","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Pâine și Preparate","pagina":118,"portii":"2","timp_minute":25,"calorii":323,"ingrediente":["220 g avocado","180 g ouă întregi (≈ 3 ouă) rozmarin"],"descriere":"O gustare cremoasă, sănătoasă și plină de grăsimi bune —\navocado copt umplut cu ou, perfect pentru mic dejun sau o cină\nrapidă și nutritivă.","pasi":"1.Tăiem avocado pe mijloc, scoatem sâmburele, punem ouăle\nși băgăm la cuptor pentru 15-20 de minute.","sfaturi":"Poți adăuga 1 lingură de brânză feta sau parmezan ras\ndeasupra înainte de coacere.\nPentru un mic dejun mai sățios, servește cu o felie de pâine\nintegrală prăjită.","alergeni":"ouă","variante":"Pentru o opțiune fără ouă, înlocuiește oul cu 2 linguri de tofu sfărâmat amestecat cu turmeric și sare neagră (pentru gust similar). Pentru o variantă săracă în grăsimi, folosește doar albușurile de ou (~4-5 bucăți) și redu cantitatea de avocado la 1½.","macro":{"calorii_macro":"325.15","proteine":"13.95 g","carbohidrati":"10 g","fibre":"6.8 g","grasimi":"26.5 g","grasimi_saturate":"5.7 g","greutate_portie":"200 g"}},{"id":"internationale-119","titlu":"Tagliatele cu Ton","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Pâine și Preparate","pagina":119,"portii":"1","timp_minute":15,"calorii":300,"ingrediente":["50 g paste intergale","100 g ton în suc propriu (scurs)","50 g sos de roșii","20 g Baby spanac"],"descriere":"O rețetă rapidă, fresh și proteică — paste ușoare cu ton, sos de\nroșii și spanac, perfecte pentru un prânz sățios gata în câteva\nminute.","pasi":"1.Fierbe pastele în apă cu sare și scurge-le.\n2.Încălzește sosul de roșii cu condimentele.\n3.Adaugă tonul și spanacul și gătește 2-3 minute.\n4.Pune pastele în tigaie și amestecă 1-2 minute.\n5.Servește cu parmezan, dacă dorești.","sfaturi":"Adaugă 1 lingură de ulei de măsline extravirgin pentru un\nplus de grăsimi sănătoase.\nPoți adăuga 1 cățel de usturoi zdrobit în sos pentru un gust\nmai intens.","alergeni":"gluten (din paste), pește (ton)","variante":"Pentru o variantă fără gluten, folosește paste din porumb, orez sau leguminoase. Pentru o opțiune vegetariană, înlocuiește tonul cu 100 g linte fiartă sau năut.","macro":{"calorii_macro":"300.1","proteine":"32.2 g","carbohidrati":"38.1 g","fibre":"3.4 g","grasimi":"1.3 g","grasimi_saturate":"0.3 g"}},{"id":"internationale-120","titlu":"Frigărui de Pui","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Pâine și Preparate","pagina":120,"portii":"2","timp_minute":25,"calorii":122,"ingrediente":["135 g piept de pui","65 g ardei roșu","65 g ciuperci","135 g ceapă"],"descriere":"Frigărui simple, colorate și sățioase — o combinație perfectă de\npiept de pui și legume coapte, ideale pentru un prânz ușor sau o\ncină sănătoasă.","pasi":"1.Condimentează pieptul de pui și gătește-l la cuptor 10-12\nminute.\n2.Coace legumele separat 15-18 minute.\n3.La final, asamblează totul pe frigărui.","sfaturi":"Poți marina puiul înainte în iaurt cu usturoi și condimente\npentru o textură mai fragedă.\nAdaugă dovlecel sau roșii cherry pentru un plus de culoare și\nfibre.","alergeni":"– (nu conține alergeni frecvenți în forma de bază)","variante":"Pentru o variantă vegetariană, înlocuiește puiul cu tofu sau halloumi. Pentru o variantă săracă în grăsimi, gătește fără ulei și folosește doar condimente uscate.","macro":{"calorii_macro":"121.2","proteine":"16.2 g","carbohidrati":"3 g","fibre":"1 g","grasimi":"0.7 g","grasimi_saturate":"0.2 g"}},{"id":"internationale-121","titlu":"Somon cu Cartof Dulce și Salată Verde","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Pâine și Preparate","pagina":121,"portii":"2","timp_minute":30,"calorii":228,"ingrediente":["125 g somon","150 g cartof dulce","60 g salată verde","60 g castravete","5 g ulei"],"descriere":"O masă echilibrată, gustoasă și ușoară — somon fraged, cartof\ndulce copt și o salată fresh care completează perfect farfuria.","pasi":"1.Coace cartoful 25 min.\n2.Gătește somonul 3–4 min/parte.\n3.Taie legumele crude.\n4.Adaugă ulei.","sfaturi":"Poți adăuga 1 lingură de iaurt grecesc cu usturoi ca sos.\nServește cu câteva semințe crude (dovleac, floarea-\nsoarelui) pentru un plus de micronutrienți.","alergeni":"pește (somon)","variante":"Pentru o variantă fără pește, înlocuiește somonul cu 100 g piept de pui sau 100 g tofu afumat. Pentru o variantă săracă în carbohidrați, înlocuiește cartoful dulce cu broccoli sau conopidă fiartă (~120 g). Pentru o opțiune vegetariană, folosește un mix de linte și năut (~100 g total) în locul somonului.","macro":{"calorii_macro":"227.3","proteine":"1.1 g","carbohidrati":"16.5 g","fibre":"2.9 g","grasimi":"2.5 g","grasimi_saturate":"0.4 g","greutate_portie":"120 g"}},{"id":"internationale-122","titlu":"Sandviș cu Ou și Avocado","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Pâine și Preparate","pagina":122,"portii":"2","timp_minute":10,"calorii":368,"ingrediente":["145 g pâine integrală (≈ 3–4 felii)","110 g ou fiert (≈ 2 ouă)","135 g avocado (≈ 1 avocado mic) sare, piper","9 g zeamă de lămâie"],"descriere":"Un sandviș fresh, nutritiv și gata în câteva clipe — combinația\nperfectă dintre avocado cremos și ou fiert pentru un mic dejun\nușor și sănătos.","pasi":"1.Pisează avocado cu sare, piper și zeamă de lămâie.\n2.Unge feliile de pâine și adaugă oul feliat deasupra.","sfaturi":"Fierbe oul 8–10 minute pentru un gălbenuș ferm sau 6 minute\npentru unul moale.\nPoți adăuga 1 felie de roșie sau frunze de rucola pentru un\nplus de vitamine.","alergeni":"gluten (din pâine), ouă","variante":"Pentru o variantă fără gluten, folosește pâine fără gluten. Pentru o opțiune fără ou, înlocuiește oul cu tofu sfărâmat sau hummus (~50 g).","macro":{"calorii_macro":"367.3","proteine":"17.2 g","carbohidrati":"35.3 g","fibre":"4.1 g","grasimi":"18.4 g","grasimi_saturate":"4.6 g","greutate_portie":"50 g"}},{"id":"internationale-123","titlu":"Orez cu Lapte și Scorțisoară","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Pâine și Preparate","pagina":123,"portii":"2","timp_minute":20,"calorii":215,"ingrediente":["75 g orez","320 g lapte 1,5%","3 g scorțișoară","10 ml îndulcitor sare"],"descriere":"Un desert simplu, cald și reconfortant — orez cu lapte cremos\naromatizat cu scorțișoară, perfect pentru momentele în care vrei\nceva rapid și delicios.","pasi":"1.Fierbe orezul în apă 5 minute.\n2.Adaugă laptele și fierbe până e cremos.\n3.Adaugă scorțișoară și îndulcitor după gust.","sfaturi":"Poți adăuga 1 linguriță de miere sau câteva fructe de\npădure pentru un gust mai intens.\nÎnlocuiește laptele cu lapte vegetal pentru o aromă diferită.","alergeni":"lactoză (din lapte)","variante":"Pentru o variantă fără lactoză, folosește lapte vegetal (de migdale, ovăz sau soia). Pentru o opțiune bogată în proteine, adaugă 1 cupă de proteine pudră cu aromă de vanilie sau 100 g iaurt grecesc.","macro":{"calorii_macro":"215.2","proteine":"7.5 g","carbohidrati":"37.7 g","fibre":"0.4 g","grasimi":"2 g","grasimi_saturate":"1.2 g"}},{"id":"internationale-125","titlu":"Clătite din Banană și Ou","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":125,"portii":"2","timp_minute":10,"calorii":244,"ingrediente":["200 g banană coaptă (≈ 1½–2 banane)","200 g ouă întregi (≈ 3–4 ouă)"],"descriere":"Clătite ultra-rapide din doar două ingrediente, pufoase și\nnaturale — perfecte pentru un mic dejun dulce și sănătos, fără\nefort.","pasi":"1.Pasează banana și amestec-o cu ouăle.\n2.Toarnă în tigaie încinsă și coace 1–2 min pe fiecare parte.","sfaturi":"Adaugă 1 linguriță de scorțișoară sau vanilie în compoziție\npentru un gust mai intens.\nPoți adăuga 1 lingură de făină de ovăz dacă vrei clătitele\nmai consistente.","alergeni":"ouă","variante":"Pentru o opțiune cu mai multe proteine, adaugă 1 cupă de pudră proteică în compoziție. Pentru o variantă mai bogată în fibre, adaugă 1 lingură de tărâțe de ovăz sau semințe de chia.","macro":{"calorii_macro":"244","proteine":"14 g","carbohidrati":"23 g","fibre":"2 g","grasimi":"11 g","grasimi_saturate":"3.5 g"}},{"id":"internationale-126","titlu":"Clătite de Ovăz cu Banană","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":126,"portii":"2","timp_minute":10,"calorii":252,"ingrediente":["210 g banană (≈ 1½–2 banane)","115 g albușuri (≈ 3–4 albușuri)","70 g fulgi de ovăz scorțișoară, vanilie"],"descriere":"Clătite pufoase, hrănitoare și super rapide — combini ovăzul cu\nbanana și obții un mic dejun dulce, sănătos și sățios.","pasi":"1.Pasează banana și amestec-o cu restul ingredientelor.\n2.Toarnă în tigaie încinsă și coace 1–2 min pe fiecare parte.","sfaturi":"Poți adăuga 1 lingură de proteine pudră cu aromă de\nvanilie pentru un plus de proteine.\nAdaugă 1 linguriță de unt de arahide sau câteva afine\nproaspete pentru gust și antioxidanți.","alergeni":"ouă, gluten (din ovăz)","variante":"Pentru o variantă fără gluten, folosește fulgi de ovăz certificați fără gluten sau făină de migdale. Pentru o variantă săracă în carbohidrați înlocuiește ovăzul cu 20 g făină de cocos și adaugă 1 ou întreg.","macro":{"calorii_macro":"252","proteine":"11.4 g","carbohidrati":"43.9 g","fibre":"2.1 g","grasimi":"2.5 g","grasimi_saturate":"0.4 g"}},{"id":"internationale-127","titlu":"Mini Cheesecake cu Iaurt Grecesc și Fulgi de Ciocolată","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":127,"portii":"2","timp_minute":30,"calorii":238,"ingrediente":["100 g ou întreg (≈ 2 ouă)","215 g iaurt grecesc 2%","35 g îndulcitor","50 g ovăz măcinat","3 g praf de copt sare"],"descriere":"Un mini cheesecake ușor, proteic și fără regrete — gata rapid,\nsuper cremos și ideal când vrei un desert sănătos, dar delicios.","pasi":"1.Amestecă oul, iaurtul, îndulcitorul, ovăzul măcinat, praful de\ncopt și sarea până obții o compoziție omogenă.\n2.Toarnă într-o formă mică și gătește: 2–3 min la microunde,\n15–20 min la 165°C în air fryer sau 25 min la 180°C în cuptor.\n3.Lasă 10–15 min la răcit înainte de servire.","sfaturi":"Pentru un gust mai bogat, adaugă 1 linguriță de extract de\nvanilie sau scorțișoară.\nPoți transforma desertul într-o variantă de mic dejun\ncomplet adăugând 1 lingură de unt de arahide sau 1\nbanană felii deasupra.","alergeni":"ouă, lactoză (din iaurt), gluten (din ovăz)","variante":"Pentru o variantă fără gluten, folosește ovăz certificat fără gluten sau făină de migdale. Pentru o opțiune fără lactoză, folosește iaurt vegetal (de cocos sau migdale).","macro":{"calorii_macro":"238","proteine":"18.4 g","carbohidrati":"18.4 g","fibre":"0 g","grasimi":"9.4 g","grasimi_saturate":"3.2 g","greutate_portie":"200 g"}},{"id":"internationale-128","titlu":"Clătite Proteice cu Banană","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":128,"portii":"2","timp_minute":10,"calorii":127,"ingrediente":["235 g albușuri","125 g banană coaptă (≈ 1½ banane mici)","5 g esență de vanilie","3 g scorțișoară","25 g îndulcitor natural","8 g praf de copt"],"descriere":"Clătite proteice, pufoase și fără făină — o rețetă rapidă, dulce\nși perfectă pentru un mic dejun sănătos, bogat în proteine.","pasi":"1.Pasează banana, adaugă albușurile, vanilia, scorțișoara,\nîndulcitorul și praful de copt.\n2.Amestecă bine.\n3.Coace clătite mici într-o tigaie antiaderentă, 1–2 min pe\nfiecare parte.","sfaturi":"Poți adăuga 10–15 g făină de ovăz pentru textură mai\ndensă.\nPentru un plus de fibre și sațietate, adaugă 1 lingură de\nsemințe de chia sau psyllium în compoziție.","alergeni":"ouă, potențial gluten (dacă se adaugă ovăz)","variante":"Pentru o variantă fără ou, înlocuiește albușurile cu 150 ml aquafaba (lichid din năut). Pentru o variantă săracă în carbohidrați, redu banana la ½ și adaugă 10 g făină de cocos.","macro":{"calorii_macro":"127","proteine":"12.5 g","carbohidrati":"15 g","fibre":"1.3 g","grasimi":"0 g","grasimi_saturate":"0 g","greutate_portie":"200 g"}},{"id":"internationale-129","titlu":"Pască Light cu Brânză și Stafide","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":129,"portii":"2","timp_minute":60,"calorii":233,"ingrediente":["245 g brânză de vacă slabă","50 g ou întreg (≈ 1 ou)","30 g albușuri (≈ 1 albuș)","30 g stafide","25 g griș","20 g îndulcitor coajă de lămâie, vanilie"],"descriere":"O pască light, aerată și bogată în proteine — tot gustul\ncopilăriei, dar cu ingrediente mai ușoare și perfecte pentru un\nstil de viață sănătos.","pasi":"1.Amestecă brânza cu ouăle, albușurile și îndulcitorul.\n2.Adaugă grișul, stafidele, esențele și omogenizează.\n3.Pune compoziția într-o tavă mică tapetată cu hârtie de\ncopt.\n4.Coace la 170°C timp de ~35-40 min, până capătă crustă\naurie.\n5.Lasă la răcit complet înainte de feliere.","sfaturi":"Poți adăuga 1 linguriță de scorțișoară sau extract natural de\nvanilie pentru un plus de aromă.\nServește cu un topping de iaurt grecesc 2% și câteva fructe\nde pădure pentru un desert complet.","alergeni":"ouă, lactoză (brânză cottage), gluten (din griș)","variante":"Pentru o variantă fără lactoză, folosește brânză cottage fără lactoză. Pentru o variantă fără gluten, înlocuiește grișul cu 40 g făină de ovăz fără gluten sau 30 g făină de cocos.","macro":{"calorii_macro":"233","proteine":"21.9 g","carbohidrati":"4 g","fibre":"0 g","grasimi":"2.8 g","grasimi_saturate":"1.6 g","greutate_portie":"200 g"}},{"id":"internationale-130","titlu":"Plăcintă cu Mere Light","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":130,"portii":"2","timp_minute":65,"calorii":246,"ingrediente":["260 g mere rase","65 g fulgi de ovăz","25 g ou întreg (≈ ½ ou)","30 g albușuri (≈ 1 albuș)","7 g ulei de cocos","1 g scorțișoară","9 g îndulcitor esență de vanilie, coajă de lămâie"],"descriere":"O plăcintă cu mere aromată, pufoasă și mult mai light decât\nvarianta clasică — perfectă pentru o gustare dulce, sănătoasă\nși rapid de pregătit.","pasi":"1.Preîncălzește cuptorul la 180°C.\n2.Răzuiește și scurge merele.\n3.Amestecă într-un bol: mere, ovăz (mărunțit), ou, albușuri, ulei\nde cocos, scorțișoară, îndulcitor și arome.\n4.Toarnă compoziția într-o tavă mică tapetată și coace 35–\n40 min, până se rumenește.\n5.Lasă la răcit complet, apoi taie felii.","sfaturi":"Servește-o cu un topping de iaurt grecesc 2% și puțină\nscorțișoară pentru un desert complet și sățios.\nPoți adăuga 10–15 g nuci tocate pentru textură, dacă\nbugetul caloric îți permite.","alergeni":"ouă, gluten (din ovăz – dacă nu este certificat fără gluten)","variante":"Pentru o variantă fără gluten, folosește ovăz certificat fără gluten sau 120 g făină de migdale. Pentru o variantă săracă în grăsimi, înlocuiește uleiul de cocos cu 15 g iaurt grecesc 2%.","macro":{"calorii_macro":"246","proteine":"7.4 g","carbohidrati":"34.7 g","fibre":"1.3 g","grasimi":"3.7 g","grasimi_saturate":"2.6 g","greutate_portie":"200 g"}},{"id":"internationale-131","titlu":"Ovăz cu Cacao, Vanilie și Fulgi de Ciocolată","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":131,"portii":"2","timp_minute":45,"calorii":357,"ingrediente":["125 g fulgi de ovăz","40 g ou întreg (≈ ⅔ ou)","40 g albușuri (≈ 1–1½ albușuri)","155 g iaurt grecesc 2%","12 g cacao pudră","12 g îndulcitor","3 g esență de vanilie","12 g fulgi de ciocolată sare"],"descriere":"Un desert sănătos, ciocolatos și sățios — ovăz copt cu cacao,\nvanilie și fulgi de ciocolată, ideal pentru mic dejun sau pentru o\ngustare dulce fără vină.","pasi":"1.Preîncălzește cuptorul la 180°C.\n2.Amestecă oul, albușurile și iaurtul, apoi adaugă cacao,\nvanilie, îndulcitor și sare.\n3.Încorporează ovăzul, apoi fulgii de ciocolată.\n4.Toarnă aluatul într-o tavă tapetată (20x20 cm) și coace\n30–35 min, până trece testul scobitorii.\n5.Lasă la răcit complet înainte de a tăia.","sfaturi":"Servește cu 1 lingură de iaurt grecesc rece și câteva fructe\nde pădure pentru un plus de prospețime.\nPoți adăuga 5 g unt de arahide deasupra fiecărei porții\npentru o aromă intensă și grăsimi sănătoase (atenție la\ncalorii!).","alergeni":"ouă, lactoză (iaurt grecesc), gluten (din ovăz – dacă nu este certificat fără gluten)","variante":"Pentru o variantă fără lactoză, înlocuiește iaurtul cu un iaurt vegetal proteic (soia sau cocos fără zahăr). Pentru o variantă fără gluten, folosește ovăz certificat fără gluten.","macro":{"calorii_macro":"357","proteine":"20.5 g","carbohidrati":"45.8 g","fibre":"2 g","grasimi":"9.9 g","grasimi_saturate":"4.6 g","greutate_portie":"200 g"}},{"id":"internationale-132","titlu":"Papanași la Cuptor cu Brânză și Iaurt","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":132,"portii":"2","timp_minute":45,"calorii":236,"ingrediente":["250 g brânză de vacă slabă","100 g ou întreg (≈ 1½–2 ouă mici)","17 g griș (≈ 1½ linguri)","17 g făină (≈ 1½ linguri)","12 g îndulcitor coajă rasă de lămâie, esență de vanilie"],"descriere":"Papanași la cuptor, varianta light și sănătoasă — moi, aromati și\ncu gust autentic, dar cu mult mai puține calorii decât rețeta\ntradițională.","pasi":"1.Amestecă brânza cu ouăle până devine cremoasă, apoi\nadaugă grișul, coaja de lămâie, vanilia și îndulcitorul.\n2.Toarnă în tavă tapetată cu hârtie de copt și coace la 180°C,\n30–35 min, până se rumenește ușor.\n3.Lasă la răcit și taie în 4 porții.","sfaturi":"Poți adăuga 1 lingură de stafide sau merișoare uscate\n(atenție la calorii).\nPentru un gust mai intens, presară scorțișoară sau vanilie\npeste papanași după coacere.","alergeni":"ouă, lactoză (brânză de vaci), gluten (griș și făină)","variante":"Pentru o variantă fără lactoză, folosește brânză vegetală sau brânză fără lactoză. Pentru o variantă fără gluten, înlocuiește grișul și făina cu 60 g făină de ovăz fără gluten sau 50 g făină de migdale.","macro":{"calorii_macro":"236","proteine":"24.9 g","carbohidrati":"10.5 g","fibre":"0 g","grasimi":"5.5 g","grasimi_saturate":"2.2 g","greutate_portie":"198 g"}},{"id":"internationale-133","titlu":"Cheesecake cu Iaurt Grecesc și Afine","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":133,"portii":"2","timp_minute":65,"calorii":173,"ingrediente":["70 g cremă de brânză light","180 g iaurt grecesc 2%","25 g ou întreg (≈ ½ ou)","2 g esență de vanilie","9 g îndulcitor","7 g biscuiți digestivi zdrobiți","90 g afine congelate","5 g amidon de porumb","7 g apă (pentru amidon)","9 g ciocolată albă"],"descriere":"Un cheesecake fresh, ușor și cremos, făcut cu iaurt grecesc și\nafine — desertul perfect când vrei ceva dulce, răcoritor și mult\nmai light decât varianta clasică.","pasi":"1.Zdrobește biscuitul și presează-l pe fundul unei forme\ntapetate cu hârtie de copt.\n2.Amestecă crema de brânză cu iaurtul grecesc, apoi adaugă\noul, vanilia și îndulcitorul.\n3.Toarnă compoziția peste baza de biscuiți și nivelează.\n4.Fierbe afinele, adaugă amidonul dizolvat în apă și lasă\npână se îngroașă.\n5.Toarnă sosul de afine peste cheesecake și ciocolata topită.\n6.Coace la 170°C, 35–40 min, până este ușor ferm.\n7.Lasă la răcit, apoi ține la frigider 2–3 ore înainte de servire.","sfaturi":"Poți adăuga câteva picături de zeamă de lămâie în crema\nde brânză pentru un gust mai fresh.\nServește cu afine proaspete deasupra pentru un aspect\nspectaculos.","alergeni":"ouă, lactoză (iaurt și cremă de brânză), gluten (biscuiți digestivi)","variante":"Pentru o variantă fără lactoză, folosește iaurt vegetal proteic și cremă de brânză fără lactoză. Pentru o variantă fără gluten, folosește biscuiți fără gluten sau înlocuiește-i cu un mix din 20 g făină de ovăz + 5 g ulei de cocos.","macro":{"calorii_macro":"172.5","proteine":"13.3 g","carbohidrati":"15.3 g","fibre":"0.9 g","grasimi":"3.9 g","grasimi_saturate":"2.0 g","greutate_portie":"200 g"}},{"id":"internationale-134","titlu":"Cheesecake Capovoltă fără Coacere","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":134,"portii":"2","timp_minute":25,"calorii":312,"ingrediente":["75 g biscuiți digestivi","14 g ulei de cocos","140 g cremă de brânză light","110 g iaurt grecesc 2%","30 g eritritol","30 g fructe de pădure pasate"],"descriere":"Un cheesecake capovolto răcoritor, cremos și fără coacere —\ncombinația ideală între blat crocant, cremă fină și strat fresh de\nfructe. Perfect pentru zilele în care vrei un desert rapid și light.","pasi":"1.Zdrobește biscuiții și amestecă-i cu uleiul de cocos topit.\nPresează compoziția într-o tavă cu pereți detașabili și pune\nla rece 15–20 min.\n2.Amestecă crema de brânză cu iaurtul și îndulcitorul până\ndevine fină.\n3.Toarnă jumătate peste blat, adaugă un strat de fructe, apoi\nrestul de cremă.\n4.Lasă la frigider min. 2 ore, ideal peste noapte.","sfaturi":"Poți adăuga câteva picături de zeamă de lămâie în cremă\npentru un gust mai fresh.\nPentru un plus de textură, adaugă 1 lingură de semințe de\nchia în stratul de fructe.","alergeni":"gluten (biscuiți), lactoză (iaurt și cremă de brânză)","variante":"Pentru o variantă fără lactoză, folosește cremă de brânză vegetală și iaurt fără lactoză. Pentru o variantă fără gluten, folosește biscuiți fără gluten sau un mix de 150 g ovăz măcinat + 20 g făină de migdale.","macro":{"calorii_macro":"311.4","proteine":"15.3 g","carbohidrati":"31.9 g","fibre":"0 g","grasimi":"7.5 g","grasimi_saturate":"5.2 g","greutate_portie":"200 g"}},{"id":"internationale-135","titlu":"Brownie fără Zahăr, fără Făină","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":135,"portii":"2","timp_minute":50,"calorii":257,"ingrediente":["65 g cacao pudră","215 g banane coapte (≈ 1¾ banane)","110 g ouă întregi (≈ 2 ouă mici)","9 g îndulcitor lichid","2 g praf de copt sare (opțional)"],"descriere":"Un brownie dens, ciocolatos și fără făină sau zahăr — rețeta\nideală când vrei un desert simplu, sănătos și surprinzător de bun.","pasi":"1.Pisează bananele, apoi amestecă-le cu ouăle, cacaoa,\nîndulcitorul, praful de copt și sarea până obții o compoziție\nomogenă.\n2.Toarnă în tavă tapetată și coace: 10 min la microunde, 30\nmin în air fryer la 165°C sau 40 min la cuptor la 180°C.\n3.Lasă la răcit complet înainte de tăiere.","sfaturi":"Poți adăuga 10 g fulgi de ciocolată fără zahăr pentru o\naromă intensă.\nServește cu 1 lingură de iaurt grecesc 2% și c :"internationale-144","titlu":"Budincă Proteică cu Iaurt Grecesc și Semințe de Chia","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":144,"portii":"2","timp_minute":10,"calorii":230,"ingrediente":["280 g iaurt grecesc","28 g semințe de chia","12 g miere","Topping:","22 g cacao pudră","12 g miere","50 g lapte 1,5%"],"descriere":"O budincă proteică simplă și cremoasă, cu iaurt grecesc și\nsemințe de chia — desert sau mic dejun rapid, hrănitor și plin de\ntextură.","pasi":"1.Amestecă bine într-un bol mare iaurtul, semințele de chia și\nmierea.\n2.Împarte compoziția în două recipiente sau pahare.\n3.Lasă la frigider minim 3 ore (sau peste noapte), pentru ca\nsemințele de chia să se umfle și să obții o textură cremoasă.\n4.Pentru topping, amestecă cacaoa cu mierea și laptele până\nobții o cremă fină și toarn-o deasupra fiecărei porții.","sfaturi":"Poți adăuga fructe de pădure sau felii de banană deasupra\npentru un plus de gust.\nIdeal ca mic dejun bogat în fibre sau gustare post-\nantrenament.","alergeni":"lactoză (iaurt), potențial miere (pentru persoane cu alergii rare la produse apicole)","variante":"Pentru o variantă fără lactoză, folosește iaurt vegetal proteic. Pentru un plus de fibre, adaugă 10 g semințe de in măcinate.","macro":{"calorii_macro":"229.9","proteine":"17.1 g","carbohidrati":"22.7 g","fibre":"7.15 g","grasimi":"8.95 g","grasimi_saturate":"2.2 g","greutate_portie":"200 g"}},{"id":"internationale-145","titlu":"Prăjitură cu Căpsuni și Ciocolată","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":145,"portii":"4","timp_minute":20,"calorii":232,"ingrediente":["40 g biscuiți digestivi","25 g unt de arahide","15 g sirop de agave","3 g cacao pudră","Cremă:","65 g lapte de cocos","95 g ciocolată neagră","2 g esență de vanilie","Extra:","155 g căpșuni"],"descriere":"O prăjitură fresh și super cremoasă, cu ciocolată și căpșuni —\nfără gluten, fără o lingură de iaurt grecesc 2% sau o glazură light\nde cacao.","alergeni":"ouă (doar dacă se adaugă), gluten (din ovăz – dacă nu este certificat fără gluten)","variante":"Pentru o variantă fără gluten, folosește ovăz certificat fără gluten. Pentru o variantă mai energizantă, adaugă 1 linguriță pudră de cafea instant în compoziție.","macro":{"calorii_macro":"264.5","proteine":"11.7 g","carbohidrati":"27.1 g","fibre":"6.5 g","grasimi":"7.8 g","grasimi_saturate":"2.6 g","greutate_portie":"200 g"}},{"id":"internationale-147","titlu":"Prăjitură Mocha pentru Slăbit","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":147,"portii":"2","timp_minute":40,"calorii":221,"ingrediente":["Aluat","40 g ou întreg (≈ ¾ ou)","35 g albuș","70 g lapte 1,5%","1 g cafea instant","14 g cacao pudră","85 g brânză cottage slabă","50 g fulgi de ovăz","2 g praf de copt","1 g sare","1 g esență de vanilie","Cremă"],"descriere":"O prăjitură mocha ușoară, aromată și bogată în proteine —\nperfectă pentru slăbit, cu gust intens de cafea și ciocolată, dar\ncu foarte puține calorii.","pasi":"1.Mixează toate ingredientele pentru blat într-un blender și\ntoarnă compoziția într-o tavă tapetată.\n2.Coace 30 min la 165°C și lasă la răcit.\n3.Amestecă iaurtul cu cafeaua instant și îndulcitorul, apoi\nîntinde crema peste blat.\n4.Servește cald sau rece.","sfaturi":"Poți adăuga un strat subțire de cacao pudră sau fulgi de\nciocolată neagră pentru decor.\nIdeală ca gustare proteică sau desert de după-amiază.","alergeni":"ouă, lactoză (iaurt, brânză), gluten (din ovăz – dacă nu este certificat fără gluten)","variante":"Pentru o variantă fără lactoză, folosește iaurt vegetal și brânză cottage fără lactoză. Pentru o variantă fără gluten, folosește ovăz certificat fără gluten.","macro":{"calorii_macro":"221","proteine":"17.6 g","carbohidrati":"21.6 g","fibre":"2.3 g","grasimi":"7.3 g","grasimi_saturate":"2.6 g","greutate_portie":"182 g"}},{"id":"internationale-148","titlu":"Gogoși Carrot Cake în 5 Minute","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":148,"portii":"4","timp_minute":30,"calorii":117,"ingrediente":["140 g morcovi","140 g ouă întregi (≈ 2–3 ouă mici)","80 g curmale","40 g făină de ovăz","5 g praf de copt","2 g scorțișoară"],"descriere":"Gogoși tip carrot cake, gata în doar 5 minute — pufoase,\naromate și făcute din ingrediente simple, perfecte pentru o\ngustare sănătoasă și rapidă.","pasi":"1.Pune toate ingredientele în blender și mixează până obții o\ncompoziție omogenă.\n2.Toarnă compoziția în forme de silicon pentru gogoși, brioșe\nsau tavă mică tapetată.\nCoace la alegere:\n1.Air fryer: 160–165°C timp de 12–15 minute\n2.Cuptor: 175°C timp de 20–25 minute\n3.Microunde: 2–3 minute în forme termorezistente","sfaturi":"Poți adăuga 15 g nuci mărunțite în compoziție pentru un plus\nde textură.\nServește cu iaurt grecesc rece pentru un mic dejun sau\ngustare proteică.","alergeni":"ouă, gluten (dacă ovăzul nu este certificat fără gluten)","variante":"Pentru o variantă fără ouă, folosește 150 ml aquafaba sau 2 linguri semințe de in + 6 linguri apă. Pentru o variantă fără gluten, folosește ovăz certificat fără gluten.","macro":{"calorii_macro":"117","proteine":"6.1 g","carbohidrati":"4.1 g","fibre":"1.8 g","grasimi":"4.4 g","grasimi_saturate":"1.3 g"}},{"id":"internationale-149","titlu":"Loaf Cake cu Nuci și Ciocolată","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":149,"portii":"8","timp_minute":45,"calorii":437,"ingrediente":["55 g curmale deshidratate","125 g lapte","30 g nuci","15 g fulgi de ciocolată","3 g praf de copt","80 g făină","95 g ou întreg (≈ 1½ ouă)"],"descriere":"Un loaf cake fin, dulce natural din curmale, cu nuci crocante și\nfulgi de ciocolată — desert sănătos, fără zahăr adăugat și ideal\npentru întreaga familie.","pasi":"1.Hidratează curmalele 20 min în lapte cald, apoi\nblenduiește-le până devin pastă.\n2.Adaugă ouăle, făina și praful de copt, apoi încorporează\nnucile și fulgii de ciocolată.\n3.Toarnă într-o tavă tapetată.\nCoacere:\n1.Air fryer: 22–25 min la 175°C\n2.Cuptor: 30–35 min la 175°C\n3.Lasă la răcit în cuptor/air fryer închis 10–12 min.","sfaturi":"Poți adăuga 1 linguriță scorțișoară sau esență de rom pentru\nun plus de aromă.\nServește cu iaurt grecesc și fructe proaspete pentru un mic\ndejun complet.","alergeni":"ouă, nuci, gluten (dacă se folosește făină de grâu sau ovăz)","variante":"Pentru o variantă fără gluten, folosește făină de migdale sau de cocos. Pentru o variantă fără nuci, înlocuiește nucile cu semințe de dovleac sau floarea-soarelui.","macro":{"calorii_macro":"437","proteine":"3.7 g","carbohidrati":"9.9 g","fibre":"0.2 g","grasimi":"4.2 g","grasimi_saturate":"1.1 g","greutate_portie":"50 g"}},{"id":"internationale-150","titlu":"Bol Proteic cu Iaurt și Fructe","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":150,"portii":"1","timp_minute":10,"calorii":428,"ingrediente":["240 g iaurt grecesc","12 g miere","95 g afine","25 g granola","6 g semințe de chia","12 g goji uscate","6 g pudră de cacao","6 g pudră de maca (opțional)"],"descriere":"Un bol proteic fresh și energizant, plin de texturi și arome — iaurt\ncremos, fructe, granola crocantă și superfoods pentru un mic\ndejun rapid și sănătos.","pasi":"1.Într-un bol, adaugă iaurtul grecesc rece.\n2.Toarnă mierea deasupra și amestecă ușor.\n3.Adaugă afinele, granola, semințele de chia, goji, pudra de\ncacao și pudra de maca.\n4.Poți lăsa în straturi pentru estetică sau poți amesteca totul\nînainte de consum.\n5.Servește imediat pentru un mic dejun fresh sau gustare\nenergizantă.","sfaturi":"Poți adăuga 15 g pudră proteică cu aromă de vanilie pentru\n+10 g proteine.\nÎnlocuiește afinele cu zmeură sau căpșuni pentru mai puține\ncalorii.","alergeni":"lactoză (iaurt), gluten (posibil din granola), fructe uscate (goji)","variante":"Pentru o variantă fără lactoză, folosește iaurt vegetal proteic. Pentru o variantă fără gluten, folosește granola fără gluten.","macro":{"calorii_macro":"428","proteine":"23.3 g","carbohidrati":"44.8 g","fibre":"7.1 g","grasimi":"7.5 g","grasimi_saturate":"1.6 g","greutate_portie":"400 g"}},{"id":"internationale-151","titlu":"Cheesecake Kinder Variantă Rapidă și Sănătoasă","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":151,"portii":"2","timp_minute":55,"calorii":423,"ingrediente":["100 g ciocolată neagră","180 g brânză slabă de vaci","120 g ouă întregi (≈ 2 ouă)"],"descriere":"Un cheesecake inspirat din Kinder — cremos, ciocolatos și\nsurprinzător de sănătos, cu doar câteva ingrediente ușoare și\nfără zahăr adăugat.","pasi":"1.Topește ciocolata (bain-marie sau microunde).\n2.Amestecă ouăle cu brânza, adaugă ciocolata topită și\nmixează bine.\n3.Toarnă compoziția într-o formă tapetată (18–20 cm).\n4.Coace 45 min la 175°C (cuptor) sau 35 min la 165°C (air\nfryer, cu apă în cuvă).\n5.Lasă la răcit complet, apoi dă la frigider 2–3 ore.","sfaturi":"Poți adăuga 1 linguriță esență de vanilie sau un praf de sare\npentru aromă mai intensă.\nServește cu fructe de pădure proaspete sau cu 1 lingură de\niaurt cremos deasupra.","alergeni":"ouă, lactoză (iaurt/brânză), soia (posibil din ciocolată)","variante":"Pentru o variantă fără lactoză, folosește iaurt vegetal proteic și ciocolată fără lactoză. Pentru o variantă săracă în grăsimi, înlocuiește jumătate din ciocolată cu 100 g cremă de brânză light.","macro":{"calorii_macro":"422.7","proteine":"22.9 g","carbohidrati":"28.3 g","fibre":"0 g","grasimi":"21.6 g","grasimi_saturate":"11 g","greutate_portie":"200 g"}},{"id":"internationale-152","titlu":"Budincă de Chia cu Fructe de Pădure","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":152,"portii":"2","timp_minute":10,"calorii":175,"ingredien _saturate":"3 g","greutate_portie":"204 g"}},{"id":"internationale-167","titlu":"Clătite Dulci cu Brânză și Mere Coapte","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":167,"portii":"2","timp_minute":15,"calorii":216,"ingrediente":["70 g ou întreg (≈ 1 ou mare)","35 g făină de ovăz","115 g lapte 1,5%","70 g brânză dulce 5%","115 g măr scorțișoară"],"descriere":"Clătite fine, umplute cu brânză dulce și mere coapte aromate —\nun desert cald, reconfortant și natural dulce, perfect pentru orice\npoftă.","pasi":"1.Amestecă oul, făina și laptele și gătește 2 clătite.\n2.Coace mărul și pasează-l cu scorțișoară.\n3.Umple clătitele cu brânză și piureul de măr.","sfaturi":"Poți adăuga 1–2 picături de îndulcitor sau esență de vanilie\nîn compoziție.\nPentru un gust intens de toamnă, presară puțin ghimbir pudră\npeste mere.","alergeni":"gluten (făină de ovăz), lactoză (lapte, brânză), ou","variante":"Pentru o variantă fără lactoză, folosește lapte vegetal și brânză proteică din soia. Pentru o variantă fără gluten, înlocuiește făina de ovăz cu făină de migdale sau cocos.","macro":{"calorii_macro":"216","proteine":"8.4 g","carbohidrati":"9.8 g","fibre":"1.4 g","grasimi":"5.3 g","grasimi_saturate":"2 g","greutate_portie":"200 g"}},{"id":"internationale-168","titlu":"Negresă Proteică cu Brânză Dulce și Banană","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":168,"portii":"4","timp_minute":30,"calorii":159,"ingrediente":["95 g ou întreg (≈ 1½ ouă)","125 g banană","110 g brânză dulce 5%","15 g cacao pudră","45 g făină de ovăz","15 g miere"],"descriere":"O negresă proteică, cremoasă și intens ciocolatoasă —\nîndulcită natural cu banană și brânză dulce, pentru un desert\nsănătos și super delicios.","pasi":"1.Pasează banana și amestec-o cu oul.\n2.Adaugă brânza, cacao, făina și mierea.\n3.Omogenizează și toarnă într-o formă mică.\n4.Coace 25 min la 180°C.","sfaturi":"Al  fără Regrete","pagina":170,"portii":"2","timp_minute":15,"calorii":196,"ingrediente":["40 g griș","205 g lapte 1,5%","80 g brânză dulce 5%","70 g afine","7 g miere"],"descriere":"Un desert clasic reinterpretat — griș cu lapte cremos, brânză\ndulce și un sos proaspăt de fructe, pentru o combinație fină și\nușor dulce.","pasi":"1.Fierbe grișul în lapte până se îngroașă.\n2.Încorporează brânza după ce s-a răcit ușor.\n3.Pasează afinele cu miere și toarnă sosul deasupra.","sfaturi":"Pentru un griș fin, fără cocoloașe, adaugă-l treptat în laptele\nfierbinte, amestecând constant. Fierbe-l la foc mic 3–4\nminute, până se îngroașă.\nÎn loc de afine, folosește zmeură, căpșuni sau mix de fructe\nde pădure.","alergeni":"lactoză (lapte, brânză), gluten (griș)","variante":"Fără lactoză: folosește lapte vegetal și brânză vegetală proteică. Fără gluten: înlocuiește grișul cu griș de porumb fin sau făină de orez.","macro":{"calorii_macro":"196","proteine":"3.1 g","carbohidrati":"11.9 g","fibre":"0.7 g","grasimi":"1 g","grasimi_saturate":"0.6 g","greutate_portie":"200 g"}},{"id":"internationale-171","titlu":"Muffin cu Morcov, Măr și Iaurt","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":171,"portii":"4","timp_minute":30,"calorii":115,"ingrediente":["70 g morcov","90 g măr","105 g ou întreg (≈ 2 ouă mici)","85 g iaurt grecesc 2%","50 g făină integrală scorțișoară"],"descriere":"Muffinuri aromate, pufoase și natural dulci — combinația\nperfectă dintre morcov, măr și iaurt pentru un desert sănătos și\nplin de savoare.","pasi":"1.Rade morcovul și mărul fin; stoarce ușor mărul dacă este\nzemos.\n2.Amestecă oul cu iaurtul, apoi adaugă morcovul, mărul și\nscorțișoara.\n3.Încorporează făina integrală și omogenizează ușor.\n4.Toarnă compoziția în forme și coace la 180°C, timp de 20–","sfaturi":"25 min.\nStoarce bine mărul ras ca să nu iasă compoziția prea\numedă și folosește răzătoare fină pentru morcov, ca textura\nsă fie uniformă.\nAdaugă un praf de sare și puțin praf de copt pentru un gust\nmai intens și muffins mai pufoase.","alergeni":"lactoză (lapte, brânză)","variante":"Fără lactoză: folosește lapte vegetal și brânză vegetală proteică.","macro":{"calorii_macro":"115","proteine":"6.9 g","carbohidrati":"14.5 g","fibre":"2 g","grasimi":"3.5 g","grasimi_saturate":"1 g","greutate_portie":"100 g"}},{"id":"internationale-172","titlu":"Brioșe cu Bucăți de Ciocolată","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":172,"portii":"8","timp_minute":30,"calorii":128,"ingrediente":["120 g făină de ovăz","2 bucăți ouă","200 g iaurt grecesc simplu 2%","120 ml lapte de migdale","30–40 g îndulcitor","50 g bucăți de ciocolată fără zahăr","5 g praf de copt (1 linguriță)","1 linguriță esență de vanilie","1 praf de sare (opțional)"],"descriere":"Aceste brioșe cu bucăți de ciocolată sunt varianta echilibrată și\nușor de făcut atunci când vrei ceva dulce, dar care să-ți susțină\nobiectivele, nu să ți le saboteze.","pasi":"1.Preîncălzește cuptorul la 180°C (căldură sus-jos).\n2.Amestecă ouăle cu iaurtul, laptele, îndulcitorul și vanilia.\n3.Încorporează făina, praful de copt și sarea.\n4.Adaugă bucățile de ciocolată și amestecă ușor.\n5.Toarnă compoziția în forme de brioșe, umplându-le ¾.\n6.Coace 20–22 minute, până trece testul scobitorii.","sfaturi":"7.Lasă-le 5–10 minute la răcit înainte de servire.\nFolosește bucăți de ciocolată, nu fulgi foarte mici — se\ntopesc controlat și creează zone intense de gust, fără să\nîncarce toată compoziția.\nLasă ingredientele reci (ouă, iaurt) 10–15 minute la\ntemperatura camerei înainte de a le amesteca. Ajută la o\ntextură mai uniformă și la o creștere mai bună.","alergeni":"ouă, lactoză (iaurt grecesc), gluten (făină de ovăz – dacă nu este certificată), nuci (migdale – din laptele de migdale)","variante":"Fără lactoză: folosește iaurt grecesc fără lactoză sau iaurt vegetal proteic (soia). Fără gluten: înlocuiește făina de ovăz cu făină de orez sau ovăz certificat gluten-free. Fără nuci: înlocuiește laptele de migdale cu lapte de ovăz sau lapte de soia.","macro":{"calorii_macro":"128","proteine":"5.8 g","carbohidrati":"1 g","fibre":"1.2 g","grasimi":"3.1 g","grasimi_saturate":"1 g","greutate_portie":"75 g"}},{"id":"internationale-173","titlu":"Brioșe Tip Carrot Cake","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":173,"portii":"8","timp_minute":30,"calorii":120,"ingrediente":["120 g făină de ovăz","2 bucăți ouă","120 g morcov ras fin","120 g iaurt grecesc 2%","30–40 g îndulcitor","1 linguriță (≈ 2 g) scorțișoară măcinată","5 g praf de copt","1 linguriță esență de vanilie","20 g nuci tocate","1 praf de sare (opțional)","Topping (pentru servire)","Iaurt grecesc 100 g","Vanilie + îndulcitor, după gust"],"descriere":"Brioșele tip carrot cake sunt pufoase, aromate și perfecte\natunci când vrei un desert echilibrat, cu fibre, proteine și gust\nautentic de prăjitură făcută în casă.","pasi":"1.Preîncălzește cuptorul la 180°C.\n2. Amestecă ouăle, iaurtul, îndulcitorul și vanilia, apoi\nîncorporează morcovul ras.\n3. Separat, combină făina cu praful de copt, scorțișoara și\nsarea, apoi unește-le cu compoziția umedă și adaugă\nnucile.\n4. Toarnă în forme (¾ pline) și coace 20–22 minute.\n5. Lasă la răcit 10 minute înainte de servire.","sfaturi":"Rade morcovul cât mai fin și stoarce-l ușor dacă este foarte\napos — astfel eviți o compoziție prea umedă și obții o\ntextură uniformă.\nPentru un plus de aromă, poți adăuga un vârf de nucșoară\nsau puțină coajă rasă de portocală — intensifică gustul fără\nsă schimbe valorile nutriționale semnificativ.","alergeni":"ouă, lactoză (iaurt grecesc), gluten (făină de ovăz – dacă nu este certificată), nuci (nuci tocate)","variante":"Fără lactoză: folosește iaurt grecesc fără lactoză sau iaurt vegetal proteic (soia). Fără gluten: înlocuiește făina de ovăz cu făină de orez sau ovăz certificat gluten-free. Fără nuci: elimină nucile sau înlocuiește-le cu semințe de dovleac sau semințe de floarea-soarelui pentru textură similară.","macro":{"calorii_macro":"120","proteine":"6.5 g","carbohidrati":"3.1 g","fibre":"1.8 g","grasimi":"4.6 g","grasimi_saturate":"0.8 g","greutate_portie":"80 g"}},{"id":"internationale-174","titlu":"Brioșe Ciocolată Dublă","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":174,"portii":"8","timp_minute":30,"calorii":130,"ingrediente":["120 g făină de ovăz","2 bucăți ouă","120 ml lapte","20 g cacao pudră neîndulcită","30–40 g îndulcitor","60 g bucăți de ciocolată fără zahăr","5 g praf de copt","1 linguriță esență de vanilie","1 praf de sare (opțional)"],"descriere":"Brioșe cu ciocolată dublă, intense și sățioase, ideale atunci\ncând vrei un desert cu gust puternic de cacao, dar adaptat\nunui stil de viață echilibrat.","pasi":"1.Preîncălzește cuptorul la 180°C (sus-jos).\n2.Amestecă într-un bol făina, cacaoa, praful de copt și sarea.\n3.În alt bol bate ouăle cu laptele, îndulcitorul și vanilia.\n4.Combină ingredientele umede cu cele uscate.\n5.Încorporează bucățile de ciocolată.\n6.Toarnă compoziția în forme de brioșe, umplându-le ¾.\n7.Coace 18–20 minute, până când centrul este gătit (testul\nscobitorii).","sfaturi":"8.Lasă-le 10 minute la răcit înainte de a le scoate din forme.\nCerne cacaua împreună cu făina pentru a evita\ncocoloașele și pentru a obține o textură uniformă, fără zone\namare concentrate.\nNu exagera cu amestecarea după ce combini ingredientele\numede cu cele uscate — prea mult mixat înseamnă brioșe\nmai dense, nu pufoase.","alergeni":"ouă, lactoză (lapte), gluten (făină de ovăz – dacă nu este certificată)","variante":"Fără lactoză: folosește lapte fără lactoză sau lapte vegetal (soia / ovăz). Fără gluten: înlocuiește făina de ovăz cu ovăz certificat gluten- free sau făină de orez.","macro":{"calorii_macro":"130","proteine":"4.7 g","carbohidrati":"2.2 g","fibre":"2 g","grasimi":"2.9 g","grasimi_saturate":"0.8 g","greutate_portie":"70 g"}},{"id":"internationale-175","titlu":"Brioșe cu Afine","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":175,"portii":"8","timp_minute":30,"calorii":105,"ingrediente":["120 g făină de ovăz","2 bucăți ouă","120 g iaurt grecesc 2%","120 ml lapte","30–40 g îndulcitor","120 g afine (proaspete sau congelate)","5 g praf de copt (1 linguriță)","1 linguriță esență de vanilie","1 praf de sare (opțional)"],"descriere":"Brioșe cu afine, fragede și ușor acrișoare, perfecte pentru un\nmic dejun sau o gustare dulce care îți oferă fibre, proteine și\nenergie stabilă.","pasi":"1.Preîncălzește cuptorul la 180°C (sus-jos).\n2.Amestecă ouăle cu iaurtul, laptele, îndulcitorul și vanilia.\n3.Adaugă făina, praful de copt și sarea și omogenizează.\n4.Încorporează afinele la final, amestecând ușor.\n5.Toarnă compoziția în forme de brioșe, umplându-le ¾.\n6.Coace 18–22 minute, până trec testul scobitorii.\n7.Lasă-le 5–10 minute la răcit înainte de servire.","sfaturi":"Dacă folosești afine congelate, adaugă-le direct din\ncongelator, fără să le decongelezi — astfel eviți să coloreze\nexcesiv compoziția și să o facă prea umedă.\nPentru un plus de prospețime, poți adăuga puțină coajă rasă\nde lămâie sau câteva picături de zeamă — intensifică gustul\nfără calorii suplimentare.","alergeni":"ouă, lactoză (iaurt grecesc), gluten (făină de ovăz – dacă nu este certificată)","variante":"Fără lactoză: folosește iaurt grecesc fără lactoză sau iaurt vegetal proteic (soia). Fără gluten: înlocuiește făina de ovăz cu făină de orez sau ovăz certificat gluten-free.","macro":{"calorii_macro":"105","proteine":"5.4 g","carbohidrati":"3.4 g","fibre":"1.5 g","grasimi":"2.9 g","grasimi_saturate":"0.7 g","greutate_portie":"75 g"}},{"id":"internationale-176","titlu":"Brioșe cu Banane","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":176,"portii":"8","timp_minute":30,"calorii":114,"ingrediente":["120 g făină de ovăz","150 g banane bine coapte, zdrobite","2 bucăți ouă","20–30 g îndulcitor","1 linguriță scorțișoară măcinată","5 g praf de copt","1 linguriță esență de vanilie","20 g nuci tocate","1 praf de sare (opțional)"],"descriere":"Brioșe cu banane, moi și aromate, ideale când vrei să\ntransformi dulceața naturală a fructelor într-un desert echilibrat\nși sățios.","pasi":"1.Preîncălzește cuptorul la 180°C (sus-jos).\n2.Zdrobește banana până devine piure.\n3.Adaugă ouăle, îndulcitorul (dacă folosești) și vanilia și\namestecă bine.\n4.Încorporează făina, praful de copt, scorțișoara și sarea.\n5.Adaugă nucile.\n6.Toarnă compoziția în forme de brioșe, umplându-le ¾.\n7.Coace 20–22 minute, până trec testul scobitorii.\n8.Lasă-le 5–10 minute la răcit înainte de consum.","sfaturi":"Folosește banane foarte bine coapte, cu pete maronii pe\ncoajă — sunt mai dulci natural și dau o textură mai fragedă,\nfără să ai nevoie de mult îndulcitor.\nDacă vrei un plus de aromă și textură, rumenește ușor nucile\nîntr-o tigaie uscată 2–3 minute înainte de a le adăuga —\nintensifică gustul și le face mai crocante.","alergeni":"ouă, gluten (făină de ovăz – dacă nu este certificată), nuci (nuci tocate)","variante":"Fără gluten: înlocuiește făina de ovăz cu făină de orez sau ovăz certificat gluten-free. Fără nuci: elimină nucile sau înlocuiește-le cu semințe de dovleac ori semințe de floarea-soarelui pentru textură similară.","macro":{"calorii_macro":"114","proteine":"4.3 g","carbohidrati":"4.9 g","fibre":"1.7 g","grasimi":"4 g","grasimi_saturate":"0.7 g","greutate_portie":"73 g"}},{"id":"internationale-177","titlu":"Brioșe cu Căpșuni","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":177,"portii":"8","timp_minute":30,"calorii":104,"ingrediente":["120 g făină de ovăz","2 bucăți ouă","120 g iaurt grecesc 2%","150 g căpșuni proaspete, tocate","35 g îndulcitor","5 g praf de copt","1 linguriță esență de vanilie","20 g fulgi de ovăz","1 praf de sare (opțional)"],"descriere":"Brioșe cu căpșuni, fragede și răcoritoare, perfecte pentru un\ndesert ușor, cu gust proaspăt și echilibru între dulce și sățios.","pasi":"1.Preîncălzește cuptorul la 180°C (sus-jos) și pregătește\nformele de brioșe.\n2.Amestecă ouăle cu iaurtul, îndulcitorul și vanilia până obții o\ncompoziție omogenă.\n3.Adaugă făina, praful de copt și sarea și amestecă ușor.\n4.Încorporează căpșunile la final, cu mișcări blânde.\n5.Toarnă compoziția în forme, umplându-le ¾.\n6.Coace 18–20 minute, până trec testul scobitorii.\n7.Lasă-le 5 minute la răcit înainte de a le scoate din forme","sfaturi":"Tamponează căpșunile cu un șervețel înainte de a le\nîncorpora, mai ales dacă sunt congelate, ca să nu lase prea\nmult lichid și să nu îți iasă brioșele dense.\nAmestecă compoziția doar până când ingredientele sunt\nîncorporate. Dacă insiști prea mult, textura va deveni mai\ncompactă, nu pufoasă.","alergeni":"ouă, lactoză (iaurt grecesc), gluten (făină de ovăz și fulgi de ovăz – dacă nu sunt certificați)","variante":"Fără lactoză: folosește iaurt grecesc fără lactoză sau iaurt vegetal proteic (soia). Fără gluten: înlocuiește făina și fulgii de ovăz cu ovăz certificat gluten-free sau făină de orez + fulgi de hrișcă.","macro":{"calorii_macro":"104","proteine":"5.3 g","carbohidrati":"3.4 g","fibre":"1.6 g","grasimi":"2.9 g","grasimi_saturate":"0.7 g","greutate_portie":"75 g"}},{"id":"internationale-178","titlu":"Înghețată cu Banane, Iaurt Grecesc și Unt de Arahide","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":178,"portii":"2","timp_minute":10,"calorii":195,"ingrediente":["145 g banană bine coaptă","240 g iaurt grecesc 2%","12 g unt de arahide","6 g fulgi de migdale extract de vanilie, scorțișoară"],"descriere":"O înghețată cremoasă, fresh și super sănătoasă — realizată din\nbanane congelate, iaurt grecesc și unt de arahide, pentru un\ndesert răcoritor și natural dulce.","pasi":"1.Taie banana rondele și congeleaz-o minimum 4 ore.\n2.Pune banana congelată și iaurtul într-un blender.\n3.Adaugă untul de arahide și vanilia.\n4.Mixează până devine cremoasă.\n5.Servește imediat cu migdalele presărate deasupra sau\ncongeleaz-o ușor pentru consistență fermă.","sfaturi":"Banana trebuie să fie bine coaptă. Cu coaja pătată, moale\n– oferă dulceața perfectă naturală, fără nevoie de miere\nsau alți îndulcitori.\nPentru o textură de gelato, mixează compoziția din nou\ndupă 30 min de congelare.","alergeni":"lactoză (iaurt), arahide, migdale (nuci)","variante":"Fără lactoză: folosește iaurt vegetal proteic. Fără arahide: înlocuiește cu unt de migdale sau semințe de floarea-soarelui. Fără migdale: folosește fulgi de cocos sau semințe de dovleac.","macro":{"calorii_macro":"195","proteine":"12.5 g","carbohidrati":"21.9 g","fibre":"2.3 g","grasimi":"6.9 g","grasimi_saturate":"2 g","greutate_portie":"200 g"}},{"id":"internationale-179","titlu":"Înghețată cu Căpșuni, Cottage Cheese și Miere","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":179,"portii":"2","timp_minute":10,"calorii":158,"ingrediente":["160 g căpșuni congelate","215 g cottage cheese light","11 g miere","16 g fulgi de ovăz coajă rasă de lămâie (opțional)"],"descriere":"O înghețată fresh și super cremoasă, făcută din căpșuni\ncongelate, cottage cheese și un strop de miere — un desert\nproteic, răcoritor și gata în câteva clipe.","pasi":"1.Pune căpșunile congelate, brânza și mierea într-un blender.\n2.Mixează bine până devine o cremă fină.\n3.Adaugă fulgii de ovăz și mixează scurt pentru textură.\n4.Servește imediat sau lasă la congelator 1 oră pentru\nfermitate.","sfaturi":"Pentru un plus de gust, adaugă 1 linguriță de cacao sau\nvanilie.\nPoți înlocui căpșunile cu afine sau zmeură pentru un profil\nantioxidant diferit.","alergeni":"lactoză (cottage cheese), ovăz (gluten)","variante":"Fără lactoză: folosește brânză vegetală proteică sau iaurt vegetal gros. Fără gluten: înlocuiește fulgii de ovăz cu semințe de chia sau migdale măcinate.","macro":{"calorii_macro":"158","proteine":"12.9 g","carbohidrati":"16.8 g","fibre":"1.6 g","grasimi":"3.8 g","grasimi_saturate":"1.8 g","greutate_portie":"200 g"}},{"id":"internationale-180","titlu":"Înghețată cu Mango și Iaurt de Capră","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Deserturi fără Regrete","pagina":180,"portii":"2","timp_minute":10,"calorii":170,"ingrediente":["125 g mango","255 g iaurt de capră 3%","13 g semințe de floarea-soarelui","7 g miere vanilie","5 g zeamă de lămâie"],"descriere":"O înghețată fresh, exotică și super cremoasă, cu mango bine\ncopt și iaurt de capră — un desert light, răcoritor și plin de\naromă tropicală.","pasi":"1.Taie mango cuburi și congelează-l 2–3 ore.\n2.Pune mango și iaurtul într-un blender.\n3.Adaugă mierea și vanilia.\n4.Mixează până obții o cremă.a\n5.Presară semințele deasupra și servește imediat sau ușor\ncongelat.","sfaturi":"Alege mango moale, cu coaja ușor închisă la culoare – va fi\nmai dulce și mai parfumat.\nDacă folosești mango congelat, nu mai e nevoie să îl\ncongelezi din nou.","alergeni":"lactoză (iaurt), semințe (floarea-soarelui)","variante":"Fără lactoză: folosește iaurt vegetal sau brânză proteică fără lactoză. Fără semințe: înlocuiește cu 5 g fulgi de cocos sau migdale măcinate.","macro":{"calorii_macro":"170","proteine":"6 g","carbohidrati":"20.9 g","fibre":"1.2 g","grasimi":"7.2 g","grasimi_saturate":"2.4 g","greutate_portie":"200 g"}},{"id":"traditionale-156","titlu":"Mămăligă cu Brânză și Ou Ochi","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Mic Dejun și Gustări","pagina":156,"portii":"1","timp_minute":15,"calorii":353,"ingrediente":["36 g mălai","54 g ou de găină","45 g albuș de ou","36 g telemea light de vacă","27 g iaurt grecesc 2%","3 g ulei de măsline","Sare – după gust"],"descriere":"O rețetă tradițională care poartă cu ea gustul copilăriei și\nsimplitatea meselor de acasă — reinterpretată într-o variantă mai\nușoară, dar păstrând autenticitatea și aroma care ne leagă de\nfamilia și de rădăcinile noastre.","pasi":"1.Fierbe mălaiul în apă cu sare până devine cremos. Gătește un\nou ochi în puțin ulei de măsline și, separat, albușul simplu.\n2.Pune pe farfurie mămăliga caldă, adaugă telemea light\nfărâmițată și o lingură de iaurt grecesc, apoi oul ochi și albușul.","sfaturi":"Poți adăuga verdețuri proaspete (mărar, pătrunjel) pentru extra\naromă.\nServește cu ardei copți sau castraveți murați pentru un gust\ntradițional.\nDacă vrei un plus de proteine, adaugă încă 1 albuș bătut la oul\nochi.","alergeni":"ouă, lactoză (iaurt, telemea). Poți adăuga verdețuri proaspete (mărar, pătrunjel) pentru extra aromă. Servește cu ardei copți sau castraveți murați pentru un gust tradițional. Dacă vrei un plus de proteine, adaugă încă 1 albuș bătut la oul ochi","variante":"poți transforma preparatul într-o versiune mai consistentă adăugând 100 g piept de curcan la grătar alături.","macro":{"calorii_macro":"353","proteine":"23.4 g","carbohidrati":"29.8 g","fibre":"0.4 g","grasimi":"15.2 g","grasimi_saturate":"4 g","greutate_portie":"360 g"}},{"id":"traditionale-157","titlu":"Omletă cu Muschi File și Telemea","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Mic Dejun și Gustări","pagina":157,"portii":"1","timp_minute":10,"calorii":386,"ingrediente":["100 g ou de găină (≈ 2 ouă medii)","100 g mușchi file","30 g telemea light","3 ml ulei de măsline"],"descriere":"O omletă inspirată din bucătăria românească, cu ingrediente\nsimple și gustoase, care aduce în farfurie exact aroma meselor de\ndimineață de altădată, dar într-o formă ușoară și sănătoasă.","pasi":"1.Taie mușchiul file și brânza cubulețe.\n2.Bate ouăle cu sare și piper.\n3.Călește rapid mușchiul în ulei de măsline, adaugă ouăle și\ngătește la foc mic.\n4.Presară telemea și pliază omleta.\n5.Servește caldă cu salată verde sau roșii cherry.","sfaturi":"Adaugă verdețuri proaspete (pătrunjel, mărar, ceapă verde)\npentru extra prospețime.\nServește cu roșii cherry sau castraveți proaspeți.\nMerge foarte bine cu o felie de pâine integrală prăjită.","alergeni":"ouă, lactoză (telemea)","variante":"înlocuiește telemeaua cu brânză cottage light pentru mai multe proteine și mai puține grăsimi.","macro":{"calorii_macro":"386","proteine":"38 g","carbohidrati":"4.3 g","fibre":"0 g","grasimi":"23.5 g","grasimi_saturate":"8 g","greutate_portie":"215 g"}},{"id":"traditionale-158","titlu":"Omletă cu Legume și Piept de Pui Afumat","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Mic Dejun și Gustări","pagina":158,"portii":"1","timp_minute":10,"calorii":400,"ingrediente":["150 g ouă de găină (≈ 3 bucăți)","100 g piept de pui afumat","50 g roșie","50 g castravete","5 g ulei de măsline"],"descriere":"O omletă hrănitoare, cu gust ușor afumat și legume proaspete,\nexact genul de preparat simplu și plin de savoare pe care îl găseai\nmereu pe masa de dimineață la țară.","pasi":"1.Bate ouăle cu puțină sare și piper.\n2.Pregătește tigaia cu uleiul de măsline și gătește pieptul de pui\nafumat tăiat cubulețe.\n3.Adaugă ouăle și lasă-le să se prindă ușor.\n4.Servește alături de castravete și roșie proaspete, pentru un plus\nde prospețime și fibre.","sfaturi":"Poți adăuga și ceapă verde sau ardei gras pentru mai multe\nlegume.\nDacă vrei o textură mai cremoasă, presară puțin cașcaval light\ndeasupra.\nMerge foarte bine cu pâine integrală prăjită.","alergeni":"ouă","variante":"pentru extra proteine și mai puține grăsimi, folosește 2 ouă + 100 ml albuș lichid.","macro":{"calorii_macro":"400","proteine":"40.5 g","carbohidrati":"4 g","fibre":"0.5 g","grasimi":"23.5 g","grasimi_saturate":"5 g","greutate_portie":"325 g"}},{"id":"traditionale-159","titlu":"Omletă Țărănească","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Mic Dejun și Gustări","pagina":159,"portii":"1","timp_minute":10,"calorii":289,"ingrediente":["100 g ouă întregi (≈ 2 bucăți)","60 g albuș de ou (≈ 2 albușuri extra)","30 g ceapă verde","50 g roșii cherry","30 g brânză de vacă slabă","30 g bacon de curcan","3 ml ulei de măsline","5 g pătrunjel verde","Sare, piper – după gust"],"descriere":"O omletă țărănească autentică, bogată în gusturi simple și\ningrediente proaspete, exact ca micul dejun cald și sățios pe care îl\npregăteau bunicii la începutul zilei.","pasi":"1.Prăjește bacon-ul de curcan într-o tigaie antiaderentă până\ndevine crocant\n2.Adaugă ceapa verde tocată și roșiile tăiate jumătăți\n3.Bate ouăle cu albușurile și toarnă peste legume\n4.Presară telemeaua sfărâmată când omleta începe să se\nînchege\n5.Pliază pe jumătate și lasă încă 1 minut\n6.Garnisește cu pătrunjel proaspăt","sfaturi":"Poți adăuga și ardei gras sau dovlecel pentru extra legume.\nDacă vrei o aromă mai intensă, folosește cimbru sau oregano.\nMerge perfect alături de o felie de pâine integrală prăjită.","alergeni":"ouă, lactoză (telemea)","variante":"înlocuiește telemeaua cu brânză cottage pentru mai multe proteine și mai puține grăsimi.","macro":{"calorii_macro":"289","proteine":"24.1 g","carbohidrati":"4.2 g","fibre":"0.2 g","grasimi":"14.1 g","grasimi_saturate":"4 g","greutate_portie":"280 g"}},{"id":"traditionale-160","titlu":"Lipie Caldă cu Piept de Pui","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Mic Dejun și Gustări","pagina":160,"portii":"1","timp_minute":15,"calorii":225,"ingrediente":["58 g piept de pui afumat","17 g lipie integrală","15 g cașcaval light","15 g roșie","15 g castravete murat","10 g salată verde","15 g iaurt grecesc 2%","6 g maioneză light","2 g ulei de măsline","58 ml lapte semidegresat 1.5%","Sare și piper – după gust"],"descriere":"O lipie caldă și gustoasă, inspirată din mesele simple de la țară, în\ncare aroma pieptului de pui afumat se împletește cu prospețimea\nlegumelor, oferind un prânz hrănitor și plin de savoare.","pasi":"1.Încălzește lipia, unge-o cu iaurt și maioneză light, apoi adaugă\npuiul, cașcavalul, roșia, castravetele și salata.\n2.Rulează strâns, mai încălzește 1–2 min până se topește\ncașcavalul, taie pe jumătate și servește cu lapte semidegresat.","sfaturi":"Poți adăuga și ardei copt sau ceapă roșie pentru extra aromă.\nÎnlocuiește puiul afumat cu piept de curcan la grătar pentru o\nvariantă mai slabă în sodiu.\nSe potrivește foarte bine și cu un sos de iaurt cu usturoi.","alergeni":"gluten (lipie), lactoză (iaurt, lapte, cașcaval), muștar (dacă maioneza conține)","variante":"pentru un plus de fibre, folosește lipie din făină de secară.","macro":{"calorii_macro":"225","proteine":"18.1 g","carbohidrati":"4.6 g","fibre":"0.5 g","grasimi":"6.6 g","grasimi_saturate":"2 g","greutate_portie":"200 g"}},{"id":"traditionale-161","titlu":"Salată cu Fasole și Pâine Prăjită","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Mic Dejun și Gustări","pagina":161,"portii":"1","timp_minute":35,"calorii":183,"ingrediente":["78 g fasole roșie fiartă","47 g roșii","31 g castraveți","16 g ceapă roșie","3 ml ulei de măsline","25 g pâine integrală","Sare, piper, oregano – după gust"],"descriere":"O salată rustică, simplă și hrănitoare, în care fasolea fiartă se\ncombină cu legume proaspete și pâine prăjită, exact ca\npreparatele ușoare pe care le pregăteau bunicii în zilele de vară.","pasi":"1.Taie roșiile și castraveții cuburi, ceapa roșie felii subțiri.\n2.Amestecă legumele cu fasolea fiartă într-un bol mare.\n3.Asezonează cu sare, piper și oregano, apoi stropește cu uleiul\nde măsline.\n4.Prăjește feliile de pâine integrală și servește-le alături sau\ntăiate cuburi crocante în salată.","sfaturi":"Poți adăuga frunze de pătrunjel sau busuioc pentru un plus de\nprospețime.\nPentru mai multă aromă, pune câteva măsline negre sau zeamă\nde lămâie.\nDacă vrei un preparat mai proteic, adaugă 50 g brânză feta\nlight sau 1 ou fiert.","alergeni":"gluten (pâine integrală). Poți adăuga frunze de pătrunjel sau busuioc pentru un plus de prospețime. Pentru mai multă aromă, pune câteva măsline negre sau zeamă de lămâie. Dacă vrei un preparat mai proteic, adaugă 50 g brânză feta light sau 1 ou fiert","variante":"folosește năut sau linte în loc de fasole pentru diversitate.","macro":{"calorii_macro":"183","proteine":"3.4 g","carbohidrati":"12.9 g","fibre":"0.6 g","grasimi":"3.8 g","grasimi_saturate":"0.5 g","greutate_portie":"190 g"}},{"id":"traditionale-162","titlu":"Brânză de Vaci cu Smântână și Mărar","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Mic Dejun și Gustări","pagina":162,"portii":"1","timp_minute":10,"calorii":120,"ingrediente":["94 g brânză de vaci slabă","19 g smântână 12%","9 g mărar proaspăt","13 g ceapă verde","2 g usturoi","31 g roșii cherry (pentru servire)","31 g castraveți (pentru servire)","Sare, piper – după gust"],"descriere":"Un mic dejun sau o gustare excelentă, bogată în proteine și cu o\ntextură cremoasă, ușor aromată de verdeață.","pasi":"1.Amestecă brânza de vaci cu smântâna până devine cremoasă.\n2.Adaugă mărarul tocat, ceapa verde, usturoiul și condimentele.\n3.Servește alături de legume proaspete.","sfaturi":"sănătoase.\nSe potrivește excelent cu pâine integrală prăjită sau ca\numplutură pentru lipii.\nPoți transforma preparatul într-o cremă tartinabilă, mixând\ningredientele cu blenderul.","alergeni":"lactoză (brânză, smântână/iaurt)","variante":"pentru un gust diferit, adaugă pătrunjel sau busuioc în loc de mărar.","macro":{"calorii_macro":"120","proteine":"14.3 g","carbohidrati":"5.2 g","fibre":"0 g","grasimi":"2.3 g","grasimi_saturate":"1.5 g","greutate_portie":"200 g"}},{"id":"traditionale-164","titlu":"Ciorbă de Burtă","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Supe și Ciorbe","pagina":164,"portii":"2","timp_minute":240,"calorii":326,"ingrediente":["160 g burtă de vită prefiartă","100 g oase de vită cu măduvă","40 g morcovi","20 g țelină","20 g ceapă","4 g usturoi","1 gălbenuș (≈ 20 g)","40 g smântână light (12% grăsime)","6 ml oțet","4 ml ulei de măsline","Sare, piper – după gust"],"descriere":"O ciorbă cremoasă și aromată, perfect echilibrată, cu gust clasic și\ntextură fină.","pasi":"1.Fierbe oasele 2–3 ore pentru supa de bază.\n2.Adaugă morcovul, țelina și ceapa, apoi fierbe până se înmoaie.\n3.Pune burta tăiată și mai lasă să fiarbă 20–30 minute.\n4.Amestecă smântâna cu gălbenușurile și puțin lichid fierbinte,\napoi încorporează în oală.\n5.Adaugă usturoi, oțet, ulei și condimente.","sfaturi":"Se servește tradițional cu ardei iute și oțet suplimentar.\nPentru un gust mai intens, poți adăuga și foi de dafin și piper\nboabe la fierbere.\nDacă vrei o textură mai cremoasă, folosește blender vertical\npentru a pasa câțiva morcovi fierți și a-i adăuga înapoi în\nciorbă.","alergeni":"ou, lactoză (smântână), țelină","variante":"poți face o versiune mai dietetică folosind iaurt grecesc 2% în loc de smântână.","macro":{"calorii_macro":"326","proteine":"2.4 g","carbohidrati":"3.1 g","fibre":"0.7 g","grasimi":"7.2 g","grasimi_saturate":"3 g"}},{"id":"traditionale-165","titlu":"Ciorbă Rădăuțeană","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Supe și Ciorbe","pagina":165,"portii":"1","timp_minute":240,"calorii":188,"ingrediente":["76 g piept de pui fără piele","33 g morcovi","17 g țelină","13 g ardei gras","13 g ceapă","2 g usturoi","9 g gălbenuș de ou (≈ ½ gălbenuș)","2 ml ulei de măsline","17 g smântână de gătit 15%","217 ml apă","Sare, piper, verdeață – după gust"],"descriere":"O ciorbă rădăuțeană cremoasă și aromată, inspirată din bucătăria\nautentică de nord, exact acel preparat cald și reconfortant care\naduce familia la masă.","pasi":"1.Fierbe pieptul de pui în apă cu puțină sare, apoi adaugă\nlegumele tăiate cubulețe.\n2.După ce au fiert, scoate carnea și toac-o fâșii subțiri.\n3.Separat, amestecă gălbenușul cu smântâna și un polonic din\nzeama fierbinte.\n4.Toarnă amestecul peste ciorbă, amestecând continuu, fără să\nmai clocotească.\n5.Adaugă puiul tocat înapoi și condimentează după gust.","sfaturi":"Se servește tradițional cu ardei iute murat.\nPoți adăuga puțin oțet sau zeamă de lămâie pentru o notă mai\nacrișoară.\nPentru un gust mai intens, pune și foi de dafin sau cimbru în\ntimpul fierberii.","alergeni":"ou, lactoză (smântână), țelină","variante":"pentru extra proteine, adaugă 1 albuș de ou bătut în plus în amestecul de smântână.","macro":{"calorii_macro":"188","proteine":"18.6 g","carbohidrati":"5 g","fibre":"1.1 g","grasimi":"7.8 g","grasimi_saturate":"3 g"}},{"id":"traditionale-166","titlu":"Ciorbă Ardelenească de Perișoare","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Supe și Ciorbe","pagina":166,"portii":"2","timp_minute":45,"calorii":230,"ingrediente":["100 g carne tocată din pulpă de porc","27 g ou de găină (≈ ½ ou mic)","9 g orez basmati","36 g ceapă","64 g morcovi","55 g țelină","27 g ardei gras","27 g smântână 12%","5 g făină de grâu albă","55 g pâine integrală din grâu întreg","5 g ulei de măsline","Sare, piper, verdeață (pătrunjel, leuștean) – după gust"],"descriere":"O ciorbă consistentă, aromată și echilibrată, cu perișoare fragede\nși legume proaspete.","pasi":"1.Amestecă carnea tocată cu oul, orezul, ceapa tocată fin, sare și\npiper. Formează 3–4 perișoare.\n2.Într-o oală, călește restul de ceapă, morcovul, țelina și ardeiul în\nulei 2–3 minute.\n3.Adaugă apă fierbinte (aprox. 400–450 ml) și lasă legumele să\nfiarbă 10 minute.\n4.Adaugă perișoarele și fierbe 15 minute până sunt gătite.\n5.Amestecă smântâna cu făina și cu câteva linguri de zeamă\nfierbinte, apoi toarnă înapoi în oală.\n6.Mai fierbe 2–3 minute și potrivește de sare, piper și verdeață.","sfaturi":"Dacă vrei o variantă mai acrișoară, adaugă borș sau zeamă\nde lămâie.\nPoți servi cu ardei iute murat.\nPentru un plus de cremozitate, folosește iaurt grecesc 2% în loc\nde smântână.","alergeni":"ou, gluten (făină și pâine), lactoză (smântână)","variante":"înlocuiește carnea de porc cu curcan sau vită slabă pentru extra proteine și mai puține grăsimi.","macro":{"calorii_macro":"230","proteine":"17.1 g","carbohidrati":"21 g","fibre":"1.2 g","grasimi":"8.3 g","grasimi_saturate":"3 g"}},{"id":"traditionale-167","titlu":"Ciorbă Ardelenească de Cartofi","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Supe și Ciorbe","pagina":167,"portii":"2","timp_minute":45,"calorii":191,"ingrediente":["207 g cartofi","52 g morcovi","35 g țelină","35 g ceapă","7 ml ulei de măsline","52 g smântână light (12–15% grăsime)","1 gălbenuș (≈20 g)","7 ml oțet","7 g leuștean sau pătrunjel verde","Sare, piper – după gust"],"descriere":"O ciorbă ardelenească simplă și sățioasă, exact ca cele gătite de\nbunicile de la țară, cu legume proaspete și smântână, pentru un gust\ncald și reconfortant.","pasi":"1.Fierbe ceapa, morcovii și țelina în 1 l apă cu sare 10 min, apoi\nadaugă cartofii și mai fierbe 15–20 min.\n2.Bate gălbenușurile cu smântâna, temperează cu supă fierbinte\nși toarnă în oală la foc mic, amestecând fără să fiarbă.\n3.Potrivește cu oțet, sare și piper, apoi presară verdeață.","sfaturi":"Pentru o textură mai bogată, pasează câțiva cartofi și\namestecă în ciorbă.\nSe potrivește bine cu ardei iute murat sau cu o felie de pâine\nintegrală.\nDacă vrei un plus de aromă, adaugă și foi de dafin sau chimen\nîn timpul fierberii.","alergeni":"ou, lactoză (smântână), țelină","variante":"înlocuiește smântâna cu iaurt grecesc 2% pentru o versiune și mai light.","macro":{"calorii_macro":"191","proteine":"3.7 g","carbohidrati":"19.8 g","fibre":"2.1 g","grasimi":"9.4 g","grasimi_saturate":"4 g"}},{"id":"traditionale-168","titlu":"Ciorbă de Fasole cu Afumătură","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Supe și Ciorbe","pagina":168,"portii":"2","timp_minute":100,"calorii":159,"ingrediente":["114 g fasole boabe uscată (pusă la înmuiat peste noapte)","81 g pulpă de curcan afumată","39 g morcovi","39 g ceapă","26 g țelină","26 g ardei gras","65 g roșii cuburi","3 ml ulei de măsline","1 foaie de dafin","½ linguriță cimbru uscat","Sare, piper – după gust","7 g pătrunjel verde"],"descriere":"O ciorbă tradițională, consistentă și aromată, cu fasole fiartă lent și\nafumătură slabă pentru un gust autentic.","pasi":"1.Fierbe fasolea în apă curată 40–50 minute (poți schimba prima\napă pentru o digestie mai ușoară).\n2.Într-o altă oală, călește ceapa, morcovul, țelina și ardeiul în ulei\n2–3 minute.\n3.Adaugă pulpa de curcan afumată și gătește încă 2 minute\npentru aromă.\n4.Toarnă peste legume fasolea fiartă cu tot cu apă, adaugă\nroșiile cuburi, cimbrul și foile de dafin.\n5.Fierbe 15–20 minute, până se omogenizează aromele.\n6.Potrivește de sare și piper, apoi adaugă pătrunjelul verde la\nfinal.","sfaturi":"Poți adăuga și 1 ardei iute pentru un gust autentic.\nServește cu ceapă roșie și pâine integrală.\nDacă vrei o textură mai cremoasă, pasează 1 polonic de fasole\nși amestecă în ciorbă.","alergeni":"țelină","variante":"înlocuiește pulpa de curcan afumată cu piept de curcan.","macro":{"calorii_macro":"159","proteine":"10.7 g","carbohidrati":"15.4 g","fibre":"3.4 g","grasimi":"3.6 g","grasimi_saturate":"1 g"}},{"id":"traditionale-169","titlu":"Ciorbă de Văcuță","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Supe și Ciorbe","pagina":169,"portii":"2","timp_minute":70,"calorii":106,"ingrediente":["100 g pulpă de vită crudă","70 g cartofi albi","50 g morcovi","20 g țelină","12 g ceapă","20 g sos de roșii fără zahăr adăugat","2 ml ulei de măsline","500 ml apă","Sare, piper, pătrunjel proaspăt – după"],"descriere":"O ciorbă ușoară, aromată și hrănitoare, ideală pentru un prânz\nechilibrat.","pasi":"1.Fierbe carnea de vită până se înmoaie și se formează supa.\n2.Adaugă legumele tocate și continuă gătirea până devin\nfragede.\n3.Pune sosul de roșii, uleiul și condimentele.\n4.La final, presară pătrunjel proaspăt.","sfaturi":"Poți adăuga și borș acru sau zeamă de lămâie pentru o\nvariantă mai acrișoară.\nPentru extra aromă, pune și foi de dafin sau piper boabe.\nSe servește excelent cu ardei iute murat.","alergeni":"țelină","variante":"înlocuiește cartofii cu dovlecel sau conopidă pentru mai puțini carbohidrați.","macro":{"calorii_macro":"106","proteine":"12.3 g","carbohidrati":"8.5 g","fibre":"1.2 g","grasimi":"1.6 g","grasimi_saturate":"0.5 g"}},{"id":"traditionale-170","titlu":"Ciorbă de Lobodă","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Supe și Ciorbe","pagina":170,"portii":"2","timp_minute":70,"calorii":95,"ingrediente":["152 g lobodă roșie sau verde","40 g ceapă","40 g morcov","30 g țelină","20 g orez brun","202 ml borș","5 ml ulei de măsline","10 g leuștean sau pătrunjel verde","Sare, piper – după gust"],"descriere":"O ciorbă ușoară și plină de prospețime, așa cum se gătea\nodinioară primăvara, când loboda proaspătă aducea în casă\naromele simple și curate ale grădinii.","pasi":"1.Spală frunzele de lobodă și toacă-le grosier.\n2.Călește ceapa, morcovul și țelina în uleiul de măsline 2–3 min\nîntr-o oală mare.\n3.Adaugă 1 l apă și fierbe 10 min.\n4.Pune orezul spălat și fierbe încă 10–12 min.\n5.Adaugă loboda tocată și borșul fiert separat, mai lasă 5–7 min\nla foc mic.\n6.Asezonează cu sare și piper, apoi adaugă leuștean sau\npătrunjel verde la final.","sfaturi":"Poți combina loboda cu spanac sau ștevie pentru un gust mai\nbogat.\nDacă dorești un plus de aromă, adaugă 1–2 căței de usturoi\nzdrobit spre final.\nSe servește excelent cu ardei iute murat sau o lingură de iaurt\ngrecesc 2%.","alergeni":"țelină","variante":"înlocuiește orezul cu mei sau hrișcă pentru un aport mai mare de proteine.","macro":{"calorii_macro":"95","proteine":"1.2 g","carbohidrati":"10.7 g","fibre":"1.3 g","grasimi":"2.6 g","grasimi_saturate":"0.4 g"}},{"id":"traditionale-171","titlu":"Ciorbă de Ștevie","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Supe și Ciorbe","pagina":171,"portii":"2","timp_minute":70,"calorii":97,"ingrediente":["152 g ștevie proaspătă","40 g ceapă","40 g morcov","30 g țelină","20 g orez brun","202 ml borș","5 ml ulei de măsline","10 g leuștean sau pătrunjel verde","Sare, piper – după gust"],"descriere":"O ciorbă tradițională de primăvară, ușoară și revigorantă, în care\nștevia proaspătă aduce exact gustul acrișor și autentic al\nmâncărurilor de odinioară.","pasi":"1.Călește ceapa, morcovul și țelina 2–3 min în ulei, adaugă 1,5 l\napă și fierbe 10 min.\n2.Pune orezul și mai fierbe 10–12 min, apoi adaugă ștevia și borșul,\nlăsând 5–7 min la foc mic.\n3.Potrivește de sare și piper și presară verdețuri la servire.","sfaturi":"Poți adăuga și spanac sau ștevie congelată dacă nu ai\nproaspătă.\nPentru un gust mai bogat, pune și usturoi zdrobit la final.\nMerge foarte bine cu ardei iute murat sau o lingură de iaurt\ngrecesc 2%.","alergeni":"țelină","variante":"înlocuiește orezul cu mei sau hrișcă pentru un profil nutrițional mai bun.","macro":{"calorii_macro":"97","proteine":"1.2 g","carbohidrati":"10.7 g","fibre":"1.3 g","grasimi":"2.6 g","grasimi_saturate":"0.4 g"}},{"id":"traditionale-172","titlu":"Ciorbă Țărănească de Legume","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Supe și Ciorbe","pagina":172,"portii":"2","timp_minute":70,"calorii":108,"ingrediente":["100 g cartofi","65 g morcovi","30 g țelină","55 g dovlecel","55 g fasole verde","36 g ardei gras","36 g ceapă","75 g roșii cuburi","150 ml borș","5 ml ulei de măsline","11 g pătrunjel și leuștean verde","Sare, piper – după gust"],"descriere":"O ciorbă ușoară, plină de legume și aromată, perfectă pentru o\nmasă sănătoasă și sățioasă.","pasi":"1.Adaugă în apă ceapa, morcovul, țelina și cartofii tăiați cuburi și\nfierbe până se înmoaie.\n2.Pune dovlecelul, fasolea verde și ardeiul gras și mai fierbe\ncâteva minute.\n3.Adaugă roșiile, borșul, uleiul și condimentele.\n4.La final, pune verdețurile proaspete.","sfaturi":"Poți adăuga și conopidă sau mazăre verde pentru mai multă\nvarietate.\nDacă vrei un gust mai intens, pune și cimbru sau busuioc în timpul\nfierberii.\nSe servește excelent cu ardei iute murat sau o felie de pâine\nintegrală.","alergeni":"țelină","variante":"pentru extra proteine, poți adăuga 100 g năut fiert sau linte la final.","macro":{"calorii_macro":"108","proteine":"1.9 g","carbohidrati":"15.7 g","fibre":"3.2 g","grasimi":"2.6 g","grasimi_saturate":"0.4 g"}},{"id":"traditionale-173","titlu":"Ciorbă de Potroace","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Supe și Ciorbe","pagina":173,"portii":"2","timp_minute":70,"calorii":241,"ingrediente":["250 g piept și spate de pui (fără piele, carne slabă)","75 g morcovi","30 g țelină","30 g păstârnac","45 g ceapă","20 g orez integral","150 ml borș","5 ml ulei de măsline","11 g pătrunjel și leuștean verde","Sare, piper – după gust"],"descriere":"O ciorbă clasică de potroace, așa cum se pregătea după mesele\nbogate de sărbătoare, cu un gust acrișor și reconfortant care\nreaduce energia și aroma bucătăriei românești autentice.","pasi":"1.Fierbe tacâmurile de pui în 1 l apă și îndepărtează spuma.\n2.Adaugă legumele tocate și fierbe 20–25 min.\n3.Pune orezul și fierbe încă 10 min.\n4.Toarnă borșul fiert separat și potrivește gustul cu sare și piper.\n5.Presară verdeața la final.","sfaturi":"Se servește tradițional cu ardei iute murat sau proaspăt.\nPentru un gust mai intens, adaugă și 1–2 foi de dafin sau cimbru\nuscat.\nDacă preferi o ciorbă mai acră, mai adaugă zeamă de lămâie\npe lângă borș.","alergeni":"țelină","variante":"pentru o variantă fără orez, adaugă năut fiert (va crește fibrele și proteinele).","macro":{"calorii_macro":"241","proteine":"27.8 g","carbohidrati":"12.6 g","fibre":"2.4 g","grasimi":"3.9 g","grasimi_saturate":"0.8 g"}},{"id":"traditionale-174","titlu":"Borș de Pește","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Supe și Ciorbe","pagina":174,"portii":"2","timp_minute":40,"calorii":159,"ingrediente":["180 g file de crap","250 ml borș acru","30 g ceapă","35 g morcov","25 g țelină","60 g roșii","30 g ardei gras","3 ml ulei de măsline","12 g pătrunjel și leuștean","Sare, piper – după gust"],"descriere":"O ciorbă tradițională aromată, cu gust echilibrat între acrișor și\ndulceag, bogată în proteine ușor digerabile și acizi grași sănătoși.","pasi":"1.Curăță și taie legumele cuburi mici (ceapa, morcovul, țelina,\nardeiul și roșiile).\n2.Pune-le la fiert în 1 litru de apă pentru 15–20 de minute, până\ndevin fragede.\n3.Adaugă fileurile de pește tăiate bucăți mari și fierbe-le 10\nminute la foc mic.\n4.Toarnă borșul acru încălzit separat, adaugă sarea și piperul\ndupă gust.\n5.La final, stinge focul și presară verdeața tocată (pătrunjel și\nleuștean).\n6.Servește cald, simplu sau cu o felie de mămăligă.","sfaturi":"Nu fierbe peștele prea mult pentru a nu se desface\nPoți folosi și șalău sau știucă\nBorșul se adaugă la final pentru a-și păstra vitamina C","alergeni":"pește","variante":"poți folosi amestec de pești (știucă, somn, biban) pentru aromă mai complexă.","macro":{"calorii_macro":"159","proteine":"16 g","carbohidrati":"3.9 g","fibre":"1.1 g","grasimi":"6.1 g","grasimi_saturate":"1.2 g"}},{"id":"traditionale-175","titlu":"Ciorbă de Burtă \"fără Burtă\"","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Supe și Ciorbe","pagina":175,"portii":"2","timp_minute":240,"calorii":108,"ingrediente":["130 g ciuperci Pleurotus","30 g smântână 12%","20 g gălbenuș de ou (1 gălbenuș mare)","5 g usturoi (1 cățel mare)","10 ml oțet de mere","25 g morcov","20 g țelină","20 g ceapă","2 ml ulei de măsline (½ linguriță)","500 ml supă de legume","Sare, piper, foi de dafin – după gust"],"descriere":"O variantă ușoară și modernă a celebrei ciorbe de burtă, care\npăstrează gustul autentic și cremozitatea originalului, dar fără\ningrediente grele – perfectă pentru cei care iubesc aroma\ntradițională într-o formă ma
