l suc de lămâie","1 g ghimbir ras","190 ml apă rece","1–2 frunze de mentă","1 g sirop de agave"],"descriere":"O limonadă fresh și revigorantă, cu aromă intensă de mentă și notă\nușor picantă de ghimbir.","pasi":"1.Amestecă sucul de lămâie cu ghimbirul și apa rece.\n2.Adaugă menta și siropul de agave.","sfaturi":"Adaugă apă minerală carbogazoasă pentru o variantă tip\n„băutură carbogazoasă” sănătosă.\nPoți adăuga felii subțiri de castravete pentru un plus de\nprospețime.\nÎn zilele caniculare, servește cu cuburi de gheață din suc de\nlămâie congelat pentru un gust mai intens.","alergeni":"Fără alergeni majori","variante":"Poți înlocui siropul de agave cu miere sau câteva picături de îndulcitor; poți adăuga mai mult ghimbir pentru un gust ușor picant sau câteva frunze suplimentare de mentă pentru un efect extra-răcoritor.","macro":{"calorii_macro":"96.5","proteine":"6.6 g","carbohidrati":"17.2 g","fibre":"12.8 g","grasimi":"1.5 g","grasimi_saturate":"0 g"}},{"id":"post-213","titlu":"Smoothie cu Afine și Semințe de Cânepă","carte":"Rețete de post","carte_scurt":"Post","categorie":"Băuturi și Smoothie-uri","pagina":213,"portii":"1","timp_minute":5,"calorii":147,"ingrediente":["60 g afine","50 g banană","100 ml lapte de soia","4 g semințe de cânepă decorticate"],"descriere":"Un smoothie cremos și hrănitor, cu gust intens de afine și note fine de\nnucă oferite de semințele de cânepă.","pasi":"1.Pune toate ingredientele în blender.\n2.Mixează până obții o băutură cremoasă și omogenă.","sfaturi":"Poți înlocui semințele de cânepă cu semințe de in măcinate\npentru mai multe fibre.\nAdaugă 1 lingură de iaurt vegetal pentru un plus de\ncremozitate.\nPoți pune și 1 linguriță de semințe de chia pentru extra fibre și\nefect de sațietate.","alergeni":"Poate conține soia","variante":"Pentru o variantă fără soia, folosește lapte de migdale, lapte de cocos sau lapte de ovăz fără gluten. Dacă vrei mai multă cremozitate, poți folosi și lapte de caju.","macro":{"calorii_macro":"147.3","proteine":"6.7 g","carbohidrati":"20.5 g","fibre":"2.2 g","grasimi":"4.1 g","grasimi_saturate":"0.4 g"}},{"id":"post-214","titlu":"Smoothie Cremos cu Pară și Scorțisoară","carte":"Rețete de post","carte_scurt":"Post","categorie":"Băuturi și Smoothie-uri","pagina":214,"portii":"1","timp_minute":5,"calorii":98,"ingrediente":["125 g pere coapte","100 ml lapte de migdale","1 g scorțișoară","2 g semințe de chia"],"descriere":"Un smoothie fin și reconfortant, cu dulceață naturală de pară și\naromă caldă de scorțișoară, cremos și echilibrat.","pasi":"1.Pune perele tăiate cuburi și restul ingredientelor în blender.\n2.Mixează până devine o băutură aromată și cremoasă.","sfaturi":"Poți adăuga 1 linguriță de unt de migdale pentru un gust mai\nbogat și grăsimi sănătoase.\nPentru un plus de proteine, adaugă 10 g pudră proteică\nvegetală.","alergeni":"Poate conține nuci (migdale)","variante":"Pentru o variantă fără nuci, folosește lapte de ovăz fără gluten, lapte de orez sau lapte de cocos ușor. Dacă vrei o textură mai cremoasă, poți folosi lapte de soia.","macro":{"calorii_macro":"97.8","proteine":"1 g","carbohidrati":"20.1 g","fibre":"4.3 g","grasimi":"1.7 g","grasimi_saturate":"0.2 g"}},{"id":"post-216","titlu":"Budincă de Ovăz și Mere Caramelizate","carte":"Rețete de post","carte_scurt":"Post","categorie":"Deserturi fără Regrete","pagina":216,"portii":"1","timp_minute":20,"calorii":251,"ingrediente":["25 g fulgi de ovăz","25 g pudră proteică vegană","90 g lapte de migdale","60 g măr Golden","2 g ulei de cocos","3 g scorțișoară extract de vanilie – câteva picături"],"descriere":"O budincă aromată și reconfortantă, cu ovăz cremos și mere ușor\ncaramelizate, perfect echilibrată între dulce și condimentat.","pasi":"1.Pune fulgii de ovăz într-o crăticioară, adaugă laptele de\nmigdale și gătește la foc mic 5–7 minute, până se îngroașă.\n2.Adaugă pudra proteică și extractul de vanilie, amestecând bine\npână devine cremos.\n3.Separat, într-o tigaie antiaderentă, călește cubulețele de măr în\nulei de cocos 2–3 minute, până devin ușor caramelizate.\n4.Adaugă scorțișoara peste mere și amestecă.\n5.Toarnă budinca de ovăz într-un bol și pune deasupra merele\ncaramelizate.","sfaturi":"Un praf de nucșoară sau ghimbir pudră merge perfect cu\nmerele caramelizate.\nPoți pregăti budinca de seara și o încălzești dimineața, dar\nmerele e mai bine să le faci proaspete pentru un gust intens.","alergeni":"Poate conține nuci (din laptele vegetal, dacă este produs într-o unitate mixtă)","variante":"Pentru o variantă fără gluten, folosește fulgi de ovăz gluten-free. Pentru o variantă fără nuci, înlocuiește laptele de migdale cu lapte de ovăz fără gluten, lapte de orez sau lapte de cocos.","macro":{"calorii_macro":"250.7","proteine":"16.3 g","carbohidrati":"24.9 g","fibre":"4.5 g","grasimi":"5.5 g","grasimi_saturate":"1.8 g"}},{"id":"post-217","titlu":"Orez cu Lapte, Măr și Scorțișoară","carte":"Rețete de post","carte_scurt":"Post","categorie":"Deserturi fără Regrete","pagina":217,"portii":"1","timp_minute":20,"calorii":393,"ingrediente":["23 g orez basmati","27 g măr Golden","7 g îndulcitor Stevia","1 g scorțișoară","9 g nuci","45 g iaurt de cocos","90 g lapte de cocos"],"descriere":"O rețetă aromată și cremoasă, perfectă pentru diminețile reci sau\nca gustare dulce și sănătoasă. Fără zahăr adăugat, dar plină de\ngust datorită merelor caramelizate natural și scorțișoarei.","pasi":"1.Fierbe orezul în laptele de cocos la foc mic, amestecând\nfrecvent, până devine cremos (10–12 minute).\n2.Adaugă îndulcitorul și scorțișoara, amestecând ușor.\n3.Într-o tigaie, călește mărul tăiat cubulețe 2–3 minute până se\nînmoaie ușor.\n4.Servește orezul cald într-un bol, adaugă mărul caramelizat,\niaurtul de cocos și presară nucile mărunțite.","sfaturi":"Alege orez basmati sau jasmin, pentru o textură mai fină și o\ndigestie mai ușoară.\nDacă vrei o aromă mai intensă, adaugă câteva picături de\nesență de vanilie sau coajă rasă de lămâie/portocală.\nPoți carameliza ușor merele într-o tigaie antiaderentă cu puțină\napă și scorțișoară pentru un gust mai intens.","alergeni":"Poate conține nuci. Verifică eticheta iaurtului și a laptelui vegetal (posibile urme de soia sau gluten)","variante":"Dacă ai alergie la nuci, le poți elimina sau înlocui cu aceeași cantitate de semințe de dovleac mărunțite.","macro":{"calorii_macro":"393.2","proteine":"5.3 g","carbohidrati":"28.3 g","fibre":"1.0 g","grasimi":"27.9 g","grasimi_saturate":"20 g","greutate_portie":"200 g"}},{"id":"post-218","titlu":"Budincă de Ovăz cu Ciocolată și Fructe","carte":"Rețete de post","carte_scurt":"Post","categorie":"Deserturi fără Regrete","pagina":218,"portii":"1","timp_minute":40,"calorii":310,"ingrediente":["24 g fulgi de ovăz","45 g piersici","4 g miere","4 g ciocolată neagră","55 g lapte de cocos","68 g iaurt de cocos"],"descriere":"O budincă cremoasă și intens aromată, cu ciocolată fină și fructe\nproaspete, echilibrată între dulce, catifelat și fresh.","pasi":"1.Fierbe fulgii de ovăz în laptele de cocos până devin cremoși.\n2.Amestecă ovăzul fiert cu iaurtul de cocos pentru o textură mai\nfină.\n3.Adaugă mierea pentru îndulcire și bucățelele de ciocolată\nneagră.\n4.Taie piersica cubulețe și adaug-o deasupra.\n5.Servește imediat sau lasă la rece 30 min pentru o budincă mai\nconsistentă.","sfaturi":"Alege ciocolată neagră cu minim 70% cacao pentru un aport\nmai mare de antioxidanți.\nDacă vrei o variantă mai dietetică, înlocuiește mierea cu\nîndulcitor lichid sau stevia.\nPoți adăuga 1 linguriță de semințe de chia pentru extra fibre și\ntextură.","alergeni":"Poate conține nuci (din laptele vegetal și iaurt), precum și soia (în ciocolată sau produse vegetale procesate)","variante":"Pentru o variantă fără gluten, folosește fulgi de ovăz gluten-free. Pentru cei care evită cacaoa, ciocolata neagră poate fi înlocuită cu fulgi de roșcove (carob).","macro":{"calorii_macro":"310.5","proteine":"4.6 g","carbohidrati":"26.3 g","fibre":"0.5 g","grasimi":"16.1 g","grasimi_saturate":"12 g","greutate_portie":"205 g"}},{"id":"post-219","titlu":"Iaurt Vegetal cu Semințe și Afine","carte":"Rețete de post","carte_scurt":"Post","categorie":"Deserturi fără Regrete","pagina":219,"portii":"1","timp_minute":15,"calorii":127,"ingrediente":["145 g iaurt de soia","5 g semințe de chia","50 g afine"],"descriere":"Un preparat simplu și hrănitor, cu iaurt vegetal cremos, semințe\nnutritive și prospețimea afinelor.","pasi":"1.Pune iaurtul de soia într-un bol mic.\n2.Adaugă semințele de chia și amestecă bine.\n3.Completează cu afine proaspete deasupra.\n4.Lasă 5-10 minute pentru ca semințele să se hidrateze puțin (sau\nchiar peste noapte pentru o textură mai densă).","sfaturi":"Dacă lași semințele de chia peste noapte, vei obține o\nconsistență de budincă, foarte sățioasă.\nAdaugă un strop de esență de vanilie sau scorțișoară pudră.","alergeni":"Poate conține soia","variante":"Pentru o variantă fără soia, folosește iaurt vegetal din cocos, migdale sau ovăz. Dacă vrei o textură mai cremoasă, poți adăuga 1 linguriță de unt de cocos sau 1 lingură de pudră proteică vegană pe bază de mazăre.","macro":{"calorii_macro":"127","proteine":"6.9 g","carbohidrati":"10.5 g","fibre":"2.3 g","grasimi":"4.5 g","grasimi_saturate":"0.6 g"}},{"id":"post-220","titlu":"Budincă de Ovăz cu Iaurt de Soia și Zmeură","carte":"Rețete de post","carte_scurt":"Post","categorie":"Deserturi fără Regrete","pagina":220,"portii":"1","timp_minute":5,"calorii":194,"ingrediente":["25 g fulgi de ovăz","125 g iaurt de soia","40 g zmeură","4 g semințe de chia"],"descriere":"O budincă fină și răcoritoare, cu ovăz cremos, iaurt de soia catifelat\nși prospețimea naturală a zmeurei.","pasi":"1.Pune fulgii de ovăz și semințele de chia într-un bol mic sau\nborcan.\n2.Adaugă iaurtul de soia și amestecă bine.\n3.Lasă la frigider cel puțin 30 de minute (ideal peste noapte)\npentru ca ovăzul și chia să absoarbă lichidul și să se formeze\ntextura de budincă.\n4.La servire, adaugă zmeura deasupra.","sfaturi":"Pune un strop de esență de vanilie sau scorțișoară pudră.\nMerge foarte bine și cu afine, căpșuni sau mango, dacă vrei\ndiversitate","alergeni":"Poate conține soia și gluten (din ovăz, dacă nu este certificat fără gluten)","variante":"Pentru o variantă fără gluten, folosește fulgi de ovăz gluten-free. Pentru o variantă fără soia, înlocuiește iaurtul de soia cu iaurt vegetal din cocos, migdale sau ovăz.","macro":{"calorii_macro":"194.2","proteine":"9.5 g","carbohidrati":"21.6 g","fibre":"3.4 g","grasimi":"5.5 g","grasimi_saturate":"1 g","greutate_portie":"190 g"}},{"id":"post-221","titlu":"Iaurt Vegetal cu Scorțisoară si Ciocolată Neagră","carte":"Rețete de post","carte_scurt":"Post","categorie":"Deserturi fără Regrete","pagina":221,"portii":"1","timp_minute":5,"calorii":206,"ingrediente":["175 g iaurt de soia","5 g scorțișoară pudră","20 g ciocolată neagră (min. 70% cacao)"],"descriere":"Un preparat simplu și aromat, cu iaurt vegetal cremos, note calde\nde scorțișoară și contrast intens de ciocolată neagră.","pasi":"1.Pune iaurtul într-un bol mic.\n2.Adaugă scorțișoara și amestecă bine.\n3.Rade sau toacă ciocolata neagră și presară deasupra.","sfaturi":"Poți adăuga câteva fructe de pădure pentru un plus de\nprospețime și fibre.\nAdaugă 1 linguriță de miere sau sirop de agave dacă dorești un\ngust mai dulce.\nPoți presăra și câteva nuci crude tocate pentru extra crocant și\ngrăsimi sănătoase.","alergeni":"Poate conține soia și urme de lapte sau nuci (din ciocolată)","variante":"Pentru o variantă fără soia, folosește iaurt vegetal din cocos, migdale sau ovăz. Dacă vrei o aromă mai intensă de ciocolată, poți înlocui ciocolata neagră cu fulgi de roșcove (carob).","macro":{"calorii_macro":"205.4","proteine":"8.2 g","carbohidrati":"17.6 g","fibre":"0 g","grasimi":"9.6 g","grasimi_saturate":"4.5 g","greutate_portie":"200 g"}},{"id":"post-222","titlu":"Cheesecake Vegan la Pahar cu Ovăz și Cireșe","carte":"Rețete de post","carte_scurt":"Post","categorie":"Deserturi fără Regrete","pagina":222,"portii":"1","timp_minute":5,"calorii":234,"ingrediente":["80 g iaurt de soia","32 g fulgi de ovăz","80 g cireșe","8 g sirop de arțar"],"descriere":"Un desert rapid și răcoritor, cu straturi fine de ovăz, iaurt vegetal\ncremos și cireșe dulci-acrișoare.","pasi":"1.Pune la baza unui pahar fulgii de ovăz.\n2.Adaugă iaurtul de soia peste.\n3.Pune deasupra cireșele tăiate și stropește cu sirop de arțar.\n4.Servește rece ca mic dejun rapid sau desert sănătos.","sfaturi":"Merge foarte bine și cu afine, zmeură sau căpșuni, dacă nu ai\ncireșe la îndemână.\nPoți alterna straturile (ovăz–iaurt–fructe) pentru un aspect de\nmini-parfait.\nPentru mai multe proteine, amestecă iaurtul cu 10 g pudră\nproteică vegetală.","alergeni":"Poate conține soia și gluten (din ovăz, dacă nu este certificat fără gluten)","variante":"Pentru o variantă fără soia, folosește iaurt vegetal din cocos, migdale sau ovăz. Pentru o variantă fără gluten, alege fulgi de ovăz gluten-free.","macro":{"calorii_macro":"234.3","proteine":"8.2 g","carbohidrati":"32.6 g","fibre":"0 g","grasimi":"3.8 g","grasimi_saturate":"0.6 g","greutate_portie":"200 g"}},{"id":"post-223","titlu":"Parfait Proteic cu Fructe de Pădure și Granola Crocantă","carte":"Rețete de post","carte_scurt":"Post","categorie":"Deserturi fără Regrete","pagina":223,"portii":"1","timp_minute":10,"calorii":243,"ingrediente":["105 g iaurt vegetal de ovăz","13 g pudră proteică vegană","65 g afine","5 g semințe de chia","12 g granola"],"descriere":"Un desert cremos și răcoritor, cu straturi fine de iaurt proteic, fructe\nde pădure și granola crocantă, perfect echilibrat ca textură și gust.","pasi":"1.Amestecă iaurtul vegetal cu pudra proteică până devine o\ncremă omogenă.\n2.Într-un pahar sau bol, adaugă un strat de cremă de iaurt, apoi\nun strat de afine și câteva semințe de chia.\n3.Repetă straturile până termini ingredientele.\n4.Presară granola deasupra pentru un plus de textură crocantă.\n5.Lasă 5 minute să se hidrateze ușor semințele de chia și\nsavurează!","sfaturi":"Lasă paharul la frigider 20–30 min, ca semințele de chia să se\numfle și să dea consistență cremoasă.\nPoți combina afinele cu zmeură, căpșuni sau mango pentru\ndiversitate.\nPoți adăuga 1 linguriță de miere sau sirop de agave dacă\npreferi un gust mai dulce.\nPentru un aport mai mare de grăsimi sănătoase, presară\ndeasupra 1 lingură de nuci tocate.","alergeni":"Poate conține soia, gluten (din granola) și nuci (dacă sunt adăugate)","variante":"Pentru o variantă fără soia, folosește iaurt vegetal din cocos, migdale sau ovăz. Pentru o variantă fără gluten, alege granola gluten-free.","macro":{"calorii_macro":"243.7","proteine":"8.3 g","carbohidrati":"20.6 g","fibre":"2.6 g","grasimi":"7.2 g","grasimi_saturate":"1.0 g","greutate_portie":"200 g"}},{"id":"post-224","titlu":"Mousse Proteic de Ciocolată cu Avocado","carte":"Rețete de post","carte_scurt":"Post","categorie":"Deserturi fără Regrete","pagina":224,"portii":"1","timp_minute":5,"calorii":322,"ingrediente":["33 g pudră proteică vegană","65 g avocado","85 g banană","8 g cacao pudră","5 g lapte de migdale","4 g îndulcitor lichid"],"descriere":"Un mousse cremos și intens ciocolatos, cu textură fină și gust bogat,\nobținut din ingrediente simple și nutritive.","pasi":"1.Pune în blender banana, avocado și laptele de migdale.\n2.Adaugă pudra proteică, cacao și îndulcitorul.\n3.Mixează până obții o cremă fină și aerată.\n4.Servește imediat sau lasă 30 min la frigider pentru o textură mai\ndensă.","sfaturi":"Pune câteva picături de extract de vanilie sau un praf de\nscorțișoară.\nServește cu fulgi de ciocolată neagră sau fructe de pădure\ndeasupra.\nMousse-ul rezistă 1 zi la frigider – devine și mai dens dacă îl lași\nla rece.","alergeni":"Poate conține nuci (din laptele vegetal) și soia (dacă este prezentă în pudra proteică)","variante":"Pentru o variantă fără nuci, folosește lapte de ovăz fără gluten, lapte de orez sau lapte de cocos light. Dacă pudra proteică vegană conține alergeni (ex. soia), poți opta pentru o pudră pe bază de mazăre 100% pură","macro":{"calorii_macro":"322.1","proteine":"20.3 g","carbohidrati":"30 g","fibre":"8.2 g","grasimi":"14.6 g","grasimi_saturate":"2.2 g","greutate_portie":"200 g"}},{"id":"post-225","titlu":"Budincă de Chia cu Lapte Vegetal și Fructe","carte":"Rețete de post","carte_scurt":"Post","categorie":"Deserturi fără Regrete","pagina":225,"portii":"1","timp_minute":5,"calorii":181,"ingrediente":["27 g semințe de chia","135 g lapte de migdale","3 g sirop de arțar","35 g fructe de pădure"],"descriere":"O budincă fină și răcoritoare, cu textură catifelată și prospețimea\nfructelor, ideală pentru un desert ușor și nutritiv.","pasi":"1.Amestecă într-un borcan laptele cu semințele de chia și siropul\n2.Acoperă și lasă la frigider minimum 4 ore sau peste noapte.\n3.Amestecă ușor înainte de servire și adaugă fructele de pădure.","sfaturi":"Poți adăuga și o linguriță de cacao pentru o variantă\nciocolatie.\nPoți adăuga 1 linguriță de extract de vanilie pentru un plus de\naromă.\nPentru mai multe proteine, adaugă 1 lingură de pudră proteică\nvegetală.","alergeni":"Poate conține nuci (din laptele vegetal)","variante":"Pentru o variantă fără nuci, folosește lapte de ovăz fără gluten, lapte de orez sau lapte de cocos light. Pentru o consistență mai cremoasă, poți combina laptele ales cu 1 linguriță de iaurt vegetal din cocos.","macro":{"calorii_macro":"180.9","proteine":"6.6 g","carbohidrati":"6.7 g","fibre":"6.8 g","grasimi":"10.4 g","grasimi_saturate":"1.2 g","greutate_portie":"200 g"}},{"id":"post-231","titlu":"Clătite de Post cu Lapte Vegetal","carte":"Rețete de post","carte_scurt":"Post","categorie":"Deserturi fără Regrete","pagina":231,"portii":"2","timp_minute":25,"calorii":303,"ingrediente":["120 g făină integrală","230 g lapte de ovăz","8 g ulei de cocos","5 g stevia","80 g piure de fructe de pădure"],"descriere":"Clătite ușoare, fără ouă și fără lactate, ideale pentru perioadele de\npost sau pentru cei care preferă o alimentație vegetală. Textură\nmoale, gust delicat și posibilități infinite de umplutură.","pasi":"1.Amestecă făina cu îndulcitorul și adaugă treptat laptele\nvegetal, amestecând continuu până obții un aluat fluid.\n2.Încorporează uleiul și omogenizează.\n3.Încinge o tigaie antiaderentă și unge-o ușor cu ulei.\n4.Toarnă un polonic mic de compoziție și rotește tigaia pentru a\nacoperi uniform suprafața.\n5.Coace clătitele 1–2 minute pe fiecare parte până devin aurii.\n6.Umple cu piure de fructe de padure și rulează.","sfaturi":"Dacă vrei mai pufoase, adaugă ½ linguriță praf de copt.\nPoți adăuga 1 linguriță de scorțișoară pentru un gust aromat.\nPentru extra proteine, adaugă 20 g pudră proteică vegetală în\naluat.","alergeni":"Poate conține gluten (din făină) și ovăz","variante":"Dacă ai intoleranță la gluten, poți înlocui făina integrală cu aceeași cantitate de făină fără gluten, iar dacă nu tolerezi laptele de ovăz, îl poți schimba cu lapte de migdale neîndulcit.","macro":{"calorii_macro":"303.1","proteine":"8.2 g","carbohidrati":"47.7 g","fibre":"7.2 g","grasimi":"0.7 g","grasimi_saturate":"0.2 g"}},{"id":"post-235","titlu":"Prăjitură de Morcovi","carte":"Rețete de post","carte_scurt":"Post","categorie":"Deserturi fără Regrete","pagina":235,"portii":"8","timp_minute":40,"calorii":151,"ingrediente":["200 g morcovi rași","200 g făină integrală","50 g nuci măcinate","100 ml lapte de soia","8 g ulei de cocos","2 g scorțișoară","5 g praf de copt"],"descriere":"Un desert clasic reinterpretat într-o variantă sănătoasă, bogată în\nfibre, grăsimi bune și gust autentic de scorțișoară. Perfectă pentru\nmicul dejun sau o gustare dulce, dar echilibrată.","pasi":"1.Preîncălzește cuptorul la 180°C.\n2.Amestecă făina integrală cu praful de copt, scorțișoara și nucile\nmăcinate.\n3.Adaugă morcovii rași, laptele de soia și uleiul, amestecând\npână obții o compoziție omogenă.\n4.Toarnă aluatul într-o tavă tapetată cu hârtie de copt.\n5.Coace 25–30 minute sau până când trece testul scobitorii.\n6.Las-o să se răcească înainte de a o tăia în 8 felii egale.","sfaturi":"Un strat de cremă din iaurt vegetal cu vanilie o transformă într-\nun desert festiv.\nPoți adăuga 2 linguri de stafide sau curmale tocate pentru un\nplus de dulceață naturală.","alergeni":"Conține gluten (din făină) și nuci","variante":"Dacă ai alergie la nuci, le poți înlocui cu aceeași cantitate de semințe de floarea-soarelui mărunțite, care oferă textură și grăsimi bune, menținând aportul caloric foarte apropiat de varianta originală; iar dacă ești intolerant la gluten, poți folosi făină fără gluten în aceeași cantitate pentru o consistență asemănătoare.","macro":{"calorii_macro":"151","proteine":"5 g","carbohidrati":"21.5 g","fibre":"4.1 g","grasimi":"4.6 g","grasimi_saturate":"1 g"}},{"id":"post-236","titlu":"Tartă cu Mere și Scorțișoară","carte":"Rețete de post","carte_scurt":"Post","categorie":"Deserturi fără Regrete","pagina":236,"portii":"8","timp_minute":45,"calorii":192,"ingrediente":["300 g făină","40 ml ulei de cocos","100 ml apă rece","300 g mere mari","5 g scorțișoară","10 g stevia"],"descriere":"Un desert clasic reinterpretat într-o variantă simplă și naturală, fără\nzahăr rafinat, cu o crustă fragedă și mere parfumate coapte lent.","pasi":"1.Într-un bol, amestecă făina cu uleiul și apa rece până obții un\naluat omogen, ușor elastic.\n2.Întinde aluatul într-o foaie subțire și așază-l într-o tavă tapetată\ncu hârtie de copt.\n3.Curăță merele, taie-le felii subțiri și așază-le deasupra aluatului.\n4.Presară scorțișoară și stevia, apoi pliază ușor marginile tartei\npeste mere.\n5.Coace la 180°C timp de 30–35 de minute, până crusta devine\naurie și merele sunt moi.\n6.Las-o să se răcească ușor înainte de a o tăia în 8 felii egale.","sfaturi":"Poți adăuga câteva nuci mărunțite pentru un plus de crocant și\ngrăsimi sănătoase.\nServește cu un sos de iaurt vegetal cu vanilie pentru extra\naromă.","alergeni":"Conține gluten (din făină)","variante":"Dacă ai intoleranță la gluten, poți înlocui făina clasică cu aceeași cantitate de făină fără gluten, iar dacă ai sensibilitate la scorțișoară, o poți schimba cu aceeași cantitate de pudră de vanilie naturală, păstrând un aport caloric asemănător și o aromă la fel de plăcută.","macro":{"calorii_macro":"192","proteine":"3.8 g","carbohidrati":"32 g","fibre":"1 g","grasimi":"0 g","grasimi_saturate":"0 g"}},{"id":"post-237","titlu":"Cremă de Griș cu Lapte Vegetal","carte":"Rețete de post","carte_scurt":"Post","categorie":"Deserturi fără Regrete","pagina":237,"portii":"1","timp_minute":15,"calorii":310,"ingrediente":["355 g lapte de soia","42 g griș","4 g sirop de agave scorțișoară – după gust"],"descriere":"Un desert simplu, cremos și reconfortant, ideal pentru momentele în\ncare vrei ceva dulce, dar ușor. Se prepară rapid și poate fi savurat\natât cald, cât și rece.","pasi":"1.Pune laptele de soia într-un vas și adu-l aproape de punctul de\nfierbere.\n2.Adaugă grișul în ploaie, amestecând continuu cu un tel pentru a\nevita formarea cocoloașelor.\n3.Fierbe 5–6 minute până când crema capătă consistență.\n4.Îndulcește cu sirop de agave și aromatizează cu scorțișoară.\n5.Servește caldă sau las-o să se răcească pentru o textură mai\ndensă.","sfaturi":"Servește cu fructe proaspete sau sos de fructe de pădure\npentru un desert mai bogat în antioxidanți.\nAdaugă 1 linguriță de vanilie pentru un gust mai intens.","alergeni":"Conține gluten (din griș) și soia","variante":"Dacă ești alergică la soia, poți folosi aceeași cantitate de lapte de migdale neîndulcit, menținând textura și aportul caloric foarte apropiat.","macro":{"calorii_macro":"310","proteine":"17.8 g","carbohidrati":"4.4 g","fibre":"0 g","grasimi":"7.8 g","grasimi_saturate":"1 g","greutate_portie":"380 g"}},{"id":"internationale-52","titlu":"Salată de Boeuf Light","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Aperitive și Gustări Fresh","pagina":52,"portii":"4","timp_minute":50,"calorii":254,"ingrediente":["Pentru salată:","160 g morcovi","100 g cartofi","100 g păstârnac","150 g castraveți murați (în oțet)","100 g mazăre fiartă","250 g piept de pui fiert","Pentru maioneză light:","2 gălbenușuri fierte (~36 g)","150 g iaurt grecesc 2%","1 linguriță muștar clasic (5 g)","1 lingură ulei de măsline (10 ml)","Sare, piper, zeamă de lămâie – după gust"],"descriere":"O reinterpretare ușoară și echilibrată a celebrei salate tradiționale,\ncu maioneză light din iaurt grecesc. Gust autentic, dar mult mai\nușoară și potrivită pentru un stil de viață sănătos.","pasi":"1. Fierbe legumele până devin fragede, dar nu moi excesiv.\n2. Taie legumele, castraveții și carnea în cubulețe mici.\n3. Pentru maioneză: pasează gălbenușurile și amestecă-le cu\niaurtul, muștarul și uleiul.\n4. Combină toate ingredientele într-un bol mare și amestecă\nbine.\n5.  Gustă, potrivește de sare și lasă la rece minimum 1 oră.","sfaturi":"Fierbe legumele până devin fragede, dar nu moi excesiv.\nTaie legumele, castraveții și carnea în cubulețe mici.\nPentru maioneză: pasează gălbenușurile și amestecă-le cu\niaurtul, muștarul și uleiul.\nCombină toate ingredientele într-un bol mare și amestecă bine.\nGustă, potrivește de sare și lasă la rece minimum 1 oră.","alergeni":"ouă, muștar, lactoză (din iaurt)","variante":"Pentru o variantă vegană, înlocuiește iaurtul cu un iaurt vegetal nesucrat (ex.: din soia sau cocos).","macro":{"calorii_macro":"254","proteine":"26.6 g","carbohidrati":"14.2 g","fibre":"2.8 g","grasimi":"8.2 g","grasimi_saturate":"2.2 g","greutate_portie":"265 g"}},{"id":"internationale-53","titlu":"Salată de Vinete","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Aperitive și Gustări Fresh","pagina":53,"portii":"4","timp_minute":45,"calorii":84,"ingrediente":["500 g vinete coapte (curățate)","100 g ceapă albă sau roșie, tocată fin","150 g iaurt grecesc 2%","1 lingură ulei de măsline (10 g) Sare, piper, zeamă de lămâie – după gust"],"descriere":"O rețetă clasică românească, fină ș  mic, pentru interior) sare, piper"],"descriere":"O variantă tradițională, aromată și echilibrată a drobului de miel,\nperfectă pentru masa de Paște.","pasi":"1.Fierbe organele de miel timp de 30–40 minute, apoi lasă-le la\nrăcit și toacă-le mărunt.\n2.Călește ușor ceapa verde și usturoiul verde în 1 lingură de ulei.\n3.Amestecă organele tocate cu legumele călite, verdeața tocată,\nouăle crude, pesmetul, sarea și piperul.\n4.Tapetează o tavă cu hârtie de copt și toarnă jumătate din\ncompoziție.\n5.Așază oul fiert pe mijloc și acoperă cu restul compoziției.\n6.Unge suprafața cu puțin ulei.\n7.Coace drobul la 180°C timp de 35–40 minute, până se\nrumenește ușor.","sfaturi":"Pentru un gust mai bogat, poți adăuga și puțin ficat de pasăre.\nDrobului i se pot pune și foi de plăcintă/aluat ca înveliș, pentru\nun aspect mai festiv.\nSe servește tradițional la masa de Paște, alături de salată verde\nși ridichi.","alergeni":"ouă, gluten (pesmet)","variante":"în loc de pesmet, poți folosi fulgi de ovăz măcinați.","macro":{"calorii_macro":"280","proteine":"7.7 g","carbohidrati":"0.9 g","fibre":"0.2 g","grasimi":"8.6 g","grasimi_saturate":"2.9 g"}},{"id":"internationale-80","titlu":"Chifteluțe de Curcan la Cuptor cu Dovlecel","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":80,"portii":"2","timp_minute":40,"calorii":242,"ingrediente":["230 g carne tocată de curcan","70 g dovlecel ras","55 g ou crud (≈ 1 ou mic)","15 g fulgi de ovăz","25 g ceapă","3 g usturoi sare, piper, cimbru","2 g ulei (pentru uns tava)"],"descriere":"Chifteluțe fragede, sănătoase și foarte ușoare, unde carnea de\ncurcan se combină perfect cu dovlecelul și condimentele aromate.","pasi":"1.Stoarce dovlecelul ras și amestecă-l cu restul ingredientelor.\n2.Formează biluțe mici și așază-le pe hârtie de copt.\n3.Coace la 190°C timp de 25–30 de minute, până se rumenesc.","sfaturi":"Servește cu muștar, sos de roșii light sau salată de varză.\nSe pot congela și înc .","alergeni":"lactoză (din brânzeturi și lapte), gluten (din paste). Calorii: ~300 kcal Proteine: ~24.5 g Carbohidrați: ~29.2 (din care fibre: ~2.4 g) Grăsimi: ~7.5 g (din care saturate: ~2.8 g Presară pătrunjel verde tocat sau fulgi de chilli. Merge bine cu salată verde proaspătă sau murături light","variante":"Pentru o variantă fără gluten, folosește paste din porumb sau linte. Pentru o variantă fără lactoză, înlocuiește brânzeturile cu alternative vegetale light (ex. parmezan vegetal sau drojdie inactivă).","macro":{"calorii_macro":"300","proteine":"24.5 g","fibre":"2.4 g","grasimi":"7.5 g","grasimi_saturate":"2.8 g","greutate_portie":"370 g"}},{"id":"internationale-88","titlu":"Mcnuggets Proteici cu Cartofi Crocanți","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":88,"portii":"2","timp_minute":45,"calorii":263,"ingrediente":["Pui","155 g carne tocată de pui","25 g ou crud (≈ ½ ou mic)","1 g sare","1 g usturoi pudră","1 g ceapă pudră","1 g boia afumată","1 g pudră de muștar","1 g piper negru","40 g făină simplă","25 g ou bătut (pentru înveliș)","2 g spray de gătit","Cartofi crocanți","155 g cartofi","1 g sare","1 g pudră de usturoi","1 g boia afumată"],"descriere":"O versiune sănătoasă și proteică a celebrelor McNuggets,\npregătite din carne slabă de pui și coapte până devin crocante,\nservite alături de cartofi rumeniți fără exces de ulei — o masă\ngustoasă, sățioasă și perfectă pentru slăbire.\nMod de preparare – Nuggets:","pasi":"1. Blenduiește pieptul de pui (dacă nu e tocat), apoi\namestecă-l cu ou și condimente.\n2.Formează nuggets cu mâinile umezite, trece-i prin făină și ou\nbătut, apoi gătește-i în air fryer (200°C, 12–15 min) sau\ncuptor (20–25 min), întorcând la jumătate.\n3.Pulverizează cu spray pentru extra crocant.\nMod de preparare – Cartofi:\n1. Taie bastonașe, condimentează și coace la 200°C – 20–25\nmin în air fryer sau 30–35 min în cuptor.","sfaturi":"Servește cu un sos light din iaurt gre oasă, în care legumele coapte se\nacoperă cu un strat cremos de ou, iaurt și brânză — perfectă ca\ngarnitură sau ca o cină sănătoasă, rapidă și sățioasă.","pasi":"1.Taie legumele felii și așază-le în tavă.\n2.Amestecă oul cu iaurtul și brânza, toarnă deasupra.\n3.Coace 25 min la 180°C.","sfaturi":"Poți adăuga și ciuperci sau spanac.\nMerge cu pâine prăjită.","alergeni":"ouă (din compoziție), lactoză (din brânză și iaurt)","variante":"Pentru o variantă fără lactoză, folosește brânză și iaurt vegetal. Pentru o opțiune fără ou, înlocuiește oul cu 1 lingură de semințe de in măcinate amestecate cu 3 linguri de apă.","macro":{"calorii_macro":"146","proteine":"11.9 g","carbohidrati":"6.8 g","fibre":"1.3 g","grasimi":"7.8 g","grasimi_saturate":"3 g","greutate_portie":"180 g"}},{"id":"internationale-91","titlu":"Lasagna de Cartofi cu 4 Ingrediente","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":91,"portii":"2","timp_minute":65,"calorii":220,"ingrediente":["190 g cartofi","40 g parmezan ras","75 g șuncă slabă de curcan","95 g cremă de brânză  light sare (după gust)"],"descriere":"O lasagna extrem de simplă și delicioasă, pregătită cu doar 4\ningrediente — cartofi, șuncă, brânză și parmezan — o\ncombinație cremoasă, sățioasă și perfectă pentru zilele în care\nvrei ceva rapid, dar super gustos.","pasi":"1.Feliază cartofii foarte subțire, clătește-i bine în apă rece\npână rămâne limpede.\n2.Într-o tavă mică, montează straturi: cartofi, parmezan, șuncă,\nbrânză topită — repetă de 4 ori.\n3.Apasă cu lingura, adaugă parmezan și mozzarella\ndeasupra.\n4.Gătește în air fryer la 160°C timp de 45–50 min.\n5.Lasă 5–10 min la răcit, apoi porționează.","sfaturi":"Poți adăuga între straturi și felii de roșii sau dovlecel.\nMerge perfect cu o salată verde sau un sos de iaurt cu\nusturoi.\nDacă nu ai air fryer, se poate coace și la cuptor: 180°C,\naproximativ 50–60 minute","alergeni":"lactoză (din brânză și parmezan), proteine animale (din șuncă)","variante":"Pentru o variantă fără lactoză, folosește parmezan și brânză vegetală sau produse lactate fără lactoză.","macro":{"calorii_macro":"220","proteine":"14.3 g","carbohidrati":"17 g","fibre":"1 g","grasimi":"5.9 g","grasimi_saturate":"2.5 g","greutate_portie":"190 g"}},{"id":"internationale-92","titlu":"Pizza cu Blat de Conopidă","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":92,"portii":"2","timp_minute":35,"calorii":159,"ingrediente":["265 g conopidă rasă","80 g ou crud (≈ 1 ou mare + puțin albuș)","55 g brânză rasă light oregano, busuioc, sare"],"descriere":"O pizza light, cu blat din conopidă, perfectă pentru cei care vor\no variantă low-carb, bogată în proteine și extrem de gustoasă\n— ideală pentru prânz sau cină fără vinovăție.","pasi":"1.Preîncălzește cuptorul la 200°C.\n2.Amestecă toate ingredientele și întinde pe hârtie de copt.\n3.Coace 15 minute, apoi adaugă toppingurile dorite și mai\ncoace 10 minute.","sfaturi":"Scurge foarte bine conopida după ce o razi!\nDupă ce o razi (sau o toci la robot), pune-o într-un tifon,\nprosop curat sau strecurătoare fină și stoarce excesul de\napă. Altfel blatul va ieși umed și se va rupe.","alergeni":"ouă (din compoziție), lactoză (din brânză)","variante":"Pentru o variantă fără lactoză, folosește brânză vegetală sau din lapte fără lactoză.","macro":{"calorii_macro":"159","proteine":"12 g","carbohidrati":"0.7 g","fibre":"0 g","grasimi":"8.6 g","grasimi_saturate":"3 g","greutate_portie":"170 g"}},{"id":"internationale-93","titlu":"Burger Crocant Tip Kfc","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":93,"portii":"2","timp_minute":45,"calorii":343,"ingrediente":["170 g piept de pui","25 g albuș","25 g fulgi de porumb","25 g maioneză light","4 g zeamă de lămâie sare, piper","2 g ulei spray","120 g chifle brioche (≈ 1½ chifle)","25 g salată verde"],"descriere":"Un burger super crocant, inspirat de KFC, dar pregătit într-o\nvariantă mult mai light — piept de pui fraged, învelit în fulgi de\nporumb crocanți, cu maioneză light și chiflă pufoasă. Rapid,\ndelicios și perfect pentru slăbire.","pasi":"1.Condimentează puiul, trece-l prin albuș și fulgi de porumb\ncondimentați.\n2. Pulverizează ulei și gătește:\n3.Air fryer: 190°C, 15–18 min\n4.Cuptor: 200°C, 20–25 min\n5.Amestecă maioneza cu lămâie și piper. Prăjește chiflele.\n6.Asamblează: chiflă, maioneză, salată, pui crocant, capac.","sfaturi":"Poți adăuga 1-2 felii de roșii și 1 felie de castravete murat\npentru un plus de gust și volum.\nPentru un sos mai aromat, amestecă maioneza cu usturoi\ngranulat sau ierburi italiene.","alergeni":"ouă (din crustă), gluten (din chiflă), lactoză (posibil din maioneză), porumb","variante":"Pentru o variantă fără gluten, folosește chifle fără gluten sau înlocuiește-le cu frunze de salată tip wrap. Pentru o variantă fără lactoză, alege maioneză vegetală fără lactoză.","macro":{"calorii_macro":"342.5","proteine":"26.9 g","carbohidrati":"34.4 g","fibre":"3.3 g","grasimi":"4.3 g","grasimi_saturate":"1 g","greutate_portie":"185 g"}},{"id":"internationale-94","titlu":"Mac & Cheese cu Pui, Miere și Usturoi","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":94,"portii":"2","timp_minute":35,"calorii":316,"ingrediente":["Pui + paste","170 g piept de pui","1 g ulei de măsline","1 g sare","1 g pudră de ceapă","1 g pudră de usturoi","1 g boia afumată","85 g lapte evaporat 1.5%","20 g cremă de brânză light","1 g pudră de supă de pui","25 g cașcaval light ras","80 g paste integrale","Sos","10 g miere","4 g sos de soia","2 g oțet / zeamă de lămâie","2 g usturoi ras chilli / ghimbir (opțional)"],"descriere":"Un Mac & Cheese reinventat într-o variantă proteică, mai light și\nincredibil de aromată — pui fraged, sos cremos de brânză și o\nglazură dulce-sărată de miere și usturoi. Perfect pentru o cină\nrapidă și super gustoasă.","pasi":"1.Condimentează puiul cu sare, boia, usturoi și ceapă pudră,\napoi prăjește-l în puțin ulei până devine auriu.\n2.Fierbe pastele, scurge-le, apoi amestecă-le cu un sos format\ndin lapte evaporat, cremă de brânză, cașcaval și supă de\npui, încălzit la foc mic.\n3.Separat, gătește usturoiul, adaugă sosul de soia, mierea,\napa, fulgii de chilli și amidonul; fierbe până se îngroașă.","sfaturi":"4.Glazurează puiul în sos și servește-l peste mac & cheese\nPresară pătrunjel verde deasupra pentru decor.\nPoți adăuga broccoli fiert sau dovlecel tras la tigaie pentru\nmai mult volum.","alergeni":"gluten (din paste), lactoză (din brânză și lapte), soia (din sosul de soia)","variante":"Pentru o variantă fără gluten, folosește paste din orez sau linte și asigură-te că pudra de supă este fără gluten. Pentru o variantă fără lactoză, folosește cremă de brânză, lapte și cașcaval fără lactoză sau variante vegetale.","macro":{"calorii_macro":"316","proteine":"27.5 g","carbohidrati":"33 g","fibre":"2.4 g","grasimi":"4.8 g","grasimi_saturate":"1.8 g","greutate_portie":"200 g"}},{"id":"internationale-95","titlu":"Fâsii de Pui Crocante cu Sos de Miere si Usturoi","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":95,"portii":"2","timp_minute":35,"calorii":299,"ingrediente":["Pui & crustă","210 g piept de pui","1 g sare","1 g boia afumată","1 g pudră de usturoi","1 g piper boia iute","60 g făină albă","30 g amidon de porumb","75 g apă minerală carbogazoasă","Sos","12 g miere","5 g sos de soia","2 g oțet / zeamă de lămâie","2 g usturoi ras chilli / ghimbir (opțional)"],"descriere":"Fâșii de pui super crocante la exterior și fragede în interior,\nglazurate cu un sos dulce-sărat de miere și usturoi — o rețetă\nrapidă, aromată și mult mai light decât varianta clasică.","pasi":"1.Taie pieptul de pui în fâșii subțiri. Pregătește 3 boluri: făină\ncu condimente, amidon, și apă minerală. Treci fâșiile prin\nfăină, apă, apoi amidon. Gătește-le în tigaie cu puțin ulei\nsau la cuptor/air fryer 15–20 min la 200°C până devin\ncrocante.\n2.Pentru sos: călește usturoiul și ghimbirul, adaugă sosul de soia,\napa și mierea, apoi încorporează amidonul dizolvat și fierbe\npână devine gros și lipicios.","sfaturi":"","alergeni":"gluten (din făină), soia (din sosul de soia)","variante":"Pentru o variantă fără gluten, folosește făină de orez și amidon de porumb și alege un sos de soia fără gluten (tamari).","macro":{"calorii_macro":"299","proteine":"25.1 g","carbohidrati":"39.8 g","fibre":"0 g","grasimi":"1.1 g","grasimi_saturate":"0.2 g","greutate_portie":"200 g"}},{"id":"internationale-96","titlu":"Bol Proteic cu Pulpă de Vită, Cartof Dulce și Legume","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":96,"portii":"1","timp_minute":30,"calorii":358,"ingrediente":["145 g pulpă de vită tocată","120 g cartof dulce","60 g morcov","70 g broccoli","5 g ulei de măsline (1 linguriță) boia afumată, usturoi pudră, sare, piper, rozmarin"],"descriere":"Un bol hrănitor, echilibrat și bogat în proteine, unde carnea\nslabă de vită se combină cu cartoful dulce aromat și legumele\ngătite ușor — perfect pentru un prânz sănătos și sățios.","pasi":"1.Carnea de vită se gătește la tigaie cu condimente, fără ulei,\npână se rumenește ușor.\n2.Cartoful dulce se coace cubulețe la cuptor (15 min la 180°C)\ncu rozmarin.\n3.Morcovii baby și broccoli se fierb la abur sau se trag rapid\nîntr-o tigaie cu apă.\n4.Se pun toate într-un bol, se adaugă uleiul de măsline crud și\ncondimente după gust.","sfaturi":"Poți adăuga 1 lingură de iaurt grecesc deasupra pentru un\nplus de cremozitate și proteine.\nServește cu o salată de frunze verzi cu zeamă de lămâie\npentru mai multe fibre și volum.","alergeni":"– (nu conține alergeni majori în forma de bază)","variante":"Pentru o variantă vegetariană, înlocuiește carnea de vită cu 150 g linte fiartă sau tofu afumat pentru un aport proteic similar.","macro":{"calorii_macro":"357.3","proteine":"36.5 g","carbohidrati":"29.8 g","fibre":"5.3 g","grasimi":"6.6 g","grasimi_saturate":"1.5 g","greutate_portie":"400 g"}},{"id":"internationale-97","titlu":"Bol cu Piept de Pui, Cartof Dulce si Legume Colorate","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":97,"portii":"2","timp_minute":30,"calorii":204,"ingrediente":["160 g piept de pui","125 g cartof dulce","60 g broccoli","50 g ardei kapia","10 g ulei de măsline sare, cimbru, boia dulce, usturoi pudră"],"descriere":"Un bol echilibrat, colorat și plin de nutrienți, unde pieptul de pui\nfraged se combină cu cartoful dulce copt și legumele sotate\nușor — o masă sănătoasă, rapidă și foarte sățioasă.","pasi":"1.Pieptul de pui se taie cuburi/fâșii și se gătește la tigaie cu\ncondimente, cu o lingurita ulei.\n2.Cartoful dulce se coace cubulețe în cuptor (180°C, 15 min).\n3.Broccoli și ardeiul kapia se sotează ușor cu un strop de apă.\n4.Se adună totul într-un bol, se adaugă uleiul crud (1 lingurita) și\nse asezonează.","sfaturi":"Adaugă câteva frunze de rucola sau spanac crud pentru un\nplus de vitamine și antioxidanți.\nServește cu o linguriță de iaurt grecesc light deasupra\npentru un contrast răcoritor și cremos.","alergeni":"– (nu conține alergeni majori în forma de bază)","variante":"Pentru o variantă vegetariană, înlocuiește pieptul de pui cu 150 g tofu marinat sau năut copt. Pentru o variantă low-carb, înlocuiește cartoful dulce cu dovlecel sau conopidă coaptă (~130 g).","macro":{"calorii_macro":"203.8","proteine":"18.3 g","carbohidrati":"14 g","fibre":"1.9 g","grasimi":"5.8 g","grasimi_saturate":"1 g","greutate_portie":"205 g"}},{"id":"internationale-98","titlu":"Bol cu Piept de Pui cu Dressing de Iaurt și Muștar","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":98,"portii":"1","timp_minute":30,"calorii":279,"ingrediente":["95 g piept de pui","115 g cartofi albi","50 g salată verde","40 g castraveți","50 g roșii cherry","5 g ulei de măsline","35 g iaurt 2%","5 g muștar clasic","5 g zeamă de lămâie"],"descriere":"Un bol fresh, proteic și foarte echilibrat, unde pieptul de pui la\ngrătar se combină cu cartofii fierți și legumele crocante,\ncompletat de un dressing cremos din iaurt și muștar — perfect\npentru prânz sau cină.","pasi":"1.Fierbe cartofii 20 minute și taie-i cuburi.\n2.Găteste pieptul de pui la gratar 4–5 minute pe fiecare\nparte și feliază-l.\n3.Spală și taie legumele.\n4.Amestecă iaurtul cu muștarul, zeama de lămâie și uleiul.\n5.Montează în bol toate ingredientele și toarnă dressingul","sfaturi":"deasupra.\nPoți adăuga 1 lingură de semințe de dovleac sau floarea-\nsoarelui pentru un plus de acizi grași sănătoși.\nPentru un gust mai intens, adaugă 1 cățel de usturoi ras în\ndressing.","alergeni":"lactoză (din iaurt), muștar","variante":"Pentru o variantă fără lactoză, folosește iaurt vegetal sau fără lactoză. Pentru o variantă fără muștar, înlocuiește-l cu 1 linguriță de pastă de susan (tahini) sau 1 linguriță de oțet balsamic pentru aciditate.","macro":{"calorii_macro":"278.8","proteine":"25.3 g","carbohidrati":"23.1 g","fibre":"2.2 g","grasimi":"7 g","grasimi_saturate":"1.2 g","greutate_portie":"385 g"}},{"id":"internationale-99","titlu":"Bol cu Piept de Curcan cu Dressing de Iaurt și Usturoi","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":99,"portii":"2","timp_minute":45,"calorii":249,"ingrediente":["120 g piept de curcan","60 g orez brun","60 g morcov","60 g dovlecel","35 g salată verde","6 g ulei de măsline","50 g iaurt 2%","3 g usturoi ras sare, piper, lămâie"],"descriere":"Un bol echilibrat, proteic și foarte aromat, unde pieptul de\ncurcan la grătar se combină perfect cu orezul brun, legumele\nsotate și un dressing cremos de iaurt cu usturoi — ideal pentru o\nmasă sănătoasă și sățioasă.","pasi":"1.Fierbe orezul 30–35 minute și lasă-l să se răcească.\n2.Gătește curcanul la tigaie sau grill 5–6 minute pe parte.\n3.Taie dovlecelul și morcovul cuburi și sotează-le 3–4 minute.\n4.Amestecă iaurtul cu usturoi, sare și lămâie.\n5.Asamblează bolul cu toate ingredientele și toarnă dressingul\ndeasupra.","sfaturi":"Adaugă 1 linguriță de semințe de susan pentru un plus de\nacizi grași sănătoși și textură.\nPoți include câteva felii de avocado pentru un aport mai\nmare de grăsimi bune.","alergeni":"lactoză (din iaurt)","variante":"Pentru o variantă fără lactoză, folosește iaurt vegetal sau iaurt fără lactoză. Pentru o opțiune fără cereale, înlocuiește orezul brun cu 50 g conopidă rasă și gătită.","macro":{"calorii_macro":"248.9","proteine":"22.7 g","carbohidrati":"28.8 g","fibre":"2.7 g","grasimi":"3.6 g","grasimi_saturate":"0.6 g","greutate_portie":"198 g"}},{"id":"internationale-100","titlu":"Bol cu Vită cu Dressing de Oțet Balsamic","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":100,"portii":"2","timp_minute":30,"calorii":182,"ingrediente":["125 g mușchi de vită","125 g cartofi dulci","60 g ardei kapia","60 g salată verde","15 g ceapă verde","6 g ulei de măsline","6 g oțet balsamic sare, piper"],"descriere":"Un bol fresh, colorat și foarte aromat, unde mușchiul de vită\nfraged se combină cu cartoful dulce copt, legume proaspete și\nun dressing simplu din oțet balsamic — perfect pentru o masă\nechilibrată și rapidă.","pasi":"1.Coace cartofii dulci în cuptor 20–25 minute și taie-i cuburi.\n2.Frige mușchiul de vită 4–5 minute pe parte și taie-l felii.\n3.Taie ardeiul și ceapă verde.\n4.Amestecă uleiul cu oțetul și condimentele.","sfaturi":"5.Așază totul în bol și adaugă dressingul.\nPoți adăuga 1 lingură de semințe de dovleac sau câteva\nnuci pentru un plus de grăsimi sănătoase.\nPentru un gust mai intens, adaugă 1 linguriță de muștar Dijon\nîn dressing.","alergeni":"– (nu conține alergeni majori în forma de bază)","variante":"Pentru o variantă vegetariană, înlocuiește mușchiul de vită cu 100 g tofu afumat sau 150 g năut copt. Pentru o opțiune săracă în carbohidrați, înlocuiește cartofii dulci cu 100 g conopidă sau dovlecel copt.","macro":{"calorii_macro":"181.4","proteine":"14.5 g","carbohidrati":"15.6 g","fibre":"2.5 g","grasimi":"6.2 g","grasimi_saturate":"1.3 g","greutate_portie":"199 g"}},{"id":"internationale-101","titlu":"Bol cu Creveți cu Dressing de Lămâie și Pătrunjel","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":101,"portii":"2","timp_minute":25,"calorii":204,"ingrediente":["150 g creveți decorticați","60 g orez basmati","60 g dovlecel","60 g roșii cherry","40 g salată verde","6 g ulei de măsline","6 g pătrunjel verde","12 g zeamă de lămâie sare, piper"],"descriere":"Un bol fresh, ușor și bogat în proteine, unde creveții rumeniți\nrapid se combină perfect cu orezul basmati, legumele crocante\nși un dressing revigorant de lămâie și pătrunjel — ideal pentru o\nmasă rapidă și sănătoasă.","pasi":"1.Fierbe orezul conform instructiunilor si lasă-l la racit.\n2.Gătește crevetii 2–3 minute în tigaie antiaderentă cu puțină\nsare.\n3.Taie dovlecelul și roșiile.\n4.Amestecă uleiul cu lămâie, pătrunjel, sare și piper.","sfaturi":"5.Pune toate ingredientele în bol și adaugă dressingul.\nCreveți suculenți, nu cauciucați--Nu-i găti mai mult de 2–3\nminute! Când devin roz și ușor curbati în formă de „C”, sunt\ngata. Dacă se curbează prea tare (formă de „O”), s-au\ngătit prea mult.","alergeni":"crustacee (creveți)","variante":"Pentru o variantă fără crustacee, înlocuiește creveții cu 120 g piept de pui sau 100 g tofu afumat. Pentru un plus de fibre și minerale, folosește orez brun în loc de basmati.","macro":{"calorii_macro":"203.9","proteine":"16.5 g","carbohidrati":"25 g","fibre":"0.8 g","grasimi":"3.6 g","grasimi_saturate":"0.6 g","greutate_portie":"196 g"}},{"id":"internationale-102","titlu":"Bol cu Carne Tocată de Vită cu Dressing de Iaurt și Muștar","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":102,"portii":"1","timp_minute":35,"calorii":326,"ingrediente":["85 g carne tocată de vită","125 g cartof alb","50 g salată verde","50 g roșii cherry","50 g castravete","5 g ulei de măsline","30 g iaurt grecesc 2%","5 g muștar clasic","5 g zeamă de lămâie"],"descriere":"Un bol proteic, sățios și plin de prospețime, unde carnea tocată\nde vită se combină cu legume crocante, cartofi fierți și un\ndressing cremos din iaurt și muștar — o masă echilibrată și\nrapidă.","pasi":"1.Fierbe cartofii 20–25 minute, apoi taie-i cuburi.\n2.Gătește carnea tocată în tigaie antiaderentă 5–6 minute,\nfără adaos de grăsime.\n3.Pregatește dressingul: amestecă iaurtul, muștarul, lămâia și\nuleiul.\n4.Într-un bol, combină salata, legumele, cartofii și carnea.","sfaturi":"5.Toarnă dressingul deasupra.\nFolosește o tigaie încinsă și rumenește carnea tocată fără\nadaos de grăsime.\nDacă e prea uscată, adaugă 1 lingură de apă caldă și\nacoperă 1 minut pentru a păstra suculența.","alergeni":"lactoză (din iaurt), muștar","variante":"Pentru o variantă fără lactoză, folosește iaurt vegetal sau iaurt fără lactoză. Pentru o variantă fără muștar, înlocuiește-l cu 1 linguriță de pastă tahini sau 1 linguriță de oțet balsamic.","macro":{"calorii_macro":"325.6","proteine":"21.8 g","carbohidrati":"24.6 g","fibre":"2.3 g","grasimi":"14.5 g","grasimi_saturate":"4.6 g","greutate_portie":"400 g"}},{"id":"internationale-103","titlu":"Bol cu Carne Tocată de Pasăre cu Dressing de Roșii Coapte","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":103,"portii":"2","timp_minute":45,"calorii":202,"ingrediente":["105 g carne tocată de pui","50 g orez brun","80 g zucchini","50 g morcov","5 g ulei de măsline","105 g roșii","3 g usturoi","1 g busuioc uscat"],"descriere":"Un bol aromat și fresh, unde carnea tocată de pasăre se\ncombină cu orezul integral, legumele sotate și un dressing intens\ndin roșii coapte — o alegere sănătoasă, echilibrată și plină de\nsavoare.","pasi":"1.Fierbe orezul integral conform instrucțiunilor (aprox. 30–35\nmin).\n2.Coace roșiile și usturoiul 20 min la 180°C, apoi pasează-le și\nadaugă ulei și busuioc.\n3.Gătește carnea tocată în tigaie antiaderenta 5–6 min.\n4.Sotează zucchini și morcovul 4–5 min.\n5.Așează ingredientele într-un bol și adaugă sosul de roșii","sfaturi":"coapte.\nAdaugă 1 lingură de parmezan ras peste sos pentru un plus\nde gust și proteine.\nServește cu frunze proaspete de busuioc sau pătrunjel pentru\nun plus de prospețime.","alergeni":"– (nu conține alergeni majori în forma de bază)","variante":"Pentru o variantă fără cereale, înlocuiește orezul cu 50 g conopidă rasă. Pentru o opțiune vegetariană, înlocuiește carnea cu 100 g năut fiert sau tofu mărunțit.","macro":{"calorii_macro":"201.9","proteine":"12.2 g","carbohidrati":"25.2 g","fibre":"2.6 g","grasimi":"4.7 g","grasimi_saturate":"0.9 g","greutate_portie":"200 g"}},{"id":"internationale-104","titlu":"Bol cu Ouă și Branză cu Dressing de Iaurt și Mărar","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":104,"portii":"2","timp_minute":35,"calorii":196,"ingrediente":["120 g ouă crude (2 buc)","50 g brânză de vaci 5%","105 g cartof dulce","50 g salată verde","40 g ridichii","5 g ulei de măsline","30 g iaurt grecesc 2%","2 g mărar verde"],"descriere":"Un bol fresh, sățios și foarte ușor de preparat, cu ouă fierte,\nlegume crocante, cartof dulce copt și un dressing aromat din\niaurt și mărar — perfect pentru un prânz rapid și sănătos.","pasi":"1.Fierbe ouăle 10 min, apoi taie-le cubulețe.\n2.Coace cartoful dulce 20–25 min, taie-l cuburi.\n3.Pregatește dressingul: amestecă iaurtul cu mărarul și uleiul.\n4.Aranjează legumele, ouăle, cartoful și brânza în bol.\n5.Toarnă dressingul deasupra.","sfaturi":"Poți adăuga 1 linguriță de semințe de floarea-soarelui sau\ndovleac pentru un plus de grăsimi sănătoase.\nServește cu o felie de pâine integrală pentru un plus de fibre\nși sațietate.","alergeni":"ouă, lactoză (din brânză și iaurt)","variante":"Pentru o variantă fără lactoză, folosește iaurt și brânză vegetală sau fără lactoză. Pentru o opțiune fără ouă, înlocuiește ouăle cu 100 g tofu moale sau 100 g năut fiert.","macro":{"calorii_macro":"195.6","proteine":"13.3 g","carbohidrati":"13.1 g","fibre":"2.1 g","grasimi":"9.4 g","grasimi_saturate":"2.6 g","greutate_portie":"200 g"}},{"id":"internationale-105","titlu":"Bol cu Halloumi și Năut cu Dressing cu Oțet Balsamic","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":105,"portii":"2","timp_minute":20,"calorii":230,"ingrediente":["80 g halloumi light","105 g năut fiert","65 g morcov","65 g ardei gras","65 g salată verde","6 g ulei de măsline","12 g oțet balsamic","7 g miere"],"descriere":"Un bol vegetarian sățios și aromat, unde halloumi-ul rumenit se\ncombină cu năutul fiert și legumele fresh, completat de un\ndressing dulce-acrișor din oțet balsamic și miere — perfect\npentru un prânz rapid și nutritiv.","pasi":"1.Prăjește halloumi în tigaie fără ulei, 2–3 min pe fiecare\nparte.\n2.Taie legumele și amestecăle cu năutul.\n3.Pregatește dressingul: combină otetul, uleiul și mierea.","sfaturi":"4.Adaugă halloumi peste salată și toarnă dressingul.\nPoți adăuga 1 lingură de semințe de dovleac sau floarea-\nsoarelui pentru un plus de grăsimi sănătoase și crocant.\nPentru un gust mai intens, adaugă câteva frunze de busuioc\nsau mentă proaspătă.","alergeni":"lactoză (din halloumi), leguminoase (năut)","variante":"Pentru o variantă fără lactoză, folosește brânză vegetală sau tofu afumat în loc de halloumi. Pentru un dressing mai light, înlocuiește mierea cu câteva picături de îndulcitor lichid.","macro":{"calorii_macro":"229.9","proteine":"10.95 g","carbohidrati":"9.4 g","fibre":"1.55 g","grasimi":"9.85 g","grasimi_saturate":"4.9 g","greutate_portie":"200 g"}},{"id":"internationale-106","titlu":"Orez Fajita cu Pui și Mozzarella Light","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":106,"portii":"2","timp_minute":40,"calorii":225,"ingrediente":["155 g piept de pui","45 g orez alb crud","40 g ardei gras","40 g dovlecel","45 g roșie","25 g ceapă","20 g mozzarella light","5 g ulei de măsline condimente mexicane (după gust)","opțional: lime, coriandru"],"descriere":"O rețetă colorată, aromată și sățioasă, inspirată din fajitas\nmexicane — orez pufos, pui fraged marinat și legume sotate,\ntotul completat cu mozzarella light. Perfectă pentru un prânz\ndelicios și echilibrat.","pasi":"1.Fierbe orezul în apă cu puțină sare până devine pufos.\n2.Taie pieptul de pui în fâșii și marinează-l cu condimente\nmexicane și 1 lingură de ulei de măsline.\n3.Taie legumele (ardei, dovlecel, roșie, ceapă) julienne sau\ncubulețe.\n4.Într-o tigaie mare, călește legumele în 1 lingură de ulei timp\nde 5-7 minute, până se înmoaie ușor.\n5.Într-o tigaie separată, gătește pieptul de pui până devine\nrumen și bine pătruns.\n6.Amestecă totul: orezul, legumele, puiul. Presară mozzarella\ndeasupra, acoperă 1-2 minute până se topește.","sfaturi":"7.Servește cald, opțional cu lime și coriandru\nFierbe orezul în apă cu sare (raport 1:2), dar clătește-l bine\nînainte.\nDacă vrei o textură mai ușoară, poți adăuga 1 linguriță de\nzeamă de lămâie în apa de fierbere – ajută digestia și îl\nmenține alb.","alergeni":"lactoză (din mozzarella)","variante":"Pentru o variantă fără lactoză, folosește brânză vegetală sau mozzarella fără lactoză. Pentru o versiune vegetariană, înlocuiește puiul cu 300 g tofu afumat sau năut fiert.","macro":{"calorii_macro":"224.6","proteine":"20.25 g","carbohidrati":"20.1 g","fibre":"0.65 g","grasimi":"4.4 g","grasimi_saturate":"1.4 g","greutate_portie":"200 g"}},{"id":"internationale-107","titlu":"Paella Dietetică cu Fructe de Mare","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":107,"portii":"2","timp_minute":35,"calorii":136,"ingrediente":["70 g creveți decorticați","50 g calamar","50 g midii","35 g orez basmati","15 g ceapă","30 g ardei gras roșu","55 g roșie","2 g usturoi","5 g ulei de măsline","95 g supă de legume / apă șofran / turmeric, sare, piper, boia, pătrunjel"],"descriere":"O paella ușoară, aromată și bogată în proteine, perfectă pentru\ncei care iubesc fructele de mare, dar vor o variantă dietetică —\norez pufos, creveți fragezi, calamar și midii într-o combinație\nsavuroasă, cu accente mediteraneene.","pasi":"1.Încinge uleiul într-o tigaie mare și sotează ceapa și usturoiul.\n2.Adaugă ardeiul și roșia. Lasă să se înmoaie ușor.\n3.Adaugă fructele de mare (creveți, calamar, midii) și\ncondimentează după gust. Gătește 3-4 minute.\n4.Pune orezul crud, amestecă bine, apoi adaugă supa\nfierbinte cu șofran sau turmeric.\n5.Fierbe la foc mic, acoperit, până când orezul absoarbe\nlichidul (aprox. 15-18 min).\n6.La final, presară pătrunjel proaspăt și servește cu felii de\nlămâie.","sfaturi":"Poți adăuga 50 g mazăre pentru un plus de fibre și culoare.\nPentru un gust mai intens, adaugă câteva picături de zeamă\nde lămâie sau coajă rasă de lime la final.","alergeni":"crustacee (creveți, midii), moluște (calamar)","variante":"Pentru o variantă fără fructe de mare, folosește 150 g piept de pui sau 100 g tofu pentru un aport proteic similar. Pentru o opțiune fără cereale, înlocuiește orezul cu 200 g conopidă rasă.","macro":{"calorii_macro":"135.9","proteine":"14.8 g","carbohidrati":"9.2 g","fibre":"0.3 g","grasimi":"3.05 g","grasimi_saturate":"0.5 g","greutate_portie":"205 g"}},{"id":"internationale-108","titlu":"Paella Dietetică cu Pui și Creveți","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":108,"portii":"2","timp_minute":35,"calorii":128,"ingrediente":["60 g piept de pui","60 g creveți decorticați","40 g orez basmati","20 g ceapă","35 g ardei gras roșu","70 g roșie","2 g usturoi","3 g ulei de măsline","115 g supă de legume / apă șofran/turmeric, sare, piper, boia afumată, pătrunjel suc de lămâie (opțional)"],"descriere":"O paella dietetică, rapidă și aromată, care combină gustul\ndelicat al creveților cu suculența puiului — o masă ușoară,\nbogată în proteine, perfectă pentru prânz sau cină fără exces\nde calorii.","pasi":"1.Sotează ceapa și usturoiul într-o tigaie antiaderentă cu uleiul\nde măsline, până devin aurii.\n2.Adaugă puiul tăiat cuburi mici și condimentează cu sare,\npiper și boia. Gătește 5-6 minute până se rumenește.\n3.Adaugă ardeiul, roșia și orezul. Amestecă bine 1-2 minute.\n4.Toarnă supa de legume fierbinte, adaugă șofranul sau\nturmericul și lasă să fiarbă la foc mic, acoperit, timp de 15\nminute.\n5.Adaugă creveții deasupra și lasă încă 5-7 minute până când\nsunt complet gătiți și lichidul s-a absorbit.\n6.Ia de pe foc, presară pătrunjel proaspăt și servește cu felii\nde lămâie pentru un plus de prospețime","sfaturi":"Poți adăuga 50 g mazăre pentru mai multe fibre și culoare.\nAdaugă 1 lingură de vin alb în timpul gătirii pentru o aromă\nmai intensă, în stil spaniol autentic.","alergeni":"crustacee (creveți)","variante":"Pentru o variantă fără fructe de mare, înlocuiește creveții cu 100 g piept de pui suplimentar sau 100 g tofu. Pentru o variantă vegetariană, înlocuiește carnea și creveții cu 150 g năut sau linte fiartă.","macro":{"calorii_macro":"127.65","proteine":"12.85 g","carbohidrati":"10.25 g","fibre":"0.35 g","grasimi":"2 g","grasimi_saturate":"0.3 g","greutate_portie":"200 g"}},{"id":"internationale-109","titlu":"Ruladă cu Spanac, Umplută cu Brânză, Muschiuleț și Murături","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":109,"portii":"2","timp_minute":30,"calorii":282,"ingrediente":["Ruladă","95 g spanac","110 g ouă crude (≈ 2 ouă mici)","40 g parmezan ras","Umplutură","55 g brânză proaspătă light","75 g mușchiuleț afumat de curcan","20 g murături (opțional)"],"descriere":"O ruladă savuroasă, proteică și foarte ușoară, cu foaie din\nspanac și umplutură cremoasă, perfectă pentru o cină rapidă și\nsănătoasă — arată spectaculos, dar se prepară surprinzător de\nsimplu.","pasi":"1.Preîncălzește cuptorul la 180°C\n2.Amestecă spanacul tocat cu ouăle și parmezanul până obții\no compoziție omogenă.\n3.Toarnă compoziția într-o tavă mică tapetată cu hârtie de\ncopt și întinde-o uniform într-un strat subțire.\n4.Coace 12 minute la 180°C până se fixează bine.\n5.Scoate, lasă 2-3 minute să se răcească ușor, apoi răstoarnă\npe o hârtie curată sau pe un prosop umed și rulează ușor\npentru a prinde formă.\n6.Derulează și umple cu brânza, mușchiulețul și murăturile\nfeliate. Rulează din nou și presează ușor.","sfaturi":"Poți adăuga 1 lingură de iaurt în brânză pentru o textură mai\ncremoasă.\nPentru un plus de aromă, adaugă ierburi mediteraneene\n(busuioc, oregano) în aluat.","alergeni":"ouă, lactoză (din brânză și parmezan)","variante":"Pentru o variantă fără lactoză, folosește brânză vegetală sau fără lactoză și parmezan fără lactoză. Pentru o opțiune fără ouă, înlocuiește fiecare ou cu un „ou vegan” (1 lingură semințe de in măcinate + 3 linguri apă).","macro":{"calorii_macro":"281.1","proteine":"21.25 g","carbohidrati":"3.3 g","fibre":"1 g","grasimi":"15.8 g","grasimi_saturate":"7.2 g","greutate_portie":"200 g"}},{"id":"internationale-110","titlu":"Salată Caldă cu Piept de Pui, Porumb și Sos Cremos de Iaurt","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Feluri Principale","pagina":110,"portii":"2","timp_minute":20,"calorii":191,"ingrediente":["160 g piept de pui crud","2 g condimente","7 g zeamă de lime","45 g varză albă","115 g porumb fiert, scurs","2 g unt","15 g ceapă roșie","35 g iaurt grecesc","7 g maioneză light","9 g telemea light","5 g verdeață"],"descriere":"O salată caldă extrem de gustoasă, sățioasă și ușor cremoasă,\nperfectă pentru cine vrei ceva rapid, sănătos și plin de arome.","pasi":"1.Gătește pieptul de pui condimentat într-o tigaie, lasă-l 2–3\nmin, apoi taie-l cuburi.\n2.În aceeași tigaie, rumenește porumbul cu unt până devine\nușor caramelizat.\n3.Amestecă iaurtul cu maioneză, condimente și zeamă de lime\npentru sos.\n4.Într-un bol, combină varza, porumbul, ceapa, puiul,\nverdețurile, brânza și sosul.\n5.Servește alături de brânză fărâmițată și sosul. Amestecă totul\ncu grijă.\n6.Servește cu o felie de lime/lămâie alături.","sfaturi":"Poți adăuga 1 lingură de semințe de dovleac sau floarea-\nsoarelui pentru un plus de grăsimi sănătoase.\nServește cu o felie de lipie integrală sau cu tortilla pentru un\nplus de carbohidrați complecși.","alergeni":"lactoză (din iaurt, brânză și maioneză), muștar (din maioneză)","variante":"Pentru o variantă fără lactoză, folosește iaurt și brânză vegetală sau fără lactoză. Pentru o opțiune fără muștar, folosește sos de iaurt simplu sau adaugă 1 linguriță de tahini în locul maionezei.","macro":{"calorii_macro":"190.1","proteine":"20.7 g","carbohidrati":"10 g","fibre":"2.45 g","grasimi":"3.65 g","grasimi_saturate":"1.1 g","greutate_portie":"200 g"}},{"id":"internationale-112","titlu":"Pâine Proteică cu Ovăz și Brânză","carte":"Rețete internaționale","carte_scurt":"Internațional","categorie":"Pâine și Preparate","pagina":112,"portii":"2","timp_minute":60,"calorii":353,"ingrediente":["130 g ovăz","40 g ou  (≈ ¾ ou)","50 g albuș (≈ 1½ albușuri)","185 g brânză de vacă slabă","4 g praf de copt","opțional: sare, semințe, ierburi aromatice"],"descriere":"O pâine proteică simplă, sățioasă și extrem de gustoasă —\nideală pentru mic dejunuri rapide sau gustări sănătoase, fără\nfăină și fără efort.","pasi":"1.Amestecă toate ingredientele într-un bol mare până obții o\ncompoziție densă.\n2.Toarnă în tavă de chec tapetată cu hârtie de copt.\n3.Coace la 165 C timp de 55-60 min până trece testul\nscobitorii.","sfaturi":"4.Lasă la răcit complet înainte de a felia.\nPoți adăuga și semințe (in, susan, floarea soarelui)\nSe păs
