nză, iaurt)","variante":"fără lactate: folosește brânză vegetală light (ex. pe bază de soia) și lapte vegetal.","macro":{"calorii_macro":"205.3","proteine":"14.9 g","carbohidrati":"27.4 g","fibre":"4 g","grasimi":"2.4 g","grasimi_saturate":"0.5 g","greutate_portie":"130 g"}},{"id":"sarbatori-347","titlu":"Colaci de Casă","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":347,"portii":"6","timp_minute":110,"calorii":489,"ingrediente":["685 g făină integrală","340 ml lapte degresat călduț","24 g drojdie proaspătă","20 g îndulcitor","60 g ou întreg (1 ou)","30 g albuș (1 albuș)","29 ml ulei de măsline","10 g sare","Pentru uns (pentru toți cei 6 colaci)","20 g gălbenuș (1 gălbenuș)","30 ml lapte degresat 1,5%"],"descriere":"Colaci pufoși, aromați și ușor de făcut, o variantă light față de\nrețeta clasică, perfecte pentru sărbători sau mic dejun.","pasi":"1.Amestecă făina cu sarea într-un bol mare.\n2.Dizolvă drojdia în laptele cald împreună cu îndulcitorul (sau\nmierea) și las-o 10 minute să se activeze.\n3.Adaugă oul întreg și albușul peste făină, apoi toarnă treptat\nlaptele cu drojdia.\n4.Frământă 8–10 minute, adăugând treptat uleiul până obții un\naluat elastic.\n5.Acoperă și lasă aluatul la dospit 60–75 minute.\n6.Împarte aluatul în 6 bucăți și modelează colaci (simpli, împletiți\nsau rotunzi).\n7.Așază-i în tavă, unge-i cu gălbenușul amestecat cu lapte.\n8.Coace la 180°C timp de 20–25 minute, până devin aurii.","sfaturi":"Poți presăra semințe de susan, mac sau in deasupra pentru un\nplus de fibre.\nPentru o textură mai pufoasă, folosește jumătate făină albă +\njumătate integrală.\nSe păstrează bine 2–3 zile în pungă de hârtie și pot fi congelați.","alergeni":"gluten, ou, lactoză","variante":"laptele se poate înlocui cu lapte de migdale sau ovăz, iar uleiul cu ulei de cocos dezodorizat.","macro":{"calorii_macro":"488.9","proteine":"19 g","carbohidrati":"84.9 g","fibre":"13.7 g","grasimi":"8.6 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-348","titlu":"Covrigi","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":348,"portii":"8","timp_minute":60,"calorii":173,"ingrediente":["250 g făină albă","150 g făină integrală","15 g drojdie proaspătă","200 ml apă caldă","5 g îndulcitor","8 g sare","5 g Semințe de susan, mac sau sare grunjoasă – pentru decor"],"descriere":"Covrigi de casă aromați, ușor crocanți la exterior și moi în interior\n— o variantă simplă și light, perfectă pentru gustări.","pasi":"1.Dizolvă drojdia și îndulcitorul în apa caldă și lasă 10 minute să\nse activeze.\n2.Amestecă făina albă, făina integrală și sarea într-un bol.\n3.Adaugă lichidul treptat și frământă 6–8 minute până obții un\naluat elastic.\n4.Lasă-l la dospit 30–40 minute.\n5.Împarte aluatul în 8 bucăți și modelează covrigii în forma dorită.\n6.Așază-i în tavă, umezește-i ușor cu apă și presară semințe.\n7.Coace la 200°C timp de 12–15 minute, până devin aurii.","sfaturi":"Pentru un plus de aromă, adaugă în aluat semințe de in sau\nchimen.\nPoți unge covrigii fierți înainte de copt cu un gălbenuș bătut\npentru o culoare mai intensă.\nSe păstrează bine 1–2 zile în pungă de hârtie, iar congelați\nrezistă până la 1 lună.","alergeni":"gluten, (opțional ou dacă se folosește pentru uns)","variante":"făina integrală poate fi înlocuită cu făină de secară sau ovăz pentru un plus de fibre.","macro":{"calorii_macro":"172.5","proteine":"5.6 g","carbohidrati":"36.3 g","fibre":"2.3 g","grasimi":"0.2 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-349","titlu":"Langoși","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":349,"portii":"8","timp_minute":75,"calorii":220,"ingrediente":["400 g făină integrală","200 ml lapte degresat călduț","20 g drojdie proaspătă","5 g îndulcitor","2 g sare","15 ml ulei de măsline (în aluat)","20 ml ulei de măsline (pentru uns la coacere)"],"descriere":"Langoși rumeni, moi și ușori, preparați cu o cantitate redusă de ulei,\npentru o variantă mult mai light a rețetei tradiționale.","pasi":"1.Dizolvă drojdia și îndulcitorul (sau zahărul) în laptele cald și lasă\n10 minute să se activeze.\n2.Amestecă făina cu sarea, apoi adaugă laptele cu drojdia și\nfrământă 6–8 minute.\n3.Încorporează 15 ml ulei în aluat și lasă-l la dospit 40–50 minute.\n4.Împarte aluatul în 8 bucăți și întinde fiecare bucată rotund și\nsubțire.\n5.Unge o tigaie antiaderentă cu very puțin ulei (pensulat) și\nprăjește fiecare langoș 1–2 minute pe fiecare parte, la foc\nmediu.\n6.Opțional, unge deasupra cu puțin ulei după coacere pentru\naspect și gust.","sfaturi":"Pentru un gust autentic, unge-i cu iaurt grecesc light + usturoi.\nPoți adăuga brânză slabă rasă sau legume sotate ca topping.\nDacă vrei o variantă crocantă, coace-i la 200°C și redu timpul\ncu 2–3 min.","alergeni":"gluten, lactoză (din lapte)","variante":"laptele poate fi înlocuit cu lapte de ovăz sau migdale fără zahăr, iar făina integrală cu făină fără gluten (amestec special de panificație).","macro":{"calorii_macro":"219.8","proteine":"7.3 g","carbohidrati":"37 g","fibre":"6 g","grasimi":"5.1 g","grasimi_saturate":"0.8 g"}},{"id":"sarbatori-350","titlu":"Cornulețe Fragede cu Nucă","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":350,"portii":"8","timp_minute":65,"calorii":371,"ingrediente":["350 g făină integrală","120 g unt cu 65% grăsime","120 g iaurt grecesc 2%","30 g îndulcitor pudră (eritritol/stevia)","1 vârf de cuțit de sare","5 g praf de copt","150 g nucă măcinată","30 g îndulcitor pudră (pentru umplutură) îndulcitor pudră pentru decor"],"descriere":"Cornulețe fragede, parfumate și ușor dulci, cu umplutură de nucă și\nun aluat fin pe bază de iaurt.","pasi":"1.Amestecă făina cu sarea, praful de copt și îndulcitorul.\n2.Adaugă untul (sau combinația unt + iaurt) și amestecă până\nobții o compoziție nisipoasă.\n3.Încorporează iaurtul și frământă un aluat omogen.\n4.Lasă aluatul 10 minute la rece.\n5.Împarte aluatul în 3 bile, întinde fiecare foaie în cerc și taie în\ntriunghiuri.\n6.Umple fiecare triunghi cu nucă amestecată cu îndulcitor și\nrulează spre vârf.\n7.Coace cornulețele la 170°C timp de 12–15 minute.\n8.După răcire, tăvălește-le în îndulcitor pudră.","sfaturi":"Dacă vrei cornulețe extra fragede, lasă aluatul la frigider cel\npuțin 1 oră.\nPoți adăuga scorțișoară în umplutură pentru un plus de aromă.\nSe păstrează crocante câteva zile într-o cutie închisă ermetic.","alergeni":"gluten (făină), lactoză (iaurt, unt), nuci","variante":"înlocuiește untul cu margarină vegetală fără lactoză și iaurtul cu iaurt vegetal (soia/cocos).","macro":{"calorii_macro":"371","proteine":"9.7 g","carbohidrati":"34.5 g","fibre":"6.4 g","grasimi":"22.7 g","grasimi_saturate":"9 g"}},{"id":"sarbatori-351","titlu":"Gogoși","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":351,"portii":"10","timp_minute":75,"calorii":159,"ingrediente":["400 g făină integrală","200 ml lapte degresat călduț","30 g îndulcitor pudră (eritritol/stevia)","15 ml ulei de cocos","20 g drojdie proaspătă (sau 7 g uscată)","1 ou întreg + 1 albuș","1 vârf de cuțit de sare","1 linguriță esență de vanilie","Îndulcitor pudră – pentru decor"],"descriere":"Gogoși aerate, ușoare și fără prăjire în ulei, perfecte pentru un\ndesert rapid.","pasi":"1.Dizolvă drojdia și îndulcitorul în laptele cald și lasă 10 minute să\nse activeze.\n2.Amestecă făina cu sarea, apoi adaugă oul, albușul, esența de\nvanilie și uleiul de cocos.\n3.Toarnă laptele cu drojdia și frământă 6–8 minute, până obții un\naluat elastic.\n4.Lasă la dospit 45–60 minute.\n5.Împarte aluatul în 20 de bile egale, așază-le în tavă și lasă-le 10\nminute să crească.\n6.Coace la 180°C timp de 10–12 minute, până devin aurii.\n7.Pudrează cu îndulcitor după răcire.","sfaturi":"Poți umple gogoșile coapte cu gem fără zahăr sau cremă\nproteică light.\nSe păstrează bine 1–2 zile într-o cutie ermetică.\nPentru o aromă diferită, adaugă coajă de lămâie sau\nportocală în aluat.","alergeni":"gluten, lactoză, ou","variante":"laptele se poate înlocui cu lapte de migdale/soia, iar untul cu ulei de cocos.","macro":{"calorii_macro":"158.9","proteine":"6.9 g","carbohidrati":"29.7 g","fibre":"4.8 g","grasimi":"1.3 g","grasimi_saturate":"0.3 g"}},{"id":"sarbatori-352","titlu":"Prăjitură cu Brânză Dulce","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":352,"portii":"12","timp_minute":70,"calorii":177,"ingrediente":["Pentru blat:","250 g făină integrală","50 g îndulcitor pudră (eritritol/stevia)","60 g unt cu 65% grăsime","1 ou + 1 albuș","5 g praf de copt","1 vârf de cuțit de sare","Pentru umplutură:","600 g brânză de vaci slabă","60 g îndulcitor pudră","2 ouă întregi + 1 albuș","80 g iaurt grecesc 2%","20 g griș","1 linguriță esență de vanilie coajă rasă de lămâie – după gust"],"descriere":"O prăjitură fină, aromată și echilibrată, cu blat pufos și umplutură\ncremoasă de brânză slabă.\nBlat:","pasi":"1.Bate oul, albușul, îndulcitorul și untul până devin omogene.\n2.Adaugă făina, praful de copt și sarea și amestecă până obții un\naluat cremos.\n3.Toarnă blatul într-o tavă tapetată.\nUmplutură:\n1.Amestecă brânza de vaci cu îndulcitorul, ouăle, iaurtul, grișul,\nesența și coaja de lămâie.\n2.Toarnă compoziția peste blat în strat uniform.\nCoacere:\n1.Coace la 170°C timp de 40–45 minute, până se încheagă și\ndevine ușor aurie.\n2.Lasă la răcit complet înainte de tăiere.","sfaturi":"Poți adăuga în umplutură stafide hidratate sau fructe de\npădure.\nServește cu un sos de fructe fără zahăr pentru un plus de\nprospețime.\nMerge foarte bine și cu o linguriță de smântână light sau iaurt\ndeasupra.","alergeni":"gluten (făină, griș), ouă, lactoză (brânză, iaurt, unt)","variante":"înlocuiește grișul cu fulgi fini de ovăz pentru mai multe fibre.","macro":{"calorii_macro":"176.6","proteine":"12.7 g","carbohidrati":"16.9 g","fibre":"2.5 g","grasimi":"5.2 g","grasimi_saturate":"1.6 g"}},{"id":"sarbatori-353","titlu":"Plăcintă cu Dovleac","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":353,"portii":"8","timp_minute":55,"calorii":176,"ingrediente":["pentru toamnă sau pentru un desert rapid și sănătos.","300 g foi de plăcintă light (subțiri, fără adaos de grăsime)","1 kg dovleac plăcintar ras","40 g îndulcitor pudră (eritritol/stevia)","2 lingurițe scorțișoară","20 ml ulei de măsline (pentru uns foile)","20 g pesmet integral sare – un vârf de cuțit"],"descriere":"O plăcintă aromată, ușoară și parfumată cu scorțișoară, perfectă","pasi":"1.Călește dovleacul ras cu îndulcitorul, scorțișoara și un praf de\nsare timp de 10 minute, până se înmoaie.\n2.Unge foile de plăcintă cu puțin ulei și așază trei foi în tavă.\n3.Întinde jumătate din dovleacul călit, presară pesmet, apoi\nacoperă cu alte 2–3 foi.\n4.Repetă cu restul umpluturii și acoperă cu ultimele foi unse cu ulei.\n5.Taie plăcinta în porții și coace la 180°C timp de 25–30 minute,\npână devine aurie.","sfaturi":"Pentru un plus de aromă, adaugă esență de vanilie sau\nnucșoară în dovleac.\nSe servește caldă sau rece, simplă ori cu un strop de iaurt\ngrecesc light deasupra.\nPoate fi păstrată la frigider 2–3 zile și reîncălzită ușor la cuptor.","alergeni":"gluten (foi de plăcintă, pesmet)","variante":"foile se pot înlocui cu foi fără gluten, iar îndulcitorul cu miere (atenție la calorii).","macro":{"calorii_macro":"175.5","proteine":"1.3 g","carbohidrati":"0.05 g","fibre":"0 g","grasimi":"2.5 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-354","titlu":"Poale-n Brâu","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":354,"portii":"12","timp_minute":100,"calorii":187,"ingrediente":["Pentru aluat:","400 g făină integrală","180 ml lapte degresat călduț","20 g drojdie proaspătă (sau 7 g uscată)","20 g îndulcitor pudră (eritritol/stevia)","1 ou întreg + 1 albuș","30 ml ulei de măsline sau floarea soarelui","5 g sare","Pentru umplutură:","350 g brânză de vaci slabă","30 g îndulcitor pudră (sau după gust)","1 ou întreg","1 linguriță coajă de lămâie","20 g stafide hidratate"],"descriere":"O versiune mai ușoară și modernizată a celebrelor poale-n brâu\nmoldovenești, cu aluat pufos și umplutură cremoasă din brânză\nslabă.","pasi":"1.Amestecă făina integrală cu sarea într-un bol încăpător.\n2.Dizolvă drojdia în laptele cald împreună cu îndulcitorul și lasă\n5–10 minute până devine spumoasă.\n3.Bate oul întreg cu albușul și adaugă peste făină.\n4.Toarnă amestecul cu drojdie și începe frământarea.\n5.Adaugă treptat uleiul și continuă frământarea până obții un\naluat elastic și omogen.\n6.Acoperă bolul și lasă aluatul la dospit 45–60 minute, într-un loc\ncald.\n7.Pentru umplutură, amestecă brânza de vaci cu îndulcitorul, oul,\ncoaja de lămâie și stafidele (opțional).\n8.După dospire, împarte aluatul în 12 bucăți egale și întinde-le în\nforme rotunde.\n9.Pune câte o lingură generoasă de umplutură în centru și\nîmpăturește colțurile către mijloc, sigilând bine.\n10.Așază plăcintele într-o tavă tapetată cu hârtie de copt și mai\nlasă-le la crescut 15 minute.\n11.Coace la 180°C timp de 20–25 minute, până se rumenesc\nuniform.","sfaturi":"Pentru o aromă mai intensă, poți adăuga esență de vanilie în\numplutură.\nSe potrivesc de minune servite cu iaurt grecesc light sau fructe\nproaspete.\nPot fi păstrate la frigider 2 zile și reîncălzite ușor la cuptor.","alergeni":"gluten, lactoză, ou","variante":"brânza de vaci poate fi înlocuită cu brânză cottage slabă sau, pentru o variantă fără lactate, cu tofu cremos + iaurt vegetal.","macro":{"calorii_macro":"186.3","proteine":"10.2 g","carbohidrati":"25.6 g","fibre":"4 g","grasimi":"4.1 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-355","titlu":"Sarailie","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Paște","pagina":355,"portii":"12","timp_minute":55,"calorii":234,"ingrediente":["Pentru prăjitură:","300 g foi de plăcintă light (subțiri, fără adaos de grăsime)","200 g nucă măcinată","60 g ulei de cocos dezodorizat","Pentru sirop:","150 ml apă","30 g miere","30 g îndulcitor lichid (eritritol/stevia)","1 linguriță esență de vanilie","1 felie lămâie"],"descriere":"Un desert aromat, crocant la exterior și suculent în interior,\nreinterpretat într-o variantă mai ușoară.\nPrăjitura:","pasi":"1.Amestecă nuca măcinată cu 20–30 g îndulcitor, dacă dorești\nmai multă dulceață.\n2.Întinde foile de plăcintă, unge-le cu uleiul de cocos topit și\npresară un strat de nucă.\n3.Rulează foile strâns și taie în bucăți de mărimea dorită.\n4.Așază-le într-o tavă și unge-le ușor deasupra cu ulei de cocos.\n5.Coace la 180°C timp de 20–25 minute, până devin aurii.\nSirop:\n1.Fierbe apa cu mierea, îndulcitorul lichid, vanilia și felia de\nlămâie 3–4 minute.\n2.Lasă siropul să se răcorească puțin și toarnă-l peste sarailia\nscoasă din cuptor.\n3.Lasă desertul să absoarbă siropul 2–3 ore înainte de servire.","sfaturi":"Adaugă scorțișoară sau cardamom în nuca măcinată pentru o\naromă orientală.\nSe servește rece, după ce a stat la frigider câteva ore.\nPoți presăra deasupra fistic mărunțit pentru un aspect mai\nelegant.","alergeni":"gluten (foi de plăcintă), nuci, miere","variante":"înlocuiește nuca cu alune sau migdale pentru un profil nutrițional diferit.","macro":{"calorii_macro":"234","proteine":"2.5 g","carbohidrati":"4.2 g","fibre":"1 g","grasimi":"10.8 g","grasimi_saturate":"6 g"}},{"id":"sarbatori-357","titlu":"Colivă","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Evenimente Private (Pomeni, Zile de Naștere)","pagina":357,"portii":"10","timp_minute":65,"calorii":269,"ingrediente":["300 g grâu boabe decorticat","1,5 L apă","40 g miere","80 g curmale fără sâmburi, tocate mărunt","150 g miez de nucă măcinat","50 g nucă pentru decor","1 linguriță esență de vanilie","1 linguriță coajă de lămâie","½ linguriță scorțișoară"],"descriere":"","pasi":"Un desert aromat, crocant la exterior și suculent în interior,\nreinterpretat într-o variantă mai ușoară.\nSpală grâul și fierbe-l 45–60 min la foc mic în 1,5 L apă.\nCât este fierbinte, adaugă mierea, curmalele tocate, vanilia,\ncoaja de lămâie și scorțișoara. Amestecă până se topesc\ncurmalele în compoziție.\nÎncorporează 150 g nucă măcinată.\nPune coliva în vas, nivelează și presară nuca decor.\nLas-o la rece 2–3 ore să se lege perfect.","sfaturi":"Pentru o aromă mai intensă, poți adăuga 1 lingură de rom\n(esență).\nDacă preferi coliva mai densă, fierbe grâul cu puțină apă în\nminus.\nPentru digestie mai ușoară, înlocuiește 50 g nucă cu migdale\nmărunțite.","alergeni":"gluten (grâu), nuci (nucă măcinată), miere (nu se recomandă copiilor <1 an; atenție la intoleranțe)","variante":"pentru o versiune fără gluten, poți înlocui grâul cu orez integral sau mei decorticat, în aceeași cantitate (300 g), obținând o textură similară.","macro":{"calorii_macro":"268.4","proteine":"3 g","carbohidrati":"5.84 g","fibre":"1.2 g","grasimi":"13 g","grasimi_saturate":"1.8 g","greutate_portie":"300 g"}},{"id":"sarbatori-358","titlu":"Amandine","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Evenimente Private (Pomeni, Zile de Naștere)","pagina":358,"portii":"12","timp_minute":90,"calorii":152,"ingrediente":["Pentru blat:","5 ouă, 60 g îndulcitor pudră (eritritol/stevia), 100 g făină integrală, 20 g cacao neîndulcită,","20 ml ulei de cocos, 5 g praf de copt, 1 vârf de cuțit de sare","Pentru sirop:","200 ml apă, 20 g îndulcitor lichid ,","1 linguriță esență de rom","Pentru cremă:","200 g iaurt grecesc 2%, 100 g brânză de vaci slabă, 50 g ciocolată neagră 85% cacao, 15 g cacao neîndulcită, 20 g îndulcitor pudră, 1 linguriță esență de rom","Pentru glazură:"],"descriere":"O variantă mai ușoară a prăjiturii clasice, cu blat pufos de cacao,\ncremă fină și glazură intensă de ciocolată.\nBlatul","pasi":"1.Mixează ouăle cu îndulcitorul 5 minute, până devin spumoase.\n2.Adaugă uleiul, cacaoa, făina, praful de copt și sarea.\n3.Omogenizează și toarnă compoziția în tavă.\n4.Coace la 170°C timp de 20–25 minute. Lasă la răcit complet.\nSiropul\n1.Fierbe apa cu îndulcitorul lichid și esența de rom 1–2 minute.\n2.Lasă siropul să se răcorească.\nCrema\n1.Amestecă iaurtul, brânza de vaci, ciocolata topită, cacaoa,\nîndulcitorul și esența de rom.\n2.Mixează până obții o cremă fină.\n3.Dă la rece 15–20 min pentru fermitate.\nGlazura\n1.Topește ciocolata împreună cu laptele până devine un sos gros.\n2.Lasă să se răcească ușor.\nAsamblare\n1.Taie blatul în două foi.\n2.Însiropează fiecare foaie cu siropul rece.\n3.Întinde crema între foi.\n4.Toarnă glazura peste prăjitură și nivelează.\n5.Lasă la frigider minimum 2 ore înainte de tăiere.","sfaturi":"Poți adăuga nuci măcinate în cremă pentru textură.\nDacă vrei un gust mai intens, folosește cafea concentrată\npentru sirop în loc de apă.\nSe servește foarte bine cu o linguriță de iaurt grecesc alături.","alergeni":"gluten (făină), ouă, lactoză (iaurt, brânză, lapte), cacao","variante":"înlocuiește brânza de vaci cu quark sau skyr pentru un plus de proteine.","macro":{"calorii_macro":"152","proteine":"6.7 g","carbohidrati":"13.5 g","fibre":"2 g","grasimi":"6.5 g","grasimi_saturate":"2 g"}},{"id":"sarbatori-359","titlu":"Savarine","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Evenimente Private (Pomeni, Zile de Naștere)","pagina":359,"portii":"12","timp_minute":90,"calorii":121,"ingrediente":["Pentru aluat:","250 g făină integrală","150 ml lapte degresat călduț","30 g îndulcitor pudră (eritritol/stevia)","20 g drojdie proaspătă (sau 7 g uscată)","2 ouă întregi + 1 albuș","20 g ulei de cocos","1 vârf de cuțit de sare","Pentru sirop:","400 ml apă","40 g îndulcitor lichid","1 linguriță esență de rom","Pentru umplutură:","250 g iaurt grecesc 2% bătut spumă","10 g îndulcitor"],"descriere":"Savarine pufoase, însiropate și umplute cu cremă fină de iaurt, o\nvariantă mult mai light a desertului clasic.\nAluat","pasi":"1.Dizolvă drojdia și îndulcitorul în laptele cald.\n2.Adaugă făina, ouăle, uleiul și sarea.\n3.Mixează 4–5 minute până obții un aluat moale și elastic.\n4.Împarte compoziția în formele de savarină și lasă la dospit 20–\n25 minute.\n5.Coace la 180°C timp de 15–18 minute, până devin aurii.\n2. Sirop\n1.Fierbe apa cu îndulcitorul lichid și esența de rom 1–2 minute.\n2.Lasă siropul să se răcească.\n3. Umplutură\n1.Bate iaurtul rece până devine spumos.\n2.Adaugă îndulcitor și vanilie după gust.\n4. Asamblare\n1.Scufundă savarinele în siropul rece pe ambele părți până se\nîmbibă bine.\n2.Taie capacul fiecărei savarine.\n3.Umple cu crema de iaurt și așază capacul deasupra.","sfaturi":"Poți adăuga deasupra fructe de pădure proaspete pentru un\nplus de prospețime.\nDacă vrei un gust mai bogat, înlocuiește jumătate din iaurt cu\nbrânză mascarpone light.\nSe servesc cel mai bine după ce stau 1–2 ore la rece.","alergeni":"gluten (făină), ouă, lactoză (lapte, iaurt)","variante":"pentru mai multe proteine, adaugă 1–2 linguri de pudră proteică de vanilie în crema de iaurt.","macro":{"calorii_macro":"120.7","proteine":"6.1 g","carbohidrati":"16.3 g","fibre":"2.5 g","grasimi":"1.7 g","grasimi_saturate":"0.3 g"}},{"id":"sarbatori-360","titlu":"Cremșnit","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Evenimente Private (Pomeni, Zile de Naștere)","pagina":360,"portii":"12","timp_minute":65,"calorii":214,"ingrediente":["Pentru foi:","400 g foi de foietaj light","Pentru cremă:","1 l lapte degresat","40 g îndulcitor pudră (eritritol/stevia)","4 ouă (2 gălbenușuri + 2 albușuri)","60 g amidon de porumb","1 plic zahăr vanilat","20 g unt light","Pentru decor: îndulcitor pudră – după gust"],"descriere":"Un desert clasic, reinterpretat într-o variantă light, cu foi crocante și\ncremă fină de vanilie.\nFoile","pasi":"1.Coace foile de foietaj light conform instrucțiunilor (de obicei\n12–15 minute la 200°C).\n2.Lasă-le să se răcească complet.\nCrema\n1.Pune laptele la î stecul în forma de tartă și presează bine.\n3.Dă la frigider 15 minute.\nCrema\n1.Amestecă laptele cu amidonul, îndulcitorul, mierea și vanilia.\n2.Fierbe la foc mic 3–4 minute până se îngroașă.\n3.Lasă 5 minute să se răcorească și încorporează iaurtul + coaja\nde lămâie.\n4.Toarnă crema peste crustă.\nFructele\n1.Taie fructele și stropește-le cu puțină zeamă de lămâie.\n2.Așază-le peste cremă în mod uniform.\n3.Lasă tarta minimum 3 ore la frigider.","sfaturi":"Pentru o tartă și mai fermă: adaugă 5 g gelatină hidratată în\ncrema caldă.\nDacă vrei gust mai vanilat → 1 linguriță vanilie + 1 plic zahăr\nvanilat fără zahăr.\nPoți înlocui fructele cu mango + afine pentru o aromă exotică.","alergeni":"lactoză (iaurt, lapte), gluten (biscuiți)","variante":"fără gluten: folosește biscuiți digestivi fără gluten în aceeași cantitate; fără lactoză: înlocuiește laptele cu lapte vegetal, iaurtul cu iaurt vegetal și untul cu unt fără lactoză sau ulei de cocos.","macro":{"calorii_macro":"135","proteine":"4.2 g","carbohidrati":"17.7 g","fibre":"0.6 g","grasimi":"5.3 g","grasimi_saturate":"2.9 g"}},{"id":"sarbatori-363","titlu":"Profiterol","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Evenimente Private (Pomeni, Zile de Naștere)","pagina":363,"portii":"12","timp_minute":55,"calorii":131,"ingrediente":["Pentru coji (choux)","120 ml apă","40 g unt 65%","70 g făină","2 buc ouă","1 vârf de cuțit de sare","Pentru crema de vanilie","400 g iaurt grecesc 2%","200 ml lapte","25 g amidon de porumb","40 g îndulcitor pudră","20 g miere","1 linguriță esență de vanilie","½ buc coajă rasă de lămâie","Pentru glazură","50 g ciocolată 75%","10 g ulei de cocos","20 ml lapte cald","Pentru montaj"],"descriere":"Un desert clasic reinterpretat într-o variantă mai ușoară: choux-uri\ndelicate, cremă fină de vanilie și glazură de ciocolată, totul\ncompletat cu fructe proaspete pentru un contrast fresh.\nCoji (choux)","pasi":"1.Pune apa la fiert cu untul și sarea.\n2.Adaugă făina dintr-o dată și amestecă până se formează un\naluat compact.\n3.Lasă 5 minute să se răcorească, apoi încorporează ouăle\ntreptat.\n4.Formează biluțe pe tavă și coace la 190°C, 20–25 minute.\nCremă de vanilie\n1.Amestecă laptele cu amidonul, îndulcitorul, mierea și vanilia.\n2.Fierbe 3–4 minute, până se îngroașă.\n3.Lasă puțin la răcorit, apoi încorporează iaurtul și coaja de\nlămâie.\n4.Omogenizează și dă la rece.\nGlazură\n1.Topește ciocolata cu uleiul de cocos și laptele.\n2.Amestecă până devine fină.\nMontaj\n1.Umple cojile cu crema de vanilie.\n2.Așază-le în boluri.\n3.Toarnă glazura caldă.\n4.Adaugă fructe proaspete și puțin sirop, dacă vrei.\n5.Lasă la frigider minimum 1 oră.","sfaturi":"Pentru versiune mai proteinată: adaugă 40 g pudră proteică\nvanilie în crema caldă.","alergeni":"lactoză (iaurt, lapte), gluten (făină), ouă","variante":"dacă ai intoleranță la lactoză, poți folosi iaurt grecesc fără lactoză și lapte fără lactoză, fără să schimbi gustul cremei; pentru varianta fără gluten, poți înlocui făina din coji cu un mix universal fără gluten, însă textura va fi ușor diferită.","macro":{"calorii_macro":"131","proteine":"5.4 g","carbohidrati":"12.2 g","fibre":"0 g","grasimi":"5.5 g","grasimi_saturate":"3.2 g"}},{"id":"sarbatori-364","titlu":"Tort Diplomat","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Evenimente Private (Pomeni, Zile de Naștere)","pagina":364,"portii":"12","timp_minute":40,"calorii":145,"ingrediente":["Pentru baza de biscuiți","150 g biscuiți digestivi low-sugar","40 g unt 65% topit","Pentru cremă","500 g iaurt grecesc 2%","300 ml lapte","40 g îndulcitor pudră (eritritol/stevia)","40 g miere","20 g gelatină pudră","70 ml apă rece (pentru hidratarea gelatinei)","1 linguriță esență de vanilie","1 buc coajă rasă de lămâie","Pentru fructe","150 g mandarine (sau portocale)","150 g ananas bucăți (în suc, scurs bine)","100 g fructe de pădure (proaspete sau congelate)"],"descriere":"O reinterpretare light a desertului clasic, răcoritor și cremos, cu\nbază de biscuiți și cremă fină de iaurt.\nBaza de biscuiți","pasi":"1.Mărunțește biscuiții digestivi și amestecă-i cu untul topit.\n2.Apasă compoziția într-o tavă tapetată și nivelează bine.\n3.Dă la rece 10–15 minute.\nCrema\n1.Amestecă iaurtul cu îndulcitorul, mierea, vanilia și coaja de\nlămâie.\n2.Hidratează gelatina în 70 ml apă rece, apoi topește-o pe baie\nde aburi.\n3.Toarnă gelatina caldă peste amestecul de iaurt, amestecând\nenergic.\n4.Adaugă laptele și omogenizează.\n5.Toarnă crema peste baza de biscuiți.\nFructele\n1.Taie fructele cubulețe și distribuie-le uniform în cremă.\n2.Presară deasupra fructe de pădure.\nRăcire\n1.Dă prăjitura la frigider minimum 3–4 ore.\n2.Taie doar după ce s-a închegat complet.","sfaturi":"Pentru o culoare galbenă intensă: adaugă 2–3 picături extract\nnatural de turmeric.\nPentru aromă mai puternică: pune 1 lingură suc de portocală în\ncremă.\nDacă o vrei mai fermă: crești gelatina la 25 g.","alergeni":"lactoză (iaurt, lapte), gluten (biscuiți)","variante":"Fără gluten: folosește biscuiți digestivi fără gluten în aceeași cantitate.. Fără lactoză: utilizează iaurt grecesc fără lactoză, lapte vegetal și unt fără lactoză.","macro":{"calorii_macro":"145","proteine":"5 g","carbohidrati":"17.6 g","fibre":"0.25 g","grasimi":"5.4 g","grasimi_saturate":"2.9 g"}},{"id":"sarbatori-365","titlu":"Tort Doboș","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Evenimente Private (Pomeni, Zile de Naștere)","pagina":365,"portii":"12","timp_minute":100,"calorii":119,"ingrediente":["Pentru foi:","3 ouă","60 g îndulcitor pudră (eritritol/stevia)","150 g făină integrală","1 vârf de cuțit de sare","Pentru cremă:","150 g iaurt grecesc 2%","100 g brânză de vaci slabă (fină, pasată)","80 g ciocolată neagră 85% cacao","20 g cacao neîndulcită","20 g îndulcitor pudră","1 linguriță esență de rom sau vanilie","Pentru caramel:","40 g eritritol caramelizat","10 ml apă","5 g unt light"],"descriere":"O versiune modernizată, mai ușoară și echilibrată a celebrului Tort\nDoboș, cu cremă fină de cacao și topping crocant de caramel\nlight.\nFoi:","pasi":"1.Bate ouăle cu îndulcitorul.\n2.Adaugă făina și sarea.\n3.Împarte aluatul în 6 foi subțiri și coace fiecare foaie 6–8 minute\nla 180°C.\nCremă:\n1.Mixează iaurtul cu brânza de vaci.\n2.Încorporează cacaoa, îndulcitorul, esența și ciocolata topită.\n3.Lasă 10–15 minute la rece.\nCaramel:\n1.Caramelizează eritritolul (sau zahărul).\n2.Adaugă apa și untul și amestecă până devine omogen.\n3.Toarnă într-un strat subțire și lasă la întărit.\nAsamblare:\n1.Montează foi + cremă în straturi.\n2.Ultima foaie se decorează cu caramel tăiat în triunghiuri.\n3.Lasă tortul la rece cel puțin 2 ore.","sfaturi":"Poți adăuga nuci măcinate între straturi pentru un plus de\ntextură.\nPentru un gust mai intens, folosește cafea concentrată în cremă.\nSe servește cel mai bine a doua zi, după ce s-au combinat\naromele.","alergeni":"gluten (făină), ouă, lactoză (iaurt, brânză, unt)","variante":"folosește pudră proteică de ciocolată în cremă pentru un aport proteic mai mare.","macro":{"calorii_macro":"119","proteine":"6.1 g","carbohidrati":"14.1 g","fibre":"2 g","grasimi":"4.3 g","grasimi_saturate":"1.5 g"}},{"id":"sarbatori-366","titlu":"Tort Harlequin","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Evenimente Private (Pomeni, Zile de Naștere)","pagina":366,"portii":"12","timp_minute":140,"calorii":123,"ingrediente":["Pentru blat","4 buc ouă, 50 g îndulcitor pudră,","40 g zahăr brun, 90 g făină, 20 g cacao, 1 linguriță esență de vanilie, 1 vârf de cuțit de sare","Pentru crema  (tip diplomat)","500 g iaurt grecesc 2%","250 ml lapte","20 g gelatină pudră","50 ml apă rece (pentru hidratare)","40 g îndulcitor pudră","20 g miere","1 linguriță esență de vanilie","½ buc coajă de lămâie rasă","Pentru cubulețele de jeleu (specific","Harlequin)","300 ml apă","10 g gelatină","30 g îndulcitor pudră","1 linguriță sirop fără zahăr (căpșuni / portocale) pentru culoare","Pentru decor / asamblare","100 g fructe de pădure"],"descriere":"Un tort ușor, aerat și plin de culoare, Tortul Harlequin combină un\nblat fin de cacao cu o cremă diplomat fresh și cubulețe de jeleu\ncare aduc textura specifică desertului clasic, dar într-o variantă\nlight și echilibrată.\nBlatul","pasi":"1.Bate albușurile cu sarea; adaugă zahărul brun + îndulcitorul.\n2.Încorporează gălbenușurile, vanilia, apoi făina cernută cu\ncacao.\n3.Coace 20–22 min la 170°C și lasă la răcit.\nJeleul Harlequin\n1.Dizolvă gelatina în apă caldă cu îndulcitor și sirop.\n2.Toarnă în tavă mică, răcește 2 ore.\n3.Taie cubulețe.\nCrema\n1.Dizolvă gelatina în lapte cald.\n2.Amestecă iaurtul cu îndulcitor, miere, vanilie și coajă de lămâie.\n3.Toarnă laptele cu gelatină peste iaurt și adaugă cubulețele de\njeleu.\nMontare\n1.Pune blatul în forma de tort.\n2.Toarnă crema cu jeleu peste blat.\n3.Decorează cu fructe și răcește minimum 4–6 ore.","sfaturi":"Pentru un efect Harlequin mai intens: fă 2 tipuri de jeleu – roșu și\ngalben.\nPentru o cremă mai fermă: crește gelatina la 25 g.\nPentru o aromă fresh: adaugă 1 lingură suc de portocală în\ncremă.","alergeni":"lactoză (iaurt, lapte), gluten (făină), ouă","variante":"dacă ai intoleranță la lactoză, poți folosi iaurt grecesc fără lactoză și lapte fără lactoză — crema rămâne identică ca textură. Pentru o variantă mai proteică, înlocuiește 200 g iaurt cu 200 g iaurt proteic (skyr) fără să modifici consistența.","macro":{"calorii_macro":"123","proteine":"7.3 g","carbohidrati":"14.1 g","fibre":"0.55 g","grasimi":"3.2 g","grasimi_saturate":"1.4 g"}},{"id":"sarbatori-367","titlu":"Tort „pădurea Neagră”","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Evenimente Private (Pomeni, Zile de Naștere)","pagina":367,"portii":"12","timp_minute":90,"calorii":174,"ingrediente":["Blat","200 g ouă","40 g zahăr brun","40 g îndulcitor pudră","90 g făină","25 g cacao","1 linguriță vanilie","1 vârf de cuțit de sare","Crema","500 g iaurt grecesc 2%","100 g ciocolată 75% topită","40 g îndulcitor pudră","20 g miere","1 linguriță vanilie","Strat Vișine","400 g vișine fără sâmburi","40 g îndulcitor","50 ml apă","1 lingură zeamă lămâie","Sirop","120 ml apă","20 g îndulcitor","1 linguriță rom","Decor"],"descriere":"Un tort clasic reinterpretat într-o variantă light: blat pufos de\ncacao, cremă fină de iaurt și ciocolată, strat generos de vișine și un\nsirop aromat care păstrează gustul autentic, dar cu mult mai puține\ncalorii.\nBlatul","pasi":"1.Bate albușurile cu sarea; adaugă treptat zahărul brun +\nîndulcitorul.\n2.Încorporează gălbenușurile, vanilia, apoi făina cernută cu\ncacao.\n3.Coace 20–22 min la 170°C. Lasă la răcit și taie în 2 foi.\nVișinele\n1.Fierbe vișinile cu îndulcitorul, apa și zeama de lămâie 5–6\nminute.\n2.Lasă la răcit complet.\nCrema\n1.Amestecă iaurtul cu îndulcitorul, mierea și vanilia.\n2.Adaugă ciocolata topită și amestecă până devine cremă fină.\n3.Dă 15–20 minute la frigider.\nSiropul\n1.Fierbe apa 1 minut cu îndulcitorul.\n2.Adaugă romul.\nMontare\n1.Pune prima foaie → însiropează ușor.\n2.Adaugă jumătate din crema light + un strat de vișine.\n3.Pune a doua foaie → însiropează.\n4.Acoperă cu restul cremei.\n5.Decorează cu vișine și ciocolată rasă.\n6.Lasă 4–6 ore la frigider (ideal peste noapte).","sfaturi":"Dacă vrei aromă mai puternică: adaugă 1 lingură lichior fără\nalcool cu aromă de vișine.\nPentru o cremă mai fermă: + 5 g gelatină în crema caldă.\nPentru un blat extra pufos: încorporează 1 lingură apă minerală\nrece.","alergeni":"lactoză (iaurt, lapte), gluten (făină), ouă","variante":"Fără lactoză: folosește iaurt grecesc fără lactoză + ciocolată fără lactoză; textura se păstrează identică. Fără gluten: blatul poate fi făcut cu făină fără gluten — tortul rămâne stabil și ușor.","macro":{"calorii_macro":"174","proteine":"7.6 g","carbohidrati":"23.2 g","fibre":"0.7 g","grasimi":"6 g","grasimi_saturate":"3.1 g"}},{"id":"sarbatori-368","titlu":"Tort Krantz","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Evenimente Private (Pomeni, Zile de Naștere)","pagina":368,"portii":"12","timp_minute":100,"calorii":187,"ingrediente":["Blat","200 g ouă","50 g zahăr brun","40 g îndulcitor pudră","100 g făină","20 g nucă măcinată","1 linguriță esență vanilie","1 vârf de cuțit de sare","Crema  (tip diplomat cu nuci)","500 g iaurt grecesc 2%","250 ml lapte","30 g amidon porumb","40 g îndulcitor pudră","20 g miere","1 linguriță vanilie","50 g nucă mărunțită","10 g gelatină + 40 ml apă (hidratare)","Krantz  (crocant)","30 g nucă","30 g zahăr brun","20 g îndulcitor pudră","1 linguriță apă","Sirop"],"descriere":"Un tort reinterpretat într-o variantă mai ușoară, cu blat fin, cremă\ndiplomat cu iaurt și nuci, sirop aromat și celebrul krantz crocant — o\ncombinație clasică păstrată în versiune light, fără a pierde gustul\nautentic.\nBlat","pasi":"1.Bate albușuri + sare + zahăr brun + îndulcitor până devin\nferme.\n2.Încorporează gălbenușurile și vanilia.\n3.Adaugă făina și nuca, amestecând ușor.\n4.Coace 20–22 min la 170°C. Taie în 2 foi.\nKrantz light\n1.Încălzește zahărul brun + îndulcitorul + 1 linguriță apă până se\ntopește.\n2.Adaugă nuca, amestecă 30 sec.\n3.Toarnă pe hârtie de copt, lasă să se întărească și toacă mărunt.\nCrema  cu nuci\n1.Hidratează gelatina în 40 ml apă.\n2.Fierbe laptele cu amidon + îndulcitor 2–3 min până se\nîngroașă.\n3.Adaugă mierea + vanilia, apoi gelatina hidratată.\n4.După 5 min de răcire, încorporează iaurtul.\n5.Adaugă  nucă mărunțită (jumătate din krantz).\nSirop\n1.Fierbe apa cu îndulcitor 1 min, adaugă romul.\nMontare\n1.Foaie blat → sirop → cremă.\n2.A doua foaie → sirop → cremă.\n3.Acoperă cu restul de cremă.\n4.Presară krantz-ul rămas deasupra.\n5.Răcește minimum 4–6 ore (ideal peste noapte).","sfaturi":"Pentru cremă mai acrișoară: + 1 lingură zeamă lămâie.\nPentru o textură mai fermă: + 5 g gelatină.\nPentru mai mult gust de nucă: prăjește nucile 3–4 min înainte de\nfolosire.","alergeni":"lactoză (iaurt, lapte), gluten (făină), ouă","variante":"Fără lactoză: folosește iaurt fără lactoză + lapte fără lactoză; crema rămâne stabilă. Fără gluten: înlocuiește făina cu mix fără gluten – blatul rămâne aerat.","macro":{"calorii_macro":"187","proteine":"8.2 g","carbohidrati":"19.5 g","fibre":"0.5 g","grasimi":"8.3 g","grasimi_saturate":"3.4 g"}}]</script>
<script>
(function(){
  "use strict";
  var RECIPES = JSON.parse(document.getElementById('recipe-data').textContent);

  var BOOKS = Array.from(new Set(RECIPES.map(r=>r.carte_scurt)));
  var CATS = Array.from(new Set(RECIPES.map(r=>r.categorie).filter(Boolean))).sort(function(a,b){return a.localeCompare(b,'ro');});

  var COMMON_ALLERGENS = [
    {id:'lactate', label:'Lactate', re:/lactat|lapte|iaurt|branz|brânz|telemea|cașcaval|cascaval|unt(?!\\s*de\\s*arahide|\\s*de\\s*cocos)|smantan|smântân|cottage/i},
    {id:'oua', label:'Ouă', re:/\\bou(ă|a|lui)?\\b|\\balbu[sș]/i},
    {id:'gluten', label:'Gluten', re:/gluten|faina|făină|grau|grâu|ovăz(?!.*fara gluten)|paste|lipie/i},
    {id:'nuci', label:'Nuci / Fructe cu coajă', re:/nuci|migdale|alune|fistic|caju|arahide/i},
    {id:'peste', label:'Pește', re:/pe[sș]te|somon|ton\\b|cod\\b/i},
    {id:'fructe_mare', label:'Fructe de mare', re:/creveți|creveti|midii|fructe de mare|calamar/i},
    {id:'soia', label:'Soia', re:/soia/i},
    {id:'susan', label:'Susan / Mac', re:/susan|\\bmac\\b/i},
  ];

  var SORT_OPTIONS = [
    {id:'relevanta', label:'Relevanță'},
    {id:'cal_asc', label:'Calorii: crescător'},
    {id:'cal_desc', label:'Calorii: descrescător'},
    {id:'time_asc', label:'Timp: crescător'},
    {id:'time_desc', label:'Timp: descrescător'},
    {id:'az', label:'Alfabetic A-Z'},
  ];

  var state = {
    search: '',
    books: [],
    cats: [],
    calMin: 0, calMax: 600,
    timeMin: 0, timeMax: 180,
    excludeAllergens: [],
    mainTab: 'acasa', // acasa | retete | favorite | calorii
    sort: 'relevanta',
  };

  var ACTIVITY_LEVELS = [
    {id:'sedentar', label:'Sedentar (job de birou, aproape deloc mișcare)', mult:1.2},
    {id:'usor', label:'Ușor activ (mișcare ușoară / sport 1-3 zile/săpt.)', mult:1.375},
    {id:'moderat', label:'Moderat activ (sport 3-5 zile/săpt.)', mult:1.55},
    {id:'activ', label:'Foarte activ (sport intens 6-7 zile/săpt.)', mult:1.725},
    {id:'extrem', label:'Extrem de activ (muncă fizică + sport)', mult:1.9},
  ];
  var GOALS = [
    {id:'mentinere', label:'Menținere', delta:0, note:'Caloriile tale actuale de întreținere'},
    {id:'slabire_usoara', label:'Slăbire ușoară', delta:-300, note:'~0.25-0.3 kg/săptămână (ritm blând)'},
    {id:'slabire', label:'Slăbire', delta:-500, note:'~0.5-0.75 kg/săptămână (ritm moderat)'},
    {id:'crestere', label:'Creștere masă musculară', delta:300, note:'Surplus caloric moderat, pentru masă musculară'},
  ];
  var PROFILE_KEY = 'btfit_profile_v1';
  var calcState = { editing: true, blocked: null };
  function getProfile(){
    try{ return JSON.parse(localStorage.getItem(PROFILE_KEY)); }catch(e){ return null; }
  }
  function setProfile(p){ try{ localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); }catch(e){} }
  function clearProfile(){ try{ localStorage.removeItem(PROFILE_KEY); }catch(e){} }
  calcState.editing = !getProfile();

  function calcBMR(sex, age, height, weight){
    return sex==='M' ? (10*weight + 6.25*height - 5*age + 5) : (10*weight + 6.25*height - 5*age - 161);
  }
  function activityMult(id){
    var a = ACTIVITY_LEVELS.find(x=>x.id===id);
    return a ? a.mult : 1.375;
  }
  function safeFloor(sex){ return sex==='M' ? 1500 : 1200; }

  function computeScenarios(profile){
    var bmr = calcBMR(profile.sex, profile.age, profile.height, profile.weight);
    var tdee = bmr * activityMult(profile.activity);
    return GOALS.map(function(g){
      var raw = tdee + g.delta;
      var floor = safeFloor(profile.sex);
      var adjusted = raw < floor;
      var kcal = Math.round(adjusted ? floor : raw);
      var proteinG = Math.round(profile.weight * 1.8);
      var proteinKcal = proteinG * 4;
      var fatKcal = kcal * 0.28;
      var fatG = Math.round(fatKcal / 9);
      var carbKcal = Math.max(0, kcal - proteinKcal - fatG*9);
      var carbG = Math.round(carbKcal / 4);
      return {
        id: g.id, label: g.label, note: g.note, kcal: kcal, adjusted: adjusted,
        proteinG: proteinG, fatG: fatG, carbG: carbG,
        primary: g.id === profile.goal,
      };
    });
  }
  function bmiInfo(height, weight){
    var h = height/100;
    var bmi = weight / (h*h);
    var cat, color;
    if(bmi < 18.5){ cat='Subponderal'; color='#c9872f'; }
    else if(bmi < 25){ cat='Normal'; color='#2b6f54'; }
    else if(bmi < 30){ cat='Supraponderal'; color='#c9872f'; }
    else { cat='Obezitate'; color='#b5482f'; }
    return {bmi: Math.round(bmi*10)/10, cat: cat, color: color};
  }

  var CAL_BOUNDS = computeBounds('calorii');
  var TIME_BOUNDS = computeBounds('timp_minute');
  state.calMin = CAL_BOUNDS.min; state.calMax = CAL_BOUNDS.max;
  state.timeMin = TIME_BOUNDS.min; state.timeMax = TIME_BOUNDS.max;

  function computeBounds(field){
    var vals = RECIPES.map(r=>r[field]).filter(v=>typeof v==='number');
    return {min: Math.min.apply(null, vals), max: Math.max.apply(null, vals)};
  }

  function vibrate(ms){
    try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){}
  }

  // ---------------- Persistence ----------------
  var FAV_KEY = 'btfit_favorites_v1';
  function getFavs(){
    try{ return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); }catch(e){ return []; }
  }
  function setFavs(arr){
    try{ localStorage.setItem(FAV_KEY, JSON.stringify(arr)); }catch(e){}
  }
  function isFav(id){ return getFavs().indexOf(id) !== -1; }
  function toggleFav(id){
    var favs = getFavs();
    var i = favs.indexOf(id);
    var nowFav;
    if(i===-1){ favs.push(id); nowFav = true; } else { favs.splice(i,1); nowFav = false; }
    setFavs(favs);
    vibrate(12);
    showToast(nowFav ? 'Adăugată la favorite ⭐' : 'Scoasă din favorite');
    return nowFav;
  }

  var CHECK_KEY = 'btfit_checks_v1';
  function getChecks(id){
    try{ var all = JSON.parse(localStorage.getItem(CHECK_KEY) || '{}'); return all[id] || []; }catch(e){ return []; }
  }
  function setChecks(id, arr){
    try{
      var all = JSON.parse(localStorage.getItem(CHECK_KEY) || '{}');
      all[id] = arr;
      localStorage.setItem(CHECK_KEY, JSON.stringify(all));
    }catch(e){}
  }
  function toggleCheck(id, idx){
    var arr = getChecks(id);
    var i = arr.indexOf(idx);
    if(i===-1) arr.push(idx); else arr.splice(i,1);
    setChecks(id, arr);
  }

  function escapeHtml(s){
    if(s===null || s===undefined) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function norm(s){
    return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  }

  function recipeHasAllergen(r, allergenId){
    var def = COMMON_ALLERGENS.find(a=>a.id===allergenId);
    if(!def) return false;
    var hay = (r.alergeni||'') + ' ' + (r.ingrediente||[]).join(' ');
    return def.re.test(hay);
  }

  // ---------------- Toast ----------------
  function showToast(msg){
    var t = document.getElementById('toastEl');
    if(!t){
      t = document.createElement('div');
      t.id = 'toastEl';
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1700);
  }

  // ---------------- Filtering / sorting ----------------
  function filterRecipes(){
    var q = norm(state.search);
    var list = RECIPES.filter(function(r){
      if(state.mainTab==='favorite' && !isFav(r.id)) return false;
      if(state.books.length && state.books.indexOf(r.carte_scurt)===-1) return false;
      if(state.cats.length && state.cats.indexOf(r.categorie)===-1) return false;
      if(r.calorii < state.calMin || r.calorii > state.calMax) return false;
      if(r.timp_minute < state.timeMin || r.timp_minute > state.timeMax) return false;
      if(state.excludeAllergens.length){
        for(var i=0;i<state.excludeAllergens.length;i++){
          if(recipeHasAllergen(r, state.excludeAllergens[i])) return false;
        }
      }
      if(q){
        var hay = norm(r.titlu+' '+r.categorie+' '+(r.ingrediente||[]).join(' '));
        if(hay.indexOf(q)===-1) return false;
      }
      return true;
    });
    switch(state.sort){
      case 'cal_asc': list = list.slice().sort((a,b)=>a.calorii-b.calorii); break;
      case 'cal_desc': list = list.slice().sort((a,b)=>b.calorii-a.calorii); break;
      case 'time_asc': list = list.slice().sort((a,b)=>a.timp_minute-b.timp_minute); break;
      case 'time_desc': list = list.slice().sort((a,b)=>b.timp_minute-a.timp_minute); break;
      case 'az': list = list.slice().sort((a,b)=>a.titlu.localeCompare(b.titlu,'ro')); break;
      default: break;
    }
    return list;
  }

  function activeFilterCount(){
    var n = 0;
    if(state.books.length) n++;
    if(state.cats.length) n++;
    if(state.calMin>CAL_BOUNDS.min || state.calMax<CAL_BOUNDS.max) n++;
    if(state.timeMin>TIME_BOUNDS.min || state.timeMax<TIME_BOUNDS.max) n++;
    if(state.excludeAllergens.length) n++;
    return n;
  }

  function bindShellEvents(){
    var si = document.getElementById('searchInput');
    if(si) si.addEventListener('input', function(e){
      state.search = e.target.value;
      renderListOnly();
    });
    var ofb = document.getElementById('openFilters');
    if(ofb) ofb.addEventListener('click', function(){ openFilterSheet(); });
    var sprb = document.getElementById('surpriseBtn');
    if(sprb) sprb.addEventListener('click', function(){
      var list = filterRecipes();
      if(!list.length) list = RECIPES;
      var pick = list[Math.floor(Math.random()*list.length)];
      vibrate(15);
      openDetail(pick.id);
    });
    document.querySelectorAll('.chip[data-book]').forEach(function(el){
      el.addEventListener('click', function(){
        var b = el.getAttribute('data-book');
        var i = state.books.indexOf(b);
        if(i===-1) state.books.push(b); else state.books.splice(i,1);
        render();
      });
    });
    document.querySelectorAll('[data-navtab]').forEach(function(el){
      el.addEventListener('click', function(){
        state.mainTab = el.getAttribute('data-navtab');
        window.scrollTo(0,0);
        render();
      });
    });

    if(sortSel) sortSel.addEventListener('change', function(){
      state.sort = sortSel.value;

    bindCardEvents();

      });
    });

    if(surpriseHome) surpriseHome.addEventListener('click', function(){
      var list = RECIPES;

      vibrate(15);
      openDetail(pick.id);
    });
  }

  function bindCardEvents(){
    document.querySelectorAll('.card').forEach(function(el){
      el.addEventListener('click', function(e){

        openDetail(el.getAttribute('data-id'));
      });
    });
    document.querySelectorAll('.favbtn[data-favid]').forEach(function(el){

        e.stopPropagation();

      tplListBlock(list);

  // global scroll-to-top visibility (set once)

  // ---------------- Filter sheet ----------------
  function openFilterSheet(skipAnim){
    filterSheetOpen = true;
    var existing = document.getElementById('filterOverlay');
    if(existing) existing.remove();
    var overlay = document.createElement('div');
    overlay.className = 'sheet-overlay';
    overlay.id = 'filterOverlay';
    overlay.innerHTML = tplFilterSheet();
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e){
      if(e.target === overlay){ closeFilterSheet(); }
    });
    bindFilterSheetEvents(overlay);
    updateRangeFill(overlay, 'cal', CAL_BOUNDS, state.calMin, state.calMax);
    updateRangeFill(overlay, 'time', TIME_BOUNDS, state.timeMin, state.timeMax);
  }
  function closeFilterSheet(){
    filterSheetOpen = false;
    var el = document.getElementById('filterOverlay');
    if(el) el.remove();
  }

  function tplFilterSheet(){
    return '' +
    '<div class="sheet">' +
      '<div class="sheet-head"><h2>Filtre</h2><button id="resetFilters">Resetează</button></div>' +

        '<div class="filter-group">' +
          '<h4>Carte</h4>' +
          '<div class="optionrow">' + BOOKS.map(function(b){
            return '<div class="option'+(state.books.indexOf(b)!==-1?' active':'')+'" data-fbook="'+escapeHtml(b)+'">'+bookEmoji(b)+' '+escapeHtml(b)+'</div>';

        '</div>' +
        '<div class="filter-group">' +

            '<input type="range" id="timeMaxR" min="'+TIME_BOUNDS.min+'" max="'+TIME_BOUNDS.max+'" value="'+state.timeMax+'">' +

            return '<div class="option'+(state.excludeAllergens.indexOf(a.id)!==-1?' active':'')+'" data-fallergen="'+a.id+'">'+escapeHtml(a.label)+'</div>';
          }).join('') + '</div>' +
          '<div class="unknown-note">Notă: detectarea alergenilor se bazează pe textul din carte și pe cuvinte-cheie din ingrediente — verifică mereu rețeta înainte, mai ales dacă ai o alergie severă.</div>' +
        '</div>' +
      '</div>' +
      '<div class="sheet-foot">' +
        '<button class="btn btn-ghost" id="closeFilters">Închide</button>' +
        '<button class="btn btn-primary" id="applyFilters">Arată rezultatele</button>' +

  }

  function updateRangeFill(overlay, prefix, bounds, minVal, maxVal){
    var fill = overlay.querySelector('#'+prefix+'Fill');
    if(!fill) return;
    var span = bounds.max - bounds.min || 1;
    var pctMin = (minVal - bounds.min) / span * 100;
    var pctMax = (maxVal - bounds.min) / span * 100;
    fill.style.left = pctMin + '%';
    fill.style.right = (100 - pctMax) + '%';
  }

  function bindFilterSheetEvents(overlay){
    overlay.querySelectorAll('[data-fbook]').forEach(function(el){
      el.addEventListener('click', function(){
        var b = el.getAttribute('data-fbook');
        var i = state.books.indexOf(b);
        if(i===-1) state.books.push(b); else state.books.splice(i,1);
        refreshSheet();
      });
    });
    overlay.querySelectorAll('[data-fcat]').forEach(function(el){
      el.addEventListener('click', function(){
        var c = el.getAttribute('data-fcat');
        var i = state.cats.indexOf(c);
        if(i===-1) state.cats.push(c); else state.cats.splice(i,1);
        refreshSheet();
      });
    });
    overlay.querySelectorAll('[data-fallergen]').forEach(function(el){
      el.addEventListener('click', function(){
        var a = el.getAttribute('data-fallergen');
        var i = state.excludeAllergens.indexOf(a);
        if(i===-1) state.excludeAllergens.push(a); else state.excludeAllergens.splice(i,1);
        refreshSheet();
      });
    });
    var calMinR = overlay.querySelector('#calMinR');
    var calMaxR = overlay.querySelector('#calMaxR');
    calMinR.addEventListener('input', function(){
      state.calMin = Math.min(parseInt(calMinR.value,10), state.calMax);
      refreshSheetLabelsOnly(overlay);
    });
    calMaxR.addEventListener('input', function(){
      state.calMax = Math.max(parseInt(calMaxR.value,10), state.calMin);
      refreshSheetLabelsOnly(overlay);
    });
    var timeMinR = overlay.querySelector('#timeMinR');
    var timeMaxR = overlay.querySelector('#timeMaxR');
    timeMinR.addEventListener('input', function(){
      state.timeMin = Math.min(parseInt(timeMinR.value,10), state.timeMax);
      refreshSheetLabelsOnly(overlay);
    });
    timeMaxR.addEventListener('input', function(){
      state.timeMax = Math.max(parseInt(timeMaxR.value,10), state.timeMin);
      refreshSheetLabelsOnly(overlay);
    });
    overlay.querySelector('#resetFilters').addEventListener('click', function(){
      state.books = []; state.cats = []; state.excludeAllergens = [];
      state.calMin = CAL_BOUNDS.min; state.calMax = CAL_BOUNDS.max;
      state.timeMin = TIME_BOUNDS.min; state.timeMax = TIME_BOUNDS.max;
      refreshSheet();
    });
    overlay.querySelector('#closeFilters').addEventListener('click', closeFilterSheet);
    overlay.querySelector('#applyFilters').addEventListener('click', function(){
      closeFilterSheet();
      render();
    });
  }

  function refreshSheet(){
    var overlay = document.getElementById('filterOverlay');
    overlay.innerHTML = tplFilterSheet();
    bindFilterSheetEvents(overlay);
    updateRangeFill(overlay, 'cal', CAL_BOUNDS, state.calMin, state.calMax);
    updateRangeFill(overlay, 'time', TIME_BOUNDS, state.timeMin, state.timeMax);
  }
  function refreshSheetLabelsOnly(overlay){
    overlay.querySelector('#calLabels').innerHTML = '<span>Minim: '+state.calMin+' kcal</span><span>Maxim: '+state.calMax+' kcal</span>';
    overlay.querySelector('#timeLabels').innerHTML = '<span>Minim: '+state.timeMin+' min</span><span>Maxim: '+state.timeMax+' min</span>';
    updateRangeFill(overlay, 'cal', CAL_BOUNDS, state.calMin, state.calMax);
    updateRangeFill(overlay, 'time', TIME_BOUNDS, state.timeMin, state.timeMax);
  }

  // ---------------- Detail view ----------------
  var stepState = {active:false, idx:0, steps:[]};

  function parseSteps(pasiText){
    return (pasiText||'').split(/\n(?=\d+[\.\)])/).map(function(s){return s.trim();}).filter(Boolean);
  }
  function stepLabel(s){
    var m = s.match(/^(\d+)[\.\)]\s*(.*)$/s);
    return m ? {num:m[1], txt:m[2]} : {num:'•', txt:s};
  }

  function openDetail(id, skipHistory){
    currentDetailId = id;
    var r = RECIPES.find(x=>x.id===id);
    if(!r) { currentDetailId = null; return; }
    stepState = {active:false, idx:0, steps:parseSteps(r.pasi)};
    var existing = document.getElementById('detailOverlay');
    if(existing) existing.remove();
    var overlay = document.createElement('div');
    overlay.className = 'detail-overlay';
    overlay.id = 'detailOverlay';
    overlay.innerHTML = tplDetail(r);
    document.body.appendChild(overlay);

    overlay.querySelector('.backbtn').addEventListener('click', closeDetail);
    var fb = overlay.querySelector('.favbtn-top');
    fb.addEventListener('click', function(){
      var nowFav = toggleFav(r.id);
      fb.classList.toggle('active', nowFav);
      fb.textContent = nowFav ? '★' : '☆';
    });

    bindIngredientEvents(overlay, r);

    var toggleBtn = overlay.querySelector('#toggleStepMode');
    if(toggleBtn){
      toggleBtn.addEventListener('click', function(){
        if(!stepState.active){
          stepState.active = true;
          stepState.idx = 0;
          overlay.querySelector('#stepsListView').classList.add('hidden');
          toggleBtn.textContent = '📋 Vezi lista completă';
          renderStepModeView(overlay, r);
          vibrate(10);
        } else {
          exitStepMode(overlay, toggleBtn);
        }
      });
    }

    overlay.scrollTop = 0;
    window.scrollTo(0,0);
    if(!skipHistory){
      try{ history.pushState({detail:id}, ''); }catch(e){}
    }
  }
  function closeDetail(){
    currentDetailId = null;
    stepState = {active:false, idx:0, steps:[]};
    var el = document.getElementById('detailOverlay');
    if(el) el.remove();
  }

  window.addEventListener('popstate', function(){
    if(currentDetailId){ closeDetail(); }
  });

  // ---- ingredient checklist ----
  function tplIngredientInner(r){
    var checks = getChecks(r.id);
    var total = (r.ingrediente||[]).length;
    var done = checks.length;
    var pct = total ? Math.round(done/total*100) : 0;
    return '' +
      '<div class="ing-progress"><span class="ptext">'+done+'/'+total+' bifate</span>' +
      (done ? '<button id="ingResetBtn">Resetează</button>' : '') + '</div>' +
      '<div class="progressbar"><div class="progressbar-fill" style="width:'+pct+'%"></div></div>' +
      '<ul class="ing-list" id="ingListUl">' + (r.ingrediente||[]).map(function(i, idx){
        var on = checks.indexOf(idx)!==-1;
        return '<li data-idx="'+idx+'" class="'+(on?'checked':'')+'">' +
          '<span class="ing-check'+(on?' on':'')+'">'+(on?'✓':'')+'</span>' +
          '<span class="ing-text">'+escapeHtml(i)+'</span></li>';
      }).join('') + '</ul>';
  }
  function bindIngredientEvents(overlay, r){
    function renderIng(){
      var sec = overlay.querySelector('#ingBody');
      sec.innerHTML = tplIngredientInner(r);
      bindIngInner();
    }
    function bindIngInner(){
      var ul = overlay.querySelector('#ingListUl');
      ul.onclick = function(e){
        var li = e.target.closest('li');
        if(!li) return;
        var idx = parseInt(li.getAttribute('data-idx'),10);
        toggleCheck(r.id, idx);
        vibrate(6);
        renderIng();
      };
      var resetBtn = overlay.querySelector('#ingResetBtn');
      if(resetBtn) resetBtn.onclick = function(){
        setChecks(r.id, []);
        renderIng();
        showToast('Lista de ingrediente a fost resetată');
      };
    }
    bindIngInner();
  }

  // ---- step by step mode ----
  function exitStepMode(overlay, toggleBtn){
    stepState.active = false;
    var listView = overlay.querySelector('#stepsListView');
    if(listView) listView.classList.remove('hidden');
    if(toggleBtn) toggleBtn.textContent = '▶ Mod ghidat';
    var smv = overlay.querySelector('#stepModeView');
    if(smv){ smv.classList.add('hidden'); smv.innerHTML=''; }
  }
  function renderStepModeView(overlay, r){
    var smv = overlay.querySelector('#stepModeView');
    smv.classList.remove('hidden');
    var total = stepState.steps.length;
    var idx = stepState.idx;
    var lbl = stepLabel(stepState.steps[idx] || '');
    smv.innerHTML = '' +
      '<div class="stepmode-progress">Pasul '+(idx+1)+' din '+total+'</div>' +
      '<div class="stepmode-dots">' + stepState.steps.map(function(_,i){
        return '<span class="dot'+(i===idx?' active':(i<idx?' done':''))+'"></span>';
      }).join('') + '</div>' +
      '<div class="stepmode-card">'+escapeHtml(lbl.txt)+'</div>' +
      '<div class="stepmode-nav">' +
        '<button class="btn btn-ghost" id="stepPrev"'+(idx===0?' disabled':'')+'>← Înapoi</button>' +
        (idx===total-1 ?
          '<button class="btn btn-primary" id="stepDone">✓ Poftă bună!</button>' :
          '<button class="btn btn-primary" id="stepNext">Pasul următor →</button>') +
      '</div>';
    var prevBtn = smv.querySelector('#stepPrev');
    if(prevBtn) prevBtn.addEventListener('click', function(){
      if(stepState.idx>0){ stepState.idx--; renderStepModeView(overlay, r); }
    });
    var nextBtn = smv.querySelector('#stepNext');
    if(nextBtn) nextBtn.addEventListener('click', function(){
      stepState.idx++; vibrate(10); renderStepModeView(overlay, r);
    });
    var doneBtn = smv.querySelector('#stepDone');
    if(doneBtn) doneBtn.addEventListener('click', function(){
      var toggleBtn = overlay.querySelector('#toggleStepMode');
      exitStepMode(overlay, toggleBtn);
      vibrate([10,30,10]);
      showToast('Poftă bună! 🎉');
    });
  }

  function parseGrams(v){
    if(!v) return 0;
    var m = String(v).match(/([\d.,]+)/);
    return m ? parseFloat(m[1].replace(',', '.')) : 0;
  }

  function tplMacroBar(macro){
    var p = parseGrams(macro.proteine);
    var c = parseGrams(macro.carbohidrati);
    var g = parseGrams(macro.grasimi);
    var pk = p*4, ck = c*4, gk = g*9;
    var total = pk+ck+gk;
    if(!total) return '';
    var pPct = Math.round(pk/total*100);
    var cPct = Math.round(ck/total*100);
    var gPct = Math.max(0, 100 - pPct - cPct);
    return '' +
      '<div class="macrobar">' +
        '<div class="seg seg-p" style="width:'+pPct+'%"></div>' +
        '<div class="seg seg-c" style="width:'+cPct+'%"></div>' +
        '<div class="seg seg-g" style="width:'+gPct+'%"></div>' +
      '</div>' +
      '<div class="macrobar-legend">' +
        '<span><span class="legend-dot" style="background:#3c6e9c"></span>Proteină '+pPct+'%</span>' +
        '<span><span class="legend-dot" style="background:#c9872f"></span>Carbo '+cPct+'%</span>' +
        '<span><span class="legend-dot" style="background:#b5482f"></span>Grăsimi '+gPct+'%</span>' +
      '</div>';
  }

  function tplGoalCompare(r){
    var profile = getProfile();
    if(!profile || calcState.blocked) return '';
    var scenarios = computeScenarios(profile);
    var primary = scenarios.find(s=>s.primary) || scenarios[0];
    if(!primary || !primary.kcal) return '';
    var pct = Math.round(r.calorii / primary.kcal * 100);
    return '<div class="goal-compare">🎯 Această porție reprezintă ~<b>'+pct+'%</b> din necesarul tău zilnic pentru obiectivul „'+escapeHtml(primary.label)+'" ('+primary.kcal+' kcal/zi) — informativ, pe baza profilului tău din tab-ul Calorii.</div>';
  }

  function macroRow(label, value){
    if(!value) return '';
    return '<div class="macro-card"><div class="label">'+label+'</div><div class="value">'+escapeHtml(value)+'</div></div>';
  }

  function tplDetail(r){
    var fav = isFav(r.id);
    var steps = stepState.steps;
    var macro = r.macro || {};
    return '' +
    '<div class="detail-head">' +
      '<button class="backbtn">←</button>' +
      '<button class="favbtn-top'+(fav?' active':'')+'">'+(fav?'★':'☆')+'</button>' +
      '<div class="book-tag">'+escapeHtml(r.carte_scurt)+(r.categorie?' · '+escapeHtml(r.categorie):'')+'</div>' +
      '<h1>'+escapeHtml(r.titlu)+'</h1>' +
      '<div class="stats">' +
        '<div class="stat">🔥 <b>'+r.calorii+'</b> kcal/porție</div>' +
        '<div class="stat">⏱ <b>'+r.timp_minute+'</b> min</div>' +
        '<div class="stat">🍽 <b>'+escapeHtml(r.portii)+'</b> porții</div>' +
      '</div>' +
    '</div>' +
    '<div class="detail-body">' +
      '<div class="sourcebox">📖 Sursă: <b>'+escapeHtml(r.carte)+'</b>, pagina '+r.pagina+'. Valorile nutriționale sunt cele indicate de carte pentru porția specificată.</div>' +
      (r.descriere ? '<div class="section"><div class="desc-box">'+escapeHtml(r.descriere)+'</div></div>' : '') +
      '<div class="section" id="ingSection"><h3>🧺 Ingrediente ('+escapeHtml(r.portii)+' porții)</h3>' +
        '<div id="ingBody">' + tplIngredientInner(r) + '</div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="steps-header"><h3>👩‍🍳 Mod de preparare</h3>' +
          (steps.length ? '<button class="stepmode-btn" id="toggleStepMode">▶ Mod ghidat</button>' : '') +
        '</div>' +
        '<div class="steps" id="stepsListView">' + steps.map(function(s){
          var lbl = stepLabel(s);
          return '<div class="step"><div class="num">'+lbl.num+'</div><div class="txt">'+escapeHtml(lbl.txt)+'</div></div>';
        }).join('') + '</div>' +
        '<div class="stepmode hidden" id="stepModeView"></div>' +
      '</div>' +
      '<div class="section"><h3>📊 Valori nutriționale / porție</h3>' +
        tplMacroBar(macro) +
        '<div class="macro-grid">' +
          macroRow('Calorii', macro.calorii_macro ? macro.calorii_macro+' kcal' : (r.calorii+' kcal')) +
          macroRow('Proteine', macro.proteine) +
          macroRow('Carbohidrați', macro.carbohidrati) +
          macroRow('din care fibre', macro.fibre) +
          macroRow('Grăsimi', macro.grasimi) +
          macroRow('din care saturate', macro.grasimi_saturate) +
        '</div>' +
        (macro.greutate_portie ? '<div class="unknown-note">Greutate estimată a porției: ~'+escapeHtml(macro.greutate_portie)+'</div>' : '') +
        tplGoalCompare(r) +
      '</div>' +
      '<div class="section"><h3>⚠️ Alergeni</h3>' +
        (r.alergeni ?
          '<div class="allergen-box"><b>Conține / poate conține:</b>'+escapeHtml(r.alergeni)+'</div>' :
          '<div class="unknown-note">Cartea nu precizează explicit alergenii pentru această rețetă — verifică fiecare ingredient dacă ai o alergie.</div>') +
      '</div>' +
      (r.sfaturi ? '<div class="section"><h3>💡 Sfaturi practice</h3><div class="tips-box">'+escapeHtml(r.sfaturi)+'</div></div>' : '') +
      (r.variante ? '<div class="section"><h3>🔁 Variante / alternative</h3><div class="variant-box">'+escapeHtml(r.variante)+'</div></div>' : '') +
      '<div class="disclaimer">Rețetele și valorile nutriționale provin din cărțile BT FIT și sunt orientative — nevoile calorice și nutriționale variază de la o persoană la alta. Acest asistent nu oferă diagnostic sau recomandări medicale; pentru afecțiuni, sarcină/alăptare sau diete terapeutice, discută cu un medic sau dietetician autorizat.</div>' +
    '</div>';
  }


  // ---------------- Calorie / macro calculator tab ----------------
  function tplCalorieTab(){
    if(calcState.blocked){
      return tplBlockMessage(calcState.blocked);
    }
    var profile = getProfile();
    if(!profile || calcState.editing){
      return tplProfileForm(profile);
    }
    return tplCalorieResults(profile);
  }

  function tplBlockMessage(kind){
    var msg = kind === 'minor'
      ? '<h3>⚠️ Pentru minori (sub 18 ani)</h3><p>Nu putem calcula o țintă calorică pentru minori — necesarul lor nutrițional este diferit și trebuie stabilit cu atenție. Te rugăm să discuți cu un medic pediatru sau un dietetician specializat în nutriție pentru copii și adolescenți.</p>'
      : '<h3>⚠️ Recomandăm sprijin de specialitate</h3><p>Ai bifat că te afli într-una dintre situațiile: sarcină/alăptare, antecedente de tulburări de alimentație, sau o afecțiune medicală complexă. În aceste cazuri, o țintă calorică generică poate fi nepotrivită sau riscantă. Te rugăm să discuți cu un medic sau un dietetician autorizat, care îți poate recomanda un plan adaptat situației tale.</p>';
    return '<div class="calc-wrap"><div class="block-box">'+msg+'</div>' +
      '<button class="btn btn-ghost" id="backToForm" style="margin-top:14px;width:100%;">← Înapoi la formular</button></div>';
  }

  function tplProfileForm(profile){
    var p = profile || {sex:'F', age:'', height:'', weight:'', activity:'moderat', goal:'mentinere'};
    return '' +
    '<div class="calc-wrap">' +
      '<div class="form-card">' +
        '<h2>Profilul tău</h2>' +
        '<div class="intro">Completează datele tale ca să estimăm necesarul caloric de întreținere și o repartiție de macronutrienți. Rezultatul e orientativ — nu înlocuiește recomandarea unui medic sau dietetician.</div>' +
        '<div class="formrow"><label>Sex</label>' +
          '<div class="segmented" id="sexSegment">' +
            '<button type="button" data-sex="F" class="'+(p.sex==='F'?'active':'')+'">Femeie</button>' +
            '<button type="button" data-sex="M" class="'+(p.sex==='M'?'active':'')+'">Bărbat</button>' +
          '</div>' +
        '</div>' +
        '<div class="formrow"><label>Vârstă (ani)</label>' +
          '<input class="forminput" type="number" id="ageInput" min="1" max="120" placeholder="ex: 29" value="'+escapeHtml(p.age)+'"></div>' +
        '<div class="formrow"><label>Înălțime (cm)</label>' +
          '<input class="forminput" type="number" id="heightInput" min="50" max="250" step="0.1" placeholder="ex: 168" value="'+escapeHtml(p.height)+'"></div>' +
        '<div class="formrow"><label>Greutate (kg)</label>' +
          '<input class="forminput" type="number" id="weightInput" min="20" max="400" step="0.1" placeholder="ex: 65" value="'+escapeHtml(p.weight)+'"></div>' +
        '<div class="formrow"><label>Nivel de activitate</label>' +
          '<select class="select-native" id="activitySelect">' +
            ACTIVITY_LEVELS.map(function(a){ return '<option value="'+a.id+'"'+(p.activity===a.id?' selected':'')+'>'+a.label+'</option>'; }).join('') +
          '</select></div>' +
        '<div class="formrow"><label>Obiectivul tău principal</label>' +
          '<select class="select-native" id="goalSelect">' +
            GOALS.map(function(g){ return '<option value="'+g.id+'"'+(p.goal===g.id?' selected':'')+'>'+g.label+'</option>'; }).join('') +
          '</select></div>' +
        '<div class="checkbox-row">' +
          '<input type="checkbox" id="specialCheck">' +
          '<span>Mă aflu într-una din situațiile: sunt minor/ă (sub 18 ani), sunt însărcinată sau alăptez, am antecedente de tulburări de alimentație, sau am o afecțiune medicală complexă care necesită supraveghere.</span>' +
        '</div>' +
        '<div class="form-error hidden" id="formError"></div>' +
        '<button class="btn btn-primary" id="submitProfile" style="width:100%;">Calculează necesarul caloric</button>' +
      '</div>' +
      '<div class="calc-disclaimer">Calculul folosește formula Mifflin-St Jeor și este orientativ — nu reprezintă diagnostic sau prescripție medicală. Nevoile reale variază în funcție de metabolism, compoziție corporală, afecțiuni și alți factori individuali.</div>' +
    '</div>';
  }

  function tplCalorieResults(profile){
    var scenarios = computeScenarios(profile);
    var bmi = bmiInfo(profile.height, profile.weight);
    var activityLabel = (ACTIVITY_LEVELS.find(a=>a.id===profile.activity)||{}).label || '';
    return '' +
    '<div class="calc-wrap">' +
      '<div class="profile-summary">' +
        '<div class="pinfo">' +
          '<b>'+(profile.sex==='M'?'Bărbat':'Femeie')+', '+profile.age+' ani</b><br>' +
          profile.height+' cm &middot; '+profile.weight+' kg<br>' +
          activityLabel +
          '<div class="bmi-row"><span class="bmi-badge" style="background:'+bmi.color+'">IMC '+bmi.bmi+' · '+bmi.cat+'</span></div>' +
        '</div>' +
        '<div class="actions">' +
          '<button id="editProfileBtn">✏️ Editează</button>' +
          '<button id="deleteProfileBtn">🗑️ Șterge</button>' +
        '</div>' +
      '</div>' +
      '<div class="scenario-grid">' +
        scenarios.map(tplScenarioCard).join('') +
      '</div>' +
      '<div class="calc-disclaimer">Notă privind IMC: este un indicator general, nu ține cont de masa musculară sau compoziția corporală individuală. Aceste estimări (necesar caloric și macronutrienți) sunt orientative, bazate pe formula Mifflin-St Jeor — nu înlocuiesc evaluarea unui medic sau dietetician. Pentru sarcină, alăptare, afecțiuni medicale sau antecedente de tulburări alimentare, discută cu un specialist autorizat înainte de a urma o țintă calorică.</div>' +
    '</div>';
  }

  function tplScenarioCard(s){
    return '' +
    '<div class="scenario-card'+(s.primary?' primary':'')+'">' +
      (s.primary ? '<div class="tag">Obiectivul tău</div>' : '') +
      '<h4>'+escapeHtml(s.label)+'</h4>' +
      '<div class="note">'+escapeHtml(s.note)+'</div>' +
      '<div class="kcal">'+s.kcal+' <small>kcal/zi</small></div>' +
      (s.adjusted ? '<div class="floorwarn">⚠ Ajustat la un minim sigur estimat — pentru o țintă mai agresivă, discută cu un dietetician.</div>' : '') +
      '<div class="macro-mini-row">' +
        '<div class="macro-mini"><div class="v">'+s.proteinG+'g</div><div class="l">Proteină</div></div>' +
        '<div class="macro-mini"><div class="v">'+s.carbG+'g</div><div class="l">Carbo</div></div>' +
        '<div class="macro-mini"><div class="v">'+s.fatG+'g</div><div class="l">Grăsimi</div></div>' +
      '</div>' +
    '</div>';
  }

  function bindCalorieTabEvents(){
    if(state.mainTab !== 'calorii') return;
    var sexSeg = document.getElementById('sexSegment');
    if(sexSeg){
      sexSeg.querySelectorAll('[data-sex]').forEach(function(b){
        b.addEventListener('click', function(){
          sexSeg.querySelectorAll('[data-sex]').forEach(x=>x.classList.remove('active'));
          b.classList.add('active');
        });
      });
    }
    var submitBtn = document.getElementById('submitProfile');
    if(submitBtn){
      submitBtn.addEventListener('click', function(){
        var sexBtn = sexSeg.querySelector('.active');
        var sex = sexBtn ? sexBtn.getAttribute('data-sex') : 'F';
        var age = parseInt(document.getElementById('ageInput').value, 10);
        var height = parseFloat(document.getElementById('heightInput').value);
        var weight = parseFloat(document.getElementById('weightInput').value);
        var activity = document.getElementById('activitySelect').value;
        var goal = document.getElementById('goalSelect').value;
        var special = document.getElementById('specialCheck').checked;
        var errEl = document.getElementById('formError');

        if(!age || !height || !weight || age<=0 || height<=0 || weight<=0){
          errEl.textContent = 'Completează vârsta, înălțimea și greutatea cu valori valide.';
          errEl.classList.remove('hidden');
          return;
        }
        if(special){
          calcState.blocked = 'special';
          render();
          return;
        }
        if(age < 18){
          calcState.blocked = 'minor';
          render();
          return;
        }
        setProfile({sex:sex, age:age, height:height, weight:weight, activity:activity, goal:goal});
        calcState.editing = false;
        calcState.blocked = null;
        render();
      });
    }
    var editBtn = document.getElementById('editProfileBtn');
    if(editBtn) editBtn.addEventListener('click', function(){ calcState.editing = true; render(); });
    var delBtn = document.getElementById('deleteProfileBtn');
    if(delBtn) delBtn.addEventListener('click', function(){
      clearProfile();
      calcState.editing = true;
      showToast('Profilul a fost șters');
      render();
    });
    var backBtn = document.getElementById('backToForm');
    if(backBtn) backBtn.addEventListener('click', function(){
      calcState.blocked = null;
      render();
    });
  }


  render();
})();

</script>
</body>
</html>
