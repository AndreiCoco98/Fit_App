:{"calorii_macro":"137.85","proteine":"1.1 g","carbohidrati":"7.1 g","fibre":"4.5 g","grasimi":"6.15 g","grasimi_saturate":"0 g","greutate_portie":"165 g"}},{"id":"sarbatori-246","titlu":"Conopidă la Cuptor cu Turmeric","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":246,"portii":"2","timp_minute":35,"calorii":110,"ingrediente":["385 g conopidă","13 g ulei de măsline","1 g turmeric pudră sare, piper – după gust"],"descriere":"O garnitură aromată și plină de culoare, cu proprietăți\nantiinflamatoare datorită turmericului, ideală alături de preparate\ndin pește, tofu sau carne slabă.","pasi":"1.Desfă conopida în buchețele și spal-o bine sub jet de apă rece.\n2.Pune-o într-un bol mare și adaugă uleiul de măsline, turmericul,\nsarea și piperul. Amestecă bine pentru a acoperi uniform toate\nbuchețelele.\n3.Așază conopida într-o tavă tapetată cu hârtie de copt, într-un\nsingur strat.\n4.Coace la 200°C timp de 25–30 de minute, până devine aurie\nși ușor crocantă la exterior.\n5.Servește caldă, simplă sau ca garnitură.","sfaturi":"Poți adăuga și un praf de curry pentru un gust exotic.\nAdaugă un strop de zeamă de lămâie și pătrunjel proaspăt\ntocat pentru un plus de prospețime.\nPoți servi conopida alături de tofu, năut sau orez brun pentru o\nmasă completă.","alergeni":"fără alergeni majori","variante":"Dacă ai sensibilitate la condimente, poți înlocui turmericul cu aceeași cantitate de boia dulce, care păstrează culoarea și nu modifică semnificativ aportul caloric al preparatului.","macro":{"calorii_macro":"109.4","proteine":"1.95 g","carbohidrati":"0 g","fibre":"0 g","grasimi":"6.5 g","grasimi_saturate":"0 g","greutate_portie":"165 g"}},{"id":"sarbatori-247","titlu":"Ciuperci Umplute cu Legume","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":247,"portii":"2","timp_minute":30,"calorii":82,"ingrediente":["285 g ciuperci champignon","43 g morcov ras","57 g ceapă","7 g ulei de măsline","7 g verdeață sare, piper – după gust"],"descriere":"O gustare ușoară și plină de savoare, potrivită pentru mesele de\npost sau ca aperitiv sănătos, bogat în fibre și antioxidanți.","pasi":"1.Curăță ciupercile și îndepărtează-le codițele. Toacă mărunt\ncodițele și legumele.\n2.Călește ceapa, morcovul și codițele tocate într-o lingură de ulei\nde măsline 3–4 minute, până se înmoaie ușor.\n3.Adaugă verdeața, sarea și piperul și amestecă bine.\n4.Umple pălăriile de ciuperci cu compoziția obținută și așază-le\nîntr-o tavă tapetată cu hârtie de copt.\n5.Coace la 180°C timp de 15–20 de minute, până devin aurii și\nfragede.\n6.Servește-le calde sau la temperatura camerei.","sfaturi":"Poți adăuga o lingură de brânză vegetală rasă deasupra\npentru un gust mai bogat.\nServește-le ca aperitiv sau garnitură la o masă principală.","alergeni":"fără alergeni majori","variante":"Dacă ai sensibilitate la ceapă, o poți înlocui cu aceeași cantitate de ceapă verde sau praz sotat, menținând o aromă delicată și un aport caloric foarte apropiat de varianta originală.","macro":{"calorii_macro":"81.95","proteine":"4.85 g","carbohidrati":"6.55 g","fibre":"2.15 g","grasimi":"3.55 g","grasimi_saturate":"0 g","greutate_portie":"165 g"}},{"id":"sarbatori-248","titlu":"Vinete Coapte cu Usturoi și Pătrunjel","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":248,"portii":"2","timp_minute":40,"calorii":127,"ingrediente":["560 g vinete","6 g usturoi (≈ 2 căței)","13 g ulei de măsline sare – după gust","6 g pătrunjel verde"],"descriere":"O garnitură simplă și aromată, cu textură fragedă și gust intens,\npotrivită pentru mesele de vară sau preparatele de post.","pasi":"1.Taie vinetele rondele de aproximativ 1 cm grosime și presară\nsare peste ele. Lasă-le 15 minute pentru a elimina excesul de\napă, apoi șterge-le cu un prosop de hârtie.\n2.Așază feliile într-o tavă tapetată cu hârtie de copt și stropește-\nle cu uleiul de măsline.\n3.Coace-le la 200°C timp de 25–30 de minute, întorcându-le la\njumătatea timpului.\n4.Zdrobește usturoiul și amestecă-l cu pătrunjelul tocat și puțin\nulei.\n5.Scoate vinetele din cuptor, unge-le cu amestecul de usturoi și\npătrunjel, și mai lasă-le 2–3 minute în cuptor pentru a se îmbina\naromele.\n6.Servește calde sau la temperatura camerei.","sfaturi":"","alergeni":"fără alergeni majori","variante":null,"macro":{"calorii_macro":"126.5","proteine":"3.05 g","carbohidrati":"14.2 g","fibre":"8.5 g","grasimi":"6.5 g","grasimi_saturate":"0 g","greutate_portie":"195 g"}},{"id":"sarbatori-249","titlu":"Ciorbă de Legume cu Borș","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":249,"portii":"1","timp_minute":50,"calorii":57,"ingrediente":["20 g morcovi","15 g păstârnac","20 g țelină","15 g ardei gras","40 g cartofi","25 g varză","65 g borș leuștean verde – după gust sare – după gust"],"descriere":"O rețetă tradițională românească, ușoară și revigorantă, bogată în\nfibre și vitamine, ideală pentru detoxifiere și hidratare.","pasi":"1.Curăță toate legumele și taie-le cuburi potrivite.\n2.Pune la fiert într-o oală mare morcovii, păstârnacul, țelina și\ncartofii în 500 ml de apă.\n3.După 15 minute, adaugă ardeiul și varza tocată, apoi continuă\nfierberea încă 15–20 de minute.\n4.Separat, încălzește borșul până aproape de punctul de\nfierbere, apoi toarnă-l peste legume.\n5.Mai lasă ciorba să fiarbă 5 minute, adaugă sarea și leușteanul\nverde tocat.\n6.Oprește focul și las-o acoperită 10 minute pentru a se intensifica\naromele.","sfaturi":"Pentru un gust mai intens, poți sota legumele 2–3 minute în 1\nlinguriță de ulei de măsline înainte de a le fierbe.\nDacă dorești mai multe proteine, adaugă 100 g linte roșie în\ntimpul fierberii.","alergeni":"fără alergeni majori","variante":"Dacă ai sensibilitate la gluten din borș, îl poți înlocui cu aceeași cantitate de zeamă de lămâie sau oțet de mere diluat, obținând aceeași aciditate și menținând aportul caloric aproape identic.","macro":{"calorii_macro":"56.6","proteine":"0.9 g","carbohidrati":"9.3 g","fibre":"1.8 g","grasimi":"0 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-250","titlu":"Supă Cremă de Linte Roșie","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":250,"portii":"1","timp_minute":35,"calorii":166,"ingrediente":["28 g linte roșie","20 g morcov","45 g ceapă","55 g cartof","1 g boia dulce sare, piper – după gust"],"descriere":"O supă consistentă și aromată, bogată în proteine vegetale, fibre și\nantioxidanți, ideală pentru prânzuri ușoare sau seri răcoroase.","pasi":"1.Curăță și taie ceapa, morcovul și cartoful cuburi.\n2.Pune toate legumele într-o oală cu aproximativ 0,5 litri de apă\nși fierbe-le 10 minute.\n3.Adaugă lintea roșie spălată, sarea, piperul și boiaua dulce.\n4.Fierbe la foc mic 15–20 de minute, până ce lintea se înmoaie\ncomplet.\n5.Pasează totul cu blenderul până obții o cremă fină.\n6.Poți adăuga puțin ulei de măsline sau zeamă de lămâie înainte\nde servire pentru un gust echilibrat.","sfaturi":"Lintea roșie fierbe repede, nu are nevoie de înmuiere peste\nnoapte.\nMerge foarte bine cu pătrunjel proaspăt tocat sau câteva\npicături de zeamă de lămâie.","alergeni":"fără alergeni majori","variante":"Dacă ai sensibilitate la condimente, poți înlocui boiaua dulce cu aceeași cantitate de turmeric sau pătrunjel proaspăt, obținând o aromă blândă și păstrând același aport caloric al rețetei.","macro":{"calorii_macro":"165.4","proteine":"7.9 g","carbohidrati":"27.8 g","fibre":"1.1 g","grasimi":"0.7 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-251","titlu":"Supă Cremă de Conopidă cu Orez","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":251,"portii":"1","timp_minute":35,"calorii":78,"ingrediente":["75 g conopidă","8 g orez alb","13 g ceapă","100 g supă limpede de legume","2 g ulei de măsline","0,5 g pătrunjel verde sare, piper – după gust"],"descriere":"O supă fină și reconfortantă, bogată în fibre și vitamine, ideală\npentru o masă ușoară și echilibrată.","pasi":"1.Curăță conopida și taie-o în buchețele mici. Toacă ceapa\nmărunt.\n2.Călește ceapa în uleiul de măsline 2–3 minute, până devine\ntranslucidă.\n3.Adaugă conopida, orezul și supa limpede de legume.\n4.Fierbe la foc mic 20–25 de minute, până ce legumele și orezul\nsunt moi.\n5.Pasează totul cu blenderul până obții o cremă omogenă.\n6.Condimentează cu sare și piper după gust și presară pătrunjel\nverde la final.","sfaturi":"Pentru o textură mai cremoasă, poți adăuga 1 lingură de lapte\nvegetal (ex. migdale, soia).\nSe servește cu crutoane din pâine integrală sau semințe\npresărate.\nPoți înlocui orezul cu quinoa pentru un plus de proteine.","alergeni":"niciun alergen major, dar dacă se adaugă crutoane, pot conține gluten","variante":"Dacă ai alergie la țelină din supa concentrată, o poți înlocui cu aceeași cantitate de apă caldă și un praf de sare, menținând același aport caloric și o aromă blândă, potrivită pentru supă cremă.","macro":{"calorii_macro":"78","proteine":"1.4 g","carbohidrati":"7.6 g","fibre":"0.1 g","grasimi":"2.1 g","grasimi_saturate":"0.3 g"}},{"id":"sarbatori-252","titlu":"Supă Cremă de Legume","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":252,"portii":"1","timp_minute":40,"calorii":109,"ingrediente":["35 g morcovi","25 g dovlecei","35 g cartofi roșii","12 g ceapă","1 g usturoi","60 g apă","2 g ulei de măsline","30 g tofu afumat (crutoane)","1 g făină integrală (crutoane)"],"descriere":"O supă densă și plină de gust, cu o combinație perfectă între\nlegume dulci și crutoane proteice de tofu rumenit, ideală pentru o\nmasă echilibrată și hrănitoare.","pasi":"1.Curăță legumele și taie-le cuburi: morcovii, dovleceii, cartofii și\nceapa.\n2.Călește ceapa și usturoiul în 5 ml ulei de măsline timp de 2–3\nminute.\n3.Adaugă legumele tăiate și 250 ml apă. Fierbe la foc mic 20–25\nde minute, până devin moi.\n4.Pasează cu blenderul până obții o cremă omogenă.\nCondimentează cu sare și piper.\n5.Separat, taie tofu-ul cuburi mici, trece-l prin făină integrală și\nprăjește-l în restul de ulei (5 ml) până devine crocant.\n6.Servește supa caldă, cu crutoanele de tofu presărate deasupra.","sfaturi":"Cimbru, busuioc uscat sau un praf de nucșoară merg perfect cu\naceastă combinație.\nSupa rezistă 2–3 zile la frigider și se poate încălzi ușor la foc\nmic, iar crutoanele e bine să le adaugi doar la servire ca să\nrămână crocante.","alergeni":"soia, gluten (din făină)","variante":"Dacă ai alergie la soia, poți înlocui tofu cu aceeași cantitate de ciuperci rumenite, iar dacă ești intolerant la gluten, poți folosi făină fără gluten pentru crutoane.","macro":{"calorii_macro":"109","proteine":"5.1 g","carbohidrati":"9.8 g","fibre":"1.7 g","grasimi":"4.5 g","grasimi_saturate":"0.6 g"}},{"id":"sarbatori-253","titlu":"Ciorbă de Fasole Boabe cu Tarhon","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":253,"portii":"1","timp_minute":90,"calorii":86,"ingrediente":["50 g fasole albă","23 g ceapă","11 g morcov","23 g ardei gras","8 g bulion","3 g tarhon sare – după gust"],"descriere":"O ciorbă aromată și sățioasă, inspirată din bucătăria\nardelenească, bogată în fibre și proteine vegetale, cu o notă\ninconfundabilă de tarhon proaspăt.","pasi":"1.Lasă fasolea la înmuiat peste noapte, apoi fierbe-o 60–70 de\nminute până devine moale.\n2.Toacă ceapa, morcovul și ardeiul cuburi mici.\n3.Într-o oală mare, călește ceapa 2–3 minute, apoi adaugă\nmorcovul și ardeiul.\n4.Adaugă fasolea fiartă, bulionul și 0,5 litri de apă fierbinte.\n5.Fierbe totul 20–25 de minute, apoi adaugă tarhonul tocat și\npotrivește de sare.\n6.Lasă ciorba să se odihnească 10 minute cu capacul pus pentru\na se intensifica aromele.","sfaturi":"Dacă vrei un gust mai intens, poți pune și puțină afumătură\nvegetală.\nPentru un plus de aromă, poți adăuga 1-2 căței de usturoi la\nfinal.\nMerge foarte bine cu o felie de pâine integrală alături.","alergeni":"fără alergeni majori (posibil gluten dacă se servește cu pâine)","variante":"Dacă ai sensibilitate la tarhon sau la potențialele urme din tarhonul uscat, îl poți înlocui cu aceeași cantitate de pătrunjel proaspăt tocat, păstrând un gust fresh și un aport caloric identic.","macro":{"calorii_macro":"85.4","proteine":"5.1 g","carbohidrati":"12.5 g","fibre":"0.3 g","grasimi":"0.3 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-254","titlu":"Supă Cremă de Roșii cu Busuioc","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":254,"portii":"1","timp_minute":35,"calorii":73,"ingrediente":["195 g roșii bine coapte","30 g ceapă","12 g morcov","2 g ulei de măsline sare – după gust","1 g busuioc proaspăt","200 ml apă"],"descriere":"O rețetă mediteraneană clasică, ușoară și aromată, cu un gust\nproaspăt de roșii coapte și busuioc, perfectă pentru o masă de\nvară echilibrată.","pasi":"1.Taie roșiile, ceapa și morcovul bucăți mari.\n2.Călește ceapa și morcovul în uleiul de măsline 3–4 minute, până\ndevin ușor aurii.\n3.Adaugă roșiile și 200 ml apă caldă, apoi fierbe la foc mic 20–\n25 de minute, până legumele se înmoaie complet.\n4.Pasează totul cu blenderul până obții o textură fină.\n5.Condimentează cu sare după gust și adaugă frunzele de\nbusuioc proaspăt.\n6.Servește supa caldă sau ușor răcită, cu crutoane sau o linguriță\nde iaurt vegetal.","sfaturi":"Pentru un gust mai bogat, poți coace roșiile în cuptor înainte de\na le adăuga în supă.\nPoți adăuga 1-2 căței de usturoi copți pentru un plus de aromă.","alergeni":"fără alergeni majori (posibil gluten dacă se servește cu pâine)","variante":"Dacă ai sensibilitate la ceapă, o poți înlocui cu aceeași cantitate de praz sotat sau ceapă verde, care oferă o aromă mai blândă și păstrează aportul caloric aproape identic.","macro":{"calorii_macro":"73","proteine":"0.4 g","carbohidrati":"7 g","fibre":"2.3 g","grasimi":"2 g","grasimi_saturate":"0.3 g"}},{"id":"sarbatori-255","titlu":"Tocană de Năut cu Rosii și Usturoi","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":255,"portii":"1","timp_minute":10,"calorii":190,"ingrediente":["117 g năut fiert","78 g roșie","4 g ulei de măsline extravirgin","1 g usturoi"],"descriere":"Un preparat simplu și aromat, cu năut fraged, roșii suculente și\nparfum intens de usturoi, legate într-un sos ușor și savuros.","pasi":"1.Călește usturoiul tocat mărunt în ulei de măsline, la foc mic.\n2.Adaugă roșiile cuburi și lasă-le să fiarbă câteva minute.\n3.Pune năutul fiert și amestecă bine.\n4.Condimentează cu sare, piper și verdețuri după gust.","sfaturi":"Poți adăuga și pătrunjel proaspăt pentru un plus de prospețime.","alergeni":"fără alergeni majori (verifică eticheta roșiilor conservate pentru eventuale urme de gluten sau țelină)","variante":"poți înlocui năutul cu fasole albă sau linte fiartă; poți adăuga verdețuri (pătrunjel, busuioc) sau un strop de zeamă de lămâie pentru un gust mai fresh.","macro":{"calorii_macro":"189.3","proteine":"0.1 g","carbohidrati":"2.7 g","fibre":"0.8 g","grasimi":"4 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-256","titlu":"Borș de Pește","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":256,"portii":"2","timp_minute":40,"calorii":159,"ingrediente":["180 g file de crap","250 ml borș acru","30 g ceapă","35 g morcov","25 g țelină","60 g roșii","30 g ardei gras","3 ml ulei de măsline","12 g pătrunjel și leuștean","Sare, piper – după gust"],"descriere":"O ciorbă tradițională aromată, cu gust echilibrat între acrișor și\ndulceag, bogată în proteine ușor digerabile și acizi grași sănătoși.","pasi":"1.Curăță și taie legumele cuburi mici (ceapa, morcovul, țelina,\nardeiul și roșiile).\n2.Pune-le la fiert în 1 litru de apă pentru 15–20 de minute, până\ndevin fragede.\n3.Adaugă fileurile de pește tăiate bucăți mari și fierbe-le 10\nminute la foc mic.\n4.Toarnă borșul acru încălzit separat, adaugă sarea și piperul\ndupă gust.\n5.La final, stinge focul și presară verdeața tocată (pătrunjel și\nleuștean).\n6.Servește cald, simplu sau cu o felie de mămăligă.","sfaturi":"Nu fierbe peștele prea mult pentru a nu se desface\nPoți folosi și șalău sau știucă\nBorșul se adaugă la final pentru a-și păstra vitamina C","alergeni":"pește","variante":"poți folosi amestec de pești (știucă, somn, biban) pentru aromă mai complexă.","macro":{"calorii_macro":"159","proteine":"16 g","carbohidrati":"3.9 g","fibre":"1.1 g","grasimi":"6.1 g","grasimi_saturate":"1.2 g"}},{"id":"sarbatori-257","titlu":"Saramură de Crap","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":257,"portii":"2","timp_minute":45,"calorii":243,"ingrediente":["320 g crap proaspăt (bucăți cu os)","100 g roșii","60 g ardei gras","½ ardei iute","6 g usturoi (≈ 2 căței)","4 ml ulei de măsline (≈ ¾ linguriță)","4 g sare grunjoasă","6 g pătrunjel verde tocat"],"descriere":"Un preparat tradițional românesc plin de savoare, cu gust intens și\nechilibru perfect între sărat, dulce și picant. O alegere excelentă\npentru prânz sau cină, bogată în proteine și grăsimi sănătoase.","pasi":"1.Presară sarea grunjoasă peste bucățile de pește și lasă-le 15\nminute la temperatura camerei.\n2.Coace ardeiul gras și ardeiul iute pe plită sau în cuptor, apoi\ncurăță-le și toacă-le mărunt.\n3.Pune roșiile într-o tigaie cu uleiul de măsline și fierbe-le 10\nminute, până se formează un sos gros.\n4.Adaugă ardeii copți, usturoiul zdrobit și 300 ml apă fierbinte\npeste sos. Fierbe încă 5–6 minute.\n5.În paralel, frige bucățile de crap pe grill sau în cuptor până se\nrumenesc ușor.\n6.Toarnă sosul fierbinte peste pește și presară pătrunjel verde\ntocat.\n7.Servește cu mămăligă caldă sau legume coapte.","sfaturi":"Pentru un gust mai intens, adaugă frunze de leuștean la final.\nDacă vrei varianta mai dietetică, redu uleiul la 5 ml sau\nelimină-l complet.\nPoți folosi și somn sau caras în loc de crap.","alergeni":"pește","variante":"pentru o aromă mai fresh, înlocuiește jumătate din roșii cu roșii cherry coapte.","macro":{"calorii_macro":"243","proteine":"27.8 g","carbohidrati":"2.9 g","fibre":"0.6 g","grasimi":"10 g","grasimi_saturate":"2 g"}},{"id":"sarbatori-258","titlu":"Plachie de Crap","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":258,"portii":"2","timp_minute":50,"calorii":233,"ingrediente":["280 g crap (bucăți cu os)","50 g ceapă","90 g roșie","40 g ardei gras","3 g usturoi (≈ 1 cățel mare)","30 ml vin alb sec","4 ml ulei de măsline","1 foaie mică de dafin","Sare, piper, cimbru – după gust","5 g pătrunjel verde tocat"],"descriere":"Un preparat tradițional savuros, bogat în arome mediteraneene, cu\nsos de roșii și vin alb, perfect pentru o masă principală echilibrată și\nsănătoasă.","pasi":"1.Curăță ceapa, ardeiul și usturoiul, apoi toacă-le mărunt.\n2.Într-o tigaie, călește ceapa în uleiul de măsline 3–4 minute,\npână devine translucidă.\n3.Adaugă ardeiul, usturoiul, roșiile și condimentele (foaia de dafin,\ncimbrul, sarea și piperul). Lasă sosul să fiarbă 10–12 minute la foc\nmic.\n4.Adaugă vinul alb și amestecă ușor.\n5.Așază bucățile de crap într-o tavă, toarnă sosul peste ele și\nacoperă cu folie.\n6.Coace la 190°C timp de 25 de minute, apoi îndepărtează folia\nși mai lasă 10 minute pentru rumenire.\n7.Servește plachia caldă, presărată cu pătrunjel verde proaspăt.","sfaturi":"Se servește cu mămăligă sau orez simplu.\nPentru un plus de aromă, adaugă și măsline negre feliate în sos.\nPoți înlocui vinul alb cu zeamă de lămâie pentru o variantă mai\ndietetică.","alergeni":"pește, sulfiți (din vin)","variante":"rețeta merge foarte bine și cu știucă, somn sau păstrăv.","macro":{"calorii_macro":"233","proteine":"24.4 g","carbohidrati":"2.6 g","fibre":"0.6 g","grasimi":"9 g","grasimi_saturate":"2 g"}},{"id":"sarbatori-259","titlu":"Pește Marinat","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":259,"portii":"2","timp_minute":60,"calorii":193,"ingrediente":["190 g file de crap","50 g ceapă","35 g morcov","25 g țelină","10 ml ulei de măsline","35 ml oțet","50 ml apă","1 foaie mică de dafin","¼ linguriță boabe de piper","2 g sare"],"descriere":"O rețetă tradițională, aromată și ușor acidulată, ideală pentru\nconservare naturală și savurare în zilele următoare. O sursă\nexcelentă de proteine și grăsimi sănătoase.","pasi":"1.Curăță peștele, taie-l în bucăți potrivite și presară sare peste el.\nLasă-l 15 minute la rece.\n2.Taie legumele rondele subțiri (ceapa, morcovul și țelina).\n3.Pune legumele într-o cratiță cu uleiul, oțetul, apa, foile de dafin,\npiperul și un praf de sare.\n4.Fierbe amestecul 10–12 minute, apoi lasă-l să se răcească puțin.\n5.Așază peștele într-un vas de sticlă sau ceramică și toarnă\nmarinada caldă peste el, acoperindu-l complet.\n6.Lasă preparatul la frigider cel puțin 12 ore înainte de servire\npentru a se pătrunde aromele.","sfaturi":"Poți adăuga și ardei kapia sau dovlecel pentru mai multă\nculoare.\nSe servește foarte bine cu mămăligă sau orez simplu.\nPentru o variantă mai ușoară, redu uleiul la 30 ml și\ncompletează cu puțină apă.","alergeni":"pește, țelină","variante":"oțetul poate fi înlocuit cu zeamă de lămâie pentru un gust mai fresh.","macro":{"calorii_macro":"193","proteine":"16.6 g","carbohidrati":"4.35 g","fibre":"0.6 g","grasimi":"9.8 g","grasimi_saturate":"1.8 g"}},{"id":"sarbatori-260","titlu":"Somon la Cuptor","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":260,"portii":"2","timp_minute":30,"calorii":568,"ingrediente":["425 g file de somon","15 ml ulei de măsline","10 ml zeamă de lămâie + câteva felii subțiri","6 g usturoi (≈ 2 căței)","Sare, piper – după gust","10 g mărar verde tocat"],"descriere":"O rețetă simplă și elegantă, bogată în acizi grași Omega-3 și\nproteine de calitate. Ideală pentru o cină sănătoasă și ușor de\ndigerat, cu gust proaspăt de lămâie și ierburi aromatice.","pasi":"1.Preîncălzește cuptorul la 190°C.\n2.Așază fileurile de somon într-o tavă tapetată cu hârtie de copt.\n3.Stropește cu uleiul de măsline și zeama de lămâie, apoi\ncondimentează cu sare, piper și usturoiul tocat.\n4.Adaugă feliile de lămâie deasupra și acoperă tava cu folie de\naluminiu.\n5.Coace 20–22 de minute, apoi îndepărtează folia și mai lasă 5\nminute pentru o crustă ușor rumenă.\n6.Presară mărar verde proaspăt înainte de servire.","sfaturi":"Garnitura ideală: legume la abur sau orez integral.\nPoți adăuga și ardei kapia sau roșii cherry în tavă pentru un plus\nde culoare.\nDacă dorești o crustă mai crocantă, lasă încă 2–3 min la grill\ndupă coacere.","alergeni":"pește","variante":"pentru un gust mai intens, marinează somonul 30 min în iaurt grecesc + usturoi + lămâie înainte de coacere.","macro":{"calorii_macro":"568","proteine":"42.5 g","carbohidrati":"0.2 g","fibre":"0 g","grasimi":"35 g","grasimi_saturate":"6.5 g"}},{"id":"sarbatori-261","titlu":"Scrumbie la Grătar cu Mujdei Light","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":261,"portii":"2","timp_minute":25,"calorii":521,"ingrediente":["Pește","410 g scrumbii proaspete (≈ 4 bucăți mici–medii)","Mujdei","22 g usturoi","55 g iaurt grecesc 2%","10 ml ulei de măsline","10 ml zeamă de lămâie","Sare, piper – după gust"],"descriere":"O rețetă tradițională reinterpretată într-o variantă echilibrată și\nușoară, bogată în Omega-3 și proteine de calitate. Mujdeiul light\ncu iaurt grecesc adaugă savoare fără exces de grăsimi.","pasi":"1.Curăță scrumbiile, îndepărtează solzii și eviscerează-le, apoi\ntamponează-le cu un șervet.\n2.Presară sare și piper pe fiecare parte și unge-le ușor cu ulei de\nmăsline.\n3.Pune-le pe grătarul încins și gătește 4–5 minute pe fiecare\nparte, până devin aurii.\n4.Între timp, pregătește mujdeiul: pisează usturoiul, apoi\namestecă-l cu iaurtul grecesc, zeama de lămâie, uleiul și\ncondimentele.\n5.Servește scrumbiile fierbinți, stropite cu mujdeiul light și\npresărate cu verdeață proaspătă (opțional).","sfaturi":"Garnitura ideală: legume la grătar sau mămăligă.\nPoți face mujdeiul și cu iaurt + pătrunjel verde tocat pentru un\ngust mai fresh.\nDacă vrei un mujdei mai light, elimină uleiul și adaugă 1 lingură\nîn plus de iaurt.","alergeni":"pește, lactoză","variante":"pentru un gust mai intens, adaugă ardei iute tocat în mujdei.","macro":{"calorii_macro":"521","proteine":"2.85 g","carbohidrati":"1.1 g","fibre":"0 g","grasimi":"5.55 g","grasimi_saturate":"1 g"}},{"id":"sarbatori-263","titlu":"Turte de Crăciun cu Miere","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":263,"portii":"10","timp_minute":60,"calorii":167,"ingrediente":["400 g făină integrală","120 ml apă călduță","40 g miere","20 g îndulcitor pudră (eritritol/stevia)","20 ml ulei de cocos","5 g bicarbonat de sodiu stins cu oțet/lămâie","1 vârf de cuțit de sare","Condimente (scorțișoară, cuișoare, ghimbir) – după gust"],"descriere":"Rețetă tradițională reinterpretată într-o variantă mai sănătoasă, cu\nfăină integrală, miere naturală și condimente specifice sărbătorilor.\nO alegere delicioasă pentru desertul de iarnă, aromat și cu textură\nfragedă.","pasi":"1.Amestecă făina cu sarea, îndulcitorul și condimentele.\n2.Adaugă mierea, uleiul și bicarbonatul stins, apoi toarnă treptat\napa călduță. Frământă până obții un aluat elastic.\n3.Întinde foi subțiri și decupează turtele.\n4.Coace la 180°C timp de 12–15 minute, până devin aurii.\n5.Lasă-le la răcit și păstrează-le într-o cutie – devin mai fragede\ndupă 1–2 zile.","sfaturi":"Făina integrală aduce mai multe fibre și sațietate.\nÎndulcitorul reduce semnificativ caloriile, păstrând gustul dulce.\nTurtele devin ușor crocante și aromate – perfecte lângă ceai\nsau cafea.","alergeni":"gluten (făină de grâu)","variante":"făină de ovăz certificată sau mix fără gluten.","macro":{"calorii_macro":"166.7","proteine":"5.2 g","carbohidrati":"32.1 g","fibre":"4.8 g","grasimi":"0.4 g","grasimi_saturate":"0.1 g","greutate_portie":"55 g"}},{"id":"sarbatori-264","titlu":"Clătite de Post cu Lapte Vegetal","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":264,"portii":"2","timp_minute":25,"calorii":303,"ingrediente":["120 g făină integrală","230 g lapte de ovăz","8 g ulei de cocos","5 g stevia","80 g piure de fructe de pădure"],"descriere":"Clătite ușoare, fără ouă și fără lactate, ideale pentru perioadele de\npost sau pentru cei care preferă o alimentație vegetală. Textură\nmoale, gust delicat și posibilități infinite de umplutură.","pasi":"1.Amestecă făina cu îndulcitorul și adaugă treptat laptele\nvegetal, amestecând continuu până obții un aluat fluid.\n2.Încorporează uleiul și omogenizează.\n3.Încinge o tigaie antiaderentă și unge-o ușor cu ulei.\n4.Toarnă un polonic mic de compoziție și rotește tigaia pentru a\nacoperi uniform suprafața.\n5.Coace clătitele 1–2 minute pe fiecare parte până devin aurii.\n6.Umple cu piure de fructe de padure și rulează.","sfaturi":"Dacă vrei mai pufoase, adaugă ½ linguriță praf de copt.\nPoți adăuga 1 linguriță de scorțișoară pentru un gust aromat.\nPentru extra proteine, adaugă 20 g pudră proteică vegetală în\naluat.","alergeni":"Poate conține gluten (din făină) și ovăz","variante":"Dacă ai intoleranță la gluten, poți înlocui făina integrală cu aceeași cantitate de făină fără gluten, iar dacă nu tolerezi laptele de ovăz, îl poți schimba cu lapte de migdale neîndulcit.","macro":{"calorii_macro":"303.1","proteine":"8.2 g","carbohidrati":"47.7 g","fibre":"7.2 g","grasimi":"0.7 g","grasimi_saturate":"0.2 g"}},{"id":"sarbatori-265","titlu":"Budincă de Ovăz cu Iaurt de Soia și Zmeură","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":265,"portii":"1","timp_minute":5,"calorii":194,"ingrediente":["25 g fulgi de ovăz","125 g iaurt de soia","40 g zmeură","4 g semințe de chia"],"descriere":"O budincă fină și răcoritoare, cu ovăz cremos, iaurt de soia catifelat\nși prospețimea naturală a zmeurei.","pasi":"1.Pune fulgii de ovăz și semințele de chia într-un bol mic sau\nborcan.\n2.Adaugă iaurtul de soia și amestecă bine.\n3.Lasă la frigider cel puțin 30 de minute (ideal peste noapte)\npentru ca ovăzul și chia să absoarbă lichidul și să se formeze\ntextura de budincă.\n4.La servire, adaugă zmeura deasupra.","sfaturi":"Pune un strop de esență de vanilie sau scorțișoară pudră.\nMerge foarte bine și cu afine, căpșuni sau mango, dacă vrei\ndiversitate","alergeni":"Poate conține soia și gluten (din ovăz, dacă nu este certificat fără gluten)","variante":"Pentru o variantă fără gluten, folosește fulgi de ovăz gluten-free. Pentru o variantă fără soia, înlocuiește iaurtul de soia cu iaurt vegetal din cocos, migdale sau ovăz.","macro":{"calorii_macro":"194.2","proteine":"9.5 g","carbohidrati":"21.6 g","fibre":"3.4 g","grasimi":"5.5 g","grasimi_saturate":"1 g","greutate_portie":"190 g"}},{"id":"sarbatori-266","titlu":"Budincă de Ovăz și Mere Caramelizate","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":266,"portii":"1","timp_minute":20,"calorii":251,"ingrediente":["25 g fulgi de ovăz","25 g pudră proteică vegană","90 g lapte de migdale","60 g măr Golden","2 g ulei de cocos","3 g scorțișoară extract de vanilie – câteva picături"],"descriere":"O budincă aromată și reconfortantă, cu ovăz cremos și mere ușor\ncaramelizate, perfect echilibrată între dulce și condimentat.","pasi":"1.Pune fulgii de ovăz într-o crăticioară, adaugă laptele de\nmigdale și gătește la foc mic 5–7 minute, până se îngroașă.\n2.Adaugă pudra proteică și extractul de vanilie, amestecând bine\npână devine cremos.\n3.Separat, într-o tigaie antiaderentă, călește cubulețele de măr în\nulei de cocos 2–3 minute, până devin ușor caramelizate.\n4.Adaugă scorțișoara peste mere și amestecă.\n5.Toarnă budinca de ovăz într-un bol și pune deasupra merele\ncaramelizate.","sfaturi":"Un praf de nucșoară sau ghimbir pudră merge perfect cu\nmerele caramelizate.\nPoți pregăti budinca de seara și o încălzești dimineața, dar\nmerele e mai bine să le faci proaspete pentru un gust intens.","alergeni":"Poate conține nuci (din laptele vegetal, dacă este produs într-o unitate mixtă)","variante":"Pentru o variantă fără gluten, folosește fulgi de ovăz gluten-free. Pentru o variantă fără nuci, înlocuiește laptele de migdale cu lapte de ovăz fără gluten, lapte de orez sau lapte de cocos.","macro":{"calorii_macro":"250.7","proteine":"16.3 g","carbohidrati":"24.9 g","fibre":"4.5 g","grasimi":"5.5 g","grasimi_saturate":"1.8 g"}},{"id":"sarbatori-267","titlu":"Orez cu Lapte, Măr și Scorțișoară","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":267,"portii":"1","timp_minute":20,"calorii":393,"ingrediente":["23 g orez basmati","27 g măr Golden","7 g îndulcitor Stevia","1 g scorțișoară","9 g nuci","45 g iaurt de cocos","90 g lapte de cocos"],"descriere":"O rețetă aromată și cremoasă, perfectă pentru diminețile reci sau\nca gustare dulce și sănătoasă. Fără zahăr adăugat, dar plină de\ngust datorită merelor caramelizate natural și scorțișoarei.","pasi":"1.Fierbe orezul în laptele de cocos la foc mic, amestecând\nfrecvent, până devine cremos (10–12 minute).\n2.Adaugă îndulcitorul și scorțișoara, amestecând ușor.\n3.Într-o tigaie, călește mărul tăiat cubulețe 2–3 minute până se\nînmoaie ușor.\n4.Servește orezul cald într-un bol, adaugă mărul caramelizat,\niaurtul de cocos și presară nucile mărunțite.","sfaturi":"Alege orez basmati sau jasmin, pentru o textură mai fină și o\ndigestie mai ușoară.\nDacă vrei o aromă mai intensă, adaugă câteva picături de\nesență de vanilie sau coajă rasă de lămâie/portocală.\nPoți carameliza ușor merele într-o tigaie antiaderentă cu puțină\napă și scorțișoară pentru un gust mai intens.","alergeni":"Poate conține nuci. Verifică eticheta iaurtului și a laptelui vegetal (posibile urme de soia sau gluten)","variante":"Dacă ai alergie la nuci, le poți elimina sau înlocui cu aceeași cantitate de semințe de dovleac mărunțite.","macro":{"calorii_macro":"393.2","proteine":"5.3 g","carbohidrati":"28.3 g","fibre":"1.0 g","grasimi":"27.9 g","grasimi_saturate":"20 g","greutate_portie":"200 g"}},{"id":"sarbatori-268","titlu":"Prăjitură de Morcovi","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":268,"portii":"8","timp_minute":40,"calorii":151,"ingrediente":["200 g morcovi rași","200 g făină integrală","50 g nuci măcinate","100 ml lapte de soia","8 g ulei de cocos","2 g scorțișoară","5 g praf de copt"],"descriere":"Un desert clasic reinterpretat într-o variantă sănătoasă, bogată în\nfibre, grăsimi bune și gust autentic de scorțișoară. Perfectă pentru\nmicul dejun sau o gustare dulce, dar echilibrată.","pasi":"1.Preîncălzește cuptorul la 180°C.\n2.Amestecă făina integrală cu praful de copt, scorțișoara și nucile\nmăcinate.\n3.Adaugă morcovii rași, laptele de soia și uleiul, amestecând\npână obții o compoziție omogenă.\n4.Toarnă aluatul într-o tavă tapetată cu hârtie de copt.\n5.Coace 25–30 minute sau până când trece testul scobitorii.\n6.Las-o să se răcească înainte de a o tăia în 8 felii egale.","sfaturi":"Un strat de cremă din iaurt vegetal cu vanilie o transformă într-\nun desert festiv.\nPoți adăuga 2 linguri de stafide sau curmale tocate pentru un\nplus de dulceață naturală.","alergeni":"Conține gluten (din făină) și nuci","variante":"Dacă ai alergie la nuci, le poți înlocui cu aceeași cantitate de semințe de floarea-soarelui mărunțite, care oferă textură și grăsimi bune, menținând aportul caloric foarte apropiat de varianta originală; iar dacă ești intolerant la gluten, poți folosi făină fără gluten în aceeași cantitate pentru o consistență asemănătoare.","macro":{"calorii_macro":"151","proteine":"5 g","carbohidrati":"21.5 g","fibre":"4.1 g","grasimi":"4.6 g","grasimi_saturate":"1 g"}},{"id":"sarbatori-269","titlu":"Tartă cu Mere și Scorțișoară","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":269,"portii":"8","timp_minute":45,"calorii":192,"ingrediente":["300 g făină","40 ml ulei de cocos","100 ml apă rece","300 g mere mari","5 g scorțișoară","10 g stevia"],"descriere":"Un desert clasic reinterpretat într-o variantă simplă și naturală, fără\nzahăr rafinat, cu o crustă fragedă și mere parfumate coapte lent.","pasi":"1.Într-un bol, amestecă făina cu uleiul și apa rece până obții un\naluat omogen, ușor elastic.\n2.Întinde aluatul într-o foaie subțire și așază-l într-o tavă tapetată\ncu hârtie de copt.\n3.Curăță merele, taie-le felii subțiri și așază-le deasupra aluatului.\n4.Presară scorțișoară și stevia, apoi pliază ușor marginile tartei\npeste mere.\n5.Coace la 180°C timp de 30–35 de minute, până crusta devine\naurie și merele sunt moi.\n6.Las-o să se răcească ușor înainte de a o tăia în 8 felii egale.","sfaturi":"Poți adăuga câteva nuci mărunțite pentru un plus de crocant și\ngrăsimi sănătoase.\nServește cu un sos de iaurt vegetal cu vanilie pentru extra\naromă.","alergeni":"Conține gluten (din făină)","variante":"Dacă ai intoleranță la gluten, poți înlocui făina clasică cu aceeași cantitate de făină fără gluten, iar dacă ai sensibilitate la scorțișoară, o poți schimba cu aceeași cantitate de pudră de vanilie naturală, păstrând un aport caloric asemănător și o aromă la fel de plăcută.","macro":{"calorii_macro":"192","proteine":"3.8 g","carbohidrati":"32 g","fibre":"1 g","grasimi":"0 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-270","titlu":"Cremă de Griș cu Lapte Vegetal","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":270,"portii":"1","timp_minute":15,"calorii":310,"ingrediente":["355 g lapte de soia","42 g griș","4 g sirop de agave scorțișoară – după gust"],"descriere":"Un desert simplu, cremos și reconfortant, ideal pentru momentele în\ncare vrei ceva dulce, dar ușor. Se prepară rapid și poate fi savurat\natât cald, cât și rece.","pasi":"1.Pune laptele de soia într-un vas și adu-l aproape de punctul de\nfierbere.\n2.Adaugă grișul în ploaie, amestecând continuu cu un tel pentru a\nevita formarea cocoloașelor.\n3.Fierbe 5–6 minute până când crema capătă consistență.\n4.Îndulcește cu sirop de agave și aromatizează cu scorțișoară.\n5.Servește caldă sau las-o să se răcească pentru o textură mai\ndensă.","sfaturi":"Servește cu fructe proaspete sau sos de fructe de pădure\npentru un desert mai bogat în antioxidanți.\nAdaugă 1 linguriță de vanilie pentru un gust mai intens.","alergeni":"Conține gluten (din griș) și soia","variante":"Dacă ești alergică la soia, poți folosi aceeași cantitate de lapte de migdale neîndulcit, menținând textura și aportul caloric foarte apropiat.","macro":{"calorii_macro":"310","proteine":"17.8 g","carbohidrati":"4.4 g","fibre":"0 g","grasimi":"7.8 g","grasimi_saturate":"1 g","greutate_portie":"380 g"}},{"id":"sarbatori-272","titlu":"Chec cu Banane","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":272,"portii":"10","timp_minute":50,"calorii":131,"ingrediente":["3 banane coapte","200 g făină integrală","50 g nuci","1 linguriță praf de copt","2 linguri ulei"],"descriere":"Un chec pufos, dulce natural din banane coapte, bogat în fibre și\ngrăsimi bune. Perfect pentru mic dejun sau gustare între mese.","pasi":"1.Preîncălzește cuptorul la 180°C și tapetează o formă de chec\ncu hârtie de copt.\n2.Pasează bananele într-un bol până devin o cremă omogenă.\n3.Adaugă făina, praful de copt, uleiul și jumătate din nuci,\namestecând bine.\n4.Toarnă compoziția în tavă și presară deasupra restul de nuci.\n5.Coace timp de 35–40 de minute, până când trece testul\nscobitorii.\n6.Lasă checul să se răcească înainte de a-l tăia în 10 felii egale.","sfaturi":"Adaugă stafide sau fulgi de ciocolată fără zahăr pentru un plus\nde aromă.\nPoți adăuga 1 linguriță de scorțișoară pentru aromă.\nServește cu iaurt vegetal și fructe proaspete pentru un mic dejun\ncomplet.","alergeni":"Conține gluten (din făină) și nuci","variante":"Dacă ai alergie la nuci, le poți înlocui cu aceeași cantitate de semințe de floarea-soarelui mărunțite, iar dacă ești intolerant la gluten, poți folosi făină fără gluten în aceeași cantitate, menținând textura și aportul caloric similar cu varianta originală.","macro":{"calorii_macro":"130.6","proteine":"3.6 g","carbohidrati":"20.3 g","fibre":"3.2 g","grasimi":"4.5 g","grasimi_saturate":"0.7 g","greutate_portie":"50 g"}},{"id":"sarbatori-276","titlu":"Salată Boeuf","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":276,"portii":"6","timp_minute":35,"calorii":139,"ingrediente":["Pentru salată:","300 g piept de pui","300 g cartofi","200 g morcovi","150 g mazăre","150 g castraveți murați","Pentru maioneză light:","200 g iaurt grecesc 2%","20 g muștar","15 ml zeamă de lămâie după gust: sare, piper"],"descriere":"O reinterpretare ușoară și echilibrată a celebrei salate tradiționale,\ncu maioneză light din iaurt grecesc. Gust autentic, dar mult mai\nușoară și potrivită pentru un stil de viață sănătos.","pasi":"1.Fierbe pieptul de pui, cartofii, morcovii și mazărea până devin\nfragede.\n2.Taie toate ingredientele în cubulețe mici și lasă-le să se\nrăcească.\n3.Amestecă într-un bol iaurtul, muștarul și zeama de lămâie pentru\na forma maioneza light.\n4.Într-un vas mare, combină legumele și pieptul de pui cu\nmaioneza, potrivind de sare și piper.\n5.Lasă salata la frigider cel puțin 1 oră înainte de servire.","sfaturi":"Iaurtul grecesc înlocuiește perfect maioneza\nTăierea uniformă e esențială pentru aspect\nSe păstrează 2 zile la frigider","alergeni":"lactoză (iaurt grecesc), muștar","variante":"fără lactate: înlocuiește iaurtul grecesc cu maioneză din avocado sau sos pe bază de tofu.","macro":{"calorii_macro":"138.7","proteine":"15.5 g","carbohidrati":"12 g","fibre":"3.3 g","grasimi":"1.4 g","grasimi_saturate":"0.3 g","greutate_portie":"220 g"}},{"id":"sarbatori-277","titlu":"Salată de Icre","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":277,"portii":"2","timp_minute":35,"calorii":201,"ingrediente":["48 g icre crude (știucă / crap / hering)","32 ml ulei de măsline","16 g pâine integrală (miez, înmuiat și bine stors)","16 g ceapă mică","10 ml zeamă de lămâie","Sare – după gust"],"descriere":"O pastă fină, aerată și savuroasă, perfectă pentru tartine rapide\nsau gustări festive.","pasi":"1.Stoarce bine miezul de pâine și pune-l în robot cu icrele.\n2.Mixează și adaugă treptat uleiul până devine o cremă aerată.\n3.Adaugă zeama de lămâie, ceapa tocată foarte fin și potrivește\nde sare.","sfaturi":"Pentru o variantă mai light, înlocuiește jumătate din ulei cu iaurt\ngrecesc 2% – scazi aproape 40% din calorii.\nSe poate adăuga și mărar tocat fin pentru un gust mai fresh.\nSalata se păstrează la frigider, în cutie ermetică, max. 2 zile.","alergeni":"pește, gluten, lactoză (dacă pâinea e înmuiată în lapte)","variante":"pâinea albă poate fi înlocuită cu pâine integrală sau fără gluten, iar laptele cu lapte vegetal neîndulcit.","macro":{"calorii_macro":"201","proteine":"1 g","carbohidrati":"3.3 g","fibre":"0 g","grasimi":"16.3 g","grasimi_saturate":"2.4 g","greutate_portie":"60 g"}},{"id":"sarbatori-278","titlu":"Drob cu Ficăței","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":278,"portii":"12","timp_minute":60,"calorii":193,"ingrediente":["800 g ficăței de pui","200 g ouă crude","200 g ouă fierte tari (pentru interior)","2 legături ceapă verde (aprox. 150 g)","2 legături usturoi verde (aprox. 150 g)","1 legătură pătrunjel verde (50 g)","1 legătură mărar verde (50 g)","100 g pesmet","30 ml ulei","Sare, piper"],"descriere":"O variantă mai ușoară și mai sănătoasă a drobului tradițional, cu\nficăței de pui și multe verdețuri aromate. Perfect pentru mesele de\nsărbătoare, dar și ca gustare bogată în proteine.","pasi":"1.Spală ficățeii și fierbe-i 10 minute în apă ușor sărată, apoi lasă-i\nsă se răcească.\n2.Toacă verdețurile mărunt și călește-le ușor în ulei timp de 2–3\nminute.\n3.Amestecă ficățeii tocați grosier cu verdețurile, ouăle crude,\npesmetul, sarea și piperul.\n4.Pune jumătate din compoziție într-o tavă tapetată cu hârtie de\ncopt, adaugă ouăle fierte pe mijloc și acoperă cu restul\ncompoziției.\n5.Coace la 180°C timp de 40–45 de minute până se rumenește\nfrumos.\n6.Lasă drobul să se răcească înainte de a-l felia.","sfaturi":"Ficățeii dau un gust mai delicat și o textură mai fragedă decât\norganele de miel.\nPentru un plus de aromă, poți adăuga cimbru sau rozmarin.\nSe servește rece, tăiat felii, alături de salată verde și ridichi.","alergeni":"ouă, gluten (pesmet)","variante":"înlocuiește pesmetul cu fulgi de ovăz măcinați pentru mai multe fibre.","macro":{"calorii_macro":"192.5","proteine":"15.4 g","carbohidrati":"0.6 g","fibre":"0.1 g","grasimi":"8.8 g","grasimi_saturate":"2.5 g","greutate_portie":"135 g"}},{"id":"sarbatori-279","titlu":"Pastă de Jumări Dietetice","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":279,"portii":"12","timp_minute":40,"calorii":455,"ingrediente":["1,2 kg piele de pui (cu puțină grăsime)","1 ceapă medie (100 g)","2 căței de usturoi","100 ml apă","5 g sare","1 linguriță boia dulce","Piper, după gust"],"descriere":"O reinterpretare light a gustului clasic românesc — păstrează\naroma autentică, dar elimină excesul de grăsime. Excelentă ca\naperitiv sau gustare proteică.","pasi":"1.Fierbe pielea 25–30 min, scurge și toacă.\n2.Pune-o într-o tigaie antiaderentă fără ulei până devine aurie.\n3.Călește ceapa și usturoiul, apoi mixează totul cu condimentele\npână obții o pastă fină.\n4.Pentru o textură mai moale, adaugă puțin iaurt sau grăsime\ntopită.","sfaturi":"Folosirea cărnii de pasăre reduce la jumătate caloriile față de\nvarianta clasică.","alergeni":"nu conține alergeni majori; totuși, se recomandă atenție la cantitatea de sare pentru cei cu hipertensiune","variante":"pentru persoane hipertensive, se poate reduce sau elimina complet sarea și compensa cu ierburi aromatice.","macro":{"calorii_macro":"455","proteine":"7.1 g","carbohidrati":"1 g","fibre":"0.2 g","grasimi":"40 g","grasimi_saturate":"12.5 g","greutate_portie":"70 g"}},{"id":"sarbatori-280","titlu":"Cârnați de Casă","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":280,"portii":"10","timp_minute":60,"calorii":202,"ingrediente":["1 kg carne de curcan (pulpe dezosate, fără piele)","500 kg carne de vită slabă (pulpa)","200 g pulpă de porc slabă","20 g usturoi (pisat)","30 g sare","10 g piper măcinat","10 g boia dulce","3 g boia iute (după gust)","3 g cimbru uscat","250 ml apă rece","Mațe subțiri de porc sau vită – pentru umplere"],"descriere":"Cârnați preparați acasă din carne slabă, cu gust tradițional, dar\nmult mai echilibrați și ușor de digerat.","pasi":"1.Toacă toate tipurile de carne și amestecă-le într-un bol mare.\n2.Adaugă sarea, condimentele, usturoiul și apa rece. Frământă\nbine până obții o compoziție omogenă.\n3.Acoperă vasul și lasă-l la frigider pentru 12 ore, ca aromele să\nse combine.\n4.Umple mațele cu amestecul și leagă-le la capete la\ndimensiunea dorită.\n5.Gătește-i pe grătar, în tigaie antiaderentă sau la cuptor\n(180°C, 25–30 minute), până se rumenesc frumos.","sfaturi":"Dacă vrei o variantă mai slabă, elimină pulpa de porc și\nfolosește doar curcan și vită.\nPoți adăuga semințe de fenicul sau coriandru pentru o aromă\ndiferită.\nCârnații se pot congela după ce sunt umpluți, rezistă 3–4 luni la\ncongelator.","alergeni":"pot conține urme de gluten dacă se folosesc condimente procesate; se recomandă verificarea etichetelor","variante":"adaugă coriandru, ienibahar sau semințe de fenicul măcinate pentru un gust mai intens.","macro":{"calorii_macro":"201.3","proteine":"31.9 g","carbohidrati":"0 g","fibre":"0 g","grasimi":"6.3 g","grasimi_saturate":"1.8 g","greutate_portie":"140 g"}},{"id":"sarbatori-281","titlu":"Tobă","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":281,"portii":"10","timp_minute":180,"calorii":127,"ingrediente":["Pentru compoziție","400 g piept de curcan","300 g pulpă de porc slabă (fără grăsime)","200 g inimă de porc (opțional, pentru textură autentică)","150 g ficat de pui (opțional – crește gustul)","150 g ceapă","5 g usturoi","2 buc foi de dafin","1 linguriță boabe piper","1 linguriță sare","½ linguriță piper măcinat","½ linguriță boia dulce","1 linguriță cimbru","Pentru gelifiere","350 ml supă din fierberea cărnii","10 g gelatină pudră","Pentru învelire","1 buc stomac de porc curățat"],"descriere":"O reinterpretare ușoară și sănătoasă a tradiționalei tobe\nromânești, gândită să păstreze gustul autentic, dar cu mult mai\npuțină grăsime și ingrediente curate.\nFierberea","pasi":"1.Fierbe curcanul, pulpa de porc, inima și ficatul cu ceapa,\nusturoiul, foile de dafin și boabele de piper.\n2.Scurge și păstrează 350 ml din supa rezultată.\nTocare\n1.Taie carnea și organele bucăți mici (cât o nucă).\n2.Condimentează cu sare, piper, boia și cimbru.\nGelifiere\n1.Dizolvă gelatina în supa caldă.\n2.Toarnă peste carnea tăiată și amestecă foarte bine.\nMontare\n1.Umple stomacul de porc (sau forma de ruladă) cu compoziția.\n2.Strânge bine și presează ușor.\nFinalizare\n1.Fierbe la foc mic 20–25 minute.\n2.Răcește minim 6 ore, ideal peste noapte.","sfaturi":"Dacă vrei gust mai intens → adaugă 30 g mușchiuleț afumat\nslab.\nPentru toba foarte fermă → crește gelatina la 12–13 g.","alergeni":"Niciun alergen major (cu excepția stomacului de porc, dacă cineva are sensibilități)","variante":"adaugă coriandru, ienibahar sau semințe de fenicul măcinate pentru un gust mai intens.","macro":{"calorii_macro":"126.8","proteine":"22.4 g","carbohidrati":"0.4 g","fibre":"0 g","grasimi":"1.8 g","grasimi_saturate":"0.6 g","greutate_portie":"140 g"}},{"id":"sarbatori-282","titlu":"Caltaboș/lebăr","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":282,"portii":"10","timp_minute":90,"calorii":254,"ingrediente":["1 kg ficat de pui","500 g piept de curcan (pentru textură și proteine)","200 g ceapă","150 g orez","5 g boabe de piper","3 foi de dafin sare – după gust mațe subțiri de vită sau porc – pentru umplere"],"descriere":"O versiune echilibrată și mai ușoară a tradiționalului lebăr,\npreparată din ficat și piept de curcan – cu gust autentic, dar mult\nmai ușor pentru digestie.","pasi":"1.Fierbe ficatul, pieptul de curcan, ceapa, dafinul și piperul boabe\nîn apă cu sare timp de 40–45 minute.\n2.Fierbe separat orezul până devine ușor moale, apoi scurge-l\nbine.\n3.Toacă carnea și ficatul, apoi amestecă-le cu orezul și puțin din\nsupa de fierbere pentru a obține o compoziție legată.\n4.Umple mațele și leagă-le la capete.\n5.Fierbe caltaboșii în apă clocotită, la foc mic, 25–30 minute.\n6.După răcire, se păstrează la frigider până la 5 zile.","sfaturi":"Adaugă verdeață proaspătă (pătrunjel, mărar) pentru aromă\nmai fresh.\nServește cu murături sau salată de sfeclă pentru un contrast ușor\nacrișor.\nSe păstrează la frigider 3–4 zile sau se congelează pentru mai\nmult timp.","alergeni":"cereale cu gluten (orez, potențial urme în mațe), organe (ficat)","variante":"înlocuiește orezul cu hrișcă.","macro":{"calorii_macro":"254","proteine":"32.3 g","carbohidrati":"12 g","fibre":"0.15 g","grasimi":"5.4 g","grasimi_saturate":"1 g","greutate_portie":"210 g"}},{"id":"sarbatori-283","titlu":"Piftie de Curcan","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":283,"portii":"8","timp_minute":180,"calorii":192,"ingrediente":["800 g pulpe de curcan cu os","400 g aripi de curcan","100 g morcov","50 g țelină","50 g ceapă","30 g usturoi","2 bucăți foi de dafin","5 g piper boabe","15 g gelatină (opțional) după gust: sare"],"descriere":"O variantă mai ușoară și echilibrată a tradiționalei piftii, ideală\npentru mesele de sărbătoare. Bogată în colagen natural, dar cu un\nconținut redus de grăsimi.","pasi":"1.Pune carnea la fiert în apă rece cu sare, spumând la nevoie.\n2.Adaugă legumele, dafinul și piperul și fierbe la foc mic 2–2,5\nore, până când carnea se desprinde de pe os.\n3.Strecoară supa, adaugă usturoiul pisat și, dacă vrei o piftie mai\nlegată, dizolvă gelatina în supa caldă.\n4.Așază bucățile de carne și legume în forme, toarnă zeama și\nlasă la frigider 6–8 ore, până se încheagă.","sfaturi":"Testează gelificarea punând puțină zeamă la rece\nDecorează cu morcov și ou fiert\nServește cu muștar și oțet","alergeni":"țelină","variante":"adaugă felii de ou fiert în castronele înainte să torni zeama (aspect plăcut, plus proteine).","macro":{"calorii_macro":"191.5","proteine":"24.4 g","carbohidrati":"1.4 g","fibre":"0.4 g","grasimi":"5 g","grasimi_saturate":"1.2 g","greutate_portie":"380 g"}},{"id":"sarbatori-284","titlu":"Ouă Umplute Light","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":284,"portii":"2","timp_minute":60,"calorii":261,"ingrediente":["VARIANTĂ 1: UMPLUTURĂ CU TON ȘI","IAURT","150 g ton în conservă (în suc propriu, scurs)","100 g iaurt grecesc","4 ouă fierte (≈ 200 g) sare, piper, zeamă de lămâie","VARIANTĂ 2: UMPLUTURĂ CU HUMMUS","SI IAURT","150 g năut fiert","80 g iaurt grecesc","5 g ulei de măsline","3 ouă fierte (≈ 150 g) sare, zeamă de lămâie, usturoi – după gust"],"descriere":"Ouă umplute într-o variantă mult mai ușoară și echilibrată, perfecte\nca gustare rapidă sau aperitiv sănătos, cu două umpluturi cremoase\nși pline de savoare.\nVarianta 1:","pasi":"1.Taie ouăle în jumătate, scoate gălbenușurile și amestecă-le cu\ntonul, iaurtul și condimentele.\n2. Pasează bine compoziția și umple jumătățile de ou.\n3.Poți decora cu pătrunjel tocat sau boia dulce.\nVarianta 2:\n1.Pasează năutul cu iaurtul, uleiul și condimentele până devine o\npastă fină.\n2.Umple ouăle și decorează cu paprika sau verdeață","sfaturi":"Fierbe ouăle exact 9–10 minute pentru gălbenuș complet gătit\nși textură cremoasă.\nPentru o umplutură extra fină, pasează compoziția cu blenderul\nvertical.","alergeni":"ouă, pește (varianta 1), lactoză (din iaurt)","variante":"Pentru o variantă fără lactoză, folosește iaurt vegetal. În loc de ton, poți folosi piept de pui mărunțit sau brânză cottage.","macro":{"calorii_macro":"261","proteine":"35.8 g","carbohidrati":"2.6 g","fibre":"0 g","grasimi":"12 g","grasimi_saturate":"3.5 g"}},{"id":"sarbatori-285","titlu":"Lipie Caldă cu Piept de Pui","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":285,"portii":"1","timp_minute":15,"calorii":225,"ingrediente":["58 g piept de pui afumat","17 g lipie integrală","15 g cașcaval light","15 g roșie","15 g castravete murat","10 g salată verde","15 g iaurt grecesc 2%","6 g maioneză light","2 g ulei de măsline","58 ml lapte semidegresat 1.5%","Sare și piper – după gust"],"descriere":"O lipie caldă și gustoasă, inspirată din mesele simple de la țară, în\ncare aroma pieptului de pui afumat se împletește cu prospețimea\nlegumelor, oferind un prânz hrănitor și plin de savoare.","pasi":"1.Încălzește lipia, unge-o cu iaurt și maioneză light, apoi adaugă\npuiul, cașcavalul, roșia, castravetele și salata.\n2.Rulează strâns, mai încălzește 1–2 min până se topește\ncașcavalul, taie pe jumătate și servește cu lapte semidegresat.","sfaturi":"Poți adăuga și ardei copt sau ceapă roșie pentru extra aromă.\nÎnlocuiește puiul afumat cu piept de curcan la grătar pentru o\nvariantă mai slabă în sodiu.\nSe potrivește foarte bine și cu un sos de iaurt cu usturoi.","alergeni":"gluten (lipie), lactoză (iaurt, lapte, cașcaval), muștar (dacă maioneza conține)","variante":"pentru un plus de fibre, folosește lipie din făină de secară.","macro":{"calorii_macro":"225","proteine":"18.1 g","carbohidrati":"4.6 g","fibre":"0.5 g","grasimi":"6.6 g","grasimi_saturate":"2 g","greutate_portie":"200 g"}},{"id":"sarbatori-286","titlu":"Mini-tarte cu Salată de Ton","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":286,"portii":"6","timp_minute":35,"calorii":191,"ingrediente":["Pentru coșulețele/mini-tarte","120 g făină","40 g unt rece 82%","1 buc ou","1 praf sare","10 ml apă rece (dacă aluatul cere)","Pentru salata de ton","150 g ton în apă, scurs","80 g iaurt grecesc 2%","20 g maioneză light","1 buc gălbenuș fiert (opțional, pentru gust clasic de maioneză)","1 linguriță muștar","30 g ceapă roșie tocată fin","1 buc castravete murat mic, tocat","1 praf piper","1 praf sare zeamă de lămâie, după gust"],"descriere":"Un preparat ușor, echilibrat și foarte rapid, care combină mini–\ntarte fragede cu o salată cremoasă de ton, perfectă pentru gustări,\naperitive sau o masă light, bogată în proteine și sățioasă.\nMini-tarte","pasi":"1.Amestecă făina cu untul rece până devine nisipos.\n2.Adaugă oul, sarea și puțină apă dacă e nevoie.\n3.Întinde aluatul, decupează cercuri și pune-le în forme de mini-\ntarte.\n4.Înțeapă baza cu furculița.\n5.Coace 10–12 minute la 180°C până devin aurii. Lasă-le să se\nrăcească.\nSalata de ton\n1.Amestecă tonul scurs cu iaurtul, maioneza light, gălbenușul fiert\n(opțional) și muștarul.\n2.Adaugă ceapa, castravetele murat, sarea, piperul și zeama de\nlămâie.\n3.Omogenizează bine și răcește 10 minute.\nMontare\n1.Umple fiecare mini-tartă cu salată de ton.\n2.Decorează cu pătrunjel, măsline sau ardei copt.\n3.Servește imediat sau păstrează la rece.","sfaturi":"Pentru extra volum, poți adăuga 30–40 g țelină rasă fin.\nMerge perfect ca aperitiv la masa de sărbătoare sau ca\ngustare proteică.","alergeni":"Ouă, gluten, pește, lactate, muștar","variante":"Fără lactoză: folosește iaurt fără lactoză și maioneză fără lactoză — textura rămâne identică. Fără gluten: prepară tartele cu mix de făină fără gluten; coșulețele ies la fel de fragede.","macro":{"calorii_macro":"190.7","proteine":"11.3 g","carbohidrati":"16.3 g","fibre":"0.05 g","grasimi":"7.8 g","grasimi_saturate":"2.6 g","greutate_portie":"100 g"}},{"id":"sarbatori-287","titlu":"Brânză de Vaci cu Smântână și Mărar","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":287,"portii":"1","timp_minute":10,"calorii":120,"ingrediente":["94 g brânză de vaci slabă","19 g smântână 12%","9 g mărar proaspăt","13 g ceapă verde","2 g usturoi","31 g roșii cherry (pentru servire)","31 g castraveți (pentru servire)","Sare, piper – după gust"],"descriere":"Un mic dejun sau o gustare excelentă, bogată în proteine și cu o\ntextură cremoasă, ușor aromată de verdeață.","pasi":"1.Amestecă brânza de vaci cu smântâna până devine cremoasă.\n2.Adaugă mărarul tocat, ceapa verde, usturoiul și condimentele.\n3.Servește alături de legume proaspete.","sfaturi":"sănătoase.\nSe potrivește excelent cu pâine integrală prăjită sau ca\numplutură pentru lipii.\nPoți transforma preparatul într-o cremă tartinabilă, mixând\ningredientele cu blenderul.","alergeni":"lactoză (brânză, smântână/iaurt)","variante":"pentru un gust diferit, adaugă pătrunjel sau busuioc în loc de mărar.","macro":{"calorii_macro":"120","proteine":"14.3 g","carbohidrati":"5.2 g","fibre":"0 g","grasimi":"2.3 g","grasimi_saturate":"1.5 g","greutate_portie":"200 g"}},{"id":"sarbatori-288","titlu":"Mămăligă cu Brânză și Ou Ochi","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":288,"portii":"1","timp_minute":15,"calorii":353,"ingrediente":["36 g mălai","54 g ou de găină","45 g albuș de ou","36 g telemea light de vacă","27 g iaurt grecesc 2%","3 g ulei de măsline","Sare – după gust"],"descriere":"O rețetă tradițională care poartă cu ea gustul copilăriei și\nsimplitatea meselor de acasă — reinterpretată într-o variantă mai\nușoară, dar păstrând autenticitatea și aroma care ne leagă de\nfamilia și de rădăcinile noastre.","pasi":"1.Fierbe mălaiul în apă cu sare până devine cremos. Gătește un\nou ochi în puțin ulei de măsline și, separat, albușul simplu.\n2.Pune pe farfurie mămăliga caldă, adaugă telemea light\nfărâmițată și o lingură de iaurt grecesc, apoi oul ochi și albușul.","sfaturi":"Poți adăuga verdețuri proaspete (mărar, pătrunjel) pentru extra\naromă.\nServește cu ardei copți sau castraveți murați pentru un gust\ntradițional.\nDacă vrei un plus de proteine, adaugă încă 1 albuș bătut la oul\nochi.","alergeni":"ouă, lactoză (iaurt, telemea). Poți adăuga verdețuri proaspete (mărar, pătrunjel) pentru extra aromă. Servește cu ardei copți sau castraveți murați pentru un gust tradițional. Dacă vrei un plus de proteine, adaugă încă 1 albuș bătut la oul ochi","variante":"poți transforma preparatul într-o versiune mai consistentă adăugând 100 g piept de curcan la grătar alături.","macro":{"calorii_macro":"353","proteine":"23.4 g","carbohidrati":"29.8 g","fibre":"0.4 g","grasimi":"15.2 g","grasimi_saturate":"4 g","greutate_portie":"360 g"}},{"id":"sarbatori-289","titlu":"Tartine cu Cremă de Brânză și Somon","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":289,"portii":"8","timp_minute":15,"calorii":70,"ingrediente":["8 felii pâine integrală (subțire, prăjită ușor)","120 g cremă de brânză light","60 g iaurt grecesc 2% (pentru mai multă cremozitate și proteine)","150 g somon afumat","10 g mărar tocat","1 buc lămâie (coajă + suc)"],"descriere":"O gustare fresh, proteică și foarte rapidă, ce combină textura\ncremoasă a brânzei cu aroma delicată a somonului afumat —\nperfectă pentru mic dejun, brunch sau aperitive elegante, într-o\nvariantă light.\nCrema","pasi":"1.Amestecă crema de brânză cu iaurtul, mărarul, piperul și puțină\ncoajă de lămâie.\n2.Adaugă 1 linguriță zeamă de lămâie pentru prospețime.\nAsamblare\n1.Prăjește ușor feliile de pâine integrală.\n2.Întinde crema light pe fiecare felie.\n3.Adaugă 1–2 fâșii de somon afumat pe fiecare tartină.\n4.Decorează cu capere, ceapă roșie sau felii de castravete.\n5.Stropește foarte ușor cu zeamă de lămâie.","sfaturi":"Dacă vrei tartine mai fresh → adaugă 1 linguriță hrean în\ncremă.\nPentru aspect perfect → rulează fâșiile de somon în formă de\n„trandafir”.\nPentru extra proteine → folosește 150 g cremă de brânză high-\nprotein (skyr cream-cheese).","alergeni":"gluten (pâine), lactoză (cremă de brânză, iaurt), pește (somon)","variante":"Fără lactoză: folosește cremă de brânză și iaurt fără lactoză — textura rămâne identică.","macro":{"calorii_macro":"69.9","proteine":"7.3 g","carbohidrati":"3.3 g","fibre":"0 g","grasimi":"3.0 g","grasimi_saturate":"0.8 g","greutate_portie":"50 g"}},{"id":"sarbatori-291","titlu":"Sarmale cu Mămăligă și Iaurt","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":291,"portii":"2","timp_minute":90,"calorii":311,"ingrediente":["Sarmale","100 g carne tocată de vită (pulpă)","120 g varză murată (frunze)","25 g orez alb","25 g ceapă","25 g morcovi","25 g sos de roșii fără zahăr","5 g ulei de măsline (≈ 1 linguriță)","2–3 g cimbru uscat","5 g mărar verde","2–3 g sare","Mămăligă","50 g mălai","200 ml apă","2 g sare","Pentru servire","25 g iaurt grecesc 2%"],"descriere":"Un preparat tradițional reinterpretat într-o variantă mai ușoară și\nechilibrată, bogat în fibre, proteine și gust autentic.","pasi":"1.Călește ceapa și morcovul în ulei, apoi adaugă orezul și carnea.\n2.Condimentează cu sare, cimbru, mărar și sos de roșii.\n3.Rulează compoziția în foi de varză și fierbe-le 40–50 minute.\n4.Separat, prepară mămăliga din mălai, apă și sare.\n5.Servește sarmalele cu iaurt grecesc și mămăligă caldă.","sfaturi":"Pentru un gust mai aromat, adaugă 1–2 căței de usturoi zdrobit\nîn umplutură.\nPoți fierbe sarmalele și în cuptor (180°C, 60–70 min) pentru un\ngust mai intens.\nSe potrivesc bine cu ardei iute murat sau salată de sfeclă cu\nhrean.","alergeni":"lactoză (iaurt), posibil gluten (orez contaminat)","variante":"poți înlocui carnea de vită cu piept de curcan pentru un preparat și mai light.","macro":{"calorii_macro":"311","proteine":"13.1 g","carbohidrati":"33.6 g","fibre":"1.4 g","grasimi":"12.7 g","grasimi_saturate":"4 g"}},{"id":"sarbatori-292","titlu":"Sarmale de Curcan","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":292,"portii":"2","timp_minute":90,"calorii":381,"ingrediente":["200 g carne tocată de curcan (pulpa sau piept, fără pieliță)","250 g varză murată (frunze)","50 g orez alb","50 g ceapă","50 g morcovi","50 g sos de roșii fără zahăr adăugat","10 g ulei de măsline","5 g cimbru uscat","10 g mărar","100 g mămăligă","400 ml apă","5 g sare"],"descriere":"O variantă light și echilibrată a sarmalelor clasice, cu carne slabă\nde curcan, legume și sos natural de roșii — mult mai ușoare, bogate\nîn proteine și perfecte pentru o masă gustoasă fără balonare sau\ndisconfort digestiv.","pasi":"1.Călește ceapa și morcovul în ulei, apoi adaugă orezul și carnea\nde curcan.\n2.Condimentează cu sare, cimbru, mărar și sos de roșii.\n3.Rulează compoziția în foi de varză și fierbe-le 40–50 minute.\n4.Separat, pregătește mămăliga din mălai, apă și sare.\n5.Servește sarmalele cu iaurt grecesc și mămăligă caldă.","sfaturi":"Pentru un gust mai aromat, adaugă 1–2 căței de usturoi zdrobiți\nîn compoziție.\nDacă varza este prea sărată, clătește foile în apă rece înainte\nde utilizare.\nPentru o variantă extra light, elimină uleiul și înăbușe legumele în\npuțină apă.","alergeni":"lactoză (iaurt), posibil gluten (orez contaminat)","variante":"Fără lactoză: folosește iaurt fără lactoză — gustul rămâne identic.","macro":{"calorii_macro":"381","proteine":"26.1 g","carbohidrati":"37.2 g","fibre":"3.35 g","grasimi":"12.4 g"}},{"id":"sarbatori-293","titlu":"Tochitură de Porc cu Mămăligă","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":293,"portii":"2","timp_minute":50,"calorii":298,"ingrediente":["145 g cotlet de porc","45 g ardei roșu","35 g ceapă","10 g usturoi","65 g sos de roșii fără zahăr","10 g ulei de măsline","50 g mălai","130 g varză","10 g mărar verde","Sare, piper – după gust"],"descriere":"O tochitură de porc gătită ca odinioară, cu sos aromat și\nmămăliguță caldă, exact genul de mâncare de duminică ce aduce\ntoată familia la masă.","pasi":"1.Rumenește cotletul cubulețe în ulei de măsline, adaugă ceapa,\nardeiul și usturoiul, apoi sosul de roșii și fierbe la foc mic până\ncarnea devine fragedă.\n2.Fierbe mălaiul în apă cu sare pentru mămăligă. Taie varza fin,\nfreac-o cu sare, adaugă mărar, ulei, sare și piper.\n3.Servește tochitura cu mămăligă și salată de varză.","sfaturi":"Poți adăuga și ciuperci pentru un plus de volum și fibre.\nMerge foarte bine cu o salată de murături light.\nDacă vrei un sos mai cremos, încorporează la final 1 lingură de\niaurt grecesc 2%.","alergeni":"nu conține alergeni majori (atenție la intoleranța la porumb – mălai)","variante":"poți înlocui cotletul de porc cu piept de curcan pentru un preparat extra light.","macro":{"calorii_macro":"298","proteine":"19 g","carbohidrati":"25.8 g","fibre":"2 g","grasimi":"11.3 g","grasimi_saturate":"3.5 g"}},{"id":"sarbatori-294","titlu":"Varză à la Cluj","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":294,"portii":"2","timp_minute":70,"calorii":254,"ingrediente":["280 g varză albă tocată","140 g carne tocată de vită slabă","30 g orez integral","35 g ceapă","20 g morcov","3 ml ulei de măsline","55 g sos de roșii fără zahăr","35 g iaurt grecesc 2%","5 g mărar verde","Sare, piper, cimbru – după gust"],"descriere":"O rețetă tradițională reinterpretată într-o variantă echilibrată,\nbogată în proteine și cu ingrediente simple, fără prăjeli și fără sosuri\ngrase.","pasi":"1.Călește ceapa și morcovul în ulei, apoi adaugă carnea și\ncondimentele.\n2.Adaugă bulionul și fierbe ușor până se leagă compoziția.\n3.Fierbe orezul separat și combină-l cu amestecul de carne.\n4.Într-un vas termorezistent, alternează straturi de varză și carne.\n5.Adaugă deasupra iaurtul amestecat cu puțin bulion și coace\n30–40 minute la 180°C.","sfaturi":"Servește cu ardei iute murat sau pâine integrală.\nPentru un gust mai intens, adaugă și usturoi tocat în sos.\nPoți înlocui iaurtul grecesc cu smântână light 12% grăsime.","alergeni":"lactoză (iaurt), posibil gluten (dacă orezul nu e certificat)","variante":"poți adăuga și varză murată pentru un gust mai autentic.","macro":{"calorii_macro":"254","proteine":"18.8 g","carbohidrati":"23 g","fibre":"0.9 g","grasimi":"9 g","grasimi_saturate":"3 g"}},{"id":"sarbatori-295","titlu":"Chiftele Marinate","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":295,"portii":"2","timp_minute":70,"calorii":262,"ingrediente":["Pentru chiftele","210 g carne tocată de curcan","40 g ceapă","1 ou mic (≈ 50 g)","15 g pesmet integral","2 ml ulei de măsline (pentru ungere la copt)","Sare, piper, usturoi pudră – după gust","Pentru sos","140 g sos de roșii fără zahăr","30 g ceapă","30 g morcov","2 ml ulei de măsline","1 foaie mică de dafin","½ linguriță cimbru uscat","Sare, piper – după gust"],"descriere":"O versiune ușoară a rețetei clasice, fără prăjeli — chiftele fragede,\ncoapte la cuptor și acoperite cu un sos de roșii aromat.","pasi":"1.Amestecă ingredientele pentru chiftele, formează bile și așază-\nle pe o tavă unsă cu ulei.\n2.Coace la 180°C timp de 20–25 minute până devin ușor aurii.\n3.Pentru sos, călește ceapa și morcovul în ulei, adaugă roșiile,\ndafinul și condimentele. Fierbe 10–15 minute.\n4.Adaugă chiftelele în sos și mai lasă la foc mic încă 10 minute\npentru a se îmbina aromele.","sfaturi":"Se servesc cu piure de cartofi light, orez integral sau mămăligă.\nPentru un plus de savoare, adaugă usturoi proaspăt în sos.\nDacă dorești un sos mai cremos, încorporează 1 lingură de iaurt\ngrecesc 2% la final.","alergeni":"gluten (pesmet), ou","variante":"poți înlocui pesmetul cu fulgi de ovăz măcinați pentru o variantă fără gluten.","macro":{"calorii_macro":"262","proteine":"24.4 g","carbohidrati":"5.2 g","fibre":"0.4 g","grasimi":"11.3 g","grasimi_saturate":"3 g","greutate_portie":"230 g"}},{"id":"sarbatori-296","titlu":"Friptură la Tavă","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":296,"portii":"2","timp_minute":80,"calorii":330,"ingrediente":["285 g carne de vită slabă","160 g cartofi","65 g morcovi","50 g ceapă","10 ml ulei de măsline","30 ml vin alb sec","4 g usturoi (≈ 1–2 căței)","Rozmarin, cimbru – după gust","Sare și piper – după gust"],"descriere":"O rețetă clasică reinterpretată într-o versiune ușoară, gătită lent,\nfără prăjeli, cu carne fragedă și legume caramelizate perfect.","pasi":"1.Taie carnea și legumele în bucăți potrivite și așază-le într-o\ntavă.\n2.Adaugă uleiul, vinul, usturoiul zdrobit și condimentele.\n3.Acoperă tava cu folie de aluminiu și coace 50 minute la 180°C.\n4.Îndepărtează folia și mai lasă 15–20 minute pentru rumenire.","sfaturi":"Poți adăuga și ardei gras sau dovlecel pentru extra fibre.\nDacă vrei un sos mai consistent, adaugă 1 linguriță de muștar\nDijon light în lichidul de gătire.\nGarnitura ideală: salată verde proaspătă sau murături light.","alergeni":"nu conține alergeni majori (atenție doar la vin – sulfiți)","variante":"înlocuiește carnea de porc/vită cu piept de curcan pentru mai puține grăsimi.","macro":{"calorii_macro":"330","proteine":"31.4 g","carbohidrati":"15.4 g","fibre":"1.7 g","grasimi":"12.2 g","grasimi_saturate":"4 g","greutate_portie":"300 g"}},{"id":"sarbatori-297","titlu":"Pomana Porcului","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":297,"portii":"2","timp_minute":80,"calorii":353,"ingrediente":["425 g carne de porc slabă (spată sau pulpă, fără grăsime vizibilă)","6 g usturoi (≈ 2 căței)","65 ml vin roșu sec","5 ml ulei de măsline (≈ 1 linguriță)","1 foaie de dafin","½ linguriță piper boabe","Sare, cimbru, boia – după gust"],"descriere":"O rețetă clasică reinterpretată într-o versiune ușoară, gătită lent,\nfără prăjeli, cu carne fragedă și legume caramelizate perfect.","pasi":"1.Taie carnea și legumele în bucăți potrivite și așază-le într-o\ntavă.\n2.Adaugă uleiul, vinul, usturoiul zdrobit și condimentele.\n3.Acoperă tava cu folie de aluminiu și coace 50 minute la 180°C.\n4.Îndepărtează folia și mai lasă 15–20 minute pentru rumenire.","sfaturi":"Garnituri recomandate: mămăligă light, piure de cartofi cu\niaurt sau varză călită.\nPentru mai multă aromă, adaugă și rozmarin sau cimbru\nproaspăt.\nDacă vrei un sos mai legat, presară 1 linguriță de făină\nintegrală sau ½ lingură de amidon, dizolvată în apă rece.","alergeni":"nu conține alergeni majori","variante":"în loc de vin, folosește supă de legume și zeamă de lămâie, pentru o versiune fără alcool.","macro":{"calorii_macro":"353","proteine":"55.5 g","carbohidrati":"0.7 g","fibre":"0 g","grasimi":"2.5 g","grasimi_saturate":"0.5 g"}},{"id":"sarbatori-298","titlu":"Cotlet de Porc cu Fasole Verde Sote","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":298,"portii":"2","timp_minute":35,"calorii":138,"ingrediente":["100 g cotlet de porc slab (fără grăsime vizibilă)","130 g fasole verde","25 g ceapă","3 g usturoi (≈ 1 cățel mic)","3 ml ulei de măsline","40 g roșie","40 g castravete","40 g ardei gras","7 g mărar verde","Zeama de la ~⅓ lămâie","Sare și piper – după gust"],"descriere":"O masă completă, bogată în proteine și fibre, ușor de preparat,\nideală pentru prânz sau cină echilibrată.","pasi":"1.Gătește cotletul la tigaie antiaderentă sau grill, până devine\nfraged.\n2.Într-o altă tigaie, sotează ceapa, usturoiul și fasolea verde în\npuțin ulei, adaugă sare, piper și zeama de lămâie.\n3.Servește alături de legumele crude tăiate (roșie, castravete,\nardei) și presară mărar verde.","sfaturi":"Poți marina cotletul înainte de gătire în zeamă de lămâie,\nusturoi și ierburi aromatice pentru un plus de aromă.\nFasolea verde poate fi înlocuită cu sparanghel sau broccoli.\nDacă vrei un preparat și mai dietetic, gătește cotletul la cuptor\nsau airfryer fără ulei.","alergeni":"nu conține alergeni majori","variante":"înlocuiește cotletul de porc cu piept de curcan pentru mai puține grăsimi.","macro":{"calorii_macro":"137.4","proteine":"11.8 g","carbohidrati":"6.6 g","fibre":"2.2 g","grasimi":"5.7 g","grasimi_saturate":"1.6 g"}},{"id":"sarbatori-299","titlu":"Mâncărică de Fasole cu Carne de Vită","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":299,"portii":"2","timp_minute":90,"calorii":171,"ingrediente":["80 g fasole boabe fiartă","130 g pulpă de vită slabă","75 g sos de roșii fără zahăr adăugat","30 g ceapă","30 g morcovi","5 g usturoi (≈ 1 cățel)","5 ml ulei de măsline","150 ml apă","Sare, piper – după gust","Pătrunjel verde – opțional, pentru decor"],"descriere":"O mâncărică de fasole cu carne de vită, gătită molcom ca în\ncasele de la țară, cu sos gros și arome bogate, exact preparatul\ncald și sățios care aduce confort în orice zi.","pasi":"1.Taie carnea de vită cubulețe mici și rumenește-o ușor în ulei de\nmăsline.\n2. Adaugă ceapa și morcovii tocați, gătește 3–4 min.\n3. Pune usturoiul zdrobit, fasolea fiartă și sosul de roșii.\n4. Adaugă apa și condimentează cu sare și piper.\n5. Fierbe la foc mic 25–30 min, până carnea devine fragedă și\nsosul se îngroașă.","sfaturi":"Poți adăuga și ardei gras sau țelină apio pentru mai multă\naromă.\nSe servește excelent cu salată verde sau murături light.\nDacă vrei un sos mai dens, adaugă 1 lingură de iaurt grecesc\n2% la final.","alergeni":"nu conține alergeni majori (atenție la sensibilitatea la leguminoase","variante":"fasolea se poate înlocui cu năut sau linte roșie pentru diversitate.","macro":{"calorii_macro":"170.7","proteine":"18.9 g","carbohidrati":"12.2 g","fibre":"3.6 g","grasimi":"3.2 g","grasimi_saturate":"0.8 g"}},{"id":"sarbatori-300","titlu":"Tocăniță de Curcan","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":300,"portii":"1","timp_minute":25,"calorii":291,"ingrediente":["150 g piept de curcan dezosat, file, fără piele","30 g ceapă","50 g morcovi","5 g usturoi","30 g sos de roșii fără zahăr","5 g ulei de măsline vârf cuțit sare"],"descriere":"O tocăniță rapidă, ușoară și aromată, reinterpretată într-o variantă\nsănătoasă, cu carne slabă de curcan și sos natural de roșii, fără\nprăjeli și fără ulei în exces.","pasi":"1.Taie curcanul cubulețe și rumenește-l 2–3 minute în uleiul de\nmăsline.\n2.Adaugă ceapa, morcovul și usturoiul tocate fin. Gătește 4–5\nminute.\n3.Toarnă sosul de roșii și 50–80 ml apă.\n4.Asezonează cu boia, cimbru, sare și piper.\n5.Fierbe la foc mic 12–15 minute până scade și devine cremos.\n6.Presară pătrunjel proaspăt la final.","sfaturi":"O poți servi cu salată verde, castraveți, varză crudă sau\nbroccoli sotat.\nPentru extra volum fără calorii → adaugă 50–100 g dovlecel în\ntocăniță.","alergeni":"nu conține alergeni majori (atenție la sensibilitatea la leguminoase","variante":"pentru o aromă diferită, poți folosi boia afumată sau cimbru proaspăt fără schimbări calorice.","macro":{"calorii_macro":"291","proteine":"46.3 g","carbohidrati":"6 g","fibre":"1.4 g","grasimi":"5.1 g","grasimi_saturate":"0.9 g"}},{"id":"sarbatori-301","titlu":"Varză cu Rață","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":301,"portii":"1","timp_minute":70,"calorii":385,"ingrediente":["130 g piept de rață fără piele","240 g varză albă, tocată fin","40 g ceapă galbenă, tocată","25 g morcov, ras","15 g pastă de roșii","3 ml ulei de măsline","¼ linguriță piper","¼ linguriță chimion (opțional)","Sare – după gust","1 foaie de dafin","50 ml apă fierbinte"],"descriere":"O variantă ușoară și aromată de varză cu rață, perfectă atunci\ncând vrei un preparat tradițional, dar gătit sănătos și cu\ningrediente simple.","pasi":"1.Taie pieptul de rață cuburi. Încinge 5 g ulei și gătește bucățile\nla foc mare 3–4 minute, doar cât să prindă culoare. Scoate-le\ndeoparte.\n2. În aceeași tigaie adaugă restul de ulei, ceapa și morcovul.\nSotează 5 minute.\n3. Pune varza tocată, amestecă, apoi adaugă pasta de roșii,\nsarea, piperul, chimionul și foile de dafin.\n4. Toarnă apa fierbinte și las-o 10 minute la foc mic, amestecând\nocazional.\n5. Mută totul într-un vas termorezistent, adaugă bucățile de rață,\nacoperă cu folie și gătește 40 minute la 180°C.\n6.Scoate folia și mai lasă 10 minute ca să se rumenească ușor.\n7.Amestecă bine și împarte în 4 porții egale.","sfaturi":"O poți servi cu mărar proaspăt pentru aromă extra.\nDacă vrei mai mult volum cu aceleași calorii, adaugă 200 g\nvarză suplimentar.\nMerge excelent cu o lingură de iaurt 2%, pentru echilibru între\nproteine și aciditate.","alergeni":"nu conține alergeni majori Atenție la urme de țelină din pasta de roșii – verifică eticheta","variante":"fără roșii: Poți folosi 50 g piure de ardei copt, cu același aport caloric și gust dulce-acrișor.","macro":{"calorii_macro":"385","proteine":"39 g","carbohidrati":"23 g","fibre":"3.1 g","grasimi":"16 g","grasimi_saturate":"3 g"}},{"id":"sarbatori-302","titlu":"Varză Roșie cu Rață","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":302,"portii":"1","timp_minute":70,"calorii":370,"ingrediente":["125 g piept de rață fără piele","250 g varză roșie, tocată fin","40 g ceapă roșie, tocată","30 g măr (Golden), ras","3 ml oțet de mere","10 g pastă de roșii","3 ml ulei de măsline","¼ linguriță chimion","Sare – după gust","¼ linguriță piper","1 foaie de dafin","50 ml apă fierbinte"],"descriere":"O variantă ușoară și aromată de varză cu rață, perfectă atunci\ncând vrei un preparat tradițional, dar gătit sănătos și cu\ningrediente simple.","pasi":"1.Taie pieptul de rață cuburi. Încinge 5 g ulei și gătește bucățile\nla foc mare 3–4 minute, doar cât să prindă culoare. Scoate-le\ndeoparte.\n2. În aceeași tigaie adaugă restul de ulei, ceapa și morcovul.\nSotează 5 minute.\n3. Pune varza tocată, amestecă, apoi adaugă pasta de roșii,\nsarea, piperul, chimionul și foile de dafin.\n4. Toarnă apa fierbinte și las-o 10 minute la foc mic, amestecând\nocazional.\n5. Mută totul într-un vas termorezistent, adaugă bucățile de rață,\nacoperă cu folie și gătește 40 minute la 180°C.\n6.Scoate folia și mai lasă 10 minute ca să se rumenească ușor.\n7.Amestecă bine și împarte în 4 porții egale.","sfaturi":"Varza roșie devine și mai aromată dacă adaugi cuișoare sau\nanason stelat (1 bucată) – fără impact caloric.\nPentru extra culoare și beneficii antioxidante, stropește la final\ncu câteva picături de suc de lămâie.","alergeni":"nu conține alergeni majori Atenție la urme de țelină din pasta de roșii – verifică eticheta","variante":"fără roșii: Poți folosi 50 g piure de ardei copt, cu același aport caloric și gust dulce-acrișor.","macro":{"calorii_macro":"370","proteine":"37 g","carbohidrati":"27 g","fibre":"6.1 g","grasimi":"12.5 g","grasimi_saturate":"3 g"}},{"id":"sarbatori-303","titlu":"Rață la Cuptor cu Mere și Vin","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Masa de Crăciun/ An Nou","pagina":303,"portii":"2","timp_minute":70,"calorii":302,"ingrediente":["225 g piept de rață fără piele","110 g mere (Golden sau Idared), feliate","45 ml vin alb sec","4 ml ulei de măsline","35 g ceapă, tocată mare","35 g morcov, rondele","2 g usturoi (≈ 1 cățel)","½ linguriță rozmarin","¼ linguriță cimbru","Sare – după gust","¼ linguriță piper","35 ml apă fierbinte"],"descriere":"Această raț
