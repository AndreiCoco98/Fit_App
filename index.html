rțișoară sau cardamom în nuca măcinată pentru o\naromă orientală.\nSe servește rece, după ce a stat la frigider câteva ore.\nPoți presăra deasupra fistic mărunțit pentru un aspect mai\nelegant.","alergeni":"gluten (foi de plăcintă), nuci, miere","variante":"înlocuiește nuca cu alune sau migdale pentru un profil nutrițional diferit.","macro":{"calorii_macro":"234","proteine":"2.5 g","carbohidrati":"4.2 g","fibre":"1 g","grasimi":"10.8 g","grasimi_saturate":"6 g"}},{"id":"traditionale-240","titlu":"Cremșnit","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Deserturi cu Mai Puțin Zahăr","pagina":240,"portii":"12","timp_minute":65,"calorii":214,"ingrediente":["Pentru foi:","400 g foi de foietaj light","Pentru cremă:","1 l lapte degresat","40 g îndulcitor pudră (eritritol/stevia)","4 ouă (2 gălbenușuri + 2 albușuri)","60 g amidon de porumb","1 plic zahăr vanilat","20 g unt light","Pentru decor: îndulcitor pudră – după gust"],"descriere":"Un desert clasic, reinterpretat într-o variantă light, cu foi crocante și\ncremă fină de vanilie.\nFoile","pasi":"1.Coace foile de foietaj light conform instrucțiunilor (de obicei\n12–15 minute la 200°C).\n2.Lasă-le să se răcească complet.\nCrema\n1.Pune laptele la încălzit împreună cu îndulcitorul și vanilia.\n2.Separat, amestecă gălbenușurile, albușurile, amidonul și untul\n(sau iaurtul).\n3.Toarnă treptat laptele fierbinte peste compoziție, amestecând\nenergic.\n4.Pune amestecul pe foc mic și gătește 3–5 minute, până se\nîngroașă.\n5.Lasă crema să se răcorească ușor.\nAsamblare\n1.Pune prima foaie de foietaj în tavă.\n2.Adaugă toată crema și nivelează.\n3.Așază a doua foaie de foietaj deasupra și presează ușor.\n4.Pudrează cu îndulcitor.\n5.Lasă la rece minimum 2–3 ore înainte de servire.","sfaturi":"Pentru extra aromă, adaugă esență de rom sau coajă rasă de\nlămâie în cremă.\nPoți înlocui foietajul cu foi de plăcintă light, pentru o variantă\nmai dietetică.\nSe servește cel mai bine a doua zi, după ce foile s-au înmuiat\npuțin.","alergeni":"gluten (foi), ouă, lactoză (lapte, unt/iaurt)","variante":"înlocuiește untul cu iaurt grecesc pentru mai puține grăsimi.","macro":{"calorii_macro":"214","proteine":"3.5 g","carbohidrati":"8.2 g","fibre":"0 g","grasimi":"2.8 g","grasimi_saturate":"1.6 g"}},{"id":"traditionale-241","titlu":"Tort Doboș","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Deserturi cu Mai Puțin Zahăr","pagina":241,"portii":"12","timp_minute":100,"calorii":119,"ingrediente":["Pentru foi:","3 ouă","60 g îndulcitor pudră (eritritol/stevia)","150 g făină integrală","1 vârf de cuțit de sare","Pentru cremă:","150 g iaurt grecesc 2%","100 g brânză de vaci slabă (fină, pasată)","80 g ciocolată neagră 85% cacao","20 g cacao neîndulcită","20 g îndulcitor pudră","1 linguriță esență de rom sau vanilie","Pentru caramel:","40 g eritritol caramelizat","10 ml apă","5 g unt light"],"descriere":"O versiune modernizată, mai ușoară și echilibrată a celebrului Tort\nDoboș, cu cremă fină de cacao și topping crocant de caramel\nlight.\nFoi:","pasi":"1.Bate ouăle cu îndulcitorul.\n2.Adaugă făina și sarea.\n3.Împarte aluatul în 6 foi subțiri și coace fiecare foaie 6–8 minute\nla 180°C.\nCremă:\n1.Mixează iaurtul cu brânza de vaci.\n2.Încorporează cacaoa, îndulcitorul, esența și ciocolata topită.\n3.Lasă 10–15 minute la rece.\nCaramel:\n1.Caramelizează eritritolul (sau zahărul).\n2.Adaugă apa și untul și amestecă până devine omogen.\n3.Toarnă într-un strat subțire și lasă la întărit.\nAsamblare:\n1.Montează foi + cremă în straturi.\n2.Ultima foaie se decorează cu caramel tăiat în triunghiuri.\n3.Lasă tortul la rece cel puțin 2 ore.","sfaturi":"Poți adăuga nuci măcinate între straturi pentru un plus de\ntextură.\nPentru un gust mai intens, folosește cafea concentrată în cremă.\nSe servește cel mai bine a doua zi, după ce s-au combinat\naromele.","alergeni":"gluten (făină), ouă, lactoză (iaurt, brânză, unt)","variante":"folosește pudră proteică de ciocolată în cremă pentru un aport proteic mai mare.","macro":{"calorii_macro":"119","proteine":"6.1 g","carbohidrati":"14.1 g","fibre":"2 g","grasimi":"4.3 g","grasimi_saturate":"1.5 g"}},{"id":"traditionale-242","titlu":"Amandine","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Deserturi cu Mai Puțin Zahăr","pagina":242,"portii":"12","timp_minute":90,"calorii":152,"ingrediente":["Pentru blat:","5 ouă, 60 g îndulcitor pudră (eritritol/stevia), 100 g făină integrală, 20 g cacao neîndulcită,","20 ml ulei de cocos, 5 g praf de copt, 1 vârf de cuțit de sare","Pentru sirop:","200 ml apă, 20 g îndulcitor lichid ,","1 linguriță esență de rom","Pentru cremă:","200 g iaurt grecesc 2%, 100 g brânză de vaci slabă, 50 g ciocolată neagră 85% cacao, 15 g cacao neîndulcită, 20 g îndulcitor pudră, 1 linguriță esență de rom","Pentru glazură:"],"descriere":"O variantă mai ușoară a prăjiturii clasice, cu blat pufos de cacao,\ncremă fină și glazură intensă de ciocolată.\nBlatul","pasi":"1.Mixează ouăle cu îndulcitorul 5 minute, până devin spumoase.\n2.Adaugă uleiul, cacaoa, făina, praful de copt și sarea.\n3.Omogenizează și toarnă compoziția în tavă.\n4.Coace la 170°C timp de 20–25 minute. Lasă la răcit complet.\nSiropul\n1.Fierbe apa cu îndulcitorul lichid și esența de rom 1–2 minute.\n2.Lasă siropul să se răcorească.\nCrema\n1.Amestecă iaurtul, brânza de vaci, ciocolata topită, cacaoa,\nîndulcitorul și esența de rom.\n2.Mixează până obții o cremă fină.\n3.Dă la rece 15–20 min pentru fermitate.\nGlazura\n1.Topește ciocolata împreună cu laptele până devine un sos gros.\n2.Lasă să se răcească ușor.\nAsamblare\n1.Taie blatul în două foi.\n2.Însiropează fiecare foaie cu siropul rece.\n3.Întinde crema între foi.\n4.Toarnă glazura peste prăjitură și nivelează.\n5.Lasă la frigider minimum 2 ore înainte de tăiere.","sfaturi":"Poți adăuga nuci măcinate în cremă pentru textură.\nDacă vrei un gust mai intens, folosește cafea concentrată\npentru sirop în loc de apă.\nSe servește foarte bine cu o linguriță de iaurt grecesc alături.","alergeni":"gluten (făină), ouă, lactoză (iaurt, brânză, lapte), cacao","variante":"înlocuiește brânza de vaci cu quark sau skyr pentru un plus de proteine.","macro":{"calorii_macro":"152","proteine":"6.7 g","carbohidrati":"13.5 g","fibre":"2 g","grasimi":"6.5 g","grasimi_saturate":"2 g"}},{"id":"traditionale-243","titlu":"Savarine","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Deserturi cu Mai Puțin Zahăr","pagina":243,"portii":"12","timp_minute":90,"calorii":121,"ingrediente":["Pentru aluat:","250 g făină integrală","150 ml lapte degresat călduț","30 g îndulcitor pudră (eritritol/stevia)","20 g drojdie proaspătă (sau 7 g uscată)","2 ouă întregi + 1 albuș","20 g ulei de cocos","1 vârf de cuțit de sare","Pentru sirop:","400 ml apă","40 g îndulcitor lichid","1 linguriță esență de rom","Pentru umplutură:","250 g iaurt grecesc 2% bătut spumă","10 g îndulcitor"],"descriere":"Savarine pufoase, însiropate și umplute cu cremă fină de iaurt, o\nvariantă mult mai light a desertului clasic.\nAluat","pasi":"1.Dizolvă drojdia și îndulcitorul în laptele cald.\n2.Adaugă făina, ouăle, uleiul și sarea.\n3.Mixează 4–5 minute până obții un aluat moale și elastic.\n4.Împarte compoziția în formele de savarină și lasă la dospit 20–\n25 minute.\n5.Coace la 180°C timp de 15–18 minute, până devin aurii.\n2. Sirop\n1.Fierbe apa cu îndulcitorul lichid și esența de rom 1–2 minute.\n2.Lasă siropul să se răcească.\n3. Umplutură\n1.Bate iaurtul rece până devine spumos.\n2.Adaugă îndulcitor și vanilie după gust.\n4. Asamblare\n1.Scufundă savarinele în siropul rece pe ambele părți până se\nîmbibă bine.\n2.Taie capacul fiecărei savarine.\n3.Umple cu crema de iaurt și așază capacul deasupra.","sfaturi":"Poți adăuga deasupra fructe de pădure proaspete pentru un\nplus de prospețime.\nDacă vrei un gust mai bogat, înlocuiește jumătate din iaurt cu\nbrânză mascarpone light.\nSe servesc cel mai bine după ce stau 1–2 ore la rece.","alergeni":"gluten (făină), ouă, lactoză (lapte, iaurt)","variante":"pentru mai multe proteine, adaugă 1–2 linguri de pudră proteică de vanilie în crema de iaurt.","macro":{"calorii_macro":"120.7","proteine":"6.1 g","carbohidrati":"16.3 g","fibre":"2.5 g","grasimi":"1.7 g","grasimi_saturate":"0.3 g"}},{"id":"traditionale-244","titlu":"Griș cu Lapte","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Deserturi cu Mai Puțin Zahăr","pagina":244,"portii":"2","timp_minute":15,"calorii":170,"ingrediente":["400 ml lapte semidegresat (1,5%)","36 g griș fin","8 g îndulcitor pudră (eritritol/stevia)","½ linguriță extract de vanilie","1 vârf mic de cuțit de sare","2 g unt light","20 g fructe de pădure proaspete (pentru servire)"],"descriere":"Un desert-cremă simplu, fin și rapid, perfect pentru o gustare ușoară\nsau un mic dejun dulce.","pasi":"1.Pune laptele la fiert cu îndulcitorul, vanilia și sarea.\n2.Când începe să clocotească, adaugă grișul în ploaie,\namestecând continuu.\n3.Fierbe 3–4 minute, până se îngroașă.\n4.Adaugă untul pentru extra finețe.\n5.Servește grișul cald cu fructe de pădure sau dulceață fără\nzahăr.","sfaturi":"Pentru un plus de aromă, adaugă coajă de lămâie sau\nportocală rasă.\nDacă vrei consistență mai fină, mixează grișul cu puțin lapte\nrece înainte de a-l pune în laptele fierbinte.\nSe potrivește excelent cu fructe de pădure, căpșuni sau un sos\nde zmeură fără zahăr.","alergeni":"gluten (griș), lactoză (lapte, unt)","variante":"înlocuiește laptele cu lapte vegetal neîndulcit (soia, ovăz, migdale) pentru o variantă fără lactoză.","macro":{"calorii_macro":"170","proteine":"6.1 g","carbohidrati":"8.95 g","fibre":"0 g","grasimi":"2.8 g","grasimi_saturate":"1.2 g"}},{"id":"traditionale-245","titlu":"Lapte de Pasăre","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Deserturi cu Mai Puțin Zahăr","pagina":245,"portii":"2","timp_minute":15,"calorii":194,"ingrediente":["Pentru cremă","400 ml lapte degresat","2 ouă mici (separate) ≈ 120 g ou întreg (fără coajă)","16 g îndulcitor pudră (eritritol/stevia)","½ linguriță extract de vanilie","1 praf mic de sare","Pentru decor (INCLUS în gramaj)","4 g scorțișoară sau cacao pudră fără zahăr"],"descriere":"Un lapte de pasăre fin și aromat, desertul copilăriei cu ‘norișori’\npufoși și cremă vanilată, exact așa cum îl pregăteau mamele și\nbunicile în zilele speciale.","pasi":"1.Bate albușurile cu sare și îndulcitor, poșează-le 1–2 min în\nlaptele cu vanilie și scoate pe platou.\n2.Mixează gălbenușurile cu restul de îndulcitor, adaugă treptat\nlaptele strecurat și gătește la foc mic până se îngroașă.\n3.Toarnă crema în boluri, pune „norii” de albuș deasupra și\npresară scorțișoară sau cacao.","sfaturi":"Lasă desertul la rece cel puțin 1–2 ore pentru a se întări și a\nprinde aromă.\nFolosește un tel sau spatulă de lemn pentru cremă, ca să nu se\ntaie.\nServește în pahare transparente pentru un aspect elegant.","alergeni":"ouă, lactoză (lapte)","variante":"pentru o versiune fără lactoză, folosește lapte vegetal fortificat (soia/ovăz).","macro":{"calorii_macro":"194","proteine":"13.9 g","carbohidrati":"10.3 g","fibre":"0 g","grasimi":"8.65 g","grasimi_saturate":"2.6 g"}},{"id":"traditionale-246","titlu":"Orez cu Lapte","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Deserturi cu Mai Puțin Zahăr","pagina":246,"portii":"2","timp_minute":20,"calorii":218,"ingrediente":["70 g orez basmati","400 ml lapte degresat","16 g îndulcitor pudră (eritritol/stevia)","1 praf mic de sare","½ linguriță esență de vanilie","Scorțișoară – pentru servire"],"descriere":"Un orez cu lapte cremos și parfumat, desertul simplu și reconfortant\ncare a încălzit copilăria multora dintre noi, servit cu scorțișoară și\nmultă nostalgie.","pasi":"1.Spală orezul și fierbe-l 5 min în apă, apoi scurge-l.\n2.Pune laptele cu îndulcitorul, sarea și vanilia la fiert.\n3.Adaugă orezul și fierbe la foc mic 20–25 min, amestecând\nconstant, până devine cremos.\n4.Servește cald sau rece, presărat cu scorțișoară.","sfaturi":"Pentru un plus de aromă, adaugă coajă rasă de lămâie sau\nportocală.\nPoți servi cu fructe de pădure proaspete sau dulceață fără\nzahăr.\nDacă vrei o textură mai bogată, adaugă 30 g iaurt grecesc 2%\nîn porția rece.","alergeni":"lactoză (lapte)","variante":"înlocuiește laptele cu lapte de cocos light pentru o aromă exotică.","macro":{"calorii_macro":"218","proteine":"8.8 g","carbohidrati":"35.3 g","fibre":"0 g","grasimi":"2.7 g","grasimi_saturate":"1.6 g","greutate_portie":"245 g"}},{"id":"traditionale-247","titlu":"Prăjitură „albă ca Zăpada”","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Deserturi cu Mai Puțin Zahăr","pagina":247,"portii":"12","timp_minute":70,"calorii":204,"ingrediente":["Pentru foi:","400 g făină integrală","60 g îndulcitor pudră (eritritol/stevia)","60 g iaurt grecesc 2%","2 ouă","80 ml lapte degresat","5 g praf de copt","1 vârf de cuțit de sare","Pentru cremă:","800 ml lapte degresat","80 g îndulcitor pudră","60 g amidon de porumb","100 g brânză de vaci slabă","30 g unt cu 65% grăsime coajă rasă de lămâie – după gust zeama de la ½ lămâie","1 plic zahăr vanilat"],"descriere":"O reinterpretare mai light a clasicei prăjituri, cu foi fragede și o\ncremă fresh de lămâie, perfectă pentru orice ocazie.\nFoi:","pasi":"1.Bate ouăle cu îndulcitorul, apoi adaugă iaurtul și laptele.\n2.Încorporează făina, praful de copt și sarea până obții un aluat\nomogen.\n3.Împarte aluatul în 3 foi subțiri și coace fiecare foaie 7–8 minute\nla 180°C.\nCremă:\n1.Fierbe laptele cu îndulcitorul și adaugă amidonul dizolvat în\npuțină apă.\n2.Amestecă până se îngroașă, apoi lasă la răcit 10 minute.\n3.Încorporează brânza de vaci, untul, coaja și zeama de lămâie,\nplus zahărul vanilat.\nAsamblare:\n1.Așază prima foaie, adaugă un strat de cremă, apoi continuă\npână termini foile.\n2.Lasă prăjitura la rece minimum 4 ore, ideal peste noapte, pentru\na se frăgezi.","sfaturi":"Poți adăuga în cremă lapte praf degresat pentru o textură mai\nbogată.\nPentru un gust fresh, adaugă câteva frunze de mentă tocată fin\nîn cremă.\nSe servește cel mai bine a doua zi, când foile s-au înmuiat\ncomplet.","alergeni":"gluten (făină), ouă, lactoză (lapte, iaurt, brânză, unt)","variante":"folosește lapte vegetal fortificat pentru o versiune fără lactoză.","macro":{"calorii_macro":"204","proteine":"9.2 g","carbohidrati":"32.2 g","fibre":"4 g","grasimi":"3.7 g","grasimi_saturate":"2 g"}},{"id":"traditionale-248","titlu":"Chec Pufos cu Nucă și Cacao","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Deserturi cu Mai Puțin Zahăr","pagina":248,"portii":"8","timp_minute":50,"calorii":215,"ingrediente":["220 g făină integrală","80 g îndulcitor pudră (eritritol/stevia)","3 ouă întregi + 1 albuș","40 ml ulei cocos dezodorizat","120 ml lapte degresat","40 g nucă măcinată","20 g cacao","10 g praf de copt","1 vârf de cuțit de sare esență de vanilie – după gust"],"descriere":"Un chec ușor, pufos și delicios, cu aromă intensă de cacao și textură\nfină, perfect pentru o gustare echilibrată.","pasi":"1. Bate ouăle cu îndulcitorul până se spumează ușor.\n2. Adaugă uleiul, laptele și esența de vanilie.\n3. Încorporează făina, praful de copt, sarea, nuca și cacaoa.\n4. Toarnă compoziția într-o tavă tapetată cu hârtie de copt.\n5. Coace la 180°C timp de 35–40 minute, până trece testul\nscobitorii.\n6. Lasă checul să se răcească înainte de feliere.","sfaturi":"Poți adăuga stafide hidratate sau merișoare uscate pentru un\nplus de aromă.\nPentru o variantă mai cremoasă, servește cu o lingură de iaurt\ngrecesc 2% deasupra.\nSe păstrează 2–3 zile într-o cutie ermetică sau se poate\ncongela pe felii.","alergeni":"gluten (făină), ouă, nuci","variante":"înlocuiește nuca cu alune sau migdale măcinate pentru altă textură.","macro":{"calorii_macro":"215","proteine":"8.1 g","carbohidrati":"22.6 g","fibre":"4.4 g","grasimi":"6.1 g","grasimi_saturate":"3 g"}},{"id":"traditionale-249","titlu":"Cornulețe Fragede cu Nucă","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Deserturi cu Mai Puțin Zahăr","pagina":249,"portii":"8","timp_minute":65,"calorii":371,"ingrediente":["350 g făină integrală","120 g unt cu 65% grăsime","120 g iaurt grecesc 2%","30 g îndulcitor pudră (eritritol/stevia)","1 vârf de cuțit de sare","5 g praf de copt","150 g nucă măcinată","30 g îndulcitor pudră (pentru umplutură) îndulcitor pudră pentru decor"],"descriere":"Cornulețe fragede, parfumate și ușor dulci, cu umplutură de nucă și\nun aluat fin pe bază de iaurt.","pasi":"1.Amestecă făina cu sarea, praful de copt și îndulcitorul.\n2.Adaugă untul (sau combinația unt + iaurt) și amestecă până\nobții o compoziție nisipoasă.\n3.Încorporează iaurtul și frământă un aluat omogen.\n4.Lasă aluatul 10 minute la rece.\n5.Împarte aluatul în 3 bile, întinde fiecare foaie în cerc și taie în\ntriunghiuri.\n6.Umple fiecare triunghi cu nucă amestecată cu îndulcitor și\nrulează spre vârf.\n7.Coace cornulețele la 170°C timp de 12–15 minute.\n8.După răcire, tăvălește-le în îndulcitor pudră.","sfaturi":"Dacă vrei cornulețe extra fragede, lasă aluatul la frigider cel\npuțin 1 oră.\nPoți adăuga scorțișoară în umplutură pentru un plus de aromă.\nSe păstrează crocante câteva zile într-o cutie închisă ermetic.","alergeni":"gluten (făină), lactoză (iaurt, unt), nuci","variante":"înlocuiește untul cu margarină vegetală fără lactoză și iaurtul cu iaurt vegetal (soia/cocos).","macro":{"calorii_macro":"371","proteine":"9.7 g","carbohidrati":"34.5 g","fibre":"6.4 g","grasimi":"22.7 g","grasimi_saturate":"9 g"}},{"id":"traditionale-251","titlu":"Drob de Miel Tradițional","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Sărbători \"Ușoare\"","pagina":251,"portii":"12","timp_minute":90,"calorii":250,"ingrediente":["1 kg organe de miel (ficat, plămâni, inimă, rinichi, splină)","300 g ouă","2 legături ceapă verde (aprox.","150 g)","2 legături usturoi verde (aprox.","150 g)","1 legătură pătrunjel verde (50 g)","1 legătură mărar verde (50 g)","100 g pesmet","30 ml ulei","5 ouă fierte tari (pentru interior)","Sare, piper"],"descriere":"O variantă tradițională, aromată și echilibrată a drobului de miel,\nperfectă pentru masa de Paște.","pasi":"1.Fierbe organele de miel timp de 30–40 minute, apoi lasă-le la\nrăcit și toacă-le mărunt.\n2.Călește ușor ceapa verde și usturoiul verde în 1 lingură de ulei.\n3.Amestecă organele tocate cu legumele călite, verdeața tocată,\nouăle crude, pesmetul, sarea și piperul.\n4.Tapetează o tavă cu hârtie de copt și toarnă jumătate din\ncompoziție.\n5.Așază ouăle fierte pe mijloc și acoperă cu restul compoziției.\n6.Unge suprafața cu puțin ulei.\n7.Coace drobul la 180°C timp de 35–40 minute, până se\nrumenește ușor.","sfaturi":"Pentru un gust mai bogat, poți adăuga și puțin ficat de pasăre.\nDrobului i se pot pune și foi de plăcintă/aluat ca înveliș, pentru\nun aspect mai festiv.\nSe servește tradițional la masa de Paște, alături de salată verde\nși ridichi.","alergeni":"ouă, gluten (pesmet)","variante":"în loc de pesmet, poți folosi fulgi de ovăz măcinați.","macro":{"calorii_macro":"250","proteine":"6.3 g","carbohidrati":"0.7 g","fibre":"0.1 g","grasimi":"7.5 g","grasimi_saturate":"3 g"}},{"id":"traditionale-252","titlu":"Drob cu Ficăței","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Sărbători \"Ușoare\"","pagina":252,"portii":"12","timp_minute":60,"calorii":193,"ingrediente":["800 g ficăței de pui","200 g ouă crude","200 g ouă fierte tari (pentru interior)","2 legături ceapă verde (aprox. 150 g)","2 legături usturoi verde (aprox. 150 g)","1 legătură pătrunjel verde (50 g)","1 legătură mărar verde (50 g)","100 g pesmet","30 ml ulei","Sare, piper"],"descriere":"O variantă mai ușoară și mai sănătoasă a drobului tradițional, cu\nficăței de pui și multe verdețuri aromate. Perfect pentru mesele de\nsărbătoare, dar și ca gustare bogată în proteine.","pasi":"1.Spală ficățeii și fierbe-i 10 minute în apă ușor sărată, apoi lasă-i\nsă se răcească.\n2.Toacă verdețurile mărunt și călește-le ușor în ulei timp de 2–3\nminute.\n3.Amestecă ficățeii tocați grosier cu verdețurile, ouăle crude,\npesmetul, sarea și piperul.\n4.Pune jumătate din compoziție într-o tavă tapetată cu hârtie de\ncopt, adaugă ouăle fierte pe mijloc și acoperă cu restul\ncompoziției.\n5.Coace la 180°C timp de 40–45 de minute până se rumenește\nfrumos.\n6.Lasă drobul să se răcească înainte de a-l felia.","sfaturi":"Ficățeii dau un gust mai delicat și o textură mai fragedă decât\norganele de miel.\nPentru un plus de aromă, poți adăuga cimbru sau rozmarin.\nSe servește rece, tăiat felii, alături de salată verde și ridichi.","alergeni":"ouă, gluten (pesmet)","variante":"înlocuiește pesmetul cu fulgi de ovăz măcinați pentru mai multe fibre.","macro":{"calorii_macro":"192.5","proteine":"15.4 g","carbohidrati":"0.6 g","fibre":"0.1 g","grasimi":"8.8 g","grasimi_saturate":"2.5 g","greutate_portie":"135 g"}},{"id":"traditionale-253","titlu":"Salată Boeuf","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Sărbători \"Ușoare\"","pagina":253,"portii":"6","timp_minute":35,"calorii":139,"ingrediente":["Pentru salată:","300 g piept de pui","300 g cartofi","200 g morcovi","150 g mazăre","150 g castraveți murați","Pentru maioneză light:","200 g iaurt grecesc 2%","20 g muștar","15 ml zeamă de lămâie după gust: sare, piper"],"descriere":"O reinterpretare ușoară și echilibrată a celebrei salate tradiționale,\ncu maioneză light din iaurt grecesc. Gust autentic, dar mult mai\nușoară și potrivită pentru un stil de viață sănătos.","pasi":"1.Fierbe pieptul de pui, cartofii, morcovii și mazărea până devin\nfragede.\n2.Taie toate ingredientele în cubulețe mici și lasă-le să se\nrăcească.\n3.Amestecă într-un bol iaurtul, muștarul și zeama de lămâie pentru\na forma maioneza light.\n4.Într-un vas mare, combină legumele și pieptul de pui cu\nmaioneza, potrivind de sare și piper.\n5.Lasă salata la frigider cel puțin 1 oră înainte de servire.","sfaturi":"Iaurtul grecesc înlocuiește perfect maioneza\nTăierea uniformă e esențială pentru aspect\nSe păstrează 2 zile la frigider","alergeni":"lactoză (iaurt grecesc), muștar","variante":"fără lactate: înlocuiește iaurtul grecesc cu maioneză din avocado sau sos pe bază de tofu.","macro":{"calorii_macro":"138.7","proteine":"15.5 g","carbohidrati":"12 g","fibre":"3.3 g","grasimi":"1.4 g","grasimi_saturate":"0.3 g","greutate_portie":"220 g"}},{"id":"traditionale-254","titlu":"Cozonac Tradițional","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Sărbători \"Ușoare\"","pagina":254,"portii":"12","timp_minute":180,"calorii":375,"ingrediente":["Pentru aluat","600 g făină albă","250 ml lapte semi-degresat, călduț","120 g  ouă","20 g gălbenuș","50 g unt 65%, topit","20 g ulei de cocos","60 g zahăr brun","60 g îndulcitor pudră (eritritol/stevia)","1 linguriță coajă rasă de lămâie","1 linguriță coajă rasă de portocală","½ linguriță sare","10 g drojdie uscată (sau 25 g drojdie proaspătă)","Pentru umplutură"],"descriere":"O variantă mai ușoară și mai echilibrată a cozonacului clasic,\nperfectă pentru sărbători, fără să renunți la gustul autentic.","pasi":"1.Amestecă laptele călduț cu zahărul brun și drojdia. Lasă 10\nminute să se activeze.\n2.Într-un bol mare, pune făina, ouăle, gălbenușul, îndulcitorul\npudră, untul topit, uleiul, coaja de lămâie/portocală și sarea.\nAdaugă drojdia activată și frământă 10–12 minute.\n3.Lasă aluatul la dospit 60–90 minute într-un loc cald.\n4.Pregătește umplutura: amestecă nuca, cacaua, îndulcitorul,\nzahărul brun, albușurile, romul și laptele până obții o cremă\ngroasă.\n5.Împarte aluatul în două, întinde, adaugă crema, rulează și\nformează cozonacul.\n6.Pune în tavă și lasă 30–45 minute la dospit.\n7.Coace la 170°C timp de 45–50 minute până se rumenește.\n8.Lasă să se răcească complet înainte de tăiere.","sfaturi":"Dacă vrei mai puține grăsimi, redu untul la 30 g și suplimentezi\ncu 10 g ulei.\nPentru un gust mai intens, adaugă stafide hidratate în rom sau\nvanilie.\nPentru versiune și mai light: crești cantitatea de îndulcitor la 80\ng și scazi zahărul brun la 40 g.","alergeni":"gluten (făină), ouă, lactoză (lapte), nuci","variante":"fără lactate: folosește lapte vegetal (migdale, soia).","macro":{"calorii_macro":"375.2","proteine":"10.8 g","carbohidrati":"48.5 g","fibre":"1.8 g","grasimi":"14.1 g","grasimi_saturate":"3 g","greutate_portie":"120 g"}},{"id":"traditionale-255","titlu":"Pască Tradițională","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Sărbători \"Ușoare\"","pagina":255,"portii":"12","timp_minute":110,"calorii":205,"ingrediente":["Pentru aluat","400 g făină integrală","200 ml lapte degresat, călduț","50 g îndulcitor pudră","50 g iaurt grecesc 2%","25 g drojdie proaspătă (sau 7 g drojdie uscată)","60 g ou întreg (1 ou, fără coajă)","30 g albuș (1 albuș)","1 g sare (1 praf)","Coajă rasă de lămâie și portocală – după gust","Pentru umplutură","600 g brânză de vaci slabă","80 g îndulcitor pudră","120 g ou întreg","80 g iaurt grecesc 2%","30 g stafide (opțional, hidratate)"],"descriere":"O pască reinterpretată într-o variantă mai ușoară, cu aluat fin și\numplutură cremoasă de brânză slabă.\nAluat:","pasi":"1.Dizolvă drojdia și îndulcitorul în laptele cald și lasă 10 minute să\nse activeze.\n2.Amestecă făina cu sarea, oul și albușul, coaja de lămâie și\nportocală.\n3.Adaugă laptele cu drojdia și frământă 8–10 minute.\n4.Încorporează iaurtul și continuă frământarea până obții un\naluat elastic.\n5.Lasă-l la dospit 60–75 minute.\nUmplutură:\n1.Amestecă brânza de vaci cu îndulcitorul, ouăle, iaurtul, stafidele,\nesența și coaja de citrice.\n2.Omogenizează totul până devine o cremă densă.\nAsamblare și coacere:\n1.Așază aluatul într-o tavă rotundă, ridicând marginile ușor pe\npereți.\n2.Toarnă umplutura în mijloc.\n3.Coace la 170°C timp de 40–50 minute, până se rumenește și se\nîncheagă.\n4.Las-o la răcit complet înainte de tăiere.","sfaturi":"Poți adăuga esență de vanilie sau rom pentru un plus de aromă.\nDacă vrei o textură mai cremoasă, adaugă 20 g griș în\numplutură.","alergeni":"gluten (făină), ouă, lactoză (lapte, brânză, iaurt)","variante":"fără lactate: folosește brânză vegetală light (ex. pe bază de soia) și lapte vegetal.","macro":{"calorii_macro":"205.3","proteine":"14.9 g","carbohidrati":"27.4 g","fibre":"4 g","grasimi":"2.4 g","grasimi_saturate":"0.5 g","greutate_portie":"130 g"}},{"id":"traditionale-256","titlu":"Mucenici Moldovenești (copți)","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Sărbători \"Ușoare\"","pagina":256,"portii":"4","timp_minute":110,"calorii":290,"ingrediente":["Pentru mucenici:","200 g făină integrală","80 ml apă călduță","1 linguriță îndulcitor pudră","2 g sare","Pentru sirop:","800 ml apă","40 g miere","50 g nucă măcinată coajă rasă de lămâie","2 g scorțișoară"],"descriere":"Mucenici moldovenești copți, pufoși și parfumați, îmbibați în sirop cu\nnucă și scorțișoară — un desert de sărbătoare care păstrează vie\nuna dintre cele mai frumoase tradiții românești.","pasi":"1.Frământă făina cu apa, sarea și îndulcitorul până obții un aluat\nelastic.\n2.Lasă aluatul la odihnit 30 min.\n3.Modelează 8-uri mici (aprox. 40 bucăți).\n4.Coace la 180°C timp de 12–15 min, până se rumenesc ușor.\n5.Fierbe apa cu mierea și scorțișoara pentru sirop.\n6.Adaugă mucenicii și lasă-i să fiarbă 3–4 min.\n7.Servește cu nucă măcinată presărată deasupra.","sfaturi":"Adaugă puțină esență de vanilie sau portocală în sirop pentru\naromă mai intensă.\nNuca se poate prăji ușor înainte pentru gust mai bogat.\nSunt delicioși atât calzi, cât și reci, după ce au absorbit bine\nsiropul.","alergeni":"gluten (făină), nuci","variante":"presară fulgi de cocos sau semințe de susan.","macro":{"calorii_macro":"285.5","proteine":"8.4 g","carbohidrati":"46.2 g","fibre":"6.8 g","grasimi":"8.6 g","grasimi_saturate":"1.2 g"}},{"id":"traditionale-257","titlu":"Mucenici Muntenești (fierți)","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Sărbători \"Ușoare\"","pagina":257,"portii":"8","timp_minute":110,"calorii":303,"ingrediente":["400 g mucenici uscați (de grâu, în formă de 8)","3 l apă","80 g îndulcitor pudră","150 g nucă măcinată","2 lingurițe scorțișoară","2 lingurițe esență de rom","1 praf de sare"],"descriere":"Mucenici muntenești fierți, parfumați cu scorțișoară, rom și nucă, un\ndesert cald și dulce care aduce în casă mireasma și tradiția zilei de\n9 Martie.","pasi":"1.Fierbe apa cu sarea și îndulcitorul.\n2.Adaugă mucenicii și lasă-i la fiert 10–12 min, până se înmoaie.\n3.Pune esența de rom și scorțișoara, amestecând ușor.\n4.Servește calzi sau reci, cu nucă măcinată deasupra.","sfaturi":"Adaugă puțină esență de vanilie sau portocală în sirop pentru\naromă mai intensă.\nNuca se poate prăji ușor înainte pentru gust mai bogat.\nSunt delicioși atât calzi, cât și reci, după ce au absorbit bine\nsiropul.","alergeni":"gluten (făină), nuci","variante":"presară fulgi de cocos sau semințe de susan.","macro":{"calorii_macro":"303.2","proteine":"2.9 g","carbohidrati":"3.6 g","fibre":"1.1 g","grasimi":"12.2 g","grasimi_saturate":"1.7 g"}},{"id":"traditionale-258","titlu":"Caltaboș/lebăr","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Sărbători \"Ușoare\"","pagina":258,"portii":"10","timp_minute":90,"calorii":254,"ingrediente":["1 kg ficat de pui","500 g piept de curcan (pentru textură și proteine)","200 g ceapă","150 g orez","5 g boabe de piper","3 foi de dafin sare – după gust mațe subțiri de vită sau porc – pentru umplere"],"descriere":"O versiune echilibrată și mai ușoară a tradiționalului lebăr,\npreparată din ficat și piept de curcan – cu gust autentic, dar mult\nmai ușor pentru digestie.","pasi":"1.Fierbe ficatul, pieptul de curcan, ceapa, dafinul și piperul boabe\nîn apă cu sare timp de 40–45 minute.\n2.Fierbe separat orezul până devine ușor moale, apoi scurge-l\nbine.\n3.Toacă carnea și ficatul, apoi amestecă-le cu orezul și puțin din\nsupa de fierbere pentru a obține o compoziție legată.\n4.Umple mațele și leagă-le la capete.\n5.Fierbe caltaboșii în apă clocotită, la foc mic, 25–30 minute.\n6.După răcire, se păstrează la frigider până la 5 zile.","sfaturi":"Adaugă verdeață proaspătă (pătrunjel, mărar) pentru aromă\nmai fresh.\nServește cu murături sau salată de sfeclă pentru un contrast ușor\nacrișor.\nSe păstrează la frigider 3–4 zile sau se congelează pentru mai\nmult timp.","alergeni":"cereale cu gluten (orez, potențial urme în mațe), organe (ficat)","variante":"înlocuiește orezul cu hrișcă.","macro":{"calorii_macro":"254","proteine":"32.3 g","carbohidrati":"12 g","fibre":"0.15 g","grasimi":"5.4 g","grasimi_saturate":"1 g","greutate_portie":"210 g"}},{"id":"traditionale-259","titlu":"Piftie de Curcan","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Sărbători \"Ușoare\"","pagina":259,"portii":"8","timp_minute":180,"calorii":192,"ingrediente":["800 g pulpe de curcan cu os","400 g aripi de curcan","100 g morcov","50 g țelină","50 g ceapă","30 g usturoi","2 bucăți foi de dafin","5 g piper boabe","15 g gelatină (opțional) după gust: sare"],"descriere":"O variantă mai ușoară și echilibrată a tradiționalei piftii, ideală\npentru mesele de sărbătoare. Bogată în colagen natural, dar cu un\nconținut redus de grăsimi.","pasi":"1.Pune carnea la fiert în apă rece cu sare, spumând la nevoie.\n2.Adaugă legumele, dafinul și piperul și fierbe la foc mic 2–2,5\nore, până când carnea se desprinde de pe os.\n3.Strecoară supa, adaugă usturoiul pisat și, dacă vrei o piftie mai\nlegată, dizolvă gelatina în supa caldă.\n4.Așază bucățile de carne și legume în forme, toarnă zeama și\nlasă la frigider 6–8 ore, până se încheagă.","sfaturi":"Testează gelificarea punând puțină zeamă la rece\nDecorează cu morcov și ou fiert\nServește cu muștar și oțet","alergeni":"țelină","variante":"adaugă felii de ou fiert în castronele înainte să torni zeama (aspect plăcut, plus proteine).","macro":{"calorii_macro":"191.5","proteine":"24.4 g","carbohidrati":"1.4 g","fibre":"0.4 g","grasimi":"5 g","grasimi_saturate":"1.2 g","greutate_portie":"380 g"}},{"id":"traditionale-260","titlu":"Cârnați de Casă","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Sărbători \"Ușoare\"","pagina":260,"portii":"10","timp_minute":60,"calorii":202,"ingrediente":["1 kg carne de curcan (pulpe dezosate, fără piele)","500 kg carne de vită slabă (pulpa)","200 g pulpă de porc slabă","20 g usturoi (pisat)","30 g sare","10 g piper măcinat","10 g boia dulce","3 g boia iute (după gust)","3 g cimbru uscat","250 ml apă rece","Mațe subțiri de porc sau vită – pentru umplere"],"descriere":"Cârnați preparați acasă din carne slabă, cu gust tradițional, dar\nmult mai echilibrați și ușor de digerat.","pasi":"1.Toacă toate tipurile de carne și amestecă-le într-un bol mare.\n2.Adaugă sarea, condimentele, usturoiul și apa rece. Frământă\nbine până obții o compoziție omogenă.\n3.Acoperă vasul și lasă-l la frigider pentru 12 ore, ca aromele să\nse combine.\n4.Umple mațele cu amestecul și leagă-le la capete la\ndimensiunea dorită.\n5.Gătește-i pe grătar, în tigaie antiaderentă sau la cuptor\n(180°C, 25–30 minute), până se rumenesc frumos.","sfaturi":"Dacă vrei o variantă mai slabă, elimină pulpa de porc și\nfolosește doar curcan și vită.\nPoți adăuga semințe de fenicul sau coriandru pentru o aromă\ndiferită.\nCârnații se pot congela după ce sunt umpluți, rezistă 3–4 luni la\ncongelator.","alergeni":"pot conține urme de gluten dacă se folosesc condimente procesate; se recomandă verificarea etichetelor","variante":"adaugă coriandru, ienibahar sau semințe de fenicul măcinate pentru un gust mai intens.","macro":{"calorii_macro":"201.3","proteine":"31.9 g","carbohidrati":"0 g","fibre":"0 g","grasimi":"6.3 g","grasimi_saturate":"1.8 g","greutate_portie":"140 g"}},{"id":"traditionale-261","titlu":"Pastă de Jumări Dietetice","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Sărbători \"Ușoare\"","pagina":261,"portii":"12","timp_minute":40,"calorii":455,"ingrediente":["1,2 kg piele de pui (cu puțină grăsime)","1 ceapă medie (100 g)","2 căței de usturoi","100 ml apă","5 g sare","1 linguriță boia dulce","Piper, după gust"],"descriere":"O reinterpretare light a gustului clasic românesc — păstrează\naroma autentică, dar elimină excesul de grăsime. Excelentă ca\naperitiv sau gustare proteică.","pasi":"1.Fierbe pielea 25–30 min, scurge și toacă.\n2.Pune-o într-o tigaie antiaderentă fără ulei până devine aurie.\n3.Călește ceapa și usturoiul, apoi mixează totul cu condimentele\npână obții o pastă fină.\n4.Pentru o textură mai moale, adaugă puțin iaurt sau grăsime\ntopită.","sfaturi":"Folosirea cărnii de pasăre reduce la jumătate caloriile față de\nvarianta clasică.","alergeni":"nu conține alergeni majori; totuși, se recomandă atenție la cantitatea de sare pentru cei cu hipertensiune","variante":"pentru persoane hipertensive, se poate reduce sau elimina complet sarea și compensa cu ierburi aromatice.","macro":{"calorii_macro":"455","proteine":"7.1 g","carbohidrati":"1 g","fibre":"0.2 g","grasimi":"40 g","grasimi_saturate":"12.5 g","greutate_portie":"70 g"}},{"id":"traditionale-262","titlu":"Turte de Crăciun cu Miere","carte":"Rețete tradiționale","carte_scurt":"Tradițional","categorie":"Sărbători \"Ușoare\"","pagina":262,"portii":"10","timp_minute":60,"calorii":167,"ingrediente":["400 g făină integrală","120 ml apă călduță","40 g miere","20 g îndulcitor pudră (eritritol/stevia)","20 ml ulei de cocos","5 g bicarbonat de sodiu stins cu oțet/lămâie","1 vârf de cuțit de sare","Condimente (scorțișoară, cuișoare, ghimbir) – după gust"],"descriere":"Rețetă tradițională reinterpretată într-o variantă mai sănătoasă, cu\nfăină integrală, miere naturală și condimente specifice sărbătorilor.\nO alegere delicioasă pentru desertul de iarnă, aromat și cu textură\nfragedă.","pasi":"1.Amestecă făina cu sarea, îndulcitorul și condimentele.\n2.Adaugă mierea, uleiul și bicarbonatul stins, apoi toarnă treptat\napa călduță. Frământă până obții un aluat elastic.\n3.Întinde foi subțiri și decupează turtele.\n4.Coace la 180°C timp de 12–15 minute, până devin aurii.\n5.Lasă-le la răcit și păstrează-le într-o cutie – devin mai fragede\ndupă 1–2 zile.","sfaturi":"Făina integrală aduce mai multe fibre și sațietate.\nÎndulcitorul reduce semnificativ caloriile, păstrând gustul dulce.\nTurtele devin ușor crocante și aromate – perfecte lângă ceai\nsau cafea.","alergeni":"gluten (făină de grâu)","variante":"făină de ovăz certificată sau mix fără gluten.","macro":{"calorii_macro":"166.7","proteine":"5.2 g","carbohidrati":"32.1 g","fibre":"4.8 g","grasimi":"0.4 g","grasimi_saturate":"0.1 g","greutate_portie":"55 g"}},{"id":"sarbatori-215","titlu":"Zacuscă","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":215,"portii":"12","timp_minute":60,"calorii":90,"ingrediente":["1.4 kg vinete","1.05 kg ardei kapia","700 g gogoșari","355 g ceapă","280 g roșii pasate / suc de roșii fără zahăr","4 căței usturoi","14 ml ulei de măsline extravirgin","Sare după gust"],"descriere":"O variantă simplă și sănătoasă de zacuscă, potrivită ca gustare sau\nmic dejun, pregătită fără prăjire în exces și cu gust intens de vinete\ncoapte.","pasi":"1.Coace vinetele, ardeii și gogoșarii, apoi curăță-i și lasă-i la\nscurs.\n2.Toacă legumele după preferință (fin sau mai mare).\n3.Călește ceapa 4–5 minute în ulei.\n4.Adaugă vinetele, ardeii, gogoșarii și sucul de roșii.\n5.Fierbe la foc mic 35–45 minute, amestecând periodic.\n6.Adaugă usturoiul zdrobit și sare după gust.\n7.Lasă să se răcească înainte de servire.","sfaturi":"Poți adăuga usturoi copt sau pătrunjel verde pentru un plus de\naromă.\nSe potrivește foarte bine cu roșii proaspete și pâine integrală\nprăjită.\nDacă vrei o textură mai fină, pasează vinetele cu blenderul\nvertical.","alergeni":"nu conține alergeni majori (atenție doar la sensibilitatea la ceapă crudă)","variante":"în loc de ceapă crudă, poți adăuga ceapă coaptă pentru un gust mai dulce și mai ușor digerabil.","macro":{"calorii_macro":"90","proteine":"2.4 g","carbohidrati":"11.8 g","fibre":"3.7 g","grasimi":"1.2 g","grasimi_saturate":"0.1 g","greutate_portie":"100 g"}},{"id":"sarbatori-216","titlu":"Salată de Vinete","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":216,"portii":"2","timp_minute":45,"calorii":61,"ingrediente":["300 g vinete","20 g ceapă tocată fin","5 ml ulei de măsline extravirgin","5 ml zeamă de lămâie","1–2 g sare (după gust)"],"descriere":"O rețetă clasică românească, fină și aromată, ideală pentru un mic\ndejun sau o gustare ușoară, pregătită cu ulei de măsline și zeamă\nde lămâie pentru un gust echilibrat.","pasi":"1.Coace vinetele, curăță-le și lasă-le la scurs cel puțin 30 de\nminute pentru a elimina zeama amară.\n2.Toacă vinetele mărunt cu un cuțit de lemn sau din plastic.\n3.Adaugă treptat uleiul de măsline, amestecând continuu până se\nobține o textură cremoasă.\n4.Încorporează ceapa tocată fin, zeama de lămâie și sarea.\n5.Omogenizează bine și lasă salata 10–15 minute la rece înainte\nde servire.","sfaturi":"Dacă vrei și mai puține calorii, poți adăuga doar 10 ml ulei +\n50 g iaurt grecesc 2%.\nSe potrivește de minune cu roșii proaspete și pâine integrală\nprăjită.\nPoți adăuga usturoi copt sau pătrunjel verde pentru o notă\ndiferită de aromă.","alergeni":"nu conține alergeni majori (atenție la sensibilitatea la ceapă crudă)","variante":"dacă vrei o aromă mai intensă, înlocuiește zeama de lămâie cu oțet de mere.","macro":{"calorii_macro":"61","proteine":"1.6 g","carbohidrati":"7.6 g","fibre":"4.5 g","grasimi":"2.5 g","grasimi_saturate":"0.4 g","greutate_portie":"110 g"}},{"id":"sarbatori-217","titlu":"Fasole Bătută","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":217,"portii":"2","timp_minute":50,"calorii":214,"ingrediente":["240 g fasole albă fiartă","45 g ceapă roșie (din care 35 g în compoziție + 10 g pentru decor)","6 g usturoi (≈ 1 cățel mare)","12 g pastă de tahini","12 ml zeamă de lămâie","70 ml apă de la fiertul fasolei","3 g pătrunjel verde tocat (decor)","Sare, piper, boia – după gust"],"descriere":"O rețetă tradițională reinterpretată într-o variantă mai ușoară, cu\npastă de tahini în loc de ulei, pentru o textură cremoasă și un gust\nbogat, dar echilibrat.","pasi":"1.Fierbe fasolea până devine foarte moale, apoi scurge-o și\npăstrează o parte din apa de fierbere.\n2.Curăță usturoiul și ceapa. Ceapa se călește ușor separat, cu\ncondimentele dorite (boia, piper, sare).\n3.Într-un blender, mixează fasolea fiartă cu usturoiul, pasta de\ntahini, zeama de lămâie și puțin din apa de la fiert.\n4.Ajustează consistența adăugând treptat apă până obții o\ncremă fină.\n5.Potrivește gustul cu sare, piper și, la final, adaugă ceapa călită\ndeasupra.\n6.Decorează cu ceapă roșie feliată și pătrunjel.","sfaturi":"Pentru o textură mai fină, adaugă puțin iaurt grecesc 2% (scade\ncaloriile și îmbogățește cu proteine).\nSe potrivește excelent cu murături light sau ca garnitură la\ngrătare de carne slabă.\nPoți face o variantă mai aromată adăugând chimen măcinat\nsau ardei copți tocați.","alergeni":"susan (din tahini)","variante":"pasta de tahini se poate înlocui cu 10 ml ulei de măsline sau complet eliminată, pentru un preparat mai sărac în grăsimi.","macro":{"calorii_macro":"214","proteine":"11.6 g","carbohidrati":"29.9 g","fibre":"9.9 g","grasimi":"6.4 g","grasimi_saturate":"0.9 g","greutate_portie":"180 g"}},{"id":"sarbatori-218","titlu":"Salată de Sfeclă cu Hrean","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":218,"portii":"2","timp_minute":25,"calorii":111,"ingrediente":["300 g sfeclă roșie","17 g hrean ras","13 ml oțet de mere","9 ml ulei de cocos","Sare – după gust"],"descriere":"O salată răcoritoare și aromată, ideală pentru detoxifiere și\nîntărirea imunității, cu gust intens de sfeclă coaptă și hrean\nproaspăt.","pasi":"1.Fierbe sau coace sfecla până se înmoaie, apoi curăț-o de\ncoajă și las-o să se răcească complet.\n2.Rade sfecla pe răzătoarea mare și adaugă hreanul ras fin.\n3.Toarnă oțetul de mere și uleiul de cocos.\n4.Amestecă bine toate ingredientele până se omogenizează.\n5.Potrivește gustul cu sare și lasă salata la rece 10–15 minute\npentru ca aromele să se întrepătrundă.","sfaturi":"Poți adăuga semințe de dovleac sau nuci mărunțite pentru un\nplus de textură (atenție la calorii).\nÎnlocuiește uleiul de floarea-soarelui cu ulei de măsline\nextravirgin pentru o variantă mai sănătoasă.\nSe servește rece, ca garnitură sau gustare răcoritoare.","alergeni":"nu conține alergeni majori (atenție doar la sensibilitatea la hrean)","variante":"oțetul de mere poate fi înlocuit cu zeamă de lămâie pentru o aromă mai fresh.","macro":{"calorii_macro":"111.3","proteine":"0 g","carbohidrati":"0 g","fibre":"0 g","grasimi":"0 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-219","titlu":"Salată de Roșii cu Pătrunjel și Bulgur","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":219,"portii":"2","timp_minute":25,"calorii":227,"ingrediente":["90 g bulgur hidratat","55 g pătrunjel","215 g roșii","25 g ceapă verde","9 g ulei de măsline zeamă de lămâie sare"],"descriere":"O salată ușoară, plină de prospețime, ideală ca garnitură sau\ngustare bogată în fibre și vitamine.","pasi":"1.Hidratează bulgurul conform instrucțiunilor de pe ambalaj, apoi\nscurge-l bine.\n2.Toacă mărunt pătrunjelul și ceapa verde.\n3.Taie roșiile în cubulețe mici și adaugă-le peste bulgur.\n4.Toarnă zeama de lămâie și uleiul de măsline.\n5.Asezonează cu sare după gust și amestecă bine toate\ningredientele.\n6.Lasă salata 10–15 minute la rece înainte de servire pentru ca\naromele să se combine.","sfaturi":"Toacă pătrunjelul cât mai fin pentru o consistență ușoară și\naromată.\nSe păstrează 1 zi la frigider, dar dressingul e bine să fie\nadăugat doar înainte de servire ca să nu înmoaie prea tare\nbulgurul.","alergeni":"gluten (din bulgur)","variante":"Poți prepara salata fără gluten înlocuind bulgurul cu quinoa fiartă, deoarece aceasta oferă o textură similară și este o sursă excelentă de proteine și minerale.","macro":{"calorii_macro":"227","proteine":"9.5 g","carbohidrati":"5 g","fibre":"1.9 g","grasimi":"4.5 g","grasimi_saturate":"0.7 g"}},{"id":"sarbatori-220","titlu":"Pastă de Năut cu Bastonașe de Legume","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":220,"portii":"2","timp_minute":15,"calorii":236,"ingrediente":["120 g pastă de năut","120 g morcovi","120 g ardei gras","5 g zeamă de lămâie","5 g boia de ardei","25 g semințe de cânepă"],"descriere":"O gustare echilibrată, bogată în proteine vegetale și grăsimi\nsănătoase, ideală pentru prânzuri rapide sau pauze energizante.","pasi":"1.Taie morcovii și ardeiul gras în bastonașe subțiri.\n2.Așază pasta de năut într-un bol mic și stropește-l cu zeama de\nlămâie.\n3.Presară boia de ardei pentru un plus de culoare și aromă.\n4.Adaugă semințele de cânepă deasupra, pentru textură și aport\nnutritiv.\n5.Servește imediat, alături de bastonașele de legume.","sfaturi":"Adaugă un praf de chimion sau coriandru în pasta de năut.\nCompletează cu pătrunjel verde sau coriandru tocat fin.","alergeni":"susan (din pasta de năut)","variante":"Dacă ai alergie la semințe, poți elimina semințele de cânepă și le poți înlocui cu fulgi de drojdie inactivă, care oferă o aromă ușor “cheesy” și adaugă vitamine din grupul B.","macro":{"calorii_macro":"236","proteine":"8.2 g","carbohidrati":"22.1 g","fibre":"4.1 g","grasimi":"11.6 g","grasimi_saturate":"1.3 g","greutate_portie":"195 g"}},{"id":"sarbatori-221","titlu":"Pate de Linte și Ceapă Caramelizată","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":221,"portii":"2","timp_minute":35,"calorii":277,"ingrediente":["80 g linte","160 g ceapă","25 g ulei sare, piper, cimbru"],"descriere":"O alternativă vegetală gustoasă și hrănitoare, cu textură fină și\naromă intensă de ceapă dulce, perfectă pentru tartine sau gustări\nrapide.","pasi":"1.Fierbe lintea până devine moale, apoi scurge-o bine.\n2.Taie ceapa mărunt și gătește-o într-o tigaie antiaderentă cu\nulei, la foc mic, până devine aurie și caramelizată.\n3.Pune lintea în blender și adaugă ceapa caramelizată, sare,\npiper și cimbru.\n4.Mixează până obții o pastă omogenă; poți adăuga puțină apă\ndacă este prea densă.\n5.Servește pateul rece, pe pâine integrală sau biscuiți sărați.","sfaturi":"Poți adăuga usturoi la călirea cepei pentru un plus de aromă.\nSe păstrează foarte bine la frigider 2-3 zile, iar la congelator\npână la o lună.","alergeni":"nu conține alergeni majori (atenție la urme de gluten din procesare industrială)","variante":"Dacă ai intoleranță la ceapă, poți înlocui ceapa caramelizată cu 100 g dovleac copt, care oferă dulceață naturală și menține consistența cremoasă a pateului.","macro":{"calorii_macro":"277","proteine":"10.8 g","carbohidrati":"24 g","fibre":"12 g","grasimi":"12.9 g","grasimi_saturate":"1.8 g","greutate_portie":"132 g"}},{"id":"sarbatori-222","titlu":"Pate de Ardei Copți","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":222,"portii":"2","timp_minute":25,"calorii":201,"ingrediente":["500 g ardei kapia","24 g semințe de floarea-soarelui","16 g ulei de măsline sare – după gust"],"descriere":"Un aperitiv fin și aromat, bogat în grăsimi sănătoase și proteine\nvegetale, ideal pentru tartine sau gustări rapide între mese.","pasi":"1.Coace ardeii până se înmoaie, apoi curăță-i de coajă și\nsemințe.\n2.Într-un blender, adaugă ardeii copți, semințele de floarea-\nsoarelui și uleiul.\n3.Mixează până obții o pastă fină, adăugând puțină apă dacă\neste nevoie pentru consistență cremoasă.\n4.Potrivește gustul cu sare.\n5.Servește pateul rece, alături de legume crude sau pâine\nintegrală.","sfaturi":"Perfect pe pâine integrală, lipii, crackers sau ca sos pentru\nlegume.\nMerge și ca bază pentru sandwich-uri vegetariene sau wraps.","alergeni":"semințe (floarea-soarelui)","variante":"Poți înlocui semințele de floarea-soarelui cu 20 g nuci caju hidratate, obținând o cremă mai fină și un gust ușor dulceag, ideal pentru tartine vegetale.","macro":{"calorii_macro":"201","proteine":"5 g","carbohidrati":"17.4 g","fibre":"1.05 g","grasimi":"14.2 g","grasimi_saturate":"1.8 g","greutate_portie":"195 g"}},{"id":"sarbatori-223","titlu":"Pate de Ciuperci","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":223,"portii":"2","timp_minute":30,"calorii":135,"ingrediente":["270 g ciuperci","110 g ceapă","20 g ulei de măsline (≈ 1½ linguri) sare, piper"],"descriere":"Un preparat cremos, cu gust intens de ciuperci și note fine de\nceapă, perfect ca aperitiv sau gustare ușoară.","pasi":"1.Curăță ciupercile și taie-le felii subțiri.\n2.Toacă ceapa și călește-o ușor în ulei, la foc mic, până devine\ntranslucidă.\n3.Adaugă ciupercile și gătește-le până se evaporă toată apa.\n4.Transferă amestecul în blender, adaugă sare și piper după gust\nși mixează până obții o pastă omogenă.\n5.Servește pateul rece, pe felii de pâine integrală sau biscuiți\nsărați.","sfaturi":"Poți adăuga usturoi la călirea cepei pentru un plus de aromă.\nSe păstrează foarte bine la frigider 2-3 zile, iar la congelator\npână la o lună.","alergeni":"nu conține alergeni majori (atenție doar la adaosuri dacă se consumă cu pâine)","variante":"Poți elimina ceapa și poți adăuga o jumătate de linguriță de usturoi granulat pentru a păstra aroma, fără a irita digestiv.","macro":{"calorii_macro":"134.7","proteine":"4.6 g","carbohidrati":"4.1 g","fibre":"1.35 g","grasimi":"10 g","grasimi_saturate":"1.4 g","greutate_portie":"200 g"}},{"id":"sarbatori-224","titlu":"Pastă de Năut cu Roșii Uscate","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":224,"portii":"2","timp_minute":20,"calorii":317,"ingrediente":["350 g năut fiert","18 g roșii uscate","5 g usturoi (≈ 2 căței mici)","25 g ulei de măsline"],"descriere":"O cremă delicioasă și aromată, inspirată din bucătăria\nmediteraneană, bogată în proteine vegetale și grăsimi sănătoase.","pasi":"1.Pune roșiile uscate la înmuiat în apă caldă pentru 10 minute,\napoi scurge-le bine.\n2.Într-un blender, adaugă năutul fiert, roșiile, usturoiul și uleiul de\nmăsline.\n3.Mixează până obții o pastă cremoasă; poți adăuga 1–2 linguri\nde apă pentru o consistență mai fină.\n4.Potrivește gustul cu sare și, opțional, puțin piper sau zeamă de\nlămâie.\n5.Servește rece, pe pâine integrală sau cu legume crude.","sfaturi":"Textură mai fină: Adaugă 1–2 linguri de apă caldă sau zeamă\nde lămâie dacă pasta iese prea groasă.\nMerge foarte bine și cu busuioc sau oregano.","alergeni":"nu conține alergeni majori (atenție la posibile urme de gluten dacă se servește cu pâine)","variante":"Dacă nu tolerezi năutul, îl poți înlocui cu aceeași cantitate de fasole albă fiartă, care păstrează textura și menține aproape identic aportul caloric.","macro":{"calorii_macro":"317","proteine":"0.2 g","carbohidrati":"0.3 g","fibre":"0.1 g","grasimi":"12.5 g","grasimi_saturate":"1.8 g","greutate_portie":"199 g"}},{"id":"sarbatori-225","titlu":"Salată de Vinete cu Tahini","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":225,"portii":"2","timp_minute":35,"calorii":121,"ingrediente":["375 g vinete coapte","22 g tahini","2 g usturoi zeamă de lămâie sare"],"descriere":"O variantă a clasicei salate de vinete, cremoasă și bogată în\ngrăsimi sănătoase din semințe de susan, ideală pentru tartine sau\nca garnitură.","pasi":"1.Coace vinetele, curăță-le de coajă și lasă-le la scurs cel puțin\n20 de minute.\n2.Toacă-le mărunt cu un cuțit de lemn sau din plastic.\n3.Într-un bol, amestecă vinetele cu tahini, zeama de lămâie și\nusturoiul pisat.\n4.Potrivește gustul cu sare și, dacă dorești, adaugă puțin piper.\n5.Lasă salata la rece 15–20 de minute înainte de servire pentru\nca aromele să se echilibreze.","sfaturi":"Pentru un gust autentic, coace vinetele direct pe flacără sau pe\ngrill, nu doar în cuptor.\nDacă vrei o textură mai cremoasă, adaugă câteva linguri de\niaurt vegetal sau lapte de cocos light.","alergeni":"susan (din tahini)","variante":"Dacă ai alergie la susan, poți înlocui tahiniul cu aceeași cantitate de iaurt grecesc 2% sau cu piure fin de caju hidratat, ambele păstrând textura cremoasă și un aport caloric foarte apropiat.","macro":{"calorii_macro":"121","proteine":"4.7 g","carbohidrati":"9.8 g","fibre":"5.7 g","grasimi":"0 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-226","titlu":"Rulouri de Dovlecel cu Cremă de Nuci","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":226,"portii":"4","timp_minute":20,"calorii":143,"ingrediente":["320 g dovlecel feliat","80 g nuci hidratate","5 g usturoi zeamă de lămâie sare, piper"],"descriere":"Un aperitiv rafinat și echilibrat, cu texturi contrastante și gust intens\nde nuci, potrivit pentru mesele ușoare sau platourile festive.","pasi":"1.Feliază dovlecelul subțire pe lungime și gătește feliile pe grill 1–\n2 minute pe fiecare parte, până se înmoaie ușor.\n2.Într-un blender, adaugă nucile hidratate, usturoiul, zeama de\nlămâie, sarea și piperul, apoi mixează până obții o cremă fină.\n3.Lasă compoziția 5–10 minute la frigider pentru a se întări ușor.\n4.Pune câte o linguriță de cremă pe capătul fiecărei felii de\ndovlecel și rulează strâns.\n5.Așază rulourile pe un platou și servește-le reci, ca aperitiv.","sfaturi":"Dacă vrei un gust mai intens, unge feliile de dovlecel cu puțin\nulei de măsline și condimente înainte de a le găti pe grill.\nPentru o cremă mai fină, mixează nucile hidratate cu câteva\nlinguri de apă rece sau lapte vegetal.","alergeni":"nuci","variante":"Dacă ai alergie la nuci, poți înlocui crema de nuci cu aceeași cantitate de semințe de floarea-soarelui hidratate și mixate, care oferă o textură similară și mențin un aport caloric aproape identic.","macro":{"calorii_macro":"143","proteine":"3.9 g","carbohidrati":"4.3 g","fibre":"2 g","grasimi":"13 g","grasimi_saturate":"1.3 g","greutate_portie":"101 g"}},{"id":"sarbatori-227","titlu":"Tartine cu Roșii și Busuioc","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":227,"portii":"2","timp_minute":20,"calorii":81,"ingrediente":["50 de grame pâine integrală","40 de g roșii","2 căței usturoi","Frunze de busuioc proaspăt","5 ml ulei de măsline","Sare – după gust"],"descriere":"Un aperitiv clasic, simplu și aromat, perfect pentru o gustare ușoară\nsau ca început de masă rafinat.","pasi":"1.Prăjește feliile de baghetă până devin crocante și aurii.\n2.Freacă fiecare felie cu usturoiul tăiat pe jumătate, cât sunt încă\nfierbinți.\n3.Taie roșiile cubulețe mici și amestecă-le cu uleiul de măsline,\nsarea și frunzele de busuioc rupte.\n4.Așază amestecul peste feliile de pâine prăjită chiar înainte de\nservire.\n5.Opțional, stropește cu puțină zeamă de lămâie pentru\nprospețime suplimentară.","sfaturi":"Folosește roșii foarte coapte (cherry sau prunișoare) pentru un\ngust mai dulce și intens.\nAdaugă câteva picături de oțet balsamic sau suc de lămâie\npentru echilibru.\nPrăjește pâinea la cuptor sau pe grill pentru a rămâne\ncrocantă mai mult timp.","alergeni":"gluten (din pâine)","variante":"Dacă ai intoleranță la gluten, poți înlocui bagheta clasică cu pâine fără gluten având aceeași greutate, astfel încât porția finală să păstreze aproape identic aportul caloric și textura crocantă.","macro":{"calorii_macro":"80.7","proteine":"3.1 g","carbohidrati":"10.1 g","fibre":"0.2 g","grasimi":"3.3 g","grasimi_saturate":"0.5 g","greutate_portie":"50 g"}},{"id":"sarbatori-228","titlu":"Salată de Cartofi cu Ceapă Verde","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":228,"portii":"1","timp_minute":20,"calorii":232,"ingrediente":["170 g cartofi fierți","10 g ceapă verde","10 g muștar","9 g ulei sare – după gust"],"descriere":"O salată sățioasă și plină de aromă, potrivită ca garnitură sau\nmasă ușoară, cu gust echilibrat între dulceața cartofilor și\naciditatea muștarului.","pasi":"1.Fierbe cartofii în coajă până devin moi, apoi curăță-i și taie-i\ncuburi mari.\n2.Taie ceapa verde rondele subțiri și adaug-o peste cartofi.\n3.Într-un bol mic, amestecă muștarul cu uleiul, sarea și piperul\npână se formează un dressing cremos.\n4.Toarnă dressingul peste cartofi și amestecă ușor, fără să\nzdrobești bucățile.\n5.Lasă salata la frigider 15–20 de minute pentru ca aromele să se\ncombine.","sfaturi":"Poți adăuga pătrunjel sau mărar pentru extra prospețime.\nDacă vrei o variantă mai light, redu uleiul la 1 lingură.","alergeni":"muștar","variante":"Dacă nu tolerezi muștarul, îl poți înlocui cu aceeași cantitate de iaurt grecesc 2% amestecat cu puțină zeamă de lămâie, obținând un dressing cremos cu aport caloric foarte apropiat de varianta originală.","macro":{"calorii_macro":"232","proteine":"2.3 g","carbohidrati":"34.4 g","fibre":"3.4 g","grasimi":"9.5 g","grasimi_saturate":"1.4 g"}},{"id":"sarbatori-229","titlu":"Plăcintă Sărată cu Varză Călită","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":229,"portii":"10","timp_minute":75,"calorii":214,"ingrediente":["500 g aluat de post (foietaj sau dospit)","500 g varză tocată","40 g ceapă","Sare, piper, cimbru"],"descriere":"Un preparat tradițional de post, cu foi crocante și umplutură\naromată de varză și ceapă, ideal pentru prânz sau cină ușoară.","pasi":"1.Toacă varza și ceapa mărunt, apoi călește-le împreună într-o\ntigaie mare, la foc mic, până se înmoaie complet și scade\nlichidul.\n2.Condimentează cu sare, piper și cimbru după gust. Lasă\numplutura să se răcească.\n3.Întinde jumătate din aluat într-o tavă tapetată cu hârtie de\ncopt.\n4.Adaugă varza călită uniform, apoi acoperă cu restul de aluat.\n5.Înțeapă ușor suprafața cu o furculiță și coace la 180°C timp de\n35–40 de minute, până devine aurie.\n6.Lasă plăcinta să se răcească ușor înainte de porționare.","sfaturi":"Poți adăuga semințe de chimen sau o lingură de drojdie\ninactivă în varză pentru un plus de aromă.\nSe servește caldă sau rece, alături de o salată verde sau iaurt\nvegetal.","alergeni":"gluten (aluat)","variante":"Dacă ai intoleranță la gluten, poți folosi un aluat fără gluten în aceeași cantitate, astfel încât porția finală să păstreze o valoare calorică aproximativ identică și aceeași textură crocantă după coacere.","macro":{"calorii_macro":"213.6","proteine":"0.7 g","carbohidrati":"2.9 g","fibre":"0 g","grasimi":"0.05 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-230","titlu":"Pogăcele de Post cu Cartofi","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":230,"portii":"4","timp_minute":90,"calorii":219,"ingrediente":["195 g făină albă","110 g cartofi fierți","12 g drojdie proaspătă","78 g apă călduță","2 g sare","12 g ulei"],"descriere":"Gustoase și moi, aceste pogăcele sunt o variantă de post perfectă\npentru mic dejun, gustare sau chiar aperitiv cald.","pasi":"1.Fierbe cartofii, pasează-i și lasă-i să se răcească ușor.\n2.Dizolvă drojdia în apa călduță împreună cu o linguriță de făină\nși las-o 10 minute să se activeze.\n3.Într-un bol mare, amestecă făina cu cartofii pasați, sarea, uleiul\nși maiaua obținută.\n4.Frământă până obții un aluat moale și elastic, apoi lasă-l la\ndospit 45–60 de minute într-un loc cald.\n5.Întinde aluatul într-o foaie groasă de 1,5–2 cm și decupează\npogăcelele cu un pahar.\n6.Așază-le în tavă, unge-le ușor cu ulei și coace-le la 180°C timp\nde 20–25 de minute, până devin aurii.","sfaturi":"Poți adăuga verdeață sau condimente (rozmarin, cimbru) în\naluat pentru un plus de aromă.\nSe pot servi simple sau alături de o cremă de legume sau\nhummus.","alergeni":"gluten (făină)","variante":"Dacă ai intoleranță la gluten, poți înlocui făina clasică cu făină fără gluten în aceeași cantitate, menținând textura finală foarte apropiată și un aport caloric similar.","macro":{"calorii_macro":"218.5","proteine":"5.15 g","carbohidrati":"41.1 g","fibre":"0.55 g","grasimi":"3 g","grasimi_saturate":"0 g","greutate_portie":"100 g"}},{"id":"sarbatori-231","titlu":"Lipie de Post cu Măsline și Rozmarin","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":231,"portii":"8","timp_minute":90,"calorii":186,"ingrediente":["(1 TAVĂ MICĂ)","400 g făină","250 ml apă călduță","7 g drojdie uscată","2 linguri ulei de măsline","10 g măsline negre, feliate","Rozmarin proaspăt sau uscat"],"descriere":"O focaccia parfumată și pufoasă, cu măsline sărate și aromă\nintensă de rozmarin, simplă și extrem de gustoasă.","pasi":"1.Prepară un aluat elastic din făină, apă, drojdie, ulei și sare.\n2.Lasă-l la dospit 45 minute.\n3.Întinde aluatul într-o tavă unsă cu ulei.\n4.Fă mici adâncituri cu degetele, adaugă măsline și rozmarin.\n5.Stropește cu puțin ulei și coace la 200°C timp de 25 minute.","sfaturi":"Poți adăuga roșii uscate sau felii subțiri de ceapă roșie pentru\nmai multă aromă.\nServește-o caldă, alături de salate sau hummus.","alergeni":"conține gluten (făină). Poate conține urme de soia sau susan, în funcție de tipul de măsline folosit","variante":"poți folosi făină integrală sau mix fără gluten; poți înlocui măslinele cu roșii uscate, ceapă roșie sau ardei copți; poți adăuga usturoi, oregano sau busuioc pentru aromă suplimentară.","macro":{"calorii_macro":"185.7","proteine":"5.35 g","carbohidrati":"36.9 g","fibre":"0.05 g","grasimi":"1.4 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-232","titlu":"Lipii de Post la Tigaie","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":232,"portii":"2","timp_minute":40,"calorii":224,"ingrediente":["120 g făină integrală","72 g apă călduță","2 g sare","5 g ulei de măsline"],"descriere":"O variantă simplă și rapidă de pâine plată, moale și aromată,\nideală pentru sandvișuri, wraps sau alături de mâncăruri cu sos.","pasi":"1.Într-un bol mare, amestecă făina cu sarea.\n2.Adaugă apa călduță și uleiul de măsline, apoi frământă până\nobții un aluat moale și elastic.\n3.Acoperă-l cu un prosop și lasă-l să se odihnească 20 de minute.\n4.Împarte aluatul în 4 bile egale și întinde fiecare bilă într-o foaie\nsubțire.\n5.Gătește lipiile pe o tigaie antiaderentă, 1–2 minute pe fiecare\nparte, până se rumenesc ușor.\n6.Acoperă-le cu un prosop curat după coacere pentru a rămâne\nfragede.","sfaturi":"Poți adăuga în aluat ierburi aromate (oregano, busuioc) sau\nsemințe pentru un plus de aromă și fibre.\nPăstrează lipiile într-un prosop curat pentru a rămâne moi.","alergeni":"gluten (făină)","variante":"Dacă ai intoleranță la gluten, poți înlocui făina clasică cu făină fără gluten în aceeași cantitate, menținând textura finală foarte apropiată și un aport caloric similar.","macro":{"calorii_macro":"224","proteine":"7.8 g","carbohidrati":"43.2 g","fibre":"7.2 g","grasimi":"3.1 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-233","titlu":"Covrigi de Casă de Post","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":233,"portii":"4","timp_minute":80,"calorii":240,"ingrediente":["260 g făină","130 g apă călduță","4 g drojdie uscată","3 g sare","10 g semințe susan"],"descriere":"Pufoși la interior și crocanți la exterior, acești covrigi sunt ideali\npentru gustări sau mic dejun.","pasi":"1.Într-un bol mare, amestecă făina cu drojdia și sarea.\n2.Adaugă treptat apa călduță și frământă până obții un aluat\nomogen și elastic.\n3.Acoperă-l și lasă-l la dospit 45–60 de minute, până își dublează\nvolumul.\n4.Împarte aluatul în 4 bucăți egale și formează covrigii.\n5.Fierbe fiecare covrig 20–30 de secunde într-o oală cu apă\nclocotită (opțional cu puțină sare), apoi scoate-i pe o tavă\ntapetată cu hârtie de copt.\n6.Presară semințele de susan deasupra și coace la 200°C timp\nde 20–25 de minute, până devin aurii.","sfaturi":"Dacă îi ungi cu puțin sirop de arțar sau miere vegană, vor avea\nun luciu auriu.\nPoți adăuga ierburi aromate sau usturoi granulat în aluat pentru\nun gust diferit.\nSe pot congela și reîncălzi la nevoie.","alergeni":"gluten (făină), semințe (susan, mac)","variante":"Dacă ai intoleranță la gluten, poți folosi aceeași cantitate de făină fără gluten pentru a păstra un aport caloric asemănător, iar dacă ești alergic la susan, îl poți înlocui cu mac sau cu sare grunjoasă, fără să modifici valoarea calorică finală.","macro":{"calorii_macro":"239.8","proteine":"7.35 g","carbohidrati":"48.4 g","fibre":"0 g","grasimi":"1.25 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-236","titlu":"Tocăniță de Ciuperci cu Mămăligă","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":236,"portii":"2","timp_minute":40,"calorii":201,"ingrediente":["305 g ciuperci","50 g ceapă","50 g roșie","20 g pastă de roșii","2 g usturoi (≈ ½–1 cățel mic)","5 g ulei de măsline","70 g mălai","Sare, piper – după gust"],"descriere":"Un preparat tradițional românesc, consistent și aromat, potrivit\npentru zilele de post sau pentru un prânz ușor și hrănitor.","pasi":"1.Toacă ceapa și usturoiul, apoi călește-le în uleiul de măsline 2–3\nminute, până devin ușor aurii.\n2.Adaugă ciupercile feliate și gătește-le 10–12 minute, până se\nînmoaie și scad în volum.\n3.Încorporează roșiile tocate și pasta de roșii, amestecând bine.\n4.Fierbe la foc mic 10–12 minute, până se îngroașă sosul;\npotrivește gustul cu sare și piper.\n5.Separat, fierbe mălaiul în apă cu un praf de sare, amestecând\nconstant, până obții o mămăligă densă.\n6.Servește tocănița caldă, alături de mămăligă.","sfaturi":"Pentru un gust mai intens, adaugă mărar sau pătrunjel verde la\nfinal.\nPoți îmbogăți rețeta cu ardei gras sau dovlecel.\nDacă dorești mai multe proteine, servește cu un ou poșat sau 50\ng brânză slabă.","alergeni":"nu conține alergeni majori","variante":"înlocuiește mămăliga cu orez integral sau hrișcă pentru mai multe fibre.","macro":{"calorii_macro":"201","proteine":"7.8 g","carbohidrati":"34.5 g","fibre":"2.2 g","grasimi":"2.9 g","grasimi_saturate":"0.4 g","greutate_portie":"300 g"}},{"id":"sarbatori-237","titlu":"Tocană de Legume cu Orez","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":237,"portii":"2","timp_minute":45,"calorii":147,"ingrediente":["75 g ceapă","150 g ardei gras","150 g morcovi","75 g roșie","50 g orez basmati","7 ml ulei de măsline","2 g sare","1 g piper negru"],"descriere":"Un preparat de post hrănitor și colorat, bogat în fibre și vitamine,\nideal pentru prânz sau cină ușoară.","pasi":"1.Curăță și taie ceapa, morcovii și ardeii în bucăți mici.\n2.Călește ceapa în uleiul de măsline 2–3 minute, apoi adaugă\nmorcovii și ardeii.\n3.Gătește legumele 10 minute la foc mediu, amestecând din când\nîn când.\n4.Adaugă roșiile tocate, orezul spălat și 200 ml apă fierbinte.\n5.Fierbe la foc mic 15–20 de minute, până când orezul este\nmoale și lichidul scade.\n6.Condimentează cu sare și piper după gust, apoi lasă tocană să\nse odihnească 5 minute înainte de servire.","sfaturi":"Poți adăuga dovlecel sau vinete pentru un plus de volum și fibre.\nDacă vrei mai multe proteine, adaugă năut fiert (100 g) sau\npiept de pui la grătar (100 g).\nPentru o aromă mediteraneană, condimentează cu oregano și\nbusuioc.","alergeni":"nu conține alergeni majori (atenție doar la sensibilitatea la piper)","variante":"înlocuiește orezul basmati cu orez integral sau hrișcă pentru mai multe fibre.","macro":{"calorii_macro":"147","proteine":"2.9 g","carbohidrati":"21.4 g","fibre":"2.6 g","grasimi":"3.9 g","grasimi_saturate":"0.6 g","greutate_portie":"300 g"}},{"id":"sarbatori-238","titlu":"Ghiveci de Legume cu Orez","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":238,"portii":"1","timp_minute":45,"calorii":93,"ingrediente":["15 g orez basmati","40 g vinete","40 g dovlecel","32 g ardei roșu","55 g roșii","16 g ceapă","3 g ulei de măsline"],"descriere":"Un preparat de post hrănitor și colorat, bogat în fibre și vitamine,\nideal pentru prânz sau cină ușoară.","pasi":"1.Curăță și taie ceapa, morcovii și ardeii în bucăți mici.\n2.Călește ceapa în uleiul de măsline 2–3 minute, apoi adaugă\nmorcovii și ardeii.\n3.Gătește legumele 10 minute la foc mediu, amestecând din când\nîn când.\n4.Adaugă roșiile tocate, orezul spălat și 200 ml apă fierbinte.\n5.Fierbe la foc mic 15–20 de minute, până când orezul este\nmoale și lichidul scade.\n6.Condimentează cu sare și piper după gust, apoi lasă tocană să\nse odihnească 5 minute înainte de servire.","sfaturi":"Pentru un gust mai intens, adaugă puțin usturoi tocat sau boia\nafumată la călirea legumelor.\nDacă îl pregătești pentru mai multe zile, păstrează orezul\nseparat și combină doar înainte de servire ca să nu se îmbibe\nprea mult.","alergeni":"nu conține alergeni majori (atenție la posibile urme de gluten dacă orezul este procesat în fabrici mixte)","variante":"Dacă ai intoleranță la gluten, poți folosi pastă de roșii certificată fără gluten și orez ambalat în mod similar, menținând același gust și un aport caloric identic cu varianta originală.","macro":{"calorii_macro":"92.4","proteine":"1.9 g","carbohidrati":"12.2 g","fibre":"2.8 g","grasimi":"3.2 g","grasimi_saturate":"0 g","greutate_portie":"350 g"}},{"id":"sarbatori-239","titlu":"Mâncare de Linte Roșie cu Legume","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":239,"portii":"1","timp_minute":35,"calorii":189,"ingrediente":["18 g linte roșie","55 g tofu afumat","28 g ardei gras","17 g ceapă roșie","55 g roșii pasate","3 g ulei de măsline"],"descriere":"Un preparat de post bogat în proteine vegetale, cu gust intens și\ntextură cremoasă, potrivit pentru prânzuri echilibrate și energizante.","pasi":"1.Taie tofu-ul cuburi și rumenește-l ușor într-o tigaie cu puțin ulei,\napoi scoate-l deoparte.\n2.Călește ceapa și ardeiul gras în aceeași tigaie 3–4 minute,\npână se înmoaie.\n3.Adaugă lintea roșie spălată, roșiile pasate și 200 ml apă caldă.\n4.Fierbe la foc mic 15–20 de minute, amestecând din când în\ncând, până când lintea devine moale și sosul se îngroașă.\n5.Adaugă tofu-ul rumenit, condimentează cu sare și piper și mai\nlasă pe foc 2–3 minute.\n6.Servește preparatul cald, simplu sau alături de orez sau legume\naburite.","sfaturi":"Spală lintea de 2–3 ori înainte de fierbere – va fierbe mai\nuniform și nu va balona.\nRețeta se păstrează foarte bine 2–3 zile la frigider, așa că o\npoți face în avans pentru mai multe mese.","alergeni":"soia (din tofu)","variante":"Dacă ai alergie la soia, poți înlocui tofu cu aceeași cantitate de ciuperci brune sotate, care aduc volum și textură similară, menținând un aport caloric foarte apropiat.","macro":{"calorii_macro":"188.6","proteine":"11.9 g","carbohidrati":"15.5 g","fibre":"0.7 g","grasimi":"7.8 g","grasimi_saturate":"0 g","greutate_portie":"330 g"}},{"id":"sarbatori-240","titlu":"Mâncare de Mazăre cu Baby Morcovi și Tofu","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":240,"portii":"1","timp_minute":25,"calorii":174,"ingrediente":["70 g tofu afumat","35 g mazăre","35 g morcovi baby","35 g roșii pasate","18 g ceapă","2 g usturoi","2 g ulei de măsline"],"descriere":"Un preparat aromat și consistent, cu mazăre dulce, morcovi fragezi\nși tofu rumenit, legate într-un sos ușor tomat.","pasi":"1.Taie cubulețe tofu-ul și prăjește-l ușor într-o tigaie cu puțin ulei\nde măsline, până devine auriu.\n2.Adaugă ceapa și usturoiul tocate mărunt, lasă-le să se înmoaie.\n3.Pune morcovii și mazărea, apoi toarnă roșiile pasate.\n4.Condimentează cu sare, piper, oregano sau cimbru.\n5.Fierbe la foc mic 10–12 minute, până legumele devin fragede și\nsosul se leagă.","sfaturi":"Poți adăuga 1 linguriță de boia dulce sau curry pentru un gust\nmai intens.\nSe servește simplă sau alături de 50 g orez basmati fiert (pentru\nextra carbohidrați).\nSe păstrează 2 zile la frigider, într-un recipient închis ermetic.","alergeni":"poate conține soia (tofu afumat)","variante":"poți înlocui tofu afumat cu tempeh, ciuperci sau piept de pui pentru o versiune non-vegană; mazărea poate fi înlocuită cu fasole verde, iar baby morcovii cu morcov obișnuit tăiat cuburi.","macro":{"calorii_macro":"174","proteine":"11.5 g","carbohidrati":"9 g","fibre":"2.7 g","grasimi":"7.7 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-241","titlu":"Iahnie de Fasole","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":241,"portii":"2","timp_minute":90,"calorii":414,"ingrediente":["230 g fasole boabe uscată","70 g ceapă","45 g morcovi","45 g ardei gras","90 g sos de roșii fără zahăr","7 ml ulei de măsline (≈ 1½ lingurițe)","4 g usturoi (≈ 1–2 căței)","1 foaie de dafin","2 g cimbru uscat","7 g pătrunjel verde tocat","Sare și piper – după gust"],"descriere":"Un preparat tradițional românesc, hrănitor și aromat, ideal pentru\nzilele de post sau ca fel principal sățios, bogat în proteine vegetale\nși fibre..","pasi":"1.Dacă folosești fasole boabe uscată, las-o la înmuiat peste\nnoapte, apoi fierbe-o 60–70 de minute până devine moale.\n2.Într-o tigaie mare, călește ceapa și morcovii tocați mărunt în\nuleiul de măsline 3–4 minute.\n3.Adaugă ardeiul gras și usturoiul, continuă gătirea încă 2 minute.\n4.Încorporează fasolea fiartă, roșiile cuburi (sau bulionul) și\ncondimentele: foi de dafin, cimbru, sare și piper.\n5.Fierbe la foc mic 20–25 de minute, până când sosul se îngroașă\nși aromele se combină.\n6.Presară pătrunjelul verde tocat înainte de servire.","sfaturi":"Servește cu murături light sau salată de varză crudă.\nPentru un gust mai bogat, adaugă la final 1 linguriță de boia\nafumată.\nSe potrivește și cu o mămăliguță mică ca garnitură.","alergeni":"nu conține alergeni majori (atenție doar la sensibilitatea la leguminoase)","variante":"poți înlocui fasolea albă cu fasole roșie sau năut.","macro":{"calorii_macro":"414","proteine":"26.7 g","carbohidrati":"58.8 g","fibre":"1.2 g","grasimi":"5.6 g","grasimi_saturate":"0.8 g","greutate_portie":"440 g"}},{"id":"sarbatori-242","titlu":"Varză Călită cu Mărar","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":242,"portii":"2","timp_minute":40,"calorii":137,"ingrediente":["500 g varză albă tocată fin","80 g ceapă","1 buc morcov mic (≈ 60 g)","10 ml ulei de măsline","150 ml apă","1 linguriță boia dulce","1 praf piper","1 praf sare","20 g mărar proaspăt tocat","1 linguriță oțet (opțional, pentru gust fresh)"],"descriere":"O rețetă extrem de simplă și gustoasă, perfectă ca garnitură light\nsau masă principală rapidă, bogată în fibre și cu foarte puține\ncalorii.","pasi":"1.Călește ceapa și morcovul în ulei + 2 linguri apă, 2–3 minute.\n2.Adaugă varza tocată, amestecă și toarnă 150 ml apă.\n3.Condimentează cu sare, piper și boia dulce.\n4.Gătește 20–25 minute la foc mediu până scade și devine ușor\nrumenită.\n5.Adaugă mărarul tocat și oțetul (opțional), amestecă și stinge\nfocul.","sfaturi":"Pentru un plus de aromă: adaugă ½ linguriță chimen.\nPentru varianta cu proteine: poți adăuga 150 g piept de\ncurcan/ pui tras rapid la tigaie (atenție se modifică caloriile).","alergeni":"Preparatul nu conține alergeni majori, însă în funcție de producător, boiaua și oțetul pot avea urme de gluten sau sulfiți; varza, morcovul, mărarul și condimentele de bază nu prezintă riscuri alergene","variante":"Dacă ai sensibilitate la sulfiți, poți înlocui oțetul cu aceeași cantitate de zeamă de lămâie, menținând același nivel caloric și același gust acrișor care echilibrează preparatul.","macro":{"calorii_macro":"137.4","proteine":"4.2 g","carbohidrati":"17.4 g","fibre":"0.9 g","grasimi":"5.3 g","grasimi_saturate":"0.7 g","greutate_portie":"150 g"}},{"id":"sarbatori-243","titlu":"Pilaf cu Morcovi","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":243,"portii":"1","timp_minute":30,"calorii":150,"ingrediente":["45 g tofu afumat","15 g orez basmati","30 g morcovi baby","15 g ceapă","2 g ulei de măsline","20 g supă concentrată de legume","73 g apă"],"descriere":"Un preparat aromat și reconfortant, cu orez pufos, morcovi dulci și\ntofu afumat rumenit, perfect echilibrat.","pasi":"1.Călește ceapa în puțin ulei de măsline.\n2.Adaugă morcovii tăiați rondele și orezul basmati.\n3.Toarnă supa concentrată și apa, apoi lasă la fiert până se\nabsoarbe lichidul și orezul este gătit.\n4.Separat, prăjește cubulețele de tofu afumat până devin aurii.\n5.Amestecă totul și servește cald.","sfaturi":"Adaugă o frunză de dafin și un praf de cimbru sau oregano în\ntimp ce fierbe orezul.\nSe păstrează 2 zile la frigider, dar e bine să ții tofu separat și\nsă-l adaugi abia la încălzire, ca să rămână crocant.","alergeni":"poate conține soia (tofu afumat)","variante":"poți înlocui tofu cu tempeh, ciuperci sau piept de pui pentru o versiune non-vegană; orezul basmati poate fi înlocuit cu orez integral sau cușcuș.","macro":{"calorii_macro":"150.1","proteine":"7.5 g","carbohidrati":"14.8 g","fibre":"0.8 g","grasimi":"6 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-244","titlu":"Cartofi Copți cu Rozmarin și Usturoi","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":244,"portii":"2","timp_minute":50,"calorii":180,"ingrediente":["385 g cartofi","4 g usturoi (≈ 1–2 căței)","10 g ulei de măsline","1 g rozmarin uscat sare, piper – după gust"],"descriere":"Un preparat aromat și reconfortant, cu cartofi rumeniți uniform,\nparfumați cu rozmarin și usturoi pentru un gust intens și echilibrat.","pasi":"1.Spală bine cartofii și taie-i felii groase sau cuburi.\n2.Pune-i într-un bol, adaugă uleiul, usturoiul pisat, rozmarinul, sarea\nși piperul.\n3.Amestecă bine, apoi întinde cartofii într-o tavă tapetată cu\nhârtie de copt.\n4.Coace la 200°C timp de 40 minute, amestecând o dată la\njumătatea timpului pentru rumenire uniformă.","sfaturi":"Pentru un gust mai crocant, lasă cartofii în apă rece 15 minute","alergeni":"fără alergeni majori","variante":"poți adăuga boia afumată, cimbru sau usturoi granulat; poți înlocui rozmarinul cu mix de ierburi italiene sau pătrunjel proaspăt pentru o aromă mai delicată.","macro":{"calorii_macro":"179.1","proteine":"2.05 g","carbohidrati":"28.9 g","fibre":"1.95 g","grasimi":"5 g","grasimi_saturate":"0 g"}},{"id":"sarbatori-245","titlu":"Legume Rădăcinoase la Cuptor","carte":"Sărbători sănătoase","carte_scurt":"Sărbători","categorie":"Perioada de Post","pagina":245,"portii":"2","timp_minute":45,"calorii":138,"ingrediente":["100 g morcovi","120 g păstârnac","75 g sfeclă","90 g țelină","12 g ulei de măsline","1 g cimbru uscat sare – după gust"],"descriere":"O garnitură colorată, plină de nutrienți și arome naturale, perfectă\nalături de carne slabă, tofu sau cereale integrale.","pasi":"1.Curăță toate legumele și taie-le cuburi de dimensiuni egale.\n2.Pune-le într-un bol mare, adaugă uleiul de măsline, cimbrul și\nsarea, apoi amestecă bine pentru a le acoperi uniform.\n3.Așază legumele într-o tavă tapetată cu hârtie de copt, într-un\nsingur strat.\n4.Coace la 200°C timp de 35–40 de minute, amestecând la\njumătatea timpului, până devin fragede și ușor caramelizate.\n5.Servește-le calde, simple sau ca garnitură.","sfaturi":"Poți adăuga usturoi sau rozmarin pentru un plus de aromă.\nServește ca garnitură lângă tofu, sau leguminoase.","alergeni":"fără alergeni majori","variante":"Dacă ai sensibilitate la condimente, poți înlocui cimbrul cu aceeași cantitate de pătrunjel proaspăt tocat după coacere, păstrând același aport caloric și o aromă naturală, fresh.","macro"
