il, din rondelele de orez)","variante":"Dacă ai intoleranță la lactoză, poți înlocui brânza cottage cu o variantă fără lactoză sau cu brânză vegetală tip cottage. Dacă eviți glutenul, alege rondele de orez certificate fără gluten sau înlocuiește-le cu rondele de porumb.","macro":{"calorii_macro":"344","proteine":"24.8 g","carbohidrati":"42 g","fibre":"0 g","grasimi":"6.8 g","grasimi_saturate":"3 g","greutate_portie":"440 g"}},{"id":"rapide-125","titlu":"Ton cu Cottage Cheese și Rondele de Orez","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Gustări Sărate","pagina":125,"portii":"1","timp_minute":10,"calorii":401,"ingrediente":["120 g ton conservă în suc propriu","200 g cottage cheese","30 g rondele de orez după gust condimente (sare, piper, ierburi aromatice – opțional)"],"descriere":"Ton delicios combinat cu brânză cottage cremoasă și rondele\ncrocante de orez, pentru o gustare rapidă și sățioasă.","pasi":"1.Scurge tonul și pune-l într-un bol.\n2.Adaugă cottage cheese peste ton și amestecă ușor.\n3.Servește alături de rondelele de orez, întregi sau zdrobite\ndeasupra pentru crocant.\n4.Condimentează după gust cu sare, piper sau ierburi\naromatice.","sfaturi":"Pentru o textură mai plăcută, scurge foarte bine tonul\nînainte de a-l amesteca cu brânza cottage.\nDacă vrei mai mult crunch, păstrează rondelele de orez\nseparate și consumă-le pe rând, nu amestecate din timp în\ncompoziție.","alergeni":"pește (ton), lactate (din brânza cottage), gluten (posibil, din rondelele de orez)","variante":"Dacă ai alergie la pește, tonul poate fi înlocuit cu piept de pui gătit sau năut fiert, pentru un aport proteic similar. Dacă ai intoleranță la lactoză, brânza cottage poate fi înlocuită cu o variantă fără lactoză sau cu brânză vegetală tip cottage. Dacă eviți glutenul, alege rondele de orez certificate fără gluten sau înlocuiește-le cu rondele de porumb.","macro":{"calorii_macro":"401","proteine":"54.1 g","carbohidrati":"29.5 g","fibre":"0 g","grasimi":"6.6 g","grasimi_saturate":"3 g","greutate_portie":"350 g"}},{"id":"rapide-126","titlu":"Pâine cu Avocado și Cottage Cheese","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Gustări Sărate","pagina":126,"portii":"1","timp_minute":10,"calorii":424,"ingrediente":["60 g pâine integrală (aprox. 2 felii)","80 g avocado","200 g cottage cheese după gust condimente (sare, piper, lămâie sau ierburi aromatice)"],"descriere":"Avocado cremos și brânză cottage pe pâine integrală, pentru\no combinație hrănitoare și plină de savoare.","pasi":"1.Pasează avocado-ul și asezonează-l cu sare, piper și\nzeamă de lămâie.\n2.Unge pâinea cu avocado.\n3.Adaugă deasupra cottage cheese.\n4.Servește imediat, simplu sau cu ierburi aromatice (busuioc,\npătrunjel).","sfaturi":"Pentru un gust mai bun, pasează avocado-ul direct cu\npuțină zeamă de lămâie și sare, ca să obții o cremă fină.\nDacă vrei mai multă sațietate, folosește pâine integrală\nprăjită ușor, ca să adauge textură fără să încarce\npreparatul.","alergeni":"gluten (din pâinea integrală), lactate (din brânza cottage)","variante":"Dacă eviți glutenul, poți folosi pâine fără gluten, cu structură similară. Dacă ai intoleranță la lactoză, brânza cottage poate fi înlocuită cu o variantă fără lactoză sau cu brânză vegetală tip cottage, păstrând textura cremoasă.","macro":{"calorii_macro":"424","proteine":"30.8 g","carbohidrati":"33.2 g","fibre":"4.8 g","grasimi":"19.8 g","greutate_portie":"340 g"}},{"id":"rapide-130","titlu":"Granola cu Iaurt, Miere și Fructe","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Gustări Dulci Rapide","pagina":130,"portii":"1","timp_minute":10,"calorii":450,"ingrediente":["50 g granola fără zahăr","200 g iaurt grecesc 2%","100 g căpșuni și afine","5 g miere","10 g nuci","opțional, după gust scorțișoară sau vanilie pentru aromă"],"descriere":"Granola crocantă, fără zahăr, combinată cu iaurt cremos și\nfructe proaspete, pentru un mix delicios de texturi și energie\nnaturală.","pasi":"1.Pune iaurtul grecesc într-un bol.\n2.Adaugă granola deasupra și amestecă ușor.\n3.Taie fructele (căpșuni și folosește afine întregi) și pune-le\npeste iaurt și granola.\n4.Presară nucile și adaugă mierea.\n5.Servește imediat.","sfaturi":"Pentru o textură mai plăcută, adaugă granola exact înainte\nde consum, ca să rămână crocantă.\nDacă vrei un gust mai intens, presară puțină scorțișoară sau\nvanilie peste iaurt înainte de a adăuga fructele.","alergeni":"lactate (din iaurtul grecesc), gluten (posibil, din granola), nuci","variante":"Dacă ai intoleranță la lactoză, iaurtul grecesc poate fi înlocuit cu iaurt fără lactoză sau iaurt vegetal. Dacă eviți glutenul, alege granola certificată fără gluten. Dacă ai alergie la nuci, acestea pot fi eliminate sau înlocuite cu semințe de dovleac, pentru o textură crocantă similară.","macro":{"calorii_macro":"450","proteine":"17.5 g","carbohidrati":"22.3 g","fibre":"2.6 g","grasimi":"10.5 g","greutate_portie":"365 g"}},{"id":"rapide-131","titlu":"Brânză Cottage cu Sirop fără Zahăr","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Gustări Dulci Rapide","pagina":131,"portii":"3","timp_minute":10,"calorii":146,"ingrediente":["180 g brânză cottage (2–4% grăsime)","10 g sirop fără zahăr (zmeură sau afine)"],"descriere":"Brânză cottage cremoasă îndulcită cu sirop fără zahăr, pentru\nun gust dulce fără vinovăție.","pasi":"1.Pune brânza cottage într-un bol.\n2.Adaugă siropul fără zahăr, în cantitatea dorită.\n3.Amestecă ușor sau lasă straturile separate, în funcție de\npreferință.\n4.Servește imediat sau păstrează la rece până la consum.","sfaturi":"Pentru un gust mai plăcut, amestecă ușor siropul în brânză,\nnu complet, ca să rămână senzația de desert stratificat.\nDacă vrei mai multă sațietate, adaugă câteva fructe\nproaspete sau câteva nuci tocate chiar înainte de servire.","alergeni":"lactate (din brânza cottage)","variante":"Dacă ai intoleranță la lactoză, poți înlocui brânza cottage cu o variantă fără lactoză sau cu brânză vegetală tip cottage, păstrând o textură cremoasă și un aport caloric apropiat.","macro":{"calorii_macro":"146","proteine":"19.8 g","carbohidrati":"3.6 g","fibre":"0 g","grasimi":"5.4 g","grasimi_saturate":"0 g","greutate_portie":"190 g"}},{"id":"rapide-132","titlu":"Budincă Proteică cu Fulgi de Migdale","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Gustări Dulci Rapide","pagina":132,"portii":"1","timp_minute":10,"calorii":301,"ingrediente":["200 ml lapte (degresat, 1,5%)","30 g pudră proteică (vanilie sau neutră)","10 g amidon de porumb","5 g îndulcitor (eritritol, stevia sau sirop fără zahăr)","10 g fulgi de migdale"],"descriere":"O budincă cremoasă și bogată în proteine, presărată cu fulgi\ncrocanți de migdale pentru savoare și textură.","pasi":"1.Dizolvă amidonul în 2–3 linguri de lapte rece, pentru a\nevita cocoloașele.\n2.Încălzește restul de lapte la foc mic.\n3.Adaugă amidonul dizolvat și amestecă constant până\ncând compoziția începe să se îngroașe.\n4.Ia vasul de pe foc și adaugă pudra proteică și îndulcitorul,\namestecând bine.\n5.Toarnă budinca într-un bol și las-o să se răcească ușor.\n6.Presară deasupra fulgii de migdale și servește.","sfaturi":"Pentru o textură mai fină, lasă budinca să se răcească 10–\n15 minute înainte de a adăuga fulgii de migdale.\nDacă vrei un gust mai intens, rumenește ușor fulgii de\nmigdale într-o tigaie uscată și presară-i deasupra chiar\nînainte de servire.","alergeni":"lactate (posibil, din lapte și pudra proteică), nuci (migdale)","variante":"Dacă ai intoleranță la lactoză, laptele și pudra proteică pot fi alese în variante fără lactoză sau vegetale. Dacă ai alergie la migdale, fulgii de migdale pot fi eliminați sau înlocuiți cu fulgi de cocos, pentru o textură crocantă similară.","macro":{"calorii_macro":"301","proteine":"30 g","carbohidrati":"19.4 g","fibre":"1.2 g","grasimi":"8.9 g","grasimi_saturate":"0 g","greutate_portie":"255 g"}},{"id":"rapide-133","titlu":"Mere Rase cu Scorțișoară, Vanilie și Iaurt Grecesc Proteic","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Gustări Dulci Rapide","pagina":133,"portii":"1","timp_minute":10,"calorii":199,"ingrediente":["1 măr mare (180–200 g), ras","150 g iaurt grecesc proteic (2–5% grăsime)","½ linguriță scorțișoară extract de vanilie sau vanilie pudră, după gust"],"descriere":"Mere dulci cu scorțișoară și vanilie, amestecate cu iaurt grecesc\nproteic, pentru un gust cremos și aromat.","pasi":"1.Rade mărul și, dacă dorești o textură mai moale, încălzește-\nl 2–3 minute într-o tigaie sau la microunde.\n2.Adaugă scorțișoara și vanilia peste măr și amestecă bine.\n3.Pune iaurtul grecesc într-un bol.\n4.Adaugă merele aromatizate deasupra sau amestecă-le cu\niaurtul.\n5.Servește imediat sau păstrează la rece până la consum.","sfaturi":"Pentru un gust mai aromat, încălzește ușor merele cu\nscorțișoara și vanilia înainte de a le combina cu iaurtul.\nDacă vrei o textură mai cremoasă, amestecă merele\ncomplet cu iaurtul; pentru un efect mai fresh, lasă-le\nstratificate.","alergeni":"lactate (din iaurtul grecesc)","variante":"Dacă ai intoleranță la lactoză, iaurtul grecesc proteic poate fi înlocuit cu iaurt fără lactoză sau iaurt vegetal cu conținut proteic ridicat, păstrând o textură cremoasă și un aport nutrițional apropiat.","macro":{"calorii_macro":"199","proteine":"12.1 g","carbohidrati":"28.4 g","fibre":"0 g","grasimi":"3 g","grasimi_saturate":"0 g","greutate_portie":"250 g"}},{"id":"rapide-136","titlu":"Bol Proteic cu Pui Gata Gătit și Salată la Pungă","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Mese Rapide din Supermarket","pagina":136,"portii":"1","timp_minute":10,"calorii":259,"ingrediente":["120 g piept de pui gătit (fiert, la grătar sau rotisat)","100 g mix de salată la pungă","1 linguriță ulei de măsline sare și piper, după gust zeamă de lămâie sau oțet balsamic,","opțional"],"descriere":"Piept de pui fraged și salată proaspătă într-un bol hrănitor,\nbogat în proteine și fibre, gata de savurat.","pasi":"1.Pune mixul de salată într-un bol mare.\n2.Adaugă puiul gătit, tăiat bucăți sau fâșii.\n3.Asezonează cu sare, piper și zeamă de lămâie sau oțet.\n4.Adaugă uleiul de măsline și amestecă ușor.\n5.Servește imediat.","sfaturi":"Pentru un gust mai bun, scoate puiul din frigider cu 5–10\nminute înainte de consum, ca să nu fie foarte rece în\ncontrast cu salata.\nDacă vrei un bol mai aromat, masează ușor salata cu\nuleiul de măsline și zeama de lămâie înainte de a adăuga\npuiul.","alergeni":"nu conține alergeni majori declarați","variante":"Dacă nu consumi carne de pui, aceasta poate fi înlocuită cu ton în suc propriu, ouă fierte sau tofu gătit, pentru un aport proteic similar și o masă la fel de sățioasă.","macro":{"calorii_macro":"259","proteine":"37.2 g","carbohidrati":"0 g","fibre":"0 g","grasimi":"9.3 g","grasimi_saturate":"0 g","greutate_portie":"230 g"}},{"id":"rapide-137","titlu":"Wrap din Supermarket cu Pui și Legume","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Mese Rapide din Supermarket","pagina":137,"portii":"1","timp_minute":10,"calorii":405,"ingrediente":["1 lipie/wrap din supermarket (integral sau clasic, 60–70 g)","120 g piept de pui gătit (grătar, rotisat sau gata preparat)","100 g mix de legume (salată, roșii, castravete, ardei)","1 lingură iaurt grecesc sare, piper, condimente după gust"],"descriere":"Pui suculent și legume proaspete învelite într-o lipie, pentru o\ngustare rapidă, sățioasă și plină de savoare.","pasi":"1.Încălzește ușor lipia, dacă este nevoie.\n2.Așază puiul gătit pe mijlocul wrapului.\n3.Adaugă legumele proaspete.\n4.Completează cu iaurt  și condimente.\n5.Rulează wrapul strâns și servește.","sfaturi":"Pentru un wrap mai gustos, încălzește ușor lipia înainte de\nasamblare, ca să fie mai elastică și să nu se rupă.\nDacă vrei mai multă savoare fără calorii în plus,\nasezonează legumele cu puțin suc de lămâie sau oțet\nînainte de a le pune în wrap.","alergeni":"gluten (din lipie), lactate (din iaurtul grecesc)","variante":"Dacă eviți glutenul, poți folosi lipie fără gluten sau foi de salată pentru rulare. Dacă ai intoleranță la lactoză, iaurtul grecesc poate fi înlocuit cu iaurt fără lactoză sau iaurt vegetal, păstrând textura cremoasă.","macro":{"calorii_macro":"405","proteine":"38 g","carbohidrati":"0.3 g","fibre":"0 g","grasimi":"4.5 g","grasimi_saturate":"0 g","greutate_portie":"300 g"}},{"id":"rapide-138","titlu":"Cutie „ouă Fierte + Cartofi Fierți + Salată”","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Mese Rapide din Supermarket","pagina":138,"portii":"1","timp_minute":10,"calorii":423,"ingrediente":["2 ouă fierte","200 g cartofi fierți","100 g salată verde sau mix de salată","1 linguriță ulei de măsline sare și piper, după gust zeamă de lămâie"],"descriere":"Ouă fierte, cartofi fragezi și legume proaspete într-o\ncombinație simplă, hrănitoare și sățioasă.","pasi":"1.Fierbe ouăle 8–10 minute, apoi răcește-le și curăță-le.\n2.Fierbe cartofii în apă cu puțină sare, până devin fragezi,\napoi scurge-i.\n3.Taie ouăle și cartofii în bucăți potrivite.\n4.Așază toate ingredientele într-o cutie sau bol.\n5.Adaugă salata, uleiul de măsline și asezonează după gust.\n6.Închide cutia sau servește imediat.","sfaturi":"Pentru sațietate mai bună, păstrează cartofii fierți întregi\nsau tăiați grosier, nu zdrobiți.\nDacă vrei un plus de gust fără multe calorii, adaugă\nzeamă de lămâie sau puțin oțet balsamic peste salată.","alergeni":"ouă","variante":"Dacă ai alergie la ouă, acestea pot fi înlocuite cu năut fiert, linte fiartă sau tofu gătit, pentru un aport proteic similar și o masă la fel de sățioasă.","macro":{"calorii_macro":"422.5","proteine":"17.6 g","carbohidrati":"41.4 g","fibre":"4 g","grasimi":"18.2 g","grasimi_saturate":"0 g","greutate_portie":"430 g"}},{"id":"rapide-139","titlu":"Sandviș Proteic cu Șuncă Slabă","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Mese Rapide din Supermarket","pagina":139,"portii":"1","timp_minute":10,"calorii":302,"ingrediente":["2 felii pâine integrală (70–80 g)","100 g șuncă slabă curcan","1 lingură cremă de brânză light frunze de salată roșii și castravete muștar  1 linguriță"],"descriere":"Șuncă slabă și pâine integrală combinate într-un sandviș\nhrănitor, bogat în proteine și sățios.","pasi":"1.Așază feliile de pâine pe o suprafață plană.\n2.Adaugă șunca slabă peste o felie de pâine.\n3.Completează cu brânză, legume și sosul ales.\n4.Acoperă cu cealaltă felie de pâine și presează ușor.\n5.Servește imediat sau împachetează pentru mai târziu.","sfaturi":"Pentru un sandviș mai sățios, alege pâine integrală densă,\nnu foarte aerată.\nDacă vrei un gust mai fresh și mai puține calorii, poți înlocui\ncrema de brânză cu iaurt grecesc amestecat cu puțin\nmuștar.","alergeni":"gluten (din pâinea integrală), lactate (din crema de brânză), muștar","variante":"Dacă eviți glutenul, poți folosi pâine fără gluten, cu structură similară. Dacă ai intoleranță la lactoză, crema de brânză poate fi înlocuită cu o variantă fără lactoză sau vegetală. Dacă nu consumi carne procesată, șunca slabă poate fi înlocuită cu piept de pui sau curcan gătit.","macro":{"calorii_macro":"301.8","proteine":"10.5 g","carbohidrati":"29.5 g","fibre":"0.7 g","grasimi":"4.7 g","grasimi_saturate":"0 g","greutate_portie":"270 g"}},{"id":"rapide-140","titlu":"Salată Gata Ambalată cu Proteină Adăugată","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Mese Rapide din Supermarket","pagina":140,"portii":"1","timp_minute":10,"calorii":310,"ingrediente":["100 g mix de salată gata ambalată (salată verde, rucola, baby spanac)","150 g piept de pui gătit, feliat sau tăiat cuburi","1 linguriță (5 ml) ulei de măsline","1 linguriță (5 ml) zeamă de lămâie","1/4 linguriță sare","1/4 linguriță piper negru","opțional: condimente suplimentare (busuioc, oregano, paprika)"],"descriere":"Salată proaspătă și crocantă, completată cu proteine, pentru o\nmasă rapidă, sățioasă și hrănitoare.","pasi":"1.Pune salata într-un bol sau într-o cutie.\n2.Adaugă pieptul de pui gătit, tăiat cuburi sau fâșii.\n3.Stropește cu uleiul de măsline și zeama de lămâie.\n4.Presară sare, piper și condimentele dorite.\n5.Amestecă ușor și servește imediat sau păstrează la frigider\npână la consum.","sfaturi":"Pentru o masă mai sățioasă, alege piept de pui gătit\nsimplu, fără sosuri din comerț.\nDacă salata este foarte uscată, adaugă 1–2 linguri de\niaurt grecesc sau dressing simplu din iaurt și lămâie.","alergeni":"nu conține alergeni majori declarați","variante":"Dacă nu consumi carne de pui, aceasta poate fi înlocuită cu ton în suc propriu, ouă fierte sau tofu gătit, pentru un aport proteic similar și o masă la fel de sățioasă.","macro":{"calorii_macro":"310","proteine":"46.5 g","carbohidrati":"0.2 g","fibre":"0 g","grasimi":"10.4 g","grasimi_saturate":"0 g","greutate_portie":"260 g"}},{"id":"rapide-141","titlu":"Masă de Urgență: Baton Proteic + Fruct + Iaurt","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Mese Rapide din Supermarket","pagina":141,"portii":"1","timp_minute":10,"calorii":377,"ingrediente":["1 baton proteic (aprox. 50 g, orice tip preferi, cu minim 15 g proteine)","1 măr mediu (aprox. 150 g)","150 g iaurt grecesc proteic (2–5% grăsime)"],"descriere":"Baton proteic, fruct proaspăt și iaurt cremos – combinația\nperfectă pentru energie rapidă și sațietate.","pasi":"1.Desfă batonul proteic.\n2.Spală fructul și, dacă vrei, taie-l în felii sau bucăți.\n3.Pune iaurtul într-un bol sau pahar separat.\n4.Servește batonul, fructul și iaurtul împreună.","sfaturi":"Pentru o sațietate mai bună, alege un baton cu minimum 15\ng proteine și conținut redus de zahăr.\nDacă vrei o digestie mai ușoară, consumă fructul separat\nde iaurt sau taie-l cubulețe mici și amestecă-l ușor în iaurt.","alergeni":"lactate (din iaurtul grecesc), nuci, gluten, soia sau ouă (posibil, din batonul proteic – în funcție de compoziție)","variante":"Dacă ai intoleranță la lactoză, iaurtul grecesc poate fi înlocuit cu iaurt fără lactoză sau iaurt vegetal proteic. Dacă batonul proteic conține alergeni, acesta poate fi înlocuit cu un shake proteic simplu sau cu brânză cottage fără lactoză, pentru un aport proteic similar.","macro":{"calorii_macro":"377","proteine":"33 g","carbohidrati":"41.3 g","fibre":"0 g","grasimi":"9.2 g","grasimi_saturate":"0 g","greutate_portie":"350 g"}},{"id":"rapide-143","titlu":"Clătite Dulci cu Brânză și Mere Coapte","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Deserturi","pagina":143,"portii":"1","timp_minute":10,"calorii":345,"ingrediente":["1 ou","30g făină de ovăz","100ml lapte","60g brânză dulce 5%","100g măr scorțișoară"],"descriere":"Clătite fine, umplute cu brânză dulce și mere coapte aromate\n— un desert cald, reconfortant și natural dulce, perfect pentru\norice poftă.","pasi":"1.Amestecă oul, făina și laptele și gătește 2 clătite.\n2.Coace mărul și pasează-l cu scorțișoară.\n3.Umple clătitele cu brânză și piureul de măr.","sfaturi":"Poți adăuga 1–2 picături de îndulcitor sau esență de vanilie\nîn compoziție.\nPentru un gust intens de toamnă, presară puțin ghimbir\npudră peste mere.","alergeni":"ouă, lactate (din lapte și brânza dulce), gluten (din făina de ovăz)","variante":"Dacă eviți glutenul, poți folosi făină de ovăz certificată fără gluten. Dacă ai intoleranță la lactoză, laptele și brânza dulce pot fi înlocuite cu variante fără lactoză sau vegetale. Dacă ai alergie la ouă, oul poate fi înlocuit cu un „ou” din semințe de in sau chia hidratate, pentru o textură similară.","macro":{"calorii_macro":"348.9","proteine":"22.9 g","carbohidrati":"19 g","fibre":"2.4 g","grasimi":"9.1 g","grasimi_saturate":"0 g","greutate_portie":"350 g"}},{"id":"rapide-144","titlu":"Cheesecake Capovoltă fără Coacere","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Deserturi","pagina":144,"portii":"8","timp_minute":10,"calorii":303,"ingrediente":["240 g biscuiți fără zahăr (ex. Gullon,","Sondey, Digestive fără zahăr)","45 ml ulei de cocos topit","450 g cremă de brânză light (ex.","Philadelphia Light, Delaco Light)","350 g iaurt grecesc 2% (ex. Olympus,","Zuzu, Pilos)","100 g eritritol (sau îndulcitor natural preferat) [Opțional – strat din mijloc]:","Mix de fructe de pădure pasate (aprox."],"descriere":"Un cheesecake capovolto răcoritor, cremos și fără coacere —\ncombinația ideală între blat crocant, cremă fină și strat fresh\nde fructe. Perfect pentru zilele în care vrei un desert rapid și\nlight.","pasi":"1.Zdrobește biscuiții și amestecă-i cu uleiul de cocos topit.\nPresează compoziția într-o tavă cu pereți detașabili și\npune la rece 10 min.\n2.Amestecă crema de brânză cu iaurtul și îndulcitorul până\ndevine fină.\n3.Toarnă jumătate peste blat, adaugă opțional un strat de\nfructe, apoi restul de cremă.","sfaturi":"Poți adăuga câteva picături de zeamă de lămâie în\ncremă pentru un gust mai fresh.\nPentru un plus de textură, adaugă 1 lingură de semințe de\nchia în stratul de fructe.","alergeni":"gluten (din biscuiți), lactate (din crema de brânză și iaurtul grecesc), cocos","variante":"Dacă eviți glutenul, biscuiții pot fi înlocuiți cu biscuiți fără gluten sau cu fulgi de ovăz fără gluten măcinați. Dacă ai intoleranță la lactoză, crema de brânză și iaurtul grecesc pot fi alese în variante fără lactoză sau vegetale. Dacă eviți cocosul, uleiul de cocos poate fi înlocuit cu unt sau margarină vegetală, în aceeași cantitate.","macro":{"calorii_macro":"303","proteine":"10 g","carbohidrati":"25.6 g","fibre":"0 g","grasimi":"12.2 g","grasimi_saturate":"0 g","greutate_portie":"160 g"}},{"id":"rapide-145","titlu":"Snickers Light","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Deserturi","pagina":145,"portii":"6","timp_minute":10,"calorii":191,"ingrediente":["2 rondele de orez expandat (fărâmițate fin)","80 g unt de arahide natural (fără zahăr sau uleiuri hidrogenate)","60 g miere sau 25 g stevia/îndulcitor lichid","20 g arahide prăjite nesărate, tocate grosier","PENTRU TOPPING DE CIOCOLATĂ:","20 g ciocolată neagră (>75%) topită","80 ml lapte (1.5% sau vegetal)","25 g cacao pudră","1 praf de sare","25 g stevia sau îndulcitor lichid (după gust)"],"descriere":"Un Snickers reinventat — cremos, crocant și fără zahăr adăugat,\nideal pentru un desert light care păstrează gustul clasic, dar cu\ningrediente mult mai sănătoase.","pasi":"1.Zdrobește rondelele de orez și amestecă-le cu untul de\narahide, mierea și arahidele.\n2.Pune în formă tapetată și tasează bine.\n3.Topește ciocolata, adaugă laptele cald, cacaoa,\nîndulcitorul și sarea – amestecă până devine o cremă.\n4.Toarnă peste bază, nivelează și taie în 6 bucăți.","sfaturi":"Poți adăuga 10 g fulgi de cocos în bază pentru textură și\naromă.\nServește ca gustare post-antrenament sau desert bogat în\ngrăsimi sănătoase.","alergeni":"arahide, nuci (posibil, din ciocolata neagră), lactate (posibil, din lapte), gluten (posibil, din rondelele de orez)","variante":"Dacă ai alergie la arahide, untul de arahide poate fi înlocuit cu unt de migdale sau unt de semințe de floarea- soarelui, în aceeași cantitate. Dacă eviți lactatele, laptele poate fi ales în variantă vegetală, iar ciocolata neagră în variantă fără lactate. Dacă eviți glutenul, folosește rondele de orez certificate fără gluten.","macro":{"calorii_macro":"191","proteine":"5.1 g","carbohidrati":"21.1 g","fibre":"2.5 g","grasimi":"8.5 g","grasimi_saturate":"0 g","greutate_portie":"55 g"}},{"id":"rapide-146","titlu":"Mini Cheesecake cu Iaurt Grecesc și Fulgi de Ciocolată","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Deserturi","pagina":146,"portii":"1","timp_minute":10,"calorii":396,"ingrediente":["1 ou","130 g iaurt grecesc 2% (ex. Olympus, Zuzu,","Pilos)","20 g îndulcitor natural (stevia/eritritol) sau","20 g miere (opțional – ~64 kcal)","30 g ovăz măcinat (sau fulgi de ovăz blenduiți)","½ linguriță praf de copt","1 praf de sare","Fulgi de ciocolată sau fructe de pădure, pentru topping"],"descriere":"Un mini cheesecake ușor, proteic și fără regrete — gata rapid,\nsuper cremos și ideal când vrei un desert sănătos, dar delicios.","pasi":"1.Amestecă oul, iaurtul, îndulcitorul, ovăzul măcinat, praful de\ncopt și sarea până obții o compoziție omogenă.\n2.Toarnă într-o formă mică și gătește: 2–3 min la microunde,\n15–20 min la 165°C în air fryer sau 25 min la 180°C în cuptor.\n3.Lasă 10–15 min la răcit înainte de servire.","sfaturi":"Pentru un gust mai bogat, adaugă 1 linguriță de extract de\nvanilie sau scorțișoară.\nPoți transforma desertul într-o variantă de mic dejun\ncomplet adăugând 1 lingură de unt de arahide sau 1\nbanană felii deasupra.","alergeni":"ouă, lactate (din iaurtul grecesc), gluten (posibil, din ovăz), soia (posibil, din fulgii de ciocolată)","variante":"Dacă ai intoleranță la lactoză, iaurtul grecesc poate fi înlocuit cu iaurt fără lactoză sau iaurt vegetal proteic. Dacă eviți glutenul, ovăzul poate fi ales certificat fără gluten. Dacă ai alergie la ouă, oul poate fi înlocuit cu un „ou” din semințe de in sau chia hidratate, pentru o textură similară.","macro":{"calorii_macro":"396","proteine":"22.7 g","carbohidrati":"45.2 g","fibre":"0 g","grasimi":"12.9 g","grasimi_saturate":"0 g","greutate_portie":"270 g"}},{"id":"rapide-147","titlu":"Bomboane Înghețate de Banană cu Unt de Arahide","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Deserturi","pagina":147,"portii":"1","timp_minute":10,"calorii":229,"ingrediente":["100 g banană (≈ 1 banană mică), tăiată felii","15 g unt de arahide (natural, fără zahăr adăugat)","10 g ciocolată neagră (minim 70% cacao), topită","Opțional: fulgi de sare pentru topping"],"descriere":"O rețetă simplă, rapidă și perfectă când ai poftă de dulce, dar\nvrei ceva curat, sățios și fără zahăr adăugat.","pasi":"1.Taie banana în felii de aproximativ 1–1,5 cm.\n2.Unge fiecare felie cu puțin unt de arahide.\n3.Topește ciocolata la bain-marie sau la microunde (în reprize\nscurte).\n4.Cu o linguriță, stropește feliile de banană cu ciocolata\ntopită.\n5.Presară câțiva fulgi de sare (opțional, dar recomandat 😉).\n6.Așază feliile pe o tavă cu hârtie de copt și pune-le la\ncongelator pentru 30–60 de minute, până se întăresc","sfaturi":"complet\nCombinația dulce + sărat intensifică aroma și reduce\npofta de dulce.\nSunt perfecte ca desert rapid sau gustare „anti-pofte”.","alergeni":"arahide (din untul de arahide), soia (posibil, din ciocolata neagră), lactate (posibil, din urme de lapte din ciocolată)","variante":"Dacă ai alergie la arahide, untul de arahide poate fi înlocuit cu unt de migdale, unt de caju sau unt de semințe de floarea-soarelui. Dacă eviți soia sau produsele cu urme de soia, alege o ciocolată neagră certificată fără soia. Dacă ai intoleranță la lactoză, poți opta pentru o ciocolată neagră vegană, fără urme de lapte, sau pentru ciocolată fără lactoză.","macro":{"calorii_macro":"229","proteine":"5.1 g","carbohidrati":"30.2 g","fibre":"3.2 g","grasimi":"10.5 g","grasimi_saturate":"0 g","greutate_portie":"125 g"}},{"id":"rapide-148","titlu":"Budincă Proteică de Ciocolată și Banană în Cană","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Deserturi","pagina":148,"portii":"1","timp_minute":10,"calorii":162,"ingrediente":["60 g banană bine coaptă","10 g cacao pudră","15 g pudră proteică din zer, aromă ciocolată","50 ml lapte de migdale neîndulcit","5 g chipsuri de ciocolată – opțional, pentru topping"],"descriere":"Un desert cald, rapid și super sățios, ideal când vrei ciocolată,\ndar și proteină, fără complicații și fără vinovăție.","pasi":"1.Pasează banana într-o cană potrivită pentru microunde.\n2.Adaugă pudra proteică, cacaoa și laptele de migdale.\n3.Amestecă foarte bine până obții o compoziție omogenă.\n4.Pune cana la microunde 45–60 de secunde, în funcție de\nputerea aparatului.\n5.Opțional, adaugă deasupra chipsurile de ciocolată cât\nbudinca este fierbinte.","sfaturi":"Pentru un interior mai cremos, oprește microundele la 45\nde secunde.\nPentru o textură mai fermă, mergi spre 60 de secunde.","alergeni":"Lactate (din pudra proteică din zer), nuci (din laptele de migdale), soia (posibil, din pudra proteică sau chipsurile de ciocolată)","variante":"Dacă ai intoleranță la lactoză, pudra proteică din zer poate fi înlocuită cu proteină vegetală (mazăre, orez sau blend vegetal). Dacă ai alergie la nuci, laptele de migdale poate fi înlocuit cu lapte de ovăz, lapte de orez sau apă. Dacă eviți soia, alege o pudră proteică și chipsuri de ciocolată certificate fără soia.","macro":{"calorii_macro":"162","proteine":"15 g","carbohidrati":"23.1 g","fibre":"4.5 g","grasimi":"3.4 g","grasimi_saturate":"0 g","greutate_portie":"140 g"}},{"id":"rapide-149","titlu":"Înghețată Proteică cu Scorțișoară","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Deserturi","pagina":149,"portii":"1","timp_minute":10,"calorii":252,"ingrediente":["150 g iaurt grecesc degresat (0%)","20 g pudră proteică din zer, aromă vanilie","30 ml lapte de migdale neîndulcit","2 g scorțișoară măcinată","Opțional (pentru textură): 30 g banană congelată"],"descriere":"O înghețată proteică cremoasă, răcoritoare și ușor digestibilă,\nperfectă când vrei ceva dulce, dar aliniat cu obiectivul tău.","pasi":"1.Pune toate ingredientele într-un blender.\n2.Blenduiește până obții o compoziție fină și cremoasă.\n3.Transferă într-un recipient și pune la congelator aproximativ\n1 oră.\n4.Scoate înghețata și amestecă ușor înainte de servire pentru\no textură mai aerată.","sfaturi":"Pentru un interior mai cremos, oprește microundele la 45\nde secunde.\nPentru o textură mai fermă, mergi spre 60 de secunde.","alergeni":"Lactate (din iaurtul grecesc și pudra proteică din zer), nuci (din laptele de migdale), soia (posibil, din pudra proteică)","variante":"Dacă ai intoleranță la lactoză, iaurtul grecesc poate fi înlocuit cu iaurt fără lactoză sau iaurt vegetal proteic. Dacă ai alergie la nuci, laptele de migdale poate fi înlocuit cu lapte de ovăz, lapte de orez sau apă. Dacă eviți soia, alege o pudră proteică certificată fără soia. Pentru o variantă complet vegetală, pudra proteică din zer poate fi înlocuită cu proteină din mazăre sau orez, iar iaurtul cu o alternativă vegetală bogată în proteine.","macro":{"calorii_macro":"252","proteine":"15.1 g","carbohidrati":"10.1 g","fibre":"0.6 g","grasimi":"1.7 g","grasimi_saturate":"0 g","greutate_portie":"230 g"}},{"id":"rapide-151","titlu":"Salată de Vinete cu Tahini","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Vegane / Vegetariene","pagina":151,"portii":"1","timp_minute":10,"calorii":237,"ingrediente":["2 vinete coapte","2 linguri tahini","Zeamă de lămâie – după gust","Sare – după gust","1 cățel usturoi (sau după gust)"],"descriere":"O variantă a clasicei salate de vinete, cremoasă și bogată în\ngrăsimi sănătoase din semințe de susan, ideală pentru tartine sau\nca garnitură.","pasi":"1.Coace vinetele, curăță-le de coajă și lasă-le la scurs cel puțin\n20 de minute.\n2.Toacă-le mărunt cu un cuțit de lemn sau din plastic.\n3.Într-un bol, amestecă vinetele cu tahini, zeama de lămâie și\nusturoiul pisat.\n4.Potrivește gustul cu sare și, dacă dorești, adaugă puțin piper.","sfaturi":"Pentru un gust autentic, coace vinetele direct pe flacără sau\npe grill, nu doar în cuptor.\nDacă vrei o textură mai cremoasă, adaugă câteva linguri de\niaurt vegetal sau lapte de cocos light.","alergeni":"susan (din tahini)","variante":"Dacă ai alergie la susan, poți înlocui tahiniul cu aceeași cantitate de iaurt grecesc 2% sau cu piure fin de caju hidratat, ambele păstrând textura cremoasă și un aport caloric foarte apropiat.","macro":{"calorii_macro":"273","proteine":"10.6 g","carbohidrati":"21 g","fibre":"12 g","grasimi":"0 g","grasimi_saturate":"0 g"}},{"id":"rapide-152","titlu":"Rulouri de Dovlecel cu Cremă de Nuci","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Vegane / Vegetariene","pagina":152,"portii":"2","timp_minute":10,"calorii":175,"ingrediente":["1 dovlecel feliat subțire","50 g nuci hidratate","1 cățel usturoi (sau după gust)","Sare – după gust","Piper – după gust","Zeamă de lămâie – după gust"],"descriere":"Un aperitiv rafinat și echilibrat, cu texturi contrastante și gust intens\nde nuci, potrivit pentru mesele ușoare sau platourile festive.","pasi":"1.Feliază dovlecelul subțire pe lungime și gătește feliile pe grill 1–\n2 minute pe fiecare parte, până se înmoaie ușor.\n2.Într-un blender, adaugă nucile hidratate, usturoiul, zeama de\nlămâie, sarea și piperul, apoi mixează până obții o cremă fină.\n3.Lasă compoziția 5–10 minute la frigider pentru a se întări ușor.\n4.Pune câte o linguriță de cremă pe capătul fiecărei felii de\ndovlecel și rulează strâns.\n5.Așază rulourile pe un platou și servește-le reci, ca aperitiv.","sfaturi":"Dacă vrei un gust mai intens, unge feliile de dovlecel cu puțin\nulei de măsline și condimente înainte de a le găti pe grill.\nPentru o cremă mai fină, mixează nucile hidratate cu câteva\nlinguri de apă rece sau lapte vegetal.","alergeni":"nuci","variante":"Dacă ai alergie la nuci, poți înlocui crema de nuci cu aceeași cantitate de semințe de floarea-soarelui hidratate și mixate, care oferă o textură similară și mențin un aport caloric aproape identic.","macro":{"calorii_macro":"175","proteine":"4.4 g","carbohidrati":"4.45 g","fibre":"2 g","grasimi":"16.25 g","grasimi_saturate":"0 g","greutate_portie":"100 g"}},{"id":"rapide-153","titlu":"Wrap cu Tofu, Avocado și Legume","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Vegane / Vegetariene","pagina":153,"portii":"1","timp_minute":10,"calorii":440,"ingrediente":["100 g tofu afumat Inedi","60 g lipie din făină integrală","40 g avocado","50 g mix salată verde","50 g castraveți proaspeți","5 ml ulei de măsline"],"descriere":"Un preparat fresh și echilibrat, cu texturi contrastante între tofu-ul\nrumenit, avocado-ul cremos și legumele crocante.","pasi":"1.Încălzește ușor lipia într-o tigaie antiaderentă sau pe grill.\n2.Taie tofu în fâșii și rumenește-l 2–3 minute (opțional, pentru\ntextură mai crocantă).\n3.Taie avocado și castraveții felii subțiri.\n4.În mijlocul lipiei pune salata, legumele și tofu.\n5.Stropește cu ulei de măsline, rulează strâns și servește imediat.","sfaturi":"Adaugă câteva frunze de mentă sau pătrunjel verde în wrap.\nPregătește ingredientele separat și rulează wrap-ul doar\nînainte de servire, ca să nu se înmoaie lipia.","alergeni":"soia (din tofu), gluten (din lipia integrală)","variante":"Dacă ai alergie la soia, tofu poate fi înlocuit cu năut copt sau linte fiartă, pentru un aport proteic apropiat. Dacă eviți glutenul, lipia integrală poate fi înlocuită cu lipie fără gluten sau foi de salată pentru rulare.","macro":{"calorii_macro":"440","proteine":"13.8 g","carbohidrati":"4.2 g","fibre":"2.4 g","grasimi":"19 g","grasimi_saturate":"0 g"}},{"id":"rapide-154","titlu":"Bol cu Halloumi si Năut cu Dressing cu Oțet Balsamic","carte":"70 de rețete gata în 10 minute","carte_scurt":"Rapide","categorie":"Vegane / Vegetariene","pagina":154,"portii":"1","timp_minute":10,"calorii":351,"ingrediente":["60g halloumi light","80g năut fiert","50g morcov","50g ardei gras","50g salată verde","5g ulei de măsline","10ml oțet balsamic","5g miere"],"descriere":"Un bol vegetarian sățios și aromat, unde halloumi-ul rumenit se\ncombină cu năutul fiert și legumele fresh, completat de un\ndressing dulce-acrișor din oțet balsamic și miere — perfect\npentru un prânz rapid și nutritiv.","pasi":"1.Prăjește halloumi în tigaie fără ulei, 2–3 min pe fiecare\nparte.\n2.Taie legumele și amestecăle cu năutul.\n3.Pregatește dressingul: combină otetul, uleiul și mierea.","sfaturi":"4.Adaugă halloumi peste salată și toarnă dressingul.\nPoți adăuga 1 lingură de semințe de dovleac sau floarea-\nsoarelui pentru un plus de grăsimi sănătoase și crocant.\nPentru un gust mai intens, adaugă câteva frunze de busuioc\nsau mentă proaspătă.","alergeni":"lactate (din halloumi), leguminoase (năut)","variante":"Dacă eviți lactatele, halloumi poate fi înlocuit cu tofu la grătar sau tempeh, pentru un aport proteic similar. Dacă există sensibilitate la leguminoase, năutul poate fi înlocuit cu linte fiartă sau fasole albă, în aceeași cantitate.","macro":{"calorii_macro":"351","proteine":"16.5 g","carbohidrati":"14.3 g","fibre":"2.4 g","grasimi":"15.3 g","grasimi_saturate":"0 g"}},{"id":"post-86","titlu":"Ovăz cu Chia","carte":"Rețete de post","carte_scurt":"Post","categorie":"Mic Dejun","pagina":86,"portii":"2","timp_minute":10,"calorii":367,"ingrediente":["50 g fulgi de ovăz","10 g semințe de chia","200 g lapte de soia","15 g unt de migdale","5 g sirop de arțar","1 g scorțișoară","120 g măr ras"],"descriere":"Un mic dejun rapid, hrănitor și perfect pentru diminețile aglomerate\n– ovăzul cu chia îți oferă energie constantă și sațietate de durată.","pasi":"1. Seara: Amestecă toate ingredientele într-un borcan cu capac\n2. Dă-i o agitare bună să se combine totul\n3. La frigider peste noapte (minimum 4 ore)\n4. Dimineața: Amestecă din nou și servește\n5.Opțional: Adaugă nuci concasate sau fructe de pădure\ndeasupra","sfaturi":"Înlocuiește scorțișoara cu cacao pudră sau vanilie pentru un\ngust diferit.\nDacă preferi un terci mai dens, adaugă încă 1 linguriță de\nsemințe de chia. Dacă îl vrei mai fluid, adaugă 50 ml lapte\nvegetal dimineața.","alergeni":"nuci, gluten (dacă ovăzul nu este certificat fără gluten)","variante":"Pentru o variantă fără nuci, folosește unt de floarea- soarelui și lapte de ovăz/soia. Pentru o variantă fără gluten, folosește ovăz certificat gluten-free.","macro":{"calorii_macro":"367","proteine":"12.5 g","carbohidrati":"65.1 g","fibre":"1.9 g","grasimi":"10.6 g","grasimi_saturate":"1.6 g","greutate_portie":"200 g"}},{"id":"post-87","titlu":"Granola Crocantă de Casă","carte":"Rețete de post","carte_scurt":"Post","categorie":"Mic Dejun","pagina":87,"portii":"6","timp_minute":35,"calorii":322,"ingrediente":["220 g fulgi de ovăz","37 g nuci","37 g migdale","22 g semințe de floarea-soarelui","15 g semințe de chia","45 g sirop de arțar","21 g ulei de cocos","1,5 g scorțișoară","1,5 g vanilie sare"],"descriere":"O granola crocantă, aromată și perfect echilibrată între dulce și\nsănătos, ideală pentru mic dejunuri rapide sau gustări energizante.","pasi":"1.Preîncălzește cuptorul la 160°C\n2.Într-un bol mare, amestecă ovăzul, nucile, migdalele, semințele\n3.Într-un bol mic, combină siropul, uleiul, scorțișoara, vanilia, sarea\n4.Toarnă amestecul lichid peste cel uscat, amestecă bine\n5.Întinde pe o tavă cu hârtie de copt\n6.Coace 20-25 minute, amestecând la jumătatea timpului\n7.Scoate când e aurie și crocantă\n8.Lasă să se răcească complet (se face și mai croncantă)\n9.Păstrează în borcan etanș până la 2 săptămâni","sfaturi":"Poți adăuga fulgi de cocos, merișoare uscate sau stafide pentru\nun plus de aromă\nIdeală cu iaurt vegetal, lapte de ovăz sau ca topping peste\nsmoothie bowls.","alergeni":"nuci (din nuci și migdale), semințe (floarea-soarelui, chia), gluten (dacă ovăzul nu este certificat fără gluten)","variante":"Pentru o variantă fără nuci, folosește doar semințe (floarea-soarelui, dovleac). Pentru o variantă fără gluten, folosește ovăz certificat gluten-free.","macro":{"calorii_macro":"322","proteine":"9.1 g","carbohidrati":"23.7 g","fibre":"2.3 g","grasimi":"14.2 g","grasimi_saturate":"5.5 g","greutate_portie":"71 g"}},{"id":"post-94","titlu":"Pastă de Năut cu Bastonașe de Legume","carte":"Rețete de post","carte_scurt":"Post","categorie":"Aperitive și Gustări Fresh","pagina":94,"portii":"2","timp_minute":15,"calorii":236,"ingrediente":["120 g pastă de năut","120 g morcovi","120 g ardei gras","5 g zeamă de lămâie","5 g boia de ardei","25 g semințe de cânepă"],"descriere":"O gustare echilibrată, bogată în proteine vegetale și grăsimi\nsănătoase, ideală pentru prânzuri rapide sau pauze energizante.","pasi":"1.Taie morcovii și ardeiul gras în bastonașe subțiri.\n2.Așază pasta de năut într-un bol mic și stropește-l cu zeama de\nlămâie.\n3.Presară boia de ardei pentru un plus de culoare și aromă.\n4.Adaugă semințele de cânepă deasupra, pentru textură și aport\nnutritiv.\n5.Servește imediat, alături de bastonașele de legume.","sfaturi":"Adaugă un praf de chimion sau coriandru în pasta de năut.\nCompletează cu pătrunjel verde sau coriandru tocat fin.","alergeni":"susan (din pasta de năut)","variante":"Dacă ai alergie la semințe, poți elimina semințele de cânepă și le poți înlocui cu fulgi de drojdie inactivă, care oferă o aromă ușor “cheesy” și adaugă vitamine din grupul B.","macro":{"calorii_macro":"236","proteine":"8.2 g","carbohidrati":"22.1 g","fibre":"4.1 g","grasimi":"11.6 g","grasimi_saturate":"1.3 g","greutate_portie":"195 g"}},{"id":"post-100","titlu":"Salată de Roșii cu Pătrunjel și Bulgur","carte":"Rețete de post","carte_scurt":"Post","categorie":"Aperitive și Gustări Fresh","pagina":100,"portii":"2","timp_minute":25,"calorii":227,"ingrediente":["90 g bulgur hidratat","55 g pătrunjel","215 g roșii","25 g ceapă verde","9 g ulei de măsline zeamă de lămâie sare"],"descriere":"O salată ușoară, plină de prospețime, ideală ca garnitură sau\ngustare bogată în fibre și vitamine.","pasi":"1.Hidratează bulgurul conform instrucțiunilor de pe ambalaj, apoi\nscurge-l bine.\n2.Toacă mărunt pătrunjelul și ceapa verde.\n3.Taie roșiile în cubulețe mici și adaugă-le peste bulgur.\n4.Toarnă zeama de lămâie și uleiul de măsline.\n5.Asezonează cu sare după gust și amestecă bine toate\ningredientele.\n6.Lasă salata 10–15 minute la rece înainte de servire pentru ca\naromele să se combine.","sfaturi":"Toacă pătrunjelul cât mai fin pentru o consistență ușoară și\naromată.\nSe păstrează 1 zi la frigider, dar dressingul e bine să fie\nadăugat doar înainte de servire ca să nu înmoaie prea tare\nbulgurul.","alergeni":"gluten (din bulgur)","variante":"Poți prepara salata fără gluten înlocuind bulgurul cu quinoa fiartă, deoarece aceasta oferă o textură similară și este o sursă excelentă de proteine și minerale.","macro":{"calorii_macro":"227","proteine":"9.5 g","carbohidrati":"5 g","fibre":"1.9 g","grasimi":"4.5 g","grasimi_saturate":"0.7 g"}},{"id":"post-103","titlu":"Rulouri de Dovlecel cu Cremă de Nuci","carte":"Rețete de post","carte_scurt":"Post","categorie":"Aperitive și Gustări Fresh","pagina":103,"portii":"4","timp_minute":20,"calorii":143,"ingrediente":["320 g dovlecel feliat","80 g nuci hidratate","5 g usturoi zeamă de lămâie sare, piper"],"descriere":"Un aperitiv rafinat și echilibrat, cu texturi contrastante și gust intens\nde nuci, potrivit pentru mesele ușoare sau platourile festive.","pasi":"1.Feliază dovlecelul subțire pe lungime și gătește feliile pe grill 1–\n2 minute pe fiecare parte, până se înmoaie ușor.\n2.Într-un blender, adaugă nucile hidratate, usturoiul, zeama de\nlămâie, sarea și piperul, apoi mixează până obții o cremă fină.\n3.Lasă compoziția 5–10 minute la frigider pentru a se întări ușor.\n4.Pune câte o linguriță de cremă pe capătul fiecărei felii de\ndovlecel și rulează strâns.\n5.Așază rulourile pe un platou și servește-le reci, ca aperitiv.","sfaturi":"Dacă vrei un gust mai intens, unge feliile de dovlecel cu puțin\nulei de măsline și condimente înainte de a le găti pe grill.\nPentru o cremă mai fină, mixează nucile hidratate cu câteva\nlinguri de apă rece sau lapte vegetal.","alergeni":"nuci","variante":"Dacă ai alergie la nuci, poți înlocui crema de nuci cu aceeași cantitate de semințe de floarea-soarelui hidratate și mixate, care oferă o textură similară și mențin un aport caloric aproape identic.","macro":{"calorii_macro":"143","proteine":"3.9 g","carbohidrati":"4.3 g","fibre":"2 g","grasimi":"13 g","grasimi_saturate":"1.3 g","greutate_portie":"101 g"}},{"id":"post-104","titlu":"Salată de Vinete cu Tahini","carte":"Rețete de post","carte_scurt":"Post","categorie":"Aperitive și Gustări Fresh","pagina":104,"portii":"2","timp_minute":35,"calorii":121,"ingrediente":["375 g vinete coapte","22 g tahini","2 g usturoi zeamă de lămâie sare"],"descriere":"O variantă a clasicei salate de vinete, cremoasă și bogată în\ngrăsimi sănătoase din semințe de susan, ideală pentru tartine sau\nca garnitură.","pasi":"1.Coace vinetele, curăță-le de coajă și lasă-le la scurs cel puțin\n20 de minute.\n2.Toacă-le mărunt cu un cuțit de lemn sau din plastic.\n3.Într-un bol, amestecă vinetele cu tahini, zeama de lămâie și\nusturoiul pisat.\n4.Potrivește gustul cu sare și, dacă dorești, adaugă puțin piper.\n5.Lasă salata la rece 15–20 de minute înainte de servire pentru\nca aromele să se echilibreze.","sfaturi":"Pentru un gust autentic, coace vinetele direct pe flacără sau pe\ngrill, nu doar în cuptor.\nDacă vrei o textură mai cremoasă, adaugă câteva linguri de\niaurt vegetal sau lapte de cocos light.","alergeni":"susan (din tahini)","variante":"Dacă ai alergie la susan, poți înlocui tahiniul cu aceeași cantitate de iaurt grecesc 2% sau cu piure fin de caju hidratat, ambele păstrând textura cremoasă și un aport caloric foarte apropiat.","macro":{"calorii_macro":"121","proteine":"4.7 g","carbohidrati":"9.8 g","fibre":"5.7 g","grasimi":"0 g","grasimi_saturate":"0 g"}},{"id":"post-109","titlu":"Pate de Linte și Ceapă Caramelizată","carte":"Rețete de post","carte_scurt":"Post","categorie":"Tartinabile și Pateuri Vegetale","pagina":109,"portii":"2","timp_minute":35,"calorii":277,"ingrediente":["80 g linte","160 g ceapă","25 g ulei sare, piper, cimbru"],"descriere":"O alternativă vegetală gustoasă și hrănitoare, cu textură fină și\naromă intensă de ceapă dulce, perfectă pentru tartine sau gustări\nrapide.","pasi":"1.Fierbe lintea până devine moale, apoi scurge-o bine.\n2.Taie ceapa mărunt și gătește-o într-o tigaie antiaderentă cu\nulei, la foc mic, până devine aurie și caramelizată.\n3.Pune lintea în blender și adaugă ceapa caramelizată, sare,\npiper și cimbru.\n4.Mixează până obții o pastă omogenă; poți adăuga puțină apă\ndacă este prea densă.\n5.Servește pateul rece, pe pâine integrală sau biscuiți sărați.","sfaturi":"Poți adăuga usturoi la călirea cepei pentru un plus de aromă.\nSe păstrează foarte bine la frigider 2-3 zile, iar la congelator\npână la o lună.","alergeni":"nu conține alergeni majori (atenție la urme de gluten din procesare industrială)","variante":"Dacă ai intoleranță la ceapă, poți înlocui ceapa caramelizată cu 100 g dovleac copt, care oferă dulceață naturală și menține consistența cremoasă a pateului.","macro":{"calorii_macro":"277","proteine":"10.8 g","carbohidrati":"24 g","fibre":"12 g","grasimi":"12.9 g","grasimi_saturate":"1.8 g","greutate_portie":"132 g"}},{"id":"post-110","titlu":"Pastă de Fasole Albă cu Usturoi","carte":"Rețete de post","carte_scurt":"Post","categorie":"Tartinabile și Pateuri Vegetale","pagina":110,"portii":"2","timp_minute":10,"calorii":269,"ingrediente":["120 g fasole","10 g usturoi (≈ 3 căței)","45 g ulei (≈ 3 linguri) sare, piper"],"descriere":"Un preparat cremos și aromat, cu gust intens de usturoi și textură\nfină, perfect pentru combinații simple și savuroase.","pasi":"1.Pune fasolea fiartă, usturoiul, uleiul, sarea și piperul în blender.\n2.Mixează până obții o pastă fină și cremoasă.\n3.Ajustează gustul și servește imediat.","sfaturi":"Poți adăuga zeamă de lămâie pentru un gust mai fresh.\nMerge foarte bine cu verdețuri (pătrunjel sau mărar) tocate fin.\nSe păstrează la frigider 2–3 zile în recipient etanș.","alergeni":"nu conține alergeni majori (atenție la fasole – posibilă contaminare cu gluten în timpul procesării)","variante":"poți folosi năut fiert în loc de fasole pentru o aromă diferită.","macro":{"calorii_macro":"268.8","proteine":"4.5 g","carbohidrati":"12 g","fibre":"2.4 g","grasimi":"22.5 g","grasimi_saturate":"3.1 g","greutate_portie":"88 g"}},{"id":"post-111","titlu":"Pate de Ciuperci","carte":"Rețete de post","carte_scurt":"Post","categorie":"Tartinabile și Pateuri Vegetale","pagina":111,"portii":"2","timp_minute":30,"calorii":135,"ingrediente":["270 g ciuperci","110 g ceapă","20 g ulei de măsline (≈ 1½ linguri) sare, piper"],"descriere":"Un preparat cremos, cu gust intens de ciuperci și note fine de\nceapă, perfect ca aperitiv sau gustare ușoară.","pasi":"1.Curăță ciupercile și taie-le felii subțiri.\n2.Toacă ceapa și călește-o ușor în ulei, la foc mic, până devine\ntranslucidă.\n3.Adaugă ciupercile și gătește-le până se evaporă toată apa.\n4.Transferă amestecul în blender, adaugă sare și piper după gust\nși mixează până obții o pastă omogenă.\n5.Servește pateul rece, pe felii de pâine integrală sau biscuiți\nsărați.","sfaturi":"Poți adăuga usturoi la călirea cepei pentru un plus de aromă.\nSe păstrează foarte bine la frigider 2-3 zile, iar la congelator\npână la o lună.","alergeni":"nu conține alergeni majori (atenție doar la adaosuri dacă se consumă cu pâine)","variante":"Poți elimina ceapa și poți adăuga o jumătate de linguriță de usturoi granulat pentru a păstra aroma, fără a irita digestiv.","macro":{"calorii_macro":"134.7","proteine":"4.6 g","carbohidrati":"4.1 g","fibre":"1.35 g","grasimi":"10 g","grasimi_saturate":"1.4 g","greutate_portie":"200 g"}},{"id":"post-112","titlu":"Cremă de Avocado cu Lămâie și Busuioc","carte":"Rețete de post","carte_scurt":"Post","categorie":"Tartinabile și Pateuri Vegetale","pagina":112,"portii":"2","timp_minute":10,"calorii":327,"ingrediente":["390 g avocado zeamă de lămâie – după gust sare – după gust","7 g frunze de busuioc proaspăt"],"descriere":"O cremă fină și aromată, cu note proaspete de lămâie și busuioc,\nideală pentru preparate rapide și gustoase.","pasi":"1.Pune avocado, zeama de lămâie, sarea și frunzele de busuioc în\nblender.\n2.Mixează până obții o cremă fină și omogenă.","sfaturi":"Merge perfect pe pâine prăjită, lipii, ca sos pentru legume\ncrude sau ca sos lângă chipsuri din tortilla.\nPoți folosi crema și ca bază pentru sandwich-uri sau wraps.","alergeni":"nu conține alergeni majori","variante":"poți folosi coriandru în loc de busuioc pentru o aromă diferită.","macro":{"calorii_macro":"327.2","proteine":"4 g","carbohidrati":"15.9 g","fibre":"11.8 g","grasimi":"29.3 g","grasimi_saturate":"4.2 g","greutate_portie":"198 g"}},{"id":"post-113","titlu":"Pastă de Năut cu Roșii Uscate","carte":"Rețete de post","carte_scurt":"Post","categorie":"Tartinabile și Pateuri Vegetale","pagina":113,"portii":"2","timp_minute":20,"calorii":317,"ingrediente":["350 g năut fiert","18 g roșii uscate","5 g usturoi (≈ 2 căței mici)","25 g ulei de măsline"],"descriere":"O cremă delicioasă și aromată, inspirată din bucătăria\nmediteraneană, bogată în proteine vegetale și grăsimi sănătoase.","pasi":"1.Pune roșiile uscate la înmuiat în apă caldă pentru 10 minute,\napoi scurge-le bine.\n2.Într-un blender, adaugă năutul fiert, roșiile, usturoiul și uleiul de\nmăsline.\n3.Mixează până obții o pastă cremoasă; poți adăuga 1–2 linguri\nde apă pentru o consistență mai fină.\n4.Potrivește gustul cu sare și, opțional, puțin piper sau zeamă de\nlămâie.\n5.Servește rece, pe pâine integrală sau cu legume crude.","sfaturi":"Textură mai fină: Adaugă 1–2 linguri de apă caldă sau zeamă\nde lămâie dacă pasta iese prea groasă.\nMerge foarte bine și cu busuioc sau oregano.","alergeni":"nu conține alergeni majori (atenție la posibile urme de gluten dacă se servește cu pâine)","variante":"Dacă nu tolerezi năutul, îl poți înlocui cu aceeași cantitate de fasole albă fiartă, care păstrează textura și menține aproape identic aportul caloric.","macro":{"calorii_macro":"317","proteine":"0.2 g","carbohidrati":"0.3 g","fibre":"0.1 g","grasimi":"12.5 g","grasimi_saturate":"1.8 g","greutate_portie":"199 g"}},{"id":"post-114","titlu":"Pate de Tofu Afumat și Verdețuri","carte":"Rețete de post","carte_scurt":"Post","categorie":"Tartinabile și Pateuri Vegetale","pagina":114,"portii":"4","timp_minute":10,"calorii":209,"ingrediente":["340 g tofu afumat","45 g ulei (≈ 3 linguri)","8 g pătrunjel proaspăt zeamă de lămâie – după gust sare, piper – după gust"],"descriere":"Un preparat cremos și aromat, cu gust intens de tofu afumat și\nprospețimea verdețurilor, ideal pentru combinații rapide și\nsavuroase.","pasi":"1.Pune tofu afumat, uleiul, zeama de lămâie, pătrunjelul, sarea și\npiperul în blender.\n2.Mixează până obții o cremă fină, tartinabilă.\n3.Ajustează gustul și servește imediat.","sfaturi":"Adaugă 1–2 linguri de apă minerală sau lapte vegetal pentru o\nconsistență mai fină\nPoți adăuga puțin usturoi pisat, ceapă verde sau mărar pentru\nun plus de prospețime.\nMerge foarte bine și ca umplutură pentru rulouri de legume.","alergeni":"soia (din tofu afumat)","variante":"Pentru o variantă fără soia, poți folosi cuburi de ciuperci sotate sau brânză cottage light pentru un plus de cremozitate.","macro":{"calorii_macro":"209","proteine":"11.1 g","carbohidrati":"0.2 g","fibre":"0.05 g","grasimi":"18.1 g","grasimi_saturate":"2.6 g","greutate_portie":"98 g"}},{"id":"post-115","titlu":"Cremă de Nuci și Usturoi Copt","carte":"Rețete de post","carte_scurt":"Post","categorie":"Tartinabile și Pateuri Vegetale","pagina":115,"portii":"4","timp_minute":10,"calorii":489,"ingrediente":["190 g nuci","35 g usturoi copt (≈ 10–12 căței)","80 g ulei (≈ 5–6 linguri) zeamă de lămâie – după gust sare – după gust"],"descriere":"O cremă fină și intens aromată, cu gust bogat de nuci și note dulci\nde usturoi copt, echilibrată cu prospețime de lămâie.","pasi":"1.Pune toate ingredientele în blender.\n2.Mixează până obții o pastă fină și cremoasă.\n3.Potrivește gustul și servește imediat.","sfaturi":"Excelentă ca întinsă pe pâine prăjită, ca sos pentru legume\ncrude sau ca sos tartinabil pentru wraps.\nMerge și ca pastă pentru bruschete, cu roșii uscate și verdețuri\npe deasupra.","alergeni":"nuci","variante":"Pentru o variantă fără nuci, folosește semințe de floarea-soarelui hidratate sau semințe de dovleac hidratate.","macro":{"calorii_macro":"489","proteine":"7.7 g","carbohidrati":"6.2 g","fibre":"2.9 g","grasimi":"50.9 g","grasimi_saturate":"7.6 g","greutate_portie":"76 g"}},{"id":"post-116","titlu":"Pate de Ardei Copți","carte":"Rețete de post","carte_scurt":"Post","categorie":"Tartinabile și Pateuri Vegetale","pagina":116,"portii":"2","timp_minute":25,"calorii":201,"ingrediente":["500 g ardei kapia","24 g semințe de floarea-soarelui","16 g ulei de măsline sare – după gust"],"descriere":"Un aperitiv fin și aromat, bogat în grăsimi sănătoase și proteine\nvegetale, ideal pentru tartine sau gustări rapide între mese.","pasi":"1.Coace ardeii până se înmoaie, apoi curăță-i de coajă și\nsemințe.\n2.Într-un blender, adaugă ardeii copți, semințele de floarea-\nsoarelui și uleiul.\n3.Mixează până obții o pastă fină, adăugând puțină apă dacă\neste nevoie pentru consistență cremoasă.\n4.Potrivește gustul cu sare.\n5.Servește pateul rece, alături de legume crude sau pâine\nintegrală.","sfaturi":"Perfect pe pâine integrală, lipii, crackers sau ca sos pentru\nlegume.\nMerge și ca bază pentru sandwich-uri vegetariene sau wraps.","alergeni":"semințe (floarea-soarelui)","variante":"Poți înlocui semințele de floarea-soarelui cu 20 g nuci caju hidratate, obținând o cremă mai fină și un gust ușor dulceag, ideal pentru tartine vegetale.","macro":{"calorii_macro":"201","proteine":"5 g","carbohidrati":"17.4 g","fibre":"1.05 g","grasimi":"14.2 g","grasimi_saturate":"1.8 g","greutate_portie":"195 g"}},{"id":"post-117","titlu":"Cremă de Mazăre Verde cu Mentă","carte":"Rețete de post","carte_scurt":"Post","categorie":"Tartinabile și Pateuri Vegetale","pagina":117,"portii":"2","timp_minute":10,"calorii":360,"ingrediente":["150 g mazăre","25 g ulei (≈ 1½–2 linguri) sare – după gust","9 g frunze de mentă proaspătă"],"descriere":"O cremă fină și răcoritoare, cu gust delicat de mazăre și note\nproaspete de mentă.","pasi":"1.Fierbe mazărea până devine moale, apoi scurge-o.\n2.Pune mazărea în blender împreună cu uleiul, sarea și frunzele de\nmentă.\n3.Mixează până obții o cremă fină.","sfaturi":"Completează cu busuioc sau pătrunjel pentru un plus de\nprospețime.\nMerge foarte bine și cu usturoi copt sau ceapă verde.\nSe poate transforma într-un sos pentru paste adăugând 1–2\nlinguri de apă de gătit a mazărei.","alergeni":"nu conține alergeni majori (atenție la mazăre – posibilă contaminare cu gluten în timpul procesării)","variante":"poți folosi edamame fiert în loc de mazăre pentru un plus de proteine.","macro":{"calorii_macro":"360","proteine":"18.6 g","carbohidrati":"43 g","fibre":"34 g","grasimi":"15.8 g","grasimi_saturate":"2.2 g","greutate_portie":"92 g"}},{"id":"post-118","titlu":"Pate de Sfeclă Rosie și Hrean","carte":"Rețete de post","carte_scurt":"Post","categorie":"Tartinabile și Pateuri Vegetale","pagina":118,"portii":"2","timp_minute":60,"calorii":157,"ingrediente":["375 g sfeclă","6 g hrean ras","18 g ulei sare – după gust"],"descriere":"Un preparat intens colorat și aromat, cu echilibru perfect între\ndulceața sfeclei și iuțeala hreanului.","pasi":"1.Coace sfecla întreagă (în folie, la 190°C, 40–50 min) sau\nfierbe-o până devine moale.\n2.Curăță sfecla și taie-o bucăți.\n3.Pune sfecla în blender împreună cu hreanul, uleiul și sarea.\n4.Mixează până obții o pastă fină.","sfaturi":"Excelent ca tartinabil pe pâine integrală, lipii sau crackers.\nMerge și ca sos pentru legume crude (morcov, țelină,\ncastravete).\nPoate fi folosit ca bază pentru sandwich-uri vegetariene.","alergeni":"nu conține alergeni majori","variante":"poți folosi pastă de morcov copt în loc de sfeclă pentru o aromă mai dulce.","macro":{"calorii_macro":"157","proteine":"0 g","carbohidrati":"0 g","fibre":"0 g","grasimi":"9 g","grasimi_saturate":"1.3 g","greutate_portie":"177 g"}},{"id":"post-120","titlu":"Salată cu Fasole și Pâine Prăjită","carte":"Rețete de post","carte_scurt":"Post","categorie":"Salate Consistente","pagina":120,"portii":"1","timp_minute":10,"calorii":154,"ingrediente":["22 g fasole boabe","20 g avocado","25 g roșii","30 g castravete","20 g ceapă","3 g ulei de măsline","18 g salată verde","22 g pâine integrală"],"descriere":"O salată simplă și consistentă, cu texturi echilibrate între\ncremozitatea avocado-ului, prospețimea legumelor și crocanța\npâinii prăjite.","pasi":"1.Taie legumele cubulețe (roșia, castravetele, ceapa și avocado).\n2.Amestecă-le într-un bol cu fasolea fiartă și salata verde.\n3.Adaugă uleiul de măsline și asezonează după gust (sare, piper,\nzeamă de lămâie).\n4.Servește alături de pâinea integrală prăjită","sfaturi":"Folosește fasole boabe deja fiartă din conservă pentru o\nvariantă rapidă (clătește-o bine ca să elimini excesul de sare).\nPentru o digestie mai ușoară, adaugă puțină zeamă de lămâie\nsau oțet de mere – ajută și la absorbția mineralelor din fasole.","alergeni":"gluten (din pâinea integrală)","variante":"Pentru o variantă fără gluten, folosește pâine fără gluten sau crutoane din mămăligă coaptă.","macro":{"calorii_macro":"154","proteine":"5 g","carbohidrati":"16.3 g","fibre":"2.7 g","grasimi":"6.7 g","grasimi_saturate":"1 g","greutate_portie":"260 g"}},{"id":"post-121","titlu":"Salată Proteică cu Tofu și Legume Crocante","carte":"Rețete de post","carte_scurt":"Post","categorie":"Salate Consistente","pagina":121,"portii":"1","timp_minute":10,"calorii":301,"ingrediente":["20 g mix salată verde","70 g tofu afumat","40 g năut (scurs)","25 g ardei gras","25 g castraveți","15 g ceapă roșie","5 g ulei de măsline","2 g zeamă de lămâie"],"descriere":"Un preparat fresh și sățios, cu contrast între tofu-ul ușor rumenit,\nlegumele crocante și dressingul simplu de lămâie.","pasi":"1.Taie tofu cubulețe și rumenește-l 2–3 minute într-o tigaie\nantiaderentă (opțional).\n2.Spală și taie legumele (ardeiul, castraveții, ceapa).\n3.Amestecă toate ingredientele într-un bol: salata verde,\nlegumele, năutul și tofu.\n4.Stropește cu ulei de măsline și zeamă de lămâie.\n5.Condimentează cu sare, piper și puțin oregano sau pătrunjel\nproaspăt.","sfaturi":"Păstrează salata verde și castraveții reci și adaugă-le doar\nînainte de servire, ca să rămână crocante.\nPoți pregăti ingredientele separat (tofu, năut, legume) și le\ncombini în 2 minute chiar înainte de masă.","alergeni":"soia (din tofu afumat), leguminoase (din năut)","variante":"Pentru o variantă fără soia, folosește cuburi de brânză cottage light sau ciuperci sotate; pentru o variantă fără năut, folosește fasole albă sau linte fiartă.","macro":{"calorii_macro":"301","proteine":"9.7 g","carbohidrati":"3.4 g","fibre":"0.6 g","grasimi":"10.6 g","grasimi_saturate":"1.5 g","greutate_portie":"202 g"}},{"id":"post-122","titlu":"Salată Proteică","carte":"Rețete de post","carte_scurt":"Post","categorie":"Salate Consistente","pagina":122,"portii":"1","timp_minute":15,"calorii":332,"ingrediente":["60 g paste integrale","40 g șuncă vegană","30 g ardei gras","30 g castraveți","8 g ceapă roșie","16 g ridiche","8 g ulei de măsline","4 g zeamă de lămâie"],"descriere":"Un preparat echilibrat și sățios, cu texturi proaspete și aport ridicat\nde proteine, ideal pentru combinații rapide și gustoase.","pasi":"1.Fierbe pastele conform instrucțiunilor de pe ambalaj (aprox. 7–\n9 minute), apoi scurge-le și lasă-le la răcit.\n2.Taie șunca vegană în cubulețe și legumele (ardei, castravete,\nceapă roșie, ridiche) felii subțiri.\n3.Amestecă pastele răcite cu șunca vegană și legumele crocante.\n4.Adaugă uleiul de măsline și zeama de lămâie, amestecând ușor\npentru a omogeniza.\n5.Servește imediat, ca salată fresh și sățioasă.","sfaturi":"După fierbere, clătește pastele cu apă rece ca să oprești\ngătirea și să rămână ferme.\nIngredientele se pot pregăti cu o zi înainte, dar e mai bine să\nadaugi dressingul abia înainte de servire, ca să rămână\ncrocantă.","alergeni":"gluten (din paste, dacă nu sunt fără gluten), soia (din șunca vegană)","variante":"Pentru o variantă fără gluten, folosește paste proteice certificate GF; pentru o variantă fără soia, folosește felii de ciuperci sotate.","macro":{"calorii_macro":"332","proteine":"14 g","carbohidrati":"42.8 g","fibre":"3.7 g","grasimi":"10.4 g","grasimi_saturate":"1.6 g"}},{"id":"post-123","titlu":"Bol Salată Buddha cu Năut Crocant","carte":"Rețete de post","carte_scurt":"Post","categorie":"Salate Consistente","pagina":123,"portii":"1","timp_minute":30,"calorii":342,"ingrediente":["90 g năut fiert","45 g quinoa fiartă","20 g frunze de spanac proaspăt","40 g morcov","35 g avocado","15 g sos tahini cu lămâie"],"descriere":"Un bol echilibrat și plin de culoare, cu texturi contrastante și arome\nfine, ideal pentru un preparat hrănitor și fresh.","pasi":"1.Coace năutul fiert 20 min la 200°C cu puțin ulei și condimente.\n2.Pune în bol quinoa, spanacul, morcovul ras și avocado feliat.\n3.Adaugă năutul crocant și toarnă sosul de tahini-lămâie.","sfaturi":"Pentru un plus de aromă, adaugă chimion sau boia afumată\npeste năut înainte de coacere.\nPoți adăuga roșii cherry sau castraveți pentru extra prospețime.\nPentru un plus proteic, completează cu tofu la grătar.","alergeni":"susan (din sosul tahini)","variante":"Pentru o variantă fără susan, folosește un dressing pe bază de iaurt vegetal și lămâie sau piure de caju hidratat.","macro":{"calorii_macro":"342","proteine":"7.1 g","carbohidrati":"17.4 g","fibre":"3.6 g","grasimi":"6.2 g","grasimi_saturate":"1.1 g"}},{"id":"post-124","titlu":"Salată de Cartofi cu Ceapă Verde","carte":"Rețete de post","carte_scurt":"Post","categorie":"Salate Consistente","pagina":124,"portii":"1","timp_minute":20,"calorii":232,"ingrediente":["170 g cartofi fierți","10 g ceapă verde","10 g muștar","9 g ulei sare – după gust"],"descriere":"O salată sățioasă și plină de aromă, potrivită ca garnitură sau\nmasă ușoară, cu gust echilibrat între dulceața cartofilor și\naciditatea muștarului.","pasi":"1.Fierbe cartofii în coajă până devin moi, apoi curăță-i și taie-i\ncuburi mari.\n2.Taie ceapa verde rondele subțiri și adaug-o peste cartofi.\n3.Într-un bol mic, amestecă muștarul cu uleiul, sarea și piperul\npână se formează un dressing cremos.\n4.Toarnă dressingul peste cartofi și amestecă ușor, fără să\nzdrobești bucățile.\n5.Lasă salata la frigider 15–20 de minute pentru ca aromele să se\ncombine.","sfaturi":"Poți adăuga pătrunjel sau mărar pentru extra prospețime.\nDacă vrei o variantă mai light, redu uleiul la 1 lingură.","alergeni":"muștar","variante":"Dacă nu tolerezi muștarul, îl poți înlocui cu aceeași cantitate de iaurt grecesc 2% amestecat cu puțină zeamă de lămâie, obținând un dressing cremos cu aport caloric foarte apropiat de varianta originală.","macro":{"calorii_macro":"232","proteine":"2.3 g","carbohidrati":"34.4 g","fibre":"3.4 g","grasimi":"9.5 g","grasimi_saturate":"1.4 g"}},{"id":"post-125","titlu":"Bol cu Orez Integral și Legume Asiatice","carte":"Rețete de post","carte_scurt":"Post","categorie":"Salate Consistente","pagina":125,"portii":"1","timp_minute":15,"calorii":192,"ingrediente":["100 g orez brun fiert","50 g broccoli","30 g morcov","15 g ardei gras","5 g semințe de susan","5 g sos de soia"],"descriere":"Un bol aromat și echilibrat, cu legume ușor sotate și note asiatice\ndiscrete, perfect pentru o masă rapidă și consistentă.","pasi":"1.Sotează legumele în puțină apă sau ulei 5–6 minute.\n2.Adaugă orezul fiert și amestecă ușor.\n3.Stropește cu sos de soia și presară semințe de susan.","sfaturi":"Poți adăuga tofu cuburi pentru un plus proteic.\nMerge bine și cu ghimbir ras sau usturoi pentru aromă intensă.\nPentru o variantă mai light, redu semințele de susan la jumătate.","alergeni":"soia (din sosul de soia), susan (din semințele de susan)","variante":"Pentru o variantă fără soia și gluten, folosește sos coconut aminos; pentru o variantă fără susan, folosește semințe de floarea-soarelui mărunțite.","macro":{"calorii_macro":"192","proteine":"4.8 g","carbohidrati":"29.7 g","fibre":"0.8 g","grasimi":"3.6 g","grasimi_saturate":"0.6 g"}},{"id":"post-126","titlu":"Salată Mediteraneană cu Tofu","carte":"Rețete de post","carte_scurt":"Post","categorie":"Salate Consistente","pagina":126,"portii":"1","timp_minute":15,"calorii":154,"ingrediente":["50 g tofu ferm","70 g roșii","40 g castravete","17 g măsline","17 g ceapă roșie","5 g ulei de măsline oregano uscat – după gust"],"descriere":"Un preparat fresh și aromat, cu influențe mediteraneene, în care\ntofu-ul ușor rumenit completează perfect prospețimea legumelor.","pasi":"1.Taie tofu în cuburi și prăjește-l ușor în tigaie antiaderentă.\n2.Taie legumele cuburi și pune-le într-un bol.\n3.Adaugă tofu și asezonează cu ulei și oregano.","sfaturi":"Pentru un gust mai autentic, marinează tofu în zeamă de lămâie\nși oregano înainte de a-l prăji.\nPoți adăuga ardei gras, rucola sau pătrunjel pentru extra\nprospețime.\nPentru un plus proteic, combină cu năut sau linte fiartă.","alergeni":"soia (din tofu)","variante":"Pentru o variantă fără soia, folosește brânză cottage light sau cuburi de caju hidratat pentru o variantă vegană.","macro":{"calorii_macro":"154","proteine":"6.7 g","carbohidrati":"5.3 g","fibre":"1.4 g","grasimi":"10.7 g","grasimi_saturate":"1.8 g"}},{"id":"post-127","titlu":"Bol Mexican cu Fasole și Porumb","carte":"Rețete de post","carte_scurt":"Post","categorie":"Salate Consistente","pagina":127,"portii":"1","timp_minute":10,"calorii":157,"ingrediente":["35 g fasole roșie","45 g porumb dulce","35 g avocado","55 g roșii","20 g ceapă roșie","7 g coriandru verde","7 g suc de lime"],"descriere":"Un preparat fresh și plin de culoare, cu arome vibrante și texturi\ncontrastante, inspirat din bucătăria mexicană.","pasi":"1.Taie roșiile și ceapa cubulețe.\n2.Amestecă fasolea, porumbul, avocado și legumele.\n3.Asezonează cu coriandru și zeamă de lime.","sfaturi":"Pentru un gust mai autentic, marinează tofu în zeamă de lămâie\nși oregano înainte de a-l prăji.\nPoți adăuga ardei gras, rucola sau pătrunjel pentru extra\nprospețime.\nPentru un plus proteic, combină cu năut sau linte fiartă.","alergeni":"soia (din tofu)","variante":"Pentru o variantă fără soia, folosește brânză cottage light sau cuburi de caju hidratat pentru o variantă vegană.","macro":{"calorii_macro":"157","proteine":"5.1 g","carbohidrati":"20.8 g","fibre":"2.9 g","grasimi":"6 g","grasimi_saturate":"0.9 g"}},{"id":"post-128","titlu":"Salată de Linte cu Legume și Pătrunjel","carte":"Rețete de post","carte_scurt":"Post","categorie":"Salate Consistente","pagina":128,"portii":"1","timp_minute":20,"calorii":174,"ingrediente":["95 g linte fiartă","25 g morcov ras","45 g ardei gras","18 g ceapă roșie","10 g pătrunjel","4 g ulei","3 g suc de lămâie"],"descriere":"Un preparat proaspăt și echilibrat, cu texturi ușoare și arome verzi,\nîn care lintea se îmbină perfect cu legumele și pătrunjelul.","pasi":"1.Taie legumele mărunt și amestecă-le cu lintea fiartă.\n2.Adaugă dressingul și pătrunjelul tocat.\n3.Lasă la frigider 10 minute înainte de servire.","sfaturi":"Lintea verde sau neagră își păstrează mai bine textura decât\ncea roșie pentru salate.\nPoți adăuga roșii cherry pentru extra prospețime.\nMerge foarte bine și cu semințe de dovleac prăjite pentru un\nplus de crocant.\nSe păstrează la frigider 24 de ore într-un recipient închis.","alergeni":"nu conține alergeni majori","variante":"poți folosi năut fiert în loc de linte pentru o alternativă cu textură diferită.","macro":{"calorii_macro":"174","proteine":"9.7 g","carbohidrati":"24.9 g","fibre":"1.2 g","grasimi":"4.4 g","grasimi_saturate":"0.6 g"}},{"id":"post-129","titlu":"Bol cu Paste Integrale și Pesto de Busuioc","carte":"Rețete de post","carte_scurt":"Post","categorie":"Salate Consistente","pagina":129,"portii":"1","timp_minute":15,"calorii":237,"ingrediente":["20 g paste integrale","43 g pesto vegan","90 g roșii cherry","27 g rucola"],"descriere":"Un preparat aromat și echilibrat, cu gust intens de busuioc,\nprospețimea roșiilor cherry și nota ușor amăruie a rucolei.","pasi":"1.Fierbe pastele conform instrucțiunilor.\n2.Amestecă-le cu pesto, roșii tăiate și rucola.\n3.Servește imediat.","sfaturi":"Poți adăuga și drojdie inactivă pentru un gust asemănător cu\nparmezanul.\nPoți adăuga semințe de pin sau nuci prăjite pentru un plus de\ntextură.\nDacă dorești mai multă proteina, adaugă cuburi de tofu sau\nnăut fiert.","alergeni":"gluten (din pastele integrale), nuci (din pesto)","variante":"Pentru o variantă fără gluten, folosește paste fără gluten; pentru o variantă fără nuci, folosește pesto din semințe de floarea-soarelui sau pesto de pătrunjel fără semințe.","macro":{"calorii_macro":"237","proteine":"2.4 g","carbohidrati":"13.4 g","fibre":"1.2 g","grasimi":"0.4 g","grasimi_saturate":"0.1 g"}},{"id":"post-130","titlu":"Salată de Couscous cu Legume Coapte","carte":"Rețete de post","carte_scurt":"Post","categorie":"Salate Consistente","pagina":130,"portii":"1","timp_minute":30,"calorii":287,"ingrediente":["40 g couscous gătit","95 g dovlecel","75 g ardei gras","125 g vânătă","9 g ulei de măsline sare, piper"],"descriere":"Un preparat echilibrat și aromat, în care legumele coapte se\nîmbină perfect cu textura ușoară a couscous-ului.","pasi":"1.Hidratează couscous-ul conform instrucțiunilor.\n2.Coace legumele tăiate cuburi 20 min la 200°C.\n3.Amestecă couscous-ul cu legumele și asezonează.","sfaturi":"Adaugă suc de lămâie și pătrunjel tocat pentru prospețime.\nPoți adăuga năut fiert pentru un plus de proteine.\nSe poate păstra la frigider 2 zile, într-un recipient închis.","alergeni":"gluten (din couscous)","variante":"Pentru o variantă fără gluten, folosește hrișcă fiartă sau orez brun în loc de couscous.","macro":{"calorii_macro":"287","proteine":"7.8 g","carbohidrati":"41.2 g","fibre":"4.7 g","grasimi":"9.4 g","grasimi_saturate":"1.3 g"}},{"id":"post-131","titlu":"Bol cu Hriscă și Ciuperci","carte":"Rețete de post","carte_scurt":"Post","categorie":"Salate Consistente","pagina":131,"portii":"1","timp_minute":15,"calorii":356,"ingrediente":["58 g hrișcă","190 g ciuperci champignon","50 g spanac proaspăt","3 g usturoi","12 g ulei de măsline"],"descriere":"Un preparat simplu și reconfortant, cu arome calde de ciuperci\nsotate, echilibrate de prospețimea spanacului și textura hrănitoare\na hriștii.","pasi":"1.Trage ciupercile la tigaie cu usturoiul.\n2.Adaugă spanacul pentru 1 minut, până se înmoaie.\n3.Combină cu hrișca fiartă și asezonează.","sfaturi":"Poți adăuga sos de soia pentru un plus de savoare umami.\nMerge bine cu pătrunjel proaspăt sau semințe de dovleac\npresărate deasupra.\nSe poate păstra la frigider 2 zile într-un recipient închis.","alergeni":"fără alergeni majori (în varianta clasică)","variante":"poți folosi orez brun fiert în loc de hrișcă pentru o textură diferită","macro":{"calorii_macro":"355.8","proteine":"6.9 g","carbohidrati":"7.2 g","fibre":"2.9 g","grasimi":"12 g","grasimi_saturate":"1.7 g"}},{"id":"post-132","titlu":"Salată de Sfeclă Rosie, Portocală și Nuci","carte":"Rețete de post","carte_scurt":"Post","categorie":"Salate Consistente","pagina":132,"portii":"1","timp_minute":10,"calorii":378,"ingrediente":["220 g sfeclă","165 g portocală","25 g nuci","40 g mix frunze verzi","4 g ulei de măsline","10 ml zeamă de lămâie"],"descriere":"Un preparat proaspăt și elegant, cu contrast plăcut între dulceața\nsfeclei, prospețimea portocalei și textura crocantă a nucilor.","pasi":"1.Taie sfecla cuburi și portocala felii.\n2.Amestecă-le cu frunzele și nucile.\n3.Adaugă dressingul de citrice și servește rece.","sfaturi":"Adaugă câteva semințe de rodie pentru un plus de culoare și\nantioxidanți\nNucile pot fi înlocuite cu migdale sau alune de pădure.\nSe servește cel mai bine rece, ca salată de prânz sau cină\nușoară.","alergeni":"nuci","variante":"Pentru o variantă fără nuci, folosește semințe de floarea-soarelui sau semințe de dovleac prăjite.","macro":{"calorii_macro":"378.3","proteine":"4.2 g","carbohidrati":"23 g","fibre":"5.6 g","grasimi":"20.3 g","grasimi_saturate":"2 g"}},{"id":"post-134","titlu":"Supă Cremă de Conopidă cu Orez","carte":"Rețete de post","carte_scurt":"Post","categorie":"Supe și Ciorbe","pagina":134,"portii":"1","timp_minute":35,"calorii":78,"ingrediente":["75 g conopidă","8 g orez alb","13 g ceapă","100 g supă limpede de legume","2 g ulei de măsline","0,5 g pătrunjel verde sare, piper – după gus"],"descriere":"O supă fină și reconfortantă, bogată în fibre și vitamine, ideală\npentru o masă ușoară și echilibrată.","pasi":"1.Curăță conopida și taie-o în buchețele mici. Toacă ceapa\nmărunt.\n2.Călește ceapa în uleiul de măsline 2–3 minute, până devine\ntranslucidă.\n3.Adaugă conopida, orezul și supa limpede de legume.\n4.Fierbe la foc mic 20–25 de minute, până ce legumele și orezul\nsunt moi.\n5.Pasează totul cu blenderul până obții o cremă omogenă.\n6.Condimentează cu sare și piper după gust și presară pătrunjel\nverde la final.","sfaturi":"Pentru o textură mai cremoasă, poți adăuga 1 lingură de lapte\nvegetal (ex. migdale, soia).\nSe servește cu crutoane din pâine integrală sau semințe\npresărate.\nPoți înlocui orezul cu quinoa pentru un plus de proteine.","alergeni":"niciun alergen major, dar dacă se adaugă crutoane, pot conține gluten","variante":"Dacă ai alergie la țelină din supa concentrată, o poți înlocui cu aceeași cantitate de apă caldă și un praf de sare, menținând același aport caloric și o aromă blândă, potrivită pentru supă cremă.","macro":{"calorii_macro":"78","proteine":"1.4 g","carbohidrati":"7.6 g","fibre":"0.1 g","grasimi":"2.1 g","grasimi_saturate":"0.3 g"}},{"id":"post-135","titlu":"Supă Cremă de Broccoli și Mazăre","carte":"Rețete de post","carte_scurt":"Post","categorie":"Supe și Ciorbe","pagina":135,"portii":"1","timp_minute":30,"calorii":73,"ingrediente":["40 g broccoli","30 g mazăre verde","20 g cartofi cruzi","10 g ceapă","95 g supă limpede de legume (sau apă)","1 g ulei de măsline sare, piper – după gust"],"descriere":"O supă cremă fină și hrănitoare, cu gust delicat de broccoli și\ndulceață naturală de mazăre, perfect echilibrată și reconfortantă.","pasi":"1.Taie ceapa, cartofii și broccoli bucăți mici.\n2.Călește ceapa 2–3 min în ulei.\n3.Adaugă broccoli, mazărea și cartofii, fierbe 20 min în supa de\nlegume.\n4.Blenduiește până devine cremă fină.\n5.Asezonează și servește.","sfaturi":"Adaugă câteva frunze de spanac la final pentru un plus de\nculoare și fier.\nServește cu semințe de dovleac sau crutoane integrale pentru\ntextură.","alergeni":"fără alergeni majori (posibil gluten dacă se adaugă crutoane)","variante":"poți folosi edamame fierte în loc de mazăre pentru un plus de proteine.","macro":{"calorii_macro":"72.9","proteine":"2.6 g","carbohidrati":"8 g","fibre":"1.4 g","grasimi":"1 g","grasimi_saturate":"0.15 g"}},{"id":"post-136","titlu":"Supă Cremă de Legume","carte":"Rețete de post","carte_scurt":"Post","categorie":"Supe și Ciorbe","pagina":136,"portii":"1","timp_minute":40,"calorii":109,"ingrediente":["35 g morcovi","25 g dovlecei","35 g cartofi roșii","12 g ceapă","1 g usturoi","60 g apă","2 g ulei de măsline","30 g tofu afumat (crutoane)","1 g făină integrală (crutoane)"],"descriere":"O supă densă și plină de gust, cu o combinație perfectă între\nlegume dulci și crutoane proteice de tofu rumenit, ideală pentru o\nmasă echilibrată și hrănitoare.","pasi":"1.Curăță legumele și taie-le cuburi: morcovii, dovleceii, cartofii și\nceapa.\n2.Călește ceapa și usturoiul în 5 ml ulei de măsline timp de 2–3\nminute.\n3.Adaugă legumele tăiate și 250 ml apă. Fierbe la foc mic 20–25\nde minute, până devin moi.\n4.Pasează cu blenderul până obții o cremă omogenă.\nCondimentează cu sare și piper.\n5.Separat, taie tofu-ul cuburi mici, trece-l prin făină integrală și\nprăjește-l în restul de ulei (5 ml) până devine crocant.\n6.Servește supa caldă, cu crutoanele de tofu presărate deasupra.","sfaturi":"Cimbru, busuioc uscat sau un praf de nucșoară merg perfect cu\naceastă combinație.\nSupa rezistă 2–3 zile la frigider și se poate încălzi ușor la foc\nmic, iar crutoanele e bine să le adaugi doar la servire ca să\nrămână crocante.","alergeni":"soia, gluten (din făină)","variante":"Dacă ai alergie la soia, poți înlocui tofu cu aceeași cantitate de ciuperci rumenite, iar dacă ești intolerant la gluten, poți folosi făină fără gluten pentru crutoane.","macro":{"calorii_macro":"109","proteine":"5.1 g","carbohidrati":"9.8 g","fibre":"1.7 g","grasimi":"4.5 g","grasimi_saturate":"0.6 g"}},{"id":"post-137","titlu":"Supă Cremă de Roșii cu Busuioc","carte":"Rețete de post","carte_scurt":"Post","categorie":"Supe și Ciorbe","pagina":137,"portii":"1","timp_minute":35,"calorii":73,"ingrediente":["195 g roșii bine coapte","30 g ceapă","12 g morcov","2 g ulei de măsline sare – după gust","1 g busuioc proaspăt","200 ml apă"],"descriere":"O rețetă mediteraneană clasică, ușoară și aromată, cu un gust\nproaspăt de roșii coapte și busuioc, perfectă pentru o masă de\nvară echilibrată.","pasi":"1.Taie roșiile, ceapa și morcovul bucăți mari.\n2.Călește ceapa și morcovul în uleiul de măsline 3–4 minute, până\ndevin ușor aurii.\n3.Adaugă roșiile și 200 ml apă caldă, apoi fierbe la foc mic 20–\n25 de minute, până legumele se înmoaie complet.\n4.Pasează totul cu blenderul până obții o textură fină.\n5.Condimentează cu sare după gust și adaugă frunzele de\nbusuioc proaspăt.\n6.Servește supa caldă sau ușor răcită, cu crutoane sau o linguriță\nde iaurt vegetal.","sfaturi":"Pentru un gust mai bogat, poți coace roșiile în cuptor înainte de\na le adăuga în supă.\nPoți adăuga 1-2 căței de usturoi copți pentru un plus de aromă.","alergeni":"fără alergeni majori (posibil gluten dacă se servește cu pâine)","variante":"Dacă ai sensibilitate la ceapă, o poți înlocui cu aceeași cantitate de praz sotat sau ceapă verde, care oferă o aromă mai blândă și păstrează aportul caloric aproape identic.","macro":{"calorii_macro":"73","proteine":"0.4 g","carbohidrati":"7 g","fibre":"2.3 g","grasimi":"2 g","grasimi_saturate":"0.3 g"}},{"id":"post-138","titlu":"Ciorbă de Legume cu Borș","carte":"Rețete de post","carte_scurt":"Post","cate
